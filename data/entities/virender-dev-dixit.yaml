cases:
  - id: dixit-rohini-ashram-hc-oversight-2017
    title_en: In re Adhyatmik Vishwa Vidyalaya ashram, Rohini (Delhi High Court supervisory proceedings)
    title_hi: अध्यात्मिक विश्व विद्यालय आश्रम, रोहिणी के संबंध में (दिल्ली उच्च न्यायालय की निगरानी कार्यवाही)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: Delhi High Court
    case_number: W.P.(C) 11382/2017 and connected matters, including W.P.(C) 2004/2020 and W.P.(CRL) 221/2024
    filed_year: 2017
    case_type: inquiry
    statutes: []
    status: ongoing High Court supervision of the ashram; fresh inquiry ordered August 2026
    tier: regulatory_action
    verdict_date:
    sentence_or_remedy:
    appeal_status: >
      An SLP concerning AVV's continued use of "Vishwa Vidyalaya"/"University" in its name was pending before the Supreme Court as of the High Court's order of 31 May 2023 (per the 24 January 2024 order); W.P.(C) 2004/2020, seeking release of women from the Rohini ashram, remained pending as of that order.
    summary_en: >
      Petitions and a suo motu inquiry before the Delhi High Court into conditions at AVV's Rohini ashram and its network of ashrams. After a High Court-appointed committee visited the ashram on 19 December 2017 and found around 200 women and girls in confinement, the Court on 20 December 2017 ordered a CBI investigation and, on 8 February 2018, barred AVV and Dixit from using "Vishwa Vidyalaya" or "University" in the organisation's name. The Court has continued to supervise the ashram's affairs since, including through a court-appointed welfare committee, and its January 2024 order in a related habeas corpus petition recorded that AVV was still using the barred name in contempt of the 2018 order. In August 2026, after CBI counsel again told the Court that Dixit was dead, the Court ordered the registration of a missing-person case over an ashram inmate and said the ashrams' affairs "need to undergo an inquiry".
    summary_hi: >
      एवीवी के रोहिणी आश्रम और उसके आश्रमों के नेटवर्क की स्थितियों को लेकर दिल्ली उच्च न्यायालय के समक्ष याचिकाएँ और स्वतः संज्ञान जाँच। उच्च न्यायालय द्वारा नियुक्त एक समिति के 19 दिसंबर 2017 को आश्रम के दौरे और वहाँ लगभग 200 महिलाओं व लड़कियों के बंधक मिलने के बाद न्यायालय ने 20 दिसंबर 2017 को सीबीआई जाँच का आदेश दिया और 8 फरवरी 2018 को एवीवी व दीक्षित को संगठन के नाम में "विश्व विद्यालय" या "यूनिवर्सिटी" शब्द के प्रयोग से रोक दिया। न्यायालय तब से एक न्यायालय-नियुक्त कल्याण समिति सहित विभिन्न माध्यमों से आश्रम के कामकाज की निगरानी करता रहा है, और जनवरी 2024 के एक संबंधित बंदी प्रत्यक्षीकरण याचिका के आदेश में दर्ज है कि एवीवी 2018 के आदेश की अवमानना करते हुए अब भी प्रतिबंधित नाम का प्रयोग कर रही थी। अगस्त 2026 में, सीबीआई के वकील द्वारा फिर से दीक्षित के मृत होने की सूचना दिए जाने पर, न्यायालय ने एक आश्रम निवासी के लापता होने का मामला दर्ज कराने का आदेश दिया और कहा कि आश्रमों के कामकाज की "जाँच होनी चाहिए"।
    source_ids: [ v-dixit-src-01, v-dixit-src-05, v-dixit-src-06, v-dixit-src-10 ]

  - id: dixit-cbi-rape-criminal-intimidation-2018
    title_en: CBI v. Virender Dev Dixit (Rohini ashram; rape and criminal intimidation)
    title_hi: सीबीआई बनाम वीरेंद्र देव दीक्षित (रोहिणी आश्रम; बलात्कार व आपराधिक धमकी)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: Rouse Avenue special court, Delhi (trial); Delhi High Court (supervisory)
    case_number: >
      Delhi Police FIRs at Vijay Vihar PS, Rohini, re-registered by CBI, January 2018; chargesheet before the Rouse Avenue special court, 13 June 2019
    filed_year: 2017
    case_type: criminal
    statutes: [ IPC 376(2)(n), IPC 109, IPC 506 ]
    status: >
      proclaimed offender; absconding since 2017; chargesheeted in 2019; CBI reported his death to the trial court in 2025 and will seek abatement
    tier: wanted
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable; trial never reached verdict, CBI seeking abatement following his reported death
    summary_en: >
      Following the Delhi High Court's order of 20 December 2017, the CBI in January 2018 re-registered three Delhi Police FIRs lodged at Vijay Vihar police station: two against Dixit for rape and criminal intimidation, and one against unidentified persons for obstructing the 19 December 2017 committee visit. Dixit went absconding; the CBI obtained Look Out Circulars (22 January 2018, 22 February 2019), an Interpol Blue Notice (26 March 2018) and announced a Rs 5 lakh reward, and he was declared a proclaimed offender. The CBI filed a chargesheet on 13 June 2019 under IPC 376(2)(n), alleging repeated rape of a minor in 1999 at his ashrams in Kampil, Uttar Pradesh, and Vijay Vihar, Delhi. The Delhi High Court continued to press the CBI to pursue him, including abroad (2023) and through freezing his bank accounts (2023). In September 2025 the CBI told a special court that its Hyderabad unit had learned Dixit died in 2023, aged in his early eighties, and that it would seek abatement of the trial.
    summary_hi: >
      दिल्ली उच्च न्यायालय के 20 दिसंबर 2017 के आदेश के बाद, सीबीआई ने जनवरी 2018 में विजय विहार थाने में दर्ज दिल्ली पुलिस की तीन एफआईआर पुनः दर्ज कीं: दीक्षित के विरुद्ध बलात्कार व आपराधिक धमकी की दो, और 19 दिसंबर 2017 की समिति के दौरे में बाधा डालने के लिए अज्ञात व्यक्तियों के विरुद्ध एक। दीक्षित फरार हो गए; सीबीआई ने लुक-आउट सर्कुलर (22 जनवरी 2018, 22 फरवरी 2019), इंटरपोल ब्लू नोटिस (26 मार्च 2018) जारी करवाए और 5 लाख रुपये का इनाम घोषित किया, तथा उन्हें उद्घोषित अपराधी घोषित किया गया। सीबीआई ने 13 जून 2019 को आईपीसी 376(2)(एन) के तहत आरोप-पत्र दाखिल किया, जिसमें आरोप है कि 1999 में उत्तर प्रदेश के कंपिल और दिल्ली के विजय विहार स्थित आश्रमों में एक नाबालिग के साथ बार-बार बलात्कार किया गया। दिल्ली उच्च न्यायालय सीबीआई पर उन्हें पकड़ने के लिए, विदेश में भी (2023) और उनके बैंक खाते जब्त कराकर (2023), दबाव डालता रहा। सितंबर 2025 में सीबीआई ने एक विशेष अदालत को बताया कि उसकी हैदराबाद इकाई को पता चला है कि दीक्षित की 2023 में लगभग 82 वर्ष की आयु में मृत्यु हो गई थी, और वह विचारण की समाप्ति की माँग करेगी।
    source_ids: [ v-dixit-src-01, v-dixit-src-02, v-dixit-src-03, v-dixit-src-04, v-dixit-src-07, v-dixit-src-10 ]

claims:
  - id: v-dixit-claim-01
    case_id: dixit-rohini-ashram-hc-oversight-2017
    statement_en: >
      On 20 December 2017 the Delhi High Court directed the CBI to investigate the alleged illegal confinement of women and girls at Adhyatmik Vishwa Vidyalaya's Rohini ashram, after a High Court-appointed committee's visit on 19 December 2017 found around 200 women and girls housed there, some in what press reports described as "animal-like" conditions.
    statement_hi: >
      19 दिसंबर 2017 को उच्च न्यायालय द्वारा नियुक्त एक समिति के दौरे में अध्यात्मिक विश्व विद्यालय के रोहिणी आश्रम में लगभग 200 महिलाओं व लड़कियों के मिलने, कुछ के प्रेस रिपोर्टों के अनुसार "पशुवत" स्थितियों में पाए जाने के बाद, 20 दिसंबर 2017 को दिल्ली उच्च न्यायालय ने वहाँ महिलाओं व लड़कियों के अवैध बंधक बनाए जाने के आरोपों की सीबीआई जाँच का आदेश दिया।
    tier: under_investigation
    date: 2017-12-20
    source_ids: [ v-dixit-src-01, v-dixit-src-02, v-dixit-src-10 ]
  - id: v-dixit-claim-02
    case_id: dixit-rohini-ashram-hc-oversight-2017
    statement_en: >
      By order dated 8 February 2018 in W.P.(C) 11382/2017, the Delhi High Court directed AVV and Dixit to stop using the words "Vishwa Vidyalaya" or "University" as part of their name; the Court's order of 24 January 2024 recorded that AVV was still using the expression, which it said would amount to contempt of the 2018 order.
    statement_hi: >
      W.P.(C) 11382/2017 में 8 फरवरी 2018 के आदेश द्वारा दिल्ली उच्च न्यायालय ने एवीवी और दीक्षित को अपने नाम में "विश्व विद्यालय" या "यूनिवर्सिटी" शब्द के प्रयोग से रोका; न्यायालय के 24 जनवरी 2024 के आदेश में दर्ज है कि एवीवी अब भी इस शब्द का प्रयोग कर रही थी, जिसे न्यायालय ने 2018 के आदेश की अवमानना बताया।
    tier: regulatory_action
    date: 2018-02-08
    source_ids: [ v-dixit-src-01 ]
  - id: v-dixit-claim-03
    case_id: dixit-cbi-rape-criminal-intimidation-2018
    statement_en: >
      In January 2018 a CBI special investigation team, formed on the Delhi High Court's direction, took over the case by re-registering three Delhi Police FIRs at Vijay Vihar police station, Rohini: two against Dixit for rape and criminal intimidation, and one against unidentified persons for obstructing the High Court-appointed committee's visit of 19 December 2017.
    statement_hi: >
      जनवरी 2018 में, दिल्ली उच्च न्यायालय के निर्देश पर गठित सीबीआई की विशेष जाँच टीम ने रोहिणी के विजय विहार थाने में दर्ज दिल्ली पुलिस की तीन एफआईआर पुनः दर्ज करके मामला अपने हाथ में लिया: दीक्षित के विरुद्ध बलात्कार व आपराधिक धमकी की दो, और 19 दिसंबर 2017 को उच्च न्यायालय द्वारा नियुक्त समिति के दौरे में बाधा डालने के लिए अज्ञात व्यक्तियों के विरुद्ध एक।
    tier: under_investigation
    date: 2018-01-03
    source_ids: [ v-dixit-src-01, v-dixit-src-02, v-dixit-src-10 ]
  - id: v-dixit-claim-04
    case_id: dixit-cbi-rape-criminal-intimidation-2018
    statement_en: >
      On 13 June 2019 the CBI filed a chargesheet in the Rouse Avenue special court under IPC 376(2)(n) against Dixit, and under IPC 109 read with 376(2)(n) against Gyaneshwar Mali, alleging Dixit repeatedly raped a minor in May-June 1999 at his ashrams in Kampil, Uttar Pradesh, and Vijay Vihar, Delhi, and threatened her and her family.
    statement_hi: >
      13 जून 2019 को सीबीआई ने रूज़ एवेन्यू की विशेष अदालत में दीक्षित के विरुद्ध आईपीसी 376(2)(एन) और ज्ञानेश्वर माली के विरुद्ध आईपीसी 109 सहपठित 376(2)(एन) के तहत आरोप-पत्र दाखिल किया, जिसमें आरोप है कि दीक्षित ने मई-जून 1999 में उत्तर प्रदेश के कंपिल और दिल्ली के विजय विहार स्थित अपने आश्रमों में एक नाबालिग के साथ बार-बार बलात्कार किया और उसे व उसके परिवार को धमकाया।
    tier: charged
    date: 2019-06-13
    source_ids: [ v-dixit-src-01, v-dixit-src-07 ]
  - id: v-dixit-claim-05
    case_id: dixit-cbi-rape-criminal-intimidation-2018
    statement_en: >
      Dixit was declared a proclaimed offender and remained absconding; the CBI obtained two Look Out Circulars (22 January 2018 and 22 February 2019) and an Interpol Blue Notice (26 March 2018) against him, and announced a reward of Rs 5 lakh for information leading to his arrest.
    statement_hi: >
      दीक्षित को उद्घोषित अपराधी घोषित किया गया और वे फरार बने रहे; सीबीआई ने उनके विरुद्ध दो लुक-आउट सर्कुलर (22 जनवरी 2018 और 22 फरवरी 2019) और एक इंटरपोल ब्लू नोटिस (26 मार्च 2018) जारी करवाया, और उनकी गिरफ़्तारी में सहायक सूचना के लिए 5 लाख रुपये का इनाम घोषित किया।
    tier: wanted
    date: 2019-02-22
    source_ids: [ v-dixit-src-01, v-dixit-src-02, v-dixit-src-07 ]
  - id: v-dixit-claim-06
    case_id: dixit-cbi-rape-criminal-intimidation-2018
    statement_en: >
      On 31 May 2023 a Division Bench of the Delhi High Court (Chief Justice Satish Chandra Sharma and Justice Subramonium Prasad) directed the CBI to take "all possible appropriate measures" to arrest Dixit, including initiating letters of request under CrPC section 166A to the United Kingdom and Nepal, after noting he had continued uploading videos across six YouTube channels since March 2018 while absconding.
    statement_hi: >
      31 मई 2023 को दिल्ली उच्च न्यायालय की खंडपीठ (मुख्य न्यायाधीश सतीश चंद्र शर्मा और न्यायमूर्ति सुब्रमोनियम प्रसाद) ने सीबीआई को दीक्षित की गिरफ़्तारी के लिए "हर संभव उचित कदम" उठाने का निर्देश दिया, जिसमें ब्रिटेन और नेपाल को सीआरपीसी धारा 166ए के तहत लेटर ऑफ रिक्वेस्ट भेजना शामिल है, यह देखते हुए कि फरार रहते हुए भी वे मार्च 2018 से छह यूट्यूब चैनलों पर वीडियो अपलोड करते रहे हैं।
    tier: wanted
    date: 2023-05-31
    source_ids: [ v-dixit-src-01, v-dixit-src-03 ]
  - id: v-dixit-claim-07
    case_id: dixit-cbi-rape-criminal-intimidation-2018
    statement_en: >
      On 12 September 2023 a Division Bench of the Delhi High Court (Chief Justice Satish Chandra Sharma and Justice Sanjeev Narula) authorised the CBI to freeze Dixit's bank accounts and directed it to continue searching for him.
    statement_hi: >
      12 सितंबर 2023 को दिल्ली उच्च न्यायालय की खंडपीठ (मुख्य न्यायाधीश सतीश चंद्र शर्मा और न्यायमूर्ति संजीव नरूला) ने सीबीआई को दीक्षित के बैंक खाते जब्त करने की अनुमति दी और उन्हें खोजने की कार्रवाई जारी रखने का निर्देश दिया।
    tier: wanted
    date: 2023-09-12
    source_ids: [ v-dixit-src-01, v-dixit-src-04 ]
  - id: v-dixit-claim-08
    case_id: dixit-rohini-ashram-hc-oversight-2017
    statement_en: >
      On 24 January 2024, in a habeas corpus petition (W.P.(CRL) 221/2024) seeking the release of an adult woman from an AVV ashram at Palam Colony, the Delhi High Court recorded a status report finding four adult women there, including the woman in question, who said they were staying of their own will; the Court noted a related petition, W.P.(C) 2004/2020, concerning release of women from the Rohini ashram, remained pending.
    statement_hi: >
      24 जनवरी 2024 को, पालम कॉलोनी स्थित एवीवी के एक आश्रम से एक वयस्क महिला को छुड़ाने की माँग वाली एक बंदी प्रत्यक्षीकरण याचिका (W.P.(CRL) 221/2024) में, दिल्ली उच्च न्यायालय ने एक स्थिति रिपोर्ट दर्ज की जिसमें वहाँ संबंधित महिला सहित चार वयस्क महिलाएँ मिलीं, जिन्होंने कहा कि वे अपनी इच्छा से रह रही हैं; न्यायालय ने नोट किया कि रोहिणी आश्रम से महिलाओं को छुड़ाने से संबंधित एक अन्य याचिका, W.P.(C) 2004/2020, लंबित है।
    tier: regulatory_action
    date: 2024-01-24
    source_ids: [ v-dixit-src-01 ]
  - id: v-dixit-claim-09
    case_id: dixit-cbi-rape-criminal-intimidation-2018
    statement_en: >
      The CBI's Hyderabad unit learned in January 2025, and confirmed around late September 2025, that Dixit had died in 2023 in his early eighties; the agency informed a special court and said it would seek abatement of the trial in the case in which it had filed chargesheets.
    statement_hi: >
      सीबीआई की हैदराबाद इकाई को जनवरी 2025 में पता चला, और सितंबर 2025 के अंत में इसकी पुष्टि हुई, कि दीक्षित की 2023 में लगभग 82 वर्ष की आयु में मृत्यु हो गई थी; एजेंसी ने एक विशेष अदालत को इसकी सूचना दी और कहा कि वह उस मामले में विचारण की समाप्ति (एबेटमेंट) की माँग करेगी जिसमें उसने आरोप-पत्र दाखिल किए थे।
    tier: wanted
    date: 2025-09-29
    source_ids: [ v-dixit-src-01, v-dixit-src-02 ]
  - id: v-dixit-claim-10
    case_id: dixit-rohini-ashram-hc-oversight-2017
    statement_en: >
      On 25 August 2026, after CBI counsel again told the Delhi High Court that Dixit was dead, the Court directed the SHO of Vijay Vihar police station to register a missing-person case over an ashram inmate whose belongings remained on the premises despite her absence, and said "the affairs of the ashrams... need to undergo an inquiry".
    statement_hi: >
      25 अगस्त 2026 को, सीबीआई के वकील द्वारा दिल्ली उच्च न्यायालय को फिर से दीक्षित के मृत होने की सूचना दिए जाने पर, न्यायालय ने विजय विहार थाने के एसएचओ को एक आश्रम निवासी, जिसका सामान परिसर में रहते हुए भी वह स्वयं अनुपस्थित थी, के लापता होने का मामला दर्ज कराने का निर्देश दिया, और कहा कि "आश्रमों के कामकाज की... जाँच होनी चाहिए"।
    tier: regulatory_action
    date: 2026-08-25
    source_ids: [ v-dixit-src-01, v-dixit-src-06 ]

