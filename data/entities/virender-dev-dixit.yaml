id: virender-dev-dixit
type: person
is_subject: true
name_en: Virender Dev Dixit
name_hi: वीरेंद्र देव दीक्षित
aliases: [ Virendra Dev Dixit, Virender Dev Dikshit, Virendra Deo Dixit, Baba Virendra Dev Dikshit ]
born: 1942
died: 2023
base_location: Adhyatmik Vishwa Vidyalaya ashram, Rohini, Delhi (native of Kampila, Farrukhabad district, Uttar Pradesh)
country: IN
countries_of_operation: [ IN ]
organisations: [ Adhyatmik Vishwa Vidyalaya, Advance Party ]
activity_status: deceased
abap_2017_list: false
summary_en: >
  Virender Dev Dixit headed the Adhyatmik Vishwa Vidyalaya (AVV), a Prajapita Brahma Kumaris splinter group known as the "Advance Party", whose flagship ashram is in Rohini, Delhi. After a Delhi High Court-appointed committee visited the ashram in December 2017 and around 200 women and girls were found living in confinement, the High Court in December 2017 ordered a CBI inquiry; the CBI re-registered three Delhi Police FIRs (two of rape and criminal intimidation against Dixit, one over obstruction of the committee) and filed a chargesheet in June 2019 under IPC 376(2)(n). Dixit went absconding, was declared a proclaimed offender, and the CBI obtained Look Out Circulars, an Interpol Blue Notice and offered a Rs 5 lakh reward for his arrest; the Delhi High Court kept supervising the case, in 2023 directing the CBI to pursue him abroad and to freeze his bank accounts. In September 2025 the CBI told a special court that its Hyderabad unit had learned Dixit died in 2023, in his early eighties, and that it would seek abatement of the trial; in August 2026 the High Court, on being told again that he was dead, ordered a fresh inquiry into the ashram's affairs after an inmate went missing. AVV's own website describes the cases against Dixit as false and says he received "a clean chit from the court", without citing any order to that effect.
summary_hi: >
  वीरेंद्र देव दीक्षित प्रजापिता ब्रह्माकुमारी संस्था के एक अलग हुए समूह, "एडवांस पार्टी" के नाम से जाने जाने वाले अध्यात्मिक विश्व विद्यालय (एवीवी) के प्रमुख थे, जिसका मुख्य आश्रम दिल्ली के रोहिणी में है। दिसंबर 2017 में दिल्ली उच्च न्यायालय द्वारा नियुक्त एक समिति के आश्रम के दौरे और वहाँ लगभग 200 महिलाओं व लड़कियों के बंधक जैसी स्थिति में मिलने के बाद उच्च न्यायालय ने सीबीआई जाँच का आदेश दिया; सीबीआई ने दिल्ली पुलिस की तीन एफआईआर पुनः दर्ज कीं (दीक्षित के विरुद्ध बलात्कार व आपराधिक धमकी की दो, समिति के काम में बाधा डालने की एक) और जून 2019 में आईपीसी 376(2)(एन) के तहत आरोप-पत्र दाखिल किया। दीक्षित फरार हो गए, उन्हें उद्घोषित अपराधी घोषित किया गया, और सीबीआई ने लुक-आउट सर्कुलर, इंटरपोल ब्लू नोटिस जारी करवाए तथा गिरफ़्तारी पर 5 लाख रुपये का इनाम घोषित किया; दिल्ली उच्च न्यायालय मामले की निगरानी करता रहा और 2023 में सीबीआई को उन्हें विदेश में खोजने तथा उनके बैंक खाते जब्त करने का निर्देश दिया। सितंबर 2025 में सीबीआई ने एक विशेष अदालत को बताया कि उसकी हैदराबाद इकाई को पता चला है कि दीक्षित की 2023 में लगभग 82 वर्ष की आयु में मृत्यु हो चुकी है, और वह विचारण समाप्ति (एबेटमेंट) की माँग करेगी; अगस्त 2026 में उच्च न्यायालय ने, फिर से उनकी मृत्यु की सूचना मिलने पर, एक निवासी के लापता होने के बाद आश्रमों के कामकाज की नए सिरे से जाँच का आदेश दिया। एवीवी अपनी वेबसाइट पर दीक्षित के विरुद्ध मामलों को झूठा बताती है और दावा करती है कि उन्हें "अदालत से क्लीन चिट" मिली, बिना किसी आदेश का हवाला दिए।
hi_reviewed: false
response_from_subject:
  text_en: >
    On its own website, AVV (Adhyatmik Vishwa Vidyalaya) describes the criminal cases against "Baba Virendra Dev Dikshit and AIVV" as "false cases... and their clean chit from the court", and elsewhere describes the accusations made against him since 1998 as a "web of fake allegations" arising from his split with the Brahma Kumaris. The organisation's site does not cite any specific court order recording an acquittal or discharge.
  text_hi: >
    एवीवी (अध्यात्मिक विश्व विद्यालय) अपनी वेबसाइट पर "बाबा वीरेंद्र देव दीक्षित और एआईवीवी" के विरुद्ध आपराधिक मामलों को "झूठे मामले... और अदालत से मिली क्लीन चिट" बताती है, और अन्यत्र 1998 से उन पर लगे आरोपों को ब्रह्माकुमारियों से उनके अलग होने के परिणामस्वरूप उपजा "झूठे आरोपों का जाल" बताती है। संगठन की वेबसाइट किसी विशिष्ट न्यायालयी आदेश का हवाला नहीं देती जिसमें दोषमुक्ति या उन्मोचन दर्ज हो।
  source_id: v-dixit-src-09

