response_from_subject:
  text_en: >
    ISKCON communications director Anuttama Dasa told the BBC in February 2002 that the movement had "admitted" abuse and was "working with and beyond the government," spending "hundreds of thousands of dollars on grants to people who had been abused and on measures to prevent future abuse." He said the $400 million sought in the refiled Texas suit was "so far beyond any realistic amount that there is no scope for discussion," and that fighting the suit could bankrupt the movement even if it won, so ISKCON's US temples would seek Chapter 11 protection instead.
  text_hi: >
    इस्कॉन के संचार निदेशक अनुत्तम दास ने फरवरी 2002 में बीबीसी को बताया कि आंदोलन ने उत्पीड़न को "स्वीकार" किया है और "सरकार के साथ और उससे आगे बढ़कर" काम कर रहा है, तथा पीड़ित लोगों को अनुदान देने और भविष्य के उत्पीड़न को रोकने के उपायों पर "लाखों डॉलर" खर्च कर रहा है। उन्होंने कहा कि टेक्सास में पुनः दायर मुकदमे में माँगी गई 40 करोड़ डॉलर की राशि "किसी भी यथार्थवादी राशि से इतनी परे है कि बातचीत की कोई गुंजाइश नहीं है," और मुकदमे से लड़ने पर जीतने पर भी आंदोलन दिवालिया हो सकता है, इसलिए इस्कॉन के अमेरिकी मंदिर इसके बजाय चैप्टर 11 संरक्षण माँगेंगे।
  source_id: iskcon-src-01

