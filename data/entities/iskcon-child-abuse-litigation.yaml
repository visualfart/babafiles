summary_en: >
  This record covers litigation and bankruptcy proceedings over child abuse at ISKCON boarding schools ("gurukulas") in the United States and India in the 1970s and 1980s. Former students sued as "Children of ISKCON" in the US District Court for the Northern District of Texas on 12 June 2000, seeking damages under RICO and Texas state law from ISKCON and numerous affiliated temples and individuals. On the government's own record, the court (Sam A. Lindsay, J.) dismissed the RICO claims with prejudice and the state-law claims without prejudice in the autumn of 2001; judgment was entered 30 November 2001. Attorney Windle Turley then refiled the abuse claims under state law in a Texas state court in October 2001, seeking $400 million. In February 2002 ISKCON temples announced they would file for Chapter 11 bankruptcy protection to manage the litigation exposure while continuing to compensate victims; one such filing, by Iskcon Television Inc. in the US Bankruptcy Court for the Central District of California, was opened on 15 March 2002 and ran until December 2007. According to a contemporaneous survivor-run litigation timeline, the bankruptcy court approved ISKCON's disclosure statement in February 2005, claimants voted to accept a reorganisation and claims-settlement plan in April 2005, and the court approved that plan in May 2005; ISKCON offered a court-ordered public apology to victims in August 2005. Attorney Windle Turley announced on 9 November 2008 that all remaining claims against ISKCON entities and their insurers had been resolved, with total settlements of about $15 million including legal fees. ISKCON's leadership has itself publicly acknowledged the abuse; the New York Times reported in October 1998 that the movement detailed decades of physical, emotional and sexual abuse of children at its boarding schools, and it has since operated bodies such as the ISKCON Child Protection Office.
summary_hi: >
  यह रिकॉर्ड 1970 और 1980 के दशक में अमेरिका और भारत में इस्कॉन के आवासीय विद्यालयों ("गुरुकुल") में बाल-उत्पीड़न को लेकर हुई मुकदमेबाज़ी और दिवालियापन कार्यवाहियों को दर्ज करता है। पूर्व छात्रों ने "चिल्ड्रन ऑफ़ इस्कॉन" के रूप में 12 जून 2000 को उत्तरी टेक्सास ज़िले की अमेरिकी ज़िला अदालत में मुकदमा दायर कर इस्कॉन और कई संबद्ध मंदिरों व व्यक्तियों से आरआईसीओ (RICO) क़ानून और टेक्सास राज्य क़ानून के तहत हर्जाना माँगा। सरकारी रिकॉर्ड के अनुसार, अदालत (न्यायाधीश सैम ए. लिंडसे) ने 2001 की शरद ऋतु में आरआईसीओ के दावे पूर्वाग्रह सहित और राज्य-क़ानून के दावे बिना पूर्वाग्रह के खारिज़ किए; निर्णय 30 नवंबर 2001 को दर्ज हुआ। वकील विंडल टर्ली ने फिर अक्टूबर 2001 में टेक्सास की राज्य अदालत में राज्य क़ानून के तहत 40 करोड़ डॉलर की माँग करते हुए उत्पीड़न के दावे फिर से दायर किए। फरवरी 2002 में इस्कॉन के मंदिरों ने घोषणा की कि वे पीड़ितों को मुआवज़ा देना जारी रखते हुए मुकदमेबाज़ी के जोखिम को संभालने के लिए चैप्टर 11 दिवालियापन संरक्षण के लिए आवेदन करेंगे; ऐसा ही एक आवेदन, इस्कॉन टेलीविज़न इंक. द्वारा, कैलिफ़ोर्निया के मध्य ज़िले की अमेरिकी दिवालिया अदालत में 15 मार्च 2002 को खोला गया और दिसंबर 2007 तक चला। एक समकालीन उत्तरजीवी-संचालित मुकदमा समयरेखा के अनुसार, दिवालिया अदालत ने फरवरी 2005 में इस्कॉन के प्रकटीकरण विवरण को मंज़ूरी दी, दावेदारों ने अप्रैल 2005 में एक पुनर्गठन व दावा-निपटान योजना को स्वीकार करने हेतु मतदान किया, और अदालत ने मई 2005 में उस योजना को मंज़ूरी दी; इस्कॉन ने अगस्त 2005 में पीड़ितों से अदालत-आदेशित सार्वजनिक क्षमायाचना की। वकील विंडल टर्ली ने 9 नवंबर 2008 को घोषणा की कि इस्कॉन की संस्थाओं और उनके बीमाकर्ताओं के विरुद्ध शेष सभी दावों का निपटारा हो चुका है, जिसमें क़ानूनी शुल्क सहित कुल लगभग 1.5 करोड़ डॉलर का निपटान हुआ। इस्कॉन के नेतृत्व ने स्वयं सार्वजनिक रूप से उत्पीड़न को स्वीकार किया है; न्यूयॉर्क टाइम्स ने अक्टूबर 1998 में रिपोर्ट किया कि आंदोलन ने अपने आवासीय विद्यालयों में बच्चों के दशकों के शारीरिक, भावनात्मक और यौन उत्पीड़न का विवरण दिया, और तब से उसने इस्कॉन चाइल्ड प्रोटेक्शन ऑफिस जैसी संस्थाएँ संचालित की हैं।
