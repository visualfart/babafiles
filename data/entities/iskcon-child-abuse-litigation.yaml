cases:
  - id: iskcon-children-of-iskcon-v-iskcon-2000
    title_en: Children of ISKCON v. ISKCON (federal RICO suit)
    title_hi: चिल्ड्रन ऑफ़ इस्कॉन बनाम इस्कॉन (संघीय आरआईसीओ मुकदमा)
    jurisdiction_country: US
    jurisdiction_region: Texas
    court: United States District Court for the Northern District of Texas (Dallas Division)
    case_number: 3:00-cv-01254
    filed_year: 2000
    case_type: civil
    statutes: [ Racketeer Influenced and Corrupt Organizations Act (RICO), Texas state tort law ]
    status: RICO claims dismissed with prejudice; state-law claims dismissed without prejudice and refiled in Texas state court
    tier: closed
    verdict_date: 2001-11-30
    sentence_or_remedy: Dismissal; no damages awarded in this action
    appeal_status: Not located; plaintiffs instead refiled the abuse claims under state law in Texas state court in October 2001
    summary_en: >
      Former students at ISKCON boarding schools sued as "Children of ISKCON" in the US District Court for the Northern District of Texas on 12 June 2000, naming the International Society for Krishna Consciousness and numerous affiliated temples, corporate entities and individuals, and alleging decades of physical, sexual and emotional abuse at the movement's boarding schools in the 1970s and 1980s. After extensive motion practice, Judge Sam A. Lindsay granted the defendants' motions to dismiss; the judgment entered 30 November 2001 records that the plaintiffs' RICO claims against ISKCON and several co-defendants were dismissed with prejudice and their state-law claims were dismissed without prejudice, and that claims against several other defendants (including Keith Ham) were dismissed without prejudice. Plaintiffs' attorney Windle Turley then refiled the underlying abuse allegations under Texas state law in a Dallas state court in October 2001, this time seeking $400 million.
    summary_hi: >
      इस्कॉन के आवासीय विद्यालयों के पूर्व छात्रों ने "चिल्ड्रन ऑफ़ इस्कॉन" के रूप में 12 जून 2000 को उत्तरी टेक्सास ज़िले की अमेरिकी ज़िला अदालत में मुकदमा दायर किया, जिसमें कृष्ण भावनामृत अंतरराष्ट्रीय संघ और कई संबद्ध मंदिरों, कॉर्पोरेट संस्थाओं व व्यक्तियों को नामित किया गया, और 1970-1980 के दशक में आंदोलन के आवासीय विद्यालयों में दशकों के शारीरिक, यौन और भावनात्मक उत्पीड़न का आरोप लगाया गया। व्यापक आवेदन-प्रक्रिया के बाद न्यायाधीश सैम ए. लिंडसे ने प्रतिवादियों के खारिज़ी आवेदन स्वीकार किए; 30 नवंबर 2001 को दर्ज निर्णय में दर्ज है कि वादियों के इस्कॉन और कई सह-प्रतिवादियों के विरुद्ध आरआईसीओ के दावे पूर्वाग्रह सहित और उनके राज्य-क़ानून के दावे बिना पूर्वाग्रह के खारिज़ किए गए, और कई अन्य प्रतिवादियों (कीथ हैम सहित) के विरुद्ध दावे बिना पूर्वाग्रह के खारिज़ किए गए। वादियों के वकील विंडल टर्ली ने फिर अक्टूबर 2001 में डलास की राज्य अदालत में टेक्सास राज्य क़ानून के तहत मूल उत्पीड़न के आरोप फिर से दायर किए, इस बार 40 करोड़ डॉलर की माँग करते हुए।
    source_ids: [ iskcon-src-04, iskcon-src-02, iskcon-src-06 ]

