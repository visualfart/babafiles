    sentence_or_remedy: "Court-approved Chapter 11 reorganisation and claims-settlement plan (2005); total settlements of about $15 million including legal fees by November 2008, per plaintiffs' counsel"
    appeal_status: Not located
    summary_en: >
      In February 2002, facing the refiled $400 million Texas state-court suit, ISKCON's US temples announced they would seek Chapter 11 bankruptcy protection; one such petition, by Iskcon Television Inc., was filed in the US Bankruptcy Court for the Central District of California on 15 March 2002 and ran until it was terminated in December 2007. According to a litigation timeline compiled by former gurukula students from ISKCON documents and media accounts, the bankruptcy court approved ISKCON's disclosure statement on 11 February 2005; claimants and plaintiffs voted between March and 29 April 2005 to accept a proposed Chapter 11 reorganisation and claims-settlement plan, which the court approved that May; and ISKCON offered abuse victims a court-ordered public apology on 5 August 2005. Attorney Windle Turley announced on 9 November 2008 that all remaining claims against ISKCON entities and their insurers had been resolved, with total settlements, including legal fees, of about $15 million.
    summary_hi: >
      फरवरी 2002 में, टेक्सास की राज्य अदालत में फिर से दायर 40 करोड़ डॉलर के मुकदमे का सामना करते हुए, इस्कॉन के अमेरिकी मंदिरों ने चैप्टर 11 दिवालियापन संरक्षण माँगने की घोषणा की; ऐसा ही एक आवेदन, इस्कॉन टेलीविज़न इंक. द्वारा, कैलिफ़ोर्निया के मध्य ज़िले की अमेरिकी दिवालिया अदालत में 15 मार्च 2002 को दायर किया गया और दिसंबर 2007 में समाप्त होने तक चला। इस्कॉन के दस्तावेज़ों और मीडिया रिपोर्टों के आधार पर पूर्व गुरुकुल छात्रों द्वारा तैयार एक मुकदमा समयरेखा के अनुसार, दिवालिया अदालत ने 11 फरवरी 2005 को इस्कॉन के प्रकटीकरण विवरण को मंज़ूरी दी; दावेदारों और वादियों ने मार्च से 29 अप्रैल 2005 के बीच एक प्रस्तावित चैप्टर 11 पुनर्गठन व दावा-निपटान योजना को स्वीकार करने हेतु मतदान किया, जिसे अदालत ने उसी मई में मंज़ूरी दी; और इस्कॉन ने 5 अगस्त 2005 को पीड़ितों से अदालत-आदेशित सार्वजनिक क्षमायाचना की। वकील विंडल टर्ली ने 9 नवंबर 2008 को घोषणा की कि इस्कॉन की संस्थाओं और उनके बीमाकर्ताओं के विरुद्ध शेष सभी दावों का निपटारा हो चुका है, जिसमें क़ानूनी शुल्क सहित कुल लगभग 1.5 करोड़ डॉलर का निपटान हुआ।
