claims:
  - id: iskcon-claim-01
    case_id: iskcon-children-of-iskcon-v-iskcon-2000
    statement_en: On 12 June 2000, former students sued ISKCON and numerous affiliated temples and individuals as "Children of ISKCON" in the US District Court for the Northern District of Texas, alleging decades of physical, sexual and emotional abuse at the movement's boarding schools.
    statement_hi: 12 जून 2000 को पूर्व छात्रों ने "चिल्ड्रन ऑफ़ इस्कॉन" के रूप में उत्तरी टेक्सास ज़िले की अमेरिकी ज़िला अदालत में इस्कॉन और कई संबद्ध मंदिरों व व्यक्तियों पर मुकदमा दायर कर आंदोलन के आवासीय विद्यालयों में दशकों के शारीरिक, यौन और भावनात्मक उत्पीड़न का आरोप लगाया।
    tier: allegation
    date: 2000-06-12
    source_ids: [ iskcon-src-04, iskcon-src-06 ]
  - id: iskcon-claim-02
    case_id: iskcon-children-of-iskcon-v-iskcon-2000
    statement_en: The federal court's judgment, entered 30 November 2001, dismissed the plaintiffs' RICO claims against ISKCON and several co-defendants with prejudice and their state-law claims without prejudice.
    statement_hi: 30 नवंबर 2001 को दर्ज संघीय अदालत के निर्णय ने वादियों के इस्कॉन और कई सह-प्रतिवादियों के विरुद्ध आरआईसीओ के दावे पूर्वाग्रह सहित और उनके राज्य-क़ानून के दावे बिना पूर्वाग्रह के खारिज़ किए।
    tier: closed
    date: 2001-11-30
    source_ids: [ iskcon-src-04 ]
  - id: iskcon-claim-03
    statement_en: In October 2001, attorney Windle Turley refiled the abuse allegations against ISKCON under Texas state law in a Dallas state court, seeking $400 million in damages.
    statement_hi: अक्टूबर 2001 में वकील विंडल टर्ली ने डलास की राज्य अदालत में टेक्सास राज्य क़ानून के तहत इस्कॉन के विरुद्ध उत्पीड़न के आरोप फिर से दायर किए, जिसमें 40 करोड़ डॉलर के हर्जाने की माँग की गई।
    tier: allegation
    date: 2001-10
    source_ids: [ iskcon-src-01, iskcon-src-02, iskcon-src-06 ]
  - id: iskcon-claim-04
    case_id: iskcon-chapter11-bankruptcy-2002-2008
    statement_en: In February 2002 ISKCON's US temples announced they would file for Chapter 11 bankruptcy protection in response to the refiled abuse suit; Iskcon Television Inc.'s Chapter 11 petition was filed in the US Bankruptcy Court for the Central District of California on 15 March 2002.
    statement_hi: फरवरी 2002 में इस्कॉन के अमेरिकी मंदिरों ने फिर से दायर उत्पीड़न मुकदमे के जवाब में चैप्टर 11 दिवालियापन संरक्षण के लिए आवेदन करने की घोषणा की; इस्कॉन टेलीविज़न इंक. का चैप्टर 11 आवेदन कैलिफ़ोर्निया के मध्य ज़िले की अमेरिकी दिवालिया अदालत में 15 मार्च 2002 को दायर किया गया।
    tier: closed
    date: 2002-03-15
    source_ids: [ iskcon-src-05, iskcon-src-01 ]
  - id: iskcon-claim-05
    case_id: iskcon-chapter11-bankruptcy-2002-2008
    statement_en: According to a litigation timeline compiled from ISKCON documents and media accounts, the bankruptcy court approved ISKCON's Chapter 11 reorganisation and claims-settlement plan in May 2005, after claimants voted to accept it in late April 2005, and ISKCON offered abuse victims a court-ordered public apology on 5 August 2005.
    statement_hi: इस्कॉन के दस्तावेज़ों और मीडिया रिपोर्टों से तैयार मुकदमा समयरेखा के अनुसार, दिवालिया अदालत ने मई 2005 में इस्कॉन की चैप्टर 11 पुनर्गठन व दावा-निपटान योजना को मंज़ूरी दी, जिसे दावेदारों ने अप्रैल 2005 के अंत में स्वीकार करने हेतु मतदान किया था, और इस्कॉन ने 5 अगस्त 2005 को पीड़ितों से अदालत-आदेशित सार्वजनिक क्षमायाचना की।
    tier: civil_judgment
    date: 2005-05
    source_ids: [ iskcon-src-05, iskcon-src-06 ]
  - id: iskcon-claim-06
    case_id: iskcon-chapter11-bankruptcy-2002-2008
    statement_en: Plaintiffs' attorney Windle Turley announced on 9 November 2008 that all remaining claims against ISKCON entities and their insurers had been settled, with total settlements of about $15 million including legal fees.
    statement_hi: वादियों के वकील विंडल टर्ली ने 9 नवंबर 2008 को घोषणा की कि इस्कॉन की संस्थाओं और उनके बीमाकर्ताओं के विरुद्ध शेष सभी दावों का निपटारा हो चुका है, जिसमें क़ानूनी शुल्क सहित कुल लगभग 1.5 करोड़ डॉलर का निपटान हुआ।
    tier: civil_judgment
    date: 2008-11-09
    source_ids: [ iskcon-src-05, iskcon-src-06 ]
  - id: iskcon-claim-07
    statement_en: ISKCON's own leadership publicly acknowledged the abuse; the New York Times reported on 9 October 1998 that the movement detailed past physical, emotional and sexual abuse of children at its boarding schools.
    statement_hi: इस्कॉन के नेतृत्व ने स्वयं सार्वजनिक रूप से उत्पीड़न को स्वीकार किया; न्यूयॉर्क टाइम्स ने 9 अक्टूबर 1998 को रिपोर्ट किया कि आंदोलन ने अपने आवासीय विद्यालयों में बच्चों के अतीत के शारीरिक, भावनात्मक और यौन उत्पीड़न का विवरण दिया।
    tier: allegation
    date: 1998-10-09
    source_ids: [ iskcon-src-03 ]

