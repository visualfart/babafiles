id: sri-sri-ravi-shankar
type: person
is_subject: true
name_en: Sri Sri Ravi Shankar
name_hi: श्री श्री रविशंकर
aliases: [Sri Sri, Gurudev, Ravi Shankar, Ravi Shankar Vittal]
born: 1956-05-13
died:
base_location: Art of Living International Center, Bengaluru, Karnataka
country: IN
countries_of_operation: [IN]
organisations: [Art of Living Foundation]
activity_status: active
summary_en: >
  Sri Sri Ravi Shankar founded the Art of Living Foundation, whose Indian legal entity is
  Vyakti Vikas Kendra India, headquartered at the Art of Living International Center near
  Bengaluru. The Foundation's March 2016 World Culture Festival, held on the Yamuna
  floodplain in Delhi, drew a complaint to the National Green Tribunal that the event's
  preparation had damaged the floodplain and its wetlands. Two days before the festival the
  Tribunal permitted it to proceed but ordered an interim environmental compensation of Rs
  5 crore; a court-appointed expert committee later assessed restoration and rehabilitation
  costs running into tens of crores of rupees, and on 7 December 2017 the Tribunal held the
  Foundation responsible for damage to the floodplain, to be made good from the Rs 5 crore
  deposit with any shortfall recoverable from the Foundation. The Foundation appealed to the
  Supreme Court, which on 22 August 2026 set aside the Tribunal's judgment, holding that no
  causal link between the festival and the alleged damage had been established, that the
  floodplain was already in a degraded condition before the site was handed over, and that
  the Tribunal had wrongly conflated "restoration" with a far larger "rehabilitation"
  exercise; the Court directed the Delhi Development Authority to refund the Rs 5 crore
  within four weeks.
summary_hi: >
  श्री श्री रविशंकर ने आर्ट ऑफ लिविंग फाउंडेशन की स्थापना की, जिसकी भारतीय विधिक इकाई व्यक्ति विकास
  केंद्र इंडिया है और जिसका मुख्यालय बेंगलुरु के निकट आर्ट ऑफ लिविंग इंटरनेशनल सेंटर में है। फाउंडेशन
  के मार्च 2016 के विश्व संस्कृति महोत्सव, जो दिल्ली में यमुना के बाढ़ क्षेत्र में आयोजित हुआ था, को लेकर
  राष्ट्रीय हरित अधिकरण में शिकायत की गई कि आयोजन की तैयारी से बाढ़ क्षेत्र और उसकी आर्द्रभूमि को नुकसान
  पहुँचा। महोत्सव से दो दिन पहले अधिकरण ने इसे आगे बढ़ने की अनुमति दी लेकिन 5 करोड़ रुपये का अंतरिम
  पर्यावरणीय हर्जाना लगाया; अदालत द्वारा नियुक्त एक विशेषज्ञ समिति ने बाद में पुनर्स्थापन और पुनर्वास की
  लागत दसियों करोड़ रुपये आँकी, और 7 दिसंबर 2017 को अधिकरण ने फाउंडेशन को बाढ़ क्षेत्र को हुए नुकसान के
  लिए ज़िम्मेदार ठहराया, जिसकी भरपाई 5 करोड़ रुपये की जमा राशि से की जानी थी और कमी होने पर शेष राशि
  फाउंडेशन से वसूल की जानी थी। फाउंडेशन ने सर्वोच्च न्यायालय में अपील की, जिसने 22 अगस्त 2026 को
  अधिकरण के निर्णय को रद्द कर दिया, यह मानते हुए कि महोत्सव और कथित नुकसान के बीच कोई कारणात्मक संबंध
  स्थापित नहीं हुआ, कि स्थल सौंपे जाने से पहले ही बाढ़ क्षेत्र क्षतिग्रस्त अवस्था में था, और कि अधिकरण ने
  "पुनर्स्थापन" को कहीं बड़े "पुनर्वास" कार्य के साथ ग़लती से मिला दिया था; न्यायालय ने दिल्ली विकास
  प्राधिकरण को चार सप्ताह के भीतर 5 करोड़ रुपये लौटाने का निर्देश दिया।
hi_reviewed: false
response_from_subject:
  text_en: >
    After the Supreme Court's 22 August 2026 judgment, Sri Sri Ravi Shankar said: "Patience
    pays. Truth triumphs. Today, the Hon'ble Supreme Court has vindicated our stand." At the
    time it paid the Rs 5 crore in 2016, the Foundation had said it was doing so only "to
    assure the National Green Tribunal that we are financially good" and not as an
    admission of fault, adding that the allotted site "is an agricultural land ploughed by
    the locals. We never levelled it," and that "there was never any biodiversity in the
    floodplains which the World Culture Festival ... would have destroyed."
  text_hi: >
    सर्वोच्च न्यायालय के 22 अगस्त 2026 के निर्णय के बाद श्री श्री रविशंकर ने कहा: "धैर्य फल देता है।
    सत्य की जीत होती है। आज माननीय सर्वोच्च न्यायालय ने हमारे पक्ष की पुष्टि की है।" 2016 में जब
    फाउंडेशन ने 5 करोड़ रुपये जमा किए थे, तब उसने कहा था कि यह केवल "राष्ट्रीय हरित अधिकरण को यह
    आश्वस्त करने के लिए किया गया कि हम वित्तीय रूप से सक्षम हैं," दोष स्वीकृति के रूप में नहीं, और यह
    कि आवंटित स्थल "स्थानीय लोगों द्वारा जोती जाने वाली कृषि भूमि है। हमने इसे कभी समतल नहीं किया," और
    "बाढ़ क्षेत्र में कभी ऐसी जैव-विविधता थी ही नहीं जिसे विश्व संस्कृति महोत्सव ... नष्ट कर देता।"
  source_id: sri-sri-ravi-shankar-src-04

