cases:
  - id: sri-sri-ravi-shankar-ngt-yamuna-floodplain-2016
    title_en: Manoj Misra v. Union of India and Ors. (World Culture Festival, Yamuna floodplain damage)
    title_hi: मनोज मिश्रा बनाम भारत संघ एवं अन्य (विश्व संस्कृति महोत्सव, यमुना बाढ़ क्षेत्र क्षति)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: National Green Tribunal, Principal Bench, New Delhi; Supreme Court of India (on appeal)
    case_number: NGT Original Application Nos. 65, 76 and 81 of 2016; Supreme Court Civil Appeal No. 683 of 2018
    filed_year: 2016
    case_type: regulatory
    statutes: ["National Green Tribunal Act 2010, s.15", "National Green Tribunal Act 2010, s.17"]
    status: closed; NGT judgment set aside on appeal, compensation refunded
    tier: closed
    verdict_date: 2026-08-22
    sentence_or_remedy: >
      NGT (7 December 2017): Foundation held responsible for floodplain damage, to be made good from the
      Rs 5 crore deposit with DDA, any shortfall recoverable from the Foundation. Supreme Court (22 August
      2026): NGT judgment set aside; DDA directed to refund the Rs 5 crore within four weeks.
    appeal_status: Concluded; Supreme Court disposed of Civil Appeal No. 683 of 2018 on 22 August 2026
    summary_en: >
      Manoj Misra of the Yamuna Jiye Abhiyaan applied to the National Green Tribunal on 8 February 2016
      against the Art of Living Foundation's scheduled World Culture Festival (11-13 March 2016), to be
      held on about 25 hectares of active Yamuna floodplain in Delhi, alleging that preparatory
      construction - ramps, roads, pontoon bridges and compacted earth - was damaging the floodplain in
      breach of the Tribunal's earlier Yamuna judgment of 13 January 2015. A court-appointed expert
      committee's interim report of 22 February 2016 estimated rectification costs of Rs 100-120 crore.
      Two days before the festival, on 9 March 2016, the Tribunal declined to stop the event but imposed
      an interim environmental compensation of Rs 5 crore, to be adjusted against a final assessment; the
      Foundation paid the amount without prejudice to its rights. The committee's later reports (28 July
      and 28 November 2016) put physical and biological restoration costs at about Rs 28.73 crore and Rs
      13.29 crore respectively but also acknowledged it could not establish the site's pre-event
      ecological condition, while a third report by government officials, filed 28 July 2017, found no
      significant damage or soil compaction. On 7 December 2017 the Tribunal nonetheless held the
      Foundation responsible for the damage under the "no-fault" liability standard in section 17(3) of
      the NGT Act, directed the Rs 5 crore be applied to restoration, with the Delhi Development Authority
      entitled to recover any excess cost from the Foundation, and to develop a biodiversity park at the
      site. On appeal, the Supreme Court (Satish Chandra Sharma and Nongmeikapam Kotiswar Singh JJ) held
      on 22 August 2026 that no causal link between the festival and the alleged damage had been
      established; that contemporaneous material, including the Foundation's own December 2015 letter
      about existing construction debris on site, showed the floodplain was already degraded before being
      handed over; that the committee's key reliance on a single Google satellite image of 5 September
      2015 was unreliable and inconsistent with the committee's own earlier reports; and that the
      Tribunal had wrongly equated "restoration" of the event site with a much larger "rehabilitation" of
      the floodplain, including a biodiversity park the Foundation had never damaged. The Court set aside
      the NGT judgment and directed DDA to refund the Rs 5 crore within four weeks, while leaving DDA's own
      responsibility for rehabilitating the floodplain undisturbed.
    summary_hi: >
      यमुना जिए अभियान के मनोज मिश्रा ने 8 फरवरी 2016 को राष्ट्रीय हरित अधिकरण में आर्ट ऑफ लिविंग
      फाउंडेशन के प्रस्तावित विश्व संस्कृति महोत्सव (11-13 मार्च 2016), जो दिल्ली में यमुना के लगभग 25
      हेक्टेयर सक्रिय बाढ़ क्षेत्र में होना था, के विरुद्ध आवेदन दिया, यह आरोप लगाते हुए कि रैंप, सड़कें,
      पोंटून पुल और संकुचित मिट्टी जैसे तैयारी निर्माण अधिकरण के 13 जनवरी 2015 के पूर्व यमुना निर्णय का
      उल्लंघन करते हुए बाढ़ क्षेत्र को नुकसान पहुँचा रहे हैं। अदालत द्वारा नियुक्त विशेषज्ञ समिति की 22
      फरवरी 2016 की अंतरिम रिपोर्ट ने सुधार लागत 100-120 करोड़ रुपये आँकी। महोत्सव से दो दिन पहले, 9
      मार्च 2016 को, अधिकरण ने आयोजन रोकने से इनकार किया लेकिन 5 करोड़ रुपये का अंतरिम पर्यावरणीय हर्जाना
      लगाया, जिसे अंतिम आकलन में समायोजित किया जाना था; फाउंडेशन ने अपने अधिकारों को सुरक्षित रखते हुए
      यह राशि जमा की। समिति की बाद की रिपोर्टों (28 जुलाई और 28 नवंबर 2016) ने भौतिक और जैविक पुनर्स्थापन
      लागत क्रमशः लगभग 28.73 करोड़ और 13.29 करोड़ रुपये आँकी लेकिन यह भी स्वीकार किया कि वह स्थल की
      पूर्व-आयोजन पारिस्थितिक स्थिति स्थापित नहीं कर सकी, जबकि सरकारी अधिकारियों की तीसरी रिपोर्ट, जो 28
      जुलाई 2017 को दाखिल हुई, में कोई उल्लेखनीय क्षति या मिट्टी संकुचन नहीं पाया गया। इसके बावजूद 7
      दिसंबर 2017 को अधिकरण ने एनजीटी अधिनियम की धारा 17(3) के "नो-फॉल्ट" दायित्व मानक के तहत फाउंडेशन को
      नुकसान के लिए ज़िम्मेदार ठहराया, 5 करोड़ रुपये पुनर्स्थापन में लगाने और दिल्ली विकास प्राधिकरण को
      अतिरिक्त लागत फाउंडेशन से वसूलने तथा स्थल पर जैव-विविधता पार्क विकसित करने का निर्देश दिया। अपील
      में, सर्वोच्च न्यायालय (न्यायमूर्ति सतीश चंद्र शर्मा और न्यायमूर्ति नोंगमैकापम कोटिश्वर सिंह) ने 22
      अगस्त 2026 को कहा कि महोत्सव और कथित नुकसान के बीच कोई कारणात्मक संबंध स्थापित नहीं हुआ; कि समकालीन
      सामग्री, जिसमें फाउंडेशन का दिसंबर 2015 का वह पत्र भी शामिल है जिसमें स्थल पर मौजूदा निर्माण मलबे
      का उल्लेख था, दिखाती है कि स्थल सौंपे जाने से पहले ही बाढ़ क्षेत्र क्षतिग्रस्त था; कि समिति की मुख्य
      निर्भरता 5 सितंबर 2015 की एक अकेली गूगल सैटेलाइट छवि पर अविश्वसनीय थी और समिति की अपनी पूर्व
      रिपोर्टों से मेल नहीं खाती; और कि अधिकरण ने कार्यक्रम स्थल के "पुनर्स्थापन" को बाढ़ क्षेत्र के कहीं
      बड़े "पुनर्वास" के साथ ग़लती से मिला दिया, जिसमें एक ऐसा जैव-विविधता पार्क भी शामिल था जिसे
      फाउंडेशन ने कभी क्षतिग्रस्त नहीं किया था। न्यायालय ने एनजीटी के निर्णय को रद्द कर दिया और दिल्ली
      विकास प्राधिकरण को चार सप्ताह में 5 करोड़ रुपये लौटाने का निर्देश दिया, जबकि बाढ़ क्षेत्र के
      पुनर्वास हेतु प्राधिकरण की अपनी ज़िम्मेदारी को अपरिवर्तित रखा।
    source_ids: [sri-sri-ravi-shankar-src-01, sri-sri-ravi-shankar-src-02, sri-sri-ravi-shankar-src-03, sri-sri-ravi-shankar-src-05, sri-sri-ravi-shankar-src-06, sri-sri-ravi-shankar-src-07]

claims:
  - id: sri-sri-ravi-shankar-claim-01
    case_id: sri-sri-ravi-shankar-ngt-yamuna-floodplain-2016
    statement_en: On 9 March 2016, two days before the World Culture Festival, the National Green Tribunal declined to stop the event but imposed an interim environmental compensation of Rs 5 crore on the Art of Living Foundation, recording that the floodplains had been "drastically tampered with" in the course of preparations.
    statement_hi: 9 मार्च 2016 को, विश्व संस्कृति महोत्सव से दो दिन पहले, राष्ट्रीय हरित अधिकरण ने आयोजन रोकने से इनकार किया लेकिन आर्ट ऑफ लिविंग फाउंडेशन पर 5 करोड़ रुपये का अंतरिम पर्यावरणीय हर्जाना लगाया, यह दर्ज करते हुए कि तैयारियों के दौरान बाढ़ क्षेत्र को "गंभीर रूप से छेड़ा गया" था।
    tier: regulatory_action
    date: 2016-03-09
    source_ids: [sri-sri-ravi-shankar-src-01, sri-sri-ravi-shankar-src-07]
  - id: sri-sri-ravi-shankar-claim-02
    case_id: sri-sri-ravi-shankar-ngt-yamuna-floodplain-2016
    statement_en: The Tribunal's court-appointed expert committee reported on 28 November 2016 that physical restoration of the floodplain would cost about Rs 28.73 crore over two years and biological restoration about Rs 13.29 crore over ten years, while also stating that it could not determine the site's ecological condition before the event.
    statement_hi: अधिकरण की अदालत-नियुक्त विशेषज्ञ समिति ने 28 नवंबर 2016 को बताया कि बाढ़ क्षेत्र के भौतिक पुनर्स्थापन में दो वर्षों में लगभग 28.73 करोड़ रुपये और जैविक पुनर्स्थापन में दस वर्षों में लगभग 13.29 करोड़ रुपये की लागत आएगी, साथ ही यह भी कहा कि वह आयोजन से पहले स्थल की पारिस्थितिक स्थिति निर्धारित नहीं कर सकी।
    tier: regulatory_action
    date: 2016-11-28
    source_ids: [sri-sri-ravi-shankar-src-01, sri-sri-ravi-shankar-src-06]
  - id: sri-sri-ravi-shankar-claim-03
    case_id: sri-sri-ravi-shankar-ngt-yamuna-floodplain-2016
    statement_en: On 7 December 2017 the National Green Tribunal (Justice Swatanter Kumar, Chairperson, with Justice Jawad Rahim and expert member B.S. Sajwan) held the Art of Living Foundation responsible for damage to the Yamuna floodplain, directed that the Rs 5 crore deposit be applied to restoration under the Delhi Development Authority's supervision, and that the Foundation pay any shortfall on demand.
    statement_hi: 7 दिसंबर 2017 को राष्ट्रीय हरित अधिकरण (अध्यक्ष न्यायमूर्ति स्वतंतर कुमार, न्यायमूर्ति जावेद रहीम और विशेषज्ञ सदस्य बी.एस. साज्वान) ने आर्ट ऑफ लिविंग फाउंडेशन को यमुना बाढ़ क्षेत्र को हुए नुकसान के लिए ज़िम्मेदार ठहराया, 5 करोड़ रुपये की जमा राशि को दिल्ली विकास प्राधिकरण की देखरेख में पुनर्स्थापन में लगाने का निर्देश दिया, और कहा कि किसी भी कमी की राशि फाउंडेशन मांगे जाने पर चुकाएगा।
    tier: regulatory_action
    date: 2017-12-07
    source_ids: [sri-sri-ravi-shankar-src-01, sri-sri-ravi-shankar-src-05]
  - id: sri-sri-ravi-shankar-claim-04
    case_id: sri-sri-ravi-shankar-ngt-yamuna-floodplain-2016
    statement_en: The Art of Living Foundation appealed the Tribunal's order to the Supreme Court as Civil Appeal No. 683 of 2018 (Vyakti Vikas Kendra India v. Manoj Misra), which remained pending for over seven years before final judgment.
    statement_hi: आर्ट ऑफ लिविंग फाउंडेशन ने अधिकरण के आदेश के विरुद्ध सर्वोच्च न्यायालय में सिविल अपील संख्या 683/2018 (व्यक्ति विकास केंद्र इंडिया बनाम मनोज मिश्रा) दायर की, जो अंतिम निर्णय आने तक सात वर्ष से अधिक लंबित रही।
    tier: regulatory_action
    date: 2018
    source_ids: [sri-sri-ravi-shankar-src-01]
  - id: sri-sri-ravi-shankar-claim-05
    case_id: sri-sri-ravi-shankar-ngt-yamuna-floodplain-2016
    statement_en: On 22 August 2026 the Supreme Court (Satish Chandra Sharma and Nongmeikapam Kotiswar Singh JJ) set aside the NGT's 7 December 2017 judgment, holding that no causal link had been established between the festival and the alleged damage and that contemporaneous material, including the Foundation's own December 2015 letter about construction debris already on site, showed the floodplain was degraded before it was handed over.
    statement_hi: 22 अगस्त 2026 को सर्वोच्च न्यायालय (न्यायमूर्ति सतीश चंद्र शर्मा और न्यायमूर्ति नोंगमैकापम कोटिश्वर सिंह) ने एनजीटी के 7 दिसंबर 2017 के निर्णय को रद्द कर दिया, यह मानते हुए कि महोत्सव और कथित नुकसान के बीच कोई कारणात्मक संबंध स्थापित नहीं हुआ तथा समकालीन सामग्री, जिसमें फाउंडेशन का दिसंबर 2015 का वह पत्र भी शामिल है जिसमें स्थल पर पहले से मौजूद निर्माण मलबे का उल्लेख था, दिखाती है कि स्थल सौंपे जाने से पहले ही बाढ़ क्षेत्र क्षतिग्रस्त था।
    tier: closed
    date: 2026-08-22
    source_ids: [sri-sri-ravi-shankar-src-01, sri-sri-ravi-shankar-src-02, sri-sri-ravi-shankar-src-03]
  - id: sri-sri-ravi-shankar-claim-06
    case_id: sri-sri-ravi-shankar-ngt-yamuna-floodplain-2016
    statement_en: The Supreme Court held that the Tribunal had erred in equating "restoration" of the event site with a far larger "rehabilitation" of the floodplain, including construction of a biodiversity park the Foundation had never damaged, and that this exceeded the Tribunal's jurisdiction under section 15 of the National Green Tribunal Act.
    statement_hi: सर्वोच्च न्यायालय ने कहा कि अधिकरण ने कार्यक्रम स्थल के "पुनर्स्थापन" को बाढ़ क्षेत्र के कहीं बड़े "पुनर्वास" के साथ ग़लती से मिला दिया, जिसमें एक ऐसा जैव-विविधता पार्क बनाना भी शामिल था जिसे फाउंडेशन ने कभी क्षतिग्रस्त नहीं किया था, और यह एनजीटी अधिनियम की धारा 15 के तहत अधिकरण के अधिकार-क्षेत्र से बाहर था।
    tier: closed
    date: 2026-08-22
    source_ids: [sri-sri-ravi-shankar-src-01]
  - id: sri-sri-ravi-shankar-claim-07
    case_id: sri-sri-ravi-shankar-ngt-yamuna-floodplain-2016
    statement_en: The Supreme Court directed the Delhi Development Authority to refund the Rs 5 crore deposited by the Foundation within four weeks, while leaving undisturbed DDA's own responsibility to carry out rehabilitation of the Yamuna floodplain under its existing plan.
    statement_hi: सर्वोच्च न्यायालय ने दिल्ली विकास प्राधिकरण को फाउंडेशन द्वारा जमा किए गए 5 करोड़ रुपये चार सप्ताह के भीतर लौटाने का निर्देश दिया, जबकि यमुना बाढ़ क्षेत्र के पुनर्वास हेतु प्राधिकरण की अपनी मौजूदा योजना के तहत ज़िम्मेदारी को अपरिवर्तित रखा।
    tier: closed
    date: 2026-08-22
    source_ids: [sri-sri-ravi-shankar-src-01, sri-sri-ravi-shankar-src-03]

