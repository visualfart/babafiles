      मुंबई की एक सत्र अदालत ने अंततः राधे माँ को दहेज उत्पीड़न मामले से उन्मोचित कर दिया, यह मानते हुए कि
      उनके और शिकायतकर्ता के बीच कोई पारिवारिक संबंध (डोमेस्टिक रिलेशनशिप) नहीं था, जिसकी सूचना लगभग 2023
      में सामने आई।
    tier: discharged
    date: 2023
    source_ids: [radhe-maa-src-01]
  - id: radhe-maa-claim-04
    case_id: radhe-maa-obscenity-religious-complaints-2015
    statement_en: >
      Mumbai advocate Falguni Brahmbhatt complained in 2015 that Radhe Maa's practice of letting
      male devotees embrace and lift her amounted to obscenity under the Bombay Police Act; the
      Bombay High Court's division bench asked Mumbai police whether the offence of indecency and
      obscenity under section 110 of that Act was made out, and Kandivali police summoned her.
    statement_hi: >
      मुंबई की अधिवक्ता फाल्गुनी ब्रह्मभट्ट ने 2015 में शिकायत की कि राधे माँ द्वारा पुरुष भक्तों को गले
      लगाने व उठाने देने की प्रथा बॉम्बे पुलिस अधिनियम के तहत अश्लीलता है; बॉम्बे उच्च न्यायालय की खंडपीठ ने
      मुंबई पुलिस से पूछा कि क्या उक्त अधिनियम की धारा 110 के तहत अशिष्टता व अश्लीलता का अपराध बनता है, और
      कांदिवली पुलिस ने उन्हें समन भेजा।
    tier: allegation
    date: 2015
    source_ids: [radhe-maa-src-05]
  - id: radhe-maa-claim-05
    case_id: radhe-maa-obscenity-religious-complaints-2015
    statement_en: >
      Phagwara resident Surinder Mittal's 2015 complaint accused Radhe Maa of hurting religious
      sentiments and making threats; after police did not act despite an earlier High Court
      direction to examine the complaint, the Punjab and Haryana High Court on 5 September 2017
      issued a show-cause notice to the Kapurthala SSP asking why contempt proceedings should not
      be initiated against him for non-compliance.
    statement_hi: >
      फगवाड़ा निवासी सुरिंदर मित्तल की 2015 की शिकायत में राधे माँ पर धार्मिक भावनाएँ आहत करने और धमकी देने
      का आरोप था; शिकायत की जाँच के पहले के उच्च न्यायालय निर्देश के बावजूद पुलिस के कार्रवाई न करने पर,
      पंजाब एवं हरियाणा उच्च न्यायालय ने 5 सितंबर 2017 को कपूरथला के एसएसपी को यह नोटिस जारी किया कि
      अनुपालन न करने पर उनके विरुद्ध अवमानना कार्यवाही क्यों न शुरू की जाए।
    tier: allegation
    date: 2017-09-05
    source_ids: [radhe-maa-src-06]
  - id: radhe-maa-claim-06
    statement_en: >
      Television personality Dolly Bindra filed a police complaint in August 2015 accusing Radhe
      Maa of sexual harassment and voyeurism, and separately said she received threatening calls
      afterwards.
    statement_hi: >
      टीवी कलाकार डॉली बिंद्रा ने अगस्त 2015 में राधे माँ पर यौन उत्पीड़न व दृश्यरतिक्रीड़ा (वॉयरिज़्म) का
      आरोप लगाते हुए पुलिस शिकायत दर्ज कराई, और अलग से कहा कि इसके बाद उसे धमकी भरे फोन आए।
    tier: allegation
    date: 2015-08-13
    source_ids: [radhe-maa-src-08]
  - id: radhe-maa-claim-07
    statement_en: >
      On 10 September 2017 the Akhil Bharatiya Akhara Parishad, the apex body of Hindu akharas,
      released a list of 14 religious figures it asked governments to act against, and Radhe Maa
      (Sukhwinder Kaur) was among the names.
    statement_hi: >
      10 सितंबर 2017 को हिंदू अखाड़ों की शीर्ष संस्था अखिल भारतीय अखाड़ा परिषद ने 14 धार्मिक व्यक्तियों की
      एक सूची जारी की जिनके विरुद्ध उसने सरकारों से कार्रवाई की माँग की, और राधे माँ (सुखविंदर कौर) का नाम
      उनमें शामिल था।
    tier: allegation
    date: 2017-09-10
    source_ids: [radhe-maa-src-07]

