summary_en: >
  Radhe Maa (Sukhvinder Kaur) is a Mumbai-based self-styled godwoman. In 2015 a woman, Nikki
  Gupta, named her in a dowry-harassment complaint at Borivali police station alleging Radhe Maa
  instigated her in-laws to demand more dowry; a 2016 police chargesheet excluded Radhe Maa citing
  insufficient evidence, and after the complainant challenged that before the Bombay High Court,
  the Court in April 2017 directed police to record her statement and reassess the case. A Mumbai
  sessions court eventually discharged Radhe Maa, holding that no domestic relationship existed
  between her and the complainant. Separately, a 2015 complaint alleged obscenity in the way she
  let devotees embrace her, which the Bombay High Court asked police to examine, and a Punjab
  complainant's 2015 complaint accusing her of hurting religious sentiments led the Punjab and
  Haryana High Court, in 2017, to issue a contempt notice to a police officer for not acting on
  it; television personality Dolly Bindra separately filed a police complaint in 2015 accusing her
  of sexual harassment. In September 2017 the Akhil Bharatiya Akhara Parishad named her on a list
  of 14 religious figures it asked governments to act against. Radhe Maa has repeatedly denied wrongdoing,
  saying "I am innocent, pure and pious."
summary_hi: >
  राधे माँ (सुखविंदर कौर) मुंबई-आधारित एक स्वयंभू गॉडवुमन हैं। 2015 में एक महिला, निक्की गुप्ता, ने बोरीवली
  थाने में दहेज उत्पीड़न की शिकायत में राधे माँ का नाम लेते हुए आरोप लगाया कि उन्होंने उसके ससुराल वालों को
  अधिक दहेज माँगने के लिए उकसाया; 2016 की पुलिस आरोप-पत्र में सबूतों की कमी बताकर राधे माँ को बाहर रखा गया,
  और शिकायतकर्ता द्वारा इसे बॉम्बे उच्च न्यायालय में चुनौती देने के बाद, न्यायालय ने अप्रैल 2017 में पुलिस
  को उसका बयान दर्ज कर मामले का पुनर्मूल्यांकन करने का निर्देश दिया। मुंबई की एक सत्र अदालत ने अंततः राधे
  माँ को उन्मोचित कर दिया, यह मानते हुए कि उनके और शिकायतकर्ता के बीच कोई पारिवारिक संबंध (डोमेस्टिक
  रिलेशनशिप) नहीं था। अलग से, 2015 की एक शिकायत में उनके भक्तों को गले लगाने देने के तरीके को अश्लील बताया
  गया, जिसकी जाँच के लिए बॉम्बे उच्च न्यायालय ने पुलिस से पूछा, और पंजाब के एक शिकायतकर्ता की 2015 की उस
  शिकायत, जिसमें उन पर धार्मिक भावनाएँ आहत करने का आरोप था, के चलते पंजाब एवं हरियाणा उच्च न्यायालय ने 2017
  में कार्रवाई न करने पर एक पुलिस अधिकारी को अवमानना नोटिस जारी किया; टीवी कलाकार डॉली बिंद्रा ने अलग से
  2015 में उन पर यौन उत्पीड़न का आरोप लगाते हुए पुलिस शिकायत दर्ज कराई। सितंबर 2017 में अखिल भारतीय अखाड़ा
  परिषद ने उन्हें अपनी उस सूची में नामित किया जिसके विरुद्ध कार्रवाई की माँग सरकारों से की गई थी। राधे माँ
  ने बार-बार गलत काम से इनकार करते हुए कहा है, "मैं निर्दोष, पवित्र और पूज्य हूँ।"
hi_reviewed: false
response_from_subject:
  text_en: >
    At a press conference after the dowry-harassment allegation surfaced, Radhe Maa said: "I have
    not hurt anyone.... I am innocent, pure and pious," and asked why she would take money from a
    poor complainant when she had not taken anything from daughters-in-law "who belong to royal
    families." She said, "Check my bank accounts. If you find a single paisa earned by wrong
    means, I will kill myself."
  text_hi: >
    दहेज उत्पीड़न का आरोप सामने आने के बाद एक प्रेस कॉन्फ़्रेंस में राधे माँ ने कहा: "मैंने किसी को नुकसान
    नहीं पहुँचाया.... मैं निर्दोष, पवित्र और पूज्य हूँ," और पूछा कि जब उन्होंने "शाही परिवारों से" आईं
    अपनी बहुओं से कुछ नहीं लिया, तो एक ग़रीब शिकायतकर्ता से पैसे क्यों लेंगी। उन्होंने कहा, "मेरे बैंक खाते
    जाँच लो। अगर एक पैसा भी ग़लत तरीके से कमाया मिला, तो मैं आत्महत्या कर लूँगी।"
  source_id: radhe-maa-src-02

