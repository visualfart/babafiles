cases:
  - id: radhe-maa-mumbai-dowry-case-2015
    title_en: State v. Radhe Maa and others (Borivali dowry-harassment case)
    title_hi: राज्य बनाम राधे माँ एवं अन्य (बोरीवली दहेज उत्पीड़न मामला)
    jurisdiction_country: IN
    jurisdiction_region: Maharashtra
    court: Borivali police station; Bombay High Court; Sessions Court, Mumbai (discharge)
    case_number: FIR registered August 2015, Borivali police station, on the complaint of Nikki Gupta (FIR number not located)
    filed_year: 2015
    case_type: criminal
    statutes: [IPC 498A, Dowry Prohibition Act 1961]
    status: discharged; sessions court found no domestic relationship existed between Radhe Maa and the complainant
    tier: discharged
    verdict_date: 2023
    sentence_or_remedy: Discharged
    appeal_status: Not applicable
    summary_en: >
      In 2015 Nikki Gupta filed a dowry-harassment complaint against her husband, in-laws and
      Radhe Maa at Borivali police station, Mumbai, alleging Radhe Maa instigated her in-laws,
      long-time followers of hers, to demand dowry beyond what her family had given at her
      wedding. Police issued summons to Radhe Maa as the seventh accused. A 2016 police
      chargesheet named six of the complainant's in-laws but excluded Radhe Maa, citing
      insufficient evidence, without informing the complainant. After the complainant approached
      the Bombay High Court, it directed the Borivali police in April 2017 to record her statement
      and reassess the case. The proceedings continued for several years; a Mumbai sessions court
      eventually discharged Radhe Maa, holding that no domestic relationship existed between her
      and the complainant, a finding reported around 2023.
    summary_hi: >
      2015 में निक्की गुप्ता ने मुंबई के बोरीवली थाने में अपने पति, ससुराल वालों और राधे माँ के विरुद्ध दहेज
      उत्पीड़न की शिकायत दर्ज कराई, यह आरोप लगाते हुए कि राधे माँ ने अपने पुराने अनुयायी रहे उसके ससुराल
      वालों को उसकी शादी में परिवार द्वारा दिए गए से अधिक दहेज माँगने के लिए उकसाया। पुलिस ने सातवें अभियुक्त
      के रूप में राधे माँ को समन जारी किया। 2016 की पुलिस आरोप-पत्र में शिकायतकर्ता के छह ससुराल वालों के
      नाम थे लेकिन सबूतों की कमी बताकर राधे माँ को बाहर रखा गया, बिना शिकायतकर्ता को सूचित किए। शिकायतकर्ता
      के बॉम्बे उच्च न्यायालय जाने के बाद, न्यायालय ने अप्रैल 2017 में बोरीवली पुलिस को उसका बयान दर्ज कर
      मामले का पुनर्मूल्यांकन करने का निर्देश दिया। कार्यवाही कई वर्षों तक चली; मुंबई की एक सत्र अदालत ने
      अंततः राधे माँ को उन्मोचित कर दिया, यह मानते हुए कि उनके और शिकायतकर्ता के बीच कोई पारिवारिक संबंध
      नहीं था, जिसकी सूचना लगभग 2023 में सामने आई।
    source_ids: [radhe-maa-src-01, radhe-maa-src-02, radhe-maa-src-03, radhe-maa-src-04]

  - id: radhe-maa-obscenity-religious-complaints-2015
    title_en: Obscenity and public-order complaints against Radhe Maa (Mumbai and Punjab, 2015-2017)
    title_hi: राधे माँ के विरुद्ध अश्लीलता व सार्वजनिक व्यवस्था संबंधी शिकायतें (मुंबई व पंजाब, 2015-2017)
    jurisdiction_country: IN
    jurisdiction_region: Maharashtra; Punjab
    court: Bombay High Court; Punjab and Haryana High Court
    case_number: >
      Complaint of advocate Falguni Brahmbhatt before Bombay police/High Court (2015); complaint
      of Surinder Mittal, Phagwara, before Punjab and Haryana High Court (CWP concerning
      Kapurthala SSP's inaction, 2015-2017)
    filed_year: 2015
    case_type: criminal
    statutes: [Bombay Police Act s.110]
    status: complaints pursued through the courts; no chargesheet, conviction or closure order located
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      In 2015 Mumbai advocate Falguni Brahmbhatt complained that Radhe Maa's practice of letting
      male devotees embrace and lift her amounted to obscenity under the Bombay Police Act; the
      Bombay High Court asked police to examine whether the offence was made out, and Kandivali
      police summoned her. Separately, Phagwara resident Surinder Mittal's 2015 complaint accused
      her of hurting religious sentiments and making threats; when police did not act despite an
      earlier High Court direction, the Punjab and Haryana High Court in September 2017 issued a
      show-cause notice to the Kapurthala SSP asking why he should not face contempt proceedings.
      No chargesheet, conviction or formal closure in either matter was located in the sources
      checked.
    summary_hi: >
      2015 में मुंबई की अधिवक्ता फाल्गुनी ब्रह्मभट्ट ने शिकायत की कि राधे माँ द्वारा पुरुष भक्तों को गले
      लगाने व उठाने देने की प्रथा बॉम्बे पुलिस अधिनियम के तहत अश्लीलता है; बॉम्बे उच्च न्यायालय ने पुलिस से
      यह जाँचने को कहा कि क्या यह अपराध बनता है, और कांदिवली पुलिस ने उन्हें समन भेजा। अलग से, फगवाड़ा
      निवासी सुरिंदर मित्तल की 2015 की शिकायत में उन पर धार्मिक भावनाएँ आहत करने और धमकी देने का आरोप था;
      पहले के उच्च न्यायालय निर्देश के बावजूद पुलिस के कार्रवाई न करने पर, पंजाब एवं हरियाणा उच्च न्यायालय
      ने सितंबर 2017 में कपूरथला के एसएसपी को यह नोटिस जारी किया कि उनके विरुद्ध अवमानना कार्यवाही क्यों न
      शुरू की जाए। जाँची गई सामग्री में दोनों मामलों में किसी आरोप-पत्र, दोषसिद्धि या औपचारिक समापन आदेश की
      जानकारी नहीं मिली।
    source_ids: [radhe-maa-src-05, radhe-maa-src-06]

