summary_en: >
  Chandraswami (Nemi Chand Jain), a self-styled tantric who cultivated ties with Indian
  prime ministers and foreign figures from the 1970s onward, faced two major criminal
  prosecutions arising from the CBI's investigations of the early 1990s: a forgery case over
  a fabricated bank account said to implicate V.P. Singh's son at a St Kitts bank (in which
  the trial court framed charges against him in 1997, upheld by the Delhi High Court on
  revision in 1999, and a special court acquitted him on 25 October 2004), and a cheating case
  brought by London-based businessman Lakhubhai Pathak alleging he took USD 100,000 on a false
  promise of a government contract (in which a special court acquitted Chandraswami, former
  prime minister P.V. Narasimha Rao and Chandraswami's aide K.N. Aggarwal on 22 December 2003).
  Separately, the Enforcement Directorate adjudicated FERA/FCRA violations against him and
  imposed a penalty of roughly Rs 9.65 crore, which he did not pay and challenged up to the
  Supreme Court; by 2008 ten related criminal complaints for FERA/FCRA violations were still
  pending against him, and in June 2011 press reports recorded a Rs 9 crore FERA fine against
  him as still standing. He was never convicted in either of the two criminal cases described
  here. He died in New Delhi in 2017.
summary_hi: >
  चन्द्रस्वामी (नेमी चंद जैन), एक स्वयंभू तांत्रिक जिन्होंने 1970 के दशक से भारत के प्रधानमंत्रियों और
  विदेशी हस्तियों के साथ संबंध बनाए, को 1990 के दशक की शुरुआत में सीबीआई की जांच से उपजे दो प्रमुख
  आपराधिक मुकदमों का सामना करना पड़ा: एक जालसाजी का मामला, जिसमें वी.पी. सिंह के पुत्र को सेंट किट्स
  के एक बैंक खाते में फंसाने के लिए कथित रूप से जाली दस्तावेज़ बनाए गए थे (जिसमें विचारण न्यायालय ने
  1997 में उन पर आरोप तय किए, दिल्ली उच्च न्यायालय ने 1999 में पुनरीक्षण में इसे बरकरार रखा, और एक
  विशेष अदालत ने 25 अक्टूबर 2004 को उन्हें बरी कर दिया), और लंदन स्थित व्यवसायी लखूभाई पाठक द्वारा
  लाया गया धोखाधड़ी का मामला, जिसमें आरोप था कि उन्होंने सरकारी अनुबंध दिलाने के झूठे वादे पर 1,00,000
  अमेरिकी डॉलर लिए (जिसमें एक विशेष अदालत ने 22 दिसंबर 2003 को चन्द्रस्वामी, पूर्व प्रधानमंत्री पी.वी.
  नरसिम्हा राव और चन्द्रस्वामी के सहयोगी के.एन. अग्रवाल को बरी कर दिया)। अलग से, प्रवर्तन निदेशालय ने
  उनके विरुद्ध फेरा/फेमा उल्लंघन का न्यायनिर्णयन कर लगभग 9.65 करोड़ रुपये का जुर्माना लगाया, जिसे उन्होंने
  नहीं चुकाया और सर्वोच्च न्यायालय तक चुनौती दी; 2008 तक फेरा/एफसीआरए उल्लंघन के दस संबंधित आपराधिक
  मामले उनके विरुद्ध लंबित थे, और जून 2011 की प्रेस रिपोर्टों में उन पर 9 करोड़ रुपये का फेरा जुर्माना
  अब भी बकाया दर्ज किया गया। यहाँ वर्णित दोनों आपराधिक मामलों में से किसी में भी उन्हें दोषी नहीं ठहराया
  गया। 2017 में नई दिल्ली में उनका निधन हो गया।
hi_reviewed: false

