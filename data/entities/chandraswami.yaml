cases:
  - id: chandraswami-stkitts-forgery-1989
    title_en: State v. Chandraswami and others (St Kitts bank-account forgery case)
    title_hi: राज्य बनाम चन्द्रस्वामी एवं अन्य (सेंट किट्स बैंक-खाता जालसाजी मामला)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: Special Judge, CBI, New Delhi (trial); Delhi High Court (revision, 1999)
    case_number: Crl. Rev. 283/97, 385/97 and 341/97 (Delhi High Court); trial court case number not on record
    filed_year: 1989
    case_type: criminal
    statutes: ["IPC 120-B", "IPC 195", "IPC 469", "IPC 471"]
    status: acquitted
    tier: acquitted
    verdict_date: 2004-10-25
    sentence_or_remedy: Acquitted
    appeal_status: No appeal against the acquittal located.
    summary_en: >
      The CBI's case, arising from a 1989 news report alleging that V.P. Singh's son Ajeya
      Singh held USD 21 million in a numbered account at the First Trust Corporation Ltd, St
      Kitts, was that Chandraswami, his aide K.N. Aggarwal ("Mamaji"), then external affairs
      minister P.V. Narasimha Rao, K.K. Tewari and others conspired between 1988 and October
      1989 to fabricate documents purporting to show such an account, in order to damage V.P.
      Singh politically before the 1989 general election. A CBI chargesheet followed in
      September 1996. In June 1997 the Special Judge discharged Rao and Tewari for insufficient
      evidence but framed formal charges of conspiracy, forgery and fabricating false evidence
      against Chandraswami and Aggarwal; on revision, the Delhi High Court on 23 December 1999
      upheld both the charge-framing against Chandraswami and Aggarwal and the discharge of Rao
      and Tewari. Trial opened on 28 July 1997 and the prosecution closed its evidence on 4
      April 2004; Aggarwal died on 31 August 2004 before judgment. On 25 October 2004 Special
      Judge Dinesh Dayal acquitted Chandraswami, finding that forged documents had indeed
      circulated but that the prosecution had failed to prove who forged them, after its central
      witnesses (CBI officer A.P. Nanday, businessman Larry J. Kolb and bank official George D.
      McLean) had died, gone missing or were unavailable.
    summary_hi: >
      सीबीआई का मामला 1989 की एक समाचार रिपोर्ट से उपजा, जिसमें आरोप था कि वी.पी. सिंह के पुत्र
      अजेय सिंह के पास सेंट किट्स स्थित फर्स्ट ट्रस्ट कॉरपोरेशन लिमिटेड में 21 मिलियन अमेरिकी डॉलर
      का एक क्रमांकित खाता है। अभियोजन का मामला था कि चन्द्रस्वामी, उनके सहयोगी के.एन. अग्रवाल
      ("मामाजी"), तत्कालीन विदेश मंत्री पी.वी. नरसिम्हा राव, के.के. तिवारी और अन्य ने 1988 से
      अक्टूबर 1989 के बीच ऐसे खाते को दर्शाने वाले दस्तावेज़ गढ़ने की साज़िश रची, ताकि 1989 के
      आम चुनाव से पहले वी.पी. सिंह को राजनीतिक रूप से नुकसान पहुँचाया जा सके। सितंबर 1996 में
      सीबीआई का आरोप-पत्र दाखिल हुआ। जून 1997 में विशेष न्यायाधीश ने साक्ष्य के अभाव में राव और
      तिवारी को उन्मुक्त कर दिया, परंतु चन्द्रस्वामी और अग्रवाल पर षड्यंत्र, जालसाजी और झूठे साक्ष्य
      गढ़ने के औपचारिक आरोप तय किए; पुनरीक्षण में, दिल्ली उच्च न्यायालय ने 23 दिसंबर 1999 को
      चन्द्रस्वामी और अग्रवाल पर आरोप तय करने तथा राव और तिवारी की उन्मुक्ति दोनों को बरकरार रखा।
      विचारण 28 जुलाई 1997 को शुरू हुआ और अभियोजन पक्ष ने 4 अप्रैल 2004 को साक्ष्य प्रस्तुत करना
      पूरा किया; निर्णय से पहले 31 अगस्त 2004 को अग्रवाल की मृत्यु हो गई। 25 अक्टूबर 2004 को विशेष
      न्यायाधीश दिनेश दयाल ने चन्द्रस्वामी को बरी करते हुए पाया कि जाली दस्तावेज़ वास्तव में प्रचलन
      में आए थे, परंतु अभियोजन पक्ष यह साबित नहीं कर सका कि उन्हें किसने गढ़ा, क्योंकि उसके प्रमुख
      गवाह (सीबीआई अधिकारी ए.पी. नंदी, व्यवसायी लैरी जे. कोल्ब और बैंक अधिकारी जॉर्ज डी. मैकलीन)
      या तो मर चुके थे, लापता थे, या उपलब्ध नहीं थे।
    source_ids: [chandra-src-01, chandra-src-02, chandra-src-05]

  - id: chandraswami-lakhubhai-pathak-cheating-1988
    title_en: State v. Chandraswami, P.V. Narasimha Rao and K.N. Aggarwal (Lakhubhai Pathak cheating case)
    title_hi: राज्य बनाम चन्द्रस्वामी, पी.वी. नरसिम्हा राव एवं के.एन. अग्रवाल (लखूभाई पाठक धोखाधड़ी मामला)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: Special Judge, New Delhi (special court sitting at the Vigyan Bhavan annexe)
    case_number: FIR registered 5 February 1988; trial court case number not on record
    filed_year: 1988
    case_type: criminal
    statutes: ["IPC 420", "IPC 120-B"]
    status: acquitted
    tier: acquitted
    verdict_date: 2003-12-22
    sentence_or_remedy: Acquitted
    appeal_status: No appeal against the acquittal located.
    summary_en: >
      London-based businessman Lakhubhai Pathak alleged that at a meeting at the Hotel Helmsley
      Palace (Holorum House) in New York in December 1983, Chandraswami and Aggarwal introduced
      him to P.V. Narasimha Rao, then external affairs minister, who assured him a government
      contract to supply newsprint and paper pulp to India; that Chandraswami then demanded USD
      100,000 as proof of Pathak's financial soundness; and that Pathak paid this sum by two
      cheques on 4 January 1984, after which the promised contract never materialised. Pathak
      complained to the CBI in September 1987; an FIR followed on 5 February 1988. The CBI
      chargesheeted Chandraswami and Aggarwal on 12 April 1996; the Chief Metropolitan
      Magistrate framed charges against them on 21 May 1996 and, after Pathak named Rao as an
      accused, found grounds to proceed against Rao too; the Delhi High Court upheld this on 30
      July 1996 and the Supreme Court, after directing transfer of the case out of Delhi's
      ordinary courts, allowed formal charges to be framed against all three accused on 6
      November 1996. Pathak died on 1 April 1997 while the case was still at an early stage;
      the prosecution completed its evidence by 2 May 2000 and the defence by January 2002.
      Final arguments concluded and, on 22 December 2003, Special Judge Dinesh Dayal acquitted
      Rao, Chandraswami and Aggarwal, holding the prosecution had not proved the conspiracy.
    summary_hi: >
      लंदन स्थित व्यवसायी लखूभाई पाठक ने आरोप लगाया कि दिसंबर 1983 में न्यूयॉर्क के होटल हेल्म्सली
      पैलेस (होलोरम हाउस) में हुई एक बैठक में चन्द्रस्वामी और अग्रवाल ने उनका परिचय तत्कालीन विदेश
      मंत्री पी.वी. नरसिम्हा राव से कराया, जिन्होंने उन्हें भारत को न्यूज़प्रिंट और पेपर पल्प आपूर्ति
      करने का सरकारी अनुबंध दिलाने का आश्वासन दिया; कि चन्द्रस्वामी ने तब पाठक की वित्तीय सक्षमता के
      प्रमाण के रूप में 1,00,000 अमेरिकी डॉलर की मांग की; और पाठक ने 4 जनवरी 1984 को दो चेकों के
      माध्यम से यह राशि दी, जिसके बाद वादा किया गया अनुबंध कभी साकार नहीं हुआ। पाठक ने सितंबर 1987
      में सीबीआई से शिकायत की; 5 फरवरी 1988 को एफआईआर दर्ज हुई। सीबीआई ने 12 अप्रैल 1996 को
      चन्द्रस्वामी और अग्रवाल के विरुद्ध आरोप-पत्र दाखिल किया; मुख्य महानगर मजिस्ट्रेट ने 21 मई
      1996 को उन पर आरोप तय किए और, पाठक द्वारा राव को अभियुक्त बताए जाने के बाद, राव के विरुद्ध
      भी आगे बढ़ने के आधार पाए; दिल्ली उच्च न्यायालय ने 30 जुलाई 1996 को इसे बरकरार रखा और सर्वोच्च
      न्यायालय ने, मामले को दिल्ली की सामान्य अदालतों से स्थानांतरित करने का निर्देश देने के बाद,
      6 नवंबर 1996 को तीनों अभियुक्तों पर औपचारिक आरोप तय करने की अनुमति दी। मामला अभी प्रारंभिक
      चरण में ही था कि 1 अप्रैल 1997 को पाठक की मृत्यु हो गई; अभियोजन पक्ष ने 2 मई 2000 तक और
      बचाव पक्ष ने जनवरी 2002 तक अपने साक्ष्य पूरे किए। अंतिम बहस के बाद, 22 दिसंबर 2003 को विशेष
      न्यायाधीश दिनेश दयाल ने राव, चन्द्रस्वामी और अग्रवाल को यह मानते हुए बरी कर दिया कि अभियोजन
      पक्ष साज़िश साबित नहीं कर सका।
    source_ids: [chandra-src-02, chandra-src-03, chandra-src-04]

  - id: chandraswami-fera-fcra-violations
    title_en: Enforcement Directorate v. Chandraswami (FERA/FCRA adjudication and prosecutions)
    title_hi: प्रवर्तन निदेशालय बनाम चन्द्रस्वामी (फेरा/एफसीआरए न्यायनिर्णयन एवं अभियोजन)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: Enforcement Directorate (adjudication); Delhi High Court (revision on bail/travel conditions, 2008); Supreme Court of India (SLP against penalty)
    case_number: Ten criminal complaints pending as of 2008 (Crl. Rev. Petition Nos. 753-761 of 2007 and 772 of 2007, Delhi High Court); adjudication order number not on record
    filed_year: 1996
    case_type: regulatory
    statutes: ["FERA 1973 s.8(1)", "FERA 1973 s.56", "FCRA 1976"]
    status: penalty imposed and not paid; SLP against it pending as of 2008; press reports record the fine as still standing in June 2011
    tier: regulatory_action
    verdict_date:
    sentence_or_remedy: Penalty of approximately Rs 9.65 crore (reported elsewhere as Rs 9 crore) imposed by the Enforcement Directorate for FERA/FCRA violations
    appeal_status: >
      A Special Leave Petition against the penalty was pending in the Supreme Court as of
      January 2008. Press reporting in June 2011 recorded the Rs 9 crore FERA fine as still
      outstanding against him; no further confirmed update on the SLP's outcome was located.
    summary_en: >
      Separately from the two criminal cases above, the Enforcement Directorate investigated
      Chandraswami for violations of the Foreign Exchange Regulation Act, 1973 and the Foreign
      Contribution (Regulation) Act, 1976, and, on adjudication, imposed a penalty reported by
      the Delhi High Court in 2008 as "Rs. 9.65 crores", which he did not pay; a Special Leave
      Petition against the penalty was pending in the Supreme Court. By January 2008 ten
      separate criminal complaints for FERA/FCRA violations under section 8(1) read with section
      56 of FERA were pending against him in Delhi's courts, in which he was on conditional
      bail; the Delhi High Court that month allowed him to travel abroad in nine of the ten
      cases subject to sureties and fixed deposits. Press reporting after his death in 2017
      recorded that he had been arrested in 1996 in connection with a cheating allegation by a
      London-based businessman (matching the Lakhubhai Pathak case, above) and separately faced
      multiple FERA charges from the ED, and that in June 2011 the Rs 9 crore FERA fine still
      stood against him.
    summary_hi: >
      ऊपर वर्णित दोनों आपराधिक मामलों से अलग, प्रवर्तन निदेशालय ने चन्द्रस्वामी की विदेशी मुद्रा
      विनियमन अधिनियम 1973 (फेरा) और विदेशी अंशदान (विनियमन) अधिनियम 1976 (एफसीआरए) के उल्लंघन की
      जांच की, और न्यायनिर्णयन में, दिल्ली उच्च न्यायालय द्वारा 2008 में "9.65 करोड़ रुपये" बताया
      गया जुर्माना लगाया, जिसे उन्होंने नहीं चुकाया; जुर्माने के विरुद्ध सर्वोच्च न्यायालय में एक
      विशेष अनुमति याचिका लंबित थी। जनवरी 2008 तक फेरा की धारा 8(1)/56 के तहत दस अलग-अलग आपराधिक
      मामले दिल्ली की अदालतों में उनके विरुद्ध लंबित थे, जिनमें वे सशर्त ज़मानत पर थे; उस महीने दिल्ली
      उच्च न्यायालय ने दस में से नौ मामलों में उन्हें ज़मानती और सावधि जमा के अधीन विदेश यात्रा की
      अनुमति दी। 2017 में उनके निधन के बाद की प्रेस रिपोर्टों में दर्ज है कि उन्हें 1996 में लंदन
      स्थित एक व्यवसायी की धोखाधड़ी की शिकायत (ऊपर वर्णित लखूभाई पाठक मामले से मेल खाता) के सिलसिले
      में गिरफ्तार किया गया था और अलग से ईडी की ओर से कई फेरा आरोपों का सामना करना पड़ा, तथा जून
      2011 में उन पर 9 करोड़ रुपये का फेरा जुर्माना अब भी बकाया था।
    source_ids: [chandra-src-02, chandra-src-06]

claims:
  - id: chandra-claim-01
    case_id: chandraswami-stkitts-forgery-1989
    statement_en: In June 1997 the Special Judge, CBI, New Delhi framed formal charges of criminal conspiracy, forgery and fabricating false evidence (IPC 120-B, 195, 469, 471) against Chandraswami and K.N. Aggarwal in the St Kitts forgery case, while discharging co-accused P.V. Narasimha Rao and K.K. Tewari for insufficient evidence; the Delhi High Court upheld both rulings on revision on 23 December 1999.
    statement_hi: जून 1997 में दिल्ली के विशेष न्यायाधीश (सीबीआई) ने सेंट किट्स जालसाजी मामले में चन्द्रस्वामी और के.एन. अग्रवाल पर आपराधिक षड्यंत्र, जालसाजी और झूठे साक्ष्य गढ़ने (आईपीसी 120-बी, 195, 469, 471) के औपचारिक आरोप तय किए, जबकि सह-अभियुक्त पी.वी. नरसिम्हा राव और के.के. तिवारी को साक्ष्य के अभाव में उन्मुक्त कर दिया; दिल्ली उच्च न्यायालय ने 23 दिसंबर 1999 को पुनरीक्षण में दोनों निर्णयों को बरकरार रखा।
    tier: charged
    date: 1997-06
    source_ids: [chandra-src-01]
  - id: chandra-claim-02
    case_id: chandraswami-stkitts-forgery-1989
    statement_en: On 25 October 2004 Special Judge Dinesh Dayal acquitted Chandraswami in the St Kitts forgery case, finding that while forged documents had circulated, the prosecution had failed to prove who forged them.
    statement_hi: 25 अक्टूबर 2004 को विशेष न्यायाधीश दिनेश दयाल ने सेंट किट्स जालसाजी मामले में चन्द्रस्वामी को यह पाते हुए बरी कर दिया कि जाली दस्तावेज़ प्रचलन में आए थे, परंतु अभियोजन पक्ष यह साबित नहीं कर सका कि उन्हें किसने गढ़ा।
    tier: acquitted
    date: 2004-10-25
    source_ids: [chandra-src-05]
  - id: chandra-claim-03
    case_id: chandraswami-lakhubhai-pathak-cheating-1988
    statement_en: On 6 November 1996 formal charges of cheating and criminal conspiracy (IPC 420, 120-B) were framed against Chandraswami, P.V. Narasimha Rao and K.N. Aggarwal in the case brought on Lakhubhai Pathak's complaint that he was cheated of USD 100,000 in 1984 on a false promise of a government contract.
    statement_hi: 6 नवंबर 1996 को लखूभाई पाठक की शिकायत पर आधारित मामले में चन्द्रस्वामी, पी.वी. नरसिम्हा राव और के.एन. अग्रवाल पर धोखाधड़ी और आपराधिक षड्यंत्र (आईपीसी 420, 120-बी) के औपचारिक आरोप तय किए गए, जिसमें आरोप था कि 1984 में सरकारी अनुबंध के झूठे वादे पर उनसे 1,00,000 अमेरिकी डॉलर की धोखाधड़ी की गई।
    tier: allegation
    date: 1996-11-06
    source_ids: [chandra-src-03]
  - id: chandra-claim-04
    case_id: chandraswami-lakhubhai-pathak-cheating-1988
    statement_en: On 22 December 2003 Special Judge Dinesh Dayal acquitted Chandraswami, former prime minister P.V. Narasimha Rao and K.N. Aggarwal in the Lakhubhai Pathak cheating case, holding that the prosecution had not proved the alleged conspiracy.
    statement_hi: 22 दिसंबर 2003 को विशेष न्यायाधीश दिनेश दयाल ने लखूभाई पाठक धोखाधड़ी मामले में चन्द्रस्वामी, पूर्व प्रधानमंत्री पी.वी. नरसिम्हा राव और के.एन. अग्रवाल को यह मानते हुए बरी कर दिया कि अभियोजन पक्ष आरोपित साज़िश साबित नहीं कर सका।
    tier: acquitted
    date: 2003-12-22
    source_ids: [chandra-src-03, chandra-src-04, chandra-src-02]
  - id: chandra-claim-05
    case_id: chandraswami-fera-fcra-violations
    statement_en: By adjudication order, the Enforcement Directorate imposed a penalty of approximately Rs 9.65 crore on Chandraswami for FERA/FCRA violations, which remained unpaid, with a Special Leave Petition against it pending in the Supreme Court as of January 2008; press reporting recorded a Rs 9 crore FERA fine against him as still outstanding in June 2011.
    statement_hi: न्यायनिर्णयन आदेश द्वारा, प्रवर्तन निदेशालय ने फेरा/एफसीआरए उल्लंघन के लिए चन्द्रस्वामी पर लगभग 9.65 करोड़ रुपये का जुर्माना लगाया, जो अवैतनिक रहा, और जनवरी 2008 तक इसके विरुद्ध सर्वोच्च न्यायालय में एक विशेष अनुमति याचिका लंबित थी; जून 2011 की प्रेस रिपोर्टों में उन पर 9 करोड़ रुपये का फेरा जुर्माना अब भी बकाया दर्ज किया गया।
    tier: regulatory_action
    date: 2008-01-31
    source_ids: [chandra-src-02, chandra-src-06]
  - id: chandra-claim-06
    case_id: chandraswami-fera-fcra-violations
    statement_en: By January 2008 ten separate criminal complaints for violations of section 8(1) read with section 56 of FERA were pending against Chandraswami in Delhi's courts, in which he was on conditional bail subject to surrendering his passport and seeking prior court permission to travel.
    statement_hi: जनवरी 2008 तक फेरा की धारा 8(1) व 56 के उल्लंघन के दस अलग-अलग आपराधिक मामले दिल्ली की अदालतों में चन्द्रस्वामी के विरुद्ध लंबित थे, जिनमें वे पासपोर्ट जमा कराने और यात्रा हेतु न्यायालय की पूर्व अनुमति लेने की शर्त पर सशर्त ज़मानत पर थे।
    tier: regulatory_action
    date: 2008-01-31
    source_ids: [chandra-src-02]

