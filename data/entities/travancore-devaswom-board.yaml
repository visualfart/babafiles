id: travancore-devaswom-board
type: temple_trust
is_subject: true
name_en: Travancore Devaswom Board
name_hi: त्रावणकोर देवस्वम बोर्ड
aliases: [TDB, Thiruvithamkoor Devaswom Board]
base_location: Thiruvananthapuram, Kerala
country: IN
countries_of_operation: [IN]
organisations: [Sabarimala Sree Dharma Sastha Temple]
activity_status: active
abap_2017_list: false
summary_en: >
  The Travancore Devaswom Board is the statutory body that administers the Sabarimala
  Ayyappa temple and other temples in southern Kerala. In September 2025 the Kerala High
  Court, acting suo motu on a report of the Sabarimala Special Commissioner, found that
  gold-clad copper coverings of the Dwarapalaka idols had been removed and sent to a
  Chennai firm without prior intimation, and that records from 2019 showed an unexplained
  weight reduction of 4.541 kg in gold-clad plates described in board records as "copper
  plates". On 6 October 2025 the court constituted a Special Investigation Team, which
  registered two crimes (Dwarapalaka idols and Sreekovil door frames) and has arrested the
  sponsor, former board officials, three former board presidents, a board member and the
  chief priest. The Enforcement Directorate registered a money-laundering case in January
  2026. As of September 2026 no final report had been filed; the High Court has directed the
  door-frame chargesheet to be filed by 25 September 2026.
summary_hi: >
  त्रावणकोर देवस्वम बोर्ड केरल का वह वैधानिक निकाय है जो सबरीमला अय्यप्पा मंदिर और दक्षिणी
  केरल के अन्य मंदिरों का प्रशासन करता है। सितंबर 2025 में केरल उच्च न्यायालय ने सबरीमला विशेष
  आयुक्त की रिपोर्ट पर स्वतः संज्ञान लेते हुए पाया कि द्वारपालक मूर्तियों के स्वर्ण-जड़ित तांबे के
  आवरण बिना पूर्व सूचना के हटाकर चेन्नई की एक फर्म को भेजे गए, और 2019 के अभिलेखों में
  "तांबे की प्लेटें" बताई गई स्वर्ण-जड़ित प्लेटों के वज़न में 4.541 किलोग्राम की अस्पष्ट कमी दर्ज
  थी। 6 अक्टूबर 2025 को न्यायालय ने विशेष जांच दल (SIT) गठित किया, जिसने दो अपराध (द्वारपालक
  मूर्तियाँ और श्रीकोविल के दरवाज़े की चौखटें) दर्ज किए और प्रायोजक, बोर्ड के पूर्व अधिकारियों, तीन
  पूर्व बोर्ड अध्यक्षों, एक सदस्य और मुख्य पुजारी को गिरफ्तार किया। प्रवर्तन निदेशालय ने जनवरी 2026
  में धन-शोधन का मामला दर्ज किया। सितंबर 2026 तक कोई अंतिम रिपोर्ट दाखिल नहीं हुई थी; उच्च
  न्यायालय ने दरवाज़े की चौखट मामले का आरोप-पत्र 25 सितंबर 2026 तक दाखिल करने का निर्देश दिया है।
hi_reviewed: false
response_from_subject:
  text_en: >
    The board's standing counsel asked the High Court on 6 October 2025 to take up the matter
    because "vital information" had been received by its Chief Vigilance and Security Officer,
    whose inquiry the court later described as "creditable work to bring out the
    irregularities". On 14 October 2025 the board suspended an assistant engineer for
    recording the gold plating as copper and decided to issue notices to retired employees
    arraigned in the SIT case; press reports of 16 October 2025 said two officials had been
    suspended and notices served on retired employees named by investigators.
  text_hi: >
    बोर्ड के स्थायी वकील ने 6 अक्टूबर 2025 को उच्च न्यायालय से मामला लेने का अनुरोध किया क्योंकि
    इसके मुख्य सतर्कता एवं सुरक्षा अधिकारी को "महत्वपूर्ण जानकारी" मिली थी; न्यायालय ने बाद में
    उनकी जांच को "अनियमितताएँ उजागर करने का सराहनीय कार्य" बताया। 14 अक्टूबर 2025 को बोर्ड ने
    स्वर्ण-लेपन को तांबा दर्ज करने के आरोप में एक सहायक अभियंता को निलंबित किया और SIT मामले में
    आरोपित सेवानिवृत्त कर्मचारियों को नोटिस देने का निर्णय लिया।
  source_id: tdb-src-08

