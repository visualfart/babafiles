cases:
  - id: tdb-sabarimala-dwarapalaka-gold-2025
    title_en: Suo Motu v. State of Kerala (Sabarimala Dwarapalaka gold), Kerala High Court
    title_hi: स्वतः संज्ञान बनाम केरल राज्य (सबरीमला द्वारपालक स्वर्ण), केरल उच्च न्यायालय
    jurisdiction_country: IN
    jurisdiction_region: Kerala
    court: High Court of Kerala, Ernakulam (Division Bench)
    case_number: SSCR No. 23 of 2025; WP(C) No. 40608 of 2025
    filed_year: 2025
    case_type: inquiry
    statutes: [BNS 2023 s.316(2), BNS 2023 s.316(5), BNS 2023 s.336(2), BNS 2023 s.61(2) r/w s.3(5)]
    status: pending; court-monitored SIT investigation, final reports not yet filed
    tier: under_investigation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      Court-monitored proceedings begun on the Sabarimala Special Commissioner's report of
      September 2025 that gold-clad copper coverings of the Dwarapalaka idols had been removed
      and sent to Smart Creations, Chennai, without intimation. The court found from seized
      registers that in July 2019 the plates and pedestals (42.800 kg) were entrusted to sponsor
      Unnikrishnan Potty and described in the mahazar as "copper plates", that they weighed
      38.258 kg on receipt at Smart Creations (a 4.541 kg reduction), and that a 1998-99 sponsor's
      letter showed 1,564.190 g of gold had been used on the Dwarapalakas. On 6 October 2025 it
      constituted an SIT under ADGP H. Venkitesh; the SIT registered Crime No.
      3700/CB/CU-IV/TVPM/D/2025 (Dwarapalakas) and 3701 (door frames). On 29 June 2026 the court
      recorded the SIT's finding that "overwhelming materials" established the role of seven
      persons, including former TDB president P.S. Prashanth, board member A. Ajikumar and the
      Thantri. On 20 July 2026 the CSIR-NML report was noted as received; the door-frame case was
      said to be substantially complete. On 3 September 2026 the court directed the door-frame
      final report to be filed by 25 September 2026 and posted the matter to 7 October 2026.
    summary_hi: >
      सितंबर 2025 में सबरीमला विशेष आयुक्त की रिपोर्ट पर शुरू हुई न्यायालय-निगरानी वाली
      कार्यवाही कि द्वारपालक मूर्तियों के स्वर्ण-जड़ित तांबे के आवरण बिना सूचना के हटाकर चेन्नई की
      स्मार्ट क्रिएशन्स को भेजे गए। न्यायालय ने जब्त रजिस्टरों से पाया कि जुलाई 2019 में प्लेटें और
      पीठ (42.800 किग्रा) प्रायोजक उन्निकृष्णन पोट्टी को सौंपी गईं और महज़र में "तांबे की प्लेटें"
      लिखी गईं; स्मार्ट क्रिएशन्स में इनका वज़न 38.258 किग्रा (4.541 किग्रा कम) था; 1998-99 के
      प्रायोजक पत्र के अनुसार द्वारपालकों पर 1,564.190 ग्राम सोना लगा था। 6 अक्टूबर 2025 को
      न्यायालय ने ADGP एच. वेंकिटेश के नेतृत्व में SIT गठित की; SIT ने अपराध संख्या
      3700/CB/CU-IV/TVPM/D/2025 (द्वारपालक) और 3701 (दरवाज़े की चौखटें) दर्ज कीं। 29 जून 2026 को
      न्यायालय ने SIT का निष्कर्ष दर्ज किया कि सात व्यक्तियों, जिनमें पूर्व TDB अध्यक्ष पी.एस. प्रशांत,
      सदस्य ए. अजिकुमार और तंत्री शामिल हैं, की भूमिका के "प्रचुर साक्ष्य" हैं। 3 सितंबर 2026 को
      न्यायालय ने चौखट मामले की अंतिम रिपोर्ट 25 सितंबर 2026 तक दाखिल करने का निर्देश दिया।
    source_ids: [tdb-src-01, tdb-src-02, tdb-src-03, tdb-src-04, tdb-src-21, tdb-src-24]
  - id: tdb-sabarimala-gold-ed-pmla-2026
    title_en: Enforcement Directorate PMLA investigation, Sabarimala temple gold
    title_hi: प्रवर्तन निदेशालय की PMLA जांच, सबरीमला मंदिर स्वर्ण
    jurisdiction_country: IN
    jurisdiction_region: Kerala
    court: Directorate of Enforcement, Kochi Zonal Office
    case_number:
    filed_year: 2026
    case_type: criminal
    statutes: [PMLA 2002 s.17(1A)]
    status: investigation in progress
    tier: under_investigation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      The ED's Kochi Zonal Office opened a money-laundering investigation on the basis of the two
      Kerala Police Crime Branch FIRs (PTI reported the case was registered on 9 January 2026).
      On 20 January 2026 it searched 21 premises in Kerala, Tamil Nadu and Karnataka, froze eight
      immovable properties of the prime accused worth about Rs 1.3 crore under s.17(1A) PMLA and
      seized a 100-gram gold bar at Smart Creations, Chennai. The ED's stated preliminary finding
      is that gold-clad artefacts, including Dwarapalaka components, peedams and door-frame
      panels, were "deliberately misrepresented in official records as mere 'copper plates'" and
      removed during 2019-2025, with gold extracted at Smart Creations and Roddam Jewellers. The ED
      said the conspiracy involved "senior officials of the Travancore Devaswom Board (TDB), former
      temple administrators, private sponsors and jewellers". Further investigation is in progress.
    summary_hi: >
      ED के कोच्चि क्षेत्रीय कार्यालय ने केरल पुलिस क्राइम ब्रांच की दो FIR के आधार पर धन-शोधन जांच
      शुरू की (PTI के अनुसार मामला 9 जनवरी 2026 को दर्ज हुआ)। 20 जनवरी 2026 को केरल, तमिलनाडु और
      कर्नाटक में 21 परिसरों की तलाशी ली, मुख्य आरोपी की लगभग 1.3 करोड़ रुपये की आठ अचल संपत्तियाँ
      PMLA की धारा 17(1A) के तहत फ्रीज़ कीं और चेन्नई की स्मार्ट क्रिएशन्स से 100 ग्राम का सोने का
      बार जब्त किया। ED का प्रारंभिक निष्कर्ष है कि स्वर्ण-जड़ित कलाकृतियों को अभिलेखों में
      "जानबूझकर मात्र 'तांबे की प्लेटें' बताया गया" और 2019-2025 के दौरान हटाया गया। आगे की जांच जारी है।
    source_ids: [tdb-src-05, tdb-src-16]

claims:
  - id: tdb-claim-01
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      On 10 September 2025 the Kerala High Court, acting suo motu on the Sabarimala Special
      Commissioner's report, held that the board's detaching of the gold-clad copper coverings of
      the Dwarapalaka idols without prior intimation was "an unwarranted and irregular exercise of
      authority", ordered the repair work at Smart Creations, Chennai, to stop and the coverings
      to be brought back to Sannidhanam, and directed the Devaswom Commissioner, the Executive
      Officer and the Thiruvabharanam Commissioner to show cause.
    statement_hi: >
      10 सितंबर 2025 को केरल उच्च न्यायालय ने सबरीमला विशेष आयुक्त की रिपोर्ट पर स्वतः संज्ञान लेते
      हुए कहा कि बिना पूर्व सूचना के द्वारपालक मूर्तियों के स्वर्ण-जड़ित आवरण हटाना "अधिकार का
      अनुचित और अनियमित प्रयोग" था, चेन्नई की स्मार्ट क्रिएशन्स में मरम्मत कार्य रोकने और आवरण
      सन्निधानम वापस लाने का आदेश दिया, तथा देवस्वम आयुक्त, कार्यकारी अधिकारी और तिरुवाभरणम
      आयुक्त को कारण बताओ नोटिस दिया।
    tier: regulatory_action
    date: 2025-09-10
    source_ids: [tdb-src-01, tdb-src-06]
  - id: tdb-claim-02
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      On 17 September 2025 the High Court recorded from seized mahazars that twelve "copper
      plates" (25.400 kg) and two peedams (17.400 kg), a combined 42.800 kg, were entrusted to
      Unnikrishnan Potty on 19-20 July 2019, that they weighed only 38.258 kg when produced at
      Smart Creations on 29 August 2019 — "an unexplained reduction of 4.541 kilograms" — and
      that the weight was not recorded at all at refixation on 11 September 2019; it directed the
      board's Chief Vigilance and Security Officer to investigate and report within three weeks.
    statement_hi: >
      17 सितंबर 2025 को उच्च न्यायालय ने जब्त महज़रों से दर्ज किया कि बारह "तांबे की प्लेटें"
      (25.400 किग्रा) और दो पीठ (17.400 किग्रा), कुल 42.800 किग्रा, 19-20 जुलाई 2019 को उन्निकृष्णन
      पोट्टी को सौंपे गए; 29 अगस्त 2019 को स्मार्ट क्रिएशन्स में इनका वज़न केवल 38.258 किग्रा था —
      "4.541 किलोग्राम की अस्पष्ट कमी" — और 11 सितंबर 2019 को पुनः स्थापना के समय वज़न दर्ज ही नहीं
      किया गया; न्यायालय ने बोर्ड के मुख्य सतर्कता एवं सुरक्षा अधिकारी को तीन सप्ताह में जांच रिपोर्ट
      देने का निर्देश दिया।
    tier: regulatory_action
    date: 2025-09-17
    source_ids: [tdb-src-01, tdb-src-07]
  - id: tdb-claim-03
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      On 6 October 2025 the High Court found from a United Breweries Group letter endorsed by
      board officers that 1,564.190 g of gold had been used to clad the two Dwarapalakas in
      1998-99, held that the items handed to Potty in 2019 "were therefore not mere 'copper
      plates'" as described in the mahazar, and observed that the responsibility "extends also to
      certain officers of the Travancore Devaswom Board" who "were privy to the transactions".
    statement_hi: >
      6 अक्टूबर 2025 को उच्च न्यायालय ने बोर्ड अधिकारियों द्वारा अनुमोदित यूनाइटेड ब्रुअरीज़ समूह के
      पत्र से पाया कि 1998-99 में दोनों द्वारपालकों पर 1,564.190 ग्राम सोना लगाया गया था, कहा कि
      2019 में पोट्टी को सौंपी गई वस्तुएँ "इसलिए मात्र 'तांबे की प्लेटें' नहीं थीं" जैसा महज़र में लिखा
      था, और टिप्पणी की कि ज़िम्मेदारी "त्रावणकोर देवस्वम बोर्ड के कुछ अधिकारियों तक भी फैली है" जो
      "लेन-देन से अवगत थे"।
    tier: regulatory_action
    date: 2025-10-06
    source_ids: [tdb-src-01]
  - id: tdb-claim-04
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      On 6 October 2025 the High Court held that the vigilance findings "prima facie disclose the
      commission of several offences under the Bharatiya Nyaya Sanhita, 2023" and constituted a
      Special Investigation Team headed by H. Venkitesh, ADGP (Law and Order), with S. Sasidharan
      IPS as investigating officer, directing it to register a crime, report directly to the court
      and complete the investigation within six weeks.
    statement_hi: >
      6 अक्टूबर 2025 को उच्च न्यायालय ने कहा कि सतर्कता निष्कर्ष "प्रथम दृष्टया भारतीय न्याय संहिता,
      2023 के तहत कई अपराधों का खुलासा करते हैं" और ADGP (कानून-व्यवस्था) एच. वेंकिटेश के नेतृत्व
      में, एस. शशिधरन IPS को जांच अधिकारी बनाते हुए, विशेष जांच दल गठित किया, जिसे अपराध दर्ज
      करने, सीधे न्यायालय को रिपोर्ट करने और छह सप्ताह में जांच पूरी करने का निर्देश दिया।
    tier: under_investigation
    date: 2025-10-06
    source_ids: [tdb-src-01, tdb-src-26]
  - id: tdb-claim-05
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      The SIT registered two crimes, No. 3700/CB/CU-IV/TVPM/D/2025 concerning the Dwarapalaka
      idols and No. 3701/CB/CU-IV/TVPM/D/2025 concerning the Sreekovil door frames, both of which
      were before the High Court in WP(C) No. 40608 of 2025.
    statement_hi: >
      SIT ने दो अपराध दर्ज किए: द्वारपालक मूर्तियों से संबंधित संख्या 3700/CB/CU-IV/TVPM/D/2025 और
      श्रीकोविल के दरवाज़े की चौखटों से संबंधित संख्या 3701/CB/CU-IV/TVPM/D/2025; दोनों उच्च न्यायालय
      में WP(C) संख्या 40608/2025 में विचाराधीन थे।
    tier: under_investigation
    date: 2025-10
    source_ids: [tdb-src-02, tdb-src-13]
  - id: tdb-claim-06
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      The SIT arrested the sponsor Unnikrishnan Potty on 17 October 2025 in the Dwarapalaka case
      and again on 3 November 2025 in the door-frame case, when the Judicial First Class
      Magistrate Court, Ranni, granted the SIT his custody for ten days.
    statement_hi: >
      SIT ने प्रायोजक उन्निकृष्णन पोट्टी को 17 अक्टूबर 2025 को द्वारपालक मामले में और फिर 3 नवंबर
      2025 को चौखट मामले में गिरफ्तार किया; रन्नी की प्रथम श्रेणी न्यायिक मजिस्ट्रेट अदालत ने SIT
      को दस दिन की हिरासत दी।
    tier: under_investigation
    date: 2025-10-17
    source_ids: [tdb-src-09, tdb-src-10, tdb-src-13, tdb-src-01]
  - id: tdb-claim-07
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      On 23 October 2025 the SIT arrested B. Murari Babu, the board's former Administrative
      Officer at Sabarimala in 2019, naming him as an accused in both FIRs; Murari Babu said the
      "copper" description came from the chief priest's letter and that higher board authorities
      took the final decisions.
    statement_hi: >
      23 अक्टूबर 2025 को SIT ने 2019 में सबरीमला में बोर्ड के प्रशासनिक अधिकारी रहे बी. मुरारी बाबू को
      दोनों FIR में आरोपी बनाते हुए गिरफ्तार किया; मुरारी बाबू ने कहा कि "तांबा" विवरण मुख्य पुजारी
      के पत्र से आया और अंतिम निर्णय बोर्ड के उच्च अधिकारियों ने लिए।
    tier: under_investigation
    date: 2025-10-23
    source_ids: [tdb-src-11, tdb-src-12, tdb-src-03]
  - id: tdb-claim-08
    case_id: tdb-sabarimala-gold-ed-pmla-2026
    statement_en: >
      On 20 January 2026 the Enforcement Directorate, Kochi Zonal Office, searched 21 premises in
      Kerala, Tamil Nadu and Karnataka under the PMLA in connection with the Sabarimala temple
      gold matter, froze eight immovable properties of the prime accused valued at about Rs 1.3
      crore under section 17(1A), and seized a 100-gram gold bar from Smart Creations, Chennai.
    statement_hi: >
      20 जनवरी 2026 को प्रवर्तन निदेशालय, कोच्चि क्षेत्रीय कार्यालय ने सबरीमला मंदिर स्वर्ण मामले में
      PMLA के तहत केरल, तमिलनाडु और कर्नाटक में 21 परिसरों की तलाशी ली, मुख्य आरोपी की लगभग 1.3
      करोड़ रुपये की आठ अचल संपत्तियाँ धारा 17(1A) के तहत फ्रीज़ कीं और चेन्नई की स्मार्ट क्रिएशन्स से
      100 ग्राम का सोने का बार जब्त किया।
    tier: under_investigation
    date: 2026-01-20
    source_ids: [tdb-src-05, tdb-src-16]
  - id: tdb-claim-09
    case_id: tdb-sabarimala-gold-ed-pmla-2026
    statement_en: >
      The ED stated on 21 January 2026 that its preliminary investigation revealed that gold-clad
      artefacts including Dwarapalaka components, peedams and door-frame panels "were deliberately
      misrepresented in official records as mere 'copper plates' and unauthorisedly removed" during
      2019-2025, and that its investigation "revealed a well-planned criminal conspiracy involving
      senior officials of the Travancore Devaswom Board (TDB), former temple administrators, private
      sponsors and jewellers".
    statement_hi: >
      ED ने 21 जनवरी 2026 को कहा कि उसकी प्रारंभिक जांच से पता चला कि द्वारपालक घटकों, पीठों और
      चौखट पैनलों सहित स्वर्ण-जड़ित कलाकृतियों को "आधिकारिक अभिलेखों में जानबूझकर मात्र 'तांबे की
      प्लेटें' बताया गया और अनधिकृत रूप से हटाया गया" (2019-2025), और जांच में "त्रावणकोर देवस्वम
      बोर्ड के वरिष्ठ अधिकारियों, पूर्व मंदिर प्रशासकों, निजी प्रायोजकों और जौहरियों से जुड़ी सुनियोजित
      आपराधिक साज़िश" सामने आई।
    tier: under_investigation
    date: 2026-01-21
    source_ids: [tdb-src-05]
  - id: tdb-claim-10
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      On 29 June 2026 the High Court recorded the SIT's report that "overwhelming materials" had
      been collected establishing the role of seven persons — Murari Babu (Executive Officer),
      Unnikrishnan Potty (sponsor), Pankaj Bhandari (Smart Creations), P.S. Prashanth (President,
      TDB), Adv. A. Ajikumar (Member, TDB), Kandararu Rajeevaru (Thantri) and Rejilal
      (Thiruvabharanam Commissioner) — in offences of criminal breach of trust, forgery and
      criminal conspiracy under sections 316(2), 316(5), 336(2) and 61(2) read with 3(5) of the
      BNS, and that the role of eleven further board officers, members and others was being probed.
    statement_hi: >
      29 जून 2026 को उच्च न्यायालय ने SIT की रिपोर्ट दर्ज की कि सात व्यक्तियों — मुरारी बाबू
      (कार्यकारी अधिकारी), उन्निकृष्णन पोट्टी (प्रायोजक), पंकज भंडारी (स्मार्ट क्रिएशन्स), पी.एस. प्रशांत
      (अध्यक्ष, TDB), अधिवक्ता ए. अजिकुमार (सदस्य, TDB), कंडरारु राजीवरु (तंत्री) और रेजिलाल
      (तिरुवाभरणम आयुक्त) — की भूमिका स्थापित करने वाले "प्रचुर साक्ष्य" एकत्र हुए हैं, जो BNS की धारा
      316(2), 316(5), 336(2) और 61(2) सहपठित 3(5) के तहत आपराधिक विश्वासघात, जालसाज़ी और आपराधिक
      साज़िश के अपराध हैं, और ग्यारह अन्य बोर्ड अधिकारियों, सदस्यों व अन्य की भूमिका की जांच जारी है।
    tier: under_investigation
    date: 2026-06-29
    source_ids: [tdb-src-03, tdb-src-21]
  - id: tdb-claim-11
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      On 23 July 2026 the SIT arrested former TDB president P.S. Prasanth and former board member
      A. Ajikumar in the Dwarapalaka case; the Kollam Vigilance Court remanded them to judicial
      custody for 14 days. Prasanth was the third former board president arrested, after N. Vasu and
      A. Padmakumar; the Kollam Vigilance Court granted Padmakumar statutory bail on 20 February
      and 4 March 2026 and Prasanth bail on medical grounds on 3 September 2026.
    statement_hi: >
      23 जुलाई 2026 को SIT ने पूर्व TDB अध्यक्ष पी.एस. प्रशांत और पूर्व बोर्ड सदस्य ए. अजिकुमार को
      द्वारपालक मामले में गिरफ्तार किया; कोल्लम सतर्कता अदालत ने उन्हें 14 दिन की न्यायिक हिरासत में
      भेजा। एन. वासु और ए. पद्मकुमार के बाद प्रशांत गिरफ्तार होने वाले तीसरे पूर्व बोर्ड अध्यक्ष थे;
      कोल्लम सतर्कता अदालत ने पद्मकुमार को 20 फरवरी और 4 मार्च 2026 को वैधानिक ज़मानत और प्रशांत को
      3 सितंबर 2026 को चिकित्सीय आधार पर ज़मानत दी।
    tier: under_investigation
    date: 2026-07-23
    source_ids: [tdb-src-22, tdb-src-23, tdb-src-20, tdb-src-25, tdb-src-03]
  - id: tdb-claim-12
    case_id: tdb-sabarimala-dwarapalaka-gold-2025
    statement_en: >
      On 20 July 2026 the High Court recorded that the CSIR National Metallurgical Laboratory's
      final report had been received on 6 July 2026, that investigation in the door-frame crime
      (No. 3701) was substantially complete with the final report to be filed within thirty days,
      and that the alleged pilfering of gold in September 2025 had been clubbed with the
      Dwarapalaka crime (No. 3700); it directed the SIT to file the final report in that crime
      "at the earliest".
    statement_hi: >
      20 जुलाई 2026 को उच्च न्यायालय ने दर्ज किया कि CSIR राष्ट्रीय धातुकर्म प्रयोगशाला की अंतिम
      रिपोर्ट 6 जुलाई 2026 को प्राप्त हुई, चौखट अपराध (संख्या 3701) की जांच लगभग पूरी है और अंतिम
      रिपोर्ट तीस दिन में दाखिल होगी, तथा सितंबर 2025 में कथित स्वर्ण चोरी को द्वारपालक अपराध
      (संख्या 3700) के साथ जोड़ा गया है; न्यायालय ने SIT को उस अपराध में अंतिम रिपोर्ट "यथाशीघ्र"
      दाखिल करने का निर्देश दिया।
    tier: under_investigation
    date: 2026-07-20
    source_ids: [tdb-src-04]

