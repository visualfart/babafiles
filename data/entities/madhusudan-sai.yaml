    title: Sri Sathya Sai Loka Seva Trust vs Sri Sathya Sai Central Trust, R.S.A. No. 140 of 2019 (DEC)
    publisher: Karnataka High Court (hosted by Indian Kanoon)
    type: court
    published_at: 2022-04-19
    language: en
    archive_url: https://web.archive.org/web/20260908143657/https://indiankanoon.org/doc/161984261/
    captured_at: 2026-09-09
    sha256:
    note: >
      Justice R. Nataraj. Second appeal by the Sri Sathya Sai Loka Seva Trust and Muddenahalli
      trustees (including U. Gangadhara Bhat, S.S. Naganand, K. Sanjiva Shetty, B. Narayana Rao)
      against a first-appellate order that had let a suit (O.S. No.141/2015, Chikkaballapur) by
      Sri Sathya Sai Central Trust and its aligned trustees proceed. The suit challenges a 12
      September 2012 amendment to the Loka Seva Trust's deed that removed the Central Trust's
      power, under the deed as it stood after Sathya Sai Baba's death, to nominate Loka Seva
      Trust trustees. Held the suit was properly filed to vindicate the plaintiffs' personal
      right to appoint trustees, not a public-trust matter requiring leave under CPC s.92;
      dismissed the second appeal as lacking merit.
