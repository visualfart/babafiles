relationships:
  - to_id: narendra-modi
    type: visit
    period_start: 2023-03-25
    period_end: 2023-03-25
    description_en: >
      Prime Minister Narendra Modi visited Sathya Sai Grama, Muddenahalli on 25 March 2023 to
      inaugurate the fee-free Sri Madhusudan Sai Institute of Medical Sciences and Research and
      the Sri Sathya Sai Rajeswari Memorial Block, accompanied by Karnataka Chief Minister
      Basavaraj Bommai.
    description_hi: >
      प्रधानमंत्री नरेंद्र मोदी ने 25 मार्च 2023 को कर्नाटक के मुख्यमंत्री बसवराज बोम्मई के साथ
      सत्य साईं ग्राम, मुद्देनहल्ली का दौरा कर नि:शुल्क श्री मधुसूदन साई इंस्टीट्यूट ऑफ मेडिकल
      साइंसेज एंड रिसर्च और श्री सत्य साईं राजेश्वरी स्मारक खंड का उद्घाटन किया।
    source_ids: [ms-src-06]
  - to_id: vishnu-deo-sai
    type: visit
    period_start: 2026-07-24
    period_end: 2026-07-24
    description_en: >
      Chhattisgarh Chief Minister Vishnu Deo Sai visited Sathya Sai Grama on 24 July 2026,
      touring the Sri Sathya Sai Institute of Higher Medical Sciences (Super Speciality
      Hospital) and reviewing its free healthcare services.
    description_hi: >
      छत्तीसगढ़ के मुख्यमंत्री विष्णु देव साय ने 24 जुलाई 2026 को सत्य साईं ग्राम का दौरा कर श्री
      सत्य साईं इंस्टीट्यूट ऑफ हायर मेडिकल साइंसेज (सुपर स्पेशियलिटी अस्पताल) देखा और वहाँ की
      नि:शुल्क स्वास्थ्य सेवाओं की समीक्षा की।
    source_ids: [ms-src-07]
