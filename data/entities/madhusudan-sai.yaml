summary_en: >
  Madhusudan Sai (Madhusudan Naidu) leads the Sathya Sai Grama campus at Muddenahalli,
  Chikkaballapur district, Karnataka, home to the Sri Sathya Sai University for Human
  Excellence and the fee-free Sri Madhusudan Sai Institute of Medical Sciences and Research,
  part of a group of institutions that trace their origin to a trust associated with Sathya
  Sai Baba but that operate separately from the Sri Sathya Sai Central Trust at Puttaparthi
  since a split after Sathya Sai Baba's 2011 death. No FIR, criminal case, Income Tax or
  Enforcement Directorate action, or charity-regulator sanction naming Madhusudan Sai or
  Madhusudan Naidu was found on the registers checked. He is, however, a named party to
  long-running civil litigation over control of Sri Sathya Sai Loka Seva Trust, the
  Muddenahalli-based trust: suits filed at Bangalore and Bantwal in 2017 by trustees removed
  by a January 2017 board resolution remain pending on their merits, with only procedural
  rulings (on venue and a belated written statement) decided so far; a related dispute over a
  2012 amendment to the trust's deed, in which the Sri Sathya Sai Central Trust and its
  aligned trustees sued the Loka Seva Trust and Muddenahalli trustees to challenge their loss
  of the right to appoint Loka Seva Trust trustees, reached the Karnataka High Court (dismissed
  the Muddenahalli side's appeal in April 2022) and the Supreme Court (declined to interfere in
  September 2023). No case specifically over use of the "Sathya Sai" name or trademark was
  found. Separately, the institutions at Sathya Sai Grama have hosted visits by Prime Minister
  Narendra Modi (March 2023) and Chhattisgarh Chief Minister Vishnu Deo Sai (July 2026), which
  are recorded here as neutral facts, not findings of wrongdoing.
summary_hi: >
  मधुसूदन साई (मधुसूदन नायडू) कर्नाटक के चिक्कबल्लापुर ज़िले में मुद्देनहल्ली स्थित सत्य साईं ग्राम
  परिसर का नेतृत्व करते हैं, जो श्री सत्य साईं यूनिवर्सिटी फॉर ह्यूमन एक्सीलेंस और नि:शुल्क श्री
  मधुसूदन साई इंस्टीट्यूट ऑफ मेडिकल साइंसेज एंड रिसर्च का घर है, जो उन संस्थानों के समूह का हिस्सा
  हैं जिनकी उत्पत्ति सत्य साईं बाबा से जुड़े एक ट्रस्ट से हुई परंतु जो सत्य साईं बाबा की 2011 में
  मृत्यु के बाद हुए विभाजन के बाद से पुट्टपर्थी स्थित श्री सत्य साईं सेंट्रल ट्रस्ट से अलग संचालित
  होते हैं। जाँची गई सूचियों में मधुसूदन साई या मधुसूदन नायडू के नाम से कोई एफआईआर, आपराधिक मामला,
  आयकर या प्रवर्तन निदेशालय की कार्रवाई, या धर्मार्थ नियामक की कार्रवाई नहीं मिली। हालाँकि, वे
  मुद्देनहल्ली स्थित श्री सत्य साईं लोक सेवा ट्रस्ट के नियंत्रण को लेकर चल रही दीर्घकालिक सिविल
  मुकदमेबाज़ी में एक नामित पक्ष हैं: जनवरी 2017 के बोर्ड प्रस्ताव द्वारा हटाए गए न्यासियों द्वारा
  2017 में बेंगलुरु और बंटवाल में दाखिल किए गए मुकदमे अभी गुण-दोष पर लंबित हैं, अब तक केवल
  प्रक्रियात्मक निर्णय (क्षेत्राधिकार और विलंबित लिखित बयान पर) हुए हैं; ट्रस्ट डीड में 2012 के एक
  संशोधन को लेकर एक संबंधित विवाद, जिसमें श्री सत्य साईं सेंट्रल ट्रस्ट और उससे जुड़े न्यासियों ने
  लोक सेवा ट्रस्ट के न्यासी नियुक्त करने के अपने अधिकार के नुकसान को चुनौती देते हुए लोक सेवा ट्रस्ट
  और मुद्देनहल्ली के न्यासियों पर मुकदमा किया, कर्नाटक उच्च न्यायालय (अप्रैल 2022 में मुद्देनहल्ली
  पक्ष की अपील खारिज) और सर्वोच्च न्यायालय (सितंबर 2023 में हस्तक्षेप से इनकार) तक पहुँचा। "सत्य
  साईं" नाम या ट्रेडमार्क के उपयोग को लेकर विशेष रूप से कोई मामला नहीं मिला। इससे अलग, सत्य साईं
  ग्राम के संस्थानों में प्रधानमंत्री नरेंद्र मोदी (मार्च 2023) और छत्तीसगढ़ के मुख्यमंत्री विष्णु
  देव साय (जुलाई 2026) की यात्राएँ हुई हैं, जिन्हें यहाँ तटस्थ तथ्यों के रूप में दर्ज किया गया है,
  किसी अपराध के निष्कर्ष के रूप में नहीं।
