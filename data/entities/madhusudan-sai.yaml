cases:
  - id: madhusudan-sai-loka-seva-trust-trusteeship-suits-2017
    title_en: K.S. Krishna Bhat and S.S. Naganand v. B. Narayan Rao, Madhusudan Naidu and others (Sri Sathya Sai Loka Seva Trust trusteeship dispute)
    title_hi: के.एस. कृष्ण भट और एस.एस. नागानंद बनाम बी. नारायण राव, मधुसूदन नायडू एवं अन्य (श्री सत्य साईं लोक सेवा ट्रस्ट न्यासीपद विवाद)
    jurisdiction_country: IN
    jurisdiction_region: Karnataka
    court: Senior Civil Judge & JMFC, Bantwal, and Principal City Civil & Sessions Judge, Bengaluru (trial); Karnataka High Court (interlocutory orders)
    case_number: O.S. No. 12 of 2017 (Bantwal) and O.S. No. 838 of 2017 (Bengaluru, now transferred to Bantwal and to be tried together); Writ Petition (Art. 227) decided 21.03.2022; Civil Petition Nos. 472/2022 and 351/2024 decided 21.10.2024
    filed_year: 2017
    case_type: civil
    statutes: []
    status: Underlying suits over the validity of the January 2017 trustee-removal resolution remain pending trial; only procedural/interlocutory matters have been decided so far
    tier: closed
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable to the interlocutory orders cited; the underlying suits' outcome was not on record as of this entry
    summary_en: >
      Following a Board of Trustees resolution passed on 21-23 January 2017 at Muddenahalli,
      removing S.S. Naganand, K.S. Krishna Bhat and S. Chandrashekara Bhat as trustees of Sri
      Sathya Sai Loka Seva Trust, the removed trustees filed two suits seeking a declaration
      that the resolution was illegal, null and void, and a permanent injunction against the
      remaining trustees and office-bearers - including Madhusudan Naidu - "from interfering
      with the Management of Shri Sathya Sai Loka Seva Trust, Alike and Muddenahalli Campus":
      O.S. No.12/2017 at Bantwal (27 February 2017) and O.S. No.838/2017 at Bengaluru (2
      February 2017). Neither suit had reached trial on its merits as of the record available.
      Two interlocutory matters were decided: on 21 March 2022 the Karnataka High Court
      dismissed a writ petition by the Bantwal plaintiffs challenging the trial court's decision
      to allow the defendants (including Madhusudan Naidu) to file a belated written statement;
      and on 21 October 2024 the High Court transferred the Bengaluru suit to Bantwal and
      directed that both suits be tried together there.
    summary_hi: >
      21-23 जनवरी 2017 को मुद्देनहल्ली में पारित बोर्ड ऑफ ट्रस्टीज़ के एक प्रस्ताव के बाद, जिसमें
      एस.एस. नागानंद, के.एस. कृष्ण भट और एस. चंद्रशेखर भट को श्री सत्य साईं लोक सेवा ट्रस्ट के
      न्यासी पद से हटाया गया, हटाए गए न्यासियों ने दो मुकदमे दाखिल किए जिनमें प्रस्ताव को अवैध,
      शून्य और अकृत घोषित करने तथा शेष न्यासियों और पदाधिकारियों — जिनमें मधुसूदन नायडू भी शामिल
      हैं — को "श्री सत्य साईं लोक सेवा ट्रस्ट, अलिके और मुद्देनहल्ली परिसर के प्रबंधन में हस्तक्षेप"
      से रोकने का स्थायी निषेधाज्ञा माँगा गया: बंटवाल में ओ.एस. संख्या 12/2017 (27 फरवरी 2017) और
      बेंगलुरु में ओ.एस. संख्या 838/2017 (2 फरवरी 2017)। उपलब्ध अभिलेख के अनुसार दोनों मुकदमे अभी
      गुण-दोष पर विचारण तक नहीं पहुँचे थे। दो प्रक्रियात्मक मामलों पर निर्णय हुआ: 21 मार्च 2022 को
      कर्नाटक उच्च न्यायालय ने बंटवाल के वादियों की उस रिट याचिका को खारिज किया जिसमें विचारण
      न्यायालय के उस निर्णय को चुनौती दी गई थी जिसने प्रतिवादियों (मधुसूदन नायडू सहित) को विलंबित
      लिखित बयान दाखिल करने की अनुमति दी थी; और 21 अक्टूबर 2024 को उच्च न्यायालय ने बेंगलुरु के
      मुकदमे को बंटवाल स्थानांतरित कर दोनों मुकदमों को वहाँ साथ चलाने का निर्देश दिया।
    source_ids: [ms-src-04, ms-src-05]

  - id: madhusudan-sai-loka-seva-trust-2012-amendment-dispute
    title_en: Sri Sathya Sai Central Trust and aligned trustees v. Sri Sathya Sai Loka Seva Trust and Muddenahalli trustees (2012 trust-deed amendment dispute)
    title_hi: श्री सत्य साईं सेंट्रल ट्रस्ट एवं संबद्ध न्यासी बनाम श्री सत्य साईं लोक सेवा ट्रस्ट एवं मुद्देनहल्ली न्यासी (2012 ट्रस्ट डीड संशोधन विवाद)
    jurisdiction_country: IN
    jurisdiction_region: Karnataka
    court: III Additional District and Sessions Judge, Chikkaballapura (trial/first appeal); Karnataka High Court; Supreme Court of India
    case_number: O.S. No. 141 of 2015 and R.A. No. 102 of 2016 (Chikkaballapura); R.S.A. No. 140 of 2019 (DEC) (Karnataka High Court, decided 19.04.2022); SLP (Civil) Diary No. 26627/2022 (Supreme Court, disposed 15.09.2023)
    filed_year: 2015
    case_type: civil
    statutes: []
    status: Second appeal by the Loka Seva Trust/Muddenahalli side dismissed by the Karnataka High Court; Supreme Court declined to interfere; the underlying suit over the 2012 deed amendment's validity was to proceed to trial at Chikkaballapura
    tier: closed
    verdict_date: 2023-09-15
    sentence_or_remedy: >
      Second appeal against reinstatement of the underlying suit dismissed as lacking merit
      (Karnataka High Court, 19.04.2022); Special Leave Petition against that dismissal disposed
      of without interference (Supreme Court, 15.09.2023), leaving all contentions open for the
      trial court.
    appeal_status: No further appeal found on record after the Supreme Court's 15 September 2023 order
    summary_en: >
      This related litigation, filed by Sri Sathya Sai Central Trust and trustees aligned with
      it, concerns a 12 September 2012 meeting at which three Muddenahalli-based trustees of
      Sri Sathya Sai Loka Seva Trust amended its deed to remove the Central Trust's power - held
      under a 2008 amendment made by Sathya Sai Baba - to nominate the Loka Seva Trust's
      trustees after his death. The Central Trust's suit (O.S. No.141/2015) sought to have that
      amendment declared void; a trial-court order rejecting the plaint was reversed on first
      appeal in 2018, and the Karnataka High Court dismissed the Loka Seva Trust/Muddenahalli
      side's second appeal against that reversal on 19 April 2022, holding the suit properly
      vindicated the plaintiffs' personal right to nominate trustees. The Supreme Court declined
      to interfere with that order on 15 September 2023, leaving the underlying dispute over the
      2012 amendment's validity to be tried on its merits at Chikkaballapura. Madhusudan Naidu
      is not named as a party to this particular suit; it is documented here because it is
      litigation directly between the Sri Sathya Sai Central Trust and the Muddenahalli-based
      Loka Seva Trust that he now leads. No case specifically concerning the use of the "Sathya
      Sai" name or trademark was found on the record available.
    summary_hi: >
      यह संबंधित मुकदमेबाज़ी, जो श्री सत्य साईं सेंट्रल ट्रस्ट और उससे संबद्ध न्यासियों द्वारा दायर
      की गई, 12 सितंबर 2012 की एक बैठक से संबंधित है जिसमें मुद्देनहल्ली स्थित श्री सत्य साईं लोक
      सेवा ट्रस्ट के तीन न्यासियों ने ट्रस्ट डीड में संशोधन कर सेंट्रल ट्रस्ट की वह शक्ति समाप्त कर
      दी — जो 2008 के एक संशोधन के तहत स्वयं सत्य साईं बाबा ने दी थी — जिसके तहत उनकी मृत्यु के बाद
      लोक सेवा ट्रस्ट के न्यासी नामांकित किए जा सकते थे। सेंट्रल ट्रस्ट के मुकदमे (ओ.एस. संख्या
      141/2015) में उस संशोधन को शून्य घोषित करने की माँग की गई; वाद-पत्र खारिज करने के विचारण
      न्यायालय के आदेश को 2018 में प्रथम अपील में पलट दिया गया, और कर्नाटक उच्च न्यायालय ने 19
      अप्रैल 2022 को लोक सेवा ट्रस्ट/मुद्देनहल्ली पक्ष की उस पलटाव के विरुद्ध दूसरी अपील खारिज कर दी,
      यह मानते हुए कि मुकदमा वादियों के न्यासी नामांकित करने के व्यक्तिगत अधिकार की रक्षा हेतु उचित
      रूप से दायर किया गया था। सर्वोच्च न्यायालय ने 15 सितंबर 2023 को उस आदेश में हस्तक्षेप से इनकार
      किया, जिससे 2012 के संशोधन की वैधता का मूल विवाद चिक्कबल्लापुर में गुण-दोष पर विचारण हेतु
      शेष रहा। मधुसूदन नायडू इस विशेष मुकदमे में पक्षकार के रूप में नामित नहीं हैं; इसे यहाँ इसलिए
      दर्ज किया गया है क्योंकि यह श्री सत्य साईं सेंट्रल ट्रस्ट और मुद्देनहल्ली स्थित लोक सेवा ट्रस्ट
      — जिसका वे अब नेतृत्व करते हैं — के बीच सीधी मुकदमेबाज़ी है। उपलब्ध अभिलेख में "सत्य साईं" नाम
      या ट्रेडमार्क के उपयोग से जुड़ा विशेष रूप से कोई मामला नहीं मिला।
    source_ids: [ms-src-01, ms-src-02, ms-src-03]

claims:
  - id: ms-claim-01
    case_id: madhusudan-sai-loka-seva-trust-trusteeship-suits-2017
    statement_en: Following a Board of Trustees resolution passed on 21-23 January 2017 at Muddenahalli that removed three trustees of Sri Sathya Sai Loka Seva Trust, those trustees filed suits in 2017 at Bengaluru and Bantwal seeking a declaration that the resolution was void and an injunction against the remaining trustees and office-bearers, including Madhusudan Naidu, from managing the trust; the suits remained pending trial as of the record available.
    statement_hi: 21-23 जनवरी 2017 को मुद्देनहल्ली में पारित बोर्ड ऑफ ट्रस्टीज़ के एक प्रस्ताव, जिसमें श्री सत्य साईं लोक सेवा ट्रस्ट के तीन न्यासी हटाए गए, के बाद उन न्यासियों ने 2017 में बेंगलुरु और बंटवाल में मुकदमे दाखिल किए जिनमें प्रस्ताव को शून्य घोषित करने और मधुसूदन नायडू सहित शेष न्यासियों व पदाधिकारियों को ट्रस्ट के प्रबंधन से रोकने की माँग की गई; उपलब्ध अभिलेख के अनुसार मुकदमे अभी विचाराधीन थे।
    tier: closed
    date: 2017-02-27
    source_ids: [ms-src-04, ms-src-05]
  - id: ms-claim-02
    case_id: madhusudan-sai-loka-seva-trust-trusteeship-suits-2017
    statement_en: On 21 March 2022 the Karnataka High Court dismissed a writ petition by the plaintiffs in O.S. No.12/2017 challenging a trial-court order that had allowed Madhusudan Naidu and the other defendants to file a belated written statement, imposing a cost of Rs 5,000 on the defendants.
    statement_hi: 21 मार्च 2022 को कर्नाटक उच्च न्यायालय ने ओ.एस. संख्या 12/2017 के वादियों की उस रिट याचिका को खारिज किया जिसमें विचारण न्यायालय के उस आदेश को चुनौती दी गई थी जिसने मधुसूदन नायडू और अन्य प्रतिवादियों को विलंबित लिखित बयान दाखिल करने की अनुमति दी थी, और प्रतिवादियों पर 5,000 रुपये का हर्जाना लगाया था।
    tier: closed
    date: 2022-03-21
    source_ids: [ms-src-04]
  - id: ms-claim-03
    case_id: madhusudan-sai-loka-seva-trust-trusteeship-suits-2017
    statement_en: On 21 October 2024 the Karnataka High Court transferred the Bengaluru suit (O.S. No.838/2017) to the Senior Civil Judge, Bantwal, and directed that it be tried together with O.S. No.12/2017, both concerning the validity of the January 2017 trustee-removal resolution.
    statement_hi: 21 अक्टूबर 2024 को कर्नाटक उच्च न्यायालय ने बेंगलुरु के मुकदमे (ओ.एस. संख्या 838/2017) को वरिष्ठ सिविल न्यायाधीश, बंटवाल के पास स्थानांतरित किया और निर्देश दिया कि इसे ओ.एस. संख्या 12/2017 के साथ चलाया जाए, दोनों जनवरी 2017 के न्यासी-हटाने संबंधी प्रस्ताव की वैधता से संबंधित हैं।
    tier: closed
    date: 2024-10-21
    source_ids: [ms-src-05]
  - id: ms-claim-04
    case_id: madhusudan-sai-loka-seva-trust-2012-amendment-dispute
    statement_en: On 19 April 2022 the Karnataka High Court dismissed a second appeal by Sri Sathya Sai Loka Seva Trust and its Muddenahalli-based trustees, holding that a suit filed by Sri Sathya Sai Central Trust and aligned trustees to challenge a 12 September 2012 amendment removing the Central Trust's power to nominate Loka Seva Trust trustees was properly maintainable before the civil court.
    statement_hi: 19 अप्रैल 2022 को कर्नाटक उच्च न्यायालय ने श्री सत्य साईं लोक सेवा ट्रस्ट और उसके मुद्देनहल्ली स्थित न्यासियों की दूसरी अपील खारिज कर दी, यह मानते हुए कि श्री सत्य साईं सेंट्रल ट्रस्ट और संबद्ध न्यासियों द्वारा 12 सितंबर 2012 के उस संशोधन को चुनौती देने हेतु दायर मुकदमा — जिसने लोक सेवा ट्रस्ट के न्यासी नामांकित करने की सेंट्रल ट्रस्ट की शक्ति समाप्त कर दी थी — सिविल न्यायालय के समक्ष उचित रूप से चलने योग्य था।
    tier: closed
    date: 2022-04-19
    source_ids: [ms-src-01]
  - id: ms-claim-05
    case_id: madhusudan-sai-loka-seva-trust-2012-amendment-dispute
    statement_en: On 15 September 2023 the Supreme Court of India declined to interfere with the Karnataka High Court's 19 April 2022 order, disposing of the Loka Seva Trust side's Special Leave Petition while leaving all contentions open to be raised before the trial court.
    statement_hi: 15 सितंबर 2023 को सर्वोच्च न्यायालय ने कर्नाटक उच्च न्यायालय के 19 अप्रैल 2022 के आदेश में हस्तक्षेप से इनकार करते हुए लोक सेवा ट्रस्ट पक्ष की विशेष अनुमति याचिका का निपटारा कर दिया, तथा सभी तर्कों को विचारण न्यायालय के समक्ष उठाने के लिए खुला छोड़ दिया।
    tier: closed
    date: 2023-09-15
    source_ids: [ms-src-02, ms-src-03]

