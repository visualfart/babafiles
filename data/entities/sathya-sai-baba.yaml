cases:
  - id: sathya-sai-baba-prasanthi-nilayam-killings-1993
    title_en: Killings at Prasanthi Nilayam (June 1993) and the Andhra Pradesh CID investigation
    title_hi: प्रशांति निलयम में हत्याएं (जून 1993) और आंध्र प्रदेश सीआईडी जांच
    jurisdiction_country: IN
    jurisdiction_region: Andhra Pradesh
    court: Investigated by Puttaparthi police and the Andhra Pradesh CID; no court proceedings followed
    case_number: Not on record
    filed_year: 1993
    case_type: inquiry
    statutes: []
    status: CID investigation into the police account of the killings; no chargesheet was filed against anyone and the matter was closed
    tier: closed
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      On the night of 6 June 1993 four men armed with knives entered Sathya Sai Baba's private
      quarters at Prasanthi Nilayam. Four attendants confronted them; in the struggle two of
      the attendants were stabbed to death and two were injured. Police who responded said the
      four intruders barricaded themselves in and were shot dead when they attacked; six people
      died in total. The Andhra Pradesh CID subsequently investigated the police's account and,
      according to the BBC and other reporting, found it "riddled with lies and inconsistencies";
      some police officers were arrested in connection with the CID's findings but were never
      charged, and the case was eventually dropped without any chargesheet or trial. No
      independent judicial inquiry into the killings was ever completed.
    summary_hi: >
      6 जून 1993 की रात चार व्यक्ति चाकू लेकर प्रशांति निलयम में सत्य साईं बाबा के निजी कक्ष में
      घुसे। चार सेवकों ने उनका सामना किया; झड़प में दो सेवकों की चाकू से हत्या हो गई और दो घायल हुए।
      मौके पर पहुंची पुलिस ने कहा कि चारों घुसपैठिए अंदर बंद हो गए थे और हमला करने पर उन्हें गोली
      मार दी गई; कुल छह लोगों की मृत्यु हुई। आंध्र प्रदेश सीआईडी ने बाद में पुलिस के बयान की जांच की
      और, बीबीसी व अन्य रिपोर्टों के अनुसार, उसे "झूठ और विसंगतियों से भरा" पाया; सीआईडी के निष्कर्षों
      के सिलसिले में कुछ पुलिसकर्मियों को गिरफ्तार किया गया पर कभी आरोपित नहीं किया गया, और अंततः
      बिना किसी आरोप-पत्र या मुकदमे के मामला बंद कर दिया गया। हत्याओं की कोई स्वतंत्र न्यायिक जांच
      कभी पूरी नहीं हुई।
    source_ids: [ssb-src-01, ssb-src-02, ssb-src-03, ssb-src-05]

  - id: sathya-sai-baba-hari-sampath-petition-2001
    title_en: Hari Sampath v. Union of India and others (Supreme Court, writ petition seeking a CBI inquiry)
    title_hi: हरि सम्पत बनाम भारत संघ एवं अन्य (सर्वोच्च न्यायालय, सीबीआई जांच हेतु रिट याचिका)
    jurisdiction_country: IN
    jurisdiction_region: Supreme Court of India
    court: Supreme Court of India
    case_number: Not on record (writ petition)
    filed_year: 2001
    case_type: criminal
    statutes: []
    status: Dismissed
    tier: closed
    verdict_date: 2001-05-08
    sentence_or_remedy: Petition dismissed
    appeal_status: Not applicable
    summary_en: >
      Former ashram insider Hari Sampath filed a sworn affidavit with the CBI on 12 March 2001
      alleging that ashram hostel officials knew of the sexual-abuse allegations against Sai
      Baba, and, after the CBI did not act, brought a writ petition before the Supreme Court of
      India seeking a direction to the CBI to conduct an inquiry. The petition was dismissed by
      a bench of Justices G.B. Pattnaik and R.C. Lahoti on 8 May 2001. A further approach to the
      Supreme Court by his lawyer, Kamini Jaiswal, in May 2008 also did not result in any CBI
      inquiry.
    summary_hi: >
      पूर्व आश्रम पदाधिकारी हरि सम्पत ने 12 मार्च 2001 को सीबीआई को शपथपत्र देकर आरोप लगाया कि
      आश्रम के छात्रावास अधिकारियों को साईं बाबा के विरुद्ध यौन शोषण के आरोपों की जानकारी थी, और
      सीबीआई द्वारा कार्रवाई न करने पर सर्वोच्च न्यायालय में रिट याचिका दाखिल कर सीबीआई जांच का
      निर्देश माँगा। न्यायमूर्ति जी.बी. पटनायक और आर.सी. लाहोटी की पीठ ने 8 मई 2001 को याचिका खारिज
      कर दी। उनकी वकील कामिनी जायसवाल द्वारा मई 2008 में सर्वोच्च न्यायालय में की गई एक और पहल से भी
      कोई सीबीआई जांच नहीं हुई।
    source_ids: [ssb-src-05]

claims:
  - id: ssb-claim-01
    case_id: sathya-sai-baba-prasanthi-nilayam-killings-1993
    statement_en: On 6 June 1993 four men armed with knives entered Sathya Sai Baba's private quarters at Prasanthi Nilayam; two of his attendants were stabbed to death confronting them, and police then shot dead the four intruders, saying they had acted in self-defence.
    statement_hi: 6 जून 1993 को चार व्यक्ति चाकू लेकर प्रशांति निलयम में सत्य साईं बाबा के निजी कक्ष में घुसे; उनका सामना करते हुए उनके दो सेवकों की चाकू से हत्या कर दी गई, और पुलिस ने बाद में चारों घुसपैठियों को यह कहते हुए गोली मार दी कि उन्होंने आत्मरक्षा में ऐसा किया।
    tier: closed
    date: 1993-06-06
    source_ids: [ssb-src-01, ssb-src-02, ssb-src-03]
  - id: ssb-claim-02
    case_id: sathya-sai-baba-prasanthi-nilayam-killings-1993
    statement_en: The Andhra Pradesh CID's later investigation found the police's account of the 1993 killings inconsistent; some officers were arrested in connection with its findings but no one was ever charged, and the matter was closed without a chargesheet or trial.
    statement_hi: आंध्र प्रदेश सीआईडी की बाद की जांच में 1993 की हत्याओं पर पुलिस के बयान में विसंगतियाँ पाई गईं; इसके निष्कर्षों के सिलसिले में कुछ अधिकारियों को गिरफ्तार किया गया पर किसी पर भी आरोप नहीं लगाया गया, और बिना आरोप-पत्र या मुकदमे के मामला बंद कर दिया गया।
    tier: closed
    date: 1994
    source_ids: [ssb-src-01, ssb-src-05]
  - id: ssb-claim-03
    statement_en: Participants in the BBC's 2004 documentary "Secret Swami", former devotee Alaya Rahm and his father Al Rahm, alleged on camera that Sai Baba had sexually abused them during private interviews, including by rubbing oil on their genitals.
    statement_hi: बीबीसी की 2004 की वृत्तचित्र "सीक्रेट स्वामी" में शामिल पूर्व अनुयायी अलाया राम और उनके पिता अल राम ने कैमरे पर आरोप लगाया कि निजी भेंट के दौरान साईं बाबा ने तेल से उनके गुप्तांगों को मलकर उनका यौन शोषण किया।
    tier: allegation
    date: 2004-06-17
    source_ids: [ssb-src-01, ssb-src-04]
  - id: ssb-claim-04
    statement_en: In a sworn affidavit to the CBI dated 12 March 2001, former ashram insider Hari Sampath said ashram hostel officials "have known [about the alleged abuse] all along, and many of them even 'feed' young boys to Sai Baba."
    statement_hi: 12 मार्च 2001 के सीबीआई को दिए शपथपत्र में पूर्व आश्रम पदाधिकारी हरि सम्पत ने कहा कि आश्रम के छात्रावास अधिकारी "यह सब हमेशा से जानते रहे हैं, और उनमें से कई तो साईं बाबा के लिए युवा लड़कों को 'भेजते' भी हैं।"
    tier: allegation
    date: 2001-03-12
    source_ids: [ssb-src-05]
  - id: ssb-claim-05
    statement_en: The Daily Telegraph reported in October 2000 that Dr Naresh Bhatia told its journalist he had had a sexual relationship with Sai Baba for "15 or 16 years", one of a series of on-record sexual-abuse allegations that, together with the 2004 BBC documentary, prompted an international campaign by former devotees for his prosecution.
    statement_hi: डेली टेलीग्राफ ने अक्टूबर 2000 में रिपोर्ट किया कि डॉ. नरेश भाटिया ने उसके पत्रकार को बताया कि साईं बाबा के साथ उनका "15 या 16 वर्ष" तक यौन संबंध रहा, जो उन कई दर्ज आरोपों में से एक था जिसने 2004 की बीबीसी वृत्तचित्र के साथ मिलकर पूर्व अनुयायियों के एक अंतरराष्ट्रीय अभियान को जन्म दिया जिसमें उन पर मुकदमा चलाने की मांग की गई।
    tier: allegation
    date: 2000-10
    source_ids: [ssb-src-05]
  - id: ssb-claim-06
    case_id: sathya-sai-baba-hari-sampath-petition-2001
    statement_en: On 8 May 2001 a Supreme Court of India bench of Justices G.B. Pattnaik and R.C. Lahoti dismissed Hari Sampath's writ petition seeking a direction to the CBI to investigate the sexual-abuse allegations against Sai Baba.
    statement_hi: 8 मई 2001 को सर्वोच्च न्यायालय की न्यायमूर्ति जी.बी. पटनायक और आर.सी. लाहोटी की पीठ ने हरि सम्पत की उस रिट याचिका को खारिज कर दिया जिसमें साईं बाबा पर यौन शोषण के आरोपों की सीबीआई जांच का निर्देश माँगा गया था।
    tier: closed
    date: 2001-05-08
    source_ids: [ssb-src-05]
  - id: ssb-claim-07
    statement_en: Neither the 1993 killings nor the sexual-abuse allegations were ever the subject of a police investigation or prosecution against Sathya Sai Baba himself; the BBC and the Telegraph both reported, at his death in 2011, that he had never been investigated by the Indian authorities over the abuse allegations and had never been charged with any offence.
    statement_hi: सत्य साईं बाबा के विरुद्ध न तो 1993 की हत्याओं और न ही यौन शोषण के आरोपों पर कभी कोई पुलिस जांच या अभियोजन हुआ; 2011 में उनकी मृत्यु के समय बीबीसी और टेलीग्राफ दोनों ने रिपोर्ट किया कि भारतीय अधिकारियों ने यौन शोषण के आरोपों पर उनकी कभी जांच नहीं की और उन पर कभी कोई आरोप नहीं लगाया गया।
    tier: closed
    date: 2011-04-24
    source_ids: [ssb-src-01, ssb-src-02]

