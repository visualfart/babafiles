id: sathya-sai-baba
type: person
is_subject: true
name_en: Sathya Sai Baba
name_hi: सत्य साईं बाबा
aliases: [Sathya Narayana Raju, Sri Sathya Sai Baba, Bhagwan Sri Sathya Sai Baba]
born: 1926-11-23
died: 2011-04-24
base_location: Prasanthi Nilayam, Puttaparthi, Andhra Pradesh
country: IN
countries_of_operation: [IN]
organisations: [Sri Sathya Sai Central Trust, Sathya Sai Organisation]
activity_status: deceased
abap_2017_list: false
summary_en: >
  Sathya Sai Baba (born Sathya Narayana Raju), who died on 24 April 2011 at Puttaparthi,
  Andhra Pradesh, was one of India's best-known spiritual figures, with an estimated global
  following in the millions. On 6 June 1993 four men entered his private quarters at Prasanthi
  Nilayam armed with knives; in the confrontation two of his attendants were stabbed to death,
  and police then shot dead the four intruders, saying they had acted in self-defence. The
  Andhra Pradesh CID later found the police's account of the killings inconsistent, but no
  chargesheet was filed against anyone and the matter was closed. From the 1990s he faced
  recurring, on-the-record allegations that he had sexually abused young male followers and
  devotees' sons during private interviews, reported by outlets including the BBC (whose 2004
  documentary "Secret Swami" carried on-camera testimony from former devotees), the Daily
  Telegraph and the Guardian. He was never investigated or charged over these allegations by
  Indian authorities. A petition by a former devotee, Hari Sampath, seeking a CBI inquiry was
  dismissed by the Supreme Court of India on 8 May 2001.
summary_hi: >
  सत्य साईं बाबा (जन्म का नाम सत्य नारायण राजू), जिनकी 24 अप्रैल 2011 को आंध्र प्रदेश के
  पुट्टपर्थी में मृत्यु हुई, भारत के सबसे प्रसिद्ध आध्यात्मिक गुरुओं में से एक थे, जिनके विश्व भर
  में अनुमानतः लाखों अनुयायी थे। 6 जून 1993 को चार व्यक्ति चाकू लेकर प्रशांति निलयम में उनके निजी
  कक्ष में घुसे; इस टकराव में उनके दो सेवकों की चाकू से हत्या कर दी गई, और पुलिस ने बाद में चारों
  घुसपैठियों को गोली मारकर मार डाला, यह कहते हुए कि यह आत्मरक्षा में किया गया। आंध्र प्रदेश सीआईडी
  ने बाद में हत्याओं के बारे में पुलिस के बयान में विसंगतियाँ पाईं, लेकिन किसी के विरुद्ध आरोप-पत्र
  दाखिल नहीं हुआ और मामला बंद कर दिया गया। 1990 के दशक से उन पर बार-बार यह आरोप लगते रहे कि उन्होंने
  निजी भेंट के दौरान युवा पुरुष अनुयायियों और भक्तों के पुत्रों का यौन शोषण किया, जिसे बीबीसी (जिसकी
  2004 की वृत्तचित्र "सीक्रेट स्वामी" में पूर्व अनुयायियों के कैमरे पर दिए गवाही शामिल थी), डेली
  टेलीग्राफ और गार्डियन जैसे प्रकाशनों ने रिपोर्ट किया। भारतीय अधिकारियों ने इन आरोपों पर उनकी कभी
  जांच या आरोप नहीं लगाया। पूर्व अनुयायी हरि सम्पत की सीबीआई जांच की मांग वाली याचिका को सर्वोच्च
  न्यायालय ने 8 मई 2001 को खारिज कर दिया।
hi_reviewed: false
response_from_subject:
  text_en: >
    Addressing the sexual-abuse allegations, Sai Baba told followers in 2000: "Some people out
    of their mean-mindedness are trying to tarnish the image of Sai Baba. I am not after name
    and fame. So, I do not lose anything by their false allegations. My glory will go on
    increasing day by day." Dr Michael Goldstein, chairman of the international Sai Baba
    organisation, told the BBC in 2004 that he had heard the rumours but did not believe them:
    "My heart and my conscience tell me that it is not possible."
  text_hi: >
    यौन शोषण के आरोपों पर, साईं बाबा ने 2000 में अनुयायियों से कहा: "कुछ लोग अपनी ओछी मानसिकता के
    कारण साईं बाबा की छवि धूमिल करने की कोशिश कर रहे हैं। मुझे नाम और शोहरत की चाह नहीं है। इसलिए
    उनके झूठे आरोपों से मेरा कुछ नहीं बिगड़ता। मेरी महिमा दिन-प्रतिदिन बढ़ती ही जाएगी।" अंतरराष्ट्रीय
    साईं बाबा संगठन के अध्यक्ष डॉ. माइकल गोल्डस्टीन ने 2004 में बीबीसी से कहा कि उन्होंने अफवाहें
    सुनी थीं पर उन्हें विश्वास नहीं था: "मेरा हृदय और मेरी अंतरात्मा कहते हैं कि यह संभव नहीं है।"
  source_id: ssb-src-03

