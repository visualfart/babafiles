  - id: aniruddhacharya-vrindavan-sita-draupadi-fir-2022
    title_en: FIR over remarks on Sita and Draupadi (Vrindavan police station, Mathura district)
    title_hi: सीता और द्रौपदी संबंधी टिप्पणी पर एफआईआर (वृंदावन थाना, मथुरा ज़िला)
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court: Not on record (no bail, quashing or trial order located)
    case_number: Not stated in press reports
    filed_year: 2022
    case_type: criminal
    statutes: []
    status: FIR registered; no chargesheet, arrest or closure located
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      During a Bhagwat Katha in Vrindavan, a video showed Aniruddhacharya making remarks suggesting the goddesses Sita and Draupadi suffered because of "excessive beauty". After the video went viral and organisations demanded action, Vrindavan police registered an FIR late on 18 October 2022 alleging he had deliberately made statements against Hindu goddesses to hurt religious sentiment. The National Commission for Women took suo motu notice and asked the Uttar Pradesh DGP to have him arrested. No press report of a chargesheet, arrest or court order was located, and no matching record was found on Indian Kanoon.
    summary_hi: >
      वृंदावन में एक भागवत कथा के दौरान एक वीडियो में अनिरुद्धाचार्य को यह कहते दिखाया गया कि देवी सीता और द्रौपदी "अत्यधिक सुंदरता" के कारण कष्ट भोगती रहीं। वीडियो वायरल होने और संगठनों द्वारा कार्रवाई की माँग के बाद, 18 अक्टूबर 2022 की देर रात वृंदावन थाने में एफआईआर दर्ज की गई, जिसमें आरोप था कि उन्होंने जानबूझकर धार्मिक भावनाओं को ठेस पहुँचाने के इरादे से हिंदू देवियों के विरुद्ध टिप्पणी की। राष्ट्रीय महिला आयोग ने स्वतः संज्ञान लेते हुए उत्तर प्रदेश के पुलिस महानिदेशक से उनकी गिरफ़्तारी की माँग की। किसी आरोप-पत्र, गिरफ़्तारी या अदालती आदेश की कोई रिपोर्ट नहीं मिली, और इंडियन कानून पर भी कोई मेल खाता रिकॉर्ड नहीं मिला।
    source_ids: [ an-src-01, an-src-02 ]

  - id: aniruddhacharya-mathura-cjm-complaint-2025
    title_en: Private complaint over remarks on women's marriageable age (CJM court, Mathura)
    title_hi: महिलाओं की विवाह-योग्य आयु संबंधी टिप्पणी पर निजी परिवाद (सीजेएम न्यायालय, मथुरा)
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court: Chief Judicial Magistrate, Mathura
    case_number: Not stated in press reports
    filed_year: 2025
    case_type: criminal
    statutes: []
    status: private complaint admitted by court after police inaction; complainant's statement listed for 1 January 2026; no further outcome located
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      During an October 2025 sermon, Aniruddhacharya said girls are "fully mature" by age 25, making a late marriage more likely to lead to "pre-marital relationships", and that they should therefore marry by 14; the remark, reported from July 2025, recirculated and drew renewed criticism, including from the Mathura Bar Association and women lawyers. Meera Rathore, a district president of the All India Hindu Mahasabha, first approached Vrindavan police station with a written complaint; when police did not register a case, she filed a private complaint directly in the Mathura CJM court, which admitted it on 10 December 2025 and fixed 1 January 2026 to record her statement. Some English-language reports describe the court's order as directing an FIR; Hindi-language reporting describes it as the court admitting the complaint as a case in its own right. No report of the January 2026 hearing's outcome was located.
    summary_hi: >
      अक्टूबर 2025 के एक प्रवचन में अनिरुद्धाचार्य ने कहा कि लड़कियाँ 25 वर्ष की आयु तक "पूरी तरह परिपक्व" हो जाती हैं, जिससे देर से शादी करने पर "विवाह-पूर्व संबंधों" की संभावना बढ़ जाती है, इसलिए उनकी शादी 14 वर्ष तक हो जानी चाहिए; जुलाई 2025 से रिपोर्ट यह टिप्पणी फिर से प्रसारित हुई और मथुरा बार एसोसिएशन व महिला अधिवक्ताओं सहित नए सिरे से आलोचना का सामना करना पड़ा। अखिल भारतीय हिंदू महासभा की एक ज़िला अध्यक्ष मीरा राठौर ने पहले वृंदावन थाने में लिखित शिकायत दी; पुलिस द्वारा मामला दर्ज न करने पर उन्होंने सीधे मथुरा सीजेएम न्यायालय में निजी परिवाद दायर किया, जिसे अदालत ने 10 दिसंबर 2025 को स्वीकार किया और उनका बयान दर्ज करने के लिए 1 जनवरी 2026 की तारीख़ तय की। कुछ अंग्रेज़ी रिपोर्टें अदालत के आदेश को एफआईआर का निर्देश बताती हैं; हिंदी रिपोर्टिंग इसे अदालत द्वारा परिवाद को स्वयं एक मामले के रूप में स्वीकार करना बताती है। जनवरी 2026 की सुनवाई के परिणाम की कोई रिपोर्ट नहीं मिली।
    source_ids: [ an-src-03, an-src-04, an-src-05, an-src-06 ]

  - id: aniruddhacharya-cji-contempt-request-2025
    title_en: Request for Attorney General's consent to bring criminal contempt proceedings over remarks concerning CJI Gavai
    title_hi: सीजेआई गवई संबंधी टिप्पणी पर आपराधिक अवमानना कार्यवाही हेतु महान्यायवादी की सहमति का अनुरोध
    jurisdiction_country: IN
    jurisdiction_region: Supreme Court of India
    court: Not applicable (pre-litigation request for Attorney General consent under s.15, Contempt of Courts Act 1971)
    case_number: Not applicable; no case yet filed
    filed_year: 2025
    case_type: criminal
    statutes: [ "Contempt of Courts Act 1971, s.15" ]
    status: request for Attorney General's consent pending; no contempt case filed
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      On 18 September 2025 the Chief Justice of India, B.R. Gavai, made remarks while dismissing a PIL over a Vishnu idol at Khajuraho's Javari Temple, which drew online criticism. On 21 September 2025 a video of Aniruddhacharya circulated in which he said "if you want to get your chest ripped open, then let me know" in apparent response. On 6 October 2025 advocate Rakesh Kishore attempted to throw a shoe at CJI Gavai in the Supreme Court. Days later, activist Suraj Kumar Bauddh wrote to Attorney General R. Venkataramani seeking his consent, required under s.15 of the Contempt of Courts Act 1971 before a private party may bring criminal contempt proceedings, against Aniruddhacharya and YouTuber Ajeet Bharti for allegedly inciting the attack. As of the most recent reporting found, the Attorney General had not ruled on the request, and no contempt case had been filed against Aniruddhacharya.
    summary_hi: >
      18 सितंबर 2025 को भारत के मुख्य न्यायाधीश बी.आर. गवई ने खजुराहो के जवारी मंदिर की विष्णु प्रतिमा संबंधी एक जनहित याचिका खारिज करते हुए कुछ टिप्पणियाँ कीं, जिन पर ऑनलाइन आलोचना हुई। 21 सितंबर 2025 को अनिरुद्धाचार्य का एक वीडियो प्रसारित हुआ जिसमें उन्होंने प्रतीत होता है कि इसके जवाब में कहा "अगर सीना चिरवाना है तो बता देना।" 6 अक्टूबर 2025 को अधिवक्ता राकेश किशोर ने सर्वोच्च न्यायालय में सीजेआई गवई पर जूता फेंकने का प्रयास किया। कुछ दिनों बाद कार्यकर्ता सूरज कुमार बौद्ध ने अनिरुद्धाचार्य और यूट्यूबर अजीत भारती के विरुद्ध, हमले को उकसाने के आरोप में, आपराधिक अवमानना कार्यवाही के लिए आवश्यक सहमति हेतु महान्यायवादी आर. वेंकटरमणि को पत्र लिखा, जैसा कि अवमानना अधिनियम 1971 की धारा 15 के तहत निजी पक्ष के लिए आवश्यक है। अब तक मिली नवीनतम रिपोर्टिंग तक महान्यायवादी ने इस अनुरोध पर कोई निर्णय नहीं दिया था, और अनिरुद्धाचार्य के विरुद्ध कोई अवमानना मामला दायर नहीं हुआ था।
    source_ids: [ an-src-07 ]

  - id: aniruddhacharya-gauri-gopal-ashram-devotee-complaint-2026
    title_en: Devotee's police complaint alleging unauthorised video and assault at Gauri Gopal Ashram
    title_hi: गौरी गोपाल आश्रम में अनधिकृत वीडियो और हमले का आरोप लगाते हुए अनुयायी की पुलिस शिकायत
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court: Not applicable (police complaint)
    case_number: Not stated in press reports
    filed_year: 2026
    case_type: criminal
    statutes: []
    status: complaint filed; police said they would consider action; no FIR, arrest or other outcome located
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      A devotee identified as Bablu alleged that a private family matter he shared at the Gauri Gopal Ashram was recorded and posted online without his consent, causing him ongoing distress, and that when he asked repeatedly for its removal, he and his wife were assaulted by ashram security. Bablu filed a police complaint; police said they would consider action based on it. No report of an FIR, arrest or other resolution was located, and no report names Aniruddhacharya personally as having ordered or participated in the alleged assault.
    summary_hi: >
      बबलू नामक एक अनुयायी ने आरोप लगाया कि गौरी गोपाल आश्रम में साझा की गई एक निजी पारिवारिक बात को उनकी सहमति के बिना रिकॉर्ड कर ऑनलाइन डाल दिया गया, जिससे उन्हें लगातार परेशानी हुई, और बार-बार हटाने का अनुरोध करने पर आश्रम की सुरक्षा द्वारा उन्हें और उनकी पत्नी को पीटा गया। बबलू ने पुलिस शिकायत दर्ज कराई; पुलिस ने कहा कि वे इस पर कार्रवाई पर विचार करेंगे। किसी एफआईआर, गिरफ़्तारी या अन्य समाधान की कोई रिपोर्ट नहीं मिली, और किसी रिपोर्ट में यह नहीं कहा गया कि अनिरुद्धाचार्य ने स्वयं कथित हमले का आदेश दिया या उसमें भाग लिया।
    source_ids: [ an-src-08 ]

claims:
  - id: aniruddhacharya-claim-01
    case_id: aniruddhacharya-vrindavan-sita-draupadi-fir-2022
    statement_en: Late on 18 October 2022 Vrindavan police registered an FIR against Aniruddhacharya alleging he had deliberately made statements against the Hindu goddesses Sita and Draupadi to hurt religious sentiment; the National Commission for Women took suo motu notice and asked the Uttar Pradesh DGP to have him arrested.
    statement_hi: 18 अक्टूबर 2022 की देर रात वृंदावन पुलिस ने अनिरुद्धाचार्य के विरुद्ध एफआईआर दर्ज की, जिसमें आरोप था कि उन्होंने जानबूझकर धार्मिक भावनाओं को ठेस पहुँचाने के इरादे से देवी सीता और द्रौपदी के विरुद्ध टिप्पणी की; राष्ट्रीय महिला आयोग ने स्वतः संज्ञान लेते हुए उत्तर प्रदेश के पुलिस महानिदेशक से उनकी गिरफ़्तारी की माँग की।
    tier: allegation
    date: 2022-10-18
    source_ids: [ an-src-01, an-src-02 ]
  - id: aniruddhacharya-claim-02
    case_id: aniruddhacharya-mathura-cjm-complaint-2025
    statement_en: On 10 December 2025 the Chief Judicial Magistrate court, Mathura, admitted a private criminal complaint filed by Meera Rathore of the All India Hindu Mahasabha against Aniruddhacharya over his remarks on women's marriageable age, after Vrindavan police had not registered a case on her earlier complaint, and fixed 1 January 2026 to record her statement.
    statement_hi: 10 दिसंबर 2025 को मथुरा की मुख्य न्यायिक मजिस्ट्रेट अदालत ने अखिल भारतीय हिंदू महासभा की मीरा राठौर द्वारा अनिरुद्धाचार्य के विरुद्ध महिलाओं की विवाह-योग्य आयु संबंधी टिप्पणी पर दायर निजी आपराधिक परिवाद को स्वीकार किया, क्योंकि वृंदावन पुलिस ने उनकी पूर्व शिकायत पर मामला दर्ज नहीं किया था, और उनका बयान दर्ज करने के लिए 1 जनवरी 2026 की तारीख़ तय की।
    tier: allegation
    date: 2025-12-10
    source_ids: [ an-src-03, an-src-04, an-src-05 ]
  - id: aniruddhacharya-claim-03
    case_id: aniruddhacharya-cji-contempt-request-2025
    statement_en: In October 2025 activist Suraj Kumar Bauddh wrote to Attorney General R. Venkataramani seeking consent under s.15 of the Contempt of Courts Act 1971 to bring criminal contempt proceedings against Aniruddhacharya over a 21 September 2025 video in which he told CJI B.R. Gavai "if you want to get your chest ripped open, then let me know", days before an advocate tried to throw a shoe at the CJI; the Attorney General had not ruled on the request as of the most recent reporting found.
    statement_hi: अक्टूबर 2025 में कार्यकर्ता सूरज कुमार बौद्ध ने महान्यायवादी आर. वेंकटरमणि को अवमानना अधिनियम 1971 की धारा 15 के तहत सहमति माँगते हुए पत्र लिखा, ताकि अनिरुद्धाचार्य के विरुद्ध आपराधिक अवमानना कार्यवाही शुरू की जा सके, यह 21 सितंबर 2025 के उस वीडियो को लेकर जिसमें उन्होंने सीजेआई बी.आर. गवई से कहा था "अगर सीना चिरवाना है तो बता देना", जो एक अधिवक्ता द्वारा सीजेआई पर जूता फेंकने के प्रयास से कुछ दिन पहले का है; अब तक मिली नवीनतम रिपोर्टिंग तक महान्यायवादी ने इस अनुरोध पर कोई निर्णय नहीं दिया था।
    tier: allegation
    date: 2025-10
    source_ids: [ an-src-07 ]
  - id: aniruddhacharya-claim-04
    case_id: aniruddhacharya-gauri-gopal-ashram-devotee-complaint-2026
    statement_en: A devotee, Bablu, filed a police complaint alleging that a private family matter he shared at the Gauri Gopal Ashram was recorded and posted online without consent and that he and his wife were later assaulted by ashram security when he sought its removal; police said they would consider action, and no FIR or other outcome was located.
    statement_hi: अनुयायी बबलू ने पुलिस शिकायत दर्ज कराई कि गौरी गोपाल आश्रम में साझा की गई एक निजी पारिवारिक बात को उनकी सहमति के बिना रिकॉर्ड कर ऑनलाइन डाल दिया गया, और हटाने का अनुरोध करने पर उन्हें और उनकी पत्नी को आश्रम की सुरक्षा ने पीटा; पुलिस ने कार्रवाई पर विचार करने की बात कही, और कोई एफआईआर या अन्य परिणाम नहीं मिला।
    tier: allegation
    date: 2026-01-14
    source_ids: [ an-src-08 ]

