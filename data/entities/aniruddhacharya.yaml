name_en: Aniruddhacharya
name_hi: अनिरुद्धाचार्य
aliases: [ Aniruddhacharya Ji Maharaj, Anil Kumar Tiwari, Aniruddh Ram Tiwari, Anil Ram Tiwari, Pookie Baba ]
born: 1989-09-27
died:
base_location: Gauri Gopal Ashram, Vrindavan, Mathura district, Uttar Pradesh
country: IN
countries_of_operation: [ IN ]
organisations: [ Gauri Gopal Ashram, Shri Gau Gauri Gopal Seva Sansthan Samiti ]
activity_status: active
abap_2017_list: false
summary_en: >
  Aniruddhacharya (born Anil Kumar Tiwari, also reported as Aniruddh Ram Tiwari) is a religious orator based at the Gauri Gopal Ashram in Vrindavan, which also runs a shelter for elderly women. Police registered an FIR against him at Vrindavan police station in October 2022 over remarks about the goddesses Sita and Draupadi, after which the National Commission for Women sought his arrest; no chargesheet, arrest or court outcome was found on the public record. In December 2025 a Mathura court admitted a private criminal complaint over remarks on women's marriageable age, after police had not acted on an earlier complaint, with a hearing set for January 2026. In October 2025 an activist separately asked the Attorney General for consent to bring criminal contempt proceedings against him over remarks made before an advocate tried to throw a shoe at the Chief Justice of India; that request had not been decided as of the most recent reporting found. Aniruddhacharya has apologised publicly at least once, saying his remarks were taken out of context.
summary_hi: >
  अनिरुद्धाचार्य (जन्म नाम अनिल कुमार तिवारी, कुछ रिपोर्टों में अनिरुद्ध राम तिवारी) वृंदावन के गौरी गोपाल आश्रम से जुड़े एक कथावाचक हैं, जो वृद्ध महिलाओं के लिए एक आश्रय गृह भी चलाता है। अक्टूबर 2022 में देवी सीता और द्रौपदी संबंधी टिप्पणी को लेकर वृंदावन थाने में उनके विरुद्ध एफआईआर दर्ज हुई, जिसके बाद राष्ट्रीय महिला आयोग ने उनकी गिरफ़्तारी की माँग की; सार्वजनिक रिकॉर्ड में कोई आरोप-पत्र, गिरफ़्तारी या अदालती परिणाम नहीं मिला। दिसंबर 2025 में, पुलिस द्वारा पहले की शिकायत पर कार्रवाई न करने के बाद, मथुरा की एक अदालत ने महिलाओं की विवाह-योग्य आयु संबंधी टिप्पणी पर एक निजी आपराधिक परिवाद स्वीकार किया, जिसकी सुनवाई जनवरी 2026 के लिए तय हुई। अक्टूबर 2025 में एक कार्यकर्ता ने अलग से, भारत के मुख्य न्यायाधीश पर एक अधिवक्ता द्वारा जूता फेंकने के प्रयास से पहले दिए गए बयानों को लेकर, उनके विरुद्ध आपराधिक अवमानना कार्यवाही की सहमति के लिए महान्यायवादी को लिखा; नवीनतम उपलब्ध रिपोर्टिंग तक इस पर कोई निर्णय नहीं हुआ था। अनिरुद्धाचार्य ने कम से कम एक बार सार्वजनिक रूप से माफी माँगी है, यह कहते हुए कि उनकी टिप्पणियों को संदर्भ से हटकर पेश किया गया।
hi_reviewed: false
response_from_subject:
  text_en: >
    After widespread criticism of his July 2025 remark that girls are "fully mature" by age 25 and should therefore marry earlier, Aniruddhacharya publicly apologised, saying his video had been "wrongly circulated" on social media and taken out of context.
  text_hi: >
    जुलाई 2025 की अपनी टिप्पणी, कि लड़कियाँ 25 वर्ष की आयु तक "पूरी तरह परिपक्व" हो जाती हैं और इसलिए उनकी शादी जल्दी होनी चाहिए, पर व्यापक आलोचना के बाद अनिरुद्धाचार्य ने सार्वजनिक रूप से माफी माँगी, यह कहते हुए कि उनके वीडियो को सोशल मीडिया पर "गलत तरीके से प्रचारित" किया गया और संदर्भ से हटाया गया।
  source_id: an-src-06

