summary_en: >-
  Shri Ram Janmabhoomi Teerth Kshetra is the trust constituted by the Government of India in February 2020, after the Supreme Court's November 2019 Ayodhya judgment, to build and manage the Ram temple at Ayodhya; the temple was consecrated on 22 January 2024. In June 2026, after public allegations that offerings at the temple had been misappropriated, the Uttar Pradesh government set up a Special Investigation Team at the trust's own request. On the SIT's preliminary report an FIR was registered on 25 June 2026 on the complaint of a trustee, eight donation-handling staff were arrested and remanded, and the trust's general secretary Champat Rai and trustee Anil Mishra resigned, citing moral responsibility. The Supreme Court is monitoring the police SIT, which it directed to include a forensic auditor. No trustee has been named as an accused in the record fetched. A 2021 land purchase by the trust drew allegations of over-pricing from opposition politicians; the trust denied them and no official inquiry into that purchase was found on record.
summary_hi: >-
  श्री राम जन्मभूमि तीर्थ क्षेत्र वह ट्रस्ट है जिसे भारत सरकार ने सर्वोच्च न्यायालय के नवंबर 2019 के अयोध्या फैसले के बाद फरवरी 2020 में अयोध्या में राम मंदिर के निर्माण और प्रबंधन के लिए गठित किया; मंदिर की प्राण-प्रतिष्ठा 22 जनवरी 2024 को हुई। जून 2026 में मंदिर के चढ़ावे के गबन के सार्वजनिक आरोपों के बाद उत्तर प्रदेश सरकार ने ट्रस्ट के ही अनुरोध पर एक विशेष जांच दल (एसआईटी) गठित किया। एसआईटी की प्रारंभिक रिपोर्ट पर 25 जून 2026 को एक ट्रस्टी की शिकायत पर एफआईआर दर्ज हुई, दान-प्रबंधन से जुड़े आठ कर्मचारी गिरफ्तार कर न्यायिक हिरासत में भेजे गए, और ट्रस्ट के महासचिव चंपत राय तथा ट्रस्टी अनिल मिश्र ने नैतिक जिम्मेदारी का हवाला देते हुए इस्तीफा दिया। सर्वोच्च न्यायालय पुलिस एसआईटी की निगरानी कर रहा है और उसने उसमें फॉरेंसिक ऑडिटर शामिल करने का निर्देश दिया है। प्राप्त अभिलेखों में किसी ट्रस्टी को आरोपी नहीं बनाया गया है। ट्रस्ट की 2021 की एक भूमि खरीद पर विपक्षी नेताओं ने अधिक कीमत के आरोप लगाए; ट्रस्ट ने उन्हें खारिज किया और उस खरीद की कोई आधिकारिक जांच अभिलेख में नहीं मिली।
hi_reviewed: false
response_from_subject:
  text_en: >-
    In a statement issued on 26 June 2026 through its treasurer Swami Govind Dev Giri, the trust said it was "deeply saddened, hurt and distressed by the recent incidents related to the Ayodhya Ram Temple", that an FIR had been registered on the basis of the SIT's interim report and legal proceedings were under way, and that the silver bricks and jewellery donated to the trust were fully accounted for. On 6 July 2026 the trust announced an interim general secretary, a committee to select a chief executive officer, and a pledge of transparency on donations; on 22 July 2026 it approved revised donation and temple management protocols. On 14 June 2021 the trust's then general secretary Champat Rai rejected the land-purchase allegations as politically motivated.
  text_hi: >-
    26 जून 2026 को कोषाध्यक्ष स्वामी गोविंद देव गिरि के माध्यम से जारी बयान में ट्रस्ट ने कहा कि वह अयोध्या राम मंदिर से जुड़ी हालिया घटनाओं से "गहरा दुखी, आहत और व्यथित" है, कि एसआईटी की अंतरिम रिपोर्ट के आधार पर एफआईआर दर्ज हो चुकी है और कानूनी कार्यवाही चल रही है, और ट्रस्ट को दान की गई चांदी की ईंटें और आभूषण पूरी तरह हिसाब में हैं। 6 जुलाई 2026 को ट्रस्ट ने अंतरिम महासचिव, सीईओ चयन समिति और दान में पारदर्शिता की घोषणा की; 22 जुलाई 2026 को उसने संशोधित दान और मंदिर प्रबंधन प्रोटोकॉल स्वीकृत किए। 14 जून 2021 को तत्कालीन महासचिव चंपत राय ने भूमि खरीद के आरोपों को राजनीति से प्रेरित बताकर खारिज किया था।
  source_id: rjtk-src-06

