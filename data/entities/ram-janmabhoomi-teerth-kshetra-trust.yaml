cases:
  - id: rjtk-ayodhya-donation-fir-2026
    title_en: State v. Avinash Shukla and others (Ram temple donation theft FIR, Ayodhya)
    title_hi: राज्य बनाम अविनाश शुक्ला व अन्य (राम मंदिर चढ़ावा चोरी एफआईआर, अयोध्या)
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court: Chief Judicial Magistrate / Special Court (Prevention of Corruption Act), Ayodhya
    case_number:
    filed_year: 2026
    case_type: criminal
    statutes:
      - BNS s.306 (theft by clerk or servant)
      - BNS s.316 (criminal breach of trust)
      - BNS s.317 (receiving stolen property)
      - BNS s.61 (criminal conspiracy)
      - Prevention of Corruption Act s.13(1)(a)
    status: Under investigation; eight accused in judicial custody; chargesheet not found on record as of 2026-09-09
    tier: under_investigation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >-
      On 25 June 2026, after the Uttar Pradesh government's SIT submitted its preliminary report, an FIR was registered at Shri Ram Janmabhoomi police station, Ayodhya, on the written complaint of trustee Krishnamohan (Krishna Mohan). It named eight persons engaged in handling, transporting and counting donation-box cash - Avinash Shukla, Anukalp Mishra, Lavkush Mishra, Manish Kumar Yadav, Karunesh Pandey, Ramashankar Mishra, Subhash Srivastava and Ram Shankar Yadav alias Tinnu - and unidentified others. PTI reported the FIR under BNS sections 306, 316, 317 and 61; the prosecution and later reports also cite the Prevention of Corruption Act. All eight were arrested and remanded on 26 June 2026; the prosecution told the CJM court Rs 79.85 lakh had been recovered, nothing from Subhash Srivastava. Judicial custody was extended on 29 June and 13 July 2026. The accused are staff, not trustees; the trust is the complainant. Police told the media in August 2026 that a chargesheet was expected, but none was found on record when this file was written.
    summary_hi: >-
      25 जून 2026 को उत्तर प्रदेश सरकार की एसआईटी की प्रारंभिक रिपोर्ट के बाद ट्रस्टी कृष्णमोहन की लिखित शिकायत पर श्री राम जन्मभूमि थाना, अयोध्या में एफआईआर दर्ज हुई। इसमें दानपात्र की नकदी संभालने, ले जाने और गिनने में लगे आठ व्यक्तियों - अविनाश शुक्ला, अनुकल्प मिश्र, लवकुश मिश्र, मनीष कुमार यादव, करुणेश पांडेय, रामाशंकर मिश्र, सुभाष श्रीवास्तव और रामशंकर यादव उर्फ टिन्नू - तथा अज्ञात अन्य को नामजद किया गया। पीटीआई के अनुसार एफआईआर बीएनएस की धारा 306, 316, 317 और 61 में दर्ज हुई; अभियोजन और बाद की रिपोर्टों में भ्रष्टाचार निवारण अधिनियम का भी उल्लेख है। आठों को 26 जून 2026 को गिरफ्तार कर रिमांड पर भेजा गया; अभियोजन ने सीजेएम अदालत को बताया कि 79.85 लाख रुपये बरामद हुए, सुभाष श्रीवास्तव से कुछ नहीं। न्यायिक हिरासत 29 जून और 13 जुलाई 2026 को बढ़ाई गई। आरोपी कर्मचारी हैं, ट्रस्टी नहीं; ट्रस्ट शिकायतकर्ता है। इस फ़ाइल के लिखे जाने तक कोई आरोपपत्र अभिलेख में नहीं मिला।
    source_ids: [ rjtk-src-03, rjtk-src-04, rjtk-src-05, rjtk-src-16, rjtk-src-40 ]

  - id: rjtk-up-sit-donation-inquiry-2026
    title_en: Uttar Pradesh government SIT into alleged misappropriation of Ram temple donations
    title_hi: राम मंदिर चढ़ावे के कथित गबन पर उत्तर प्रदेश सरकार की एसआईटी जांच
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court:
    case_number:
    filed_year: 2026
    case_type: inquiry
    statutes: []
    status: Administrative SIT reported (final report handed to trust 2026-08-18 per outlets); police SIT under Supreme Court monitoring
    tier: under_investigation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >-
      On 13 June 2026 the Uttar Pradesh government, at the request of the trust, constituted a three-member SIT headed by Lucknow Divisional Commissioner Vijay Vishwas Pant with IG Kiran S and Special Secretary (Finance) Neel Ratan to inquire into alleged misappropriation of donations and offerings at the Ram temple. Its preliminary report went to the Additional Chief Secretary (Home) on 23 June 2026 and led to the FIR; its deadline was extended on 1 July to 15 July 2026. After the Supreme Court said the case needed experienced police officers, the state notified a police SIT headed by IG Kiran S on 25 July 2026, to which the court added a forensic auditor. The Week, Outlook and India TV reported that the administrative SIT's final report was handed to the trust through the Home Department on 18 August 2026 and did not name former general secretary Champat Rai or former trustee Anil Mishra; no official release of the final report was found.
    summary_hi: >-
      13 जून 2026 को उत्तर प्रदेश सरकार ने ट्रस्ट के अनुरोध पर लखनऊ मंडलायुक्त विजय विश्वास पंत की अध्यक्षता में आईजी किरण एस और विशेष सचिव (वित्त) नील रत्न सहित तीन सदस्यीय एसआईटी गठित की। इसकी प्रारंभिक रिपोर्ट 23 जून 2026 को अपर मुख्य सचिव (गृह) को सौंपी गई जिसके आधार पर एफआईआर दर्ज हुई; 1 जुलाई को इसकी अवधि 15 जुलाई 2026 तक बढ़ाई गई। सर्वोच्च न्यायालय के यह कहने पर कि मामले में अनुभवी पुलिस अधिकारियों की जरूरत है, राज्य ने 25 जुलाई 2026 को आईजी किरण एस के नेतृत्व में पुलिस एसआईटी अधिसूचित की, जिसमें न्यायालय ने फॉरेंसिक ऑडिटर जोड़ने का निर्देश दिया। द वीक, आउटलुक और इंडिया टीवी के अनुसार प्रशासनिक एसआईटी की अंतिम रिपोर्ट 18 अगस्त 2026 को गृह विभाग के माध्यम से ट्रस्ट को सौंपी गई और उसमें पूर्व महासचिव चंपत राय या पूर्व ट्रस्टी अनिल मिश्र का नाम नहीं था; अंतिम रिपोर्ट की कोई आधिकारिक विज्ञप्ति नहीं मिली।
    source_ids: [ rjtk-src-01, rjtk-src-02, rjtk-src-07, rjtk-src-13, rjtk-src-18, rjtk-src-27, rjtk-src-31, rjtk-src-32 ]

  - id: rjtk-supreme-court-writs-2026
    title_en: Narendra Kumar Goswami v. Union of India and connected writ petitions (Supreme Court)
    title_hi: नरेंद्र कुमार गोस्वामी बनाम भारत संघ व संबद्ध रिट याचिकाएँ (सर्वोच्च न्यायालय)
    jurisdiction_country: IN
    jurisdiction_region:
    court: Supreme Court of India
    case_number: W.P.(C) 790/2026; W.P.(Crl.) 241/2026; W.P.(Crl.) 256/2026
    filed_year: 2026
    case_type: civil
    statutes: [ Constitution of India, Article 32 ]
    status: Pending; Supreme Court monitoring the SIT investigation
    tier: regulatory_action
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >-
      Three writ petitions - Narendra Kumar Goswami v. Union of India (W.P.(C) 790/2026), Ajay Kumar Rai and another v. Sri Ram Janmabhoomi Teerth Kshetra Trust (W.P.(Crl.) 241/2026) and Sudhakar Singh v. Union of India (W.P.(Crl.) 256/2026) - sought a CBI probe, a CAG or forensic audit and court-monitored oversight of the trust's donations. A vacation bench declined urgent listing on 25 June 2026. On 13 July 2026 a bench of CJI Surya Kant and Justices Joymalya Bagchi and V Mohana sought the SIT's status report and issued notice to the Union, Uttar Pradesh and the trust. On 20 July the court asked the state to consider a police SIT; on 27 July it directed that a forensic investigative auditor be associated with the SIT and that a status report be filed within two weeks; on 17 August it allowed litigants and bona fide citizens to send suggestions to the SIT through the Solicitor General. The Allahabad High Court (Lucknow bench) declined to entertain three PILs on the same subject on 6 and 7 July 2026 because the matter was pending in the Supreme Court. The trust is a respondent; no adverse finding against it has been recorded.
    summary_hi: >-
      तीन रिट याचिकाओं - नरेंद्र कुमार गोस्वामी बनाम भारत संघ (डब्ल्यू.पी.(सी) 790/2026), अजय कुमार राय व अन्य बनाम श्री राम जन्मभूमि तीर्थ क्षेत्र ट्रस्ट (डब्ल्यू.पी.(सीआरएल) 241/2026) और सुधाकर सिंह बनाम भारत संघ (डब्ल्यू.पी.(सीआरएल) 256/2026) - में सीबीआई जांच, सीएजी या फॉरेंसिक ऑडिट और ट्रस्ट के दान पर न्यायालय-निगरानी की मांग की गई। अवकाशकालीन पीठ ने 25 जून 2026 को तत्काल सुनवाई से इनकार किया। 13 जुलाई 2026 को मुख्य न्यायाधीश सूर्यकांत, न्यायमूर्ति जॉयमाल्य बागची और न्यायमूर्ति वी मोहना की पीठ ने एसआईटी की स्थिति रिपोर्ट मांगी और केंद्र, उत्तर प्रदेश और ट्रस्ट को नोटिस जारी किया। 20 जुलाई को न्यायालय ने राज्य से पुलिस एसआईटी पर विचार करने को कहा; 27 जुलाई को उसने एसआईटी में फॉरेंसिक ऑडिटर जोड़ने और दो सप्ताह में स्थिति रिपोर्ट दाखिल करने का निर्देश दिया; 17 अगस्त को उसने याचिकाकर्ताओं और सद्भावी नागरिकों को सॉलिसिटर जनरल के माध्यम से एसआईटी को सुझाव भेजने की अनुमति दी। इलाहाबाद उच्च न्यायालय (लखनऊ पीठ) ने 6 और 7 जुलाई 2026 को इसी विषय की तीन जनहित याचिकाओं पर विचार से इनकार किया क्योंकि मामला सर्वोच्च न्यायालय में लंबित था। ट्रस्ट प्रतिवादी है; उसके विरुद्ध कोई प्रतिकूल निष्कर्ष दर्ज नहीं हुआ है।
    source_ids: [ rjtk-src-09, rjtk-src-11, rjtk-src-13, rjtk-src-14, rjtk-src-23, rjtk-src-24, rjtk-src-25, rjtk-src-26, rjtk-src-28, rjtk-src-29, rjtk-src-30 ]

claims:
  - id: rjtk-claim-01
    case_id: rjtk-up-sit-donation-inquiry-2026
    statement_en: >-
      On 13 June 2026 the Uttar Pradesh government, at the request of Shri Ram Janmabhoomi Teerth Kshetra Trust, constituted a three-member Special Investigation Team headed by Lucknow Divisional Commissioner Vijay Vishwas Pant, with Inspector General of Police Kiran S and Special Secretary (Finance) Neel Ratan, to inquire into alleged misappropriation of donations and offerings at the Ram temple, Ayodhya.
    statement_hi: >-
      13 जून 2026 को उत्तर प्रदेश सरकार ने श्री राम जन्मभूमि तीर्थ क्षेत्र ट्रस्ट के अनुरोध पर लखनऊ मंडलायुक्त विजय विश्वास पंत की अध्यक्षता में, पुलिस महानिरीक्षक किरण एस और विशेष सचिव (वित्त) नील रत्न सहित, तीन सदस्यीय विशेष जांच दल गठित किया, जो अयोध्या के राम मंदिर में दान और चढ़ावे के कथित गबन की जांच करे।
    tier: under_investigation
    date: 2026-06-13
    source_ids: [ rjtk-src-01, rjtk-src-02, rjtk-src-18, rjtk-src-16 ]

  - id: rjtk-claim-02
    case_id: rjtk-up-sit-donation-inquiry-2026
    statement_en: >-
      On 23 June 2026 the SIT submitted its preliminary report to Additional Chief Secretary (Home) Sanjay Prasad, recommending strict action; on 1 July 2026 the state government extended the SIT's deadline for its final report by 15 days to 15 July 2026.
    statement_hi: >-
      23 जून 2026 को एसआईटी ने अपनी प्रारंभिक रिपोर्ट अपर मुख्य सचिव (गृह) संजय प्रसाद को सौंपी, जिसमें कड़ी कार्रवाई की सिफारिश की गई; 1 जुलाई 2026 को राज्य सरकार ने एसआईटी की अंतिम रिपोर्ट की समय-सीमा 15 दिन बढ़ाकर 15 जुलाई 2026 कर दी।
    tier: under_investigation
    date: 2026-06-23
    source_ids: [ rjtk-src-02, rjtk-src-03, rjtk-src-07 ]

  - id: rjtk-claim-03
    case_id: rjtk-ayodhya-donation-fir-2026
    statement_en: >-
      On 25 June 2026 an FIR was registered at Shri Ram Janmabhoomi police station, Ayodhya, on the written complaint of trust member Krishnamohan, naming Avinash Shukla, Anukalp Mishra, Lavkush Mishra, Manish Kumar Yadav, Karunesh Pandey, Ramashankar Mishra, Subhash Srivastava and Ram Shankar Yadav alias Tinnu, and unidentified others, for alleged theft and misappropriation of offerings and donations received by the trust.
    statement_hi: >-
      25 जून 2026 को ट्रस्ट सदस्य कृष्णमोहन की लिखित शिकायत पर श्री राम जन्मभूमि थाना, अयोध्या में एफआईआर दर्ज हुई, जिसमें अविनाश शुक्ला, अनुकल्प मिश्र, लवकुश मिश्र, मनीष कुमार यादव, करुणेश पांडेय, रामाशंकर मिश्र, सुभाष श्रीवास्तव और रामशंकर यादव उर्फ टिन्नू तथा अज्ञात अन्य को ट्रस्ट को प्राप्त चढ़ावे और दान की कथित चोरी और गबन के लिए नामजद किया गया।
    tier: under_investigation
    date: 2026-06-25
    source_ids: [ rjtk-src-03, rjtk-src-05, rjtk-src-16 ]

  - id: rjtk-claim-04
    case_id: rjtk-ayodhya-donation-fir-2026
    statement_en: >-
      PTI reported the FIR as registered under Bharatiya Nyaya Sanhita sections 306 (theft by clerk or servant), 316 (criminal breach of trust), 317 (receiving stolen property) and 61 (criminal conspiracy); the prosecution at the remand hearing and later reports of the SIT's final report also cite section 13(1)(a) of the Prevention of Corruption Act.
    statement_hi: >-
      पीटीआई के अनुसार एफआईआर भारतीय न्याय संहिता की धारा 306 (लिपिक या सेवक द्वारा चोरी), 316 (आपराधिक न्यासभंग), 317 (चुराई संपत्ति प्राप्त करना) और 61 (आपराधिक षड्यंत्र) में दर्ज हुई; रिमांड सुनवाई में अभियोजन और एसआईटी की अंतिम रिपोर्ट की बाद की रिपोर्टों में भ्रष्टाचार निवारण अधिनियम की धारा 13(1)(क) का भी उल्लेख है।
    tier: under_investigation
    date: 2026-06-25
    source_ids: [ rjtk-src-16, rjtk-src-05, rjtk-src-32, rjtk-src-40 ]

  - id: rjtk-claim-05
    case_id: rjtk-ayodhya-donation-fir-2026
    statement_en: >-
      On 26 June 2026 Uttar Pradesh Police arrested the eight persons named in the FIR - staff engaged in handling, transporting and counting donation-box cash, including, per PTI, counting staff Anukalp Mishra and Lavkush Mishra, retired bank employee Subhash Srivastava who supervised counting, and Ram Shankar Yadav alias Tinnu, a former driver of the general secretary - and the Chief Judicial Magistrate, Ayodhya, remanded them to judicial custody until 29 June 2026.
    statement_hi: >-
      26 जून 2026 को उत्तर प्रदेश पुलिस ने एफआईआर में नामजद आठों व्यक्तियों को गिरफ्तार किया - दानपात्र की नकदी संभालने, ले जाने और गिनने में लगे कर्मचारी, जिनमें पीटीआई के अनुसार गिनती कर्मी अनुकल्प मिश्र और लवकुश मिश्र, गिनती की निगरानी करने वाले सेवानिवृत्त बैंक कर्मी सुभाष श्रीवास्तव और महासचिव के पूर्व चालक रामशंकर यादव उर्फ टिन्नू शामिल थे - और मुख्य न्यायिक मजिस्ट्रेट, अयोध्या ने उन्हें 29 जून 2026 तक न्यायिक हिरासत में भेजा।
    tier: under_investigation
    date: 2026-06-26
    source_ids: [ rjtk-src-04, rjtk-src-05, rjtk-src-16, rjtk-src-17, rjtk-src-40 ]

  - id: rjtk-claim-06
    case_id: rjtk-ayodhya-donation-fir-2026
    statement_en: >-
      At the remand hearing on 26 June 2026 the prosecution told the Chief Judicial Magistrate, Ayodhya, that Rs 79.85 lakh had been recovered from the accused, with no recovery from Subhash Srivastava; judicial custody of all eight was extended by 14 days on 29 June 2026 and again on 13 July 2026.
    statement_hi: >-
      26 जून 2026 की रिमांड सुनवाई में अभियोजन ने मुख्य न्यायिक मजिस्ट्रेट, अयोध्या को बताया कि आरोपियों से 79.85 लाख रुपये बरामद हुए हैं, सुभाष श्रीवास्तव से कोई बरामदगी नहीं हुई; आठों की न्यायिक हिरासत 29 जून 2026 और फिर 13 जुलाई 2026 को 14-14 दिन बढ़ाई गई।
    tier: under_investigation
    date: 2026-06-26
    source_ids: [ rjtk-src-05, rjtk-src-10, rjtk-src-40, rjtk-src-41 ]

  - id: rjtk-claim-07
    case_id: rjtk-up-sit-donation-inquiry-2026
    statement_en: >-
      According to PTI's account of the SIT's preliminary report, standard operating procedures for donation counting were violated - no frisking of counting staff, cash from several donation boxes counted together, and CCTV footage retained for 45 days instead of 180 - and about 70 suspected pilferage incidents were captured on CCTV between 27 April and 5 June 2026.
    statement_hi: >-
      एसआईटी की प्रारंभिक रिपोर्ट के पीटीआई विवरण के अनुसार दान-गिनती की मानक प्रक्रियाओं का उल्लंघन हुआ - गिनती कर्मियों की तलाशी नहीं, कई दानपात्रों की नकदी एक साथ गिनी गई, और सीसीटीवी फुटेज 180 के बजाय 45 दिन ही रखी गई - और 27 अप्रैल से 5 जून 2026 के बीच लगभग 70 संदिग्ध चोरी की घटनाएँ सीसीटीवी में दर्ज हुईं।
    tier: under_investigation
    date: 2026-06-23
    source_ids: [ rjtk-src-21, rjtk-src-02 ]

  - id: rjtk-claim-08
    case_id: rjtk-up-sit-donation-inquiry-2026
    statement_en: >-
      Outlook India reported on 4 July 2026 that, according to the probe, small pilferage at the temple grew into organised theft during the Maha Kumbh of 13 January to 26 February 2025, when daily footfall rose to 10-12 lakh, and that about Rs 80 lakh plus foreign currency had been recovered from seven of the eight accused. This period attribution comes from outlet reporting; no official document stating it was found.
    statement_hi: >-
      आउटलुक इंडिया ने 4 जुलाई 2026 को रिपोर्ट किया कि जांच के अनुसार मंदिर में छोटी-मोटी चोरी 13 जनवरी से 26 फरवरी 2025 के महाकुंभ के दौरान, जब दैनिक भीड़ 10-12 लाख तक पहुँची, संगठित चोरी में बदल गई, और आठ में से सात आरोपियों से लगभग 80 लाख रुपये और विदेशी मुद्रा बरामद हुई। अवधि का यह विवरण मीडिया रिपोर्ट पर आधारित है; इसे बताने वाला कोई आधिकारिक दस्तावेज़ नहीं मिला।
    tier: allegation
    date: 2026-07-04
    source_ids: [ rjtk-src-19 ]

  - id: rjtk-claim-09
    case_id: rjtk-up-sit-donation-inquiry-2026
    statement_en: >-
      The Week reported on 17 July 2026 that trust treasurer Govind Dev Giri estimated the total loss at about Rs 3 crore, that police had recovered Rs 79 lakh, that about Rs 78.94 lakh had been recovered from employees before the official investigation began, and that the SIT was examining the gap between the treasurer's estimate and the recoveries.
    statement_hi: >-
      द वीक ने 17 जुलाई 2026 को रिपोर्ट किया कि ट्रस्ट के कोषाध्यक्ष गोविंद देव गिरि ने कुल नुकसान लगभग 3 करोड़ रुपये आँका, पुलिस ने 79 लाख रुपये बरामद किए, आधिकारिक जांच शुरू होने से पहले कर्मचारियों से लगभग 78.94 लाख रुपये वसूले गए थे, और एसआईटी कोषाध्यक्ष के अनुमान और बरामदगी के अंतर की जांच कर रही थी।
    tier: allegation
    date: 2026-07-17
    source_ids: [ rjtk-src-22 ]

  - id: rjtk-claim-10
    case_id: rjtk-up-sit-donation-inquiry-2026
    statement_en: >-
      Business Today reported on 7 July 2026 that the SIT had widened its scrutiny to more than Rs 124 crore spent by the trust on major events over two years, including about Rs 113 crore on the 22 January 2024 consecration; Outlook reported sources describing this as an expenditure audit that had reached no conclusion on irregularity. These figures are the outlets' own.
    statement_hi: >-
      बिज़नेस टुडे ने 7 जुलाई 2026 को रिपोर्ट किया कि एसआईटी ने दो वर्षों में प्रमुख आयोजनों पर ट्रस्ट द्वारा खर्च 124 करोड़ रुपये से अधिक, जिसमें 22 जनवरी 2024 की प्राण-प्रतिष्ठा पर लगभग 113 करोड़ रुपये शामिल हैं, की जांच का दायरा बढ़ाया; आउटलुक ने सूत्रों के हवाले से इसे व्यय ऑडिट बताया जिसमें अनियमितता पर कोई निष्कर्ष नहीं निकला था। ये आंकड़े मीडिया के अपने हैं।
    tier: allegation
    date: 2026-07-07
    source_ids: [ rjtk-src-20 ]

  - id: rjtk-claim-11
    case_id: rjtk-up-sit-donation-inquiry-2026
    statement_en: >-
      On 26 June 2026 general secretary Champat Rai and trustee Anil Mishra submitted their resignations, stated to be on moral grounds following the donation case; the trust accepted both at its meeting on 6 July 2026, appointed trustee Krishna Mohan as interim general secretary, formed a three-member committee to recommend a chief executive officer, and removed Gopal Nagar Kote from its list of special invitees.
    statement_hi: >-
      26 जून 2026 को महासचिव चंपत राय और ट्रस्टी अनिल मिश्र ने दान मामले के बाद नैतिक आधार पर बताए गए इस्तीफे दिए; ट्रस्ट ने 6 जुलाई 2026 की बैठक में दोनों स्वीकार किए, ट्रस्टी कृष्णमोहन को अंतरिम महासचिव नियुक्त किया, मुख्य कार्यकारी अधिकारी की सिफारिश के लिए तीन सदस्यीय समिति बनाई, और गोपाल नागर कोटे को विशेष आमंत्रितों की सूची से हटाया।
    tier: under_investigation
    date: 2026-07-06
    source_ids: [ rjtk-src-06, rjtk-src-08, rjtk-src-15, rjtk-src-34, rjtk-src-36, rjtk-src-43 ]

  - id: rjtk-claim-12
    case_id: rjtk-up-sit-donation-inquiry-2026
    statement_en: >-
      In a statement issued on 26 June 2026 through treasurer Swami Govind Dev Giri, the trust said it was deeply saddened, hurt and distressed by the incidents, that an FIR had been registered on the basis of the SIT's interim report with legal proceedings under way, and that the silver bricks and jewellery donated to the trust were fully accounted for; on 22 July 2026 it approved a revised donation system and an arrangement with the Mint to assay gold and silver offerings.
    statement_hi: >-
      26 जून 2026 को कोषाध्यक्ष स्वामी गोविंद देव गिरि के माध्यम से जारी बयान में ट्रस्ट ने कहा कि वह घटनाओं से गहरा दुखी, आहत और व्यथित है, कि एसआईटी की अंतरिम रिपोर्ट के आधार पर एफआईआर दर्ज हो चुकी है और कानूनी कार्यवाही चल रही है, और दान की गई चांदी की ईंटें और आभूषण पूरी तरह हिसाब में हैं; 22 जुलाई 2026 को उसने संशोधित दान प्रणाली और सोने-चांदी के चढ़ावे की जांच के लिए टकसाल के साथ व्यवस्था स्वीकृत की।
    tier: under_investigation
    date: 2026-06-26
    source_ids: [ rjtk-src-06, rjtk-src-12, rjtk-src-42 ]

  - id: rjtk-claim-13
    case_id: rjtk-supreme-court-writs-2026
    statement_en: >-
      On 13 July 2026 a Supreme Court bench of Chief Justice Surya Kant and Justices Joymalya Bagchi and V Mohana, hearing writ petitions W.P.(C) 790/2026, W.P.(Crl.) 241/2026 and W.P.(Crl.) 256/2026 seeking a CBI probe and audit of the trust's donations, directed the SIT to file a status report and issued notice to the Union of India, the State of Uttar Pradesh and Shri Ram Janmabhoomi Teerth Kshetra Trust.
    statement_hi: >-
      13 जुलाई 2026 को मुख्य न्यायाधीश सूर्यकांत, न्यायमूर्ति जॉयमाल्य बागची और न्यायमूर्ति वी मोहना की सर्वोच्च न्यायालय पीठ ने ट्रस्ट के दान की सीबीआई जांच और ऑडिट की मांग वाली रिट याचिकाओं डब्ल्यू.पी.(सी) 790/2026, डब्ल्यू.पी.(सीआरएल) 241/2026 और डब्ल्यू.पी.(सीआरएल) 256/2026 पर एसआईटी को स्थिति रिपोर्ट दाखिल करने का निर्देश दिया और भारत संघ, उत्तर प्रदेश राज्य तथा श्री राम जन्मभूमि तीर्थ क्षेत्र ट्रस्ट को नोटिस जारी किया।
    tier: regulatory_action
    date: 2026-07-13
    source_ids: [ rjtk-src-09, rjtk-src-23 ]

  - id: rjtk-claim-14
    case_id: rjtk-supreme-court-writs-2026
    statement_en: >-
      On 20 July 2026 the Solicitor General told the Supreme Court that eight persons had been arrested and that the SIT had found a cognisable offence, and the court asked the Uttar Pradesh government to consider entrusting the investigation to an SIT of senior police officers while cautioning against politicising the matter.
    statement_hi: >-
      20 जुलाई 2026 को सॉलिसिटर जनरल ने सर्वोच्च न्यायालय को बताया कि आठ व्यक्ति गिरफ्तार किए गए हैं और एसआईटी ने संज्ञेय अपराध पाया है, और न्यायालय ने उत्तर प्रदेश सरकार से जांच वरिष्ठ पुलिस अधिकारियों की एसआईटी को सौंपने पर विचार करने को कहा तथा मामले के राजनीतिकरण के विरुद्ध आगाह किया।
    tier: regulatory_action
    date: 2026-07-20
    source_ids: [ rjtk-src-11, rjtk-src-29 ]

  - id: rjtk-claim-15
    case_id: rjtk-supreme-court-writs-2026
    statement_en: >-
      On 27 July 2026 the Uttar Pradesh government informed the Supreme Court that a four-member police SIT headed by Inspector General (Lucknow Range) Kiran S had been notified on 25 July 2026, and the court directed that a forensic investigative auditor be associated as a member of the SIT and that a status report on the investigation be filed within two weeks.
    statement_hi: >-
      27 जुलाई 2026 को उत्तर प्रदेश सरकार ने सर्वोच्च न्यायालय को सूचित किया कि पुलिस महानिरीक्षक (लखनऊ रेंज) किरण एस के नेतृत्व में चार सदस्यीय पुलिस एसआईटी 25 जुलाई 2026 को अधिसूचित की गई है, और न्यायालय ने निर्देश दिया कि एक फॉरेंसिक जांच ऑडिटर को एसआईटी के सदस्य के रूप में जोड़ा जाए और दो सप्ताह के भीतर जांच की स्थिति रिपोर्ट दाखिल की जाए।
    tier: regulatory_action
    date: 2026-07-27
    source_ids: [ rjtk-src-13, rjtk-src-26, rjtk-src-27, rjtk-src-28 ]

  - id: rjtk-claim-16
    statement_en: >-
      On 13-14 June 2021 AAP Rajya Sabha MP Sanjay Singh and former Samajwadi Party MLA Pawan Pandey alleged that on 18 March 2021 the trust bought 1.208 hectares at Bag Bijaisi village, Ayodhya, for Rs 18.5 crore minutes after the same land was sold for Rs 2 crore, and sought a CBI and ED investigation; Congress sought a Supreme Court-monitored probe. No official inquiry into this purchase was found on record.
    statement_hi: >-
      13-14 जून 2021 को आप के राज्यसभा सांसद संजय सिंह और समाजवादी पार्टी के पूर्व विधायक पवन पांडेय ने आरोप लगाया कि 18 मार्च 2021 को ट्रस्ट ने अयोध्या के बाग बिजैसी गाँव में 1.208 हेक्टेयर भूमि 18.5 करोड़ रुपये में खरीदी, जबकि कुछ मिनट पहले वही भूमि 2 करोड़ रुपये में बिकी थी, और सीबीआई व ईडी जांच की मांग की; कांग्रेस ने सर्वोच्च न्यायालय की निगरानी में जांच मांगी। इस खरीद की कोई आधिकारिक जांच अभिलेख में नहीं मिली।
    tier: allegation
    date: 2021-06-14
    source_ids: [ rjtk-src-38, rjtk-src-37, rjtk-src-39, rjtk-src-44 ]

  - id: rjtk-claim-17
    statement_en: >-
      On 14 June 2021 the trust's general secretary Champat Rai rejected the land-purchase allegations as politically motivated, saying land prices across Ayodhya had risen after the Supreme Court's 9 November 2019 judgment and that allegations had been levelled against the trust for years.
    statement_hi: >-
      14 जून 2021 को ट्रस्ट के महासचिव चंपत राय ने भूमि खरीद के आरोपों को राजनीति से प्रेरित बताकर खारिज किया और कहा कि सर्वोच्च न्यायालय के 9 नवंबर 2019 के फैसले के बाद पूरे अयोध्या में भूमि की कीमतें बढ़ी हैं और ट्रस्ट पर वर्षों से आरोप लगते रहे हैं।
    tier: allegation
    date: 2021-06-14
    source_ids: [ rjtk-src-37, rjtk-src-38 ]

