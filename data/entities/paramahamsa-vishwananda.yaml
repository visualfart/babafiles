summary_en: >-
  Paramahamsa Vishwananda, born in Mauritius, heads the religious community Bhakti Marga, whose headquarters is at Shree Peetha Nilaya in Springen, Heidenrod, Hesse, with further centres in Switzerland. In 2021 and 2022 Hessischer Rundfunk, the Hessian public broadcaster, published a television documentary and a six-part podcast, "Just Love", in which former members said he had subjected them to sexual assault; the reporting was taken up by Der Spiegel, the Süddeutsche Zeitung, the Frankfurter Allgemeine Zeitung and Der Tagesspiegel. He denies the allegations. No prosecuting authority has charged him: a criminal-law statement published by Bhakti Marga on 18 February 2022, based on file inspection at the Staatsanwaltschaft Wiesbaden, records six investigations between 2009 and 2021 arising from criminal complaints, all discontinued at an early stage because the prosecutor found no sufficient suspicion. Vishwananda and one other person obtained seven preliminary injunctions against the broadcaster from the Landgericht Hamburg in 2022; on appeal, Hessischer Rundfunk stated in March 2024 that the Oberlandesgericht Hamburg had found fully in its favour on the two podcast points it had appealed, holding the podcast to be balanced reporting and Vishwananda to have been sufficiently confronted with the allegations. Swiss and German sources also report a suspended Swiss sentence in the 2000s over the removal of relics from Catholic churches; no judgment could be obtained (see the note on source vish-src-09). Searches of Indian and United States court records found nothing.
summary_hi: >-
  मॉरीशस में जन्मे परमहंस विश्वानंद धार्मिक समुदाय भक्ति मार्ग के प्रमुख हैं, जिसका मुख्यालय जर्मनी के हेस्से राज्य में हाइडेनरोड के स्प्रिंगेन स्थित श्री पीठ निलय है, तथा स्विट्ज़रलैंड में भी उसके केंद्र हैं। 2021 और 2022 में हेस्से के सार्वजनिक प्रसारक हेसिशर रुंडफुंक ने "जस्ट लव" नाम से एक टेलीविज़न वृत्तचित्र और छह कड़ियों का पॉडकास्ट प्रकाशित किया, जिसमें पूर्व सदस्यों ने कहा कि उन्होंने उनके साथ यौन दुर्व्यवहार किया; इस रिपोर्टिंग को डेअर श्पीगेल, ज़ुडडॉयचे त्साइटुंग, फ्रांकफुर्टर अल्गेमाइने त्साइटुंग और डेअर टागेसश्पीगेल ने आगे बढ़ाया। वे आरोपों से इनकार करते हैं। किसी अभियोजन प्राधिकरण ने उन पर आरोप नहीं लगाया है: भक्ति मार्ग द्वारा 18 फरवरी 2022 को प्रकाशित एक आपराधिक-विधि वक्तव्य में, जो वीसबाडेन अभियोजन कार्यालय में फ़ाइल निरीक्षण पर आधारित है, दर्ज है कि 2009 से 2021 के बीच शिकायतों पर छह जांचें हुईं, जो सभी प्रारंभिक चरण में ही बंद कर दी गईं क्योंकि अभियोजक को पर्याप्त संदेह का आधार नहीं मिला। विश्वानंद और एक अन्य व्यक्ति ने 2022 में हैम्बर्ग जिला न्यायालय से प्रसारक के विरुद्ध सात अस्थायी निषेधाज्ञाएँ प्राप्त कीं; अपील में हेसिशर रुंडफुंक ने मार्च 2024 में कहा कि हैम्बर्ग उच्च प्रादेशिक न्यायालय ने पॉडकास्ट से जुड़े उन दो बिंदुओं पर पूरी तरह उसके पक्ष में निर्णय दिया जिन पर उसने अपील की थी, और माना कि पॉडकास्ट संतुलित रिपोर्टिंग है तथा विश्वानंद को आरोपों से पर्याप्त रूप से अवगत कराया गया था। स्विस और जर्मन स्रोत 2000 के दशक में कैथोलिक गिरजाघरों से अवशेष हटाने के मामले में एक निलंबित स्विस सज़ा की भी बात करते हैं; कोई निर्णय प्राप्त नहीं हो सका (स्रोत vish-src-09 की टिप्पणी देखें)। भारतीय और अमेरिकी न्यायालय अभिलेखों की खोज में कुछ नहीं मिला।
hi_reviewed: false
response_from_subject:
  text_en: >-
    In a statement published on 27 January 2022 Bhakti Marga said that "Sämtliche Vorwürfe entbehren jeglicher Grundlage" — all the accusations are without any foundation — and that Vishwananda has never induced, pressed or coerced any person into sexual acts against their will. Its criminal-law annex of 18 February 2022 states that a lawyer it instructed obtained file inspection at the Staatsanwaltschaft Wiesbaden, that there had been six investigations between 2009 and 2021, that all were discontinued at an early stage for want of sufficient suspicion, and that Vishwananda was never contacted or heard by the prosecutor. Through its lawyer Dr Ben M. Irle of IRLE MOSER Rechtsanwälte, the community said on 11 April 2022 that the seven injunctions it had obtained showed "das erschreckende Ausmaß journalistischer Sorgfaltspflichtverletzungen des Hessischen Rundfunks" — the alarming extent of the broadcaster's breaches of journalistic duty of care.
  text_hi: >-
    27 जनवरी 2022 को प्रकाशित एक वक्तव्य में भक्ति मार्ग ने कहा कि "सभी आरोप पूरी तरह निराधार हैं" और विश्वानंद ने कभी किसी व्यक्ति को उसकी इच्छा के विरुद्ध यौन कृत्यों के लिए प्रेरित, विवश या बाध्य नहीं किया। 18 फरवरी 2022 के उसके आपराधिक-विधि परिशिष्ट में कहा गया है कि उसके द्वारा नियुक्त एक अधिवक्ता ने वीसबाडेन अभियोजन कार्यालय में फ़ाइल निरीक्षण किया, 2009 से 2021 के बीच छह जांचें हुई थीं, सभी पर्याप्त संदेह के अभाव में प्रारंभिक चरण में ही बंद कर दी गईं, और अभियोजक ने विश्वानंद से कभी संपर्क नहीं किया और न उन्हें सुना। अपने अधिवक्ता डॉ. बेन एम. इर्ले (इर्ले मोज़र रेष्ट्सआनवैल्टे) के माध्यम से समुदाय ने 11 अप्रैल 2022 को कहा कि उसे प्राप्त सात निषेधाज्ञाएँ हेसिशर रुंडफुंक द्वारा पत्रकारीय सावधानी के कर्तव्य के उल्लंघन की "भयावह सीमा" दर्शाती हैं।
  source_id: vish-src-02

