  - id: vishwananda-wiesbaden-investigations-2009-2021
    title_en: Criminal complaints and investigations, Staatsanwaltschaft Wiesbaden (2009 to 2021)
    title_hi: आपराधिक शिकायतें और जांचें, वीसबाडेन अभियोजन कार्यालय (2009 से 2021)
    jurisdiction_country: DE
    jurisdiction_region: Hesse
    court: Staatsanwaltschaft Wiesbaden (public prosecutor's office)
    case_number:
    filed_year: 2009
    case_type: criminal
    statutes: []
    status: >-
      All six investigations discontinued at an early stage because the prosecutor found no sufficient suspicion (hinreichender Tatverdacht). No charge was ever brought and Vishwananda was never contacted or heard by the prosecutor. Further complaints are reported to have been time-barred.
    tier: closed
    verdict_date: 2022-02-18
    sentence_or_remedy:
    appeal_status:
    summary_en: >-
      Between 2009 and 2021 six investigations were opened at the Staatsanwaltschaft Wiesbaden on criminal complaints against Paramahamsa Vishwananda. The account of them on the public record comes from a criminal-law statement published by Bhakti Marga on 18 February 2022, written by a lawyer it instructed who had obtained file inspection at the prosecutor's office; the Swiss research service Relinfo, reporting the Hessischer Rundfunk investigation, states that four of the complaints concerned sexualised violence and one alleged manslaughter. All six were discontinued at an early stage for want of sufficient suspicion. No prosecuting authority has charged Vishwananda with any offence in Germany.
    summary_hi: >-
      2009 से 2021 के बीच परमहंस विश्वानंद के विरुद्ध आपराधिक शिकायतों पर वीसबाडेन अभियोजन कार्यालय में छह जांचें शुरू की गईं। सार्वजनिक अभिलेख में इनका विवरण भक्ति मार्ग द्वारा 18 फरवरी 2022 को प्रकाशित एक आपराधिक-विधि वक्तव्य से आता है, जिसे उसके द्वारा नियुक्त अधिवक्ता ने अभियोजन कार्यालय में फ़ाइल निरीक्षण के बाद लिखा; स्विस शोध सेवा रेलइन्फो, हेसिशर रुंडफुंक की जांच की रिपोर्ट करते हुए, कहती है कि इनमें से चार शिकायतें यौन हिंसा से संबंधित थीं और एक में गैर-इरादतन हत्या का आरोप था। सभी छह जांचें पर्याप्त संदेह के अभाव में प्रारंभिक चरण में ही बंद कर दी गईं। जर्मनी में किसी अभियोजन प्राधिकरण ने विश्वानंद पर कोई आरोप नहीं लगाया है।
    source_ids: [ vish-src-02, vish-src-09, vish-src-03 ]
  - id: vishwananda-hamburg-press-injunctions-2022
    title_en: Vishwananda v. Hessischer Rundfunk (Landgericht Hamburg and Oberlandesgericht Hamburg)
    title_hi: विश्वानंद बनाम हेसिशर रुंडफुंक (हैम्बर्ग जिला न्यायालय और हैम्बर्ग उच्च प्रादेशिक न्यायालय)
    jurisdiction_country: DE
    jurisdiction_region: Hamburg
    court: Landgericht Hamburg, Zivilkammer 24; Oberlandesgericht Hamburg on appeal
    case_number: 324 O 66/22, 324 O 67/22, 324 O 68/22, 324 O 69/22, 324 O 70/22, 324 O 71/22, 324 O 119/22
    filed_year: 2022
    case_type: civil
    statutes: []
    status: >-
      Seven preliminary injunctions granted to Vishwananda and one other person in 2022. On appeal the Oberlandesgericht Hamburg found fully for the broadcaster in February 2024 on the two podcast points it had appealed. As of the broadcaster's statement of 22 March 2024 the podcast was online in shortened form, the television documentary remained offline, and the broadcaster was also challenging the injunction covering the documentary. No court has found the underlying allegations proved or disproved.
    tier: allegation
    verdict_date: 2024-02
    sentence_or_remedy: Publication of specified statements prohibited by preliminary injunction; two of those prohibitions set aside on appeal.
    appeal_status: Broadcaster successful on the two podcast points appealed; challenge to the injunction against the television documentary continuing.
    summary_en: >-
      Press-law litigation brought by Vishwananda against the Hessian public broadcaster over its television documentary and six-part podcast "Just Love", in which former members of Bhakti Marga said he had subjected them to sexual assault. The Landgericht Hamburg's press chamber granted seven preliminary injunctions in 2022, its reasoning as reported by the applicants' lawyers being that statements going to the core allegation were procedurally untrue and not permissible even as suspicion reporting. On appeal the broadcaster stated that in February 2024 the Oberlandesgericht Hamburg found fully in its favour on the two podcast points it had appealed, holding that several people independently describing similar assaults satisfied the minimum evidential threshold for lawful suspicion reporting, that the podcast reported in a balanced and differentiated way, and that Vishwananda had been sufficiently confronted with the allegations. Both sides filed sworn affidavits. The allegations themselves have not been adjudicated.
    summary_hi: >-
      विश्वानंद द्वारा हेस्से के सार्वजनिक प्रसारक के विरुद्ध उसके टेलीविज़न वृत्तचित्र और छह कड़ियों के पॉडकास्ट "जस्ट लव" को लेकर दायर प्रेस-विधि मुकदमा, जिसमें भक्ति मार्ग के पूर्व सदस्यों ने कहा था कि उन्होंने उनके साथ यौन दुर्व्यवहार किया। हैम्बर्ग जिला न्यायालय की प्रेस पीठ ने 2022 में सात अस्थायी निषेधाज्ञाएँ दीं; आवेदकों के अधिवक्ताओं के अनुसार न्यायालय का तर्क था कि मुख्य आरोप से जुड़े कथन प्रक्रियात्मक रूप से असत्य हैं और संदेह-रिपोर्टिंग के रूप में भी अनुमेय नहीं हैं। अपील में प्रसारक ने कहा कि फरवरी 2024 में हैम्बर्ग उच्च प्रादेशिक न्यायालय ने उन दो पॉडकास्ट बिंदुओं पर पूरी तरह उसके पक्ष में निर्णय दिया जिन पर उसने अपील की थी, यह मानते हुए कि कई लोगों द्वारा स्वतंत्र रूप से समान दुर्व्यवहार का वर्णन वैध संदेह-रिपोर्टिंग के लिए आवश्यक न्यूनतम साक्ष्य-आधार पूरा करता है, कि पॉडकास्ट संतुलित और विवेकपूर्ण रिपोर्टिंग है, और कि विश्वानंद को आरोपों से पर्याप्त रूप से अवगत कराया गया था। दोनों पक्षों ने शपथ-पत्र दाखिल किए। आरोपों पर स्वयं कोई न्यायिक निर्णय नहीं हुआ है।
    source_ids: [ vish-src-01, vish-src-03, vish-src-04, vish-src-05, vish-src-06, vish-src-07 ]

claims:
  - id: vishwananda-claim-01
    case_id: vishwananda-hamburg-press-injunctions-2022
    statement_en: >-
      In 2021 and 2022 Hessischer Rundfunk published a television documentary and a six-part podcast titled "Just Love", in which former members of Bhakti Marga said that Paramahamsa Vishwananda had subjected them to sexual assault; he denies the allegations.
    statement_hi: >-
      2021 और 2022 में हेसिशर रुंडफुंक ने "जस्ट लव" नाम से एक टेलीविज़न वृत्तचित्र और छह कड़ियों का पॉडकास्ट प्रकाशित किया, जिसमें भक्ति मार्ग के पूर्व सदस्यों ने कहा कि परमहंस विश्वानंद ने उनके साथ यौन दुर्व्यवहार किया; वे इन आरोपों से इनकार करते हैं।
    tier: allegation
    date: 2022
    source_ids: [ vish-src-03, vish-src-10, vish-src-04, vish-src-06 ]
  - id: vishwananda-claim-02
    case_id: vishwananda-hamburg-press-injunctions-2022
    statement_en: >-
      In 2022 the Landgericht Hamburg, Zivilkammer 24, granted Paramahamsa Vishwananda and one other person seven preliminary injunctions against Hessischer Rundfunk over the "Just Love" documentary and podcast, in cases 324 O 66/22, 324 O 67/22, 324 O 68/22, 324 O 69/22, 324 O 70/22, 324 O 71/22 and 324 O 119/22.
    statement_hi: >-
      2022 में हैम्बर्ग जिला न्यायालय की 24वीं सिविल पीठ ने परमहंस विश्वानंद और एक अन्य व्यक्ति को "जस्ट लव" वृत्तचित्र और पॉडकास्ट को लेकर हेसिशर रुंडफुंक के विरुद्ध सात अस्थायी निषेधाज्ञाएँ दीं, जिनके मामले क्रमांक 324 O 66/22, 324 O 67/22, 324 O 68/22, 324 O 69/22, 324 O 70/22, 324 O 71/22 और 324 O 119/22 हैं।
    tier: allegation
    date: 2022-04-11
    source_ids: [ vish-src-01, vish-src-04, vish-src-05, vish-src-03 ]
  - id: vishwananda-claim-03
    case_id: vishwananda-hamburg-press-injunctions-2022
    statement_en: >-
      On 22 March 2024 Hessischer Rundfunk stated that in February 2024 the Oberlandesgericht Hamburg had found fully in its favour on the two podcast points it had appealed, that the court described the podcast as balanced and differentiated reporting, and that Vishwananda had been sufficiently confronted with the allegations.
    statement_hi: >-
      22 मार्च 2024 को हेसिशर रुंडफुंक ने कहा कि फरवरी 2024 में हैम्बर्ग उच्च प्रादेशिक न्यायालय ने उन दो पॉडकास्ट बिंदुओं पर पूरी तरह उसके पक्ष में निर्णय दिया जिन पर उसने अपील की थी, कि न्यायालय ने पॉडकास्ट को संतुलित और विवेकपूर्ण रिपोर्टिंग बताया, और कि विश्वानंद को आरोपों से पर्याप्त रूप से अवगत कराया गया था।
    tier: allegation
    date: 2024-03-22
    source_ids: [ vish-src-03, vish-src-06, vish-src-07 ]
  - id: vishwananda-claim-04
    case_id: vishwananda-wiesbaden-investigations-2009-2021
    statement_en: >-
      A criminal-law statement published by Bhakti Marga on 18 February 2022 records that a lawyer it instructed obtained file inspection at the Staatsanwaltschaft Wiesbaden and found that between 2009 and 2021 six investigations had been opened against Paramahamsa Vishwananda on criminal complaints, all of which were discontinued at an early stage because the prosecutor found no sufficient suspicion.
    statement_hi: >-
      भक्ति मार्ग द्वारा 18 फरवरी 2022 को प्रकाशित एक आपराधिक-विधि वक्तव्य में दर्ज है कि उसके द्वारा नियुक्त एक अधिवक्ता ने वीसबाडेन अभियोजन कार्यालय में फ़ाइल निरीक्षण किया और पाया कि 2009 से 2021 के बीच आपराधिक शिकायतों पर परमहंस विश्वानंद के विरुद्ध छह जांचें शुरू की गई थीं, जो सभी पर्याप्त संदेह के अभाव में प्रारंभिक चरण में ही बंद कर दी गईं।
    tier: closed
    date: 2022-02-18
    source_ids: [ vish-src-02, vish-src-09 ]
  - id: vishwananda-claim-05
    statement_en: >-
      Searches on 9 September 2026 of Indian Kanoon for "Bhakti Marga" and for "Vishwananda", and of CourtListener and RECAP for both terms, returned no court record concerning Paramahamsa Vishwananda or the Bhakti Marga community.
    statement_hi: >-
      9 सितंबर 2026 को इंडियन कानून पर "भक्ति मार्ग" और "विश्वानंद" के लिए तथा कोर्टलिसनर और रीकैप पर दोनों शब्दों के लिए की गई खोज में परमहंस विश्वानंद या भक्ति मार्ग समुदाय से संबंधित कोई न्यायालयी अभिलेख नहीं मिला।
    tier: no_record_found
    date: 2026-09-09
    source_ids: [ vish-src-11, vish-src-12 ]

