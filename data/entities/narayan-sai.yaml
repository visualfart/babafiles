summary_en: >
  Narayan Sai, son of Asaram, was convicted on 30 April 2019 by the 2nd Additional Sessions
  Judge, Surat of raping a woman disciple at the Jahangirpura ashram in Surat and elsewhere in
  2002-2005, and sentenced to life imprisonment. He has been in custody since 4 December 2013.
  His appeal is pending in the Gujarat High Court, which in May 2026 dismissed his fifth
  application for suspension of sentence; on 7 August 2026 the Supreme Court declined to
  suspend the sentence and asked the High Court to decide the appeal within three months. The
  Justice D.K. Trivedi Commission found no evidence that he performed tantric rituals in
  connection with the 2008 deaths of two gurukul students.
summary_hi: >
  आसाराम के पुत्र नारायण साईं को 30 अप्रैल 2019 को सूरत के द्वितीय अतिरिक्त सत्र न्यायाधीश ने
  2002-2005 में सूरत के जहाँगीरपुरा आश्रम और अन्य स्थानों पर एक महिला शिष्या से बलात्कार का दोषी
  ठहराकर आजीवन कारावास की सज़ा दी। वे 4 दिसंबर 2013 से हिरासत में हैं। उनकी अपील गुजरात उच्च
  न्यायालय में लंबित है, जिसने मई 2026 में सज़ा निलंबन का उनका पाँचवाँ आवेदन खारिज किया; 7 अगस्त
  2026 को सर्वोच्च न्यायालय ने सज़ा निलंबित करने से इनकार करते हुए उच्च न्यायालय से तीन माह में
  अपील तय करने को कहा। न्यायमूर्ति डी.के. त्रिवेदी आयोग को 2008 में गुरुकुल के दो छात्रों की मौत
  के संबंध में उनके द्वारा तांत्रिक क्रिया का कोई साक्ष्य नहीं मिला।
hi_reviewed: false
response_from_subject:
  text_en: >
    In his appeal before the Gujarat High Court (hearing of 17 March 2026) Narayan Sai
    contended that there were contradictions, improvements and discrepancies in the
    complainant's testimony across the FIR, her statement under section 164 CrPC and her
    evidence, that her conduct was inconsistent with that of a victim, and that the trial court
    had failed to independently evaluate the evidence or find guilt beyond reasonable doubt.
  text_hi: >
    गुजरात उच्च न्यायालय में अपनी अपील (17 मार्च 2026 की सुनवाई) में नारायण साईं ने कहा कि
    एफआईआर, धारा 164 सीआरपीसी के बयान और साक्ष्य में शिकायतकर्ता की गवाही में विरोधाभास, सुधार और
    विसंगतियाँ हैं, उसका आचरण पीड़िता जैसा नहीं था, और विचारण न्यायालय ने साक्ष्य का स्वतंत्र
    मूल्यांकन नहीं किया या संदेह से परे अपराध सिद्ध नहीं पाया।
  source_id: narayan-sai-src-07

