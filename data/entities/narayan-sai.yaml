cases:
  - id: narayan-sai-surat-rape-2013
    title_en: State of Gujarat v. Narayan @ Narayan Sai (Surat)
    title_hi: गुजरात राज्य बनाम नारायण उर्फ नारायण साईं (सूरत)
    jurisdiction_country: IN
    jurisdiction_region: Gujarat
    court: 2nd Additional Sessions Judge, Surat; Gujarat High Court (R/Criminal Appeal No. 1756 of 2019); Supreme Court (Diary No. 29992-2026)
    case_number: Sessions Case No. 141 of 2014
    filed_year: 2013
    case_type: criminal
    statutes: [IPC 376(2)(c), IPC 377, IPC 354, IPC 504, IPC 506(2), IPC 508, IPC 323]
    status: convicted; appeal pending in the Gujarat High Court
    tier: convicted
    verdict_date: 2019-04-30
    sentence_or_remedy: Life imprisonment under IPC 376(2)(c) and 377, with concurrent terms of 3 years (354), 1 year (504), 3 years (506(2)), 1 year (508) and 6 months (323); fines totalling Rs 2,40,500; compensation of Rs 5 lakh to the complainant
    appeal_status: R/Criminal Appeal No. 1756/2019 pending in the Gujarat High Court; suspension of sentence refused on 2021-08-18 and again on 2026-05-04 (fifth application); Supreme Court declined to suspend the sentence on 2026-08-07 and asked the High Court to decide the appeal within three months
    summary_en: >
      In October 2013 the younger of two sisters from Surat complained that Narayan Sai had
      sexually assaulted her between 2002 and 2005 at the Jahangirpura ashram in Surat and
      elsewhere, after she and her family attended religious discourses there in December 2001.
      He was arrested in December 2013 at the Delhi-Haryana border and has been in custody since
      4 December 2013. After a trial in Sessions Case No. 141 of 2014, the 2nd Additional
      Sessions Judge, Surat found him guilty (reported on 26 April 2019) and by judgment dated
      30 April 2019 sentenced him to life imprisonment; three aides received ten years each and
      a driver six months for harbouring him, and six others were acquitted. His appeal has been
      pending in the Gujarat High Court since 2019. The High Court dismissed his fifth
      application for suspension of sentence on 4 May 2026, recording that he had adopted delay
      tactics, and on 7 August 2026 the Supreme Court declined to interfere and requested the
      High Court to decide the appeal within three months.
    summary_hi: >
      अक्टूबर 2013 में सूरत की दो बहनों में छोटी ने शिकायत की कि दिसंबर 2001 में परिवार सहित
      जहाँगीरपुरा आश्रम, सूरत में प्रवचनों में भाग लेने के बाद 2002 से 2005 के बीच नारायण साईं ने
      वहाँ और अन्य स्थानों पर उसका यौन उत्पीड़न किया। उन्हें दिसंबर 2013 में दिल्ली-हरियाणा सीमा पर
      गिरफ़्तार किया गया और वे 4 दिसंबर 2013 से हिरासत में हैं। सत्र मामला संख्या 141/2014 के
      विचारण के बाद सूरत के द्वितीय अतिरिक्त सत्र न्यायाधीश ने उन्हें दोषी पाया (26 अप्रैल 2019
      को रिपोर्ट) और 30 अप्रैल 2019 के निर्णय से आजीवन कारावास की सज़ा दी; तीन सहयोगियों को दस-दस
      वर्ष और एक चालक को छह माह की सज़ा हुई, छह अन्य बरी हुए। उनकी अपील 2019 से गुजरात उच्च
      न्यायालय में लंबित है। उच्च न्यायालय ने 4 मई 2026 को सज़ा निलंबन का उनका पाँचवाँ आवेदन
      खारिज किया, और 7 अगस्त 2026 को सर्वोच्च न्यायालय ने हस्तक्षेप से इनकार करते हुए उच्च
      न्यायालय से तीन माह में अपील तय करने का अनुरोध किया।
    source_ids: [narayan-sai-src-01, narayan-sai-src-02, narayan-sai-src-03, narayan-sai-src-04, narayan-sai-src-05, narayan-sai-src-06]

claims:
  - id: narayan-sai-claim-01
    case_id: narayan-sai-surat-rape-2013
    statement_en: >
      By judgment dated 30 April 2019 in Sessions Case No. 141 of 2014, the 2nd Additional
      Sessions Judge, Surat convicted Narayan Sai under IPC 376(2)(c), 377, 354, 504, 506(2), 508
      and 323 and sentenced him to life imprisonment under IPC 376(2)(c) and 377, with lesser
      concurrent terms and fines on the other counts.
    statement_hi: >
      सत्र मामला संख्या 141/2014 में 30 अप्रैल 2019 के निर्णय से सूरत के द्वितीय अतिरिक्त सत्र
      न्यायाधीश ने नारायण साईं को आईपीसी 376(2)(c), 377, 354, 504, 506(2), 508 और 323 के तहत
      दोषी ठहराया और आईपीसी 376(2)(c) और 377 के तहत आजीवन कारावास तथा अन्य धाराओं में साथ-साथ
      चलने वाली कम अवधि की सज़ाएँ और जुर्माना लगाया।
    tier: convicted
    date: 2019-04-30
    source_ids: [narayan-sai-src-01, narayan-sai-src-06, narayan-sai-src-04]
  - id: narayan-sai-claim-02
    case_id: narayan-sai-surat-rape-2013
    statement_en: >
      The prosecution case, as recited by the Gujarat High Court, was that the complainant and
      her family attended religious discourses at the Jahangirpura ashram in Surat in December
      2001, after which Narayan Sai asked her to visit Meghnagar in Jhabua district, Madhya
      Pradesh; the complaint alleged repeated sexual assault between 2002 and 2005.
    statement_hi: >
      गुजरात उच्च न्यायालय द्वारा उद्धृत अभियोजन पक्ष के अनुसार शिकायतकर्ता और उसका परिवार दिसंबर
      2001 में सूरत के जहाँगीरपुरा आश्रम में प्रवचनों में शामिल हुए, जिसके बाद नारायण साईं ने उसे
      मध्य प्रदेश के झाबुआ ज़िले के मेघनगर आने को कहा; शिकायत में 2002 से 2005 के बीच बार-बार यौन
      उत्पीड़न का आरोप था।
    tier: convicted
    date: 2001-12
    source_ids: [narayan-sai-src-01, narayan-sai-src-06]
  - id: narayan-sai-claim-03
    case_id: narayan-sai-surat-rape-2013
    statement_en: >
      Narayan Sai was arrested in December 2013 at the Delhi-Haryana border and, as recorded by
      the Gujarat High Court, has been lodged in jail since 4 December 2013.
    statement_hi: >
      नारायण साईं को दिसंबर 2013 में दिल्ली-हरियाणा सीमा पर गिरफ़्तार किया गया और, गुजरात उच्च
      न्यायालय के अनुसार, वे 4 दिसंबर 2013 से जेल में हैं।
    tier: convicted
    date: 2013-12-04
    source_ids: [narayan-sai-src-02, narayan-sai-src-06]
  - id: narayan-sai-claim-04
    case_id: narayan-sai-surat-rape-2013
    statement_en: >
      On 4 May 2026 the Gujarat High Court (Justices Ilesh J. Vora and R.T. Vachhani) dismissed
      Narayan Sai's fifth successive application for suspension of sentence and bail (CRMA No. 4
      of 2025 in R/Criminal Appeal No. 1756 of 2019), holding that he was "not interested at all
      in expeditious hearing of his appeal" and had adopted delay tactics.
    statement_hi: >
      4 मई 2026 को गुजरात उच्च न्यायालय (न्यायमूर्ति इलेश जे. वोरा और आर.टी. वच्छानी) ने सज़ा
      निलंबन और ज़मानत का नारायण साईं का लगातार पाँचवाँ आवेदन (सीआरएमए 4/2025, आर/आपराधिक अपील
      1756/2019) खारिज करते हुए कहा कि वे "अपनी अपील की शीघ्र सुनवाई में बिल्कुल रुचि नहीं रखते"
      और विलंब की रणनीति अपना रहे हैं।
    tier: convicted
    date: 2026-05-04
    source_ids: [narayan-sai-src-01, narayan-sai-src-03]
  - id: narayan-sai-claim-05
    case_id: narayan-sai-surat-rape-2013
    statement_en: >
      The Gujarat High Court's order of 4 May 2026 records the history of his earlier
      applications for suspension of sentence: CRMA No. 2 of 2020 withdrawn; CRMA No. 2 of 2021
      rejected on merits on 18 August 2021; CRMA No. 2 of 2023 not pressed; CRMA No. 4 of 2024
      withdrawn; and CRMA No. 1 of 2025 disposed of on 20 June 2025 with five days' temporary
      bail, after which the Supreme Court on 28 November 2025 gave him liberty to file a fresh
      application.
    statement_hi: >
      गुजरात उच्च न्यायालय के 4 मई 2026 के आदेश में सज़ा निलंबन के उनके पूर्व आवेदनों का इतिहास
      दर्ज है: सीआरएमए 2/2020 वापस लिया गया; सीआरएमए 2/2021 18 अगस्त 2021 को गुण-दोष पर खारिज;
      सीआरएमए 2/2023 पर ज़ोर नहीं दिया गया; सीआरएमए 4/2024 वापस; और सीआरएमए 1/2025 20 जून 2025 को
      पाँच दिन की अस्थायी ज़मानत के साथ निपटाया गया, जिसके बाद सर्वोच्च न्यायालय ने 28 नवंबर 2025
      को नया आवेदन दायर करने की छूट दी।
    tier: convicted
    date: 2026-05-04
    source_ids: [narayan-sai-src-01]
  - id: narayan-sai-claim-06
    case_id: narayan-sai-surat-rape-2013
    statement_en: >
      On 30 April 2025 the Gujarat High Court (Justice M.R. Mengdey) dismissed Narayan Sai's
      petition against the refusal of furlough, recording that after his arrest several offences
      under IPC 307 and 326A were registered against his disciples for threatening or assaulting
      witnesses, that the record indicated he had tried to approach government officials and
      attempted to bribe them, and that he had been visited with several jail punishments.
    statement_hi: >
      30 अप्रैल 2025 को गुजरात उच्च न्यायालय (न्यायमूर्ति एम.आर. मेंगडे) ने फ़र्लो से इनकार के
      विरुद्ध नारायण साईं की याचिका खारिज करते हुए दर्ज किया कि उनकी गिरफ़्तारी के बाद गवाहों को
      धमकाने या उन पर हमला करने के लिए उनके शिष्यों के विरुद्ध आईपीसी 307 और 326A के तहत कई
      अपराध दर्ज हुए, रिकॉर्ड से संकेत मिलता है कि उन्होंने सरकारी अधिकारियों से संपर्क कर रिश्वत
      देने का प्रयास किया, और उन्हें जेल में कई दंड मिले हैं।
    tier: regulatory_action
    date: 2025-04-30
    source_ids: [narayan-sai-src-02, narayan-sai-src-08]
  - id: narayan-sai-claim-07
    case_id: narayan-sai-surat-rape-2013
    statement_en: >
      Business Today reported that the Surat court also sentenced three aides, Dharmishtha alias
      Ganga, Bhavna alias Jamuna and Pavan alias Hanuman, to ten years each, sentenced driver
      Ramesh Malhotra to six months under IPC 212 for harbouring an offender, and acquitted six
      others.
    statement_hi: >
      बिज़नेस टुडे के अनुसार सूरत की अदालत ने तीन सहयोगियों धर्मिष्ठा उर्फ गंगा, भावना उर्फ जमुना
      और पवन उर्फ हनुमान को दस-दस वर्ष, चालक रमेश मल्होत्रा को अपराधी को शरण देने के लिए आईपीसी
      212 के तहत छह माह की सज़ा दी, और छह अन्य को बरी किया।
    tier: allegation
    date: 2019-04-30
    source_ids: [narayan-sai-src-06, narayan-sai-src-04]
  - id: narayan-sai-claim-08
    case_id: asaram-motera-deaths-inquiry-2008
    statement_en: >
      The Justice D.K. Trivedi Commission report on the July 2008 deaths of two students of the
      Motera gurukul, tabled in the Gujarat Assembly on 26 July 2019, found no evidence that
      Narayan Sai or Asaram performed tantric rituals in the ashram.
    statement_hi: >
      मोटेरा गुरुकुल के दो छात्रों की जुलाई 2008 की मौतों पर न्यायमूर्ति डी.के. त्रिवेदी आयोग की
      रिपोर्ट, जो 26 जुलाई 2019 को गुजरात विधानसभा में रखी गई, में नारायण साईं या आसाराम द्वारा
      आश्रम में तांत्रिक क्रिया करने का कोई साक्ष्य नहीं मिला।
    tier: closed
    date: 2019-07-26
    source_ids: [asaram-src-26, asaram-src-27]

