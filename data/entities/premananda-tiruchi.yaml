    statement_en: In 1997 the Sessions Court, Pudukkottai convicted Premananda under IPC 376(2)(c) on 12 counts of rape and under IPC 302 for the murder of disciple Ravi, and sentenced him to two consecutive terms of life imprisonment with cumulative fines reported at about Rs 67.3 lakh.
    statement_hi: 1997 में पुदुक्कोट्टई सत्र न्यायालय ने प्रेमानंद को आईपीसी 376(2)(सी) के तहत बलात्कार के 12 मामलों और आईपीसी 302 के तहत अनुयायी रवि की हत्या के लिए दोषी ठहराया, और दो लगातार आजीवन कारावास की सज़ा सुनाई जिसके साथ कुल मिलाकर लगभग 67.3 लाख रुपये जुर्माना भी लगाया गया।
