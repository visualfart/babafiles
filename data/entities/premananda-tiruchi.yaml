cases:
  - id: premananda-pudukkottai-rape-murder-1994
    title_en: State v. Premananda and others (Pudukkottai, rape of 13 ashram girls and murder of disciple Ravi)
    title_hi: राज्य बनाम प्रेमानंद एवं अन्य (पुदुक्कोट्टई, तेरह आश्रम लड़कियों का बलात्कार और अनुयायी रवि की हत्या)
    jurisdiction_country: IN
    jurisdiction_region: Tamil Nadu
    court: Sessions Court, Pudukkottai (trial); Madras High Court (first appeal); Supreme Court of India (final appeal)
    case_number: S.C. No.7 of 1996 (Sessions Court); Criminal Appeal No. 897 of 1997 (Madras High Court, A-1); Criminal Appeal (Crl.) 611-612 of 2003 (Supreme Court)
    filed_year: 1994
    case_type: criminal
    statutes: [ "IPC 376(2)(c)", "IPC 302", "IPC 120-B", "IPC 343", "IPC 354", "IPC 420", "IPC 506(II)", "IPC 312", "IPC 201" ]
    status: convicted; upheld by the Madras High Court in 2002 and the Supreme Court in 2005; Premananda died in custody in 2011
    tier: convicted
    verdict_date: 1997-08-20
    sentence_or_remedy: >
      Two consecutive terms of life imprisonment (for the 12 counts of rape and for the murder), with cumulative fines reported at about Rs 67.3 lakh and further rigorous imprisonment in default of payment, plus lesser concurrent sentences on the remaining counts; the trial court directed that no remission or amnesty apply to the sentence, a direction the Supreme Court expressly maintained.
    appeal_status: >
      Conviction and sentence upheld by the Madras High Court on 12 December 2002 (Crl.A. Nos. 895, 896 and 897 of 1997) and by the Supreme Court of India on 5 April 2005 (Crl.A. 611-612 of 2003), which was the final appeal; no further appeal is on record. Premananda died in custody on 21 February 2011.
    summary_en: >
      A news report in The Indian Express of 15 November 1994 followed by a complaint from a former ashram inmate, Sureshkumari, led to the registration of a case against Premananda, the head of the Premananda Ashram at Fathima Nagar near Tiruchirappalli, and six associates. The prosecution's case, tried as S.C. No.7 of 1996 before the Sessions Court, Pudukkottai, was that between 1990 and 1994 Premananda raped 13 girls resident in the ashram, most of them orphans he had brought from Sri Lanka as children, and that in April 1991 he and co-accused beat and then confined a disciple, Ravi, without food or water after Ravi accused Premananda of the rapes; Ravi died of his injuries and was buried in the ashram without the death being reported. In 1997 the Sessions Court convicted Premananda under IPC 376(2)(c) (12 counts), 302, 120-B and other sections and sentenced him to two consecutive terms of life imprisonment. The Madras High Court dismissed his appeal on 12 December 2002, and the Supreme Court dismissed his final appeal on 5 April 2005, holding that a DNA test on a foetus aborted by one victim had established Premananda's paternity "beyond reasonable doubt" and that the concurrent findings of the two courts below did not warrant interference. He died in custody at a private hospital in Chennai on 21 February 2011, while serving the sentence.
    summary_hi: >
      15 नवंबर 1994 को द इंडियन एक्सप्रेस में छपी एक रिपोर्ट और उसके बाद पूर्व आश्रम निवासी सुरेशकुमारी की शिकायत के आधार पर तिरुचिरापल्ली के निकट फातिमा नगर स्थित प्रेमानंद आश्रम के प्रमुख प्रेमानंद और छह सहयोगियों के विरुद्ध मामला दर्ज हुआ। पुदुक्कोट्टई सत्र न्यायालय में एस.सी. संख्या 7/1996 के रूप में चले इस मुकदमे में अभियोजन पक्ष का मामला था कि 1990 से 1994 के बीच प्रेमानंद ने आश्रम में रहने वाली 13 लड़कियों के साथ बलात्कार किया, जिनमें से अधिकांश श्रीलंका से लाए गए अनाथ थे, और अप्रैल 1991 में उन्होंने और सह-अभियुक्तों ने अनुयायी रवि को पीटा और भोजन-पानी के बिना बंद रखा, क्योंकि रवि ने प्रेमानंद पर बलात्कार का आरोप लगाया था; रवि की चोटों से मृत्यु हो गई और उसे बिना सूचना दिए आश्रम में ही दफना दिया गया। 1997 में सत्र न्यायालय ने प्रेमानंद को आईपीसी 376(2)(सी) (12 मामले), 302, 120-बी और अन्य धाराओं में दोषी ठहराया और दो लगातार आजीवन कारावास की सज़ा सुनाई। मद्रास उच्च न्यायालय ने 12 दिसंबर 2002 को उनकी अपील खारिज की, और सर्वोच्च न्यायालय ने 5 अप्रैल 2005 को अंतिम अपील खारिज करते हुए कहा कि एक पीड़िता के गर्भपात किए गए भ्रूण की डीएनए जांच से प्रेमानंद का पितृत्व "संदेह से परे" सिद्ध हो चुका है और दोनों निचली अदालतों के समवर्ती निष्कर्षों में हस्तक्षेप की आवश्यकता नहीं। सज़ा भुगतते हुए 21 फरवरी 2011 को चेन्नई के एक निजी अस्पताल में हिरासत के दौरान उनकी मृत्यु हो गई।
    source_ids: [ premananda-src-01, premananda-src-02, premananda-src-03, premananda-src-04 ]

