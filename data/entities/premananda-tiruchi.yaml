summary_en: >
  Premananda (Prem Kumar), a Sri Lanka-born ashram head who ran the Premananda Ashram at Fathima Nagar near Tiruchirappalli, was tried before the Sessions Court, Pudukkottai in S.C. No.7 of 1996 on charges of raping thirteen ashram girls between 1990 and 1994 and of murdering a disciple, Ravi, in April 1991. In 1997 the trial court convicted him and sentenced him to two consecutive terms of life imprisonment along with lesser sentences on related counts. The Madras High Court dismissed his appeal on 12 December 2002 and the Supreme Court of India dismissed his final appeal on 5 April 2005, confirming the conviction and directing that no future remission or amnesty order apply to his sentence. He died in custody at a private hospital in Chennai on 21 February 2011 while serving the sentence, having been admitted for treatment of liver failure.
summary_hi: >
  श्रीलंका में जन्मे प्रेमानंद (प्रेम कुमार), जो तिरुचिरापल्ली के निकट फातिमा नगर स्थित प्रेमानंद आश्रम के प्रमुख थे, पर पुदुक्कोट्टई सत्र न्यायालय में एस.सी. संख्या 7/1996 के तहत 1990 से 1994 के बीच आश्रम की तेरह लड़कियों के बलात्कार और अप्रैल 1991 में अनुयायी रवि की हत्या के आरोप में मुकदमा चला। 1997 में विचारण न्यायालय ने उन्हें दोषी ठहराया और दो लगातार आजीवन कारावास की सज़ा के साथ अन्य संबंधित आरोपों में भी सज़ा सुनाई। मद्रास उच्च न्यायालय ने 12 दिसंबर 2002 को उनकी अपील खारिज की और भारत के सर्वोच्च न्यायालय ने 5 अप्रैल 2005 को अंतिम अपील खारिज कर दोषसिद्धि की पुष्टि की तथा निर्देश दिया कि भविष्य में कोई छूट या क्षमा आदेश उनकी सज़ा पर लागू नहीं होगा। सज़ा भुगतते हुए 21 फरवरी 2011 को चेन्नई के एक निजी अस्पताल में हिरासत के दौरान उनकी मृत्यु हो गई, जहाँ उन्हें लिवर फेल होने के इलाज के लिए भर्ती कराया गया था।
