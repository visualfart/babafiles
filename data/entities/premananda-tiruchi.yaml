  - id: premananda-claim-03
    case_id: premananda-pudukkottai-rape-murder-1994
    statement_en: On 5 April 2005 the Supreme Court of India, in Criminal Appeal (Crl.) 611-612 of 2003, dismissed Premananda's final appeal, holding that the concurrent findings of the trial court and the Madras High Court did not warrant interference, and directed that no remission of sentence or amnesty announced by the Central or State Government apply to his imprisonment.
    statement_hi: 5 अप्रैल 2005 को भारत के सर्वोच्च न्यायालय ने आपराधिक अपील (सीआरएल.) 611-612/2003 में प्रेमानंद की अंतिम अपील खारिज करते हुए कहा कि विचारण न्यायालय और मद्रास उच्च न्यायालय के समवर्ती निष्कर्षों में हस्तक्षेप की आवश्यकता नहीं है, और निर्देश दिया कि केंद्र या राज्य सरकार द्वारा घोषित कोई भी छूट या क्षमा उनकी सज़ा पर लागू नहीं होगी।
