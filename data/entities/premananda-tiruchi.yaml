    statement_en: On 12 December 2002 the Madras High Court, in Criminal Appeal Nos. 895, 896 and 897 of 1997, dismissed Premananda's and his co-accused's appeals and upheld the Sessions Court's conviction and sentence.
    statement_hi: 12 दिसंबर 2002 को मद्रास उच्च न्यायालय ने आपराधिक अपील संख्या 895, 896 और 897/1997 में प्रेमानंद और सह-अभियुक्तों की अपीलें खारिज कर सत्र न्यायालय की दोषसिद्धि और सज़ा को बरकरार रखा।
