    sha256:
    note: >-
      Reportable judgment of Chief Justice Uday Umesh Lalit with Indira Banerjee and K.M. Joseph JJ. Records at paragraph 18 the oral submissions of senior counsel Arvind Datar for Daiichi that "Mr. Gurinder Singh Dhillon and Mr. Gurpreet Singh Dhillon are unitholders of RHT", that Gurpreet Singh Dhillon was an executive director and chief executive officer of RHT, that they are close relatives of the Singh brothers and that "it is probable that the Dhillon family … also benefitted from the FHL-IHH-RHT transaction". Also records that Contemnor No. 9, Malvinder Mohan Singh, seeking to purge his contempt, submitted a table of loans extended by Modland Wears, Devera Developers, Fern Healthcare, Best Healthcare and Adept Lifespaces to members of the Dhillon family and to Sunil and Sanjay Godhwani, totalling Rs 998.3 crore, of which Rs 1.57 crore is shown against Gurinder Singh Dhillon, as properties that could still be proceeded against. The list of dates records that the Master Purchase Agreement of 12 February 2018 for the acquisition of RHT assets for Rs 4,650 crore "was endorsed by Gurpreet Singh Dhillon on behalf of RHT". These are recorded submissions of parties, not findings against any member of the Dhillon family; the Court sentenced Malvinder and Shivinder Mohan Singh and made no order against any Dhillon.
