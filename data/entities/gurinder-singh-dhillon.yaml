summary_en: >-
  Gurinder Singh Dhillon has headed Radha Soami Satsang Beas, based at Beas in Punjab, since 1990. He is a maternal relative of Malvinder Mohan Singh and Shivinder Mohan Singh, the former promoters of Ranbaxy, Fortis Healthcare and Religare. He and members of his family were named among fifty-five garnishee parties in the Delhi High Court's execution proceedings on the arbitral award won by Daiichi Sankyo against the Singh brothers: legal and business reporting records orders of 2019 requiring the garnishees to deposit sums owed to RHC Holding Private Limited with the Registrar General and restraining them from disposing of their assets. The Dhillon family applied to the same court denying that they owe RHC Holding anything. The order texts naming them could not be obtained and no later order confirming, modifying or vacating those directions was found, so their present status is not established here. The Supreme Court's judgment of 22 September 2022 in the same dispute names Gurinder Singh Dhillon only in recorded submissions of the parties, not in any finding against him. No order of the Securities and Exchange Board of India names him or his family as a noticee: the Delhi High Court's judgment of 24 April 2023 reproduces SEBI's 2018 interim order and 2022 final adjudication order in the Fortis matter, and the Dhillons are not among the noticees in either. He has not been charged with any offence on any record found.
summary_hi: >-
  गुरिंदर सिंह ढिल्लों 1990 से पंजाब के ब्यास स्थित राधा स्वामी सत्संग ब्यास के प्रमुख हैं। वे रैनबैक्सी, फोर्टिस हेल्थकेयर और रेलिगेयर के पूर्व प्रवर्तक मलविंदर मोहन सिंह और शिविंदर मोहन सिंह के ननिहाल पक्ष के संबंधी हैं। दाइची सांक्यो द्वारा सिंह बंधुओं के विरुद्ध जीते गए मध्यस्थता निर्णय के निष्पादन की दिल्ली उच्च न्यायालय की कार्यवाही में उन्हें और उनके परिवार के सदस्यों को पचपन गार्निशी पक्षकारों में नामित किया गया: विधि और व्यापार पत्रकारिता में 2019 के उन आदेशों का उल्लेख है जिनमें गार्निशियों को आरएचसी होल्डिंग प्राइवेट लिमिटेड को देय राशि रजिस्ट्रार जनरल के पास जमा करने और अपनी संपत्ति के हस्तांतरण से रोकने के निर्देश थे। ढिल्लों परिवार ने उसी न्यायालय में आवेदन देकर कहा कि वे आरएचसी होल्डिंग के कुछ भी देनदार नहीं हैं। उन्हें नामित करने वाले आदेशों का मूल पाठ प्राप्त नहीं हो सका और उन निर्देशों की पुष्टि, संशोधन या उन्हें रद्द करने वाला कोई बाद का आदेश नहीं मिला, इसलिए उनकी वर्तमान स्थिति यहाँ स्थापित नहीं की गई है। इसी विवाद में सर्वोच्च न्यायालय के 22 सितंबर 2022 के निर्णय में गुरिंदर सिंह ढिल्लों का नाम केवल पक्षकारों के अभिलिखित अभिकथनों में आता है, उनके विरुद्ध किसी निष्कर्ष में नहीं। भारतीय प्रतिभूति एवं विनिमय बोर्ड के किसी आदेश में उन्हें या उनके परिवार को नोटिसी नहीं बनाया गया है: दिल्ली उच्च न्यायालय के 24 अप्रैल 2023 के निर्णय में सेबी के 2018 के अंतरिम आदेश और 2022 के अंतिम न्यायनिर्णयन आदेश उद्धृत हैं, और दोनों में ढिल्लों नोटिसी नहीं हैं। किसी भी प्राप्त अभिलेख में उन पर कोई आरोप नहीं लगाया गया है।
hi_reviewed: false
response_from_subject:
  text_en: >-
    On 11 October 2019 Gurinder Singh Dhillon and members of his family applied to the Delhi High Court stating that they do not owe any money to RHC Holding Private Limited and that RHC Holding had made false claims that they owed money to the company. Justice J.R. Midha sought the responses of RHC Holding, the Singh brothers and Daiichi Sankyo to the application. Applications denying liability were also filed by Shabnam Dhillon, Gurkirat Singh Dhillon, Gurpreet Singh Dhillon and Nayan Tara Dhillon. No statement by Radha Soami Satsang Beas as an organisation on these proceedings was located.
  text_hi: >-
    11 अक्टूबर 2019 को गुरिंदर सिंह ढिल्लों और उनके परिवार के सदस्यों ने दिल्ली उच्च न्यायालय में आवेदन देकर कहा कि वे आरएचसी होल्डिंग प्राइवेट लिमिटेड के किसी भी राशि के देनदार नहीं हैं और आरएचसी होल्डिंग ने झूठा दावा किया है कि वे कंपनी के देनदार हैं। न्यायमूर्ति जे.आर. मिढा ने इस आवेदन पर आरएचसी होल्डिंग, सिंह बंधुओं और दाइची सांक्यो का उत्तर मांगा। देनदारी से इनकार करते हुए आवेदन शबनम ढिल्लों, गुरकीरत सिंह ढिल्लों, गुरप्रीत सिंह ढिल्लों और नयन तारा ढिल्लों ने भी दाखिल किए। इन कार्यवाहियों पर राधा स्वामी सत्संग ब्यास का संगठन के रूप में कोई वक्तव्य नहीं मिला।
  source_id: gsd-src-08

