cases:
  - id: dhillon-delhi-hc-daiichi-garnishee-2019
    title_en: Garnishee and asset-restraint orders naming the Dhillon family, Daiichi Sankyo execution proceedings, Delhi High Court
    title_hi: दाइची सांक्यो निष्पादन कार्यवाही में ढिल्लों परिवार को नामित करने वाले गार्निशी और संपत्ति-रोक आदेश, दिल्ली उच्च न्यायालय
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: High Court of Delhi
    case_number: O.M.P.(EFA)(COMM.) 6/2016 (with EX.P. 5/2016)
    filed_year: 2016
    case_type: civil
    statutes:
      - Order 21 Rule 46A, Code of Civil Procedure 1908
      - Section 39, Code of Civil Procedure 1908
      - Arbitration and Conciliation Act 1996, Part II
    status: >-
      Status unconfirmed. Orders of 2019 requiring the garnishees to deposit sums owed to RHC Holding and restraining them from disposing of their assets are recorded in legal and business reporting, but the order texts naming the Dhillon family could not be obtained, they are not carried by Indian Kanoon, and no later order confirming, modifying or vacating them was found. The Delhi High Court's order of 31 August 2026 in the same execution petition does not use the word garnishee and lists no pending application concerning the Dhillon family.
    tier: regulatory_action
    verdict_date:
    sentence_or_remedy: Direction to deposit sums owed to RHC Holding Private Limited with the Registrar General within thirty days, with restraint on disposal of assets.
    appeal_status:
    summary_en: >-
      Daiichi Sankyo has been enforcing in the Delhi High Court the arbitral award it won against Malvinder Mohan Singh, Shivinder Mohan Singh and their companies. In those execution proceedings the court made a garnishee order under Order 21 Rule 46A of the Code of Civil Procedure on 26 February 2018 in respect of debts due to judgment debtors including RHC Holding Private Limited. Bar & Bench, Business Today and an agency report of the Dhillons' own responsive application record that fifty-five garnishee parties, among them Gurinder Singh Dhillon, Shabnam Dhillon, Gurpreet Singh Dhillon, Gurkirat Singh Dhillon and Nayan Tara Dhillon, were directed in September 2019 to deposit with the Registrar General the sums they owed to RHC Holding within thirty days and were restrained from disposing of their assets, that they were directed in October 2019 to attend in person, and that garnishees disputing liability were directed in November 2019 to file income tax returns, bank statements and balance sheets. The Dhillon family denied owing anything to RHC Holding. What became of these directions is not established on any record found.
    summary_hi: >-
      दाइची सांक्यो मलविंदर मोहन सिंह, शिविंदर मोहन सिंह और उनकी कंपनियों के विरुद्ध जीते गए मध्यस्थता निर्णय का निष्पादन दिल्ली उच्च न्यायालय में करा रही है। उन्हीं कार्यवाहियों में न्यायालय ने 26 फरवरी 2018 को सिविल प्रक्रिया संहिता के आदेश 21 नियम 46क के तहत आरएचसी होल्डिंग प्राइवेट लिमिटेड सहित निर्णय-ऋणियों को देय ऋणों के संबंध में गार्निशी आदेश दिया। बार एंड बेंच, बिजनेस टुडे और ढिल्लों परिवार के प्रत्युत्तर आवेदन की एजेंसी रिपोर्ट में दर्ज है कि सितंबर 2019 में पचपन गार्निशी पक्षकारों को — जिनमें गुरिंदर सिंह ढिल्लों, शबनम ढिल्लों, गुरप्रीत सिंह ढिल्लों, गुरकीरत सिंह ढिल्लों और नयन तारा ढिल्लों शामिल थे — आरएचसी होल्डिंग को देय राशि तीस दिन में रजिस्ट्रार जनरल के पास जमा करने का निर्देश दिया गया और संपत्ति के हस्तांतरण से रोका गया, अक्टूबर 2019 में व्यक्तिगत उपस्थिति का निर्देश दिया गया, और नवंबर 2019 में देनदारी से इनकार करने वाले गार्निशियों को आयकर विवरणी, बैंक विवरण और तुलन-पत्र दाखिल करने को कहा गया। ढिल्लों परिवार ने आरएचसी होल्डिंग की किसी देनदारी से इनकार किया। इन निर्देशों का क्या हुआ, यह किसी प्राप्त अभिलेख से स्थापित नहीं होता।
    source_ids: [ gsd-src-03, gsd-src-01, gsd-src-05, gsd-src-06, gsd-src-08, gsd-src-12 ]

claims:
  - id: gsd-claim-01
    case_id: dhillon-delhi-hc-daiichi-garnishee-2019
    statement_en: >-
      In the Delhi High Court's execution proceedings on the Daiichi Sankyo arbitral award, O.M.P.(EFA)(COMM.) 6/2016, a garnishee order was made on 26 February 2018 under Order 21 Rule 46A of the Code of Civil Procedure in respect of debts due to judgment debtors including RHC Holding Private Limited.
    statement_hi: >-
      दाइची सांक्यो मध्यस्थता निर्णय के निष्पादन की दिल्ली उच्च न्यायालय की कार्यवाही ओ.एम.पी.(ईएफए)(कॉम.) 6/2016 में 26 फरवरी 2018 को सिविल प्रक्रिया संहिता के आदेश 21 नियम 46क के तहत आरएचसी होल्डिंग प्राइवेट लिमिटेड सहित निर्णय-ऋणियों को देय ऋणों के संबंध में गार्निशी आदेश दिया गया।
    tier: regulatory_action
    date: 2018-02-26
    source_ids: [ gsd-src-03 ]
  - id: gsd-claim-02
    case_id: dhillon-delhi-hc-daiichi-garnishee-2019
    statement_en: >-
      Bar & Bench reported on 10 October 2019 that the Delhi High Court had directed fifty-five garnishee parties, among them Gurinder Singh Dhillon, to deposit the amount due to RHC Holding with the Registrar General of the Court in the Daiichi Sankyo execution proceedings.
    statement_hi: >-
      बार एंड बेंच ने 10 अक्टूबर 2019 को बताया कि दिल्ली उच्च न्यायालय ने दाइची सांक्यो निष्पादन कार्यवाही में पचपन गार्निशी पक्षकारों को, जिनमें गुरिंदर सिंह ढिल्लों शामिल थे, आरएचसी होल्डिंग को देय राशि न्यायालय के रजिस्ट्रार जनरल के पास जमा करने का निर्देश दिया।
    tier: regulatory_action
    date: 2019-10-10
    source_ids: [ gsd-src-05, gsd-src-08, gsd-src-03 ]
  - id: gsd-claim-03
    case_id: dhillon-delhi-hc-daiichi-garnishee-2019
    statement_en: >-
      On 11 October 2019 Gurinder Singh Dhillon and members of his family applied to the Delhi High Court stating that they owe no money to RHC Holding Private Limited and that RHC Holding had made false claims against them; Justice J.R. Midha sought the responses of RHC Holding, the Singh brothers and Daiichi Sankyo.
    statement_hi: >-
      11 अक्टूबर 2019 को गुरिंदर सिंह ढिल्लों और उनके परिवार के सदस्यों ने दिल्ली उच्च न्यायालय में आवेदन देकर कहा कि वे आरएचसी होल्डिंग प्राइवेट लिमिटेड के किसी राशि के देनदार नहीं हैं और आरएचसी होल्डिंग ने उनके विरुद्ध झूठे दावे किए हैं; न्यायमूर्ति जे.आर. मिढा ने आरएचसी होल्डिंग, सिंह बंधुओं और दाइची सांक्यो का उत्तर मांगा।
    tier: closed
    date: 2019-10-11
    source_ids: [ gsd-src-08 ]
  - id: gsd-claim-04
    statement_en: >-
      The Supreme Court's judgment of 22 September 2022 records the submission of senior counsel for Daiichi Sankyo that Gurinder Singh Dhillon and Gurpreet Singh Dhillon are unitholders of RHT, that they are close relatives of the Singh brothers, and that it is probable that the Dhillon family also benefited from the Fortis-IHH-RHT transaction; the Court made no finding and no order against any member of the Dhillon family.
    statement_hi: >-
      सर्वोच्च न्यायालय के 22 सितंबर 2022 के निर्णय में दाइची सांक्यो के वरिष्ठ अधिवक्ता का यह अभिकथन दर्ज है कि गुरिंदर सिंह ढिल्लों और गुरप्रीत सिंह ढिल्लों आरएचटी के यूनिटधारक हैं, कि वे सिंह बंधुओं के निकट संबंधी हैं, और यह संभव है कि ढिल्लों परिवार को भी फोर्टिस-आईएचएच-आरएचटी लेनदेन से लाभ हुआ; न्यायालय ने ढिल्लों परिवार के किसी सदस्य के विरुद्ध कोई निष्कर्ष या आदेश नहीं दिया।
    tier: allegation
    date: 2022-09-22
    source_ids: [ gsd-src-01 ]
  - id: gsd-claim-05
    statement_en: >-
      The Supreme Court's judgment of 22 September 2022 records that Malvinder Mohan Singh, seeking to purge his contempt, submitted a table of loans extended by five companies of his group to members of the Dhillon family and others totalling Rs 998.3 crore, of which Rs 1.57 crore is shown against Gurinder Singh Dhillon, as properties that could still be proceeded against.
    statement_hi: >-
      सर्वोच्च न्यायालय के 22 सितंबर 2022 के निर्णय में दर्ज है कि मलविंदर मोहन सिंह ने अवमानना से मुक्त होने के प्रयास में अपने समूह की पाँच कंपनियों द्वारा ढिल्लों परिवार के सदस्यों और अन्य को दिए गए कुल 998.3 करोड़ रुपये के ऋणों की तालिका प्रस्तुत की, जिसमें 1.57 करोड़ रुपये गुरिंदर सिंह ढिल्लों के नाम दर्शाए गए, यह कहते हुए कि इन संपत्तियों के विरुद्ध अब भी कार्रवाई की जा सकती है।
    tier: allegation
    date: 2022-09-22
    source_ids: [ gsd-src-01 ]
  - id: gsd-claim-06
    statement_en: >-
      The Delhi High Court's judgment of 24 April 2023 reproduces the noticee lists of the Securities and Exchange Board of India's interim order of 17 October 2018 and its final adjudication order of 19 April 2022 in the Fortis Healthcare matter; neither list names Gurinder Singh Dhillon or any member of his family.
    statement_hi: >-
      दिल्ली उच्च न्यायालय के 24 अप्रैल 2023 के निर्णय में फोर्टिस हेल्थकेयर मामले में भारतीय प्रतिभूति एवं विनिमय बोर्ड के 17 अक्टूबर 2018 के अंतरिम आदेश और 19 अप्रैल 2022 के अंतिम न्यायनिर्णयन आदेश की नोटिसी सूचियाँ उद्धृत हैं; किसी भी सूची में गुरिंदर सिंह ढिल्लों या उनके परिवार के किसी सदस्य का नाम नहीं है।
    tier: no_record_found
    date: 2023-04-24
    source_ids: [ gsd-src-02 ]
  - id: gsd-claim-07
    statement_en: >-
      Business Today reported on 3 September 2020 that Gurinder Singh Dhillon and members of his family had been named in the first information report registered by the Economic Offences Wing of the Delhi Police on the complaint of Religare Finvest Ltd, and that a summons dated 26 August 2020 sought an explanation of funds transferred to his and his late wife's personal accounts; no copy of the report or summons and no police statement could be obtained.
    statement_hi: >-
      बिजनेस टुडे ने 3 सितंबर 2020 को बताया कि रेलिगेयर फिनवेस्ट लिमिटेड की शिकायत पर दिल्ली पुलिस के आर्थिक अपराध शाखा द्वारा दर्ज प्रथम सूचना रिपोर्ट में गुरिंदर सिंह ढिल्लों और उनके परिवार के सदस्यों को नामित किया गया था, और 26 अगस्त 2020 के एक समन में उनके तथा उनकी दिवंगत पत्नी के निजी खातों में स्थानांतरित धन का स्पष्टीकरण मांगा गया; रिपोर्ट या समन की कोई प्रति और पुलिस का कोई वक्तव्य प्राप्त नहीं हो सका।
    tier: allegation
    date: 2020-09-03
    source_ids: [ gsd-src-07 ]
  - id: gsd-claim-08
    statement_en: >-
      A search of Indian Kanoon on 9 September 2026 for "Gurinder Singh Dhillon" together with "garnishee" returned no matching results, and the Delhi High Court's order of 31 August 2026 in the same execution petition does not use the word garnishee and lists no pending application concerning the Dhillon family.
    statement_hi: >-
      9 सितंबर 2026 को इंडियन कानून पर "गुरिंदर सिंह ढिल्लों" के साथ "गार्निशी" की खोज में कोई परिणाम नहीं मिला, और उसी निष्पादन याचिका में दिल्ली उच्च न्यायालय के 31 अगस्त 2026 के आदेश में गार्निशी शब्द का प्रयोग नहीं है और ढिल्लों परिवार से संबंधित कोई लंबित आवेदन सूचीबद्ध नहीं है।
    tier: no_record_found
    date: 2026-09-09
    source_ids: [ gsd-src-12, gsd-src-04, gsd-src-11 ]

