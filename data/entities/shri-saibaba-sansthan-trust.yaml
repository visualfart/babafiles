cases:
  - id: shirdi-saibaba-sansthan-management-committee-pil
    title_en: Uttamrao Rambhaji Shelke v. State of Maharashtra and others (PIL on the trust's management committee)
    title_hi: उत्तमराव रामभाजी शेल्के बनाम महाराष्ट्र राज्य एवं अन्य (ट्रस्ट की प्रबंध समिति संबंधी जनहित याचिका)
    jurisdiction_country: IN
    jurisdiction_region: Maharashtra
    court: Bombay High Court, Aurangabad Bench
    case_number: Public Interest Litigation No. 98 of 2021, with Civil Application No. 11973 of 2021 (earlier proceedings from PIL No. 120 of 2019 and a committee constituted by the court in 2012)
    filed_year: 2021
    case_type: charity_regulator
    statutes: [Shri Saibaba Sansthan Trust (Shirdi) Act]
    status: 13 September 2022 order quashed the state's September 2021 committee appointment and directed a fresh committee within 8 weeks; litigation over the committee's composition continued in the same proceeding in later years
    tier: closed
    verdict_date: 2022-09-13
    sentence_or_remedy: >
      Cancelled the September 2021 committee's appointment; directed the State of Maharashtra
      to constitute a new managing committee within eight weeks; held that appointment of
      trustees to a religious trust serves the public interest of devotees, not the private
      interest of the ruling government to accommodate party workers or politicians.
    appeal_status: >
      No appeal against the 13 September 2022 order was found; the same PIL (No. 98 of 2021)
      continued to generate further orders on the committee's composition in subsequent years
      (matters listed as recently as July 2025), the details of which were not verified for
      this record.
    summary_en: >
      Petitioner Uttamrao Rambhaji Shelke has pursued public interest litigation over the
      Shirdi trust's management committee for over a decade. The Bombay High Court had itself
      constituted an interim committee, of the Ahmednagar principal district judge, the
      district collector and the trust's CEO, in 2012, and on 9 October 2019 (PIL No. 120 of
      2019) empowered that committee to administer the trust. After the Maharashtra government
      appointed a new committee headed by an NCP legislator on 16 September 2021 without the
      court's approval, the Aurangabad Bench restrained it, on 21 September 2021, from taking
      policy decisions, sanctioning expenditure or making appointments. On 13 September 2022, a
      Division Bench of Justices R.D. Dhanuka and S.G. Mehare (in PIL No. 98 of 2021, with
      Civil Application No. 11973 of 2021) quashed that committee's appointment altogether and
      directed the state to constitute a fresh committee within eight weeks, holding that
      trustee appointments to a religious trust are for the public interest of devotees and not
      to reward political workers.
    summary_hi: >
      याचिकाकर्ता उत्तमराव रामभाजी शेल्के एक दशक से अधिक समय से शिरडी ट्रस्ट की प्रबंध समिति को
      लेकर जनहित याचिका चला रहे हैं। बॉम्बे उच्च न्यायालय ने स्वयं 2012 में अहमदनगर के प्रधान
      ज़िला न्यायाधीश, ज़िला कलेक्टर और ट्रस्ट के सीईओ की एक अंतरिम समिति गठित की थी, और 9 अक्टूबर
      2019 (जनहित याचिका संख्या 120/2019) को उस समिति को ट्रस्ट का प्रशासन करने हेतु सशक्त किया।
      महाराष्ट्र सरकार द्वारा 16 सितंबर 2021 को न्यायालय की अनुमति के बिना एक एनसीपी विधायक के
      नेतृत्व वाली नई समिति नियुक्त किए जाने के बाद, औरंगाबाद खंडपीठ ने 21 सितंबर 2021 को उसे
      नीतिगत निर्णय लेने, व्यय स्वीकृत करने या नियुक्तियाँ करने से रोका। 13 सितंबर 2022 को
      न्यायमूर्ति आर.डी. धनुका और एस.जी. मेहरे की खंडपीठ ने (जनहित याचिका संख्या 98/2021 में,
      सिविल आवेदन संख्या 11973/2021 सहित) उस समिति की नियुक्ति पूरी तरह रद्द कर राज्य को आठ हफ्तों
      में नई समिति गठित करने का निर्देश दिया, यह कहते हुए कि धार्मिक ट्रस्ट में न्यासी नियुक्तियाँ
      भक्तों के जनहित के लिए हैं, राजनीतिक कार्यकर्ताओं को पुरस्कृत करने के लिए नहीं।
    source_ids: [ssst-src-01, ssst-src-02, ssst-src-03, ssst-src-04]

  - id: shirdi-saibaba-sansthan-income-tax-anonymous-donations
    title_en: Commissioner of Income Tax v. Shree Sai Baba Sansthan Trust (tax exemption on anonymous donations)
    title_hi: आयकर आयुक्त बनाम श्री साईं बाबा संस्थान ट्रस्ट (गुमनाम दान पर कर छूट)
    jurisdiction_country: IN
    jurisdiction_region: Maharashtra
    court: Bombay High Court
    case_number: Not on record (appeal from ITAT order of 25 October 2023)
    filed_year: 2023
    case_type: charity_regulator
    statutes: ["Income Tax Act 1961, s.115BBC(2)(b)"]
    status: Income Tax Department's appeal dismissed; ITAT's exemption order upheld
    tier: closed
    verdict_date: 2024-10-08
    sentence_or_remedy: Upheld the trust's tax exemption on Rs 159.12 crore in anonymous donations for assessment years 2015-16, 2017-18 and 2018-19
    appeal_status: Not on record
    summary_en: >
      The Income Tax Department challenged an Income Tax Appellate Tribunal order of 25 October
      2023 that had held the trust exempt, under section 115BBC(2)(b) of the Income Tax Act,
      from tax on Rs 159.12 crore in anonymous ("hundi") donations received across assessment
      years 2015-16, 2017-18 and 2018-19. On 8 October 2024 a Bombay High Court bench of
      Justices G.S. Kulkarni and Somasekhar Sundaresan dismissed the department's appeal,
      holding that the trust is both a religious and a charitable institution and so entitled
      to the exemption.
    summary_hi: >
      आयकर विभाग ने आयकर अपीलीय अधिकरण के 25 अक्टूबर 2023 के उस आदेश को चुनौती दी थी जिसमें ट्रस्ट
      को आयकर अधिनियम की धारा 115बीबीसी(2)(बी) के तहत आकलन वर्ष 2015-16, 2017-18 और 2018-19 में
      प्राप्त 159.12 करोड़ रुपये की गुमनाम ("हुंडी") दान राशि पर कर से छूट दी गई थी। 8 अक्टूबर 2024
      को बॉम्बे उच्च न्यायालय के न्यायमूर्ति जी.एस. कुलकर्णी और सोमशेखर सुंदरेशन की पीठ ने विभाग की
      अपील खारिज कर दी, यह मानते हुए कि ट्रस्ट एक धार्मिक और धर्मार्थ दोनों संस्था है और इसलिए छूट
      का हक़दार है।
    source_ids: [ssst-src-05]

