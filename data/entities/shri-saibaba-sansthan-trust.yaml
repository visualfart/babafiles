summary_en: >
  The Shri Saibaba Sansthan Trust administers the Sai Baba temple at Shirdi, Maharashtra,
  under the Shri Saibaba Sansthan Trust (Shirdi) Act. Its management committee has repeatedly
  come under the Bombay High Court's Aurangabad Bench's supervision after successive state
  governments appointed committees seen as politically constituted: the court itself
  constituted an interim committee of the Ahmednagar principal district judge, the district
  collector and the trust's CEO in 2012 and empowered it to administer the trust on 9 October
  2019; it restrained a September 2021 state-appointed committee headed by an NCP legislator
  from taking policy decisions; and on 13 September 2022 it quashed that committee's
  appointment and directed the state to constitute a fresh one within eight weeks, holding
  that trustee appointments serve the public interest of devotees and not the ruling party.
  Litigation over the committee's composition, filed by petitioner Uttamrao Rambhaji Shelke,
  has continued in the same proceeding in subsequent years. Separately, the Bombay High Court
  upheld, on 8 October 2024, an Income Tax Appellate Tribunal ruling that the trust is exempt
  from tax on Rs 159.12 crore in anonymous ("hundi") donations because it is both a religious
  and a charitable institution. No CAG or state audit report, and no FIR relating to donations
  or contracts with a confirmed legal outcome, could be verified on the record available.
summary_hi: >
  श्री साईंबाबा संस्थान ट्रस्ट श्री साईंबाबा संस्थान ट्रस्ट (शिरडी) अधिनियम के तहत महाराष्ट्र के
  शिरडी स्थित साईं बाबा मंदिर का प्रशासन करता है। इसकी प्रबंध समिति बार-बार बॉम्बे उच्च न्यायालय
  की औरंगाबाद खंडपीठ की निगरानी में आई है, क्योंकि राज्य की क्रमिक सरकारों ने ऐसी समितियाँ नियुक्त
  कीं जिन्हें राजनीतिक रूप से गठित माना गया: न्यायालय ने स्वयं 2012 में अहमदनगर के प्रधान ज़िला
  न्यायाधीश, ज़िला कलेक्टर और ट्रस्ट के सीईओ की एक अंतरिम समिति गठित की और 9 अक्टूबर 2019 को उसे
  ट्रस्ट का प्रशासन करने हेतु सशक्त किया; सितंबर 2021 में राज्य द्वारा नियुक्त एक एनसीपी विधायक के
  नेतृत्व वाली समिति को नीतिगत निर्णय लेने से रोका; और 13 सितंबर 2022 को उस समिति की नियुक्ति रद्द
  कर राज्य को आठ हफ्तों में नई समिति गठित करने का निर्देश दिया, यह कहते हुए कि न्यासी नियुक्तियाँ
  भक्तों के जनहित के लिए हैं, सत्तारूढ़ पार्टी के लिए नहीं। याचिकाकर्ता उत्तमराव रामभाजी शेल्के द्वारा
  दायर समिति की संरचना संबंधी मुकदमेबाज़ी उसी कार्यवाही में आगे के वर्षों में भी जारी रही। इससे अलग,
  बॉम्बे उच्च न्यायालय ने 8 अक्टूबर 2024 को आयकर अपीलीय अधिकरण के उस निर्णय को बरकरार रखा जिसमें
  ट्रस्ट को 159.12 करोड़ रुपये की गुमनाम ("हुंडी") दान राशि पर कर छूट दी गई थी क्योंकि यह एक धार्मिक
  और धर्मार्थ दोनों संस्था है। उपलब्ध अभिलेख में कोई कैग या राज्य लेखा-परीक्षा रिपोर्ट, और दान या
  ठेकों से जुड़ी किसी पुष्ट परिणाम वाली एफआईआर की पुष्टि नहीं हो सकी।
hi_reviewed: false

