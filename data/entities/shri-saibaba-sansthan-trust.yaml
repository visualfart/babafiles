    statement_en: On 8 October 2024 the Bombay High Court upheld an Income Tax Appellate Tribunal ruling that the trust is exempt from tax on Rs 159.12 crore in anonymous donations received across three assessment years, because it is both a religious and a charitable institution.
    statement_hi: 8 अक्टूबर 2024 को बॉम्बे उच्च न्यायालय ने आयकर अपीलीय अधिकरण के उस निर्णय को बरकरार रखा जिसमें ट्रस्ट को तीन आकलन वर्षों में प्राप्त 159.12 करोड़ रुपये की गुमनाम दान राशि पर कर से छूट दी गई थी, क्योंकि यह एक धार्मिक और धर्मार्थ दोनों संस्था है।
    tier: closed
    date: 2024-10-08
    source_ids: [ssst-src-05]

