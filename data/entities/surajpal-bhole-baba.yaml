summary_en: >
  Surajpal, a former Uttar Pradesh Police constable who preaches as "Narayan Sakar Hari" or
  "Bhole Baba", addressed the satsang at Phulrai (Fulrai) village, Sikandra Rao, Hathras, at
  the end of which a stampede on 2 July 2024 killed 121 people according to official figures.
  He was not named as an accused in the FIR registered that night or in the 3,200-page
  chargesheet filed on 1 October 2024 against 11 organisers and volunteers, whose trial is
  under way; the state SIT report (July 2024) and the Justice Brijesh Kumar Srivastava
  judicial inquiry report tabled in the UP Assembly on 5 March 2025 attributed the tragedy to
  the organisers and local officials and did not record any lapse on his part, while the
  commission rejected the "toxic spray" theory advanced by his counsel and recommended a
  further SIT probe of a possible conspiracy. Major outlets, citing the retired inspector who
  made the arrest, report an earlier Agra (Shahganj) case of March 2000 under the Drugs and
  Magic Remedies Act that ended in a final (closure) report; no court or police record of it
  was located.
summary_hi: >
  सूरजपाल, उत्तर प्रदेश पुलिस के पूर्व सिपाही, जो "नारायण साकार हरि" या "भोले बाबा" के नाम से
  प्रवचन करते हैं, ने हाथरस के सिकंदराराऊ क्षेत्र के फुलरई गाँव में उस सत्संग को संबोधित किया
  था जिसके समापन पर 2 जुलाई 2024 को हुई भगदड़ में आधिकारिक आँकड़ों के अनुसार 121 लोगों की
  मृत्यु हुई। उसी रात दर्ज एफआईआर और 1 अक्टूबर 2024 को 11 आयोजकों/सेवादारों के विरुद्ध दाखिल
  3,200 पृष्ठों के आरोपपत्र में उन्हें अभियुक्त नहीं बनाया गया; उन 11 का विचारण चल रहा है। राज्य
  की एसआईटी रिपोर्ट (जुलाई 2024) और न्यायमूर्ति बृजेश कुमार श्रीवास्तव न्यायिक जाँच आयोग की
  5 मार्च 2025 को विधानसभा में रखी गई रिपोर्ट ने आयोजकों और स्थानीय अधिकारियों को ज़िम्मेदार
  ठहराया और उनकी ओर से कोई चूक दर्ज नहीं की; आयोग ने उनके वकील द्वारा उठाए गए "ज़हरीले स्प्रे"
  के सिद्धांत को खारिज किया और संभावित षड्यंत्र की एसआईटी जाँच की सिफ़ारिश की। प्रमुख
  समाचार संस्थानों ने, गिरफ़्तारी करने वाले सेवानिवृत्त निरीक्षक के हवाले से, मार्च 2000 के आगरा
  (शाहगंज) के एक मामले की सूचना दी है जो अंतिम (क्लोज़र) रिपोर्ट पर समाप्त हुआ; इसका कोई
  अदालती या पुलिस अभिलेख नहीं मिला।
hi_reviewed: false
response_from_subject:
  text_en: >
    In a video statement on 6 July 2024 Surajpal said: "I am saddened by the deaths... I pray
    to God to give us strength to come out of this grief", asked victims' families to have
    faith in the government and administration, and said "anyone who is behind the incident
    will not be spared". Speaking to ANI at Bahadur Nagar on 17 July 2024 he said: "I am
    extremely sad after the incident of July 2, but who can stop what's bound to happen?...
    We have faith in the SIT and judicial commission and the truth will come out." His lawyer
    A.P. Singh has said he "has not been absconding" and was cooperating with the police
    (5 July 2024), alleged that a "poisonous substance" released in the crowd triggered the
    stampede (7 July 2024), and after the commission hearing of 10 October 2024 said "Bhole
    Baba has no involvement in the incident" and named a local resident as responsible.
  text_hi: >
    6 जुलाई 2024 के वीडियो बयान में सूरजपाल ने कहा: "मुझे मौतों का दुख है... मैं ईश्वर से
    प्रार्थना करता हूँ कि हमें इस शोक से उबरने की शक्ति दे", पीड़ित परिवारों से सरकार और
    प्रशासन पर भरोसा रखने को कहा और कहा कि "जो भी इस घटना के पीछे है, उसे बख्शा नहीं
    जाएगा"। 17 जुलाई 2024 को बहादुर नगर में एएनआई से उन्होंने कहा: "2 जुलाई की घटना के बाद
    मैं बहुत दुखी हूँ, लेकिन जो होना है उसे कौन रोक सकता है?... हमें एसआईटी और न्यायिक आयोग
    पर भरोसा है और सच सामने आएगा।" उनके वकील ए.पी. सिंह ने कहा कि वे "फ़रार नहीं" हैं और
    पुलिस का सहयोग कर रहे हैं (5 जुलाई 2024), आरोप लगाया कि भीड़ में छोड़े गए "ज़हरीले पदार्थ"
    से भगदड़ हुई (7 जुलाई 2024), और 10 अक्टूबर 2024 की आयोग सुनवाई के बाद कहा कि "भोले बाबा
    की घटना में कोई संलिप्तता नहीं है" तथा एक स्थानीय निवासी को ज़िम्मेदार बताया।
  source_id: surajpal-bhole-baba-src-16

