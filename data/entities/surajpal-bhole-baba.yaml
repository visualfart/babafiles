relationships:
  - to_id: akhilesh-yadav
    type: public_appearance
    period_start: 2023-01-03
    period_end: 2023-01-03
    description_en: >
      Akhilesh Yadav attended an earlier satsang of Surajpal; ThePrint reported he posted photos
      from it on 3 January 2023, and after the stampede BJP affiliates circulated the images
      while CM Adityanath alluded to the "sajjan"'s political connections. Recorded as a
      documented appearance, not as an endorsement.
    description_hi: >
      अखिलेश यादव सूरजपाल के एक पूर्व सत्संग में शामिल हुए थे; द प्रिंट के अनुसार उन्होंने
      3 जनवरी 2023 को उसकी तस्वीरें पोस्ट की थीं, और भगदड़ के बाद भाजपा से जुड़े लोगों ने वे
      तस्वीरें प्रसारित कीं तथा मुख्यमंत्री आदित्यनाथ ने "सज्जन" के राजनीतिक संबंधों का संकेत
      किया। इसे दर्ज उपस्थिति के रूप में लिखा गया है, समर्थन के रूप में नहीं।
    source_ids: [surajpal-bhole-baba-src-27, surajpal-bhole-baba-src-25, surajpal-bhole-baba-src-24]
  - to_id: babu-ram-paswan
    type: public_appearance
    period_start: 2024-10-10
    period_end: 2024-10-10
    description_en: >
      BJP MLA Babu Ram Paswan (Puranpur) escorted Surajpal in his vehicle to the judicial
      commission's office in Lucknow on 10 October 2024, as reported by The Hindu and The Times
      of India; the UP Congress criticised the ruling party over it.
    description_hi: >
      भाजपा विधायक बाबू राम पासवान (पूरनपुर) 10 अक्टूबर 2024 को सूरजपाल को अपने वाहन में लखनऊ
      स्थित न्यायिक आयोग के कार्यालय तक ले गए, जैसा द हिंदू और टाइम्स ऑफ़ इंडिया ने बताया;
      उत्तर प्रदेश कांग्रेस ने इस पर सत्तारूढ़ दल की आलोचना की।
    source_ids: [surajpal-bhole-baba-src-05, surajpal-bhole-baba-src-28]
