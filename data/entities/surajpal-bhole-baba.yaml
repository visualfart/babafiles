cases:
  - id: surajpal-bhole-baba-hathras-stampede-2024
    title_en: State v. Dev Prakash Madhukar and 10 others (Hathras stampede) - Surajpal not an accused
    title_hi: राज्य बनाम देवप्रकाश मधुकर व 10 अन्य (हाथरस भगदड़) - सूरजपाल अभियुक्त नहीं
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court: Additional Sessions Judge (Court No. I), Hathras
    case_number:
    filed_year: 2024
    case_type: criminal
    statutes: [BNS 105, BNS 110, BNS 126(2), BNS 223, BNS 238, BNS 190, BNS 121(1), BNS 61(2), Criminal Law Amendment Act s.7]
    status: Trial of 11 accused under way since August 2025; Surajpal is not named in the FIR or the chargesheet
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      On the night of 2 July 2024 an FIR was registered at Sikandra Rao police station, Hathras,
      on the complaint of a sub-inspector, naming chief organiser Dev Prakash Madhukar and
      unnamed organisers and volunteers; it alleged that permission had been sought for 80,000
      people while about 2.5 lakh attended. A 3,200-page chargesheet filed on 1 October 2024 in
      the court of the Chief Judicial Magistrate named 11 accused: Madhukar, Megh Singh, Mukesh
      Kumar, Manju Devi, Manju Yadav, Ram Ladhete, Upendra Singh, Sanju Kumar, Ram Prakash
      Shakya, Durvesh Kumar and Dalveer Singh. Surajpal, at whose satsang the stampede occurred,
      is not named in either document; the Hathras ASP said at the time that the investigation
      remained ongoing. Charges were framed against the 11 on 6 August 2025 and prosecution
      witnesses were being examined in November 2025, with all 11 on bail. On 6 January 2025 the
      Allahabad High Court, in the bail plea of accused Manju Devi, said the incident prima facie
      reflected administrative negligence and summoned the then DM and SSP; that order does not
      address Surajpal. Opposition leaders have publicly questioned his exclusion; the defence
      lawyer for the accused, who is also Surajpal's counsel, has maintained that the stampede
      was a conspiracy. No court order on Surajpal's own status was located for 2025-2026.
    summary_hi: >
      2 जुलाई 2024 की रात हाथरस के सिकंदराराऊ थाने में एक उपनिरीक्षक की तहरीर पर एफआईआर दर्ज
      हुई जिसमें मुख्य आयोजक देवप्रकाश मधुकर और अज्ञात आयोजकों/सेवादारों को नामज़द किया गया;
      आरोप था कि अनुमति 80,000 लोगों की ली गई जबकि लगभग 2.5 लाख लोग आए। 1 अक्टूबर 2024 को
      मुख्य न्यायिक मजिस्ट्रेट की अदालत में दाखिल 3,200 पृष्ठों के आरोपपत्र में 11 अभियुक्त नामज़द
      हैं: मधुकर, मेघ सिंह, मुकेश कुमार, मंजू देवी, मंजू यादव, राम लड़ैते, उपेंद्र सिंह, संजू कुमार,
      राम प्रकाश शाक्य, दुर्वेश कुमार और दलवीर सिंह। सूरजपाल, जिनके सत्संग में भगदड़ हुई, किसी
      भी दस्तावेज़ में नामज़द नहीं हैं; हाथरस के एएसपी ने तब कहा था कि जाँच जारी है। 6 अगस्त
      2025 को 11 अभियुक्तों पर आरोप तय हुए और नवंबर 2025 में अभियोजन गवाहों के बयान दर्ज हो
      रहे थे; सभी 11 ज़मानत पर हैं। 6 जनवरी 2025 को इलाहाबाद उच्च न्यायालय ने अभियुक्त मंजू देवी
      की ज़मानत याचिका में कहा कि घटना प्रथम दृष्टया प्रशासनिक लापरवाही दर्शाती है और तत्कालीन
      डीएम व एसएसपी को तलब किया; उस आदेश में सूरजपाल का उल्लेख नहीं है। विपक्षी नेताओं ने
      उनके बाहर रखे जाने पर सार्वजनिक रूप से सवाल उठाए हैं; अभियुक्तों के वकील, जो सूरजपाल के भी
      वकील हैं, भगदड़ को षड्यंत्र बताते रहे हैं। 2025-2026 में सूरजपाल की अपनी स्थिति पर कोई
      अदालती आदेश नहीं मिला।
    source_ids: [surajpal-bhole-baba-src-11, surajpal-bhole-baba-src-02, surajpal-bhole-baba-src-04, surajpal-bhole-baba-src-22, surajpal-bhole-baba-src-23, surajpal-bhole-baba-src-21]

  - id: surajpal-bhole-baba-hathras-sit-2024
    title_en: Special Investigation Team inquiry into the Hathras stampede (ADG Agra Zone / Divisional Commissioner Aligarh)
    title_hi: हाथरस भगदड़ की विशेष जाँच दल (एसआईटी) जाँच (एडीजी आगरा ज़ोन / मंडलायुक्त अलीगढ़)
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court: Special Investigation Team, Government of Uttar Pradesh
    case_number:
    filed_year: 2024
    case_type: inquiry
    statutes: []
    status: Report submitted to the UP Home Department on 9 July 2024; six officials suspended; Surajpal not held responsible
    tier: closed
    verdict_date: 2024-07-09
    sentence_or_remedy: Six local officials suspended (SDM, circle officer, SHO, tehsildar, two outpost in-charges)
    appeal_status:
    summary_en: >
      The state government constituted a two-member SIT of ADG (Agra Zone) Anupam Kulshreshtha
      and Divisional Commissioner (Aligarh) Chaitra V on 3 July 2024. Its report, submitted on
      9 July 2024, found "negligence by event organizers is the main reason behind the incident",
      also held the local administration accountable, and said a conspiracy "is not denied, but
      in-depth investigation is needed"; six officials were suspended the same day. Business
      Standard reported that the report did not include Surajpal among those found responsible,
      and Deccan Herald reported that it "nowhere mentioned" him; The Indian Express reported
      that the report mentioned a notice served at his Mainpuri ashram for questioning, to which
      he did not respond. The report itself has not been published.
    summary_hi: >
      राज्य सरकार ने 3 जुलाई 2024 को एडीजी (आगरा ज़ोन) अनुपम कुलश्रेष्ठ और मंडलायुक्त (अलीगढ़)
      चैत्रा वी की दो सदस्यीय एसआईटी गठित की। 9 जुलाई 2024 को सौंपी गई रिपोर्ट में "आयोजकों की
      लापरवाही घटना का मुख्य कारण" पाई गई, स्थानीय प्रशासन को भी ज़िम्मेदार ठहराया गया और कहा
      गया कि षड्यंत्र से "इनकार नहीं, पर गहन जाँच आवश्यक है"; उसी दिन छह अधिकारी निलंबित हुए।
      बिज़नेस स्टैंडर्ड के अनुसार रिपोर्ट में सूरजपाल को ज़िम्मेदार पाए गए लोगों में शामिल नहीं
      किया गया, और डेक्कन हेराल्ड के अनुसार रिपोर्ट में उनका "कहीं उल्लेख नहीं" है; इंडियन
      एक्सप्रेस के अनुसार रिपोर्ट में उनके मैनपुरी आश्रम पर पूछताछ के लिए नोटिस तामील करने का
      उल्लेख है, जिसका उन्होंने जवाब नहीं दिया। रिपोर्ट स्वयं प्रकाशित नहीं हुई है।
    source_ids: [surajpal-bhole-baba-src-03, surajpal-bhole-baba-src-30, surajpal-bhole-baba-src-13, surajpal-bhole-baba-src-19, surajpal-bhole-baba-src-24]

  - id: surajpal-bhole-baba-hathras-judicial-commission-2024
    title_en: Judicial Inquiry Commission on the Hathras stampede (Justice Brijesh Kumar Srivastava, retd)
    title_hi: हाथरस भगदड़ पर न्यायिक जाँच आयोग (सेवानिवृत्त न्यायमूर्ति बृजेश कुमार श्रीवास्तव)
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court: Judicial Inquiry Commission constituted by the Government of Uttar Pradesh
    case_number:
    filed_year: 2024
    case_type: inquiry
    statutes: []
    status: Report submitted February 2025 and tabled in the UP Legislative Assembly on 5 March 2025; no lapse recorded against Surajpal; further SIT probe of conspiracy angle recommended
    tier: closed
    verdict_date: 2025-03-05
    sentence_or_remedy: Recommendations only (no individual named as responsible; law against superstition and a further SIT probe recommended)
    appeal_status:
    summary_en: >
      The three-member commission of retired Allahabad High Court judge Brijesh Kumar Srivastava,
      retired IAS officer Hemant Rao and retired IPS officer Bhavesh Kumar Singh was formed on
      3 July 2024. Surajpal appeared before it in Lucknow on 10 October 2024 and, according to his
      lawyer, recorded a written statement; The Times of India reported he submitted affidavits
      from about 1,100 attendees. The 1,670-page report was handed to the government in February
      2025 and tabled in the Assembly on 5 March 2025. As reported by The Indian Express, it
      "has not mentioned any lapses on the part of the preacher"; Hindustan Times reported that
      it "refused to name any individual or officer as responsible". It attributed the stampede
      to a crowd of 2.5-3 lakh against a permitted 80,000, crowd management left entirely to the
      organisers' volunteers, an exit route for the preacher cut through the crowd's own gate,
      slippery ground and a slope beside the highway, and noted the possibility that devotees
      bent to collect dust from the preacher's feet. It rejected the "toxic spray" theory,
      observing that the affidavits supporting it appeared instructed and that "a similar
      affidavit was also given by the counsel of Bhole Baba, which he denied during
      investigation". It said a criminal conspiracy "cannot be ruled out" and recommended that
      the SIT investigating the crime examine it, and, per Hindustan Times, recommended a law
      against superstition and deceptive practices. Outlets differ in characterising this as a
      "clean chit"; this record states only what the report is reported to say.
    summary_hi: >
      इलाहाबाद उच्च न्यायालय के सेवानिवृत्त न्यायाधीश बृजेश कुमार श्रीवास्तव, सेवानिवृत्त
      आईएएस हेमंत राव और सेवानिवृत्त आईपीएस भवेश कुमार सिंह का तीन सदस्यीय आयोग 3 जुलाई 2024
      को गठित हुआ। सूरजपाल 10 अक्टूबर 2024 को लखनऊ में आयोग के समक्ष उपस्थित हुए और, उनके
      वकील के अनुसार, लिखित बयान दर्ज कराया; टाइम्स ऑफ़ इंडिया के अनुसार उन्होंने लगभग 1,100
      श्रद्धालुओं के शपथपत्र सौंपे। 1,670 पृष्ठों की रिपोर्ट फ़रवरी 2025 में सरकार को सौंपी गई
      और 5 मार्च 2025 को विधानसभा में रखी गई। इंडियन एक्सप्रेस के अनुसार रिपोर्ट में "प्रवचनकर्ता
      की ओर से किसी चूक का उल्लेख नहीं" है; हिंदुस्तान टाइम्स के अनुसार आयोग ने "किसी व्यक्ति या
      अधिकारी को ज़िम्मेदार नामित करने से इनकार" किया। रिपोर्ट ने भगदड़ का कारण अनुमत 80,000 के
      मुकाबले 2.5-3 लाख की भीड़, भीड़ प्रबंधन पूरी तरह आयोजकों के सेवादारों पर छोड़ देना,
      प्रवचनकर्ता के निकास का मार्ग भीड़ के अपने गेट के पास से काटना, फिसलन और हाईवे के किनारे
      की ढलान बताया, और श्रद्धालुओं के प्रवचनकर्ता के चरणों की धूल लेने के लिए झुकने की संभावना
      दर्ज की। आयोग ने "ज़हरीले स्प्रे" के सिद्धांत को खारिज किया, यह कहते हुए कि उसके समर्थन के
      शपथपत्र सिखाए-पढ़ाए लगते हैं और "ऐसा ही एक शपथपत्र भोले बाबा के वकील ने भी दिया, जिससे
      उन्होंने जाँच के दौरान इनकार किया"। आयोग ने कहा कि आपराधिक षड्यंत्र से "इनकार नहीं किया
      जा सकता" और अपराध की जाँच कर रही एसआईटी से इसकी जाँच की सिफ़ारिश की, तथा हिंदुस्तान टाइम्स
      के अनुसार अंधविश्वास व भ्रामक प्रथाओं के विरुद्ध कानून की सिफ़ारिश की। समाचार संस्थान इसे
      "क्लीन चिट" कहने में भिन्न हैं; यह अभिलेख केवल वही दर्ज करता है जो रिपोर्ट में कहा गया
      बताया जाता है।
    source_ids: [surajpal-bhole-baba-src-12, surajpal-bhole-baba-src-05, surajpal-bhole-baba-src-28, surajpal-bhole-baba-src-31, surajpal-bhole-baba-src-06, surajpal-bhole-baba-src-07, surajpal-bhole-baba-src-08]

  - id: surajpal-bhole-baba-agra-shahganj-2000
    title_en: Shahganj (Agra) case under the Drugs and Magic Remedies Act, 2000 - reported closed by final report
    title_hi: औषधि एवं चमत्कारी उपचार अधिनियम के अंतर्गत शाहगंज (आगरा) मामला, 2000 - अंतिम रिपोर्ट से बंद बताया गया
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court:
    case_number:
    filed_year: 2000
    case_type: criminal
    statutes: [Drugs and Magic Remedies (Objectionable Advertisements) Act 1954 s.2(c), Drugs and Magic Remedies (Objectionable Advertisements) Act 1954 s.7, IPC 109]
    status: Reported by major outlets as closed by a final report after reinvestigation; no court or police record located, so tiered as allegation
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      According to ThePrint, quoting retired UP Police inspector Tejveer Singh Yadav who led the
      police team, on 18 March 2000 Surajpal (then a serving policeman) and 300-400 followers were
      found at a cremation ground in Shahganj, Agra, where he was attempting to "revive" a girl
      aged about 16-17 who had died; a case was registered at Shahganj police station against
      six people including Surajpal and his wife under sections 2(c) and 7 of the Drugs and Magic
      Remedies (Objectionable Advertisements) Act, 1954 and section 109 IPC. A sub-inspector
      filed a chargesheet naming him, a reinvestigation was ordered, and a circle-officer-rank
      officer filed a final report, the precursor to closure. The Times of India, quoting the
      same officer as Shahganj SHO, reported the arrest of Surajpal, his wife and four others
      but dated the episode to 1998. No FIR, chargesheet, final report or court record was
      found online; the case is therefore recorded at allegation tier.
    summary_hi: >
      द प्रिंट के अनुसार, पुलिस दल का नेतृत्व करने वाले उत्तर प्रदेश पुलिस के सेवानिवृत्त
      निरीक्षक तेजवीर सिंह यादव के हवाले से, 18 मार्च 2000 को सूरजपाल (तब सेवारत पुलिसकर्मी)
      और 300-400 अनुयायी आगरा के शाहगंज श्मशान घाट पर मिले, जहाँ वे लगभग 16-17 वर्ष की एक
      मृत लड़की को "पुनर्जीवित" करने का प्रयास कर रहे थे; शाहगंज थाने में सूरजपाल और उनकी
      पत्नी सहित छह लोगों के विरुद्ध औषधि एवं चमत्कारी उपचार (आपत्तिजनक विज्ञापन) अधिनियम,
      1954 की धारा 2(ग) व 7 और आईपीसी की धारा 109 में मामला दर्ज हुआ। एक उपनिरीक्षक ने उन्हें
      नामज़द करते हुए आरोपपत्र दाखिल किया, पुनर्जाँच के आदेश हुए, और क्षेत्राधिकारी स्तर के
      अधिकारी ने अंतिम रिपोर्ट (क्लोज़र की पूर्ववर्ती) दाखिल की। टाइम्स ऑफ़ इंडिया ने उसी अधिकारी
      को शाहगंज एसएचओ बताते हुए सूरजपाल, उनकी पत्नी और चार अन्य की गिरफ़्तारी की सूचना दी, पर
      घटना 1998 की बताई। कोई एफआईआर, आरोपपत्र, अंतिम रिपोर्ट या अदालती अभिलेख ऑनलाइन नहीं मिला;
      इसलिए मामला आरोप स्तर पर दर्ज है।
    source_ids: [surajpal-bhole-baba-src-09, surajpal-bhole-baba-src-10]

claims:
  - id: surajpal-bhole-baba-claim-01
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    statement_en: The FIR registered at Sikandra Rao police station on the night of 2 July 2024 under BNS sections 105, 110, 126(2), 223 and 238 named chief organiser Dev Prakash Madhukar and unnamed organisers and volunteers; it did not name Surajpal.
    statement_hi: 2 जुलाई 2024 की रात सिकंदराराऊ थाने में बीएनएस की धारा 105, 110, 126(2), 223 और 238 में दर्ज एफआईआर में मुख्य आयोजक देवप्रकाश मधुकर और अज्ञात आयोजकों/सेवादारों को नामज़द किया गया; उसमें सूरजपाल का नाम नहीं था।
    tier: allegation
    date: 2024-07-02
    source_ids: [surajpal-bhole-baba-src-11, surajpal-bhole-baba-src-26, surajpal-bhole-baba-src-05, surajpal-bhole-baba-src-02]
  - id: surajpal-bhole-baba-claim-02
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    statement_en: The 3,200-page chargesheet filed on 1 October 2024 in the court of the Chief Judicial Magistrate, Hathras, named 11 accused and did not name Surajpal; ASP Ashok Kumar Singh said "investigation is an ongoing process and is on in this case too".
    statement_hi: 1 अक्टूबर 2024 को हाथरस के मुख्य न्यायिक मजिस्ट्रेट की अदालत में दाखिल 3,200 पृष्ठों के आरोपपत्र में 11 अभियुक्त नामज़द किए गए और सूरजपाल का नाम नहीं था; एएसपी अशोक कुमार सिंह ने कहा कि "जाँच एक सतत प्रक्रिया है और इस मामले में भी जारी है"।
    tier: allegation
    date: 2024-10-01
    source_ids: [surajpal-bhole-baba-src-04, surajpal-bhole-baba-src-22]
  - id: surajpal-bhole-baba-claim-03
    case_id: surajpal-bhole-baba-hathras-sit-2024
    statement_en: The SIT report submitted on 9 July 2024 found negligence by the event organisers to be the main cause and also held the local administration accountable, leading to the suspension of six officials; Business Standard and Deccan Herald reported that it did not hold Surajpal responsible.
    statement_hi: 9 जुलाई 2024 को सौंपी गई एसआईटी रिपोर्ट में आयोजकों की लापरवाही को मुख्य कारण पाया गया और स्थानीय प्रशासन को भी ज़िम्मेदार ठहराया गया, जिसके बाद छह अधिकारी निलंबित हुए; बिज़नेस स्टैंडर्ड और डेक्कन हेराल्ड के अनुसार रिपोर्ट ने सूरजपाल को ज़िम्मेदार नहीं ठहराया।
    tier: closed
    date: 2024-07-09
    source_ids: [surajpal-bhole-baba-src-03, surajpal-bhole-baba-src-30, surajpal-bhole-baba-src-13]
  - id: surajpal-bhole-baba-claim-04
    case_id: surajpal-bhole-baba-hathras-judicial-commission-2024
    statement_en: The Justice Brijesh Kumar Srivastava commission's 1,670-page report, tabled in the UP Legislative Assembly on 5 March 2025, attributed the stampede to the organisers and local police and administration and, as reported by The Indian Express, "has not mentioned any lapses on the part of the preacher"; Hindustan Times reported it "refused to name any individual or officer as responsible".
    statement_hi: न्यायमूर्ति बृजेश कुमार श्रीवास्तव आयोग की 1,670 पृष्ठों की रिपोर्ट, जो 5 मार्च 2025 को उत्तर प्रदेश विधानसभा में रखी गई, ने भगदड़ के लिए आयोजकों और स्थानीय पुलिस-प्रशासन को ज़िम्मेदार ठहराया और, इंडियन एक्सप्रेस के अनुसार, "प्रवचनकर्ता की ओर से किसी चूक का उल्लेख नहीं" किया; हिंदुस्तान टाइम्स के अनुसार आयोग ने "किसी व्यक्ति या अधिकारी को ज़िम्मेदार नामित करने से इनकार" किया।
    tier: closed
    date: 2025-03-05
    source_ids: [surajpal-bhole-baba-src-06, surajpal-bhole-baba-src-07, surajpal-bhole-baba-src-08]
  - id: surajpal-bhole-baba-claim-05
    case_id: surajpal-bhole-baba-hathras-judicial-commission-2024
    statement_en: The commission rejected the theory, advanced by Surajpal's counsel, that a toxic spray caused the stampede, finding the supporting affidavits appeared instructed and noting that "a similar affidavit was also given by the counsel of Bhole Baba, which he denied during investigation"; it said a criminal conspiracy "cannot be ruled out" and recommended that the SIT investigate that aspect.
    statement_hi: आयोग ने सूरजपाल के वकील द्वारा उठाए गए इस सिद्धांत को खारिज किया कि ज़हरीले स्प्रे से भगदड़ हुई, यह पाते हुए कि समर्थन में दिए गए शपथपत्र सिखाए-पढ़ाए लगते हैं, और दर्ज किया कि "ऐसा ही एक शपथपत्र भोले बाबा के वकील ने भी दिया, जिससे उन्होंने जाँच के दौरान इनकार किया"; आयोग ने कहा कि आपराधिक षड्यंत्र से "इनकार नहीं किया जा सकता" और एसआईटी से इस पहलू की जाँच की सिफ़ारिश की।
    tier: closed
    date: 2025-03-05
    source_ids: [surajpal-bhole-baba-src-07, surajpal-bhole-baba-src-08, surajpal-bhole-baba-src-06]
  - id: surajpal-bhole-baba-claim-06
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    statement_en: On 6 August 2025 Additional Sessions Judge (Court No. I) Mahendra Srivastava, Hathras, framed charges against the 11 accused, with the trial to begin on 18 August 2025 and 676 prosecution witnesses listed; all 11 were on bail and Surajpal was not among the accused.
    statement_hi: 6 अगस्त 2025 को हाथरस के अपर सत्र न्यायाधीश (कोर्ट नं. 1) महेंद्र श्रीवास्तव ने 11 अभियुक्तों पर आरोप तय किए; विचारण 18 अगस्त 2025 से शुरू होना था और अभियोजन के 676 गवाह सूचीबद्ध थे; सभी 11 ज़मानत पर थे और सूरजपाल अभियुक्तों में नहीं थे।
    tier: allegation
    date: 2025-08-06
    source_ids: [surajpal-bhole-baba-src-22, surajpal-bhole-baba-src-23]
  - id: surajpal-bhole-baba-claim-07
    case_id: surajpal-bhole-baba-agra-shahganj-2000
    statement_en: ThePrint, quoting retired inspector Tejveer Singh Yadav, reported that on 18 March 2000 a case was registered at Shahganj police station, Agra, against six people including Surajpal and his wife under sections 2(c) and 7 of the Drugs and Magic Remedies (Objectionable Advertisements) Act, 1954 and section 109 IPC after he attempted to "revive" a dead girl, and that after a chargesheet and a reinvestigation a circle-officer-rank officer filed a final report; The Times of India dates the same episode to 1998.
    statement_hi: द प्रिंट ने सेवानिवृत्त निरीक्षक तेजवीर सिंह यादव के हवाले से बताया कि 18 मार्च 2000 को आगरा के शाहगंज थाने में सूरजपाल और उनकी पत्नी सहित छह लोगों के विरुद्ध औषधि एवं चमत्कारी उपचार (आपत्तिजनक विज्ञापन) अधिनियम, 1954 की धारा 2(ग) व 7 और आईपीसी 109 में मामला दर्ज हुआ, जब उन्होंने एक मृत लड़की को "पुनर्जीवित" करने का प्रयास किया, और आरोपपत्र व पुनर्जाँच के बाद क्षेत्राधिकारी स्तर के अधिकारी ने अंतिम रिपोर्ट दाखिल की; टाइम्स ऑफ़ इंडिया इसी घटना को 1998 का बताता है।
    tier: allegation
    date: 2000-03-18
    source_ids: [surajpal-bhole-baba-src-09, surajpal-bhole-baba-src-10]
  - id: surajpal-bhole-baba-claim-08
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    statement_en: Asked on 3 July 2024 why Surajpal had not been named in the police case, Chief Minister Yogi Adityanath said "Everyone knows with whom that sajjan has a photo and with whom he has political connections", which The Indian Express and The Hindu read as a reference to a circulating video of Akhilesh Yadav at one of Surajpal's events.
    statement_hi: 3 जुलाई 2024 को यह पूछे जाने पर कि सूरजपाल को पुलिस मामले में नामज़द क्यों नहीं किया गया, मुख्यमंत्री योगी आदित्यनाथ ने कहा, "सबको पता है उस सज्जन की किसके साथ फोटो है और किसके साथ राजनीतिक संबंध हैं", जिसे इंडियन एक्सप्रेस और द हिंदू ने सूरजपाल के एक कार्यक्रम में अखिलेश यादव के वायरल वीडियो का संदर्भ माना।
    tier: allegation
    date: 2024-07-03
    source_ids: [surajpal-bhole-baba-src-24, surajpal-bhole-baba-src-25, surajpal-bhole-baba-src-27]
  - id: surajpal-bhole-baba-claim-09
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    statement_en: On 3 October 2024 BSP chief Mayawati posted on X that the absence of Surajpal's name from the chargesheet "is anti-people politics" which "proves that such people enjoy the patronage of the state government".
    statement_hi: 3 अक्टूबर 2024 को बसपा प्रमुख मायावती ने एक्स पर लिखा कि आरोपपत्र में सूरजपाल का नाम न होना "जनविरोधी राजनीति" है, "जिससे साबित है कि ऐसे लोगों को राज्य सरकार का संरक्षण है"।
    tier: allegation
    date: 2024-10-03
    source_ids: [surajpal-bhole-baba-src-14]
  - id: surajpal-bhole-baba-claim-10
    case_id: surajpal-bhole-baba-hathras-judicial-commission-2024
    statement_en: On 10 October 2024 Surajpal appeared before the judicial commission in Lucknow for about two hours, arriving in the vehicle of BJP MLA Babu Ram Paswan (Puranpur); the UP Congress criticised the ruling party for the escort, and his lawyer A.P. Singh said "we recorded our statement in writing".
    statement_hi: 10 अक्टूबर 2024 को सूरजपाल लखनऊ में न्यायिक आयोग के समक्ष लगभग दो घंटे उपस्थित रहे और भाजपा विधायक बाबू राम पासवान (पूरनपुर) के वाहन में पहुँचे; उत्तर प्रदेश कांग्रेस ने इस पर सत्तारूढ़ दल की आलोचना की, और उनके वकील ए.पी. सिंह ने कहा, "हमने अपना बयान लिखित में दर्ज कराया"।
    tier: allegation
    date: 2024-10-10
    source_ids: [surajpal-bhole-baba-src-05, surajpal-bhole-baba-src-28]
  - id: surajpal-bhole-baba-claim-11
    statement_en: After the stampede, photos and a video of Samajwadi Party president Akhilesh Yadav attending an earlier satsang of Surajpal circulated online; ThePrint reported that Akhilesh had himself posted photos from the event on 3 January 2023.
    statement_hi: भगदड़ के बाद समाजवादी पार्टी अध्यक्ष अखिलेश यादव के सूरजपाल के एक पूर्व सत्संग में शामिल होने की तस्वीरें और वीडियो ऑनलाइन प्रसारित हुए; द प्रिंट के अनुसार अखिलेश ने स्वयं 3 जनवरी 2023 को उस कार्यक्रम की तस्वीरें पोस्ट की थीं।
    tier: allegation
    date: 2023-01-03
    source_ids: [surajpal-bhole-baba-src-27, surajpal-bhole-baba-src-25, surajpal-bhole-baba-src-24]
  - id: surajpal-bhole-baba-claim-12
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    statement_en: On 12 July 2024 the Supreme Court (CJI D.Y. Chandrachud, Pardiwala and Misra JJ) declined to entertain Vishal Tiwari's PIL (W.P.(C) 428/2024) seeking an expert committee to probe the stampede, granting liberty to approach the High Court under Article 226; Surajpal was not a party.
    statement_hi: 12 जुलाई 2024 को सर्वोच्च न्यायालय (मुख्य न्यायाधीश डी.वाई. चंद्रचूड़, न्यायमूर्ति पारदीवाला व मिश्रा) ने भगदड़ की जाँच के लिए विशेषज्ञ समिति की माँग वाली विशाल तिवारी की जनहित याचिका (डब्ल्यू.पी.(सी) 428/2024) पर विचार से इनकार किया और अनुच्छेद 226 के अंतर्गत उच्च न्यायालय जाने की छूट दी; सूरजपाल पक्षकार नहीं थे।
    tier: allegation
    date: 2024-07-12
    source_ids: [surajpal-bhole-baba-src-20, surajpal-bhole-baba-src-17]

events:
  - date: 2000-03-18
    kind: fir
    label_en: Case registered at Shahganj police station, Agra, under the Drugs and Magic Remedies Act and IPC 109 (as reported; TOI dates it to 1998)
    label_hi: आगरा के शाहगंज थाने में औषधि एवं चमत्कारी उपचार अधिनियम व आईपीसी 109 में मामला दर्ज (रिपोर्ट के अनुसार; टीओआई इसे 1998 का बताता है)
    case_id: surajpal-bhole-baba-agra-shahganj-2000
    source_ids: [surajpal-bhole-baba-src-09, surajpal-bhole-baba-src-10]
  - date: 2024-07-02
    kind: incident
    label_en: Stampede at the end of Surajpal's satsang at Phulrai village, Sikandra Rao, Hathras; 121 dead (official figure)
    label_hi: हाथरस के सिकंदराराऊ क्षेत्र के फुलरई गाँव में सूरजपाल के सत्संग के समापन पर भगदड़; 121 मृत (आधिकारिक आँकड़ा)
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    source_ids: [surajpal-bhole-baba-src-01, surajpal-bhole-baba-src-31]
  - date: 2024-07-02
    kind: fir
    label_en: FIR registered at Sikandra Rao police station against Dev Prakash Madhukar and unnamed organisers; Surajpal not named
    label_hi: सिकंदराराऊ थाने में देवप्रकाश मधुकर और अज्ञात आयोजकों के विरुद्ध एफआईआर; सूरजपाल नामज़द नहीं
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    source_ids: [surajpal-bhole-baba-src-11, surajpal-bhole-baba-src-22]
  - date: 2024-07-03
    kind: other
    label_en: UP government orders probes - ADG-led SIT and a three-member judicial inquiry commission under Justice Brijesh Kumar Srivastava (retd)
    label_hi: उत्तर प्रदेश सरकार ने जाँच के आदेश दिए - एडीजी के नेतृत्व में एसआईटी और सेवानिवृत्त न्यायमूर्ति बृजेश कुमार श्रीवास्तव की अध्यक्षता में तीन सदस्यीय न्यायिक जाँच आयोग
    case_id: surajpal-bhole-baba-hathras-judicial-commission-2024
    source_ids: [surajpal-bhole-baba-src-01, surajpal-bhole-baba-src-12]
  - date: 2024-07-05
    kind: arrest
    label_en: Chief organiser Dev Prakash Madhukar arrested (main accused in the FIR)
    label_hi: मुख्य आयोजक देवप्रकाश मधुकर गिरफ़्तार (एफआईआर में मुख्य अभियुक्त)
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    source_ids: [surajpal-bhole-baba-src-02, surajpal-bhole-baba-src-25]
  - date: 2024-07-06
    kind: other
    label_en: Surajpal releases a video statement saying he is "saddened" by the deaths
    label_hi: सूरजपाल ने वीडियो बयान जारी कर मौतों पर "दुख" व्यक्त किया
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    source_ids: [surajpal-bhole-baba-src-16]
  - date: 2024-07-09
    kind: other
    label_en: SIT report submitted; six local officials suspended; report does not hold Surajpal responsible
    label_hi: एसआईटी रिपोर्ट सौंपी गई; छह स्थानीय अधिकारी निलंबित; रिपोर्ट में सूरजपाल को ज़िम्मेदार नहीं ठहराया गया
    case_id: surajpal-bhole-baba-hathras-sit-2024
    source_ids: [surajpal-bhole-baba-src-03, surajpal-bhole-baba-src-30]
  - date: 2024-07-12
    kind: other
    label_en: Supreme Court declines to entertain PIL seeking an expert-committee probe; petitioner told to approach the High Court
    label_hi: सर्वोच्च न्यायालय ने विशेषज्ञ समिति जाँच की जनहित याचिका पर विचार से इनकार किया; याचिकाकर्ता को उच्च न्यायालय जाने को कहा
    case_id: surajpal-bhole-baba-hathras-stampede-2024
    source_ids: [surajpal-bhole-baba-src-20]
  - date: 2024-07-17
    kind: other
    label_en: Surajpal reappears publicly at Bahadur Nagar, Kasganj, and tells ANI he has faith in the SIT and judicial commission
