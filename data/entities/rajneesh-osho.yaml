    case_id: rajneesh-oregon-ag-v-rajneeshpuram
    source_ids: [ rajneesh-src-06, rajneesh-src-08 ]
  - date: 1984-10-12
    kind: other
    label_en: District of Oregon denies the City of Rajneeshpuram's motion to dismiss the state's Establishment Clause suit
    label_hi: ओरेगन जिला अदालत ने राज्य के धर्म-स्थापना खंड वाद को खारिज़ करने के रजनीशपुरम शहर के आवेदन को अस्वीकार किया
    case_id: rajneesh-oregon-ag-v-rajneeshpuram
    source_ids: [ rajneesh-src-06 ]
  - date: 1985-10-23
    kind: chargesheet
    label_en: Federal grand jury returns a 35-count indictment against Rajneesh and associates for immigration fraud
    label_hi: संघीय ग्रैंड जूरी ने रजनीश और उनके सहयोगियों पर आप्रवासन-धोखाधड़ी के 35 आरोपों का अभियोग लगाया
    case_id: rajneesh-us-v-rajneesh-immigration-fraud-1985
    source_ids: [ rajneesh-src-01, rajneesh-src-02 ]
  - date: 1985-10-28
    kind: arrest
    label_en: Arrested by federal agents at Charlotte, North Carolina while attempting to leave the country
    label_hi: देश छोड़ने के प्रयास के दौरान उत्तरी कैरोलिना के शार्लट में संघीय एजेंटों द्वारा गिरफ्तार
    case_id: rajneesh-us-v-rajneesh-immigration-fraud-1985
    source_ids: [ rajneesh-src-01, rajneesh-src-02 ]
  - date: 1985-11
    kind: verdict
    label_en: Pleads guilty in the US District Court for Oregon to federal immigration-fraud charges
    label_hi: ओरेगन की अमेरिकी जिला अदालत में संघीय आप्रवासन-धोखाधड़ी के आरोपों में दोष स्वीकार किया
    case_id: rajneesh-us-v-rajneesh-immigration-fraud-1985
    source_ids: [ rajneesh-src-04, rajneesh-src-05 ]
  - date: 1985-11-15
    kind: other
    label_en: Deported and flies out of the United States after the guilty plea and sentencing
    label_hi: दोष स्वीकृति और सज़ा के बाद निर्वासित होकर अमेरिका से रवाना हुए
    case_id: rajneesh-us-v-rajneesh-immigration-fraud-1985
    source_ids: [ rajneesh-src-03 ]
  - date: 1985-12-13
    kind: verdict
    label_en: Five more followers plead guilty to related immigration-fraud counts in the same indictment
    label_hi: उसी अभियोग में पाँच और अनुयायियों ने संबंधित आप्रवासन-धोखाधड़ी के आरोपों में दोष स्वीकार किया
    case_id: rajneesh-us-v-rajneesh-immigration-fraud-1985
    source_ids: [ rajneesh-src-04 ]
  - date: 1986-03-20
    kind: chargesheet
    label_en: Federal grand jury indicts Ma Anand Sheela and Dianne Onang for conspiracy to tamper with consumer products over the salmonella attack
    label_hi: संघीय ग्रैंड जूरी ने साल्मोनेला हमले को लेकर मा आनंद शीला और डायने ओनांग पर उपभोक्ता उत्पादों से छेड़छाड़ की साज़िश का अभियोग लगाया
    source_ids: [ rajneesh-src-05 ]
  - date: 1986
    kind: verdict
    label_en: Ma Anand Sheela and Dianne Onang plead guilty and are sentenced to four-and-a-half years' imprisonment; ten of 21 defendants in a related wiretapping conspiracy are convicted
    label_hi: मा आनंद शीला और डायने ओनांग ने दोष स्वीकार किया और उन्हें साढ़े चार वर्ष कारावास की सज़ा हुई; एक संबंधित टेलीफोन-अवरोधन साज़िश मामले में 21 में से दस अभियुक्त दोषी ठहराए गए
    source_ids: [ rajneesh-src-05 ]
  - date: 1990-01-19
    kind: death
    label_en: Dies at Pune, India
    label_hi: पुणे, भारत में निधन
    source_ids: [ rajneesh-src-09 ]

