    label_hi: आंदोलन का मुख्यालय पुणे, भारत से ओरेगन के वास्को काउंटी स्थित एक फार्म पर स्थानांतरित, जो बाद में रजनीशपुरम शहर के रूप में निगमित हुआ
    source_ids: [ rajneesh-src-02, rajneesh-src-06 ]
  - date: 1984-09
