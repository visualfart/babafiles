id: rajneesh-osho
type: person
is_subject: true
name_en: Bhagwan Shree Rajneesh (Osho)
name_hi: भगवान श्री रजनीश (ओशो)
aliases: [ Osho, Chandra Mohan Jain, Acharya Rajneesh, Rajneesh Chandra Mohan Jain ]
born: 1931-12-11
died: 1990-01-19
base_location: Rajneeshpuram, Wasco County, Oregon, United States (1981-1985); earlier Pune, Maharashtra
country: IN
countries_of_operation: [ IN, US ]
organisations: [ Rajneesh Foundation International, Rajneesh Neo-Sannyas International Commune, Rajneesh Investment Corporation, City of Rajneeshpuram ]
activity_status: deceased
abap_2017_list: false
summary_en: >
  Rajneesh, later known as Osho, led a commune at Rajneeshpuram on a ranch in Wasco County, Oregon, from 1981 to 1985. Federal agents arrested him at Charlotte, North Carolina on 28 October 1985 as he and associates attempted to leave the country following a 35-count federal indictment for immigration fraud (arranging sham marriages so foreign followers could remain in the United States). He pleaded guilty in November 1985 in the US District Court for Oregon to federal immigration-fraud charges; under the plea agreement he paid a $400,000 fine, received a suspended sentence, and left the United States, later reported as barred from re-entry for five years. Separately, the US Department of Justice's 1986 Annual Report records that his personal secretary Ma Anand Sheela and a nurse practitioner, Dianne Onang, pleaded guilty to a federal charge of conspiracy to tamper with consumer products after followers cultured salmonella bacteria and contaminated salad bars in The Dalles, Oregon, in September 1984, sickening more than 750 people; both were sentenced to four-and-a-half years' imprisonment. A separate federal wiretapping conspiracy indictment named 21 commune members, of whom ten were convicted. The Oregon Attorney General separately sued in 1984 to have the incorporation of the City of Rajneeshpuram declared unconstitutional as an establishment of religion; a federal court held in October 1984 that the state's complaint stated a valid claim, and the city's status did not survive the commune's collapse after Rajneesh's deportation.
summary_hi: >
  रजनीश, जिन्हें बाद में ओशो के नाम से जाना गया, 1981 से 1985 तक ओरेगन के वास्को काउंटी स्थित एक फार्म पर रजनीशपुरम आश्रम के प्रमुख थे। संघीय एजेंटों ने 28 अक्टूबर 1985 को उत्तरी कैरोलिना के शार्लट में उन्हें उस समय गिरफ्तार किया जब वे और उनके सहयोगी आप्रवासन धोखाधड़ी (विदेशी अनुयायियों को अमेरिका में रहने देने के लिए बनावटी विवाह कराने) के 35-सूत्री संघीय अभियोग के बाद देश छोड़ने का प्रयास कर रहे थे। नवंबर 1985 में उन्होंने ओरेगन की अमेरिकी जिला अदालत में संघीय आप्रवासन-धोखाधड़ी के आरोपों में दोष स्वीकार किया; समझौते के तहत उन्होंने 4,00,000 डॉलर जुर्माना भरा, उन्हें निलंबित सज़ा मिली, और वे अमेरिका छोड़ गए, जिसके बाद बताया गया कि उन्हें पाँच वर्ष तक पुनः प्रवेश से रोका गया था। अलग से, अमेरिकी न्याय विभाग की 1986 की वार्षिक रिपोर्ट दर्ज करती है कि उनकी निजी सचिव मा आनंद शीला और एक नर्स प्रैक्टिशनर डायने ओनांग ने संघीय स्तर पर उपभोक्ता उत्पादों से छेड़छाड़ की साज़िश के आरोप में दोष स्वीकार किया, जब अनुयायियों ने सितंबर 1984 में साल्मोनेला जीवाणु तैयार कर ओरेगन के द डैलेस में सलाद बार दूषित कर दिए थे, जिससे 750 से अधिक लोग बीमार पड़े; दोनों को साढ़े चार वर्ष कारावास की सज़ा हुई। एक अलग संघीय टेलीफोन-अवरोधन साज़िश अभियोग में आश्रम के 21 सदस्यों के नाम थे, जिनमें से दस दोषी ठहराए गए। ओरेगन के महाधिवक्ता ने अलग से 1984 में मुकदमा दायर कर रजनीशपुरम शहर के निगमन को धर्म-स्थापना के रूप में असंवैधानिक घोषित करने की माँग की; अक्टूबर 1984 में एक संघीय अदालत ने माना कि राज्य की शिकायत एक वैध दावा प्रस्तुत करती है, और आश्रम के पतन के बाद शहर की स्थिति कायम नहीं रह सकी।
hi_reviewed: false

