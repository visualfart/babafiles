relationships:
  - to_id: droupadi-murmu
    type: visit
    period_start: 2026-03-20
    period_end: 2026-03-20
    description_en: >
      President Droupadi Murmu visited Radha Keli Kunj Ashram in Vrindavan on 20 March 2026, during a three-day Uttar Pradesh tour, and held a spiritual conversation with Premanand Maharaj during his birthday week.
    description_hi: >
      राष्ट्रपति द्रौपदी मुर्मू ने उत्तर प्रदेश के तीन-दिवसीय दौरे के दौरान 20 मार्च 2026 को वृंदावन के राधा केली कुंज आश्रम का दौरा किया और प्रेमानंद महाराज के जन्मदिवस सप्ताह में उनसे आध्यात्मिक बातचीत की।
    source_ids: [ pm-src-01, pm-src-02 ]
  - to_id: virat-kohli
    type: visit
    period_start: 2026-04
    period_end: 2026-07-22
    description_en: >
      Cricketer Virat Kohli and actor Anushka Sharma visited Premanand Maharaj at Radha Keli Kunj Ashram twice within three months in 2026: once in April after Royal Challengers Bengaluru's IPL title win, and again on 22 July 2026 after India's ODI series against England.
    description_hi: >
      क्रिकेटर विराट कोहली और अभिनेत्री अनुष्का शर्मा ने 2026 में तीन महीनों के भीतर दो बार राधा केली कुंज आश्रम जाकर प्रेमानंद महाराज से भेंट की: एक बार अप्रैल में रॉयल चैलेंजर्स बेंगलुरु की आईपीएल जीत के बाद, और दोबारा 22 जुलाई 2026 को भारत की इंग्लैंड के विरुद्ध वनडे शृंखला के बाद।
    source_ids: [ pm-src-03 ]
