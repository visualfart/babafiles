summary_en: >
  Premanand Ji Maharaj is a Vrindavan-based ascetic at the Shri Hit Radha Keli Kunj ashram, known for daily satsang sessions attended by large numbers of devotees, including public figures. A search of Indian Kanoon, of press reporting and of Uttar Pradesh police statements found no FIR, chargesheet, court case or official action naming him as an accused. He has instead twice been the target of publicised death threats on social media, in 2025, which police and courts have acted on against the persons making the threats; Mathura police have also issued public statements denying rumours about his health. He has separately drawn social-media criticism over remarks about young women and about being seen in expensive cars, which have not led to any official proceeding on the record.
summary_hi: >
  प्रेमानंद जी महाराज वृंदावन स्थित श्री हित राधा केली कुंज आश्रम के एक संत हैं, जो प्रतिदिन होने वाले सत्संग के लिए जाने जाते हैं, जिसमें बड़ी संख्या में अनुयायी और सार्वजनिक हस्तियाँ शामिल होती हैं। इंडियन कानून, प्रेस रिपोर्टिंग और उत्तर प्रदेश पुलिस के बयानों की खोज में उनके विरुद्ध अभियुक्त के रूप में कोई एफआईआर, आरोप-पत्र, अदालती मामला या आधिकारिक कार्रवाई नहीं मिली। इसके बजाय 2025 में सोशल मीडिया पर दो बार उन्हें मृत्यु की धमकियों का निशाना बनाया गया, जिन पर पुलिस और अदालतों ने धमकी देने वालों के विरुद्ध कार्रवाई की; मथुरा पुलिस ने उनके स्वास्थ्य को लेकर अफ़वाहों का खंडन करते हुए भी सार्वजनिक बयान जारी किए हैं। इसके अलावा युवतियों संबंधी टिप्पणियों और महँगी गाड़ियों में देखे जाने को लेकर उन्हें सोशल मीडिया पर आलोचना का सामना करना पड़ा है, जिससे रिकॉर्ड पर कोई आधिकारिक कार्यवाही नहीं हुई।
