    case_id: shiva-shankar-baba-sushil-hari-pocso-2021
    statement_en: In 2021 the CB-CID, Kancheepuram registered FIRs against Shiva Shankar Baba, including Crime Nos. 1 and 3 of 2021, alleging sexual abuse of students at the Sushil Hari International Residential School, Kelambakkam, under the IPC, the POCSO Act and the Tamil Nadu Prohibition of Harassment of Women Act.
    statement_hi: 2021 में कांचीपुरम सीबी-सीआईडी ने शिव शंकर बाबा के विरुद्ध एफआईआर दर्ज कीं, जिनमें क्राइम संख्या 1 और 3/2021 शामिल हैं, जो केलंबक्कम के सुशील हरि इंटरनेशनल रेजिडेंशियल स्कूल में छात्रों के यौन शोषण के आरोप में आईपीसी, पॉक्सो अधिनियम और तमिलनाडु महिला उत्पीड़न निवारण अधिनियम के तहत दर्ज हुई थीं।
    tier: under_investigation
    date: 2021-06
