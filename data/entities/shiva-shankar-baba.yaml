summary_en: >
  Shiva Sankaran, known as Shiva Shankar Baba, founder of the Sushil Hari International
  Residential School and the Sriramarajya Trust at Kelambakkam, Tamil Nadu, was named in
  multiple FIRs registered by the CB-CID, Kancheepuram in 2021 alleging sexual abuse of
  students at the school, after former students posted accounts on social media. He was
  arrested in June 2021 after allegedly absconding, and three chargesheets against him were
  taken on file as Special Sessions Cases before the Special Court for exclusive trial of
  POCSO Act cases at Chengalpattu. In October 2022 the Madras High Court quashed one of the
  FIRs against him; after the Tamil Nadu government moved the court and it emerged that a
  chargesheet had already been filed in that case, the High Court recalled its quashing order
  in November 2022. Trial in the Special Sessions Cases is on record as pending.
summary_hi: >
  शिव संकरन, जो शिव शंकर बाबा के नाम से जाने जाते हैं, तमिलनाडु के केलंबक्कम स्थित सुशील हरि
  इंटरनेशनल रेजिडेंशियल स्कूल और श्रीरामराज्य ट्रस्ट के संस्थापक हैं। पूर्व छात्रों द्वारा सोशल मीडिया
  पर अनुभव साझा किए जाने के बाद 2021 में कांचीपुरम सीबी-सीआईडी ने स्कूल में छात्रों के यौन शोषण के
  आरोप में उनके विरुद्ध कई एफआईआर दर्ज कीं। कथित रूप से फरार होने के बाद जून 2021 में उन्हें गिरफ्तार
  किया गया, और उनके विरुद्ध तीन आरोप-पत्र चेंगलपट्टु स्थित पॉक्सो अधिनियम के मामलों की विशेष अदालत में
  विशेष सत्र मामलों के रूप में दाखिल हुए। अक्टूबर 2022 में मद्रास उच्च न्यायालय ने उनके विरुद्ध एक
  एफआईआर रद्द कर दी; तमिलनाडु सरकार के अदालत में जाने और यह सामने आने पर कि उस मामले में आरोप-पत्र
  पहले ही दाखिल हो चुका था, उच्च न्यायालय ने नवंबर 2022 में अपना रद्दीकरण आदेश वापस ले लिया। विशेष सत्र
  मामलों में विचारण अभिलेख के अनुसार लंबित है।
hi_reviewed: false

