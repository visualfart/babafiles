cases:
  - id: shiva-shankar-baba-sushil-hari-pocso-2021
    title_en: State v. Shiva Sankaran alias Shiva Shankar Baba and others (Sushil Hari International Residential School, POCSO cases)
    title_hi: राज्य बनाम शिव संकरन उर्फ शिव शंकर बाबा एवं अन्य (सुशील हरि इंटरनेशनल रेजिडेंशियल स्कूल, पॉक्सो मामले)
    jurisdiction_country: IN
    jurisdiction_region: Tamil Nadu
    court: Special Court for exclusive trial of cases under the POCSO Act, Chengalpattu (trial); Madras High Court (interlocutory petitions)
    case_number: Crime Nos. 1, 3 and 10 of 2021, CB-CID Kancheepuram / Metro Wing-II; chargesheets taken on file as Special S.C. Nos. 69 to 71 of 2021
    filed_year: 2021
    case_type: criminal
    statutes: ["IPC", "POCSO Act 2012", "Tamil Nadu Prohibition of Harassment of Women Act 1998"]
    status: three chargesheets filed; trial pending in Special S.C. Nos. 69-71 of 2021; one FIR briefly quashed by the Madras High Court in October 2022 and recalled in November 2022
    tier: charged
    verdict_date:
    sentence_or_remedy:
    appeal_status: >
      No verdict is on record. As of the last verified reporting (November 2022), the case
      stood revived after the Madras High Court recalled its quashing order; no further
      confirmed update on the trial's progress was located.
    summary_en: >
      Former students of the Sushil Hari International Residential School at Kelambakkam,
      founded by Shiva Sankaran, known as Shiva Shankar Baba, posted allegations of sexual abuse
      on social media in mid-2021. The CB-CID, Kancheepuram registered FIRs against him,
      including Crime Nos. 1 and 3 of 2021, under the IPC, the POCSO Act and the Tamil Nadu
      Prohibition of Harassment of Women Act; most co-accused were granted anticipatory bail
      during January-August 2021. Shiva Shankar Baba was reported to have absconded once his
      case was transferred to the CB-CID; he was arrested in Delhi on 16 June 2021 and remanded
      to 15 days' judicial custody by a Chengalpattu magistrate the next day. On completion of
      investigation, three chargesheets were filed and taken on file as Special S.C. Nos. 69 to
      71 of 2021 before the Special Court for exclusive trial of POCSO Act cases, Chengalpattu.
      Separately, in a related search-warrant matter (Crime No.10 of 2021) the Madras High Court
      on 7 December 2021 dismissed his petition challenging a trial court order authorising a
      break-open search of the school and trust premises. On 17 October 2022 Justice R.N.
      Manjula of the Madras High Court quashed one of the FIRs against him on the ground of a
      "technical flaw"; after the Tamil Nadu government moved the court and it emerged that a
      chargesheet had already been filed in that matter, the High Court said on 4 November 2022
      that it would not have quashed the FIR had it known this, and formally recalled the
      quashing order on 21 November 2022.
    summary_hi: >
      केलंबक्कम स्थित सुशील हरि इंटरनेशनल रेजिडेंशियल स्कूल, जिसकी स्थापना शिव संकरन उर्फ शिव शंकर बाबा
      ने की थी, के पूर्व छात्रों ने 2021 के मध्य में सोशल मीडिया पर यौन शोषण के आरोप पोस्ट किए। कांचीपुरम
      सीबी-सीआईडी ने उनके विरुद्ध आईपीसी, पॉक्सो अधिनियम और तमिलनाडु महिला उत्पीड़न निवारण अधिनियम के
      तहत एफआईआर दर्ज कीं, जिनमें क्राइम संख्या 1 और 3/2021 शामिल हैं; अधिकांश सह-अभियुक्तों को जनवरी-अगस्त
      2021 के दौरान अग्रिम ज़मानत मिली। मामला सीबी-सीआईडी को स्थानांतरित होते ही शिव शंकर बाबा के फरार होने
      की खबर आई; उन्हें 16 जून 2021 को दिल्ली में गिरफ्तार किया गया और अगले दिन चेंगलपट्टु के मजिस्ट्रेट ने
      15 दिन की न्यायिक हिरासत में भेजा। जाँच पूरी होने पर तीन आरोप-पत्र दाखिल हुए और चेंगलपट्टु की पॉक्सो
      अधिनियम मामलों की विशेष अदालत में विशेष सत्र मामले संख्या 69 से 71/2021 के रूप में दर्ज हुए। इसके अलग
      एक संबंधित तलाशी-वारंट मामले (क्राइम संख्या 10/2021) में मद्रास उच्च न्यायालय ने 7 दिसंबर 2021 को
      स्कूल और ट्रस्ट परिसर की तलाशी हेतु विचारण अदालत के आदेश को चुनौती देने वाली उनकी याचिका खारिज की।
      17 अक्टूबर 2022 को मद्रास उच्च न्यायालय की न्यायमूर्ति आर.एन. मंजुला ने "तकनीकी त्रुटि" के आधार पर
      उनके विरुद्ध एक एफआईआर रद्द कर दी; तमिलनाडु सरकार के अदालत में जाने और यह सामने आने पर कि उस मामले
      में आरोप-पत्र पहले ही दाखिल हो चुका था, उच्च न्यायालय ने 4 नवंबर 2022 को कहा कि यदि उसे यह पता होता
      तो वह एफआईआर रद्द नहीं करता, और 21 नवंबर 2022 को औपचारिक रूप से रद्दीकरण आदेश वापस ले लिया।
    source_ids: [shivab-src-01, shivab-src-02, shivab-src-03, shivab-src-04, shivab-src-05]

claims:
