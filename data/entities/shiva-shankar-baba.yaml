    source_ids: [shivab-src-01]
  - id: shivab-claim-04
    case_id: shiva-shankar-baba-sushil-hari-pocso-2021
    statement_en: On 7 December 2021 the Madras High Court (Justice M. Nirmal Kumar), in CRL.O.P.No.23835 of 2021, dismissed Shiva Shankar Baba's petition to set aside a trial court order authorising the CB-CID to break open and search the school and trust premises in connection with Crime No.10 of 2021.
    statement_hi: 7 दिसंबर 2021 को मद्रास उच्च न्यायालय (न्यायमूर्ति एम. निर्मल कुमार) ने सीआरएल.ओ.पी. संख्या 23835/2021 में, क्राइम संख्या 10/2021 के सिलसिले में स्कूल और ट्रस्ट परिसर को तोड़कर तलाशी लेने की अनुमति देने वाले विचारण अदालत के आदेश को रद्द करने की शिव शंकर बाबा की याचिका खारिज कर दी।
