    statement_hi: शिव शंकर बाबा को 16 जून 2021 को दिल्ली में सीबी-सीआईडी ने गिरफ्तार किया, यह आरोप था कि मामला चेन्नई पुलिस से स्थानांतरित होते ही वे फरार हो गए थे; 17 जून 2021 को चेंगलपट्टु के मजिस्ट्रेट ने उन्हें 15 दिन की न्यायिक हिरासत में भेजा।
