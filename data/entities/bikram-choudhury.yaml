summary_en: >
  Bikram Choudhury, a Kolkata-born yoga teacher who moved to California in 1971 and built a global "hot yoga" franchise, was sued by his former head of legal affairs, Minakshi Jafa-Bodden, for gender discrimination, wrongful termination and sexual harassment. On 25 January 2016 a Los Angeles County Superior Court jury awarded her about $924,500 in compensatory damages, finding that Choudhury had acted with malice, oppression and fraud, and on 26 January 2016 the same jury awarded a further $6.4 million in punitive damages, for a total of roughly $7.4 million. Six other women had separately sued Choudhury in the same years alleging sexual assault or harassment; the Los Angeles County district attorney's office had earlier declined to file criminal charges over several of the same allegations, citing insufficient corroborating evidence. About sixteen months after the Jafa-Bodden verdict a California court issued a warrant for Choudhury's arrest over his failure to pay the judgment; he left the United States and has continued to lead yoga teacher trainings in India, Thailand and Mexico. His company, Bikram's Yoga College of India, L.P., filed for Chapter 11 bankruptcy protection in the US Bankruptcy Court for the Central District of California on 9 November 2017; the bankruptcy docket lists Jafa-Bodden and at least one other plaintiff, Petra Starke Smeltzer, as judgment creditors. At trial Choudhury denied the sexual-assault allegations under oath.
summary_hi: >
  बिक्रम चौधरी, कोलकाता में जन्मे एक योग शिक्षक, 1971 में कैलिफ़ोर्निया आ गए और उन्होंने "हॉट योगा" का एक वैश्विक फ्रैंचाइज़ी व्यवसाय खड़ा किया। उनकी पूर्व विधि प्रमुख मिनाक्षी जाफ़ा-बोडेन ने उन पर लैंगिक भेदभाव, गलत तरीके से नौकरी से निकालने और यौन उत्पीड़न का आरोप लगाते हुए मुकदमा दायर किया। 25 जनवरी 2016 को लॉस एंजिल्स काउंटी सुपीरियर कोर्ट की जूरी ने उन्हें लगभग 9,24,500 डॉलर का प्रतिकर हर्जाना देने का निर्णय दिया, यह पाते हुए कि चौधरी ने द्वेष, उत्पीड़न और धोखाधड़ी के साथ काम किया; 26 जनवरी 2016 को उसी जूरी ने आगे 64 लाख डॉलर का दंडात्मक हर्जाना दिया, यानी कुल लगभग 74 लाख डॉलर। इन्हीं वर्षों में छह अन्य महिलाओं ने भी चौधरी पर अलग से यौन उत्पीड़न या हमले का आरोप लगाते हुए मुकदमे दायर किए थे; लॉस एंजिल्स काउंटी के ज़िला अभियोजक कार्यालय ने पहले ही इनमें से कई आरोपों पर पर्याप्त पुष्टिकारी साक्ष्य न होने का हवाला देते हुए आपराधिक आरोप दायर करने से इनकार कर दिया था। जाफ़ा-बोडेन के फ़ैसले के लगभग सोलह महीने बाद कैलिफ़ोर्निया की एक अदालत ने निर्णय राशि न चुकाने पर चौधरी की गिरफ़्तारी का वारंट जारी किया; वे अमेरिका छोड़ गए और तब से भारत, थाईलैंड और मेक्सिको में योग शिक्षक प्रशिक्षण चला रहे हैं। उनकी कंपनी, बिक्रम्स योगा कॉलेज ऑफ़ इंडिया, एल.पी. ने 9 नवंबर 2017 को कैलिफ़ोर्निया के मध्य ज़िले की अमेरिकी दिवालिया अदालत में चैप्टर 11 दिवालियापन संरक्षण के लिए आवेदन दायर किया; दिवालियापन दस्तावेज़ में जाफ़ा-बोडेन और कम से कम एक अन्य वादी, पेट्रा स्टार्क स्मेल्ट्ज़र, को निर्णय-लेनदार के रूप में सूचीबद्ध किया गया है। मुकदमे के दौरान चौधरी ने शपथ के तहत यौन उत्पीड़न के आरोपों से इनकार किया।
hi_reviewed: false
response_from_subject:
  text_en: >
    Testifying at the Jafa-Bodden trial, Choudhury strongly denied sexually assaulting the women who had accused him: "I don't do that. I don't have to." His attorneys argued that Jafa-Bodden had been let go because she was not licensed to practice law in the United States.
  text_hi: >
    जाफ़ा-बोडेन के मुकदमे में गवाही देते हुए चौधरी ने उन महिलाओं पर यौन हमले के आरोपों से दृढ़ता से इनकार किया जिन्होंने उन पर आरोप लगाया था: "मैं ऐसा नहीं करता। मुझे ज़रूरत ही नहीं है।" उनके वकीलों ने तर्क दिया कि जाफ़ा-बोडेन को इसलिए निकाला गया क्योंकि उनके पास अमेरिका में विधि व्यवसाय करने का लाइसेंस नहीं था।
  source_id: bikram-src-01

