cases:
  - id: bikram-jafa-bodden-v-choudhury-2016
    title_en: Jafa-Bodden v. Choudhury (gender discrimination, wrongful termination, sexual harassment)
    title_hi: जाफ़ा-बोडेन बनाम चौधरी (लैंगिक भेदभाव, गलत तरीके से नौकरी से निकालना, यौन उत्पीड़न)
    jurisdiction_country: US
    jurisdiction_region: California
    court: Superior Court of California, County of Los Angeles
    case_number: Not located (widely reported as filed 2013)
    filed_year: 2013
    case_type: civil
    statutes: [ California Fair Employment and Housing Act, Wrongful termination in violation of public policy ]
    status: Jury verdict for plaintiff; compensatory and punitive damages awarded
    tier: civil_judgment
    verdict_date: 2016-01-26
    sentence_or_remedy: "$924,500 compensatory damages (25 January 2016) plus $6.4 million punitive damages (26 January 2016); total approximately $7.4 million"
    appeal_status: Not located
    summary_en: >
      Minakshi Jafa-Bodden, an Indian lawyer whom Choudhury had persuaded to move to California in 2011 to work as his general counsel, sued him alleging that he sexually harassed her, subjected her to obscene and discriminatory comments about women and minorities, and fired her in 2013 after she began investigating other employees' allegations of sexual harassment and misconduct, including a rape claim by one of his yoga students. A Los Angeles County Superior Court jury deliberated for about a day before finding unanimously for Jafa-Bodden. On 25 January 2016 it awarded about $924,500 in compensatory damages, finding that Choudhury had acted with malice, oppression and fraud; on 26 January 2016, after a further day of testimony in which Choudhury said his business had left him "nearly bankrupt" while acknowledging he kept a fleet of up to 40 luxury cars, the jury awarded a further $6.4 million in punitive damages. Choudhury denied the allegations at trial. He did not pay the judgment, and the US Bankruptcy Court docket for his company later listed Jafa-Bodden as a judgment and secured creditor.
    summary_hi: >
      मिनाक्षी जाफ़ा-बोडेन, एक भारतीय वकील जिन्हें चौधरी ने 2011 में कैलिफ़ोर्निया आकर उनके लिए महाविधि अधिकारी (जनरल काउंसल) के रूप में काम करने हेतु राज़ी किया था, ने उन पर मुकदमा दायर कर आरोप लगाया कि उन्होंने उनका यौन उत्पीड़न किया, महिलाओं और अल्पसंख्यकों के बारे में अश्लील व भेदभावपूर्ण टिप्पणियों का शिकार बनाया, और 2013 में उन्हें तब निकाल दिया जब वे अन्य कर्मचारियों की यौन उत्पीड़न व दुर्व्यवहार संबंधी शिकायतों की जाँच करने लगीं, जिसमें उनकी एक योग छात्रा का बलात्कार का आरोप भी शामिल था। लॉस एंजिल्स काउंटी सुपीरियर कोर्ट की जूरी ने लगभग एक दिन विचार-विमर्श के बाद सर्वसम्मति से जाफ़ा-बोडेन के पक्ष में निर्णय दिया। 25 जनवरी 2016 को उसने लगभग 9,24,500 डॉलर का प्रतिकर हर्जाना देने का निर्णय दिया, यह पाते हुए कि चौधरी ने द्वेष, उत्पीड़न और धोखाधड़ी के साथ काम किया; 26 जनवरी 2016 को, और एक दिन की गवाही के बाद जिसमें चौधरी ने कहा कि उनका व्यवसाय उन्हें "लगभग दिवालिया" कर चुका है जबकि उन्होंने 40 तक लक्ज़री कारों का बेड़ा रखना स्वीकार किया, जूरी ने आगे 64 लाख डॉलर का दंडात्मक हर्जाना दिया। चौधरी ने मुकदमे में आरोपों से इनकार किया। उन्होंने निर्णय राशि नहीं चुकाई, और उनकी कंपनी के अमेरिकी दिवालिया अदालत दस्तावेज़ में बाद में जाफ़ा-बोडेन को निर्णय-लेनदार व सुरक्षित लेनदार के रूप में सूचीबद्ध किया गया।
    source_ids: [ bikram-src-01, bikram-src-02, bikram-src-04 ]

  - id: bikram-yoga-college-bankruptcy-2017
    title_en: In re Bikram's Yoga College of India, L.P. (Chapter 11)
    title_hi: बिक्रम्स योगा कॉलेज ऑफ़ इंडिया, एल.पी. का मामला (चैप्टर 11 दिवालियापन)
    jurisdiction_country: US
    jurisdiction_region: California
    court: United States Bankruptcy Court, Central District of California
    case_number: 9:17-bk-12045
    filed_year: 2017
    case_type: civil
    statutes: [ US Bankruptcy Code Chapter 11 ]
    status: Chapter 11 petition filed; case terminated
    tier: closed
    verdict_date: 2023-06-26
    sentence_or_remedy: Reorganisation proceeding; a Chapter 11 trustee (Robbin L. Itkin) was appointed and negotiated a compromise with judgment creditor Minakshi Jafa-Bodden, opposed by judgment creditor Petra Starke Smeltzer
    appeal_status: Not applicable
    summary_en: >
      Bikram's Yoga College of India, L.P. filed a Chapter 11 bankruptcy petition in the US Bankruptcy Court for the Central District of California on 9 November 2017, after Choudhury failed to pay the Jafa-Bodden judgment and a warrant was issued for his arrest. The court's docket records a Chapter 11 trustee's motion to approve a compromise between the estate and "Secured Creditor Minakshi Jafa-Bodden", opposed by another creditor, "Judgment Creditor Petra Starke Smeltzer". The case was terminated on 26 June 2023.
    summary_hi: >
      बिक्रम्स योगा कॉलेज ऑफ़ इंडिया, एल.पी. ने 9 नवंबर 2017 को कैलिफ़ोर्निया के मध्य ज़िले की अमेरिकी दिवालिया अदालत में चैप्टर 11 दिवालियापन आवेदन दायर किया, जब चौधरी ने जाफ़ा-बोडेन की निर्णय राशि नहीं चुकाई और उनकी गिरफ़्तारी का वारंट जारी हुआ। अदालत के दस्तावेज़ में एक चैप्टर 11 ट्रस्टी के उस आवेदन का उल्लेख है जिसमें संपदा और "सुरक्षित लेनदार मिनाक्षी जाफ़ा-बोडेन" के बीच समझौते को मंज़ूरी माँगी गई थी, जिसका एक अन्य लेनदार "निर्णय-लेनदार पेट्रा स्टार्क स्मेल्ट्ज़र" ने विरोध किया। मामला 26 जून 2023 को समाप्त हुआ।
    source_ids: [ bikram-src-04, bikram-src-03 ]

