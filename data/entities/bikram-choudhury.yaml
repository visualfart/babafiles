  - id: bikram-claim-04
    statement_en: Six other women filed separate civil lawsuits against Choudhury in the years before the Jafa-Bodden verdict alleging sexual assault or harassment; the Los Angeles Times reported that one had reached a conditional settlement by January 2016 and that the remaining five suits were then still pending, and Yoga Journal later reported that at least three of the lawsuits were eventually settled out of court while the rest were left pending after Choudhury left the country.
    statement_hi: जाफ़ा-बोडेन के फ़ैसले से पहले के वर्षों में छह अन्य महिलाओं ने चौधरी पर यौन हमले या उत्पीड़न का आरोप लगाते हुए अलग-अलग सिविल मुकदमे दायर किए; लॉस एंजिल्स टाइम्स ने बताया कि जनवरी 2016 तक इनमें से एक का सशर्त समझौता हो चुका था और शेष पाँच मुकदमे तब भी लंबित थे, और योगा जर्नल ने बाद में बताया कि इनमें से कम से कम तीन मुकदमों का अंततः अदालत के बाहर समझौता हुआ जबकि शेष चौधरी के देश छोड़ने के बाद लंबित रह गए।
    tier: allegation
    date: 2016-01
    source_ids: [ bikram-src-02, bikram-src-03 ]

