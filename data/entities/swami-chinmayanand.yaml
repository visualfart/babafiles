cases:
  - id: swami-chinmayanand-2019-law-student
    title_en: State v. Swami Chinmayanand (2019 sexual exploitation case, law student)
    title_hi: राज्य बनाम स्वामी चिन्मयानंद (2019 यौन शोषण मामला, विधि छात्रा)
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court: Special MP/MLA Court, Shahjahanpur (trial); Allahabad High Court (bail)
    case_number: FIR registered at Kotwali police station, Shahjahanpur, 27 August 2019; crime number not stated in sources located
    filed_year: 2019
    case_type: criminal
    statutes: [ IPC 342, IPC 354D, IPC 376-C, IPC 506 ]
    status: acquitted
    tier: acquitted
    verdict_date: 2021-03-26
    sentence_or_remedy: Acquitted of all charges
    appeal_status: No state appeal located
    summary_en: >
      A law student at Chinmayanand's Shahjahanpur college accused him in a video posted online on 23 August 2019 of a year of sexual exploitation, filming her without consent and blackmail; her father's complaint led to an FIR on 27 August 2019. The Supreme Court took suo motu notice, ordered a Special Investigation Team and security for the complainant's family, and Chinmayanand was arrested on 20 September 2019 and held in judicial custody. The Allahabad High Court granted him bail on 3 February 2020, with the bench questioning why the complainant had not confided in her family. On 26 March 2021 a special court at Shahjahanpur, Special Judge P.K. Rai, acquitted Chinmayanand of all charges, holding the prosecution had not proved its case beyond reasonable doubt after the complainant turned hostile during trial.
    summary_hi: >
      शाहजहाँपुर स्थित चिन्मयानंद के महाविद्यालय की एक विधि छात्रा ने 23 अगस्त 2019 को ऑनलाइन डाले गए एक वीडियो में एक वर्ष तक यौन शोषण, बिना सहमति वीडियो बनाने और ब्लैकमेल का आरोप लगाया; उसके पिता की शिकायत पर 27 अगस्त 2019 को प्राथमिकी दर्ज हुई। सर्वोच्च न्यायालय ने स्वतः संज्ञान लिया, एक विशेष जाँच दल तथा शिकायतकर्ता के परिवार को सुरक्षा देने का आदेश दिया, और 20 सितंबर 2019 को चिन्मयानंद को गिरफ़्तार कर न्यायिक हिरासत में भेजा गया। इलाहाबाद उच्च न्यायालय ने 3 फ़रवरी 2020 को उन्हें ज़मानत दी, जिसमें पीठ ने यह सवाल उठाया कि शिकायतकर्ता ने अपने परिवार को क्यों नहीं बताया। 26 मार्च 2021 को शाहजहाँपुर की विशेष अदालत के विशेष न्यायाधीश पी.के. राय ने चिन्मयानंद को सभी आरोपों से बरी कर दिया, यह मानते हुए कि विचारण के दौरान शिकायतकर्ता के मुकर जाने पर अभियोजन मामले को संदेह से परे सिद्ध नहीं कर सका।
    source_ids: [ swami-chinmayanand-src-01, swami-chinmayanand-src-02, swami-chinmayanand-src-03, swami-chinmayanand-src-04 ]

  - id: swami-chinmayanand-2011-disciple
    title_en: State v. Swami Chinmayanand (2011 rape case, disciple)
    title_hi: राज्य बनाम स्वामी चिन्मयानंद (2011 बलात्कार मामला, अनुयायी)
    jurisdiction_country: IN
    jurisdiction_region: Uttar Pradesh
    court: Special MP/MLA Court, Shahjahanpur (trial); Allahabad High Court (withdrawal challenge, bail)
    case_number: FIR registered at Kotwali police station, Shahjahanpur, November 2011; High Court case numbers not stated in sources located
    filed_year: 2011
    case_type: criminal
    statutes: [ IPC 376, IPC 506 ]
    status: acquitted
    tier: acquitted
    verdict_date: 2024-02-01
    sentence_or_remedy: Acquitted for lack of evidence
    appeal_status: No state appeal located
    summary_en: >
      A woman who had lived at Chinmayanand's ashram accused him of establishing a physical relationship by force, administering intoxicants, taking obscene images and forcing two abortions; a chargesheet under IPC 376 and 506 followed, and the Chief Judicial Magistrate, Shahjahanpur, took cognizance in December 2011. Chinmayanand's own petition led the High Court to stay the proceedings from December 2012. In February 2018 he withdrew that petition, vacating the stay; within days the Uttar Pradesh government directed the Shahjahanpur District Magistrate to have the prosecution withdrawn, and the Senior Public Prosecutor applied to do so on 12 March 2018. The Chief Judicial Magistrate rejected the withdrawal application after the complainant objected, and a bailable warrant was issued against Chinmayanand. He challenged the rejection up to the High Court and Supreme Court without success, and the Allahabad High Court, on 30 September 2022, upheld the trial court's rejection, criticising the state's prosecutor for having "not even mentioned on which material he has applied his own independent mind." Chinmayanand was granted anticipatory bail in the case on 19 December 2022, and on 1 February 2024 the Shahjahanpur MP-MLA court, Additional District Judge Ehsan Hussain, acquitted him for lack of evidence after six prosecution witnesses were examined.
    summary_hi: >
      चिन्मयानंद के आश्रम में रह चुकी एक महिला ने आरोप लगाया कि उन्होंने बलपूर्वक शारीरिक संबंध बनाए, नशीला पदार्थ दिया, अश्लील तस्वीरें लीं और दो बार गर्भपात कराया; इस पर आईपीसी 376 और 506 के तहत आरोप-पत्र दाख़िल हुआ, और शाहजहाँपुर के मुख्य न्यायिक मजिस्ट्रेट ने दिसंबर 2011 में संज्ञान लिया। चिन्मयानंद की अपनी याचिका पर उच्च न्यायालय ने दिसंबर 2012 से कार्यवाही पर रोक लगा दी। फ़रवरी 2018 में उन्होंने वह याचिका वापस ले ली, जिससे रोक समाप्त हो गई; कुछ ही दिनों में उत्तर प्रदेश सरकार ने शाहजहाँपुर के ज़िलाधिकारी को अभियोजन वापस लेने का निर्देश दिया, और वरिष्ठ लोक अभियोजक ने 12 मार्च 2018 को इसके लिए आवेदन किया। शिकायतकर्ता की आपत्ति पर मुख्य न्यायिक मजिस्ट्रेट ने वापसी की अर्ज़ी ख़ारिज कर दी, और चिन्मयानंद के विरुद्ध ज़मानती वारंट जारी हुआ। उन्होंने इस ख़ारिज़गी को उच्च न्यायालय और सर्वोच्च न्यायालय तक चुनौती दी परंतु सफल नहीं हुए, और इलाहाबाद उच्च न्यायालय ने 30 सितंबर 2022 को विचारण न्यायालय की ख़ारिज़गी को बरक़रार रखते हुए राज्य के अभियोजक की आलोचना की कि उसने "यह तक नहीं बताया कि उसने किस सामग्री पर अपना स्वतंत्र मस्तिष्क लगाया।" चिन्मयानंद को 19 दिसंबर 2022 को इस मामले में अग्रिम ज़मानत मिली, और 1 फ़रवरी 2024 को शाहजहाँपुर की एमपी-एमएलए अदालत के अतिरिक्त ज़िला न्यायाधीश एहसान हुसैन ने छह अभियोजन गवाहों की परीक्षा के बाद साक्ष्य के अभाव में उन्हें बरी कर दिया।
    source_ids: [ swami-chinmayanand-src-05, swami-chinmayanand-src-06 ]

claims:
  - id: swami-chinmayanand-claim-01
    case_id: swami-chinmayanand-2019-law-student
    statement_en: Following a Supreme Court suo motu order for a Special Investigation Team, Swami Chinmayanand was arrested on 20 September 2019 from his Mumuksha Ashram in Shahjahanpur and remanded to judicial custody on charges including wrongful confinement, stalking and criminal intimidation.
    statement_hi: सर्वोच्च न्यायालय द्वारा स्वतः संज्ञान लेकर विशेष जाँच दल गठित करने के आदेश के बाद, 20 सितंबर 2019 को स्वामी चिन्मयानंद को शाहजहाँपुर स्थित उनके मुमुक्षा आश्रम से गिरफ़्तार कर गलत तरीक़े से बंधक बनाने, पीछा करने और आपराधिक धमकी सहित आरोपों में न्यायिक हिरासत में भेजा गया।
    tier: acquitted
    date: 2019-09-20
    source_ids: [ swami-chinmayanand-src-01 ]
  - id: swami-chinmayanand-claim-02
    case_id: swami-chinmayanand-2019-law-student
    statement_en: On 3 February 2020 the Allahabad High Court granted Chinmayanand bail, about five months after his arrest, and directed day-to-day hearing of the trial then underway at the Shahjahanpur district court.
    statement_hi: 3 फ़रवरी 2020 को इलाहाबाद उच्च न्यायालय ने चिन्मयानंद को, उनकी गिरफ़्तारी के लगभग पाँच माह बाद, ज़मानत दी और शाहजहाँपुर की ज़िला अदालत में चल रहे विचारण की दैनिक सुनवाई का निर्देश दिया।
    tier: acquitted
    date: 2020-02-03
    source_ids: [ swami-chinmayanand-src-02 ]
  - id: swami-chinmayanand-claim-03
    case_id: swami-chinmayanand-2019-law-student
    statement_en: On 26 March 2021 Special Judge P.K. Rai of the special court at Shahjahanpur acquitted Chinmayanand of all charges in the law student's case, holding the prosecution had failed to prove its case beyond reasonable doubt after the complainant turned hostile during the trial.
    statement_hi: 26 मार्च 2021 को शाहजहाँपुर की विशेष अदालत के विशेष न्यायाधीश पी.के. राय ने विधि छात्रा के मामले में चिन्मयानंद को सभी आरोपों से बरी कर दिया, यह मानते हुए कि विचारण के दौरान शिकायतकर्ता के मुकर जाने पर अभियोजन मामला संदेह से परे सिद्ध नहीं कर सका।
    tier: acquitted
    date: 2021-03-26
    source_ids: [ swami-chinmayanand-src-03, swami-chinmayanand-src-04 ]
  - id: swami-chinmayanand-claim-04
    case_id: swami-chinmayanand-2019-law-student
    statement_en: The same court, on the same day, acquitted the law student and two associates of an extortion charge filed against them by advocate Om Singh on Chinmayanand's behalf, which had accused them of demanding Rs 5 crore by threatening to release video recordings; the court cited lack of evidence and hostile witnesses.
    statement_hi: उसी अदालत ने उसी दिन विधि छात्रा और उसके दो साथियों को, चिन्मयानंद की ओर से अधिवक्ता ओम सिंह द्वारा दर्ज कराए गए जबरन वसूली के आरोप से बरी कर दिया, जिसमें वीडियो रिकॉर्डिंग जारी करने की धमकी देकर 5 करोड़ रुपये माँगने का आरोप था; अदालत ने साक्ष्य के अभाव और गवाहों के मुकर जाने का हवाला दिया।
    tier: acquitted
    date: 2021-03-26
    source_ids: [ swami-chinmayanand-src-03 ]
  - id: swami-chinmayanand-claim-05
    case_id: swami-chinmayanand-2011-disciple
    statement_en: A woman formerly at Chinmayanand's ashram accused him in a complaint of November 2011 of rape, administering intoxicants, taking obscene photographs and forcing two abortions; a chargesheet under IPC 376 and 506 was filed and the Chief Judicial Magistrate, Shahjahanpur, took cognizance in December 2011.
    statement_hi: चिन्मयानंद के आश्रम में पूर्व में रह चुकी एक महिला ने नवंबर 2011 की शिकायत में उन पर बलात्कार, नशीला पदार्थ देने, अश्लील तस्वीरें लेने और दो बार जबरन गर्भपात कराने का आरोप लगाया; आईपीसी 376 और 506 के तहत आरोप-पत्र दाख़िल हुआ और शाहजहाँपुर के मुख्य न्यायिक मजिस्ट्रेट ने दिसंबर 2011 में संज्ञान लिया।
    tier: acquitted
    date: 2011-11
    source_ids: [ swami-chinmayanand-src-05 ]
  - id: swami-chinmayanand-claim-06
    case_id: swami-chinmayanand-2011-disciple
    statement_en: After Chinmayanand withdrew his own stay petition in February 2018, the Uttar Pradesh government directed the Shahjahanpur Public Prosecutor to seek withdrawal of the prosecution; the Chief Judicial Magistrate rejected the withdrawal application, and on 30 September 2022 the Allahabad High Court (Rahul Chaturvedi J) upheld that rejection, criticising the state's Senior Public Prosecutor for having "danced to the tune" of the government without independently applying his mind.
    statement_hi: फ़रवरी 2018 में चिन्मयानंद द्वारा स्वयं अपनी रोक याचिका वापस लेने के बाद, उत्तर प्रदेश सरकार ने शाहजहाँपुर के लोक अभियोजक को अभियोजन वापस लेने का निर्देश दिया; मुख्य न्यायिक मजिस्ट्रेट ने वापसी की अर्ज़ी ख़ारिज कर दी, और 30 सितंबर 2022 को इलाहाबाद उच्च न्यायालय (न्यायमूर्ति राहुल चतुर्वेदी) ने उस ख़ारिज़गी को बरक़रार रखते हुए राज्य के वरिष्ठ लोक अभियोजक की आलोचना की कि उसने स्वतंत्र रूप से विचार किए बिना सरकार के "इशारे पर नाचा"।
    tier: acquitted
    date: 2022-09-30
    source_ids: [ swami-chinmayanand-src-05 ]
  - id: swami-chinmayanand-claim-07
    case_id: swami-chinmayanand-2011-disciple
    statement_en: The Allahabad High Court granted Chinmayanand anticipatory bail in the 2011 case on 19 December 2022.
    statement_hi: इलाहाबाद उच्च न्यायालय ने 19 दिसंबर 2022 को 2011 के मामले में चिन्मयानंद को अग्रिम ज़मानत दी।
    tier: acquitted
    date: 2022-12-19
    source_ids: [ swami-chinmayanand-src-06 ]
  - id: swami-chinmayanand-claim-08
    case_id: swami-chinmayanand-2011-disciple
    statement_en: On 1 February 2024 Additional District Judge Ehsan Hussain of the Shahjahanpur MP-MLA court acquitted Chinmayanand in the 2011 case for lack of evidence, after six prosecution witnesses were examined.
    statement_hi: 1 फ़रवरी 2024 को शाहजहाँपुर की एमपी-एमएलए अदालत के अतिरिक्त ज़िला न्यायाधीश एहसान हुसैन ने छह अभियोजन गवाहों की परीक्षा के बाद साक्ष्य के अभाव में चिन्मयानंद को 2011 के मामले में बरी कर दिया।
    tier: acquitted
    date: 2024-02-01
    source_ids: [ swami-chinmayanand-src-06 ]

