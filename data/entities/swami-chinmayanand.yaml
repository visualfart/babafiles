summary_en: >
  Swami Chinmayanand, a former Union Minister of State for Home and three-time BJP member of parliament from Uttar Pradesh, ran the Mumukshu Ashram and its affiliated law college in Shahjahanpur. He faced two separate rape prosecutions arising from complaints by women associated with his institutions, both of which ended in his acquittal. In the more recent case, a law student at his college accused him in August 2019 of a year of sexual exploitation and blackmail; the Supreme Court took suo motu notice, a Special Investigation Team was formed, and he was arrested on 20 September 2019. The Allahabad High Court granted him bail in February 2020, and on 26 March 2021 a special court at Shahjahanpur acquitted him of all charges after the complainant turned hostile and the prosecution could not prove the case beyond reasonable doubt; a linked extortion case filed against the complainant and two associates on his side ended the same day in their acquittal for lack of evidence. In the older matter, a woman disciple's November 2011 complaint led to a rape chargesheet on which the Chief Judicial Magistrate, Shahjahanpur, took cognizance; proceedings were stayed by the High Court from 2012. After Chinmayanand withdrew his own stay petition in 2018, the Uttar Pradesh government moved to withdraw the prosecution altogether, but the withdrawal application was rejected by the trial court and, on the state's challenge, the rejection was upheld by the Allahabad High Court in September 2022, which criticised the state's reasoning. Chinmayanand was granted anticipatory bail in that case in December 2022, and the Shahjahanpur court acquitted him on 1 February 2024 for lack of evidence.
summary_hi: >
  स्वामी चिन्मयानंद, जो पूर्व केंद्रीय गृह राज्य मंत्री और उत्तर प्रदेश से तीन बार भाजपा सांसद रह चुके हैं, शाहजहाँपुर में मुमुक्षु आश्रम और उससे संबद्ध विधि महाविद्यालय संचालित करते थे। उन्हें अपनी संस्थाओं से जुड़ी महिलाओं की शिकायतों पर दो अलग-अलग बलात्कार के मुक़दमों का सामना करना पड़ा, जो दोनों उनकी दोषमुक्ति में समाप्त हुए। हाल के मामले में, उनके महाविद्यालय की एक विधि छात्रा ने अगस्त 2019 में एक वर्ष तक यौन शोषण और ब्लैकमेल का आरोप लगाया; सर्वोच्च न्यायालय ने स्वतः संज्ञान लिया, एक विशेष जाँच दल गठित हुआ, और 20 सितंबर 2019 को उन्हें गिरफ़्तार किया गया। इलाहाबाद उच्च न्यायालय ने फ़रवरी 2020 में उन्हें ज़मानत दी, और 26 मार्च 2021 को शाहजहाँपुर की एक विशेष अदालत ने शिकायतकर्ता के मुकर जाने और अभियोजन द्वारा मामला संदेह से परे सिद्ध न कर पाने पर उन्हें सभी आरोपों से बरी कर दिया; उनकी ओर से शिकायतकर्ता और उसके दो साथियों के विरुद्ध दर्ज कराए गए एक संबद्ध जबरन वसूली के मामले में भी उसी दिन साक्ष्य के अभाव में उन्हें बरी किया गया। पुराने मामले में, एक महिला अनुयायी की नवंबर 2011 की शिकायत पर बलात्कार का आरोप-पत्र दाख़िल हुआ जिस पर शाहजहाँपुर के मुख्य न्यायिक मजिस्ट्रेट ने संज्ञान लिया; 2012 से उच्च न्यायालय ने कार्यवाही पर रोक लगा दी थी। 2018 में चिन्मयानंद द्वारा स्वयं अपनी रोक याचिका वापस लेने के बाद, उत्तर प्रदेश सरकार ने अभियोजन को पूरी तरह वापस लेने का प्रयास किया, परंतु वापसी की अर्ज़ी विचारण न्यायालय ने ख़ारिज कर दी और राज्य की चुनौती पर सितंबर 2022 में इलाहाबाद उच्च न्यायालय ने भी उस ख़ारिज़गी को बरक़रार रखा तथा राज्य के तर्क की आलोचना की। दिसंबर 2022 में चिन्मयानंद को उस मामले में अग्रिम ज़मानत मिली, और 1 फ़रवरी 2024 को शाहजहाँपुर की अदालत ने साक्ष्य के अभाव में उन्हें बरी कर दिया।
