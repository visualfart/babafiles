response_from_subject:
  text_en: >
    Chinmayanand's side maintained the law student's allegations were fabricated: an advocate acting for him, Om Singh, lodged a counter-FIR on 25 August 2019 accusing the student and two associates of trying to extort Rs 5 crore from him by threatening to release "obscene video clips" she had recorded, a position the trial court effectively credited when it acquitted Chinmayanand on 26 March 2021 and, the same day, acquitted the three extortion accused for lack of evidence and hostile witnesses.
  text_hi: >
    चिन्मयानंद पक्ष का कहना था कि विधि छात्रा के आरोप मनगढ़ंत थे: उनकी ओर से अधिवक्ता ओम सिंह ने 25 अगस्त 2019 को एक जवाबी प्राथमिकी दर्ज कराई जिसमें छात्रा और उसके दो साथियों पर उसके द्वारा रिकॉर्ड किए गए "अश्लील वीडियो क्लिप" जारी करने की धमकी देकर 5 करोड़ रुपये की जबरन वसूली की कोशिश का आरोप लगाया गया; विचारण अदालत ने 26 मार्च 2021 को चिन्मयानंद को बरी करते हुए और उसी दिन साक्ष्य के अभाव तथा गवाहों के मुकर जाने पर तीनों वसूली अभियुक्तों को बरी करते हुए प्रभावी रूप से इसी रुख़ को मान्यता दी।
  source_id: swami-chinmayanand-src-02

