relationships:
  - to_id: bharatiya-janata-party
    type: shared_stage
    period_start: 2024-04-30
    period_end: 2024-05-30
    description_en: >
      The Indian Express reported on 31 May 2024 that during the Lok Sabha campaign in Punjab the BJP's Gurdaspur candidate Dinesh Singh Babbu left his own campaign to attend a congregation of Bajinder Singh in Chandigarh, and that Thomas Masih, the BJP Minority Morcha's Punjab president, sought votes for Babbu from Bajinder Singh's stage. The paper also reported that the BJP's Amritsar candidate Taranjit Singh Sandhu attended a Bajinder Singh congregation at Ajnala on 30 April 2024, and that BJP Ajnala leader and former MLA Amarpal Singh Boni later issued a clarification after a statement he made about the Sikh religion at Bajinder Singh's "Amritsar Crusade" event.
    description_hi: >
      द इंडियन एक्सप्रेस ने 31 मई 2024 को बताया कि पंजाब में लोकसभा चुनाव प्रचार के दौरान भाजपा के गुरदासपुर उम्मीदवार दिनेश सिंह बब्बू अपना प्रचार छोड़कर चंडीगढ़ में बजिंदर सिंह की सभा में शामिल हुए, और भाजपा अल्पसंख्यक मोर्चा के पंजाब अध्यक्ष थॉमस मसीह ने बजिंदर सिंह के मंच से बब्बू के लिए वोट माँगे। अख़बार ने यह भी बताया कि भाजपा के अमृतसर उम्मीदवार तरनजीत सिंह संधू 30 अप्रैल 2024 को अजनाला में बजिंदर सिंह की सभा में गए, और भाजपा के अजनाला नेता एवं पूर्व विधायक अमरपाल सिंह बोनी ने बजिंदर सिंह के "अमृतसर क्रूसेड" कार्यक्रम में सिख धर्म पर दिए बयान के बाद स्पष्टीकरण जारी किया।
    source_ids: [ bajinder-singh-src-17, bajinder-singh-src-22 ]
