cases:
  - id: bajinder-singh-mohali-zirakpur-rape-2018
    title_en: State v. Bajinder Singh and others (Zirakpur FIR of 20 April 2018; Mohali sessions court)
    title_hi: राज्य बनाम बजिंदर सिंह एवं अन्य (20 अप्रैल 2018 की ज़ीरकपुर एफआईआर; मोहाली सत्र न्यायालय)
    jurisdiction_country: IN
    jurisdiction_region: Punjab
    court: Court of Additional District and Sessions Judge Vikrant Kumar, SAS Nagar (Mohali)
    case_number:
    filed_year: 2018
    case_type: criminal
    statutes: [ IPC 376, IPC 323, IPC 506, IPC 420, IPC 354, IPC 294, IT Act s.67 ]
    status: >
      Reported by The Indian Express, The Tribune, LiveLaw and Scroll.in as convicted on 28 March 2025 and sentenced on 1 April 2025 to life imprisonment; defence counsel said the sentence would be challenged in the Punjab and Haryana High Court and no High Court order could be located as of 9 September 2026. Held at allegation tier because no court judgment, court order or official record has been obtained.
    tier: allegation
    verdict_date: 2025-03-28
    sentence_or_remedy: >
      Life imprisonment under IPC 376 and one year's imprisonment each under IPC 323 and IPC 506, all running concurrently, with a fine reported by The Tribune as Rs 1 lakh. The Tribune and Hindustan Times describe the term as life imprisonment "till death"; The Indian Express and LiveLaw report it simply as life imprisonment.
    appeal_status: >
      Counsel H S Dhanoa said on 1 April 2025 that the conviction and sentence would be challenged in the Punjab and Haryana High Court. No appeal number, listing, order or case-status record could be located as of 2026-09-09; indiankanoon.org, highcourtchd.gov.in and the SAS Nagar district court site were not reachable for this file.
    summary_en: >
      An FIR was registered at Zirakpur police station in SAS Nagar (Mohali) district on 20 April 2018 on the complaint of a woman of Zirakpur who alleged that Bajinder Singh, on the pretext of helping her move abroad, took her to his residence in Sector 63, raped her, recorded the act and threatened to circulate the recording. Hindustan Times reported the sections as IPC 376, 420, 354, 294, 323 and 506 with section 67 of the Information Technology Act, and named six aides in the FIR. Bajinder Singh was arrested at Indira Gandhi International Airport in Delhi in July 2018 as he was about to board a flight to London, was produced before a Mohali court and remanded to two days' police custody, and was later released on bail. On 3 March 2025 Additional District and Sessions Judge Harsimranjit Singh issued a non-bailable warrant after he failed to appear. On 28 March 2025 the court of Additional District and Sessions Judge Vikrant Kumar convicted him under IPC 376, 323 and 506 and acquitted five co-accused, and on 1 April 2025 sentenced him to life imprisonment, holding that he had dominance over the complainant and had misused his position as a preacher. No copy of the judgment or of the sentencing order has been obtained for this file.
    summary_hi: >
      एसएएस नगर (मोहाली) ज़िले के ज़ीरकपुर थाने में 20 अप्रैल 2018 को एक ज़ीरकपुर निवासी महिला की शिकायत पर एफआईआर दर्ज हुई। उन्होंने आरोप लगाया कि बजिंदर सिंह ने विदेश भेजने का झाँसा देकर उन्हें सेक्टर 63 स्थित अपने आवास पर बुलाया, बलात्कार किया, उसका वीडियो बनाया और उसे प्रसारित करने की धमकी दी। हिंदुस्तान टाइम्स के अनुसार धाराएँ आईपीसी 376, 420, 354, 294, 323 और 506 तथा सूचना प्रौद्योगिकी अधिनियम की धारा 67 थीं, और एफआईआर में छह सहयोगी नामज़द थे। जुलाई 2018 में लंदन जाने वाली उड़ान पकड़ने से पहले उन्हें दिल्ली के इंदिरा गांधी अंतर्राष्ट्रीय हवाई अड्डे पर गिरफ़्तार किया गया, मोहाली की अदालत में पेश कर दो दिन के पुलिस रिमांड पर भेजा गया, और बाद में ज़मानत पर रिहा किया गया। 3 मार्च 2025 को पेश न होने पर अतिरिक्त ज़िला एवं सत्र न्यायाधीश हरसिमरनजीत सिंह ने गैर-ज़मानती वारंट जारी किया। 28 मार्च 2025 को अतिरिक्त ज़िला एवं सत्र न्यायाधीश विक्रांत कुमार की अदालत ने उन्हें आईपीसी 376, 323 और 506 के तहत दोषी ठहराया और पाँच सह-अभियुक्तों को बरी किया, तथा 1 अप्रैल 2025 को आजीवन कारावास की सज़ा सुनाई, यह कहते हुए कि शिकायतकर्ता पर उनका प्रभुत्व था और उन्होंने प्रचारक के पद का दुरुपयोग किया। इस फ़ाइल के लिए निर्णय या दंडादेश की प्रति प्राप्त नहीं हुई है।
    source_ids: [ bajinder-singh-src-01, bajinder-singh-src-02, bajinder-singh-src-03, bajinder-singh-src-04, bajinder-singh-src-05, bajinder-singh-src-06, bajinder-singh-src-07 ]

  - id: bajinder-singh-kapurthala-harassment-2025
    title_en: Kapurthala FIR of 28 February 2025 (sexual harassment, stalking, criminal intimidation)
    title_hi: 28 फ़रवरी 2025 की कपूरथला एफआईआर (यौन उत्पीड़न, पीछा करना, आपराधिक धमकी)
    jurisdiction_country: IN
    jurisdiction_region: Punjab
    court:
    case_number:
    filed_year: 2025
    case_type: criminal
    statutes: [ IPC 354-A, IPC 354-D, IPC 506 ]
    status: >
      Reported as under investigation by a three-member special investigation team from 3 March 2025. No chargesheet, court appearance or outcome could be located as of 9 September 2026. Held at allegation tier because no court or official record has been obtained.
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      Kapurthala city police registered an FIR on 28 February 2025 under sections 354-A, 354-D and 506 of the Indian Penal Code on the complaint of a 22-year-old woman who said she had volunteered at The Church of Glory and Wisdom at Tajpur. She alleged that the pastor obtained her telephone number after her parents began attending the church in October 2017, that he sent her messages over about four years beginning in 2020 when she was 17, that from 2022 he had her sit alone in a cabin at the church on Sundays where he touched her inappropriately, and that he threatened her family. On 3 March 2025 Kapurthala police formed a three-member SIT under Phagwara SP Roopinder Kaur. The Punjab State Women's Commission sought a status report on 4 March 2025 and the National Commission for Women took suo motu cognisance on 7 March 2025; the complainant appeared before the NCW on 25 March 2025. Bajinder Singh has publicly denied the allegations, and Christian organisations in Punjab have called the case false. India Today gives the complaint date as 20 February and the FIR date as 23 February 2025, which does not match the 28 February date reported by The Indian Express and The Tribune.
    summary_hi: >
      कपूरथला सिटी पुलिस ने 28 फ़रवरी 2025 को भारतीय दंड संहिता की धारा 354-ए, 354-डी और 506 के तहत एक 22 वर्षीय महिला की शिकायत पर एफआईआर दर्ज की, जिन्होंने बताया कि वे ताजपुर स्थित द चर्च ऑफ ग्लोरी एंड विज़डम में स्वयंसेविका थीं। उनका आरोप है कि अक्टूबर 2017 में उनके माता-पिता के चर्च आने लगने के बाद पादरी ने उनका फ़ोन नंबर लिया, 2020 से लगभग चार वर्षों तक — जब वे 17 वर्ष की थीं — संदेश भेजे, 2022 से रविवार को उन्हें चर्च के केबिन में अकेले बिठाकर अनुचित तरीक़े से छुआ, और उनके परिवार को धमकाया। 3 मार्च 2025 को कपूरथला पुलिस ने फगवाड़ा एसपी रूपिंदर कौर के नेतृत्व में तीन सदस्यीय एसआईटी बनाई। पंजाब राज्य महिला आयोग ने 4 मार्च 2025 को स्थिति रिपोर्ट माँगी और राष्ट्रीय महिला आयोग ने 7 मार्च 2025 को स्वतः संज्ञान लिया; शिकायतकर्ता 25 मार्च 2025 को आयोग के समक्ष पेश हुईं। बजिंदर सिंह ने आरोपों से सार्वजनिक रूप से इनकार किया है और पंजाब के ईसाई संगठनों ने मामले को झूठा बताया है। इंडिया टुडे शिकायत की तिथि 20 फ़रवरी और एफआईआर की तिथि 23 फ़रवरी 2025 बताता है, जो द इंडियन एक्सप्रेस और द ट्रिब्यून की बताई 28 फ़रवरी की तिथि से मेल नहीं खाती।
    source_ids: [ bajinder-singh-src-09, bajinder-singh-src-10, bajinder-singh-src-12, bajinder-singh-src-13, bajinder-singh-src-18, bajinder-singh-src-19, bajinder-singh-src-21 ]

  - id: bajinder-singh-mullanpur-assault-2025
    title_en: Majri (Mullanpur) FIR of 25 March 2025 (assault seen in circulated CCTV clip)
    title_hi: 25 मार्च 2025 की माजरी (मुल्लांपुर) एफआईआर (प्रसारित सीसीटीवी क्लिप में दिखा हमला)
    jurisdiction_country: IN
    jurisdiction_region: Punjab
    court:
    case_number:
    filed_year: 2025
    case_type: criminal
    statutes: [ "BNS 74", "BNS 115(2)", "BNS 351(2)" ]
    status: >
      FIR registered 25 March 2025; no chargesheet, court appearance or outcome could be located as of 9 September 2026. Held at allegation tier because no court or official record has been obtained.
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      A clip said to be from CCTV cameras at Bajinder Singh's office, showing him striking a man and slapping a woman holding a toddler, circulated widely from about 23 March 2025; Deccan Herald noted that it had not independently verified the clip. On 25 March 2025 Punjab Police registered an FIR at Majri police station in Mullanpur under sections 74, 115(2) and 351(2) of the Bharatiya Nyaya Sanhita on the complaint of a 40-year-old woman who said she had served in the ministry for 13 to 14 years. She told reporters the incident occurred on 14 February 2025, when the pastor "misbehaved with me in the church, slapped me, and even tried to strangle me", and said in her complaint that her Aadhaar card, PAN card and signed blank papers had not been returned to her. SHO inspector Sunil Kumar confirmed the registration.
    summary_hi: >
      लगभग 23 मार्च 2025 से एक क्लिप व्यापक रूप से प्रसारित हुई, जिसे बजिंदर सिंह के कार्यालय के सीसीटीवी कैमरों का बताया गया और जिसमें वे एक व्यक्ति को मारते तथा गोद में बच्चा लिए एक महिला को थप्पड़ मारते दिखते हैं; डेक्कन हेराल्ड ने कहा कि उसने क्लिप की प्रामाणिकता की स्वतंत्र पुष्टि नहीं की है। 25 मार्च 2025 को पंजाब पुलिस ने मुल्लांपुर के माजरी थाने में भारतीय न्याय संहिता की धारा 74, 115(2) और 351(2) के तहत एक 40 वर्षीय महिला की शिकायत पर एफआईआर दर्ज की, जिन्होंने कहा कि वे 13-14 वर्ष से इस मिनिस्ट्री में सेवा दे रही थीं। उन्होंने पत्रकारों को बताया कि घटना 14 फ़रवरी 2025 को हुई, जब पादरी ने "चर्च में मेरे साथ बदसलूकी की, थप्पड़ मारा और गला घोंटने की कोशिश भी की", और शिकायत में कहा कि उनका आधार कार्ड, पैन कार्ड और हस्ताक्षरित कोरे काग़ज़ वापस नहीं किए गए। थाना प्रभारी निरीक्षक सुनील कुमार ने एफआईआर दर्ज होने की पुष्टि की।
    source_ids: [ bajinder-singh-src-14, bajinder-singh-src-23, bajinder-singh-src-03 ]

  - id: bajinder-singh-bharatpur-conversion-2024
    title_en: Bharatpur (Rajasthan) FIR over the assembly of 11 February 2024 at Atal Bandh
    title_hi: अटल बंध में 11 फ़रवरी 2024 के आयोजन को लेकर भरतपुर (राजस्थान) एफआईआर
    jurisdiction_country: IN
    jurisdiction_region: Rajasthan
    court: Court at Bharatpur (production warrant and remand)
    case_number:
    filed_year: 2024
    case_type: criminal
    statutes: [ IPC 295A, IPC 298, IPC 323, IPC 120-B, IPC 153A ]
    status: >
      Under investigation by Atal Bandh police station, Bharatpur, with Bajinder Singh named as a suspect during the investigation; produced before a Bharatpur court on a production warrant on 23 August 2025 and remanded to 15 days' judicial custody, then returned to Mansa jail. No chargesheet or outcome could be located as of 9 September 2026. Held at allegation tier because no court or official record has been obtained.
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      The Indian Express reported on 26 August 2025 that an FIR registered at Atal Bandh police station in Bharatpur, Rajasthan, under IPC sections 295A, 298, 323 and 120-B, with 153A added later, concerns an assembly held on 11 February 2024 at Sonar Haveli, Atal Bandh, which the complainant described as a mass conversion event. Police said they found about 350 people at the venue, seized religious books and other material and arrested three organisers, and that Bajinder Singh's name emerged during the investigation as the person who had funded and organised the event. A police progress report seen by the paper points to transactions linked to his ministry of Rs 4.25 crore, Rs 1.67 crore and Rs 92 lakh at different times between 2021 and 2024 and recommends a wider financial investigation, including checks for FCRA violations. He was brought from Mansa jail on a production warrant, presented before the Bharatpur court on 23 August 2025, remanded to 15 days' judicial custody at Sewar jail and returned to Mansa jail the next day. These are police allegations recorded in a newspaper report; no court order or official document has been obtained.
    summary_hi: >
      द इंडियन एक्सप्रेस ने 26 अगस्त 2025 को बताया कि राजस्थान के भरतपुर के अटल बंध थाने में आईपीसी की धारा 295ए, 298, 323 और 120-बी (बाद में 153ए जोड़ी गई) के तहत दर्ज एफआईआर 11 फ़रवरी 2024 को सोनार हवेली, अटल बंध में हुए आयोजन से संबंधित है, जिसे शिकायतकर्ता ने सामूहिक धर्मांतरण का आयोजन बताया। पुलिस के अनुसार मौक़े पर लगभग 350 लोग मिले, धार्मिक पुस्तकें और अन्य सामग्री ज़ब्त की गई और तीन आयोजक गिरफ़्तार किए गए, तथा जाँच के दौरान बजिंदर सिंह का नाम आयोजन के वित्तपोषक और संयोजक के रूप में सामने आया। अख़बार द्वारा देखी गई पुलिस प्रगति रिपोर्ट में उनकी मिनिस्ट्री से जुड़े 4.25 करोड़, 1.67 करोड़ और 92 लाख रुपये के लेन-देन का उल्लेख है और एफसीआरए उल्लंघन की जाँच सहित व्यापक वित्तीय जाँच की सिफ़ारिश की गई है। उन्हें प्रोडक्शन वारंट पर मानसा जेल से लाया गया, 23 अगस्त 2025 को भरतपुर की अदालत में पेश किया गया, सेवर जेल में 15 दिन की न्यायिक हिरासत में भेजा गया और अगले दिन मानसा जेल लौटा दिया गया। ये एक समाचार रिपोर्ट में दर्ज पुलिस के आरोप हैं; कोई अदालती आदेश या आधिकारिक दस्तावेज़ प्राप्त नहीं हुआ।
    source_ids: [ bajinder-singh-src-15 ]

  - id: bajinder-singh-income-tax-2023
    title_en: Income Tax Department searches of 1 February 2023
    title_hi: 1 फ़रवरी 2023 की आयकर विभाग की तलाशी
    jurisdiction_country: IN
    jurisdiction_region: Punjab
    court:
    case_number:
    filed_year: 2023
    case_type: regulatory
    statutes: [ Income Tax Act 1961 ]
    status: >
      Searches reported on 1 February 2023; no assessment, penalty, prosecution or other outcome could be located as of 9 September 2026. Held at allegation tier because no official record of the action has been obtained.
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      The Tribune reported that Income Tax officials searched six or seven premises, including the homes and churches of Bajinder Singh of Tajpur, Jalandhar, and pastor Harpreet Deol of Khojewal, Kapurthala, starting at 6 am on 1 February 2023 in Jalandhar, Amritsar and New Chandigarh and finishing at 10 pm the same day. Officials told the paper that about Rs 2 crore in unaccounted cash and documents relating to properties and other assets were taken, and that the department would look at tax evasion, the use of donations by the two churches and the setting up of centres in Dubai, Mauritius and elsewhere. The Indian Express separately dates the search of Bajinder Singh's premises to 1 February 2023. No Income Tax Department statement or order has been obtained.
    summary_hi: >
      द ट्रिब्यून के अनुसार आयकर अधिकारियों ने 1 फ़रवरी 2023 को सुबह 6 बजे से रात 10 बजे तक जालंधर, अमृतसर और न्यू चंडीगढ़ में छह-सात परिसरों की तलाशी ली, जिनमें ताजपुर (जालंधर) के बजिंदर सिंह और खोजेवाल (कपूरथला) के पादरी हरप्रीत देओल के घर और चर्च शामिल थे। अधिकारियों ने अख़बार को बताया कि लगभग 2 करोड़ रुपये बेहिसाब नक़दी तथा संपत्तियों और अन्य परिसंपत्तियों से जुड़े दस्तावेज़ लिए गए, और विभाग कर चोरी, दोनों चर्चों द्वारा चंदे के उपयोग तथा दुबई, मॉरीशस और अन्य स्थानों पर केंद्र खोलने की जाँच करेगा। द इंडियन एक्सप्रेस भी बजिंदर सिंह के परिसरों की तलाशी की तिथि 1 फ़रवरी 2023 बताता है। आयकर विभाग का कोई बयान या आदेश प्राप्त नहीं हुआ है।
    source_ids: [ bajinder-singh-src-16, bajinder-singh-src-17 ]

claims:
  - id: bajinder-singh-claim-01
    case_id: bajinder-singh-mohali-zirakpur-rape-2018
    statement_en: An FIR was registered at Zirakpur police station in SAS Nagar (Mohali) district on 20 April 2018 on the complaint of a woman of Zirakpur who alleged that Bajinder Singh raped her at his residence in Sector 63 on the pretext of helping her settle abroad, recorded the act and threatened to circulate the recording; Hindustan Times reported the sections as IPC 376, 420, 354, 294, 323 and 506 with section 67 of the Information Technology Act, and named six aides alongside him.
    statement_hi: एसएएस नगर (मोहाली) ज़िले के ज़ीरकपुर थाने में 20 अप्रैल 2018 को एक ज़ीरकपुर निवासी महिला की शिकायत पर एफआईआर दर्ज हुई, जिसमें आरोप था कि बजिंदर सिंह ने विदेश बसाने का झाँसा देकर सेक्टर 63 स्थित अपने आवास पर उनसे बलात्कार किया, उसका वीडियो बनाया और उसे प्रसारित करने की धमकी दी; हिंदुस्तान टाइम्स के अनुसार धाराएँ आईपीसी 376, 420, 354, 294, 323 और 506 तथा सूचना प्रौद्योगिकी अधिनियम की धारा 67 थीं, और उनके साथ छह सहयोगी नामज़द थे।
    tier: allegation
    date: 2018-04-20
    source_ids: [ bajinder-singh-src-01, bajinder-singh-src-02 ]
  - id: bajinder-singh-claim-02
    case_id: bajinder-singh-mohali-zirakpur-rape-2018
    statement_en: Bajinder Singh was arrested at Indira Gandhi International Airport in Delhi in July 2018 as he was about to board a flight to London, after a look-out notice was issued; Hindustan Times reported on 19 July 2018 that he had been produced before a Mohali court and remanded to two days' police custody, and he was later released on bail.
    statement_hi: जुलाई 2018 में लुक-आउट नोटिस जारी होने के बाद बजिंदर सिंह को लंदन की उड़ान पकड़ने से ठीक पहले दिल्ली के इंदिरा गांधी अंतर्राष्ट्रीय हवाई अड्डे पर गिरफ़्तार किया गया; हिंदुस्तान टाइम्स ने 19 जुलाई 2018 को बताया कि उन्हें मोहाली की अदालत में पेश कर दो दिन के पुलिस रिमांड पर भेजा गया, और बाद में उन्हें ज़मानत पर रिहा कर दिया गया।
    tier: allegation
    date: 2018-07-19
    source_ids: [ bajinder-singh-src-01, bajinder-singh-src-18, bajinder-singh-src-03 ]
  - id: bajinder-singh-claim-03
    case_id: bajinder-singh-mohali-zirakpur-rape-2018
    statement_en: On 28 March 2025 the court of Additional District and Sessions Judge Vikrant Kumar at Mohali convicted Bajinder Singh under sections 376, 323 and 506 of the Indian Penal Code in the 2018 Zirakpur case and acquitted the five co-accused, named by The Indian Express as Jatinder Kumar, Akbar Bhatti, Rajesh Chaudhary, Sitar Ali and Sandeep Pehlwan.
    statement_hi: 28 मार्च 2025 को मोहाली में अतिरिक्त ज़िला एवं सत्र न्यायाधीश विक्रांत कुमार की अदालत ने 2018 के ज़ीरकपुर मामले में बजिंदर सिंह को भारतीय दंड संहिता की धारा 376, 323 और 506 के तहत दोषी ठहराया और पाँच सह-अभियुक्तों को बरी कर दिया, जिनके नाम द इंडियन एक्सप्रेस ने जतिंदर कुमार, अकबर भट्टी, राजेश चौधरी, सितार अली और संदीप पहलवान बताए।
    tier: allegation
    date: 2025-03-28
    source_ids: [ bajinder-singh-src-03, bajinder-singh-src-05, bajinder-singh-src-07 ]
  - id: bajinder-singh-claim-04
    case_id: bajinder-singh-mohali-zirakpur-rape-2018
    statement_en: On 1 April 2025 the same court sentenced Bajinder Singh to life imprisonment under IPC 376 and to one year's imprisonment each under IPC 323 and IPC 506, the sentences to run concurrently, with a fine reported by The Tribune as Rs 1 lakh; he was taken to Patiala jail and later held in Mansa jail.
    statement_hi: 1 अप्रैल 2025 को उसी अदालत ने बजिंदर सिंह को आईपीसी 376 के तहत आजीवन कारावास तथा आईपीसी 323 और 506 के तहत एक-एक वर्ष के कारावास की सज़ा सुनाई, जो साथ-साथ चलेंगी, और द ट्रिब्यून के अनुसार एक लाख रुपये का जुर्माना लगाया; उन्हें पटियाला जेल ले जाया गया और बाद में मानसा जेल में रखा गया।
    tier: allegation
    date: 2025-04-01
    source_ids: [ bajinder-singh-src-04, bajinder-singh-src-05, bajinder-singh-src-06, bajinder-singh-src-08 ]
  - id: bajinder-singh-claim-05
    case_id: bajinder-singh-mohali-zirakpur-rape-2018
    statement_en: The Indian Express, quoting the sentencing order of 1 April 2025, reported that the court held Bajinder Singh had dominance over the complainant and had committed a heinous offence by misusing his position as a preacher, that "Sexual violence, apart from being a dehumanising act, is an unlawful intrusion on the right of privacy and sanctity of a female", and that, keeping in view the gravity of the offence, he "does not deserve leniency".
    statement_hi: द इंडियन एक्सप्रेस ने 1 अप्रैल 2025 के दंडादेश के हवाले से बताया कि अदालत ने माना कि शिकायतकर्ता पर बजिंदर सिंह का प्रभुत्व था और उन्होंने प्रचारक के पद का दुरुपयोग कर जघन्य अपराध किया, कि "यौन हिंसा, अमानवीय कृत्य होने के अतिरिक्त, किसी महिला की निजता और गरिमा के अधिकार पर अवैध अतिक्रमण है", और अपराध की गंभीरता को देखते हुए वे "नरमी के पात्र नहीं" हैं।
    tier: allegation
    date: 2025-04-01
    source_ids: [ bajinder-singh-src-04, bajinder-singh-src-05 ]
  - id: bajinder-singh-claim-06
    case_id: bajinder-singh-mohali-zirakpur-rape-2018
    statement_en: Bajinder Singh's counsel H S Dhanoa said on 1 April 2025 that the conviction and sentence would be challenged in the Punjab and Haryana High Court; no High Court appeal number, listing, order or case-status entry could be located for this file as of 9 September 2026.
    statement_hi: बजिंदर सिंह के वकील एच एस धनोआ ने 1 अप्रैल 2025 को कहा कि दोषसिद्धि और सज़ा को पंजाब एवं हरियाणा उच्च न्यायालय में चुनौती दी जाएगी; 9 सितंबर 2026 तक इस फ़ाइल के लिए उच्च न्यायालय की कोई अपील संख्या, सूचीबद्धता, आदेश या मामला-स्थिति प्रविष्टि नहीं मिल सकी।
    tier: allegation
    date: 2025-04-01
    source_ids: [ bajinder-singh-src-04, bajinder-singh-src-05 ]
  - id: bajinder-singh-claim-07
    case_id: bajinder-singh-kapurthala-harassment-2025
    statement_en: Kapurthala city police registered an FIR against Bajinder Singh on 28 February 2025 under sections 354-A, 354-D and 506 of the Indian Penal Code on the complaint of a 22-year-old woman who said she had volunteered at his Tajpur church and that he had sent her messages from 2020, when she was 17, and touched her inappropriately in a church cabin from 2022; on 3 March 2025 Kapurthala police formed a three-member special investigation team headed by Phagwara SP Roopinder Kaur.
    statement_hi: कपूरथला सिटी पुलिस ने 28 फ़रवरी 2025 को बजिंदर सिंह के विरुद्ध भारतीय दंड संहिता की धारा 354-ए, 354-डी और 506 के तहत एक 22 वर्षीय महिला की शिकायत पर एफआईआर दर्ज की, जिन्होंने कहा कि वे उनके ताजपुर चर्च में स्वयंसेविका थीं, कि उन्होंने 2020 से — जब वे 17 वर्ष की थीं — उन्हें संदेश भेजे और 2022 से चर्च के केबिन में अनुचित तरीक़े से छुआ; 3 मार्च 2025 को कपूरथला पुलिस ने फगवाड़ा एसपी रूपिंदर कौर के नेतृत्व में तीन सदस्यीय विशेष जाँच दल बनाया।
    tier: allegation
    date: 2025-02-28
    source_ids: [ bajinder-singh-src-09, bajinder-singh-src-10, bajinder-singh-src-12 ]
  - id: bajinder-singh-claim-08
    case_id: bajinder-singh-kapurthala-harassment-2025
    statement_en: The Tribune reported that on 7 March 2025 the National Commission for Women, under chairperson Vijaya Rahatkar, took suo motu cognisance of media reports on the Kapurthala case, urged swift action including Bajinder Singh's arrest and protection for the complainant, and asked for the action-taken report and a copy of the FIR within three days; the complainant appeared before the Commission on 25 March 2025.
    statement_hi: द ट्रिब्यून के अनुसार 7 मार्च 2025 को राष्ट्रीय महिला आयोग ने अध्यक्ष विजया रहाटकर के नेतृत्व में कपूरथला मामले की मीडिया रिपोर्टों पर स्वतः संज्ञान लिया, बजिंदर सिंह की गिरफ़्तारी सहित त्वरित कार्रवाई और शिकायतकर्ता की सुरक्षा की माँग की, तथा तीन दिनों में कार्रवाई रिपोर्ट और एफआईआर की प्रति माँगी; शिकायतकर्ता 25 मार्च 2025 को आयोग के समक्ष पेश हुईं।
    tier: allegation
    date: 2025-03-07
    source_ids: [ bajinder-singh-src-12, bajinder-singh-src-13 ]
  - id: bajinder-singh-claim-09
    case_id: bajinder-singh-mullanpur-assault-2025
    statement_en: On 25 March 2025 Punjab Police registered an FIR against Bajinder Singh at Majri police station in Mullanpur under sections 74, 115(2) and 351(2) of the Bharatiya Nyaya Sanhita on the complaint of a 40-year-old woman who had served in his ministry for 13 to 14 years and who said that on 14 February 2025 he slapped her and tried to strangle her; a clip said to be from CCTV cameras at his office, showing the incident, had circulated from about 23 March 2025.
    statement_hi: 25 मार्च 2025 को पंजाब पुलिस ने मुल्लांपुर के माजरी थाने में बजिंदर सिंह के विरुद्ध भारतीय न्याय संहिता की धारा 74, 115(2) और 351(2) के तहत एक 40 वर्षीय महिला की शिकायत पर एफआईआर दर्ज की, जो 13-14 वर्ष से उनकी मिनिस्ट्री में सेवा दे रही थीं और जिन्होंने कहा कि 14 फ़रवरी 2025 को उन्होंने थप्पड़ मारा और गला घोंटने की कोशिश की; उनके कार्यालय के सीसीटीवी कैमरों का बताया जा रहा यह क्लिप लगभग 23 मार्च 2025 से प्रसारित हो रहा था।
    tier: allegation
    date: 2025-03-25
    source_ids: [ bajinder-singh-src-14, bajinder-singh-src-23 ]
  - id: bajinder-singh-claim-10
    case_id: bajinder-singh-bharatpur-conversion-2024
    statement_en: The Indian Express reported on 26 August 2025 that Bajinder Singh had been named as a suspect during the investigation of an FIR at Atal Bandh police station in Bharatpur, Rajasthan, under IPC 295A, 298, 323 and 120-B with 153A added later, concerning an assembly of 11 February 2024 at Sonar Haveli which police say was a mass conversion event funded and organised by him.
    statement_hi: द इंडियन एक्सप्रेस ने 26 अगस्त 2025 को बताया कि राजस्थान के भरतपुर के अटल बंध थाने में आईपीसी 295ए, 298, 323 और 120-बी (बाद में 153ए जोड़ी गई) के तहत दर्ज एफआईआर की जाँच के दौरान बजिंदर सिंह को संदिग्ध के रूप में नामित किया गया; यह मामला 11 फ़रवरी 2024 को सोनार हवेली में हुए उस आयोजन से जुड़ा है जिसे पुलिस उनके द्वारा वित्तपोषित और आयोजित सामूहिक धर्मांतरण कार्यक्रम बताती है।
    tier: allegation
    date: 2025-08-26
    source_ids: [ bajinder-singh-src-15 ]
  - id: bajinder-singh-claim-11
    case_id: bajinder-singh-bharatpur-conversion-2024
    statement_en: Bajinder Singh was brought from Mansa jail to Bharatpur on a production warrant, presented before the Bharatpur court on 23 August 2025 and remanded to 15 days' judicial custody at Sewar jail, and was returned to Mansa jail the next day, as confirmed to The Indian Express by Mansa Jail Deputy Superintendent Jagjit Singh.
    statement_hi: बजिंदर सिंह को प्रोडक्शन वारंट पर मानसा जेल से भरतपुर लाया गया, 23 अगस्त 2025 को भरतपुर की अदालत में पेश किया गया और सेवर जेल में 15 दिन की न्यायिक हिरासत में भेजा गया, तथा अगले दिन मानसा जेल लौटा दिया गया — यह मानसा जेल के उप अधीक्षक जगजीत सिंह ने द इंडियन एक्सप्रेस को पुष्ट किया।
    tier: allegation
    date: 2025-08-23
    source_ids: [ bajinder-singh-src-15 ]
  - id: bajinder-singh-claim-12
    case_id: bajinder-singh-income-tax-2023
    statement_en: The Tribune reported that Income Tax officials searched six or seven premises in Jalandhar, Amritsar and New Chandigarh on 1 February 2023, including the homes and churches of Bajinder Singh and pastor Harpreet Deol, and that officials said about Rs 2 crore in unaccounted cash and documents on properties and assets were taken, with inquiries into tax evasion, the use of donations and offshore centres.
    statement_hi: द ट्रिब्यून के अनुसार आयकर अधिकारियों ने 1 फ़रवरी 2023 को जालंधर, अमृतसर और न्यू चंडीगढ़ में छह-सात परिसरों की तलाशी ली, जिनमें बजिंदर सिंह और पादरी हरप्रीत देओल के घर और चर्च शामिल थे, और अधिकारियों ने बताया कि लगभग 2 करोड़ रुपये बेहिसाब नक़दी तथा संपत्तियों और परिसंपत्तियों के दस्तावेज़ लिए गए, और कर चोरी, चंदे के उपयोग तथा विदेशी केंद्रों की जाँच की जा रही है।
    tier: allegation
    date: 2023-02-01
    source_ids: [ bajinder-singh-src-16, bajinder-singh-src-17 ]
  - id: bajinder-singh-claim-13
    statement_en: Hindustan Times, The Tribune, The Indian Express and India Today have all reported that Bajinder Singh, a native of Yamunanagar in Haryana, converted to Christianity while imprisoned in a murder case and began preaching in 2012 after his release; India Today additionally reports that he was imprisoned in 2008 in that case, that he was booked under IPC 295A at Karnal in 2014 and that he faced charges of assault and intimidation in Yamunanagar in 2006. No court, police or other record of any of these earlier cases has been located.
    statement_hi: हिंदुस्तान टाइम्स, द ट्रिब्यून, द इंडियन एक्सप्रेस और इंडिया टुडे — सभी ने बताया है कि हरियाणा के यमुनानगर के मूल निवासी बजिंदर सिंह ने एक हत्या के मामले में जेल में रहते हुए ईसाई धर्म अपनाया और रिहाई के बाद 2012 में प्रचार शुरू किया; इंडिया टुडे यह भी बताता है कि उस मामले में उन्हें 2008 में जेल हुई, 2014 में करनाल में आईपीसी 295ए के तहत मामला दर्ज हुआ और 2006 में यमुनानगर में उन पर मारपीट और धमकी के आरोप लगे। इन पुराने मामलों में से किसी का कोई अदालती, पुलिस या अन्य अभिलेख नहीं मिल सका।
    tier: allegation
    date: 2025-03-03
    source_ids: [ bajinder-singh-src-19, bajinder-singh-src-01, bajinder-singh-src-18, bajinder-singh-src-20 ]

