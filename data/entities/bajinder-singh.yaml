summary_en: >
  Bajinder Singh is a self-styled Christian preacher who heads The Church of Glory and Wisdom, with congregations at Tajpur in Jalandhar district and at Majri near Mullanpur in SAS Nagar (Mohali) district, Punjab, and who is widely known from viral videos of his "Yeshu Yeshu" services. On 28 March 2025 the court of Additional District and Sessions Judge Vikrant Kumar at Mohali convicted him under sections 376, 323 and 506 of the Indian Penal Code in a case registered at Zirakpur police station in April 2018 on the complaint of a Zirakpur woman, and on 1 April 2025 sentenced him to life imprisonment with a fine; five co-accused were acquitted. His counsel said the conviction would be challenged in the Punjab and Haryana High Court, and no High Court order in that appeal could be located as of 9 September 2026. Three further police cases were reported against him in 2025 — a Kapurthala FIR of 28 February 2025 alleging sexual harassment and stalking, an FIR of 25 March 2025 at Majri police station over an assault seen in a widely circulated CCTV clip, and a Bharatpur (Rajasthan) investigation into an alleged mass-conversion event of February 2024 in which he was produced before a court on a production warrant in August 2025. The Income Tax Department searched his premises on 1 February 2023. He denies the harassment allegations; Christian organisations in Punjab have called the Kapurthala case "false" and a "conspiracy". Every entry in this file is held at allegation tier because no court judgment, court order or official record has yet been obtained for it; the record here rests on named major-outlet reporting.
summary_hi: >
  बजिंदर सिंह एक स्वयंभू ईसाई प्रचारक हैं, जो "द चर्च ऑफ ग्लोरी एंड विज़डम" के प्रमुख हैं। उनकी सभाएँ जालंधर ज़िले के ताजपुर और एसएएस नगर (मोहाली) ज़िले में मुल्लांपुर के पास माजरी में होती हैं, और वे अपनी "यीशु-यीशु" सभाओं के वायरल वीडियो से व्यापक रूप से जाने जाते हैं। 28 मार्च 2025 को मोहाली में अतिरिक्त ज़िला एवं सत्र न्यायाधीश विक्रांत कुमार की अदालत ने उन्हें अप्रैल 2018 में ज़ीरकपुर थाने में एक ज़ीरकपुर निवासी महिला की शिकायत पर दर्ज मामले में भारतीय दंड संहिता की धारा 376, 323 और 506 के तहत दोषी ठहराया, और 1 अप्रैल 2025 को आजीवन कारावास तथा जुर्माने की सज़ा सुनाई; पाँच सह-अभियुक्त बरी कर दिए गए। उनके वकील ने कहा कि इस फ़ैसले को पंजाब एवं हरियाणा उच्च न्यायालय में चुनौती दी जाएगी; 9 सितंबर 2026 तक उस अपील में उच्च न्यायालय का कोई आदेश नहीं मिल सका। 2025 में उनके विरुद्ध तीन और पुलिस मामले सामने आए — 28 फ़रवरी 2025 का कपूरथला में यौन उत्पीड़न और पीछा करने का मामला, 25 मार्च 2025 को माजरी थाने में व्यापक रूप से प्रसारित सीसीटीवी क्लिप में दिखे हमले पर दर्ज मामला, और भरतपुर (राजस्थान) में फ़रवरी 2024 के कथित सामूहिक धर्मांतरण आयोजन की जाँच, जिसमें अगस्त 2025 में उन्हें प्रोडक्शन वारंट पर अदालत में पेश किया गया। आयकर विभाग ने 1 फ़रवरी 2023 को उनके परिसरों की तलाशी ली थी। वे उत्पीड़न के आरोपों से इनकार करते हैं; पंजाब के ईसाई संगठनों ने कपूरथला मामले को "झूठा" और "साज़िश" बताया है। इस फ़ाइल की हर प्रविष्टि allegation श्रेणी में रखी गई है, क्योंकि इसके लिए अब तक कोई अदालती निर्णय, अदालती आदेश या आधिकारिक अभिलेख प्राप्त नहीं हुआ है; यहाँ का विवरण नामित प्रमुख समाचार संस्थानों की रिपोर्टिंग पर आधारित है।
hi_reviewed: false
response_from_subject:
  text_en: >
    At a press conference in Jalandhar on 2 March 2025, after the Kapurthala FIR, Bajinder Singh said: "All allegations being levelled against me are absolutely baseless. These days, fake chats can be easily generated. If allegations are being levelled against me, then the other party must have some proof. In the past two and a half years, she couldn't produce any evidence." He said the complainant suffered from seizures and was influenced by "evil spirits", and added: "Our task is to pray for her. She is like our daughter. Sometimes, when volunteers don't get any reprieve, they take out their anger on us." Christian leader Avtar Singh, also named in the Kapurthala complaint, told The Indian Express on 2 March 2025: "A false FIR has been filed against Pastor Bajinder in Kapurthala, accusing him of inappropriate behaviour with a woman. This FIR was filed as part of a conspiracy." On 10 March 2025 representatives of Christian organisations, along with Valmiki and Mazhabi Sikh groups, told a press conference in Jalandhar that the case against him was "false" and demanded a fair probe by the SIT. Before sentencing on 1 April 2025 he pleaded for leniency, citing an ailing wife, young children, a rod implanted in his leg and his position as sole breadwinner.
  text_hi: >
    कपूरथला एफआईआर के बाद 2 मार्च 2025 को जालंधर में एक पत्रकार वार्ता में बजिंदर सिंह ने कहा: "मुझ पर लगाए जा रहे सभी आरोप बिल्कुल निराधार हैं। आजकल नकली चैट आसानी से बनाई जा सकती हैं। यदि मुझ पर आरोप लगाए जा रहे हैं तो दूसरे पक्ष के पास कोई प्रमाण होना चाहिए। पिछले ढाई वर्षों में वह कोई सबूत पेश नहीं कर सकीं।" उन्होंने कहा कि शिकायतकर्ता को दौरे पड़ते हैं और वह "दुष्ट आत्माओं" से प्रभावित हैं, और जोड़ा: "हमारा काम उसके लिए प्रार्थना करना है। वह हमारी बेटी जैसी है। कभी-कभी जब स्वयंसेवकों को राहत नहीं मिलती तो वे हम पर गुस्सा निकालते हैं।" कपूरथला शिकायत में नामित ईसाई नेता अवतार सिंह ने 2 मार्च 2025 को द इंडियन एक्सप्रेस से कहा: "कपूरथला में पादरी बजिंदर के विरुद्ध एक झूठी एफआईआर दर्ज कराई गई है, जिसमें उन पर एक महिला के साथ अनुचित व्यवहार का आरोप है। यह एफआईआर एक साज़िश के तहत दर्ज कराई गई है।" 10 मार्च 2025 को ईसाई संगठनों तथा वाल्मीकि और मज़हबी सिख समूहों के प्रतिनिधियों ने जालंधर में पत्रकार वार्ता में मामले को "झूठा" बताया और एसआईटी से निष्पक्ष जाँच की माँग की। 1 अप्रैल 2025 को सज़ा से पहले उन्होंने बीमार पत्नी, छोटे बच्चों, पैर में लगी रॉड और परिवार के एकमात्र कमाऊ सदस्य होने का हवाला देते हुए नरमी की गुहार लगाई।
