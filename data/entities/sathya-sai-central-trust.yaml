cases:
  - id: sathya-sai-central-trust-cash-vehicle-seizure-2011
    title_en: Seizure of cash-carrying vehicle near Puttaparthi (June 2011)
    title_hi: पुट्टपर्थी के निकट नकदी ले जा रही गाड़ी की ज़ब्ती (जून 2011)
    jurisdiction_country: IN
    jurisdiction_region: Andhra Pradesh
    court: Investigated by Andhra Pradesh police (Chilamanthur police station); no chargesheet or court proceeding found on record
    case_number: Not on record
    filed_year: 2011
    case_type: criminal
    statutes: []
    status: Vehicle seized and three men arrested; two trust figures questioned; no chargesheet or further outcome found on record
    tier: closed
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      On 18 June 2011 Andhra Pradesh police intercepted a vehicle carrying Rs 35.5 lakh in cash
      at the Kodikonda checkpost near the Karnataka border, said to belong to the Sri Sathya
      Sai Central Trust. Three men, including the vehicle's driver and a driver employed by
      trust member V. Srinivasan, were arrested. Police subsequently issued notices calling
      Srinivasan and Sai Baba's nephew and trust member R.J. Rathnakar for questioning.
      Srinivasan initially denied any trust link to the cash, then said it had been collected
      by Rathnakar from devotees to fund a memorial ("mahasamadhi") for Sai Baba and was being
      sent to a contractor undertaking that work. No chargesheet, trial or other court
      proceeding arising from the seizure was found in subsequent reporting or court records.
    summary_hi: >
      18 जून 2011 को आंध्र प्रदेश पुलिस ने कर्नाटक सीमा के निकट कोडिकोंडा चेकपोस्ट पर 35.5 लाख
      रुपये नकद ले जा रही एक गाड़ी ज़ब्त की, जिसे श्री सत्य साईं सेंट्रल ट्रस्ट से जुड़ा बताया गया।
      गाड़ी के चालक और ट्रस्ट सदस्य वी. श्रीनिवासन के चालक सहित तीन व्यक्तियों को गिरफ्तार किया
      गया। बाद में पुलिस ने श्रीनिवासन और साईं बाबा के भतीजे व ट्रस्ट सदस्य आर.जे. रत्नाकर को
      पूछताछ हेतु नोटिस भेजे। श्रीनिवासन ने पहले नकदी से ट्रस्ट के किसी संबंध से इनकार किया, फिर
      बताया कि यह राशि रत्नाकर ने साईं बाबा के एक स्मारक ("महासमाधि") के निर्माण हेतु भक्तों से
      एकत्र की थी और उस कार्य को करने वाले एक ठेकेदार को भेजी जा रही थी। इस ज़ब्ती से जुड़ा कोई
      आरोप-पत्र, मुकदमा या अन्य अदालती कार्यवाही बाद की रिपोर्टों या अदालती अभिलेखों में नहीं मिली।
    source_ids: [sst-src-04, sst-src-06]

  - id: sathya-sai-central-trust-itat-2011-12-assessment
    title_en: Sri Sathya Sai Central Trust v. Additional Director of Income Tax (ITAT, assessment year 2011-12)
    title_hi: श्री सत्य साईं सेंट्रल ट्रस्ट बनाम अपर आयकर निदेशक (आयकर अपीलीय अधिकरण, आकलन वर्ष 2011-12)
    jurisdiction_country: IN
    jurisdiction_region: Karnataka
    court: Income Tax Appellate Tribunal, Bangalore
    case_number: ITA No. 1129/Bang/2017
    filed_year: 2017
    case_type: regulatory
    statutes: ["Income Tax Act 1961, ss.10(23C), 11, 12A"]
    status: Appeal by the trust treated as allowed for statistical purposes; some issues remanded to the assessing officer
    tier: closed
    verdict_date: 2021-12-20
    sentence_or_remedy: >
      Tribunal held that the trust's perpetual bonds in Canara Bank were an eligible investment
      under s.11(5) and that depreciation could be claimed as application of income; remanded
      the disallowed capital-loss and accumulated-income issues to the assessing officer for
      fresh examination.
    appeal_status: Not on record
    summary_en: >
      The trust, registered under section 12A of the Income Tax Act and approved under section
      10(23C)(iv), appealed a Commissioner (Appeals) order for assessment year 2011-12 that had
      disallowed a claimed loss on the sale of investments, added capital gains on gifted
      assets, restricted the deduction on net surplus, queried the trust's determination of
      unspent accumulated income, and disallowed depreciation as application of income. On 20
      December 2021 a two-member Bangalore bench of the Income Tax Appellate Tribunal ruled
      largely in the trust's favour, holding its Canara Bank bond investment eligible under
      section 11(5) and depreciation allowable as application of income following the Supreme
      Court's ruling in CIT v. Rajasthan and Gujarati Charitable Foundation, while sending the
      capital-loss set-off and accumulated-income questions back to the assessing officer for
      fresh examination. The appeal was treated as allowed for statistical purposes.
    summary_hi: >
      आयकर अधिनियम की धारा 12ए के तहत पंजीकृत और धारा 10(23सी)(iv) के तहत अनुमोदित ट्रस्ट ने
      आकलन वर्ष 2011-12 के लिए आयुक्त (अपील) के उस आदेश के विरुद्ध अपील की जिसमें निवेश की बिक्री पर
      हुई हानि को अस्वीकार किया गया था, उपहार में मिली संपत्तियों पर पूँजीगत लाभ जोड़ा गया था, शुद्ध
      अधिशेष पर कटौती सीमित की गई थी, अव्ययित संचित आय के निर्धारण पर सवाल उठाया गया था, और मूल्यह्रास
      को आय के उपयोग के रूप में अस्वीकार किया गया था। 20 दिसंबर 2021 को आयकर अपीलीय अधिकरण की
      बेंगलुरु स्थित दो-सदस्यीय पीठ ने मुख्यतः ट्रस्ट के पक्ष में निर्णय दिया, केनरा बैंक के बॉन्ड
      निवेश को धारा 11(5) के तहत पात्र माना और सर्वोच्च न्यायालय के सीआईटी बनाम राजस्थान एंड गुजराती
      चैरिटेबल फाउंडेशन के निर्णय के अनुसार मूल्यह्रास को आय के उपयोग के रूप में स्वीकार्य ठहराया,
      जबकि पूँजीगत हानि की समायोजन और संचित आय संबंधी प्रश्नों को पुनर्विचार हेतु निर्धारण अधिकारी
      को लौटा दिया। अपील को सांख्यिकीय प्रयोजन हेतु स्वीकृत माना गया।
    source_ids: [sst-src-07]

claims:
