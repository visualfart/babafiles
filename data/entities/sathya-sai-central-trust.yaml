name_en: Sri Sathya Sai Central Trust
name_hi: श्री सत्य साईं सेंट्रल ट्रस्ट
aliases: [Sathya Sai Central Trust, Sri Sathya Sai Trust]
base_location: Prasanthi Nilayam, Puttaparthi, Andhra Pradesh
