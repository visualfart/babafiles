summary_en: >
  The Sri Sathya Sai Central Trust, founded on 2 September 1972 by Sathya Sai Baba, runs the
  Prasanthi Nilayam ashram at Puttaparthi, Andhra Pradesh, along with hospitals, a university
  and other institutions. After Sai Baba's death on 24 April 2011, trust members opened his
  private chamber, Yajur Mandir, on 16 June 2011 and over the following weeks announced
  inventories there and at the trust's Bangalore ashram (Brindavan) totalling roughly 104 kg
  of gold, over 550 kg of silver and more than Rs 12.5 crore in cash, along with jewellery and
  a diamond ring. On 18 June 2011, separately, Andhra Pradesh police intercepted a vehicle
  said to belong to the trust carrying Rs 35.5 lakh in cash near the Karnataka border and
  arrested three men; two senior trust figures were later called in for questioning. No
  chargesheet or further court proceeding arising from that seizure was found on record. On
  20 December 2021 the Income Tax Appellate Tribunal, Bangalore, ruled substantially in the
  trust's favour in a dispute over its assessment for 2011-12, treating its appeal as allowed
  for statistical purposes and directing some issues to be re-examined by the assessing
  officer. No Andhra Pradesh High Court petition seeking a government takeover of, or inquiry
  into, the trust could be verified on the record available.
summary_hi: >
  2 सितंबर 1972 को सत्य साईं बाबा द्वारा स्थापित श्री सत्य साईं सेंट्रल ट्रस्ट आंध्र प्रदेश के
  पुट्टपर्थी स्थित प्रशांति निलयम आश्रम के साथ-साथ अस्पताल, विश्वविद्यालय और अन्य संस्थान चलाता
  है। 24 अप्रैल 2011 को साईं बाबा की मृत्यु के बाद, ट्रस्ट सदस्यों ने 16 जून 2011 को उनका निजी कक्ष
  यजुर मंदिर खोला और अगले हफ्तों में वहाँ तथा ट्रस्ट के बेंगलुरु आश्रम (बृंदावन) में हुई गणना में
  लगभग 104 किलोग्राम सोना, 550 किलोग्राम से अधिक चाँदी और साढ़े 12.5 करोड़ रुपये से अधिक नकदी के
  साथ आभूषण और एक हीरे की अंगूठी होने की घोषणा की। इससे अलग, 18 जून 2011 को आंध्र प्रदेश पुलिस ने
  कर्नाटक सीमा के पास ट्रस्ट से जुड़ी बताई गई एक गाड़ी से 35.5 लाख रुपये नकद ज़ब्त कर तीन लोगों को
  गिरफ्तार किया; बाद में ट्रस्ट के दो वरिष्ठ पदाधिकारियों को पूछताछ के लिए बुलाया गया। इस ज़ब्ती से
  जुड़ा कोई आरोप-पत्र या आगे की अदालती कार्यवाही अभिलेख में नहीं मिली। 20 दिसंबर 2021 को आयकर
  अपीलीय अधिकरण, बेंगलुरु ने वर्ष 2011-12 के आकलन को लेकर विवाद में ट्रस्ट के पक्ष में मुख्यतः
  निर्णय दिया, अपील को सांख्यिकीय प्रयोजन हेतु स्वीकृत मानते हुए कुछ मुद्दे निर्धारण अधिकारी को
  पुनर्विचार हेतु लौटाए। उपलब्ध अभिलेख में आंध्र प्रदेश उच्च न्यायालय में ट्रस्ट के सरकारी अधिग्रहण
  या जांच की माँग वाली किसी याचिका की पुष्टि नहीं हो सकी।
hi_reviewed: false
response_from_subject:
  text_en: >
    Announcing the final inventory of the Bangalore ashram on 21 July 2011, trust media
    coordinator Prof A. Anantharaman said: "We've paid Rs 4.81 crore towards tax, based on the
    value of the inventory done on the three days... With this final inventory, the listing of
    the wealth possessed by Sri Sathya Sai Central Trust concludes." On the Yajur Mandir cash,
    trust member and Sai Baba's nephew R.J. Rathnakar said: "The cash found in Yajur Mandir has
    been deposited in the account of the trust in State Bank of India Prasanthi Nilayam
    branch," and that no will had been found. On the intercepted vehicle, trust member V.
    Srinivasan initially denied any trust connection to the cash before saying it had been
    collected by Rathnakar from devotees to fund a memorial ("mahasamadhi") for Sai Baba and
    was being sent to a contractor.
  text_hi: >
    21 जुलाई 2011 को बेंगलुरु आश्रम की अंतिम गणना की घोषणा करते हुए ट्रस्ट के मीडिया समन्वयक प्रो.
    ए. अनंतरामन ने कहा: "हमने तीन दिनों में हुई गणना के मूल्य के आधार पर 4.81 करोड़ रुपये कर के रूप
    में चुकाए हैं... इस अंतिम गणना के साथ श्री सत्य साईं सेंट्रल ट्रस्ट के पास मौजूद संपत्ति की
    सूची पूरी होती है।" यजुर मंदिर की नकदी पर, ट्रस्ट सदस्य और साईं बाबा के भतीजे आर.जे. रत्नाकर ने
    कहा: "यजुर मंदिर में मिली नकदी को ट्रस्ट के भारतीय स्टेट बैंक, प्रशांति निलयम शाखा के खाते में
    जमा कर दिया गया है," और यह कि कोई वसीयत नहीं मिली। ज़ब्त गाड़ी पर, ट्रस्ट सदस्य वी. श्रीनिवासन
    ने पहले नकदी से ट्रस्ट के किसी संबंध से इनकार किया, फिर बताया कि यह राशि रत्नाकर ने साईं बाबा के
    एक स्मारक ("महासमाधि") के निर्माण हेतु भक्तों से एकत्र की थी और एक ठेकेदार को भेजी जा रही थी।
  source_id: sst-src-05

