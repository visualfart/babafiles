    statement_en: On 16 June 2011 trust members opened Yajur Mandir, Sathya Sai Baba's private chamber at Prasanthi Nilayam, which had remained closed since his hospitalisation on 28 March 2011.
    statement_hi: 16 जून 2011 को ट्रस्ट सदस्यों ने प्रशांति निलयम में सत्य साईं बाबा का निजी कक्ष यजुर मंदिर खोला, जो 28 मार्च 2011 को उनके अस्पताल में भर्ती होने के बाद से बंद था।
    tier: closed
    date: 2011-06-16
    source_ids: [sst-src-03, sst-src-02]
  - id: sst-claim-02
    statement_en: A 36-hour inventory of Yajur Mandir following its opening found 98 kg of gold (valued at about Rs 20 crore), 307 kg of silver (about Rs 1.6 crore) and Rs 11.56 crore in cash, witnessed by retired Supreme Court judge A.P. Mishra, retired Karnataka High Court judge Vaidyanathan and an income-tax department-approved assessor; trust member R.J. Rathnakar said no will was found.
    statement_hi: यजुर मंदिर खुलने के बाद 36 घंटे की गणना में 98 किलोग्राम सोना (लगभग 20 करोड़ रुपये मूल्य), 307 किलोग्राम चाँदी (लगभग 1.6 करोड़ रुपये) और 11.56 करोड़ रुपये नकद मिले, जिसके साक्षी सेवानिवृत्त सर्वोच्च न्यायालय न्यायाधीश ए.पी. मिश्रा, सेवानिवृत्त कर्नाटक उच्च न्यायालय न्यायाधीश वैद्यनाथन और आयकर विभाग द्वारा अनुमोदित एक मूल्यांकक थे; ट्रस्ट सदस्य आर.जे. रत्नाकर ने कहा कि कोई वसीयत नहीं मिली।
    tier: closed
    date: 2011-06-18
    source_ids: [sst-src-01, sst-src-02]
  - id: sst-claim-03
    statement_en: A further inspection of four rooms in Yajur Mandir on 2 July 2011 by Anantapur district authorities found gold, silver and a diamond ring worth a further Rs 76.89 lakh (116 kg of silver, 906 g of gold and a diamond ring), which had not figured in the trust's own earlier inventory.
    statement_hi: 2 जुलाई 2011 को अनंतपुर ज़िला प्रशासन द्वारा यजुर मंदिर के चार और कमरों के निरीक्षण में 76.89 लाख रुपये मूल्य का सोना, चाँदी और एक हीरे की अंगूठी (116 किलोग्राम चाँदी, 906 ग्राम सोना और एक हीरे की अंगूठी) मिली, जो ट्रस्ट की अपनी पूर्व गणना में शामिल नहीं थी।
    tier: closed
    date: 2011-07-02
    source_ids: [sst-src-04]
  - id: sst-claim-04
    statement_en: A three-day inventory at the trust's Brindavan ashram in Bangalore, concluding on 20 July 2011, found 6.09 kg of gold coins and jewellery, 245.368 kg of silver articles and Rs 80.5 lakh in cash; the trust said it paid Rs 4.81 crore in tax on the inventoried value and that the wealth-listing exercise had concluded.
    statement_hi: बेंगलुरु स्थित ट्रस्ट के बृंदावन आश्रम में 20 जुलाई 2011 को समाप्त हुई तीन दिवसीय गणना में 6.09 किलोग्राम सोने के सिक्के और आभूषण, 245.368 किलोग्राम चाँदी की वस्तुएँ और 80.5 लाख रुपये नकद मिले; ट्रस्ट ने कहा कि उसने गणना किए गए मूल्य पर 4.81 करोड़ रुपये कर चुकाया और संपत्ति सूचीकरण का कार्य पूरा हो गया है।
    tier: closed
    date: 2011-07-20
    source_ids: [sst-src-05]
  - id: sst-claim-05
    case_id: sathya-sai-central-trust-cash-vehicle-seizure-2011
    statement_en: On 18 June 2011 Andhra Pradesh police seized Rs 35.5 lakh in cash from a vehicle at the Kodikonda checkpost near the Karnataka border, arrested three men including the driver, and later called trust member V. Srinivasan and Sai Baba's nephew R.J. Rathnakar for questioning; Srinivasan said the cash had been collected by Rathnakar from devotees to fund a memorial for Sai Baba.
    statement_hi: 18 जून 2011 को आंध्र प्रदेश पुलिस ने कर्नाटक सीमा के निकट कोडिकोंडा चेकपोस्ट पर एक गाड़ी से 35.5 लाख रुपये नकद ज़ब्त किए, चालक सहित तीन व्यक्तियों को गिरफ्तार किया, और बाद में ट्रस्ट सदस्य वी. श्रीनिवासन तथा साईं बाबा के भतीजे आर.जे. रत्नाकर को पूछताछ हेतु बुलाया; श्रीनिवासन ने कहा कि यह नकदी रत्नाकर ने साईं बाबा के एक स्मारक के लिए भक्तों से एकत्र की थी।
    tier: closed
    date: 2011-06-18
    source_ids: [sst-src-04, sst-src-06]
  - id: sst-claim-06
    case_id: sathya-sai-central-trust-itat-2011-12-assessment
    statement_en: On 20 December 2021 the Income Tax Appellate Tribunal, Bangalore ruled largely in the trust's favour on its 2011-12 assessment appeal, treating it as allowed for statistical purposes and remanding some issues to the assessing officer.
    statement_hi: 20 दिसंबर 2021 को आयकर अपीलीय अधिकरण, बेंगलुरु ने ट्रस्ट की 2011-12 आकलन वर्ष की अपील पर मुख्यतः उसके पक्ष में निर्णय दिया, इसे सांख्यिकीय प्रयोजन हेतु स्वीकृत मानते हुए कुछ मुद्दे निर्धारण अधिकारी को पुनर्विचार हेतु लौटाए।
    tier: closed
    date: 2021-12-20
    source_ids: [sst-src-07]

