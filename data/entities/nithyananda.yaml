summary_en: >
  Nithyananda is a Bidadi (Karnataka) based religious leader who was arrested in 2010 after a rape
  complaint by a former disciple; charges under IPC 376, 377, 420, 114, 201 and 120B were framed
  against him by the III Additional District and Sessions Court, Ramanagara on 6 June 2018. The
  Karnataka High Court cancelled his 2010 bail on 5 February 2020, recording that he had not
  appeared before the trial court since 5 June 2018 and had "run away to a foreign country to
  escape the trial"; the trial court has since issued non-bailable warrants (2020, 2022). A
  separate 2019 Gujarat FIR concerns the alleged confinement of children at his Ahmedabad
  ashram. Since December 2019 he has presented himself abroad as head of the "United States of
  Kailasa", whose representatives have been rebuffed by the city of Newark (2023), the UN human
  rights office (2023), Paraguay's agriculture ministry (2023) and Bolivia's migration authority
  (2025). He and his organisation deny every allegation.
summary_hi: >
  नित्यानंद बीदड़ी (कर्नाटक) स्थित एक धार्मिक नेता हैं, जिन्हें 2010 में एक पूर्व शिष्या की बलात्कार
  की शिकायत के बाद गिरफ्तार किया गया था; रामनगर के तृतीय अतिरिक्त जिला एवं सत्र न्यायालय ने
  6 जून 2018 को उन पर आईपीसी की धारा 376, 377, 420, 114, 201 और 120बी के तहत आरोप तय किए।
  कर्नाटक उच्च न्यायालय ने 5 फरवरी 2020 को उनकी 2010 की जमानत रद्द कर दी और दर्ज किया कि वे
  5 जून 2018 से ट्रायल कोर्ट में उपस्थित नहीं हुए हैं और "मुकदमे से बचने के लिए विदेश भाग गए हैं";
  उसके बाद ट्रायल कोर्ट ने गैर-जमानती वारंट (2020, 2022) जारी किए। 2019 की एक अलग गुजरात
  एफआईआर उनके अहमदाबाद आश्रम में बच्चों को कथित रूप से बंधक रखने से संबंधित है। दिसंबर 2019 से वे
  विदेश में स्वयं को "यूनाइटेड स्टेट्स ऑफ कैलासा" का प्रमुख बताते हैं, जिसके प्रतिनिधियों को नेवार्क शहर
  (2023), संयुक्त राष्ट्र मानवाधिकार कार्यालय (2023), पराग्वे के कृषि मंत्रालय (2023) और बोलीविया के
  प्रवासन प्राधिकरण (2025) ने अस्वीकार किया है। वे और उनका संगठन हर आरोप से इनकार करते हैं।
hi_reviewed: false
response_from_subject:
  text_en: >
    The press office of Nithyananda's organisation ("Kailasa") stated on 17 March 2023 that the
    rape case is "absolutely false", that "many prominent human rights advocates have given
    independent reports and legal opinions attesting this", that he "did not 'jump bail' but was
    out on bail when he left India as he was entitled to do", that he is "not a fugitive but a
    persecuted individual", and that "Kailasa and its representatives have not scammed anyone,
    nor are we 'fiction'". In April 2025 the organisation said he was "alive, safe, and active"
    and described reporting about him as "a malicious smear campaign".
  text_hi: >
    नित्यानंद के संगठन ("कैलासा") के प्रेस कार्यालय ने 17 मार्च 2023 को कहा कि बलात्कार का मामला
    "पूरी तरह झूठा" है, कि "कई प्रमुख मानवाधिकार अधिवक्ताओं ने इसकी पुष्टि करने वाली स्वतंत्र रिपोर्टें
    और कानूनी राय दी हैं", कि उन्होंने "जमानत नहीं तोड़ी बल्कि जमानत पर रहते हुए भारत छोड़ा, जिसका उन्हें
    अधिकार था", कि वे "भगोड़े नहीं बल्कि उत्पीड़ित व्यक्ति" हैं, और कि "कैलासा और उसके प्रतिनिधियों ने
    किसी को ठगा नहीं है, न ही हम 'काल्पनिक' हैं"। अप्रैल 2025 में संगठन ने कहा कि वे "जीवित, सुरक्षित
    और सक्रिय" हैं और उनके बारे में रिपोर्टिंग को "दुर्भावनापूर्ण बदनामी अभियान" बताया।
  source_id: nithyananda-src-28

