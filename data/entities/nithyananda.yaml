cases:
  - id: nithyananda-ramanagara-rape-2010
    title_en: State by Bidadi Police v. Paramahamsa Nithyanandaswamy @ Rajashekaran and others (Ramanagara, rape)
    title_hi: राज्य (बीदड़ी पुलिस) बनाम परमहंस नित्यानंदस्वामी उर्फ राजशेखरन एवं अन्य (रामनगर, बलात्कार)
    jurisdiction_country: IN
    jurisdiction_region: Karnataka
    court: III Additional District and Sessions Court, Ramanagara
    case_number: S.C. No. 86/2014 (Crime Nos. 141/2010 and 142/2010, Bidadi PS)
    filed_year: 2010
    case_type: criminal
    statutes: [IPC 376, IPC 377, IPC 420, IPC 114, IPC 201, IPC 120B, IPC 295A, IPC 506]
    status: Charges framed 6 June 2018; trial stalled in the accused's absence; bail cancelled by Karnataka High Court 5 February 2020; non-bailable warrants of 19 February 2020 and 18 August 2022 unexecuted
    tier: wanted
    verdict_date:
    sentence_or_remedy:
    appeal_status: No verdict yet; the complainant's transfer plea was refused by the High Court on 18 February 2020 with a direction to expedite the trial
    summary_en: >
      A former disciple's complaint, first lodged with Chennai police in 2010 and transferred to
      Bidadi police station (Crime Nos. 141/2010 and 142/2010), led to Nithyananda's arrest in
      April 2010 and bail from the Karnataka High Court on 11 June 2010. After a Supreme Court
      direction in December 2017, the Ramanagara sessions court framed charges on 6 June 2018
      under IPC 376, 377, 420, 114, 201 and 120B against him and five co-accused. He has not
      appeared since 5 June 2018. A September 2018 non-bailable warrant was set aside by the High
      Court in January 2019, but on 5 February 2020 the High Court cancelled his bail, finding he
      had "run away to a foreign country to escape the trial", and directed the trial court to take
      him into custody. Fresh non-bailable warrants followed on 19 February 2020 and 18 August
      2022; three prosecution witnesses had been examined when the trial stalled. No verdict has
      been delivered. He denies the allegations.
    summary_hi: >
      एक पूर्व शिष्या की शिकायत, जो 2010 में पहले चेन्नई पुलिस में दर्ज हुई और फिर बीदड़ी थाने
      (अपराध सं. 141/2010 और 142/2010) को स्थानांतरित हुई, के बाद अप्रैल 2010 में नित्यानंद की
      गिरफ्तारी हुई और 11 जून 2010 को कर्नाटक उच्च न्यायालय से जमानत मिली। दिसंबर 2017 के सर्वोच्च
      न्यायालय के निर्देश के बाद रामनगर सत्र न्यायालय ने 6 जून 2018 को उन पर और पाँच सह-अभियुक्तों पर
      आईपीसी 376, 377, 420, 114, 201 और 120बी के तहत आरोप तय किए। वे 5 जून 2018 से उपस्थित नहीं
      हुए हैं। सितंबर 2018 का गैर-जमानती वारंट जनवरी 2019 में उच्च न्यायालय ने रद्द किया, किंतु
      5 फरवरी 2020 को उच्च न्यायालय ने यह पाते हुए कि वे "मुकदमे से बचने के लिए विदेश भाग गए हैं",
      उनकी जमानत रद्द कर दी और ट्रायल कोर्ट को उन्हें हिरासत में लेने का निर्देश दिया। 19 फरवरी 2020
      और 18 अगस्त 2022 को नए गैर-जमानती वारंट जारी हुए; मुकदमा रुकने से पहले तीन अभियोजन गवाहों
      की जाँच हो चुकी थी। अभी तक कोई फैसला नहीं आया है। वे आरोपों से इनकार करते हैं।
    source_ids: [nithyananda-src-01, nithyananda-src-02, nithyananda-src-03, nithyananda-src-06, nithyananda-src-07, nithyananda-src-12, nithyananda-src-32]

  - id: nithyananda-ahmedabad-children-fir-2019
    title_en: FIR C.R. No. I-138/2019, Vivekanand police station, Ahmedabad Rural (children at Yogini Sarvagyapeetham)
    title_hi: एफआईआर सी.आर. सं. I-138/2019, विवेकानंद थाना, अहमदाबाद ग्रामीण (योगिनी सर्वज्ञपीठम में बच्चे)
    jurisdiction_country: IN
    jurisdiction_region: Gujarat
    court: Ahmedabad Rural court (remand); FIR recorded in Gujarat High Court R/SCR.A/9973/2019
    case_number: C.R. No. I-138 of 2019
    filed_year: 2019
    case_type: criminal
    statutes: [IPC 365, IPC 344, IPC 323, IPC 504, IPC 506, IPC 114, Child Labour (Prohibition and Regulation) Act 1986 s.14]
    status: FIR registered 17 November 2019; two associates arrested 19 November 2019; police reported a chargesheet filed by January 2020; Nithyananda not arrested, reported by police to have left India
    tier: under_investigation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      On 17 November 2019 Ahmedabad Rural police registered FIR C.R. No. I-138/2019 at Vivekanand
      police station (Hathijan) on the complaint of Janardhana Sharma, a Bengaluru resident whose
      children had been moved from the Bidadi gurukul to the Yogini Sarvagyapeetham facility
      affiliated to Nithyananda Dhyanpeetham. Police alleged that children were confined in a flat
      and made to work to raise donations. Two women associates, Pranpriyanand and Riddhi Kiran,
      were arrested on 19 November 2019 and remanded to police custody; Nithyananda was booked
      but police said he had left the country. In January 2020 Gujarat Police said a chargesheet
      had been filed in a local court. The Gujarat High Court's 2024 habeas corpus judgment records
      the FIR; no trial outcome against Nithyananda is on record. The organisation denies the
      allegations.
    summary_hi: >
      17 नवंबर 2019 को अहमदाबाद ग्रामीण पुलिस ने विवेकानंद थाने (हाथीजण) में बेंगलुरु निवासी
      जनार्दन शर्मा की शिकायत पर एफआईआर सी.आर. सं. I-138/2019 दर्ज की, जिनके बच्चों को बीदड़ी
      गुरुकुल से नित्यानंद ध्यानपीठम से संबद्ध योगिनी सर्वज्ञपीठम में स्थानांतरित किया गया था। पुलिस
      का आरोप था कि बच्चों को एक फ्लैट में बंद रखा गया और दान जुटाने के लिए काम कराया गया। दो महिला
      सहयोगियों, प्राणप्रियानंद और ऋद्धि किरण, को 19 नवंबर 2019 को गिरफ्तार कर पुलिस हिरासत में भेजा
      गया; नित्यानंद पर मामला दर्ज हुआ किंतु पुलिस ने कहा कि वे देश छोड़ चुके हैं। जनवरी 2020 में गुजरात
      पुलिस ने कहा कि स्थानीय अदालत में आरोपपत्र दाखिल किया गया है। गुजरात उच्च न्यायालय के 2024 के
      बंदी प्रत्यक्षीकरण निर्णय में यह एफआईआर दर्ज है; नित्यानंद के विरुद्ध कोई ट्रायल परिणाम रिकॉर्ड
      पर नहीं है। संगठन आरोपों से इनकार करता है।
    source_ids: [nithyananda-src-04, nithyananda-src-13, nithyananda-src-14, nithyananda-src-31]

  - id: nithyananda-gujarat-hc-habeas-2019
    title_en: Janardhana Ramkrishna Sharma v. State of Gujarat (habeas corpus, Gujarat High Court)
    title_hi: जनार्दन रामकृष्ण शर्मा बनाम गुजरात राज्य (बंदी प्रत्यक्षीकरण, गुजरात उच्च न्यायालय)
    jurisdiction_country: IN
    jurisdiction_region: Gujarat
    court: Gujarat High Court (Division Bench, Kogje and Sareen JJ.)
    case_number: R/SCR.A/9973/2019
    filed_year: 2019
    case_type: civil
    statutes: [Constitution of India Art. 226 (habeas corpus)]
    status: Dismissed 2 February 2024
    tier: closed
    verdict_date: 2024-02-02
    sentence_or_remedy: Petition dismissed; notice discharged; recording of the video interaction preserved
    appeal_status: None on record
    summary_en: >
      The father of two adult daughters living at Nithyananda's institutions sought a writ of
      habeas corpus in November 2019 alleging unlawful confinement. On 2 February 2024 a Division
      Bench dismissed the petition after the daughters, aged 21 and 18 and by then abroad, appeared
      by video link and filed affidavits stating they had left India of their own free will and
      were "safe, happy, and free". The court found them "adults, mature enough to understand
      their well being". This outcome was in the ashram's favour and is shown with equal
      prominence to the adverse records.
    summary_hi: >
      नित्यानंद की संस्थाओं में रह रही दो वयस्क बेटियों के पिता ने नवंबर 2019 में अवैध बंधक बनाए जाने
      का आरोप लगाते हुए बंदी प्रत्यक्षीकरण याचिका दायर की। 2 फरवरी 2024 को खंडपीठ ने याचिका खारिज
      कर दी, जब 21 और 18 वर्ष की बेटियों ने, जो तब तक विदेश में थीं, वीडियो लिंक से उपस्थित होकर
      शपथपत्र दिए कि उन्होंने अपनी इच्छा से भारत छोड़ा और वे "सुरक्षित, प्रसन्न और स्वतंत्र" हैं।
      न्यायालय ने उन्हें "अपना हित समझने योग्य परिपक्व वयस्क" पाया। यह परिणाम आश्रम के पक्ष में रहा
      और इसे प्रतिकूल अभिलेखों के समान प्रमुखता दी गई है।
    source_ids: [nithyananda-src-04]

  - id: nithyananda-madras-hc-hrce-2017
    title_en: Sri Nithyananda Swami v. The Commissioner, HR&CE (Madras High Court)
    title_hi: श्री नित्यानंद स्वामी बनाम आयुक्त, हिंदू धार्मिक एवं धर्मार्थ बंदोबस्ती (मद्रास उच्च न्यायालय)
    jurisdiction_country: IN
    jurisdiction_region: Tamil Nadu
    court: Madras High Court (Dhandapani J.)
    case_number: W.P. No. 21276 of 2017
    filed_year: 2017
    case_type: regulatory
    statutes: [Tamil Nadu HR&CE Act 1959 s.60]
    status: Writ petition dismissed 4 September 2024
    tier: regulatory_action
    verdict_date: 2024-09-04
    sentence_or_remedy: HR&CE Commissioner's order of 22 June 2017 appointing an Executive Officer to administer the mutt properties upheld
    appeal_status: Not located on the record consulted
    summary_en: >
      Nithyananda, as founder of Nithyananda Dhyanapeetam, Bidadi, challenged the Tamil Nadu
      HR&CE Commissioner's order of 22 June 2017 appointing an Executive Officer over mutt
      properties he claimed by nomination. On 4 September 2024 the Madras High Court dismissed the
      petition, holding that the nomination in his favour was invalid because the power under
      which it was made had been cancelled, and recording that "the whereabouts of the 1st
      petitioner is now not known".
    summary_hi: >
      नित्यानंद ने, बीदड़ी के नित्यानंद ध्यानपीठम के संस्थापक के रूप में, तमिलनाडु एचआर एंड सीई
      आयुक्त के 22 जून 2017 के उस आदेश को चुनौती दी जिसमें उनके द्वारा नामांकन के आधार पर दावा की गई
      मठ संपत्तियों पर कार्यकारी अधिकारी नियुक्त किया गया था। 4 सितंबर 2024 को मद्रास उच्च न्यायालय ने
      याचिका खारिज कर दी, यह मानते हुए कि उनके पक्ष में नामांकन अवैध था क्योंकि जिस शक्ति के तहत वह
      किया गया था वह रद्द हो चुकी थी, और दर्ज किया कि "प्रथम याचिकाकर्ता का ठिकाना अब ज्ञात नहीं है"।
    source_ids: [nithyananda-src-05]

  - id: kailasa-newark-sister-city-2023
    title_en: City of Newark "sister city" ceremony with "United States of Kailasa" and its rescission
    title_hi: नेवार्क शहर का "यूनाइटेड स्टेट्स ऑफ कैलासा" के साथ "सिस्टर सिटी" समारोह और उसका निरस्तीकरण
    jurisdiction_country: US
    jurisdiction_region: New Jersey
    court: City of Newark (municipal administration; no court proceeding)
    case_number:
    filed_year: 2023
    case_type: regulatory
    statutes: []
    status: Agreement signed 12 January 2023 and declared "groundless and void" by the city on 18 January 2023
    tier: allegation
    verdict_date:
    sentence_or_remedy: Sister-city agreement rescinded; city said no money changed hands
    appeal_status:
    summary_en: >
      On 12 January 2023 representatives of the "United States of Kailasa" took part in a
      sister-city ceremony at Newark City Hall attended by Mayor Ras Baraka. On 18 January 2023 the
      city rescinded the agreement; its press secretary Susan Garofalo said that "based on
      deception, the ceremony was groundless and void" and that the incident was "regrettable".
      No court or prosecutor action is on record, and the city's own statement could not be
      retrieved from newarknj.gov, so this entry rests on major-outlet reporting only. The
      organisation says it "has not scammed anyone".
    summary_hi: >
      12 जनवरी 2023 को "यूनाइटेड स्टेट्स ऑफ कैलासा" के प्रतिनिधियों ने नेवार्क सिटी हॉल में
      महापौर रास बराका की उपस्थिति में सिस्टर-सिटी समारोह में भाग लिया। 18 जनवरी 2023 को शहर ने
      समझौता निरस्त कर दिया; प्रेस सचिव सूज़न गारोफालो ने कहा कि "धोखे पर आधारित होने के कारण समारोह
      निराधार और शून्य था" और घटना "खेदजनक" थी। कोई अदालती या अभियोजन कार्रवाई रिकॉर्ड पर नहीं है,
      और शहर का अपना बयान newarknj.gov से प्राप्त नहीं हो सका, इसलिए यह प्रविष्टि केवल प्रमुख
      समाचार-स्रोतों पर आधारित है। संगठन कहता है कि उसने "किसी को ठगा नहीं है"।
    source_ids: [nithyananda-src-19, nithyananda-src-20]

  - id: kailasa-paraguay-mag-2023
    title_en: Paraguay Ministry of Agriculture and Livestock (MAG) removes chief of staff over document signed with "Kailasa"
    title_hi: पराग्वे के कृषि एवं पशुधन मंत्रालय (एमएजी) ने "कैलासा" के साथ हस्ताक्षरित दस्तावेज़ पर चीफ ऑफ स्टाफ को हटाया
    jurisdiction_country: PY
    jurisdiction_region:
    court: Ministerio de Agricultura y Ganadería (administrative; no court proceeding)
    case_number: MAG Resolution 554 (appointment of interim chief of staff)
    filed_year: 2023
    case_type: regulatory
    statutes: []
    status: Official removed 29 November 2023; ministry said the document "cannot be considered official"
    tier: allegation
    verdict_date:
    sentence_or_remedy: Chief of staff Arnaldo Chamorro removed; document disowned by the ministry
    appeal_status:
    summary_en: >
      In October 2023 representatives of "Kailasa" met officials of Paraguay's agriculture
      ministry, and chief of staff Arnaldo Chamorro signed, on ministry letterhead, a document
      saluting "Nithyananda Paramashivam, sovereign of the United States of Kailasa" and
      recommending diplomatic relations. On 29 November 2023 the ministry removed Chamorro and
      stated that the memorandum "cannot be considered official" and created no obligation for
      Paraguay. The ministry's communiqué could not be retrieved from mag.gov.py, so this entry
      rests on AFP and Última Hora reporting.
    summary_hi: >
      अक्टूबर 2023 में "कैलासा" के प्रतिनिधियों ने पराग्वे के कृषि मंत्रालय के अधिकारियों से मुलाकात
      की, और चीफ ऑफ स्टाफ अर्नाल्डो चामोरो ने मंत्रालय के लेटरहेड पर एक दस्तावेज़ पर हस्ताक्षर किए
      जिसमें "यूनाइटेड स्टेट्स ऑफ कैलासा के संप्रभु नित्यानंद परमशिवम" का अभिवादन और राजनयिक संबंधों
      की सिफारिश थी। 29 नवंबर 2023 को मंत्रालय ने चामोरो को हटा दिया और कहा कि ज्ञापन "आधिकारिक नहीं
      माना जा सकता" और इससे पराग्वे पर कोई दायित्व नहीं बनता। मंत्रालय की विज्ञप्ति mag.gov.py से
      प्राप्त नहीं हो सकी, इसलिए यह प्रविष्टि एएफपी और अल्टिमा ओरा की रिपोर्टिंग पर आधारित है।
    source_ids: [nithyananda-src-22, nithyananda-src-23]

  - id: kailasa-bolivia-expulsion-2025
    title_en: Bolivia's Dirección General de Migración orders the departure of 20 "Kailasa" members; Beni prosecutor opens land-trafficking inquiry
    title_hi: बोलीविया के प्रवासन महानिदेशालय ने 20 "कैलासा" सदस्यों के निष्कासन का आदेश दिया; बेनी अभियोजक ने भूमि-तस्करी जाँच शुरू की
    jurisdiction_country: BO
    jurisdiction_region: Beni and Santa Cruz
    court: Dirección General de Migración (administrative); Fiscalía Departamental del Beni (investigation)
    case_number:
    filed_year: 2025
    case_type: immigration
    statutes: [Constitution of Bolivia Arts. 394 and 396 (cited by the Ministry of Rural Development)]
    status: 20 foreign nationals expelled 24 March 2025; prosecutor's investigation for tráfico de tierras and organización criminal opened; no charge against Nithyananda personally on record
    tier: allegation
    verdict_date:
    sentence_or_remedy: Mandatory departure ("salida obligatoria") of 20 people; earlier removal of three Irish nationals from the Cayubaba territory
    appeal_status: A habeas corpus action on behalf of the group was reported rejected
    summary_en: >
      Bolivian reporting in March 2025 revealed that representatives of "Kailasa" had signed
      documents with leaders of the Baure, Cayubaba and Esse Ejja peoples purporting to lease
      roughly 480,000 hectares of Amazonian land for 1,000 years against annual payments. On 24
      March 2025 the Dirección General de Migración, under director Katherine Calderón, ordered
      the mandatory departure of 20 people (Chinese, Indian, Swedish, US, German, British and
      Portuguese nationals) found in Santa Cruz and Beni, saying they had entered as tourists and
      held "documentos firmados de transferencias de tierras benianas, algo ilegal". Beni
      prosecutor Gerardo Balderas opened an investigation for land trafficking and criminal
      organisation. No Bolivian government or prosecutor web page could be retrieved, so the
      entry rests on Los Tiempos, Infobae and Mongabay reporting. Kailasa called the expulsion a
      "racist" attack and "Hinduphobia".
    summary_hi: >
      मार्च 2025 में बोलीविया की रिपोर्टिंग से पता चला कि "कैलासा" के प्रतिनिधियों ने बाउरे, कायुबाबा
      और एस्से एज्जा समुदायों के नेताओं के साथ ऐसे दस्तावेज़ों पर हस्ताक्षर किए थे जिनमें लगभग 4,80,000
      हेक्टेयर अमेज़न भूमि को वार्षिक भुगतान के बदले 1,000 वर्षों के लिए पट्टे पर देने का दावा था।
      24 मार्च 2025 को प्रवासन महानिदेशालय ने, निदेशक कैथरीन काल्देरोन के अधीन, सांता क्रूज़ और बेनी
      में मिले 20 लोगों (चीनी, भारतीय, स्वीडिश, अमेरिकी, जर्मन, ब्रिटिश और पुर्तगाली नागरिकों) के
      अनिवार्य प्रस्थान का आदेश दिया, यह कहते हुए कि वे पर्यटक बनकर आए थे और उनके पास "बेनी की भूमि
      हस्तांतरण के हस्ताक्षरित दस्तावेज़ थे, जो अवैध है"। बेनी के अभियोजक गेरार्डो बाल्देरास ने
      भूमि-तस्करी और आपराधिक संगठन की जाँच शुरू की। बोलीविया सरकार या अभियोजक का कोई वेब पृष्ठ प्राप्त
      नहीं हो सका, इसलिए यह प्रविष्टि लॉस तिएम्पोस, इन्फोबे और मोंगाबे की रिपोर्टिंग पर आधारित है।
      कैलासा ने निष्कासन को "नस्लवादी" हमला और "हिंदूफोबिया" बताया।
    source_ids: [nithyananda-src-24, nithyananda-src-25, nithyananda-src-26, nithyananda-src-33]

claims:
  - id: nithyananda-claim-01
    case_id: nithyananda-ramanagara-rape-2010
    statement_en: In 2010 Bidadi police registered Crime Nos. 141/2010 and 142/2010 against Nithyananda (then described as "formerly known as Sri Thiru Rajashekarem") under IPC 295A, 376, 377, 420, 506(1) and 120B, transferred from Chennai CCB Crime No. 112/2010; he was arrested outside Karnataka and brought to Bangalore.
    statement_hi: 2010 में बीदड़ी पुलिस ने नित्यानंद (तब "पूर्व में श्री थिरु राजशेखरम के नाम से ज्ञात") के विरुद्ध आईपीसी 295ए, 376, 377, 420, 506(1) और 120बी के तहत अपराध सं. 141/2010 और 142/2010 दर्ज किए, जो चेन्नई सीसीबी अपराध सं. 112/2010 से स्थानांतरित हुए; उन्हें कर्नाटक के बाहर गिरफ्तार कर बेंगलुरु लाया गया।
    tier: under_investigation
    date: 2010-04
    source_ids: [nithyananda-src-01]
  - id: nithyananda-claim-02
    case_id: nithyananda-ramanagara-rape-2010
    statement_en: On 11 June 2010 the Karnataka High Court granted Nithyananda bail in Crl.P. No. 2328/2010 on a personal bond of Rs 1,00,000 with two sureties, observing that no witness had come forward and no evidence had so far been collected, and imposing conditions including fortnightly reporting to police and not leaving the jurisdiction without permission.
    statement_hi: 11 जून 2010 को कर्नाटक उच्च न्यायालय ने आपराधिक याचिका सं. 2328/2010 में नित्यानंद को 1,00,000 रुपये के व्यक्तिगत बंधपत्र और दो जमानतदारों पर जमानत दी, यह टिप्पणी करते हुए कि कोई गवाह सामने नहीं आया और अब तक कोई साक्ष्य एकत्र नहीं हुआ, और पखवाड़े में एक बार पुलिस को रिपोर्ट करने तथा अनुमति के बिना क्षेत्राधिकार न छोड़ने जैसी शर्तें लगाईं।
    tier: under_investigation
    date: 2010-06-11
    source_ids: [nithyananda-src-01]
  - id: nithyananda-claim-03
    case_id: nithyananda-ramanagara-rape-2010
    statement_en: On 6 June 2018 the III Additional District and Sessions Court, Ramanagara framed charges in S.C. No. 86/2014 against Nithyananda and five co-accused under IPC 376, 377, 420, 114, 201 and 120B.
    statement_hi: 6 जून 2018 को रामनगर के तृतीय अतिरिक्त जिला एवं सत्र न्यायालय ने एस.सी. सं. 86/2014 में नित्यानंद और पाँच सह-अभियुक्तों के विरुद्ध आईपीसी 376, 377, 420, 114, 201 और 120बी के तहत आरोप तय किए।
    tier: charged
    date: 2018-06-06
    source_ids: [nithyananda-src-06, nithyananda-src-02, nithyananda-src-03]
  - id: nithyananda-claim-04
    case_id: nithyananda-ramanagara-rape-2010
    statement_en: On 16 January 2019 the Karnataka High Court (Dinesh Kumar J.) set aside the Ramanagara trial court's order of 6 September 2018 that had rejected Nithyananda's exemption application and issued a non-bailable warrant against him, while stating that the order would not preclude the sessions judge from directing his presence on future dates.
    statement_hi: 16 जनवरी 2019 को कर्नाटक उच्च न्यायालय (न्यायमूर्ति दिनेश कुमार) ने रामनगर ट्रायल कोर्ट के 6 सितंबर 2018 के उस आदेश को रद्द कर दिया जिसमें नित्यानंद का छूट आवेदन खारिज कर उनके विरुद्ध गैर-जमानती वारंट जारी किया गया था, साथ ही कहा कि यह आदेश सत्र न्यायाधीश को भविष्य की तारीखों पर उनकी उपस्थिति का निर्देश देने से नहीं रोकेगा।
    tier: closed
    date: 2019-01-16
    source_ids: [nithyananda-src-02, nithyananda-src-07]
  - id: nithyananda-claim-05
    case_id: nithyananda-ramanagara-rape-2010
    statement_en: On 5 February 2020 the Karnataka High Court (John Michael Cunha J.) cancelled the bail granted to Nithyananda on 11 June 2010, recording that he had not appeared before the trial court since 5 June 2018, that his whereabouts were unknown to the prosecution and to the ashram in-charge, that his passport had expired on 30 September 2018, and that he "has run away to a foreign country to escape the trial"; the trial court was directed to take him into custody and enforce the security bonds.
    statement_hi: 5 फरवरी 2020 को कर्नाटक उच्च न्यायालय (न्यायमूर्ति जॉन माइकल कुन्हा) ने 11 जून 2010 को नित्यानंद को दी गई जमानत रद्द कर दी, यह दर्ज करते हुए कि वे 5 जून 2018 से ट्रायल कोर्ट में उपस्थित नहीं हुए, उनका ठिकाना अभियोजन और आश्रम प्रभारी दोनों को अज्ञात है, उनका पासपोर्ट 30 सितंबर 2018 को समाप्त हो चुका है, और वे "मुकदमे से बचने के लिए विदेश भाग गए हैं"; ट्रायल कोर्ट को उन्हें हिरासत में लेने और जमानत बंधपत्र लागू करने का निर्देश दिया गया।
    tier: wanted
    date: 2020-02-05
    source_ids: [nithyananda-src-03]
  - id: nithyananda-claim-06
    case_id: nithyananda-ramanagara-rape-2010
    statement_en: On 19 February 2020 the Ramanagara district court issued a non-bailable warrant against Nithyananda in Bidadi Police v. Paramahamsa Nithyanandaswamy @ Rajashekaran and declared that "the personal bond executed by him stands forfeited".
    statement_hi: 19 फरवरी 2020 को रामनगर जिला न्यायालय ने बीदड़ी पुलिस बनाम परमहंस नित्यानंदस्वामी उर्फ राजशेखरन में नित्यानंद के विरुद्ध गैर-जमानती वारंट जारी किया और घोषित किया कि "उनके द्वारा निष्पादित व्यक्तिगत बंधपत्र जब्त माना जाता है"।
    tier: wanted
    date: 2020-02-19
    source_ids: [nithyananda-src-32, nithyananda-src-03]
  - id: nithyananda-claim-07
    case_id: nithyananda-ramanagara-rape-2010
    statement_en: On 18 August 2022 the III Additional District and Sessions Court, Ramanagara issued a fresh non-bailable warrant against Nithyananda, returnable by 23 September 2022; three prosecution witnesses had been examined and the trial had stalled for about three years in his absence.
    statement_hi: 18 अगस्त 2022 को रामनगर के तृतीय अतिरिक्त जिला एवं सत्र न्यायालय ने नित्यानंद के विरुद्ध नया गैर-जमानती वारंट जारी किया, जो 23 सितंबर 2022 तक तामील योग्य था; तीन अभियोजन गवाहों की जाँच हो चुकी थी और उनकी अनुपस्थिति में मुकदमा लगभग तीन वर्षों से रुका हुआ था।
    tier: wanted
    date: 2022-08-18
    source_ids: [nithyananda-src-12, nithyananda-src-03]
  - id: nithyananda-claim-08
    case_id: nithyananda-ahmedabad-children-fir-2019
    statement_en: On 17 November 2019 Ahmedabad Rural police registered FIR C.R. No. I-138/2019 at Vivekanand police station (Hathijan) on the complaint of Janardhana Sharma concerning his children at the Yogini Sarvagyapeetham facility affiliated to Nithyananda Dhyanpeetham; police booked Nithyananda and two associates under IPC 365, 344, 323, 504 and 506 and s.14 of the Child Labour (Prohibition and Regulation) Act.
    statement_hi: 17 नवंबर 2019 को अहमदाबाद ग्रामीण पुलिस ने विवेकानंद थाने (हाथीजण) में जनार्दन शर्मा की शिकायत पर, नित्यानंद ध्यानपीठम से संबद्ध योगिनी सर्वज्ञपीठम में उनके बच्चों के संबंध में, एफआईआर सी.आर. सं. I-138/2019 दर्ज की; पुलिस ने नित्यानंद और दो सहयोगियों पर आईपीसी 365, 344, 323, 504 और 506 तथा बाल श्रम (प्रतिषेध और विनियमन) अधिनियम की धारा 14 के तहत मामला दर्ज किया।
    tier: under_investigation
    date: 2019-11-17
    source_ids: [nithyananda-src-04, nithyananda-src-13, nithyananda-src-31]
  - id: nithyananda-claim-09
    case_id: nithyananda-ahmedabad-children-fir-2019
    statement_en: On 19 November 2019 Gujarat police arrested two women associates of Nithyananda, Pranpriyanand and Riddhi Kiran, on charges including kidnapping, assault and unlawful confinement of children; an Ahmedabad Rural court remanded them to five days' police custody.
    statement_hi: 19 नवंबर 2019 को गुजरात पुलिस ने नित्यानंद की दो महिला सहयोगियों, प्राणप्रियानंद और ऋद्धि किरण, को बच्चों के अपहरण, मारपीट और अवैध बंधक बनाने सहित आरोपों में गिरफ्तार किया; अहमदाबाद ग्रामीण अदालत ने उन्हें पाँच दिन की पुलिस हिरासत में भेजा।
    tier: under_investigation
    date: 2019-11-19
    source_ids: [nithyananda-src-13, nithyananda-src-04]
  - id: nithyananda-claim-10
    case_id: nithyananda-ahmedabad-children-fir-2019
    statement_en: On 21 November 2019 Ahmedabad (Rural) Superintendent of Police R.V. Asari said that Nithyananda had fled abroad and that police would seek his custody through proper channels if required; the Ministry of External Affairs said it had no formal information on his whereabouts.
    statement_hi: 21 नवंबर 2019 को अहमदाबाद (ग्रामीण) पुलिस अधीक्षक आर.वी. असारी ने कहा कि नित्यानंद विदेश भाग गए हैं और आवश्यकता पड़ने पर पुलिस उचित माध्यम से उनकी हिरासत माँगेगी; विदेश मंत्रालय ने कहा कि उसके पास उनके ठिकाने की कोई औपचारिक जानकारी नहीं है।
    tier: allegation
    date: 2019-11-21
    source_ids: [nithyananda-src-13]
  - id: nithyananda-claim-11
    statement_en: On 6 December 2019 MEA spokesperson Raveesh Kumar said at the weekly media briefing that Nithyananda's passport, issued in October 2008, had been cancelled before its September 2018 expiry, that his application for a fresh passport had been refused on an adverse police report, and that Indian missions abroad had been sensitised that he was wanted in criminal cases.
    statement_hi: 6 दिसंबर 2019 को विदेश मंत्रालय के प्रवक्ता रवीश कुमार ने साप्ताहिक मीडिया ब्रीफिंग में कहा कि अक्टूबर 2008 में जारी नित्यानंद का पासपोर्ट सितंबर 2018 की समाप्ति से पहले ही रद्द कर दिया गया था, नए पासपोर्ट के लिए उनका आवेदन प्रतिकूल पुलिस रिपोर्ट के आधार पर अस्वीकार किया गया, और विदेश स्थित भारतीय मिशनों को सूचित किया गया कि वे आपराधिक मामलों में वांछित हैं।
    tier: allegation
    date: 2019-12-06
    source_ids: [nithyananda-src-17]
  - id: nithyananda-claim-12
    statement_en: On 6 December 2019 the Embassy of Ecuador in New Delhi "categorically" denied that Ecuador had granted Nithyananda asylum or helped him buy land or an island in South America, and said his asylum request had been refused and he had left Ecuador.
    statement_hi: 6 दिसंबर 2019 को नई दिल्ली स्थित इक्वाडोर दूतावास ने "स्पष्ट रूप से" इनकार किया कि इक्वाडोर ने नित्यानंद को शरण दी या दक्षिण अमेरिका में भूमि या द्वीप खरीदने में उनकी मदद की, और कहा कि उनका शरण अनुरोध अस्वीकार कर दिया गया था और वे इक्वाडोर छोड़ चुके थे।
    tier: allegation
    date: 2019-12-06
    source_ids: [nithyananda-src-17]
  - id: nithyananda-claim-13
    case_id: nithyananda-ahmedabad-children-fir-2019
    statement_en: On 22 January 2020 Gujarat police (Deputy Superintendent K.T. Kamariya, Ahmedabad Rural) said that Interpol had issued a Blue Corner notice against Nithyananda that month at their request, a development they disclosed in a chargesheet filed in a local court.
    statement_hi: 22 जनवरी 2020 को गुजरात पुलिस (उप अधीक्षक के.टी. कामरिया, अहमदाबाद ग्रामीण) ने कहा कि इंटरपोल ने उनके अनुरोध पर उसी महीने नित्यानंद के विरुद्ध ब्लू कॉर्नर नोटिस जारी किया है, जिसकी जानकारी उन्होंने स्थानीय अदालत में दाखिल आरोपपत्र में दी।
    tier: allegation
    date: 2020-01-22
    source_ids: [nithyananda-src-15, nithyananda-src-14]
  - id: nithyananda-claim-14
    case_id: nithyananda-ahmedabad-children-fir-2019
    statement_en: Letters from Interpol's General Secretariat dated 26 February 2021 and 22 November 2022, reported in January 2023, state that "Nithyananda, also known as Swami Arunachalam Sri Nithyananda, is not subject to an Interpol Notice or diffusion as of November 2022", contradicting the Gujarat police statement of January 2020.
    statement_hi: इंटरपोल महासचिवालय के 26 फरवरी 2021 और 22 नवंबर 2022 के पत्र, जिनकी रिपोर्ट जनवरी 2023 में हुई, कहते हैं कि "नित्यानंद, जिन्हें स्वामी अरुणाचलम श्री नित्यानंद के नाम से भी जाना जाता है, नवंबर 2022 तक किसी इंटरपोल नोटिस या डिफ्यूज़न के अधीन नहीं हैं", जो जनवरी 2020 के गुजरात पुलिस के बयान का खंडन करता है।
    tier: allegation
    date: 2023-01-28
    source_ids: [nithyananda-src-16]
  - id: nithyananda-claim-15
    case_id: nithyananda-gujarat-hc-habeas-2019
    statement_en: On 2 February 2024 a Division Bench of the Gujarat High Court dismissed the habeas corpus petition R/SCR.A/9973/2019 concerning two adult daughters of the complainant living at Nithyananda's institutions, after they appeared by video link from abroad and affirmed that they had left India of their own free will and were not confined.
    statement_hi: 2 फरवरी 2024 को गुजरात उच्च न्यायालय की खंडपीठ ने शिकायतकर्ता की दो वयस्क बेटियों, जो नित्यानंद की संस्थाओं में रह रही थीं, से संबंधित बंदी प्रत्यक्षीकरण याचिका R/SCR.A/9973/2019 खारिज कर दी, जब उन्होंने विदेश से वीडियो लिंक द्वारा उपस्थित होकर पुष्टि की कि उन्होंने अपनी इच्छा से भारत छोड़ा और वे बंधक नहीं हैं।
    tier: closed
    date: 2024-02-02
    source_ids: [nithyananda-src-04]
  - id: nithyananda-claim-16
    case_id: nithyananda-madras-hc-hrce-2017
    statement_en: On 4 September 2024 the Madras High Court dismissed W.P. No. 21276 of 2017, in which Nithyananda challenged the HR&CE Commissioner's appointment of an Executive Officer over mutt properties, holding the nomination in his favour invalid and recording that "the whereabouts of the 1st petitioner is now not known".
    statement_hi: 4 सितंबर 2024 को मद्रास उच्च न्यायालय ने रिट याचिका सं. 21276/2017 खारिज कर दी, जिसमें नित्यानंद ने मठ संपत्तियों पर एचआर एंड सीई आयुक्त द्वारा कार्यकारी अधिकारी की नियुक्ति को चुनौती दी थी; न्यायालय ने उनके पक्ष में नामांकन को अवैध माना और दर्ज किया कि "प्रथम याचिकाकर्ता का ठिकाना अब ज्ञात नहीं है"।
    tier: regulatory_action
    date: 2024-09-04
    source_ids: [nithyananda-src-05]
  - id: nithyananda-claim-17
    case_id: kailasa-newark-sister-city-2023
    statement_en: On 18 January 2023 the City of Newark, New Jersey rescinded a sister-city agreement signed with representatives of the "United States of Kailasa" at a City Hall ceremony on 12 January 2023 attended by Mayor Ras Baraka; the city's press secretary said that "based on deception, the ceremony was groundless and void" and that no money had changed hands.
    statement_hi: 18 जनवरी 2023 को न्यू जर्सी के नेवार्क शहर ने 12 जनवरी 2023 को महापौर रास बराका की उपस्थिति में सिटी हॉल समारोह में "यूनाइटेड स्टेट्स ऑफ कैलासा" के प्रतिनिधियों के साथ हस्ताक्षरित सिस्टर-सिटी समझौता निरस्त कर दिया; शहर के प्रेस सचिव ने कहा कि "धोखे पर आधारित होने के कारण समारोह निराधार और शून्य था" और कोई धन का लेन-देन नहीं हुआ।
    tier: allegation
    date: 2023-01-18
    source_ids: [nithyananda-src-19, nithyananda-src-20]
  - id: nithyananda-claim-18
    statement_en: On 2 March 2023 the UN Office of the High Commissioner for Human Rights said that representatives of the "United States of Kailasa" had attended two public treaty-body meetings in Geneva on 22 and 24 February 2023, that they were prevented from distributing material, and that their statement at the CESCR general discussion was "tangential to the topic at hand" and "will not be taken into consideration by the Committee".
    statement_hi: 2 मार्च 2023 को संयुक्त राष्ट्र मानवाधिकार उच्चायुक्त कार्यालय ने कहा कि "यूनाइटेड स्टेट्स ऑफ कैलासा" के प्रतिनिधियों ने 22 और 24 फरवरी 2023 को जिनेवा में दो सार्वजनिक संधि-निकाय बैठकों में भाग लिया, उन्हें सामग्री वितरित करने से रोका गया, और सीईएससीआर की सामान्य चर्चा में उनका वक्तव्य "विषय से असंबद्ध" था और "समिति द्वारा विचार में नहीं लिया जाएगा"।
    tier: allegation
    date: 2023-03-02
    source_ids: [nithyananda-src-21]
  - id: nithyananda-claim-19
    case_id: kailasa-paraguay-mag-2023
    statement_en: On 29 November 2023 Paraguay's Ministry of Agriculture and Livestock removed its chief of staff Arnaldo Chamorro after he signed, on ministry letterhead, a document saluting "Nithyananda Paramashivam, sovereign of the United States of Kailasa" and recommending diplomatic relations; the ministry said the memorandum "cannot be considered official" and created no obligation for Paraguay.
    statement_hi: 29 नवंबर 2023 को पराग्वे के कृषि एवं पशुधन मंत्रालय ने अपने चीफ ऑफ स्टाफ अर्नाल्डो चामोरो को हटा दिया, जब उन्होंने मंत्रालय के लेटरहेड पर "यूनाइटेड स्टेट्स ऑफ कैलासा के संप्रभु नित्यानंद परमशिवम" का अभिवादन करने और राजनयिक संबंधों की सिफारिश करने वाले दस्तावेज़ पर हस्ताक्षर किए थे; मंत्रालय ने कहा कि ज्ञापन "आधिकारिक नहीं माना जा सकता" और इससे पराग्वे पर कोई दायित्व नहीं बनता।
    tier: allegation
    date: 2023-11-29
    source_ids: [nithyananda-src-22, nithyananda-src-23]
  - id: nithyananda-claim-20
    case_id: kailasa-bolivia-expulsion-2025
    statement_en: On 24 March 2025 Bolivia's Dirección General de Migración ordered the mandatory departure of 20 foreign nationals linked to "Kailasa" found in Santa Cruz and Beni, saying they had entered as tourists and held signed documents purporting to lease about 480,000 hectares of land from the Baure, Cayubaba and Esse Ejja peoples for 1,000 years; the Beni departmental prosecutor opened an investigation for land trafficking and criminal organisation.
    statement_hi: 24 मार्च 2025 को बोलीविया के प्रवासन महानिदेशालय ने सांता क्रूज़ और बेनी में मिले "कैलासा" से जुड़े 20 विदेशी नागरिकों के अनिवार्य प्रस्थान का आदेश दिया, यह कहते हुए कि वे पर्यटक बनकर आए थे और उनके पास बाउरे, कायुबाबा और एस्से एज्जा समुदायों से लगभग 4,80,000 हेक्टेयर भूमि 1,000 वर्षों के लिए पट्टे पर लेने का दावा करने वाले हस्ताक्षरित दस्तावेज़ थे; बेनी के विभागीय अभियोजक ने भूमि-तस्करी और आपराधिक संगठन की जाँच शुरू की।
    tier: allegation
    date: 2025-03-24
    source_ids: [nithyananda-src-24, nithyananda-src-25, nithyananda-src-33]
  - id: nithyananda-claim-21
    statement_en: In July 2023 the British Columbia cities of Surrey, Victoria and Nanaimo withdrew proclamations of a "Guru Purnima Day" that had been issued at the request of the "United States of Kailasa"; Surrey said its proclamation "was signed in error".
    statement_hi: जुलाई 2023 में ब्रिटिश कोलंबिया के सरे, विक्टोरिया और नानाइमो शहरों ने "यूनाइटेड स्टेट्स ऑफ कैलासा" के अनुरोध पर जारी "गुरु पूर्णिमा दिवस" की घोषणाएँ वापस ले लीं; सरे ने कहा कि उसकी घोषणा "गलती से हस्ताक्षरित हुई थी"।
    tier: allegation
    date: 2023-07-13
    source_ids: [nithyananda-src-27]

