    archive_url: https://web.archive.org/web/20260120191320/https://www.thelawadvice.com/news/relief-to-baba-dhirendra-shastri-of-bageshwar-dham-from-gujarat-high-court
    captured_at: 2026-09-08
    sha256: 606f99fa452d0c3c157fa05c8ca7aa660bfbec3713819cad613881c1c98345a5
    note: >
      Gujarat High Court (Justice S.V. Pinto) declined an urgent hearing of a PIL seeking directions to police to prevent hate speech during Shastri's 26 May-7 June 2023 programmes in Surat, Ahmedabad, Vadodara and Rajkot; records the petitioner's claim that he had by then also been booked in Udaipur and that similar demands followed his programmes in Madhya Pradesh, Maharashtra and Bihar.

cases:
  - id: dks-nagpur-mira-road-abans-2023
    title_en: Complaints by Akhil Bharatiya Andhashraddha Nirmoolan Samiti (Nagpur and Mira Road, Maharashtra)
    title_hi: अखिल भारतीय अंधश्रद्धा निर्मूलन समिति की शिकायतें (नागपुर और मीरा रोड, महाराष्ट्र)
    jurisdiction_country: IN
    jurisdiction_region: Maharashtra
    court: Nagpur police (inquiry); Bombay High Court (PIL), Bench at Bombay
    case_number: WP No. 5497 of 2023 (Bombay High Court)
    filed_year: 2023
    case_type: criminal
    statutes: [ "Maharashtra Prevention and Eradication of Human Sacrifice and other Inhuman, Evil and Aghori Practices and Black Magic Act, 2013", "Drugs and Magic Remedies (Objectionable Advertisements) Act, 1954" ]
    status: closed (Nagpur police found no offence; related PIL dismissed by Bombay High Court)
    tier: closed
    verdict_date: 2023-03-18
    sentence_or_remedy: Not applicable; police inquiry closed with no offence found, PIL dismissed
    appeal_status: Not applicable
    summary_en: >
      Shyam Manav, founder of the Akhil Bharatiya Andhashraddha Nirmoolan Samiti, complained to Nagpur police on 8 January 2023 that Shastri's "Shree Ram Katha" programme in Nagpur (5-13 January), including its "Divya Darbar" and "Pret Darbar" sessions, promoted superstition in violation of Maharashtra's anti-black-magic law and the Drugs and Magic Remedies Act. On 25 January 2023 Nagpur Police Commissioner Amitesh Kumar said the inquiry, based on the complaint and a video Manav submitted, found the programme did not attract action under either law. A separate PIL by Deepak Dilip Jagdev, filed as Shastri's next "Divya Darbar" was about to begin at Mira Road, Thane district, on 18 March 2023, sought police action against the state Home Minister for not acting against Shastri; the Bombay High Court recorded that Mira Road police already had a licence for the event and would videograph it, that no complaint of any kind had been made about the Nagpur programme and no untoward incident had occurred there, and dismissed the petition the same day as "not a bonafide petition" and "politically motivated", while leaving police free to act if an offence were later found.
    summary_hi: >
      अंधश्रद्धा निर्मूलन समिति के संस्थापक श्याम मानव ने 8 जनवरी 2023 को नागपुर पुलिस से शिकायत की कि शास्त्री का नागपुर में "श्री रामकथा" कार्यक्रम (5-13 जनवरी), जिसमें "दिव्य दरबार" और "प्रेत दरबार" सत्र शामिल थे, महाराष्ट्र के जादू-टोना विरोधी क़ानून और औषधि व जादुई उपचार अधिनियम का उल्लंघन कर अंधविश्वास बढ़ाता है। 25 जनवरी 2023 को नागपुर पुलिस आयुक्त अमितेश कुमार ने कहा कि शिकायत और मानव द्वारा दिए गए वीडियो के आधार पर हुई जाँच में कार्यक्रम इन दोनों कानूनों के तहत कार्रवाई योग्य नहीं पाया गया। जब शास्त्री का अगला "दिव्य दरबार" ठाणे ज़िले के मीरा रोड में 18 मार्च 2023 को शुरू होने वाला था, तब दीपक दिलीप जगदेव की एक अलग जनहित याचिका में राज्य के गृह मंत्री के विरुद्ध कार्रवाई की माँग की गई कि उन्होंने शास्त्री पर कार्रवाई नहीं की; बंबई उच्च न्यायालय ने दर्ज किया कि मीरा रोड पुलिस के पास पहले से कार्यक्रम की अनुमति है और वह उसकी वीडियोग्राफी करेगी, नागपुर कार्यक्रम को लेकर कोई शिकायत नहीं हुई थी और कोई अप्रिय घटना नहीं घटी, और उसी दिन याचिका को "सद्भावनापूर्ण याचिका नहीं" तथा "राजनीति से प्रेरित" कहते हुए खारिज कर दिया, साथ ही पुलिस को बाद में अपराध पाए जाने पर कार्रवाई की छूट दी।
    source_ids: [ dks-src-01, dks-src-02, dks-src-03 ]

  - id: dks-udaipur-kumbhalgarh-fir-2023
    title_en: FIRs over Kumbhalgarh Fort saffron-flag remark (Hathipol PS, Udaipur; Kelwada PS, Rajsamand)
    title_hi: कुंभलगढ़ दुर्ग भगवा-ध्वज टिप्पणी पर एफआईआर (हाथीपोल थाना, उदयपुर; केलवाड़ा थाना, राजसमंद)
    jurisdiction_country: IN
    jurisdiction_region: Rajasthan
    court: Not on record (no bail, quashing or trial order located)
    case_number: Not stated in press reports
    filed_year: 2023
    case_type: criminal
    statutes: [ IPC 153A ]
    status: FIRs registered; no chargesheet, arrest or closure located
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      At a public meeting at Gandhi Ground, Udaipur on 23 March 2023, Shastri said the roughly 100 green flags atop Kumbhalgarh Fort should be replaced with saffron ones. Udaipur police, through Additional SP (City) Chandrasheel Thakur, said the remark could disturb religious harmony and registered an FIR under IPC 153A at Hathipol police station; a second FIR was registered at Kelwada police station, Rajsamand district, after youths tried to hoist a saffron flag at the fort that night and five were arrested. No press report of a chargesheet, arrest of Shastri, or court order in either case was located, and neither FIR appears in Indian Kanoon's records.
    summary_hi: >
      23 मार्च 2023 को उदयपुर के गांधी ग्राउंड में एक सभा में शास्त्री ने कहा कि कुंभलगढ़ दुर्ग पर लगे लगभग 100 हरे झंडों की जगह भगवा झंडे लगाए जाने चाहिए। अतिरिक्त पुलिस अधीक्षक (शहर) चंद्रशील ठाकुर के अनुसार, इस टिप्पणी से धार्मिक सद्भाव बिगड़ सकता था, और हाथीपोल थाने में आईपीसी 153ए के तहत एफआईआर दर्ज की गई; उसी रात कुछ युवकों के दुर्ग पर भगवा झंडा फहराने के प्रयास के बाद केलवाड़ा थाने, राजसमंद ज़िले में एक और एफआईआर दर्ज हुई और पाँच लोग गिरफ्तार किए गए। दोनों मामलों में किसी आरोप-पत्र, शास्त्री की गिरफ़्तारी या अदालती आदेश की कोई रिपोर्ट नहीं मिली, और इंडियन कानून के रिकॉर्ड में भी दोनों एफआईआर दर्ज नहीं मिलीं।
    source_ids: [ dks-src-04, dks-src-05, dks-src-17 ]

  - id: dks-mumbai-bandra-fir-2023
    title_en: FIR over Shirdi Sai Baba remark (Bandra PS, Mumbai)
    title_hi: शिरडी साईं बाबा टिप्पणी पर एफआईआर (बांद्रा थाना, मुंबई)
    jurisdiction_country: IN
    jurisdiction_region: Maharashtra
    court: Not on record
    case_number: Not stated in press reports
    filed_year: 2023
    case_type: criminal
    statutes: [ IPC 153A ]
    status: FIR registered; no chargesheet, arrest or closure located
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      Yuva Sena (Uddhav Balasaheb Thackeray faction) leader Rahul Narain Kanal filed a written complaint at Bandra police station on 3 April 2023 after Shastri said Sai Baba of Shirdi "can be called a Saint or Fakir but ... cannot be called Bhagwan [God]" because the Shankaracharya had not given him that status. Press reports said Mumbai police registered an FIR, reportedly under provisions including IPC 153A. No chargesheet, arrest or court order was located.
    summary_hi: >
      युवा सेना (उद्धव बालासाहेब ठाकरे गुट) के नेता राहुल नारायण कनाल ने 3 अप्रैल 2023 को बांद्रा थाने में लिखित शिकायत दी, जब शास्त्री ने कहा कि शिरडी के साईं बाबा को "संत या फ़क़ीर कहा जा सकता है लेकिन भगवान नहीं" क्योंकि शंकराचार्य ने उन्हें वह दर्जा नहीं दिया। प्रेस रिपोर्टों के अनुसार मुंबई पुलिस ने आईपीसी 153ए सहित प्रावधानों के तहत एफआईआर दर्ज की। कोई आरोप-पत्र, गिरफ़्तारी या अदालती आदेश नहीं मिला।
    source_ids: [ dks-src-06, dks-src-07 ]

  - id: dks-muzaffarpur-bihar-complaint-2023
    title_en: Private complaint over "avatar of Hanuman" remark (Muzaffarpur ACJM court, Bihar)
    title_hi: "\"हनुमान अवतार\" टिप्पणी पर निजी परिवाद (मुजफ्फरपुर एसीजेएम न्यायालय, बिहार)"
    jurisdiction_country: IN
    jurisdiction_region: Bihar
    court: Additional Chief Judicial Magistrate, Muzaffarpur
    case_number: Not stated in press reports
    filed_year: 2023
    case_type: criminal
    statutes: [ IPC 295A, IPC 298, IPC 505 ]
    status: private complaint filed; hearing listed 10 May 2023; no outcome located
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      Ahead of Shastri's planned 13-17 May 2023 programme in Patna, advocate Suraj Kumar filed a private criminal complaint on 1 May 2023 in the Muzaffarpur Additional Chief Judicial Magistrate court under IPC 295A, 298 and 505, alleging Shastri hurt Hindu religious sentiment by describing himself, in a speech in Udaipur, as an "avatar of Lord Hanuman". The court listed the matter for hearing on 10 May 2023; no press report of the outcome was located. This is a private complaint, not a police FIR.
    summary_hi: >
      पटना में शास्त्री के 13-17 मई 2023 के प्रस्तावित कार्यक्रम से पहले, अधिवक्ता सूरज कुमार ने 1 मई 2023 को मुजफ्फरपुर के अतिरिक्त मुख्य न्यायिक मजिस्ट्रेट न्यायालय में आईपीसी 295ए, 298 और 505 के तहत एक निजी आपराधिक परिवाद दायर किया, जिसमें आरोप था कि उदयपुर में एक भाषण में स्वयं को "हनुमान का अवतार" बताकर शास्त्री ने हिंदू धार्मिक भावनाओं को ठेस पहुँचाई। अदालत ने मामले की सुनवाई 10 मई 2023 के लिए सूचीबद्ध की; इसके परिणाम की कोई रिपोर्ट नहीं मिली। यह एक निजी परिवाद है, पुलिस एफआईआर नहीं।
    source_ids: [ dks-src-08, dks-src-09 ]

  - id: dks-kolkata-durga-puja-complaint-2025
    title_en: Police complaint over Durga Puja food remark (Bhawanipore PS, Kolkata)
    title_hi: दुर्गा पूजा भोजन टिप्पणी पर पुलिस शिकायत (भवानीपुर थाना, कोलकाता)
    jurisdiction_country: IN
    jurisdiction_region: West Bengal
    court: Not applicable (police complaint)
    case_number: Not stated in press reports
    filed_year: 2025
    case_type: criminal
    statutes: []
    status: complaint filed; no FIR registration located
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable
    summary_en: >
      At a Hanumant Katha programme in Howrah on 5 September 2025, Shastri urged Hindus not to eat non-vegetarian food during Durga Puja and called those who did "pakhandis" (hypocrites). The South Kolkata District Congress Committee lodged a complaint at Bhawanipore police station on 8 September 2025 demanding an FIR and arrests, saying the remark hurt religious sentiment and disturbed social harmony. West Bengal BJP state president Samik Bhattacharya also said no religious figure could dictate what Bengalis should eat. No report of an FIR being registered was located.
    summary_hi: >
      5 सितंबर 2025 को हावड़ा में हनुमंत कथा कार्यक्रम में शास्त्री ने हिंदुओं से दुर्गा पूजा के दौरान मांसाहार न करने की अपील की और ऐसा करने वालों को "पाखंडी" कहा। दक्षिण कोलकाता ज़िला कांग्रेस समिति ने 8 सितंबर 2025 को भवानीपुर थाने में शिकायत दर्ज कराकर एफआईआर और गिरफ़्तारी की माँग की, यह कहते हुए कि टिप्पणी से धार्मिक भावना आहत हुई और सामाजिक सद्भाव बिगड़ा। पश्चिम बंगाल भाजपा के प्रदेश अध्यक्ष शमिक भट्टाचार्य ने भी कहा कि कोई धार्मिक व्यक्ति बंगालियों को यह नहीं बता सकता कि वे क्या खाएँ। एफआईआर दर्ज होने की कोई रिपोर्ट नहीं मिली।
    source_ids: [ dks-src-10 ]

