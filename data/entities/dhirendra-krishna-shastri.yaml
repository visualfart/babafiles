  - id: dks-claim-06
    case_id: dks-kolkata-durga-puja-complaint-2025
    statement_en: On 8 September 2025 the South Kolkata District Congress Committee filed a police complaint against Shastri at Bhawanipore police station demanding an FIR and arrests, after he urged Hindus at a 5 September Howrah event to avoid non-vegetarian food during Durga Puja.
    statement_hi: 8 सितंबर 2025 को दक्षिण कोलकाता ज़िला कांग्रेस समिति ने भवानीपुर थाने में शास्त्री के विरुद्ध पुलिस शिकायत दर्ज कराकर एफआईआर और गिरफ़्तारी की माँग की, जब उन्होंने 5 सितंबर के हावड़ा कार्यक्रम में हिंदुओं से दुर्गा पूजा के दौरान मांसाहार न करने की अपील की थी।
    tier: allegation
    date: 2025-09-08
    source_ids: [ dks-src-10 ]

events:
  - date: 2023-05-24
    kind: other
    label_en: Union Home Ministry approves Y-category security for Shastri, following the Madhya Pradesh government's own earlier Y-category grant, after he received death threats
    label_hi: मृत्यु की धमकियाँ मिलने के बाद केंद्रीय गृह मंत्रालय ने शास्त्री को वाई-श्रेणी सुरक्षा दी, जो मध्य प्रदेश सरकार द्वारा पहले दी गई वाई-श्रेणी सुरक्षा के बाद है
    source_ids: [ dks-src-13 ]
  - date: 2025-12-27
    kind: other
    label_en: Video of Shastri arriving in Chhattisgarh on a state government aircraft, with an on-duty police officer touching his feet, draws Congress criticism and a BJP defence
    label_hi: शास्त्री के छत्तीसगढ़ राज्य सरकार के विमान से पहुँचने और एक तैनात पुलिसकर्मी द्वारा उनके पैर छूने का वीडियो सामने आने पर कांग्रेस की आलोचना और भाजपा का बचाव
    source_ids: [ dks-src-16 ]

relationships:
  - to_id: narendra-modi
    type: visit
    period_start: 2025-02-23
    period_end: 2025-02-23
    description_en: >
      Prime Minister Narendra Modi visited Bageshwar Dham at Shastri's invitation on 23 February 2025 and laid the foundation stone of a 100-bed cancer hospital being built by a Bageshwar Dham trust; recorded as a documented visit and public appearance, not an endorsement of any of Shastri's other statements.
    description_hi: >
      प्रधानमंत्री नरेंद्र मोदी ने शास्त्री के निमंत्रण पर 23 फरवरी 2025 को बागेश्वर धाम का दौरा किया और बागेश्वर धाम ट्रस्ट द्वारा बनाए जा रहे 100-बिस्तर कैंसर अस्पताल की आधारशिला रखी; इसे एक दर्ज दौरे और सार्वजनिक उपस्थिति के रूप में लिखा गया है, शास्त्री के अन्य किसी बयान के समर्थन के रूप में नहीं।
    source_ids: [ dks-src-11, dks-src-12 ]
  - to_id: shivraj-singh-chouhan
    type: government_grant
    period_start: 2023-05
    period_end:
    description_en: >
      The Madhya Pradesh government, then headed by Chief Minister Shivraj Singh Chouhan, approved Y-category security cover for Shastri in May 2023, before the Union Home Ministry separately extended similar central security later the same month.
    description_hi: >
      मध्य प्रदेश सरकार, जिसके तब मुख्यमंत्री शिवराज सिंह चौहान थे, ने मई 2023 में शास्त्री को वाई-श्रेणी सुरक्षा कवर दी, जिसके बाद उसी महीने केंद्रीय गृह मंत्रालय ने अलग से समान केंद्रीय सुरक्षा दी।
    source_ids: [ dks-src-14 ]
  - to_id: rekha-gupta
    type: visit
    period_start: 2025-09-05
    period_end: 2025-09-05
    description_en: >
      Delhi Chief Minister Rekha Gupta invited Shastri to her residence, Jan Sewa Sadan, on 5 September 2025, where she and her family sought his blessings.
    description_hi: >
      दिल्ली की मुख्यमंत्री रेखा गुप्ता ने 5 सितंबर 2025 को शास्त्री को अपने निवास जन सेवा सदन पर आमंत्रित किया, जहाँ उन्होंने और उनके परिवार ने उनका आशीर्वाद लिया।
    source_ids: [ dks-src-15 ]
