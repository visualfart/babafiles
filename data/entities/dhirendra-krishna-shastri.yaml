summary_en: >
  Dhirendra Krishna Shastri is the head priest ("peethadheeshwar") of the Bageshwar Dham Balaji temple at Garha village, Chhatarpur district, Madhya Pradesh, known for his "Divya Darbar" programmes. In January 2023 the Nagpur wing of the Akhil Bharatiya Andhashraddha Nirmoolan Samiti complained to Nagpur police that his programme there promoted superstition; on 25 January 2023 the Nagpur police commissioner said the inquiry found no offence under the Maharashtra Black Magic Act or the Drugs and Magic Remedies Act, and a Bombay High Court bench separately dismissed a related PIL on 18 March 2023 as "not a bonafide petition" and "politically motivated". Police in Udaipur and Rajsamand (Rajasthan) registered FIRs against him in March 2023, and Mumbai police registered an FIR in April 2023, both under IPC 153A over speeches; a private criminal complaint was also filed against him in Muzaffarpur, Bihar in May 2023, and the West Bengal Congress lodged a police complaint in Kolkata in September 2025 over remarks on food during Durga Puja. No court verdict, chargesheet or arrest in any of these matters was found on the public record. He has received Y-category security from the Madhya Pradesh government and, later, central agencies, and has been visited by the Prime Minister, a sitting Chief Minister and other office-holders in the course of public and religious events.
summary_hi: >
  धीरेंद्र कृष्ण शास्त्री मध्य प्रदेश के छतरपुर ज़िले के गाड़ा गाँव स्थित बागेश्वर धाम बालाजी मंदिर के पीठाधीश्वर हैं, जो अपने "दिव्य दरबार" कार्यक्रमों के लिए जाने जाते हैं। जनवरी 2023 में अखिल भारतीय अंधश्रद्धा निर्मूलन समिति की नागपुर इकाई ने नागपुर पुलिस से शिकायत की कि उनका वहाँ का कार्यक्रम अंधविश्वास को बढ़ावा देता है; 25 जनवरी 2023 को नागपुर पुलिस आयुक्त ने कहा कि जाँच में महाराष्ट्र जादू-टोना विरोधी अधिनियम या औषधि एवं जादुई उपचार अधिनियम के तहत कोई अपराध नहीं पाया गया, और बंबई उच्च न्यायालय की एक पीठ ने 18 मार्च 2023 को संबंधित एक जनहित याचिका को "सद्भावनापूर्ण याचिका नहीं" और "राजनीति से प्रेरित" कहते हुए खारिज कर दिया। उदयपुर और राजसमंद (राजस्थान) पुलिस ने मार्च 2023 में तथा मुंबई पुलिस ने अप्रैल 2023 में भाषणों को लेकर आईपीसी 153ए के तहत उनके विरुद्ध एफआईआर दर्ज कीं; मई 2023 में बिहार के मुजफ्फरपुर में भी एक निजी आपराधिक परिवाद दायर हुआ, और सितंबर 2025 में पश्चिम बंगाल कांग्रेस ने दुर्गा पूजा के दौरान भोजन संबंधी टिप्पणी को लेकर कोलकाता में पुलिस शिकायत दर्ज कराई। इनमें से किसी भी मामले में कोई अदालती फैसला, आरोप-पत्र या गिरफ्तारी सार्वजनिक रिकॉर्ड में नहीं मिली। उन्हें मध्य प्रदेश सरकार से और बाद में केंद्रीय एजेंसियों से वाई-श्रेणी सुरक्षा मिली है, और सार्वजनिक व धार्मिक आयोजनों के दौरान प्रधानमंत्री, एक पदस्थ मुख्यमंत्री और अन्य पदाधिकारियों ने उनसे भेंट की है।
hi_reviewed: false
response_from_subject:
  text_en: >
    Responding to the challenge from anti-superstition campaigner Shyam Manav, who offered Rs 30 lakh to anyone who could prove "Divya Shakti" (divine power) on camera, Shastri told ANI in Raipur: "Anyone can challenge my words and actions on camera. Lakhs come and sit in the court of Bageshwar Balaji." Videos of his programmes reviewed by Nagpur police showed him reciting lines from the Hanuman Chalisa, which the police said did not amount to black magic.
  text_hi: >
    अंधश्रद्धा निर्मूलन अभियानी श्याम मानव, जिन्होंने कैमरे पर "दिव्य शक्ति" सिद्ध करने वाले को 30 लाख रुपये देने की चुनौती दी थी, के जवाब में शास्त्री ने रायपुर में एएनआई से कहा: "कोई भी मेरे शब्दों और कार्यों को कैमरे पर चुनौती दे सकता है। लाखों लोग बागेश्वर बालाजी के दरबार में आकर बैठते हैं।" नागपुर पुलिस द्वारा देखे गए उनके कार्यक्रमों के वीडियो में वे हनुमान चालीसा की पंक्तियाँ पढ़ते दिखे, जिसे पुलिस ने काला जादू नहीं माना।
  source_id: dks-src-01

