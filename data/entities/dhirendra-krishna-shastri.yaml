    statement_hi: शिरडी के साईं बाबा को संत या फ़क़ीर कहा जा सकता है लेकिन भगवान नहीं, इस टिप्पणी पर युवा सेना नेता राहुल नारायण कनाल की 3 अप्रैल 2023 की शिकायत पर बांद्रा थाने में मुंबई पुलिस ने शास्त्री के विरुद्ध एफआईआर दर्ज की।
