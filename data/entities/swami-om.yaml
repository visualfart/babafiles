summary_en: >
  Swami Om, a self-styled godman best known as a contestant on the reality show Bigg Boss 10,
  filed a writ petition in the Supreme Court in August 2017, jointly with Mukesh Jain, seeking
  to block the appointment of Justice Dipak Misra as Chief Justice of India. On 24 August 2017
  a bench headed by Chief Justice J.S. Khehar dismissed the petition as "a purely motivated
  publicity stunt" and imposed costs of Rs 10 lakh on each petitioner, payable to the Prime
  Minister's Relief Fund; on 29 October 2020 the Supreme Court directed Swami Om to pay a
  reduced sum of Rs 5 lakh. Separately, press reports record that Swami Om was arrested by
  the Delhi Police Crime Branch on 9 August 2017 in connection with a 2008 case, having earlier
  been declared a proclaimed offender by a Delhi court, and that he was also accused in 2016 of
  breaking into and stealing from his brother's cycle shop. He died in Delhi on 3 February
  2021 after being treated for COVID-19 and a paralytic attack.
summary_hi: >
  स्वामी ओम, एक स्वयंभू बाबा जिन्हें रियलिटी शो बिग बॉस 10 के प्रतिभागी के रूप में सबसे अधिक जाना
  जाता है, ने अगस्त 2017 में मुकेश जैन के साथ मिलकर न्यायमूर्ति दीपक मिश्रा की भारत के मुख्य
  न्यायाधीश के रूप में नियुक्ति रोकने के लिए सर्वोच्च न्यायालय में एक रिट याचिका दाखिल की। 24 अगस्त
  2017 को मुख्य न्यायाधीश जे.एस. खेहर की अध्यक्षता वाली पीठ ने याचिका को "विशुद्ध रूप से प्रेरित
  प्रचार स्टंट" बताते हुए खारिज कर दिया और प्रत्येक याचिकाकर्ता पर 10 लाख रुपये का हर्जाना लगाया,
  जो प्रधानमंत्री राहत कोष में जमा होना था; 29 अक्टूबर 2020 को सर्वोच्च न्यायालय ने स्वामी ओम को
  घटाकर 5 लाख रुपये चुकाने का निर्देश दिया। अलग से, प्रेस रिपोर्टों में दर्ज है कि स्वामी ओम को
  9 अगस्त 2017 को दिल्ली पुलिस की क्राइम ब्रांच ने 2008 के एक मामले के सिलसिले में गिरफ्तार किया,
  जबकि उन्हें पहले दिल्ली की एक अदालत ने भगोड़ा (proclaimed offender) घोषित कर दिया था, और 2016 में
  उन पर अपने भाई की साइकिल दुकान में सेंधमारी और चोरी का भी आरोप लगा था। कोविड-19 और लकवाग्रस्त
  हमले के इलाज के बाद 3 फरवरी 2021 को दिल्ली में उनका निधन हो गया।
