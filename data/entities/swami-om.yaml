cases:
  - id: swami-om-sc-pil-costs-2017
    title_en: Swami Om Ji and Mukesh Jain v. Union of India (writ petition against CJI appointment; costs imposed)
    title_hi: स्वामी ओम जी एवं मुकेश जैन बनाम भारत संघ (सीजेआई नियुक्ति के विरुद्ध रिट याचिका; हर्जाना)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: Supreme Court of India
    case_number: W.P.(C) No. 748 of 2017
    filed_year: 2017
    case_type: civil
    statutes: ["Constitution of India art.124"]
    status: dismissed with costs
    tier: civil_judgment
    verdict_date: 2017-08-24
    sentence_or_remedy: Costs of Rs 10,00,000 imposed on each petitioner, payable to the Prime Minister's Relief Fund; later reduced in enforcement to Rs 5 lakh for Swami Om by Supreme Court order of 29 October 2020
    appeal_status: Not applicable; final order of the Supreme Court.
    summary_en: >
      Swami Om and Mukesh Jain filed a writ petition in the Supreme Court on the eve of Justice
      Dipak Misra's oath as Chief Justice of India, arguing that his appointment violated
      Articles 124(2), 124(3) and 124A of the Constitution. A bench headed by Chief Justice J.S.
      Khehar heard the petitioners in person on 24 August 2017, rejected each of their
      constitutional arguments as misconceived, found they had no allegation whatsoever against
      the incoming Chief Justice, and held that the petition was "a purely motivated publicity
      stunt" filed at the last possible moment. The Court dismissed the petition and imposed
      costs of Rs 10 lakh on each petitioner, remittable to the Prime Minister's Relief Fund. On
      29 October 2020 the Supreme Court, in connection with enforcement of those costs, directed
      Swami Om to pay a reduced sum of Rs 5 lakh.
    summary_hi: >
      न्यायमूर्ति दीपक मिश्रा की भारत के मुख्य न्यायाधीश के रूप में शपथ से एक दिन पहले, स्वामी ओम
      और मुकेश जैन ने सर्वोच्च न्यायालय में एक रिट याचिका दाखिल कर तर्क दिया कि उनकी नियुक्ति
      संविधान के अनुच्छेद 124(2), 124(3) और 124-ए का उल्लंघन करती है। मुख्य न्यायाधीश जे.एस. खेहर
      की अध्यक्षता वाली पीठ ने 24 अगस्त 2017 को याचिकाकर्ताओं को व्यक्तिगत रूप से सुना, उनके प्रत्येक
      संवैधानिक तर्क को भ्रामक मानते हुए खारिज किया, पाया कि आने वाले मुख्य न्यायाधीश के विरुद्ध
      उनका कोई आरोप ही नहीं था, और कहा कि यह याचिका अंतिम क्षण में दाखिल किया गया "विशुद्ध रूप से
      प्रेरित प्रचार स्टंट" है। न्यायालय ने याचिका खारिज करते हुए प्रत्येक याचिकाकर्ता पर 10 लाख
      रुपये का हर्जाना लगाया, जो प्रधानमंत्री राहत कोष में जमा होना था। 29 अक्टूबर 2020 को सर्वोच्च
      न्यायालय ने, इन हर्जानों के प्रवर्तन के सिलसिले में, स्वामी ओम को घटाकर 5 लाख रुपये चुकाने
      का निर्देश दिया।
    source_ids: [swamiom-src-01, swamiom-src-02]

