    kind: other
    label_en: Resigns as junior engineer in a Haryana government department after about 15 years' service
    label_hi: लगभग 15 वर्ष की सेवा के बाद हरियाणा सरकार के विभाग में कनिष्ठ अभियंता पद से त्यागपत्र
    source_ids: [ rampal-src-09, rampal-src-02 ]
