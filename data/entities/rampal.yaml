id: rampal
type: person
is_subject: true
name_en: Rampal
name_hi: रामपाल
aliases: [ Sant Rampal, Sant Rampal Ji Maharaj, Rampal Dass, Rampal Singh Jatin, Jagat Guru Rampal ]
born: 1951
died:
base_location: Satlok Ashram, Barwala, Hisar district, Haryana
country: IN
countries_of_operation: [ IN ]
organisations: [ Satlok Ashram, Chhor Parmeshwar Bhagti Trust, Bandi Chhor Mukti Trust, Rashtriya Samaj Sewa Samiti ]
activity_status: active
abap_2017_list: true
summary_en: >
  Rampal, a former junior engineer in the Haryana irrigation department, heads the Satlok Ashram at Barwala in Hisar district. In October 2018 an Additional Sessions Judge sitting in a special court inside Hisar's Central Jail-I convicted him in two murder cases arising from the November 2014 police operation at the ashram, in which five women and a child died, and sentenced him to life imprisonment without remission in each; both sentences were suspended by the Punjab and Haryana High Court in 2025 while his appeals remain pending. He was acquitted in two related 2014 cases (FIRs 426 and 427) in August 2017 and in the 2006 Karontha (Rohtak) clash murder case in December 2022. A sedition and UAPA case (FIR 428 of 2014) is still at trial; the High Court refused him bail in it in September 2023 and granted regular bail on 8 April 2026. The High Court closed its 2014 contempt case against him in October 2025 after he sought the court's forgiveness.
summary_hi: >
  रामपाल, जो पहले हरियाणा सिंचाई विभाग में कनिष्ठ अभियंता थे, हिसार ज़िले के बरवाला स्थित सतलोक आश्रम के प्रमुख हैं। अक्टूबर 2018 में हिसार की केंद्रीय जेल-I के भीतर बैठी विशेष अदालत के अतिरिक्त सत्र न्यायाधीश ने उन्हें नवंबर 2014 की पुलिस कार्रवाई से जुड़े दो हत्या के मामलों में दोषी ठहराया, जिसमें पाँच महिलाओं और एक बच्चे की मृत्यु हुई थी, और दोनों में बिना छूट के आजीवन कारावास की सज़ा सुनाई; पंजाब एवं हरियाणा उच्च न्यायालय ने 2025 में दोनों सज़ाएँ अपील लंबित रहने तक निलंबित कर दीं। 2014 के दो संबंधित मामलों (एफआईआर 426 और 427) में उन्हें अगस्त 2017 में और 2006 के करौंथा (रोहतक) संघर्ष के हत्या मामले में दिसंबर 2022 में बरी किया गया। राजद्रोह और यूएपीए का मामला (एफआईआर 428/2014) अभी विचाराधीन है; उच्च न्यायालय ने सितंबर 2023 में इसमें ज़मानत देने से इनकार किया और 8 अप्रैल 2026 को नियमित ज़मानत दी। अक्टूबर 2025 में उच्च न्यायालय ने उनके क्षमा माँगने के बाद 2014 का अवमानना मामला बंद कर दिया।
hi_reviewed: false
response_from_subject:
  text_en: >
    On its website the organisation says of the 2014 deaths: "These are circumstantial deaths occurring primarily due to heavy handedness of the police," and "There is no direct or indirect involvement of Satguru Rampal Ji Maharaj. There is no conspiracy or intent to murder in any of the above cases." Before the High Court in 2025 his counsel argued that the five deaths were natural, that the eyewitnesses had attributed the suffocation to police tear-gas shells, and that he had been falsely implicated.
  text_hi: >
    संगठन अपनी वेबसाइट पर 2014 की मौतों के बारे में कहता है कि ये "मुख्यतः पुलिस की ज़्यादती से हुई परिस्थितिजन्य मौतें" थीं और "सतगुरु रामपाल जी महाराज की कोई प्रत्यक्ष या अप्रत्यक्ष संलिप्तता नहीं है; किसी भी मामले में हत्या की साज़िश या इरादा नहीं था।" 2025 में उच्च न्यायालय के समक्ष उनके वकील ने कहा कि पाँचों मौतें स्वाभाविक थीं, चश्मदीदों ने दम घुटने का कारण पुलिस के आँसू-गैस के गोले बताया था, और उन्हें झूठा फँसाया गया है।
  source_id: rampal-src-23

