    case_id: rampal-rohtak-karontha-2006
    source_ids: [ rampal-src-22, rampal-src-15 ]
  - date: 2009
    kind: other
    label_en: Satlok Ashram set up at Barwala, Hisar, on 12 acres purchased on the Tohana road (per investigation report recited by the High Court)
    label_hi: टोहाना रोड पर खरीदी गई 12 एकड़ भूमि पर बरवाला, हिसार में सतलोक आश्रम स्थापित (उच्च न्यायालय द्वारा उद्धृत जाँच रिपोर्ट के अनुसार)
    source_ids: [ rampal-src-02 ]
  - date: 2014-11-05
