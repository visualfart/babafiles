    title_hi: राज्य बनाम रामपाल एवं अन्य (बरवाला, पाँच अनुयायियों की मृत्यु, नवंबर 2014)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Additional Sessions Judge, Special Court at Central Jail-I, Hisar; appeal in Punjab and Haryana High Court
    case_number: CRA-D-9008-2018 (High Court appeal); trial court case number not on record; press and the organisation identify the FIR as No. 429 of 2014, PS Barwala
    filed_year: 2014
    case_type: criminal
    statutes: [ IPC 302, IPC 343, IPC 120-B ]
    status: convicted; sentence suspended pending appeal
    tier: convicted
    verdict_date: 2018-10-11
    sentence_or_remedy: Rigorous imprisonment for life without remission under IPC 302 and 120-B (fine Rs 1,00,000 each) and RI for two years under IPC 343 (fine Rs 5,000), by sentencing order dated 17 October 2018
    appeal_status: CRA-D-9008-2018 pending in the Punjab and Haryana High Court; sentence suspended on 2 September 2025 (order in CRM-29233-2024) on his furnishing bail bonds
    summary_en: >
      Registered at Barwala police station after five people (Santosh, Raj Bala, Malkit Kaur, Sarita and the child Adarsh) died at the Satlok Ashram during the police operation of 18-19 November 2014 to execute the High Court's warrants against Rampal. On 11 October 2018 the Additional Sessions Judge, Special Court at Central Jail-I, Hisar convicted Rampal and 13 co-accused under IPC 343, 302 and 120-B and, by order dated 17 October 2018, sentenced him to life imprisonment without remission. On 2 September 2025 the High Court suspended the sentence during the pendency of his appeal, noting his age (about 74), custody of 10 years 8 months and 21 days, that all 13 co-accused were on bail, and that there were "debatable issues particularly regarding cause of death being homicidal or not" because the eyewitness relatives of the deceased had attributed the suffocation to tear-gas shells. The court directed him not to promote "mob mentality" and clarified that nothing in the order was an expression on the merits of the appeal.
    summary_hi: >
      18-19 नवंबर 2014 को रामपाल के विरुद्ध उच्च न्यायालय के वारंट तामील कराने की पुलिस कार्रवाई के दौरान सतलोक आश्रम में पाँच लोगों (संतोष, राज बाला, मलकीत कौर, सरिता और बालक आदर्श) की मृत्यु के बाद बरवाला थाने में दर्ज मामला। 11 अक्टूबर 2018 को हिसार की केंद्रीय जेल-I में बैठी विशेष अदालत के अतिरिक्त सत्र न्यायाधीश ने रामपाल और 13 सह-अभियुक्तों को आईपीसी 343, 302 और 120-बी के तहत दोषी ठहराया और 17 अक्टूबर 2018 के आदेश से बिना छूट के आजीवन कारावास की सज़ा दी। 2 सितंबर 2025 को उच्च न्यायालय ने अपील लंबित रहने तक सज़ा निलंबित की, यह देखते हुए कि उनकी आयु लगभग 74 वर्ष है, वे 10 वर्ष 8 माह 21 दिन हिरासत में रह चुके हैं, सभी 13 सह-अभियुक्त ज़मानत पर हैं, और मृत्यु के कारण के हत्या-जनित होने पर "विवादास्पद प्रश्न" हैं क्योंकि मृतकों के रिश्तेदार गवाहों ने दम घुटने का कारण आँसू-गैस के गोले बताया। अदालत ने उन्हें "भीड़-मानसिकता" न बढ़ाने का निर्देश दिया और स्पष्ट किया कि यह आदेश अपील के गुण-दोष पर कोई राय नहीं है।
    source_ids: [ rampal-src-01, rampal-src-13, rampal-src-12, rampal-src-04, rampal-src-18 ]

  - id: rampal-hisar-barwala-rajni-death-2014
    title_en: State v. Rampal and others (Barwala, death of disciple Rajni, November 2014)
    title_hi: राज्य बनाम रामपाल एवं अन्य (बरवाला, अनुयायी रजनी की मृत्यु, नवंबर 2014)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Additional Sessions Judge, Special Court at Central Jail-I, Hisar; appeal in Punjab and Haryana High Court
    case_number: Press and the organisation identify the FIR as No. 430 of 2014, PS Barwala; High Court appeal number not on record
    filed_year: 2014
    case_type: criminal
    statutes: [ IPC 302, IPC 343, IPC 120-B ]
    status: convicted; sentence reported suspended pending appeal
    tier: convicted
    verdict_date: 2018-10-11
    sentence_or_remedy: Life imprisonment without remission for murder and conspiracy, two years' rigorous imprisonment for wrongful confinement, and fines totalling Rs 2.05 lakh, for Rampal and 13 co-accused
    appeal_status: Appeal pending in the Punjab and Haryana High Court; Bar & Bench and The Tribune report the sentence as suspended by early September 2025 (the organisation gives 28 August 2025); order not located
    summary_en: >
      The second murder case from the November 2014 police operation, concerning the death of a woman disciple, Rajni, found dead at the ashram on 19 November 2014. Additional District and Sessions Judge D.R. Chalia convicted Rampal on 11 October 2018 and, per The Tribune, on 17 October 2018 sentenced him and 13 followers to life imprisonment without remission with fines of Rs 2.05 lakh each. The High Court's 2023 order in the sedition case records that he stands convicted in FIRs 429 and 430. In July 2020 the High Court refused him interim bail and the Supreme Court refused parole to attend his granddaughter's wedding. Bar & Bench reported on 4 September 2025 that the High Court had suspended the life sentences in both murder cases pending appeal.
    summary_hi: >
      नवंबर 2014 की पुलिस कार्रवाई से जुड़ा दूसरा हत्या का मामला, जो 19 नवंबर 2014 को आश्रम में मृत पाई गई महिला अनुयायी रजनी की मृत्यु से संबंधित है। अतिरिक्त ज़िला एवं सत्र न्यायाधीश डी.आर. चालिया ने 11 अक्टूबर 2018 को रामपाल को दोषी ठहराया और, द ट्रिब्यून के अनुसार, 17 अक्टूबर 2018 को उन्हें और 13 अनुयायियों को बिना छूट के आजीवन कारावास तथा प्रत्येक पर 2.05 लाख रुपये जुर्माने की सज़ा सुनाई। राजद्रोह मामले में उच्च न्यायालय के 2023 के आदेश में दर्ज है कि वे एफआईआर 429 और 430 में दोषसिद्ध हैं। जुलाई 2020 में उच्च न्यायालय ने अंतरिम ज़मानत और सर्वोच्च न्यायालय ने पोती के विवाह के लिए पैरोल देने से इनकार किया। बार एंड बेंच ने 4 सितंबर 2025 को बताया कि उच्च न्यायालय ने दोनों हत्या मामलों में आजीवन कारावास की सज़ा अपील लंबित रहने तक निलंबित कर दी है।
    source_ids: [ rampal-src-02, rampal-src-03, rampal-src-09, rampal-src-20, rampal-src-06, rampal-src-17 ]

  - id: rampal-hisar-barwala-fir428-sedition-uapa-2014
    title_en: State v. Rampal and others (FIR 428/2014, PS Barwala; sedition, waging war, UAPA)
    title_hi: राज्य बनाम रामपाल एवं अन्य (एफआईआर 428/2014, थाना बरवाला; राजद्रोह, राज्य के विरुद्ध युद्ध, यूएपीए)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Special Court at Central Jail-I, Hisar (trial); Punjab and Haryana High Court (bail)
    case_number: FIR No. 428 dated 18.11.2014, PS Barwala; CRM-M-15399-2021 (bail, High Court)
    filed_year: 2014
    case_type: criminal
    statutes: [ IPC 121, IPC 121-A, IPC 122, IPC 123, IPC 124, IPC 125, IPC 120-B, IPC 307, IPC 332, IPC 353, IPC 435, IPC 436, IPC 188, "UAPA s.16, s.22-C", "Arms Act s.25, 54, 59", "PDPP Act s.3", "Explosive Substances Act s.3, 4" ]
    status: charges framed; trial pending; regular bail granted 8 April 2026
    tier: charged
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable (trial pending)
    summary_en: >
      FIR 428 dated 18 November 2014 at Barwala police station covers the armed resistance to the police operation to execute the High Court's non-bailable warrants. The Special Court at Central Jail-I, Hisar framed charges against Rampal and co-accused on 15 July 2016 (reiterated on 16 January 2017 after a revision), including waging or attempting to wage war against the State (IPC 121, 121-A), offences under UAPA sections 16 and 22-C in his capacity as person in charge of the Chhor Parmeshwar Bhagti Trust and Bandi Chhor Mukti Trust, the Arms Act, the Explosive Substances Act and the PDPP Act. On 15 September 2023 a Division Bench of the High Court refused regular bail, finding prima facie material that women and children had been used as "human shields" while warrants were executed, and directed the trial court to expedite the trial (463 prosecution witnesses, 89 examined at that date). On 8 April 2026 another Division Bench granted regular bail, noting his age (about 74), roughly eleven years in custody, his health and that co-accused were already on bail.
    summary_hi: >
      18 नवंबर 2014 की बरवाला थाने की एफआईआर 428 उच्च न्यायालय के गैर-ज़मानती वारंट तामील कराने की पुलिस कार्रवाई के सशस्त्र प्रतिरोध से संबंधित है। हिसार की केंद्रीय जेल-I की विशेष अदालत ने 15 जुलाई 2016 को (पुनरीक्षण के बाद 16 जनवरी 2017 को पुनः) रामपाल और सह-अभियुक्तों पर आरोप तय किए, जिनमें राज्य के विरुद्ध युद्ध छेड़ना या उसका प्रयास (आईपीसी 121, 121-ए), छोड़ परमेश्वर भगति ट्रस्ट और बंदी छोड़ मुक्ति ट्रस्ट के प्रभारी के रूप में यूएपीए की धारा 16 और 22-सी, आर्म्स एक्ट, विस्फोटक पदार्थ अधिनियम और पीडीपीपी अधिनियम शामिल हैं। 15 सितंबर 2023 को उच्च न्यायालय की खंडपीठ ने नियमित ज़मानत से इनकार किया, यह प्रथम दृष्टया पाते हुए कि वारंट तामील के समय महिलाओं और बच्चों को "मानव ढाल" के रूप में इस्तेमाल किया गया, और विचारण अदालत को सुनवाई शीघ्र पूरी करने का निर्देश दिया (463 अभियोजन गवाह, उस समय 89 की गवाही हो चुकी थी)। 8 अप्रैल 2026 को एक अन्य खंडपीठ ने उनकी आयु (लगभग 74), लगभग ग्यारह वर्ष की हिरासत, स्वास्थ्य और सह-अभियुक्तों की ज़मानत को देखते हुए नियमित ज़मानत दी।
    source_ids: [ rampal-src-02, rampal-src-16, rampal-src-05, rampal-src-06 ]

  - id: rampal-hisar-barwala-fir426-427-2014
    title_en: State v. Rampal (FIRs 426 and 427 of 2014, PS Barwala; obstruction, rioting, unlawful assembly)
    title_hi: राज्य बनाम रामपाल (एफआईआर 426 और 427/2014, थाना बरवाला; लोक सेवक के कार्य में बाधा, बलवा, विधिविरुद्ध जमाव)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Additional District and Sessions Judge, Hisar (sitting at Central Jail-I, Hisar)
    case_number: FIR Nos. 426 and 427 of 2014, PS Barwala
    filed_year: 2014
    case_type: criminal
    statutes: [ IPC 353, IPC 186, IPC 147, IPC 149, IPC 188 ]
    status: acquitted
    tier: acquitted
    verdict_date: 2017-08-29
    sentence_or_remedy: Acquitted
    appeal_status: No appeal by the State located
    summary_en: >
      Two of the five FIRs registered at Barwala police station after the November 2014 police operation, charging assault or obstruction of public servants, rioting, unlawful assembly and disobedience of an order of a public servant. On 29 August 2017 the Hisar sessions court acquitted Rampal in both cases; press reports attribute the acquittal to lack of evidence after prosecution witnesses did not support the case. The High Court's 2023 order in the sedition matter records his acquittal in FIRs 426 and 427. He remained in custody in the other cases. The exact IPC sections in these two FIRs are as described in press reports; the judgments were not located.
    summary_hi: >
      नवंबर 2014 की पुलिस कार्रवाई के बाद बरवाला थाने में दर्ज पाँच एफआईआर में से दो, जिनमें लोक सेवकों पर हमला या उनके कार्य में बाधा, बलवा, विधिविरुद्ध जमाव और लोक सेवक के आदेश की अवज्ञा के आरोप थे। 29 अगस्त 2017 को हिसार सत्र न्यायालय ने रामपाल को दोनों मामलों में बरी किया; प्रेस रिपोर्टों के अनुसार अभियोजन गवाहों के समर्थन न करने पर साक्ष्य के अभाव में बरी किया गया। राजद्रोह मामले में उच्च न्यायालय के 2023 के आदेश में एफआईआर 426 और 427 में उनकी बरी होने की बात दर्ज है। अन्य मामलों में वे हिरासत में बने रहे। इन दो एफआईआर की सटीक धाराएँ प्रेस रिपोर्टों के अनुसार हैं; निर्णय उपलब्ध नहीं हो सके।
    source_ids: [ rampal-src-02, rampal-src-11, rampal-src-06, rampal-src-15 ]

  - id: rampal-rohtak-karontha-2006
    title_en: State v. Rampal and others (Karontha, Rohtak, clash of 12 July 2006; FIR 198/2006)
    title_hi: राज्य बनाम रामपाल एवं अन्य (करौंथा, रोहतक, 12 जुलाई 2006 का संघर्ष; एफआईआर 198/2006)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Additional Sessions Judge, Rohtak
    case_number: FIR No. 198 of 2006, Rohtak
    filed_year: 2006
    case_type: criminal
    statutes: [ IPC 302, IPC 307, IPC 148, IPC 149, IPC 323, IPC 324, IPC 120-B, "Arms Act s.25, 27, 29" ]
    status: acquitted
    tier: acquitted
    verdict_date: 2022-12-20
    sentence_or_remedy: Acquitted; three other accused convicted under the Arms Act and sentenced to two years
    appeal_status: No appeal by the State located
    summary_en: >
      On 12 July 2006 a clash outside the then Satlok Ashram at Karontha village, Rohtak, between Rampal's followers and Arya Samaj supporters from nearby villages left one man dead and about 61 injured. An FIR was registered the same day under IPC 148, 302, 323, 324, 307 and 120-B and the Arms Act; Rampal was in custody until the High Court granted bail in April 2008. His failure to appear in the High Court's contempt proceedings connected to this case led to the non-bailable warrants of November 2014 and the cancellation of his bail on 20 November 2014. On 20 December 2022 Additional Sessions Judge Rakesh Singh, Rohtak, acquitted Rampal and 24 others, the allegation of firing from inside the ashram not having been proved; three others were convicted under the Arms Act. The High Court's 2023 order records the acquittal date as 21 December 2022 per the custody certificate.
    summary_hi: >
      12 जुलाई 2006 को रोहतक के करौंथा गाँव में तत्कालीन सतलोक आश्रम के बाहर रामपाल के अनुयायियों और आसपास के गाँवों के आर्य समाज समर्थकों के बीच संघर्ष में एक व्यक्ति की मृत्यु हुई और लगभग 61 घायल हुए। उसी दिन आईपीसी 148, 302, 323, 324, 307, 120-बी और आर्म्स एक्ट के तहत एफआईआर दर्ज हुई; अप्रैल 2008 में उच्च न्यायालय से ज़मानत मिलने तक रामपाल हिरासत में रहे। इसी मामले से जुड़ी अवमानना कार्यवाही में उच्च न्यायालय में पेश न होने के कारण नवंबर 2014 के गैर-ज़मानती वारंट जारी हुए और 20 नवंबर 2014 को उनकी ज़मानत रद्द हुई। 20 दिसंबर 2022 को रोहतक के अतिरिक्त सत्र न्यायाधीश राकेश सिंह ने रामपाल और 24 अन्य को बरी किया, क्योंकि आश्रम के भीतर से गोली चलाने का आरोप साबित नहीं हुआ; तीन अन्य को आर्म्स एक्ट के तहत दोषी ठहराया गया। उच्च न्यायालय के 2023 के आदेश में हिरासत प्रमाणपत्र के अनुसार बरी होने की तिथि 21 दिसंबर 2022 दर्ज है।
    source_ids: [ rampal-src-07, rampal-src-02, rampal-src-22, rampal-src-10 ]

  - id: rampal-phhc-contempt-2014
    title_en: Court on its own motion v. Rampal and others (criminal contempt, Punjab and Haryana High Court, 2014)
    title_hi: न्यायालय स्वप्रेरणा से बनाम रामपाल एवं अन्य (आपराधिक अवमानना, पंजाब एवं हरियाणा उच्च न्यायालय, 2014)
    jurisdiction_country: IN
    jurisdiction_region: Punjab and Haryana High Court
    court: Punjab and Haryana High Court
    case_number: CRCOP No. 12 of 2014 (referred to in the 2023 High Court order)
    filed_year: 2014
    case_type: criminal
    statutes: [ Contempt of Courts Act 1971 ]
    status: closed
    tier: closed
    verdict_date: 2025-10-08
    sentence_or_remedy: Proceedings closed after Rampal sought the court's forgiveness
    appeal_status: Not applicable
    summary_en: >
      The High Court initiated contempt proceedings after Rampal repeatedly failed to appear before it in connection with the 2006 Rohtak case; he did not appear on 5, 10 and 17 November 2014, a fresh non-bailable warrant was issued on 5 November 2014, and on 20 November 2014 the court cancelled his bail in the 2006 case and called for the Haryana DGP's affidavit on the arrest operation. Criminal contempt proceedings continued against Rampal, Ram Kumar Dhaka and Dr O.P. Hooda. On 8 October 2025 the High Court closed the contempt case after Rampal sought the court's forgiveness for the 2014 violence.
    summary_hi: >
      2006 के रोहतक मामले के सिलसिले में उच्च न्यायालय में बार-बार पेश न होने पर अदालत ने अवमानना कार्यवाही शुरू की; वे 5, 10 और 17 नवंबर 2014 को पेश नहीं हुए, 5 नवंबर 2014 को नया गैर-ज़मानती वारंट जारी हुआ, और 20 नवंबर 2014 को अदालत ने 2006 के मामले में उनकी ज़मानत रद्द कर हरियाणा डीजीपी से गिरफ़्तारी अभियान पर शपथपत्र माँगा। रामपाल, राम कुमार ढाका और डॉ. ओ.पी. हुड्डा के विरुद्ध आपराधिक अवमानना कार्यवाही चलती रही। 8 अक्टूबर 2025 को उच्च न्यायालय ने 2014 की हिंसा के लिए रामपाल के क्षमा माँगने पर अवमानना मामला बंद कर दिया।
    source_ids: [ rampal-src-19, rampal-src-10, rampal-src-22, rampal-src-21, rampal-src-02 ]

claims:
  - id: rampal-claim-01
    case_id: rampal-hisar-barwala-five-deaths-2014
    statement_en: On 11 October 2018 the Additional Sessions Judge, Special Court at Central Jail-I, Hisar convicted Rampal under IPC 343, 302 and 120-B in the case concerning the deaths of five disciples (Santosh, Raj Bala, Malkit Kaur, Adarsh and Sarita) at the Satlok Ashram, Barwala, in November 2014.
    statement_hi: 11 अक्टूबर 2018 को हिसार की केंद्रीय जेल-I में बैठी विशेष अदालत के अतिरिक्त सत्र न्यायाधीश ने नवंबर 2014 में बरवाला के सतलोक आश्रम में पाँच अनुयायियों (संतोष, राज बाला, मलकीत कौर, आदर्श और सरिता) की मृत्यु के मामले में रामपाल को आईपीसी 343, 302 और 120-बी के तहत दोषी ठहराया।
    tier: convicted
    date: 2018-10-11
    source_ids: [ rampal-src-01, rampal-src-12, rampal-src-15 ]
  - id: rampal-claim-02
    case_id: rampal-hisar-barwala-five-deaths-2014
    statement_en: By sentencing order dated 17 October 2018 Rampal was sentenced to rigorous imprisonment for life without remission under IPC 302 and IPC 120-B, with fines of Rs 1,00,000 under each, and two years' rigorous imprisonment under IPC 343 with a fine of Rs 5,000.
    statement_hi: 17 अक्टूबर 2018 के दंडादेश द्वारा रामपाल को आईपीसी 302 और 120-बी के तहत बिना छूट के आजीवन कठोर कारावास तथा प्रत्येक के तहत 1,00,000 रुपये जुर्माना, और आईपीसी 343 के तहत दो वर्ष का कठोर कारावास तथा 5,000 रुपये जुर्माने की सज़ा सुनाई गई।
    tier: convicted
    date: 2018-10-17
    source_ids: [ rampal-src-01 ]
  - id: rampal-claim-03
    case_id: rampal-hisar-barwala-five-deaths-2014
    statement_en: On 2 September 2025 a Division Bench of the Punjab and Haryana High Court (Gurvinder Singh Gill and Deepinder Singh Nalwa JJ) suspended Rampal's sentence in CRA-D-9008-2018 during the pendency of his appeal, recording that he was about 74 years old, had undergone 10 years 8 months and 21 days of actual imprisonment, that all 13 co-accused were on bail, and that there were "debatable issues particularly regarding cause of death being homicidal or not".
    statement_hi: 2 सितंबर 2025 को पंजाब एवं हरियाणा उच्च न्यायालय की खंडपीठ (न्यायमूर्ति गुरविंदर सिंह गिल और दीपिंदर सिंह नलवा) ने CRA-D-9008-2018 में अपील लंबित रहने तक रामपाल की सज़ा निलंबित की, यह दर्ज करते हुए कि उनकी आयु लगभग 74 वर्ष है, वे 10 वर्ष 8 माह 21 दिन वास्तविक कारावास भुगत चुके हैं, सभी 13 सह-अभियुक्त ज़मानत पर हैं, और मृत्यु के कारण के हत्या-जनित होने पर "विवादास्पद प्रश्न" हैं।
    tier: convicted
    date: 2025-09-02
    source_ids: [ rampal-src-01, rampal-src-13, rampal-src-04 ]
  - id: rampal-claim-04
    case_id: rampal-hisar-barwala-five-deaths-2014
    statement_en: The High Court's 2 September 2025 order directed Rampal not to promote any kind of "mob mentality" and to avoid congregations where there is any tendency among "disciples" or participants to cause a breach of peace, law and order, and stated that the State could seek cancellation of bail if he was found inciting others to commit any offence.
    statement_hi: उच्च न्यायालय के 2 सितंबर 2025 के आदेश ने रामपाल को किसी भी प्रकार की "भीड़-मानसिकता" न बढ़ाने और ऐसे जमावड़ों से दूर रहने का निर्देश दिया जहाँ "शिष्यों" या प्रतिभागियों में शांति और क़ानून-व्यवस्था भंग करने की प्रवृत्ति हो, और कहा कि यदि वे दूसरों को अपराध के लिए उकसाते पाए गए तो राज्य ज़मानत रद्द कराने के लिए कदम उठा सकता है।
    tier: convicted
    date: 2025-09-02
    source_ids: [ rampal-src-01, rampal-src-13 ]
  - id: rampal-claim-05
    case_id: rampal-hisar-barwala-rajni-death-2014
    statement_en: In the second murder case from the November 2014 operation, concerning the death of the disciple Rajni, Rampal was convicted on 11 October 2018 and, as reported by The Tribune, sentenced on 17 October 2018 together with 13 followers to life imprisonment without remission with a fine of Rs 2.05 lakh each; the High Court's 2023 order records that he stands convicted in both FIR 429 and FIR 430.
    statement_hi: नवंबर 2014 की कार्रवाई से जुड़े दूसरे हत्या के मामले में, जो अनुयायी रजनी की मृत्यु से संबंधित है, रामपाल को 11 अक्टूबर 2018 को दोषी ठहराया गया और, द ट्रिब्यून के अनुसार, 17 अक्टूबर 2018 को 13 अनुयायियों सहित बिना छूट के आजीवन कारावास और प्रत्येक पर 2.05 लाख रुपये जुर्माने की सज़ा सुनाई गई; उच्च न्यायालय के 2023 के आदेश में दर्ज है कि वे एफआईआर 429 और एफआईआर 430 दोनों में दोषसिद्ध हैं।
    tier: convicted
    date: 2018-10-17
    source_ids: [ rampal-src-02, rampal-src-03, rampal-src-09 ]
  - id: rampal-claim-06
    case_id: rampal-hisar-barwala-rajni-death-2014
    statement_en: Bar & Bench reported on 4 September 2025 that the Punjab and Haryana High Court had suspended Rampal's life sentences in both murder cases pending appeal; The Tribune likewise reported in April 2026 that the sentences in FIRs 429 and 430 had been stayed by the High Court.
    statement_hi: बार एंड बेंच ने 4 सितंबर 2025 को बताया कि पंजाब एवं हरियाणा उच्च न्यायालय ने अपील लंबित रहने तक दोनों हत्या मामलों में रामपाल की आजीवन कारावास की सज़ा निलंबित कर दी है; द ट्रिब्यून ने भी अप्रैल 2026 में बताया कि एफआईआर 429 और 430 में सज़ाओं पर उच्च न्यायालय ने रोक लगा दी है।
    tier: convicted
    date: 2025-09-04
    source_ids: [ rampal-src-20, rampal-src-06, rampal-src-02 ]
  - id: rampal-claim-07
    case_id: rampal-hisar-barwala-rajni-death-2014
    statement_en: On 7 July 2020 the Punjab and Haryana High Court (S. Muralidhar and Avneesh Jhingan JJ) dismissed Rampal's application for interim bail to attend his granddaughter's wedding, and on 14 July 2020 a Supreme Court bench headed by Chief Justice S.A. Bobde refused him parole for the same purpose.
    statement_hi: 7 जुलाई 2020 को पंजाब एवं हरियाणा उच्च न्यायालय (न्यायमूर्ति एस. मुरलीधर और अवनीश झिंगन) ने पोती के विवाह में शामिल होने के लिए रामपाल की अंतरिम ज़मानत याचिका खारिज की, और 14 जुलाई 2020 को मुख्य न्यायाधीश एस.ए. बोबडे की अध्यक्षता वाली सर्वोच्च न्यायालय की पीठ ने उसी उद्देश्य के लिए पैरोल देने से इनकार किया।
    tier: convicted
    date: 2020-07-14
    source_ids: [ rampal-src-17, rampal-src-09, rampal-src-02 ]
  - id: rampal-claim-08
    case_id: rampal-hisar-barwala-fir428-sedition-uapa-2014
    statement_en: In FIR 428 dated 18 November 2014 (PS Barwala) the Special Court at Central Jail-I, Hisar framed charges against Rampal on 15 July 2016, reiterated on 16 January 2017, including IPC 121 and 121-A (waging or conspiring to wage war against the Government of India), UAPA sections 16 and 22-C, the Arms Act, the Explosive Substances Act and the Prevention of Damage to Public Property Act; the trial is pending.
    statement_hi: 18 नवंबर 2014 की एफआईआर 428 (थाना बरवाला) में हिसार की केंद्रीय जेल-I की विशेष अदालत ने 15 जुलाई 2016 को (16 जनवरी 2017 को पुनः) रामपाल पर आरोप तय किए, जिनमें आईपीसी 121 और 121-ए (भारत सरकार के विरुद्ध युद्ध छेड़ना या उसकी साज़िश), यूएपीए की धारा 16 और 22-सी, आर्म्स एक्ट, विस्फोटक पदार्थ अधिनियम और लोक संपत्ति क्षति निवारण अधिनियम शामिल हैं; विचारण लंबित है।
    tier: charged
    date: 2016-07-15
    source_ids: [ rampal-src-02, rampal-src-16 ]
  - id: rampal-claim-09
    case_id: rampal-hisar-barwala-fir428-sedition-uapa-2014
    statement_en: The UAPA section 22-C charge in FIR 428 is framed against Rampal as the person in charge of the Chhor Parmeshwar Bhagti Trust and the Bandi Chhor Mukti Trust, which the investigation report recorded in the High Court's 2023 order describes as registered under the Indian Trusts Act 1882; the same report records that the Barwala dera was set up in 2009 on 12 acres of purchased land on the Tohana road.
    statement_hi: एफआईआर 428 में यूएपीए की धारा 22-सी का आरोप रामपाल पर छोड़ परमेश्वर भगति ट्रस्ट और बंदी छोड़ मुक्ति ट्रस्ट के प्रभारी के रूप में तय किया गया है, जिन्हें उच्च न्यायालय के 2023 के आदेश में दर्ज जाँच रिपोर्ट भारतीय न्यास अधिनियम 1882 के तहत पंजीकृत बताती है; उसी रिपोर्ट में दर्ज है कि बरवाला डेरा 2009 में टोहाना रोड पर खरीदी गई 12 एकड़ भूमि पर स्थापित किया गया।
    tier: charged
    date: 2016-07-15
    source_ids: [ rampal-src-02 ]
  - id: rampal-claim-10
    case_id: rampal-hisar-barwala-fir428-sedition-uapa-2014
    statement_en: On 15 September 2023 a Division Bench of the Punjab and Haryana High Court (G.S. Sandhawalia and Alok Jain JJ) dismissed Rampal's second regular bail petition in FIR 428 (CRM-M-15399-2021), holding that the warrants had been executed "at the precious cost of innocent lives of women and a child" who "were being used as a human shields", while directing the trial court to expedite the trial.
    statement_hi: 15 सितंबर 2023 को पंजाब एवं हरियाणा उच्च न्यायालय की खंडपीठ (न्यायमूर्ति जी.एस. संधावालिया और आलोक जैन) ने एफआईआर 428 में रामपाल की दूसरी नियमित ज़मानत याचिका (CRM-M-15399-2021) खारिज की, यह कहते हुए कि वारंट "महिलाओं और एक बच्चे के निर्दोष जीवन की क़ीमत पर" तामील हुए जिन्हें "मानव ढाल" के रूप में इस्तेमाल किया गया, और विचारण अदालत को सुनवाई शीघ्र पूरी करने का निर्देश दिया।
    tier: charged
    date: 2023-09-15
    source_ids: [ rampal-src-02, rampal-src-16 ]
  - id: rampal-claim-11
    case_id: rampal-hisar-barwala-fir428-sedition-uapa-2014
    statement_en: On 8 April 2026 a Division Bench of the Punjab and Haryana High Court (Gurvinder Singh Gill and Ramesh Kumari JJ) granted Rampal regular bail in the November 2014 Barwala FIR, noting that he was around 74, had been in custody for approximately 11 years, that his health had been deteriorating in jail, and that co-accused had already been granted relief.
    statement_hi: 8 अप्रैल 2026 को पंजाब एवं हरियाणा उच्च न्यायालय की खंडपीठ (न्यायमूर्ति गुरविंदर सिंह गिल और रमेश कुमारी) ने नवंबर 2014 की बरवाला एफआईआर में रामपाल को नियमित ज़मानत दी, यह देखते हुए कि उनकी आयु लगभग 74 वर्ष है, वे लगभग 11 वर्ष हिरासत में रहे, जेल में उनका स्वास्थ्य बिगड़ता रहा है, और सह-अभियुक्तों को पहले ही राहत मिल चुकी है।
    tier: charged
    date: 2026-04-08
    source_ids: [ rampal-src-05, rampal-src-06, rampal-src-02 ]
  - id: rampal-claim-12
    case_id: rampal-hisar-barwala-fir426-427-2014
    statement_en: On 29 August 2017 the Hisar sessions court acquitted Rampal in two of the November 2014 Barwala cases (FIRs 426 and 427), which charged obstruction of public servants, rioting, unlawful assembly and disobedience of a public servant's order; the High Court's 2023 order records his acquittal in FIRs 426 and 427.
    statement_hi: 29 अगस्त 2017 को हिसार सत्र न्यायालय ने रामपाल को नवंबर 2014 के बरवाला के दो मामलों (एफआईआर 426 और 427) में बरी किया, जिनमें लोक सेवकों के कार्य में बाधा, बलवा, विधिविरुद्ध जमाव और लोक सेवक के आदेश की अवज्ञा के आरोप थे; उच्च न्यायालय के 2023 के आदेश में एफआईआर 426 और 427 में उनके बरी होने की बात दर्ज है।
    tier: acquitted
    date: 2017-08-29
    source_ids: [ rampal-src-11, rampal-src-02, rampal-src-06, rampal-src-15 ]
  - id: rampal-claim-13
    case_id: rampal-rohtak-karontha-2006
    statement_en: On 20 December 2022 Additional Sessions Judge Rakesh Singh, Rohtak, acquitted Rampal and 24 others in the case arising from the 12 July 2006 clash at Karontha village in which one man died and about 61 were injured, the allegation of firing from inside the ashram not having been proved; three other accused were convicted under the Arms Act and sentenced to two years.
    statement_hi: 20 दिसंबर 2022 को रोहतक के अतिरिक्त सत्र न्यायाधीश राकेश सिंह ने 12 जुलाई 2006 के करौंथा गाँव के संघर्ष, जिसमें एक व्यक्ति की मृत्यु और लगभग 61 घायल हुए थे, से उत्पन्न मामले में रामपाल और 24 अन्य को बरी किया, क्योंकि आश्रम के भीतर से गोली चलाने का आरोप साबित नहीं हुआ; तीन अन्य अभियुक्तों को आर्म्स एक्ट के तहत दोषी ठहराकर दो वर्ष की सज़ा दी गई।
    tier: acquitted
    date: 2022-12-20
    source_ids: [ rampal-src-07, rampal-src-02 ]
  - id: rampal-claim-14
    case_id: rampal-phhc-contempt-2014
    statement_en: After Rampal failed to appear before the Punjab and Haryana High Court in the contempt proceedings on 5, 10 and 17 November 2014, the court issued a fresh non-bailable warrant on 5 November 2014 and on 20 November 2014 cancelled his bail in the 2006 murder case and directed the Haryana DGP to file an affidavit on the operation to arrest him.
    statement_hi: 5, 10 और 17 नवंबर 2014 को अवमानना कार्यवाही में पंजाब एवं हरियाणा उच्च न्यायालय के समक्ष पेश न होने पर अदालत ने 5 नवंबर 2014 को नया गैर-ज़मानती वारंट जारी किया और 20 नवंबर 2014 को 2006 के हत्या मामले में उनकी ज़मानत रद्द कर हरियाणा डीजीपी को गिरफ़्तारी अभियान पर शपथपत्र दाखिल करने का निर्देश दिया।
    tier: regulatory_action
    date: 2014-11-20
    source_ids: [ rampal-src-10, rampal-src-22, rampal-src-02 ]
  - id: rampal-claim-15
    case_id: rampal-phhc-contempt-2014
    statement_en: On 8 October 2025 the Punjab and Haryana High Court closed the 2014 contempt of court case against Rampal after he sought the court's forgiveness for the violence of November 2014.
    statement_hi: 8 अक्टूबर 2025 को पंजाब एवं हरियाणा उच्च न्यायालय ने नवंबर 2014 की हिंसा के लिए रामपाल के क्षमा माँगने पर उनके विरुद्ध 2014 का न्यायालय अवमानना मामला बंद कर दिया।
    tier: closed
    date: 2025-10-08
    source_ids: [ rampal-src-19 ]
  - id: rampal-claim-16
    statement_en: On 10 September 2017 the Akhil Bharatiya Akhara Parishad, the apex body of Hindu akharas, released a list of 14 religious figures it asked governments to act against, and Rampal, then in Hisar jail awaiting trial, was among the names.
    statement_hi: 10 सितंबर 2017 को हिंदू अखाड़ों की शीर्ष संस्था अखिल भारतीय अखाड़ा परिषद ने 14 धार्मिक व्यक्तियों की एक सूची जारी की जिनके विरुद्ध उसने सरकारों से कार्रवाई की माँग की, और उस समय हिसार जेल में विचाराधीन रामपाल का नाम उनमें शामिल था।
    tier: allegation
    date: 2017-09-10
    source_ids: [ rampal-src-08 ]

events:
