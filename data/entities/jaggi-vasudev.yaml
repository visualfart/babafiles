    statement_hi: 28 फरवरी 2025 को सर्वोच्च न्यायालय ने प्रदूषण नियंत्रण बोर्ड के नोटिस को रद्द करने वाले मद्रास उच्च न्यायालय के निर्णय में हस्तक्षेप करने से इनकार किया, परंतु इसे इस शर्त पर रखा कि ईशा फाउंडेशन सभी पर्यावरणीय मानकों का पालन जारी रखे, यह स्पष्ट करते हुए कि यह निर्णय अनियमित निर्माण के लिए "स्थायी पास" नहीं है।
