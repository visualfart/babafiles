  - id: jaggi-vasudev-claim-08
    case_id: jaggi-vasudev-velliangiri-building-approval-2023
    statement_en: On 18 August 2023 the Madras High Court, in a public interest petition alleging unapproved construction of the Adiyogi statue and other buildings at the Velliangiri site since 2016, recorded the state's own status report that Isha Foundation had not obtained the necessary no-objection certificates and permissions, and directed the Joint Director of Town and Country Planning to verify the position and take expeditious action against any building found not to conform to an approved plan.
    statement_hi: 18 अगस्त 2023 को मद्रास उच्च न्यायालय ने, वेल्लियांगिरी स्थल पर 2016 से आदियोगी प्रतिमा और अन्य भवनों के बिना स्वीकृति निर्माण के आरोप वाली जनहित याचिका में, राज्य की स्वयं की उस स्टेटस रिपोर्ट को दर्ज किया कि ईशा फाउंडेशन ने आवश्यक अनापत्ति प्रमाणपत्र और अनुमतियाँ नहीं ली थीं, और नगर एवं ग्राम योजना के संयुक्त निदेशक को स्थिति की जाँच कर स्वीकृत योजना के अनुरूप न पाए जाने वाले किसी भी भवन के विरुद्ध शीघ्रता से कार्रवाई करने का निर्देश दिया।
    tier: regulatory_action
    date: 2023-08-18
    source_ids: [jaggi-vasudev-src-14, jaggi-vasudev-src-12]

