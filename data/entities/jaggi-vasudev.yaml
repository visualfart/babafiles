      unauthorised construction by Isha Foundation (respondent 12) on named survey fields at Ikkarai
      Poluvampatti village, Perur taluk, Coimbatore. The Special Government Pleader placed on record a
      status report that no-objection certificates and permissions had not been obtained by Isha
      Foundation. The Court directed the Joint Director, District Town and Country Planning, to verify the
      permissions in force after considering documents from both sides and, if not in order, to take
      expeditious steps regarding any building not constructed in accordance with the sanctioned plan and
      NOC; Isha Foundation was directed to place its documents before the authority within two weeks. The
      writ petition was disposed of with no order as to costs.

cases:
  - id: jaggi-vasudev-habeas-corpus-isha-2024
    title_en: Isha Foundation v. S. Kamaraj (habeas corpus petition transferred to the Supreme Court)
    title_hi: ईशा फाउंडेशन बनाम एस. कामराज (सर्वोच्च न्यायालय को स्थानांतरित बंदी प्रत्यक्षीकरण याचिका)
    jurisdiction_country: IN
    jurisdiction_region: Tamil Nadu / Supreme Court of India
    court: Madras High Court (originating); Supreme Court of India (on transfer)
    case_number: Habeas Corpus Petition No. 2487 of 2024 (Madras High Court); SLP (Crl.) No. 13992/2024 (Supreme Court)
    filed_year: 2024
    case_type: criminal
    statutes: [Article 226 of the Constitution, Article 32/136 of the Constitution]
    status: closed
    tier: closed
    verdict_date: 2024-10-18
    sentence_or_remedy: Petition disposed of; no direction against Isha Foundation; closure clarified not to affect other regulatory compliances
    appeal_status: Not applicable
    summary_en: >
      Dr. S. Kamaraj, a retired professor, filed a habeas corpus petition before the Madras High Court
      seeking the production of his two adult daughters, monks at Isha Foundation known by their monastic
      names Maa Mathi and Maa Maayu, whom he alleged were held captive at the ashram in Thondamuthur,
      Coimbatore. On 30 September 2024 a Division Bench, after examining both women and the petitioner in
      court, directed the Coimbatore Rural Police to enquire into claims that other residents were staying
      under compulsion; about 150 police officers, accompanied by the District Child Welfare Committee, a
      District Child Protection Officer, health and food-safety officials and two psychiatrists, visited
      the ashram over two days. The Supreme Court took up the matter on 3 October 2024, transferred the
      petition to itself, stayed further police action beyond the status report, and interacted with both
      women by video conference in chambers; they said they had joined the ashram as adults at 24 and 27
      (now 39 and 42), travelled outside freely, one had run a 10 km marathon, and their parents visited
      periodically. On 18 October 2024 the Court held that, both being adults who had repeatedly expressed
      a clear wish to continue at the ashram, the purpose of the habeas corpus petition was fulfilled and no
      further directions were needed; it held that the Madras High Court's jurisdiction in a habeas corpus
      matter was "well-defined" and it should not have commented beyond that scope, and closed the
      proceedings, clarifying that this did not affect any other regulatory compliance required of Isha Foundation.
    summary_hi: >
      सेवानिवृत्त प्रोफेसर डॉ. एस. कामराज ने मद्रास उच्च न्यायालय में बंदी प्रत्यक्षीकरण याचिका दाखिल कर
      अपनी दो वयस्क बेटियों — जो ईशा फाउंडेशन में साध्वी हैं और अपने संन्यास नामों माँ माथी और माँ मायु से
      जानी जाती हैं — को पेश करने की माँग की, यह आरोप लगाते हुए कि उन्हें कोयंबटूर के थोंडामुथुर स्थित
      आश्रम में बंदी बनाकर रखा गया है। 30 सितंबर 2024 को खंडपीठ ने अदालत में दोनों महिलाओं और याचिकाकर्ता
      से पूछताछ करने के बाद कोयंबटूर ग्रामीण पुलिस को इन दावों की जाँच का निर्देश दिया कि अन्य निवासी
      दबाव में रह रहे हैं; लगभग 150 पुलिसकर्मी, ज़िला बाल कल्याण समिति, ज़िला बाल संरक्षण अधिकारी,
      स्वास्थ्य व खाद्य सुरक्षा अधिकारियों और दो मनोचिकित्सकों के साथ, दो दिनों तक आश्रम में गए। सर्वोच्च
      न्यायालय ने 3 अक्टूबर 2024 को मामला अपने पास लिया, याचिका स्थानांतरित की, स्टेटस रिपोर्ट से आगे की
      पुलिस कार्रवाई पर रोक लगाई, और चैंबर में वीडियो कॉन्फ्रेंसिंग के ज़रिए दोनों महिलाओं से बात की; उन्होंने
      बताया कि वे 24 और 27 वर्ष की आयु में वयस्क होकर आश्रम में शामिल हुई थीं (अब 39 और 42 वर्ष की हैं),
      स्वतंत्र रूप से बाहर आती-जाती हैं, एक ने 10 किमी मैराथन दौड़ी है, और उनके माता-पिता समय-समय पर मिलने
      आते हैं। 18 अक्टूबर 2024 को न्यायालय ने कहा कि चूँकि दोनों वयस्क हैं और उन्होंने बार-बार आश्रम में
      रहने की स्पष्ट इच्छा जताई है, इसलिए बंदी प्रत्यक्षीकरण याचिका का उद्देश्य पूरा हो गया और आगे कोई
      निर्देश आवश्यक नहीं; उसने कहा कि बंदी प्रत्यक्षीकरण मामले में मद्रास उच्च न्यायालय का अधिकार-क्षेत्र
      "सुपरिभाषित" है और उसे इस दायरे से बाहर टिप्पणी नहीं करनी चाहिए थी, और कार्यवाही बंद कर दी, यह स्पष्ट
      करते हुए कि इससे ईशा फाउंडेशन पर लागू अन्य नियामक अनुपालन आवश्यकताएँ प्रभावित नहीं होंगी।
    source_ids: [jaggi-vasudev-src-01, jaggi-vasudev-src-02, jaggi-vasudev-src-03, jaggi-vasudev-src-04, jaggi-vasudev-src-05]

  - id: jaggi-vasudev-tnpcb-environmental-clearance-2022
    title_en: Isha Foundation v. Union of India and Others (Tamil Nadu Pollution Control Board notice)
    title_hi: ईशा फाउंडेशन बनाम भारत संघ एवं अन्य (तमिलनाडु प्रदूषण नियंत्रण बोर्ड नोटिस)
    jurisdiction_country: IN
    jurisdiction_region: Tamil Nadu
    court: Madras High Court; Supreme Court of India (on special leave)
    case_number: W.P. No. 467 of 2022 (Madras High Court)
    filed_year: 2022
    case_type: regulatory
    statutes: [Environment Protection Act 1986, "EIA Notification 2006/2014"]
    status: closed; notice quashed, upheld by the Supreme Court
    tier: closed
    verdict_date: 2022-12-14
    sentence_or_remedy: Show cause notice quashed; no order as to costs; Supreme Court declined to interfere subject to continued compliance with environmental norms
    appeal_status: Supreme Court disposed of the special leave petition on 28 February 2025, declining to disturb the High Court's ruling
    summary_en: >
      The Tamil Nadu Pollution Control Board issued a show cause notice on 19 November 2021 alleging that
      Isha Foundation had constructed buildings at its Velliangiri Yoga Center between 2006 and 2014
      without the environmental clearance required under the EIA Notification, and sought to initiate
      prosecution. Isha Foundation challenged the notice, and on 14 December 2022 a Division Bench (T. Raja,
      Acting Chief Justice, and D. Krishnakumar J.) held that the Yoga Center, comprising residential units,
      a school and a meditation hall on a 4,87,418.59 sq.m. plot, fell within the definition of an
      "educational institution" under the 2014 amendment to the EIA Notification, which retrospectively
      exempted such institutions from clearance requirements for both pre-2006 and 2006-2014 construction,
      and quashed the notice. On 28 February 2025 a Supreme Court bench of Surya Kant and N. Kotiswar Singh
      JJ declined to interfere with the ruling, on the condition that no coercive action be taken against
      Isha Foundation but that it continue to comply with all environmental norms, clarifying that the
      order was not a "permanent gate pass" for irregular construction and did not exempt future expansion
      from prior authorisation.
    summary_hi: >
      तमिलनाडु प्रदूषण नियंत्रण बोर्ड ने 19 नवंबर 2021 को एक कारण बताओ नोटिस जारी कर आरोप लगाया कि ईशा
      फाउंडेशन ने अपने वेल्लियांगिरी योग केंद्र में 2006 से 2014 के बीच ईआईए अधिसूचना के तहत आवश्यक
      पर्यावरणीय स्वीकृति के बिना निर्माण किया, और अभियोजन शुरू करने का प्रयास किया। ईशा फाउंडेशन ने इस
      नोटिस को चुनौती दी, और 14 दिसंबर 2022 को खंडपीठ (कार्यवाहक मुख्य न्यायाधीश टी. राजा और न्यायमूर्ति
      डी. कृष्णकुमार) ने कहा कि 4,87,418.59 वर्ग मीटर भूखंड पर आवासीय इकाइयों, एक विद्यालय और ध्यान कक्ष
      से युक्त योग केंद्र, ईआईए अधिसूचना के 2014 संशोधन के तहत "शैक्षणिक संस्थान" की परिभाषा में आता है,
      जो ऐसे संस्थानों को 2006 से पहले और 2006-2014 के निर्माण के लिए पूर्वव्यापी रूप से स्वीकृति की
      आवश्यकता से छूट देता है, और नोटिस को रद्द कर दिया। 28 फरवरी 2025 को सर्वोच्च न्यायालय की न्यायमूर्ति
      सूर्यकांत और एन. कोटिश्वर सिंह की पीठ ने इस निर्णय में हस्तक्षेप करने से इनकार किया, इस शर्त पर कि
      ईशा फाउंडेशन के विरुद्ध कोई दंडात्मक कार्रवाई न हो लेकिन वह सभी पर्यावरणीय मानकों का पालन जारी रखे,
      यह स्पष्ट करते हुए कि यह आदेश अनियमित निर्माण के लिए "स्थायी पास" नहीं है और भविष्य के विस्तार को
      पूर्व स्वीकृति से मुक्त नहीं करता।
    source_ids: [jaggi-vasudev-src-10, jaggi-vasudev-src-11]

  - id: jaggi-vasudev-velliangiri-building-approval-2023
    title_en: Velliangiri Hill Tribal Protection Society v. Union of India and Others (building-approval PIL)
    title_hi: वेल्लियांगिरी हिल ट्राइबल प्रोटेक्शन सोसाइटी बनाम भारत संघ एवं अन्य (भवन-स्वीकृति जनहित याचिका)
    jurisdiction_country: IN
    jurisdiction_region: Tamil Nadu
    court: Madras High Court
    case_number: W.P. No. 3556 of 2017 (2023 LiveLaw (Mad) 241)
    filed_year: 2017
    case_type: regulatory
    statutes: ["Tamil Nadu Town and Country Planning Act", "Hill Area Conservation Authority regulations"]
    status: disposed of; authorities directed to verify approvals and act, no order as to costs
    tier: regulatory_action
    verdict_date: 2023-08-18
    sentence_or_remedy: Joint Director of Town and Country Planning directed to verify whether permissions were obtained for the Adiyogi statue and other buildings and take expeditious action if not; petition disposed of, no order as to costs
    appeal_status: Outcome of the directed verification not further confirmed
    summary_en: >
      P. Muthammal, president of the Velliangiri Hill Tribal Protection Society, filed W.P. No. 3556 of
      2017 seeking a writ of mandamus directing restoration of wetlands by demolishing construction Isha
      Foundation had carried out since August 2016 - including the 112-foot Adiyogi statue, an arch, a
      road, a parking lot and mandapams - on named survey fields at Ikkarai Poluvampatti village, Perur
      taluk, Coimbatore, without approvals from the District Collector, the Hill Area Conservation
      Authority or the Pollution Control Board. At the hearing on 18 August 2023 the state's own Special
      Government Pleader placed on record a status report that the necessary no-objection certificates and
      permissions had not been obtained by Isha Foundation. Rather than order demolition, a Bench of Chief
      Justice Sanjay V. Gangapurwala and P.D. Audikesavalu J. directed the Joint Director of Town and
      Country Planning to examine the land and construction records placed before it by both sides and, if
      approvals were found wanting, to "take further steps expeditiously" regarding buildings not
      constructed in accordance with the sanctioned plan; Isha Foundation was directed to place its
      documents before the authority within two weeks. The writ petition was disposed of with no order as
      to costs.
    summary_hi: >
      वेल्लियांगिरी हिल ट्राइबल प्रोटेक्शन सोसाइटी की अध्यक्ष पी. मुथम्मल ने डब्ल्यूपी संख्या 3556/2017
      दाखिल कर बंदी प्रत्यक्षीकरण के बजाय परमादेश रिट की माँग की, ताकि ईशा फाउंडेशन द्वारा अगस्त 2016 से
      कोयंबटूर के पेरूर तालुक स्थित इक्करई पोलुवमपट्टी गाँव के नामित सर्वे क्षेत्रों में — 112 फुट ऊँची
      आदियोगी प्रतिमा, एक द्वार, सड़क, पार्किंग स्थल और मंडपम सहित — बिना ज़िला कलेक्टर, हिल एरिया
      कंज़र्वेशन अथॉरिटी या प्रदूषण नियंत्रण बोर्ड की स्वीकृति के किए गए निर्माण को ध्वस्त कर आर्द्रभूमि
      को पुनर्स्थापित किया जाए। 18 अगस्त 2023 की सुनवाई में राज्य की अपनी विशेष सरकारी वकील ने स्टेटस
      रिपोर्ट पेश की कि ईशा फाउंडेशन ने आवश्यक अनापत्ति प्रमाणपत्र और अनुमतियाँ नहीं ली थीं। ध्वस्तीकरण का
      आदेश देने के बजाय, मुख्य न्यायाधीश संजय वी. गंगापुरवाला और न्यायमूर्ति पी.डी. औदिकेसावलु की पीठ ने
      नगर एवं ग्राम योजना के संयुक्त निदेशक को दोनों पक्षों द्वारा पेश भूमि और निर्माण अभिलेखों की जाँच
      करने और यदि स्वीकृतियाँ अपर्याप्त पाई जाएँ तो स्वीकृत योजना के अनुरूप न बने भवनों के विरुद्ध
      "शीघ्रता से आगे के कदम उठाने" का निर्देश दिया; ईशा फाउंडेशन को दो सप्ताह के भीतर अपने दस्तावेज़
      प्राधिकरण के समक्ष रखने को कहा गया। रिट याचिका बिना किसी हर्जाने के आदेश के निपटाई गई।
    source_ids: [jaggi-vasudev-src-14, jaggi-vasudev-src-12]

claims:
  - id: jaggi-vasudev-claim-01
    case_id: jaggi-vasudev-habeas-corpus-isha-2024
    statement_en: On 30 September 2024 a Division Bench of the Madras High Court, after examining S. Kamaraj's two adult daughters and Kamaraj himself in open court, directed the Coimbatore Rural Police to enquire into claims that persons were staying at the Isha Foundation ashram under compulsion and file a status report.
    statement_hi: 30 सितंबर 2024 को मद्रास उच्च न्यायालय की खंडपीठ ने एस. कामराज की दोनों वयस्क बेटियों और स्वयं कामराज से खुली अदालत में पूछताछ करने के बाद कोयंबटूर ग्रामीण पुलिस को इन दावों की जाँच कर स्टेटस रिपोर्ट दाखिल करने का निर्देश दिया कि ईशा फाउंडेशन आश्रम में लोग दबाव में रह रहे हैं।
    tier: regulatory_action
    date: 2024-09-30
    source_ids: [jaggi-vasudev-src-01]
  - id: jaggi-vasudev-claim-02
    case_id: jaggi-vasudev-habeas-corpus-isha-2024
    statement_en: On 3 October 2024 the Supreme Court transferred Habeas Corpus Petition No. 2487 of 2024 from the Madras High Court to itself and stayed the Coimbatore Police from taking any further action beyond filing the status report already directed by the High Court.
    statement_hi: 3 अक्टूबर 2024 को सर्वोच्च न्यायालय ने बंदी प्रत्यक्षीकरण याचिका संख्या 2487/2024 को मद्रास उच्च न्यायालय से अपने पास स्थानांतरित किया और कोयंबटूर पुलिस को उच्च न्यायालय द्वारा पहले से निर्देशित स्टेटस रिपोर्ट दाखिल करने से आगे कोई भी कार्रवाई करने से रोक दिया।
    tier: closed
    date: 2024-10-03
    source_ids: [jaggi-vasudev-src-01, jaggi-vasudev-src-04]
  - id: jaggi-vasudev-claim-03
    case_id: jaggi-vasudev-habeas-corpus-isha-2024
    statement_en: On 18 October 2024 the Supreme Court (D.Y. Chandrachud CJI, J.B. Pardiwala and Manoj Misra JJ) closed the habeas corpus proceedings, holding that both women, having attained majority before joining the ashram and having repeatedly and clearly expressed their wish to continue residing there, the purpose of the petition was fulfilled and no further directions were necessary.
    statement_hi: 18 अक्टूबर 2024 को सर्वोच्च न्यायालय (मुख्य न्यायाधीश डी.वाई. चंद्रचूड़, न्यायमूर्ति जे.बी. पारदीवाला और न्यायमूर्ति मनोज मिश्रा) ने बंदी प्रत्यक्षीकरण कार्यवाही बंद कर दी, यह मानते हुए कि दोनों महिलाएँ, जो आश्रम में शामिल होने से पहले ही वयस्क हो चुकी थीं और जिन्होंने बार-बार व स्पष्ट रूप से वहाँ रहने की इच्छा व्यक्त की है, इसलिए याचिका का उद्देश्य पूरा हो गया और आगे कोई निर्देश आवश्यक नहीं है।
    tier: closed
    date: 2024-10-18
    source_ids: [jaggi-vasudev-src-01, jaggi-vasudev-src-02, jaggi-vasudev-src-03]
  - id: jaggi-vasudev-claim-04
    case_id: jaggi-vasudev-habeas-corpus-isha-2024
    statement_en: In its 18 October 2024 order the Supreme Court held that "the High Court ought not to have commented on things other than the subject matter of the Habeas Corpus," finding that the Madras High Court's jurisdiction under Article 226 in a habeas corpus matter is well-defined and should not have been expanded beyond the petition's core issue.
    statement_hi: अपने 18 अक्टूबर 2024 के आदेश में सर्वोच्च न्यायालय ने कहा कि "उच्च न्यायालय को बंदी प्रत्यक्षीकरण के विषय-वस्तु से हटकर अन्य बातों पर टिप्पणी नहीं करनी चाहिए थी," यह पाते हुए कि बंदी प्रत्यक्षीकरण मामले में अनुच्छेद 226 के तहत मद्रास उच्च न्यायालय का अधिकार-क्षेत्र सुपरिभाषित है और याचिका के मूल मुद्दे से आगे नहीं बढ़ाया जाना चाहिए था।
    tier: closed
    date: 2024-10-18
    source_ids: [jaggi-vasudev-src-01, jaggi-vasudev-src-05]
