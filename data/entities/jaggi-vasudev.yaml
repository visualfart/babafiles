    statement_hi: 19 नवंबर 2021 को तमिलनाडु प्रदूषण नियंत्रण बोर्ड ने ईशा फाउंडेशन को कारण बताओ नोटिस जारी कर आरोप लगाया कि उसके वेल्लियांगिरी योग केंद्र में 2006 से 2014 के बीच ईआईए अधिसूचना के तहत आवश्यक पर्यावरणीय स्वीकृति के बिना भवन निर्माण किया गया, और अभियोजन शुरू करने का प्रयास किया।
