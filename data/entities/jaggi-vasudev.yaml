    statement_hi: 14 दिसंबर 2022 को मद्रास उच्च न्यायालय ने प्रदूषण नियंत्रण बोर्ड के कारण बताओ नोटिस को रद्द कर दिया, यह मानते हुए कि वेल्लियांगिरी योग केंद्र ईआईए अधिसूचना के 2014 संशोधन के तहत "शैक्षणिक संस्थान" की परिभाषा में आता है और इसलिए उसे 2006 से पहले तथा 2006-2014 के निर्माण के लिए पूर्वव्यापी रूप से पर्यावरणीय स्वीकृति से छूट प्राप्त है।
