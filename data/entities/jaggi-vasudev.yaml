id: jaggi-vasudev
type: person
is_subject: true
name_en: Jaggi Vasudev
name_hi: जग्गी वासुदेव
aliases: [Sadhguru, Sadhguru Jaggi Vasudev, Jagadish Vasudev]
born: 1957-09-03
died:
base_location: Isha Yoga Center, Velliangiri Foothills, Coimbatore, Tamil Nadu
country: IN
countries_of_operation: [IN]
organisations: [Isha Foundation]
activity_status: active
summary_en: >
  Jaggi Vasudev, known as Sadhguru, founded the Isha Foundation, whose main centre sits at
  the foothills of the Velliangiri hills near Coimbatore, Tamil Nadu. In September 2024 a
  retired professor, S. Kamaraj, filed a habeas corpus petition in the Madras High Court
  alleging that his two adult daughters, both monks at the ashram, were being held there
  against their will; after a Division Bench ordered a police enquiry and about 150
  officers visited the premises, the Supreme Court transferred the case to itself, stayed
  further police action, interacted with the two women directly, and on 18 October 2024
  closed the proceedings, holding that they had freely and repeatedly affirmed their wish
  to remain and that the Madras High Court should not have commented beyond the scope of a
  habeas corpus petition. Separately, in September 2024 a doctor engaged for an Isha
  Foundation rural medical camp was arrested and charged under the POCSO Act over the
  alleged sexual assault of school students; that case concerns the doctor as accused and
  is not a claim against Jaggi Vasudev. On environmental and building-approval litigation
  over construction at the Velliangiri site, the Madras High Court quashed a Tamil Nadu
  Pollution Control Board notice against the Foundation in December 2022, a ruling the
  Supreme Court declined to disturb in February 2025 subject to continued compliance with
  environmental norms, while a separate 2023 High Court order directed authorities to
  verify planning approvals for the Adiyogi statue and other buildings and act if they were
  found unauthorised.
summary_hi: >
  जग्गी वासुदेव, जिन्हें सद्गुरु के नाम से जाना जाता है, ने ईशा फाउंडेशन की स्थापना की, जिसका मुख्य
  केंद्र कोयंबटूर, तमिलनाडु के निकट वेल्लियांगिरी पहाड़ियों की तलहटी में स्थित है। सितंबर 2024 में एक
  सेवानिवृत्त प्रोफेसर एस. कामराज ने मद्रास उच्च न्यायालय में बंदी प्रत्यक्षीकरण याचिका दाखिल कर आरोप
  लगाया कि उनकी दो वयस्क बेटियाँ, जो आश्रम में साध्वी हैं, उन्हें वहाँ उनकी इच्छा के विरुद्ध रोका जा रहा
  है; खंडपीठ द्वारा पुलिस जाँच का आदेश दिए जाने और लगभग 150 पुलिसकर्मियों के परिसर में जाने के बाद,
  सर्वोच्च न्यायालय ने मामला अपने पास स्थानांतरित किया, आगे की पुलिस कार्रवाई पर रोक लगाई, दोनों
  महिलाओं से सीधे बातचीत की, और 18 अक्टूबर 2024 को कार्यवाही बंद कर दी, यह मानते हुए कि उन्होंने बार-बार
  स्वेच्छा से वहाँ रहने की इच्छा व्यक्त की थी और मद्रास उच्च न्यायालय को बंदी प्रत्यक्षीकरण याचिका के दायरे
  से बाहर टिप्पणी नहीं करनी चाहिए थी। अलग से, सितंबर 2024 में ईशा फाउंडेशन के ग्रामीण चिकित्सा शिविर के
  लिए नियुक्त एक चिकित्सक को स्कूली छात्राओं के कथित यौन उत्पीड़न के आरोप में गिरफ्तार कर पॉक्सो अधिनियम
  के तहत आरोपित किया गया; वह मामला उस चिकित्सक को अभियुक्त मानकर दर्ज है, जग्गी वासुदेव के विरुद्ध दावा
  नहीं है। वेल्लियांगिरी स्थल पर निर्माण से जुड़े पर्यावरणीय और भवन-स्वीकृति मुकदमों में, मद्रास उच्च
  न्यायालय ने दिसंबर 2022 में तमिलनाडु प्रदूषण नियंत्रण बोर्ड के नोटिस को रद्द कर दिया, जिस निर्णय में
  हस्तक्षेप करने से सर्वोच्च न्यायालय ने फरवरी 2025 में इनकार किया, बशर्ते पर्यावरणीय मानकों का पालन जारी
  रहे, जबकि 2023 के एक अलग उच्च न्यायालय आदेश में अधिकारियों को आदियोगी प्रतिमा और अन्य भवनों की योजना
  स्वीकृतियाँ जाँचने और अनधिकृत पाए जाने पर कार्रवाई करने का निर्देश दिया गया।
hi_reviewed: false
response_from_subject:
  text_en: >
    In its submissions to the Supreme Court in the habeas corpus proceedings, Isha
    Foundation stated: "Isha Foundation is a safe space for seekers from all over the
    world. People from various parts of India and numerous countries reside here"; that
    both women "are living at the ashram of their own free will. They move freely, with one
    even recently participating in a 10 km marathon"; that "we do not ask individuals to
    marry or take up monkhood; these are personal choices"; and that "Isha Foundation is
    fully compliant with POSH regulations and has an active internal sexual harassment
    committee."
  text_hi: >
    बंदी प्रत्यक्षीकरण कार्यवाही में सर्वोच्च न्यायालय के समक्ष अपने प्रस्तुतीकरण में ईशा फाउंडेशन ने कहा:
    "ईशा फाउंडेशन दुनिया भर के साधकों के लिए एक सुरक्षित स्थान है। भारत के विभिन्न हिस्सों और कई देशों के
    लोग यहाँ निवास करते हैं"; कि दोनों महिलाएँ "अपनी स्वेच्छा से आश्रम में रह रही हैं। वे स्वतंत्र रूप से
    आती-जाती हैं, और उनमें से एक ने हाल ही में 10 किमी की मैराथन में भी भाग लिया"; कि "हम किसी को विवाह
    करने या संन्यास लेने के लिए नहीं कहते; ये व्यक्तिगत निर्णय हैं"; और कि "ईशा फाउंडेशन पॉश (POSH)
    नियमों का पूर्ण अनुपालन करता है और इसकी एक सक्रिय आंतरिक यौन उत्पीड़न शिकायत समिति है।"
  source_id: jaggi-vasudev-src-06

