id: gurmeet-ram-rahim-singh
type: person
is_subject: true
name_en: Gurmeet Ram Rahim Singh
name_hi: गुरमीत राम रहीम सिंह
aliases: [Baba Gurmeet Singh, Maharaj Gurmeet Singh, Sant Gurmeet Ram Rahim Singh Insan, Gurmeet Ram Rahim Singh Insan, Dera chief, Sirsa Dera head]
born: 1967-08-15
died:
base_location: Sirsa, Haryana
country: IN
countries_of_operation: [IN]
organisations: [Dera Sacha Sauda]
activity_status: imprisoned
abap_2017_list: false
summary_en: >
  Gurmeet Ram Rahim Singh has headed the Sirsa-based Dera Sacha Sauda since 1990. On 25 August 2017
  a Special CBI Court at Panchkula convicted him of raping two female disciples and sentenced him to
  20 years' imprisonment; his appeal against that conviction is pending in the Punjab and Haryana High
  Court and he is lodged in Sunaria jail, Rohtak. He was also convicted by the same court of conspiring
  to murder journalist Ram Chander Chhatrapati (2019) and former Dera manager Ranjit Singh (2021), but
  the High Court set aside both convictions on appeal (28 May 2024 and 7 March 2026); appeals against
  both acquittals are pending in the Supreme Court. Charges have been framed against him in a CBI case
  about the castration of followers, and he is an accused in three 2015 sacrilege cases in Punjab that
  are on trial at Chandigarh. Since 2022 he has been released on parole or furlough repeatedly, several
  times in the days before state elections, which drew opposition complaints and litigation.
summary_hi: >
  गुरमीत राम रहीम सिंह 1990 से सिरसा स्थित डेरा सच्चा सौदा के प्रमुख हैं। 25 अगस्त 2017 को पंचकूला की
  विशेष सीबीआई अदालत ने उन्हें दो महिला अनुयायियों से बलात्कार का दोषी ठहराया और 20 साल कारावास की सज़ा
  सुनाई; इस दोषसिद्धि के विरुद्ध उनकी अपील पंजाब एवं हरियाणा उच्च न्यायालय में लंबित है और वे रोहतक की
  सुनारिया जेल में बंद हैं। इसी अदालत ने उन्हें पत्रकार राम चंदर छत्रपति (2019) और पूर्व डेरा प्रबंधक
  रणजीत सिंह (2021) की हत्या की साज़िश का भी दोषी ठहराया था, लेकिन उच्च न्यायालय ने अपील पर दोनों
  दोषसिद्धियाँ रद्द कर दीं (28 मई 2024 और 7 मार्च 2026); दोनों बरी किए जाने के विरुद्ध अपीलें सर्वोच्च
  न्यायालय में लंबित हैं। अनुयायियों के बधियाकरण से जुड़े सीबीआई मामले में उन पर आरोप तय हो चुके हैं और
  पंजाब के 2015 के तीन बेअदबी मामलों में वे अभियुक्त हैं, जिनकी सुनवाई चंडीगढ़ में चल रही है। 2022 से उन्हें
  बार-बार पैरोल या फरलो पर रिहा किया गया है, कई बार राज्य चुनावों से ठीक पहले, जिस पर विपक्ष ने आपत्ति
  जताई और मुकदमे हुए।
hi_reviewed: false
response_from_subject:
  text_en: >
    After the 7 March 2026 High Court acquittal in the Chhatrapati case, Dera spokesperson Jitender
    Khurana said the sect had always maintained that Ram Rahim was innocent and that the allegations
    against him were baseless. On the day of the 2017 rape conviction, Dera spokesperson Dilawar Insan
    said: "I just want to request everyone to maintain peace at the moment. We will explore what legal
    options are available to us."
  text_hi: >
    छत्रपति मामले में 7 मार्च 2026 को उच्च न्यायालय द्वारा बरी किए जाने के बाद डेरा प्रवक्ता जितेंद्र
    खुराना ने कहा कि डेरा हमेशा से कहता रहा है कि राम रहीम निर्दोष हैं और उन पर लगे आरोप निराधार हैं।
    2017 में बलात्कार मामले में दोषसिद्धि के दिन डेरा प्रवक्ता दिलावर इंसां ने कहा था कि वे सभी से
    शांति बनाए रखने का अनुरोध करते हैं और उपलब्ध कानूनी विकल्पों पर विचार करेंगे।
  source_id: grrs-src-06

