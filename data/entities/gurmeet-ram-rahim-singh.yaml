cases:
  - id: grrs-panchkula-rape-2002
    title_en: CBI v. Gurmeet Ram Rahim Singh (rape of two disciples, RC-5, Special Judge CBI Panchkula)
    title_hi: सीबीआई बनाम गुरमीत राम रहीम सिंह (दो अनुयायियों से बलात्कार, आरसी-5, विशेष न्यायाधीश सीबीआई पंचकूला)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Special Judge (CBI), Haryana, Panchkula
    case_number: CBI case RC-5 (2002); conviction of 25.08.2017
    filed_year: 2002
    case_type: criminal
    statutes: [IPC 376, IPC 506]
    status: convicted; appeal against conviction pending in Punjab and Haryana High Court
    tier: convicted
    verdict_date: 2017-08-25
    sentence_or_remedy: 20 years' rigorous imprisonment (sentence pronounced 28 August 2017 at Sunaria jail, Rohtak)
    appeal_status: Pending, Punjab and Haryana High Court; application for suspension of sentence withdrawn with liberty on 23 July 2025
    summary_en: >
      The Punjab and Haryana High Court took suo motu cognisance in 2002 of an anonymous letter, addressed
      to the Prime Minister, alleging sexual exploitation of female disciples ("sadhvis") at the Dera, and by
      order of 10 November 2003 entrusted the investigation to the CBI. On 25 August 2017 the Special CBI
      Court at Panchkula convicted Gurmeet Ram Rahim Singh of raping two disciples; on 28 August 2017 he was
      sentenced to 20 years' rigorous imprisonment. He is serving the sentence in Sunaria jail, Rohtak. His
      appeal against the conviction is pending in the High Court; on 23 July 2025 his counsel withdrew an
      application for suspension of sentence with liberty to revisit the court.
    summary_hi: >
      पंजाब एवं हरियाणा उच्च न्यायालय ने 2002 में प्रधानमंत्री को संबोधित एक गुमनाम पत्र पर स्वतः संज्ञान लिया,
      जिसमें डेरे में महिला अनुयायियों ("साध्वियों") के यौन शोषण का आरोप था, और 10 नवंबर 2003 के आदेश से जाँच
      सीबीआई को सौंपी। 25 अगस्त 2017 को पंचकूला की विशेष सीबीआई अदालत ने गुरमीत राम रहीम सिंह को दो
      अनुयायियों से बलात्कार का दोषी ठहराया; 28 अगस्त 2017 को उन्हें 20 वर्ष के कठोर कारावास की सज़ा
      सुनाई गई। वे रोहतक की सुनारिया जेल में सज़ा काट रहे हैं। दोषसिद्धि के विरुद्ध उनकी अपील उच्च न्यायालय
      में लंबित है; 23 जुलाई 2025 को उनके वकील ने सज़ा निलंबन की अर्ज़ी वापस ले ली।
    source_ids: [grrs-src-01, grrs-src-14, grrs-src-17, grrs-src-08]

  - id: grrs-chhatrapati-murder-2002
    title_en: CBI v. Gurmeet Ram Rahim Singh and others (murder of journalist Ram Chander Chhatrapati)
    title_hi: सीबीआई बनाम गुरमीत राम रहीम सिंह व अन्य (पत्रकार राम चंदर छत्रपति की हत्या)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Special Judge (CBI), Haryana, Panchkula; Punjab and Haryana High Court on appeal
    case_number: FIR No. 685 of 2002, PS City Sirsa; CBI RC10/3; CRA-D-240-D-2019
    filed_year: 2002
    case_type: criminal
    statutes: [IPC 302, IPC 120-B, Arms Act s.25, Arms Act s.27]
    status: convicted at trial (2019); acquitted by High Court on 7 March 2026; appeal against acquittal admitted by Supreme Court on 10 August 2026
    tier: acquitted
    verdict_date: 2026-03-07
    sentence_or_remedy: Trial court sentence of life imprisonment and Rs 50,000 fine (17 January 2019) set aside on appeal
    appeal_status: Supreme Court admitted the victim's son's appeal against the acquittal on 10 August 2026; final hearing listed for the week of 16 November 2026
    summary_en: >
      Ram Chander Chhatrapati, editor of the Sirsa evening daily Poora Sach, which had published the anonymous
      letter alleging sexual exploitation at the Dera, was shot outside his house on 24 October 2002 and died on
      21 November 2002. FIR No. 685 of 2002 was registered at PS City, Sirsa; the High Court transferred the
      investigation to the CBI on 10 November 2003. On 11 January 2019 the Special CBI Court convicted Gurmeet
      Ram Rahim Singh, Kuldeep Singh, Nirmal Singh and Krishan Lal, and on 17 January 2019 sentenced each to
      life imprisonment with a fine of Rs 50,000. On 7 March 2026 a Division Bench of the High Court (Chief
      Justice Sheel Nagu and Justice Vikram Aggarwal) allowed Ram Rahim's appeal, set aside his conviction and
      acquitted him, while dismissing the appeals of the three co-accused. On 10 August 2026 the Supreme Court
      admitted the appeal of the victim's son, Anshul Chhatrapati, against the acquittal.
    summary_hi: >
      सिरसा के सांध्य दैनिक "पूरा सच" के संपादक राम चंदर छत्रपति, जिन्होंने डेरे में यौन शोषण के आरोप वाला
      गुमनाम पत्र छापा था, को 24 अक्टूबर 2002 को उनके घर के बाहर गोली मारी गई और 21 नवंबर 2002 को उनकी
      मृत्यु हो गई। थाना सिटी सिरसा में एफआईआर संख्या 685/2002 दर्ज हुई; उच्च न्यायालय ने 10 नवंबर 2003 को
      जाँच सीबीआई को सौंपी। 11 जनवरी 2019 को विशेष सीबीआई अदालत ने गुरमीत राम रहीम सिंह, कुलदीप सिंह,
      निर्मल सिंह और कृष्ण लाल को दोषी ठहराया और 17 जनवरी 2019 को प्रत्येक को आजीवन कारावास और 50,000
      रुपये जुर्माने की सज़ा सुनाई। 7 मार्च 2026 को उच्च न्यायालय की खंडपीठ (मुख्य न्यायाधीश शील नागू और
      न्यायमूर्ति विक्रम अग्रवाल) ने राम रहीम की अपील स्वीकार कर उन्हें बरी किया, जबकि तीन सह-अभियुक्तों
      की अपीलें खारिज कीं। 10 अगस्त 2026 को सर्वोच्च न्यायालय ने मृतक के पुत्र अंशुल छत्रपति की बरी किए
      जाने के विरुद्ध अपील स्वीकार की।
    source_ids: [grrs-src-01, grrs-src-05, grrs-src-07, grrs-src-09, grrs-src-36]

  - id: grrs-ranjit-singh-murder-2002
    title_en: CBI v. Gurmeet Ram Rahim Singh and others (murder of former Dera manager Ranjit Singh)
    title_hi: सीबीआई बनाम गुरमीत राम रहीम सिंह व अन्य (पूर्व डेरा प्रबंधक रणजीत सिंह की हत्या)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Special Judge (CBI), Haryana, Panchkula; Punjab and Haryana High Court on appeal
    case_number: CRA-D-726-2021 (with CRA-D-738, 725, 728 and 715 of 2021); 2024 PHHC 76537-DB
    filed_year: 2002
    case_type: criminal
    statutes: [IPC 302, IPC 120-B, IPC 34]
    status: convicted at trial (2021); acquitted by High Court on 28 May 2024; appeals against acquittal pending in Supreme Court
    tier: acquitted
    verdict_date: 2024-05-28
    sentence_or_remedy: Trial court sentence of life imprisonment (18 October 2021) set aside on appeal
    appeal_status: Supreme Court issued notice on the victim's father's SLP (9 September 2024) and on the CBI's SLP (3 January 2025); pending
    summary_en: >
      Ranjit Singh, a former Dera manager, was shot dead at Khanpur Kolian village, Kurukshetra, on 10 July
      2002; the CBI alleged that Gurmeet Ram Rahim Singh suspected him of circulating the anonymous letter
      about sexual exploitation at the Dera. On 8 October 2021 the Special CBI Court at Panchkula convicted him
      and four others under sections 302 and 120-B IPC and on 18 October 2021 sentenced them to life
      imprisonment. On 28 May 2024 a Division Bench of the High Court (Justices Sureshwar Thakur and Lalit
      Batra) acquitted all five, describing the investigation as "tainted and sketchy" and noting that the car
      and weapons allegedly used were never seized. The Supreme Court issued notice on the victim's father
      Jagseer Singh's petition on 9 September 2024 and on the CBI's petition on 3 January 2025.
    summary_hi: >
      पूर्व डेरा प्रबंधक रणजीत सिंह की 10 जुलाई 2002 को कुरुक्षेत्र के खानपुर कोलियां गाँव में गोली मारकर
      हत्या कर दी गई; सीबीआई का आरोप था कि गुरमीत राम रहीम सिंह को संदेह था कि उन्होंने डेरे में यौन शोषण
      संबंधी गुमनाम पत्र प्रसारित किया। 8 अक्टूबर 2021 को पंचकूला की विशेष सीबीआई अदालत ने उन्हें और चार
      अन्य को धारा 302 और 120-बी आईपीसी के तहत दोषी ठहराया और 18 अक्टूबर 2021 को आजीवन कारावास की सज़ा
      सुनाई। 28 मई 2024 को उच्च न्यायालय की खंडपीठ (न्यायमूर्ति सुरेश्वर ठाकुर और ललित बत्रा) ने सभी पाँच
      को बरी कर दिया और जाँच को "दूषित और अधूरी" बताया। सर्वोच्च न्यायालय ने 9 सितंबर 2024 को मृतक के पिता
      जगसीर सिंह की याचिका पर और 3 जनवरी 2025 को सीबीआई की याचिका पर नोटिस जारी किया।
    source_ids: [grrs-src-02, grrs-src-03, grrs-src-10, grrs-src-11, grrs-src-12, grrs-src-13]

  - id: grrs-castration-cbi-2015
    title_en: CBI v. Gurmeet Ram Rahim Singh and two doctors (castration of followers)
    title_hi: सीबीआई बनाम गुरमीत राम रहीम सिंह व दो चिकित्सक (अनुयायियों का बधियाकरण)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Special CBI Court, Panchkula
    case_number: CBI case registered 7 January 2015 (pursuant to High Court order of 23 December 2014)
    filed_year: 2015
    case_type: criminal
    statutes: [IPC 326, IPC 417, IPC 506, IPC 120-B]
    status: charges framed on 3 August 2018; trial pending
    tier: charged
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      Acting on a 2012 petition by former follower Hans Raj Chauhan, the Punjab and Haryana High Court on
      23 December 2014 ordered a CBI investigation into allegations that followers had been castrated at the
      Dera. The CBI registered a case on 7 January 2015 and filed a chargesheet on 1 February 2018 against
      Gurmeet Ram Rahim Singh and two doctors, Dr M.P. Singh and Dr Pankaj Garg. On 3 August 2018 the Special
      CBI Court at Panchkula framed charges against him under sections 326, 417 and 506 IPC and against the
      doctors under sections 326 and 120-B IPC. The High Court's March 2026 judgment in the Chhatrapati appeal
      refers to the castration case as a separate pending prosecution. No verdict is on record.
    summary_hi: >
      पूर्व अनुयायी हंस राज चौहान की 2012 की याचिका पर पंजाब एवं हरियाणा उच्च न्यायालय ने 23 दिसंबर 2014
      को डेरे में अनुयायियों के बधियाकरण के आरोपों की सीबीआई जाँच का आदेश दिया। सीबीआई ने 7 जनवरी 2015 को
      मामला दर्ज किया और 1 फरवरी 2018 को गुरमीत राम रहीम सिंह तथा दो चिकित्सकों, डॉ. एम.पी. सिंह और डॉ.
      पंकज गर्ग के विरुद्ध आरोपपत्र दाखिल किया। 3 अगस्त 2018 को पंचकूला की विशेष सीबीआई अदालत ने उन पर धारा
      326, 417 और 506 आईपीसी तथा चिकित्सकों पर धारा 326 और 120-बी के तहत आरोप तय किए। कोई निर्णय अभिलेख पर
      नहीं है।
    source_ids: [grrs-src-32, grrs-src-01, grrs-src-08]

  - id: grrs-bargari-sacrilege-2015
    title_en: State of Punjab v. Gurmeet Ram Rahim Singh and others (2015 sacrilege cases, Faridkot)
    title_hi: पंजाब राज्य बनाम गुरमीत राम रहीम सिंह व अन्य (2015 बेअदबी मामले, फरीदकोट)
    jurisdiction_country: IN
    jurisdiction_region: Punjab
    court: Trial court at Chandigarh (transferred from Faridkot by the Supreme Court on 28 February 2023)
    case_number: Three FIRs of 2015 at PS Bajakhana, Faridkot (Burj Jawahar Singh Wala theft, posters, Bargari torn pages)
    filed_year: 2015
    case_type: criminal
    statutes: []
    status: accused named by Punjab Police SIT; trial resumed at Chandigarh on 28 November 2024 after the Supreme Court lifted a High Court stay on 18 October 2024
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      Three linked incidents in Faridkot district in 2015 (theft of a copy of the Guru Granth Sahib from Burj
      Jawahar Singh Wala on 1 June 2015, objectionable posters on 25 September 2015, and torn pages found near
      Bargari on 12 October 2015) were investigated by a Punjab Police Special Investigation Team, which named
      Gurmeet Ram Rahim Singh as the main conspirator; the Punjab government granted sanction to prosecute him.
      On 28 February 2023 the Supreme Court transferred the trial of Ram Rahim and seven Dera followers from
      Faridkot to Chandigarh after an accused, Pardeep Singh Kataria, was shot dead. The High Court stayed the
      trial on 11 March 2024; the Supreme Court (Justices B.R. Gavai and K.V. Viswanathan) lifted the stay on
      18 October 2024 and the trial resumed at Chandigarh on 28 November 2024. The record here rests on major
      outlet reporting; no court or official copy of the chargesheet, sanction or Supreme Court orders was
      fetched, so the case is shown at the allegation tier pending such a source.
    summary_hi: >
      2015 में फरीदकोट ज़िले की तीन जुड़ी घटनाओं (1 जून 2015 को बुर्ज जवाहर सिंह वाला से गुरु ग्रंथ साहिब
      की बीड़ की चोरी, 25 सितंबर 2015 को आपत्तिजनक पोस्टर, और 12 अक्टूबर 2015 को बरगाड़ी के पास फटे पन्ने
      मिलना) की जाँच पंजाब पुलिस की विशेष जाँच टीम ने की, जिसने गुरमीत राम रहीम सिंह को मुख्य साज़िशकर्ता
      बताया; पंजाब सरकार ने अभियोजन की मंज़ूरी दी। 28 फरवरी 2023 को सर्वोच्च न्यायालय ने एक अभियुक्त प्रदीप
      सिंह कटारिया की हत्या के बाद मुकदमा फरीदकोट से चंडीगढ़ स्थानांतरित किया। उच्च न्यायालय ने 11 मार्च 2024
      को सुनवाई पर रोक लगाई; सर्वोच्च न्यायालय ने 18 अक्टूबर 2024 को रोक हटाई और 28 नवंबर 2024 को चंडीगढ़
      में सुनवाई फिर शुरू हुई। यहाँ अभिलेख प्रमुख समाचार माध्यमों की रिपोर्टिंग पर आधारित है।
    source_ids: [grrs-src-29, grrs-src-30, grrs-src-31]

claims:
  - id: grrs-claim-01
    case_id: grrs-panchkula-rape-2002
    statement_en: On 25 August 2017 the Special Judge (CBI), Panchkula convicted Gurmeet Ram Rahim Singh in CBI case RC-5 of raping two female disciples of the Dera.
    statement_hi: 25 अगस्त 2017 को विशेष न्यायाधीश (सीबीआई), पंचकूला ने सीबीआई मामले आरसी-5 में गुरमीत राम रहीम सिंह को डेरे की दो महिला अनुयायियों से बलात्कार का दोषी ठहराया।
    tier: convicted
    date: 2017-08-25
    source_ids: [grrs-src-01, grrs-src-17]
  - id: grrs-claim-02
    case_id: grrs-panchkula-rape-2002
    statement_en: On 28 August 2017 the Special CBI Court sentenced him to 20 years' rigorous imprisonment in the rape case, and he has since been lodged in Sunaria jail, Rohtak.
    statement_hi: 28 अगस्त 2017 को विशेष सीबीआई अदालत ने बलात्कार मामले में उन्हें 20 वर्ष के कठोर कारावास की सज़ा सुनाई, और तब से वे रोहतक की सुनारिया जेल में बंद हैं।
    tier: convicted
    date: 2017-08-28
    source_ids: [grrs-src-14, grrs-src-08, grrs-src-01]
  - id: grrs-claim-03
    case_id: grrs-panchkula-rape-2002
    statement_en: His appeal against the 2017 rape conviction remains pending in the Punjab and Haryana High Court; on 23 July 2025 his counsel withdrew an application for suspension of sentence with liberty to revisit the court.
    statement_hi: 2017 की बलात्कार दोषसिद्धि के विरुद्ध उनकी अपील पंजाब एवं हरियाणा उच्च न्यायालय में लंबित है; 23 जुलाई 2025 को उनके वकील ने सज़ा निलंबन की अर्ज़ी पुनः दाखिल करने की छूट के साथ वापस ले ली।
    tier: convicted
    date: 2025-07-23
    source_ids: [grrs-src-14, grrs-src-01]
  - id: grrs-claim-04
    case_id: grrs-chhatrapati-murder-2002
    statement_en: On 11 January 2019 the Special Judge (CBI), Panchkula convicted Gurmeet Ram Rahim Singh under section 120-B read with section 302 IPC for the murder of journalist Ram Chander Chhatrapati, and on 17 January 2019 sentenced him to life imprisonment with a fine of Rs 50,000.
    statement_hi: 11 जनवरी 2019 को विशेष न्यायाधीश (सीबीआई), पंचकूला ने पत्रकार राम चंदर छत्रपति की हत्या के लिए गुरमीत राम रहीम सिंह को धारा 120-बी सहपठित धारा 302 आईपीसी के तहत दोषी ठहराया और 17 जनवरी 2019 को आजीवन कारावास तथा 50,000 रुपये जुर्माने की सज़ा सुनाई।
    tier: acquitted
    date: 2019-01-17
    source_ids: [grrs-src-01, grrs-src-09]
  - id: grrs-claim-05
    case_id: grrs-chhatrapati-murder-2002
    statement_en: On 7 March 2026 the Punjab and Haryana High Court (Chief Justice Sheel Nagu and Justice Vikram Aggarwal) allowed CRA-D-240-D-2019, set aside his conviction and acquitted him of the Chhatrapati murder charge, while dismissing the appeals of co-accused Kuldeep Singh, Nirmal Singh and Krishan Lal.
    statement_hi: 7 मार्च 2026 को पंजाब एवं हरियाणा उच्च न्यायालय (मुख्य न्यायाधीश शील नागू और न्यायमूर्ति विक्रम अग्रवाल) ने CRA-D-240-D-2019 स्वीकार करते हुए उनकी दोषसिद्धि रद्द की और छत्रपति हत्या के आरोप से बरी किया, जबकि सह-अभियुक्त कुलदीप सिंह, निर्मल सिंह और कृष्ण लाल की अपीलें खारिज कीं।
    tier: acquitted
    date: 2026-03-07
    source_ids: [grrs-src-01, grrs-src-05]
  - id: grrs-claim-06
    case_id: grrs-chhatrapati-murder-2002
    statement_en: On 10 August 2026 a Supreme Court bench headed by Chief Justice Surya Kant admitted Anshul Chhatrapati's appeal against the High Court acquittal and listed it for final hearing in the week beginning 16 November 2026.
    statement_hi: 10 अगस्त 2026 को मुख्य न्यायाधीश सूर्य कांत की अध्यक्षता वाली सर्वोच्च न्यायालय की पीठ ने उच्च न्यायालय द्वारा बरी किए जाने के विरुद्ध अंशुल छत्रपति की अपील स्वीकार की और उसे 16 नवंबर 2026 से शुरू होने वाले सप्ताह में अंतिम सुनवाई के लिए सूचीबद्ध किया।
    tier: acquitted
    date: 2026-08-10
    source_ids: [grrs-src-36]
  - id: grrs-claim-07
    case_id: grrs-ranjit-singh-murder-2002
    statement_en: On 8 October 2021 the Special CBI Court at Panchkula convicted Gurmeet Ram Rahim Singh and four others under sections 302 and 120-B IPC for the 10 July 2002 murder of Ranjit Singh, and on 18 October 2021 sentenced them to life imprisonment.
    statement_hi: 8 अक्टूबर 2021 को पंचकूला की विशेष सीबीआई अदालत ने 10 जुलाई 2002 को रणजीत सिंह की हत्या के लिए गुरमीत राम रहीम सिंह और चार अन्य को धारा 302 और 120-बी आईपीसी के तहत दोषी ठहराया और 18 अक्टूबर 2021 को आजीवन कारावास की सज़ा सुनाई।
    tier: acquitted
    date: 2021-10-18
    source_ids: [grrs-src-12, grrs-src-13, grrs-src-38]
  - id: grrs-claim-08
    case_id: grrs-ranjit-singh-murder-2002
    statement_en: On 28 May 2024 a Division Bench of the Punjab and Haryana High Court (Justices Sureshwar Thakur and Lalit Batra) acquitted him and four co-accused in the Ranjit Singh murder case, holding the CBI investigation to have been "tainted and sketchy".
    statement_hi: 28 मई 2024 को पंजाब एवं हरियाणा उच्च न्यायालय की खंडपीठ (न्यायमूर्ति सुरेश्वर ठाकुर और ललित बत्रा) ने रणजीत सिंह हत्याकांड में उन्हें और चार सह-अभियुक्तों को बरी किया और सीबीआई जाँच को "दूषित और अधूरी" बताया।
    tier: acquitted
    date: 2024-05-28
    source_ids: [grrs-src-03, grrs-src-02, grrs-src-10, grrs-src-11]
  - id: grrs-claim-09
    case_id: grrs-ranjit-singh-murder-2002
    statement_en: The Supreme Court issued notice on 9 September 2024 on the special leave petition of the victim's father, Jagseer Singh, and on 3 January 2025 on the CBI's petition, against the 28 May 2024 acquittal; both remain pending.
    statement_hi: सर्वोच्च न्यायालय ने 28 मई 2024 के बरी आदेश के विरुद्ध 9 सितंबर 2024 को मृतक के पिता जगसीर सिंह की विशेष अनुमति याचिका पर और 3 जनवरी 2025 को सीबीआई की याचिका पर नोटिस जारी किया; दोनों लंबित हैं।
    tier: acquitted
    date: 2025-01-03
    source_ids: [grrs-src-02, grrs-src-13, grrs-src-37]
  - id: grrs-claim-10
    case_id: grrs-castration-cbi-2015
    statement_en: On 3 August 2018 the Special CBI Court at Panchkula framed charges against him under sections 326, 417 and 506 IPC in the CBI case concerning the castration of Dera followers, on a chargesheet filed on 1 February 2018.
    statement_hi: 3 अगस्त 2018 को पंचकूला की विशेष सीबीआई अदालत ने डेरा अनुयायियों के बधियाकरण से जुड़े सीबीआई मामले में 1 फरवरी 2018 को दाखिल आरोपपत्र पर उन पर धारा 326, 417 और 506 आईपीसी के तहत आरोप तय किए।
    tier: charged
    date: 2018-08-03
    source_ids: [grrs-src-32, grrs-src-01]
  - id: grrs-claim-11
    case_id: grrs-bargari-sacrilege-2015
    statement_en: A Punjab Police Special Investigation Team named him as the main conspirator in the three 2015 Faridkot sacrilege cases, and the Punjab government granted sanction to prosecute him; the trial resumed at Chandigarh on 28 November 2024.
    statement_hi: पंजाब पुलिस की विशेष जाँच टीम ने 2015 के फरीदकोट के तीन बेअदबी मामलों में उन्हें मुख्य साज़िशकर्ता बताया और पंजाब सरकार ने अभियोजन की मंज़ूरी दी; 28 नवंबर 2024 को चंडीगढ़ में सुनवाई फिर शुरू हुई।
    tier: allegation
    date: 2024-11-28
    source_ids: [grrs-src-30, grrs-src-29]
  - id: grrs-claim-12
    case_id: grrs-bargari-sacrilege-2015
    statement_en: On 28 February 2023 the Supreme Court transferred the trial of the three sacrilege cases against him and seven Dera followers from Faridkot to Chandigarh, and on 18 October 2024 it lifted the High Court's 11 March 2024 stay on that trial.
    statement_hi: 28 फरवरी 2023 को सर्वोच्च न्यायालय ने उनके और सात डेरा अनुयायियों के विरुद्ध तीन बेअदबी मामलों की सुनवाई फरीदकोट से चंडीगढ़ स्थानांतरित की, और 18 अक्टूबर 2024 को उच्च न्यायालय की 11 मार्च 2024 की रोक हटाई।
    tier: allegation
    date: 2024-10-18
    source_ids: [grrs-src-31, grrs-src-29]
  - id: grrs-claim-13
    case_id:
    statement_en: On 9 August 2024 the Punjab and Haryana High Court, disposing of an SGPC public-interest petition against the 40-day parole granted to him on 20 January 2023, directed that any future application by him for temporary release be considered strictly under the Haryana Good Conduct Prisoners (Temporary Release) Act, 2022 "without the competent authority indulging in arbitrariness or favoritism or discrimination".
    statement_hi: 9 अगस्त 2024 को पंजाब एवं हरियाणा उच्च न्यायालय ने 20 जनवरी 2023 को दी गई 40 दिन की पैरोल के विरुद्ध एसजीपीसी की जनहित याचिका निपटाते हुए निर्देश दिया कि अस्थायी रिहाई के लिए उनका कोई भी भावी आवेदन हरियाणा सदाचार बंदी (अस्थायी रिहाई) अधिनियम, 2022 के अनुसार "मनमानी, पक्षपात या भेदभाव के बिना" कड़ाई से विचारित किया जाए।
    tier: regulatory_action
    date: 2024-08-09
    source_ids: [grrs-src-04, grrs-src-35]
  - id: grrs-claim-14
    case_id: grrs-panchkula-rape-2002
    statement_en: On 2 October 2024, three days before the Haryana Assembly election of 5 October 2024, he was released on a 20-day parole after the Chief Electoral Officer's concurrence, on conditions that he not enter Haryana, make public speeches or take part in political activity.
    statement_hi: 2 अक्टूबर 2024 को, 5 अक्टूबर 2024 के हरियाणा विधानसभा चुनाव से तीन दिन पहले, मुख्य निर्वाचन अधिकारी की सहमति के बाद उन्हें 20 दिन की पैरोल पर इस शर्त के साथ रिहा किया गया कि वे हरियाणा में प्रवेश नहीं करेंगे, सार्वजनिक भाषण नहीं देंगे और राजनीतिक गतिविधि में भाग नहीं लेंगे।
    tier: convicted
    date: 2024-10-02
    source_ids: [grrs-src-19, grrs-src-18, grrs-src-04]
  - id: grrs-claim-15
    case_id: grrs-panchkula-rape-2002
    statement_en: By 25 August 2026 he had been released from Sunaria jail on parole or furlough 17 times since his 2017 conviction, including a 40-day parole in January 2026, a 30-day parole in May 2026 and a 21-day furlough from 25 August 2026.
    statement_hi: 25 अगस्त 2026 तक उन्हें 2017 की दोषसिद्धि के बाद 17 बार पैरोल या फरलो पर सुनारिया जेल से रिहा किया जा चुका था, जिसमें जनवरी 2026 की 40 दिन की पैरोल, मई 2026 की 30 दिन की पैरोल और 25 अगस्त 2026 से 21 दिन की फरलो शामिल है।
    tier: convicted
    date: 2026-08-25
    source_ids: [grrs-src-23, grrs-src-22, grrs-src-04]

