relationships:
  - to_id: indian-national-congress
    type: endorsement
    period_start: 2007-02
    period_end: 2007-02
    description_en: >
      The Dera openly backed the Congress in the February 2007 Punjab Assembly election; The Tribune reports its
      following in about 40 Malwa constituencies was a factor in the Congress winning 37 seats in the region, and
      the EPW records that this support shaped the May 2007 confrontation with Sikh bodies.
    description_hi: >
      डेरे ने फरवरी 2007 के पंजाब विधानसभा चुनाव में खुलकर कांग्रेस का समर्थन किया; द ट्रिब्यून के अनुसार मालवा
      के लगभग 40 क्षेत्रों में उसके अनुयायी कांग्रेस की 37 सीटों की जीत में एक कारक थे।
    source_ids: [grrs-src-26, grrs-src-27]
  - to_id: bharatiya-janata-party
    type: endorsement
    period_start: 2014-10-13
    period_end: 2014-10-15
    description_en: >
      On 13 October 2014 the Dera's political affairs wing, through spokesperson Jasbir Singh, announced support
      for the BJP on all 90 seats in the Haryana Assembly election of 15 October 2014; The Tribune later reported
      that senior BJP functionaries had visited Sirsa for the Dera head's "blessings" and that the Dera's vote
      contributed to the BJP's first government in Haryana.
    description_hi: >
      13 अक्टूबर 2014 को डेरे की राजनीतिक मामलों की शाखा ने प्रवक्ता जसबीर सिंह के माध्यम से 15 अक्टूबर 2014 के
      हरियाणा विधानसभा चुनाव में सभी 90 सीटों पर भाजपा के समर्थन की घोषणा की; द ट्रिब्यून ने बाद में बताया कि
      वरिष्ठ भाजपा पदाधिकारी डेरा प्रमुख के "आशीर्वाद" के लिए सिरसा गए थे।
    source_ids: [grrs-src-24, grrs-src-25]
  - to_id: shiromani-akali-dal
    type: endorsement
    period_start: 2017-01-31
    period_end: 2017-02-04
    description_en: >
      On 31 January 2017 the Dera announced support for the SAD-BJP alliance in the Punjab Assembly election,
      reversing its earlier hostility to the Akali Dal after the 2007 confrontation; The Tribune reported that
      most followers voted accordingly, though some village committees dissented.
    description_hi: >
      31 जनवरी 2017 को डेरे ने पंजाब विधानसभा चुनाव में शिअद-भाजपा गठबंधन के समर्थन की घोषणा की, जो 2007 के
      टकराव के बाद अकाली दल से उसकी पुरानी दूरी का उलट था।
    source_ids: [grrs-src-28, grrs-src-26]
  - to_id: bharatiya-janata-party
    type: parole_timing
    period_start: 2024-10-02
    period_end: 2025-01-29
    description_en: >
      The BJP-led Haryana government released him on a 20-day parole on 2 October 2024, three days before the
      Haryana Assembly election, after the Chief Electoral Officer's concurrence and on conditions barring entry
      into Haryana and any political activity; on 29 January 2025 he was released on a 30-day parole ahead of the
      Delhi Assembly election. The Tribune reported that these releases drew objections that they were driven by
      political considerations. The High Court's 9 August 2024 order had already directed that his release
      applications be decided without "arbitrariness or favoritism or discrimination".
    description_hi: >
      भाजपा नीत हरियाणा सरकार ने 2 अक्टूबर 2024 को, हरियाणा विधानसभा चुनाव से तीन दिन पहले, मुख्य निर्वाचन
      अधिकारी की सहमति और हरियाणा में प्रवेश व राजनीतिक गतिविधि पर रोक की शर्तों के साथ उन्हें 20 दिन की पैरोल
      पर रिहा किया; 29 जनवरी 2025 को दिल्ली विधानसभा चुनाव से पहले 30 दिन की पैरोल दी गई। द ट्रिब्यून ने बताया
      कि इन रिहाइयों पर राजनीतिक विचारों से प्रेरित होने की आपत्तियाँ उठीं।
    source_ids: [grrs-src-19, grrs-src-18, grrs-src-20, grrs-src-04]
