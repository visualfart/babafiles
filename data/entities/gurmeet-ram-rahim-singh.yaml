    label_hi: फैसले के बाद पंचकूला में डेरा अनुयायियों की हिंसा; पंचकूला में 37 लोग मारे गए (एनएचआरसी ने बाद में पुलिस कार्रवाई में 32 नागरिक मौतें दर्ज कीं), सिरसा और पानीपत में और मौतें
