    url: https://indiankanoon.org/doc/135965675/
    title: "Prakash and another v. Vandana and State of Kerala, Crl.M.C. No. 415 of 2015"
    publisher: High Court of Kerala via Indian Kanoon
    type: court
    published_at: 2024-07-19
    language: en
    archive_url: https://web.archive.org/web/20260908143317/https://indiankanoon.org/doc/135965675/
    captured_at: 2026-09-09
    sha256:
    note: >-
      Order of Justice P.V. Kunhikrishnan quashing C.C. No. 1618 of 2014 on the file of the Judicial First Class Magistrate I, Karunagappally, a private complaint under IPC 499 and 500 by Vandana, a devotee, against the executive editor and the director and chief editor of Reporter Channel over the programme "Big Story" aired on 18 February 2014. The Court examined the English and Malayalam editions of the book, recording that Gail Tredwell published "Holy Hell" in 2013 through Wattle Tree Press, Maui, Hawaii, that the Malayalam translation "Vishudha Narakam" was published by Mythri Books, Thiruvananthapuram, in April 2014, that "there are serious allegations against Mata Amritanandamayi and the Math" in the book, and that "it is not clear whether any complaint is filed by Mata Amritanandamayi Math against the author of the book 'Holy Hell'". Held that discussing a book already in the public domain is "fair comment or criticisms which is part of their freedom of speech".
