summary_en: >-
  Mata Amritanandamayi heads the Mata Amritanandamayi Math at Amritapuri in Kollam district,
  Kerala. In 2013 Gail Tredwell, an Australian who had lived at the ashram and served as her
  personal attendant for about twenty years, published a memoir, "Holy Hell", making serious
  allegations against Amritanandamayi and the Math; a Malayalam translation followed in April 2014
  and the book was widely reported in the Indian press. The Math and Amritanandamayi rejected the
  allegations. Nothing in the memoir reached an official record as a charge, first information
  report, inquiry or judicial finding against Amritanandamayi or the Math on any record found
  here. The criminal processes that followed ran the other way: a case was registered in Kochi
  against the author and five news organisations on a devotee's private complaint, a private
  defamation complaint was filed against two Reporter Channel editors, and two disciples sued
  D.C. Books and Kairali TV to restrain a related book. On 19 July 2024 the Kerala High Court
  quashed the defamation proceedings against the Reporter Channel editors, holding that discussing
  a book already in the public domain is fair comment, and recorded that it was not clear whether
  the Math had ever complained against the author of "Holy Hell". The only other official record
  found naming the Math is a 2025 Kerala High Court judgment in which it was one of many
  petitioners who succeeded in having a wetland-conversion building fee declared ultra vires.
summary_hi: >-
  माता अमृतानंदमयी केरल के कोल्लम ज़िले में अमृतपुरी स्थित माता अमृतानंदमयी मठ की प्रमुख हैं। 2013
  में गेल ट्रेडवेल नामक एक ऑस्ट्रेलियाई महिला ने, जो आश्रम में रहकर लगभग बीस वर्ष तक उनकी निजी
  परिचारिका रहीं, "होली हेल" नाम से एक संस्मरण प्रकाशित किया जिसमें अमृतानंदमयी और मठ पर गंभीर आरोप
  लगाए गए; अप्रैल 2014 में उसका मलयालम अनुवाद आया और भारतीय प्रेस में इसकी व्यापक रिपोर्टिंग हुई।
  मठ और अमृतानंदमयी ने आरोपों को अस्वीकार किया। यहाँ प्राप्त किसी भी अभिलेख के अनुसार संस्मरण की
  कोई बात अमृतानंदमयी या मठ के विरुद्ध आरोप, प्रथम सूचना रिपोर्ट, जांच या न्यायिक निष्कर्ष के रूप
  में किसी आधिकारिक अभिलेख तक नहीं पहुँची। इसके बाद की आपराधिक प्रक्रियाएँ विपरीत दिशा में चलीं: एक
  भक्त की निजी शिकायत पर कोच्चि में लेखिका और पाँच समाचार संस्थानों के विरुद्ध मामला दर्ज हुआ, दो
  रिपोर्टर चैनल संपादकों के विरुद्ध निजी मानहानि शिकायत दायर हुई, और दो शिष्यों ने एक संबंधित पुस्तक
  को रोकने के लिए डी.सी. बुक्स और कैराली टीवी पर वाद दायर किया। 19 जुलाई 2024 को केरल उच्च न्यायालय
  ने रिपोर्टर चैनल के संपादकों के विरुद्ध मानहानि की कार्यवाही रद्द कर दी, यह मानते हुए कि
  सार्वजनिक रूप से उपलब्ध पुस्तक की विषय-वस्तु पर चर्चा उचित टिप्पणी है, और दर्ज किया कि यह स्पष्ट
  नहीं है कि मठ ने कभी "होली हेल" की लेखिका के विरुद्ध शिकायत की थी या नहीं। मठ का नाम लेने वाला
  एकमात्र अन्य आधिकारिक अभिलेख 2025 का केरल उच्च न्यायालय का वह निर्णय है जिसमें वह उन अनेक
  याचिकाकर्ताओं में से एक थी जो आर्द्रभूमि-परिवर्तन भवन शुल्क को अधिकारातीत घोषित कराने में सफल रहे।
