    captured_at: 2026-09-09
    sha256:
    note: >-
      Judgment of Justice Mohammed Nias C.P. in a batch of about 110 writ petitions. The Mata Amritanandamayi Math, represented by its general secretary Sreevalsan K. of Amritapuri P.O., Parayakadavu, Alappad, Kollam, is the petitioner in W.P.(C) No. 2505 of 2024. The Court declared "that Note 1 to Rule 12(9) is ultra vires the Kerala Conservation of Paddy Land and Wetland Act, 2008 and Rules and the Amendment Act, 2018 to the extent it imposes a levy of fee of Rs.100/- per sq. feet exceeding 3000 sq. ft.", directed that no such demand be made against the petitioners and that amounts collected be refunded within four months, and allowed the writ petitions.
