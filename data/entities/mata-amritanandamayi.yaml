summary_en: >-
  Mata Amritanandamayi heads the Mata Amritanandamayi Math at Amritapuri in Kollam district, Kerala. In 2013 Gail Tredwell, an Australian who had lived at the ashram and served as her personal attendant for about twenty years, published a memoir, "Holy Hell", making serious allegations against Amritanandamayi and the Math; a Malayalam translation followed in April 2014 and the book was widely reported in the Indian press. The Math and Amritanandamayi rejected the allegations. Nothing in the memoir reached an official record as a charge, first information report, inquiry or judicial finding against Amritanandamayi or the Math on any record found here. The criminal processes that followed ran the other way: a case was registered at Karunagappally under the Information Technology Act over social-media posts, a case was registered in Kochi against the author and five news organisations on a devotee's private complaint, a private defamation complaint was filed against two Reporter Channel editors, and two disciples sued D.C. Books and Kairali TV to restrain a related book. A writ petition by a Supreme Court advocate complaining that the Karunagappally police had refused to register a case on the memoir's rape allegations drew notices to the state and the Central Bureau of Investigation on 14 March 2014; no first information report or Central Bureau of Investigation inquiry followed on any record found. On 19 July 2024 the Kerala High Court quashed the defamation proceedings against the Reporter Channel editors, holding that discussing a book already in the public domain is fair comment, and recorded that it was not clear whether the Math had ever complained against the author of "Holy Hell". The only other official record found naming the Math is a 2025 Kerala High Court judgment in which it was one of many petitioners who succeeded in having a wetland-conversion building fee declared ultra vires.
summary_hi: >-
  माता अमृतानंदमयी केरल के कोल्लम ज़िले में अमृतपुरी स्थित माता अमृतानंदमयी मठ की प्रमुख हैं। 2013 में गेल ट्रेडवेल नामक एक ऑस्ट्रेलियाई महिला ने, जो आश्रम में रहकर लगभग बीस वर्ष तक उनकी निजी परिचारिका रहीं, "होली हेल" नाम से एक संस्मरण प्रकाशित किया जिसमें अमृतानंदमयी और मठ पर गंभीर आरोप लगाए गए; अप्रैल 2014 में उसका मलयालम अनुवाद आया और भारतीय प्रेस में इसकी व्यापक रिपोर्टिंग हुई। मठ और अमृतानंदमयी ने आरोपों को अस्वीकार किया। यहाँ प्राप्त किसी भी अभिलेख के अनुसार संस्मरण की कोई बात अमृतानंदमयी या मठ के विरुद्ध आरोप, प्रथम सूचना रिपोर्ट, जांच या न्यायिक निष्कर्ष के रूप में किसी आधिकारिक अभिलेख तक नहीं पहुँची। इसके बाद की आपराधिक प्रक्रियाएँ विपरीत दिशा में चलीं: एक भक्त की निजी शिकायत पर कोच्चि में लेखिका और पाँच समाचार संस्थानों के विरुद्ध मामला दर्ज हुआ, करुणागप्पल्ली में सोशल मीडिया पोस्ट को लेकर सूचना प्रौद्योगिकी अधिनियम के तहत मामला दर्ज हुआ, दो रिपोर्टर चैनल संपादकों के विरुद्ध निजी मानहानि शिकायत दायर हुई, और दो शिष्यों ने एक संबंधित पुस्तक को रोकने के लिए डी.सी. बुक्स और कैराली टीवी पर वाद दायर किया। एक सर्वोच्च न्यायालय अधिवक्ता की उस रिट याचिका पर, जिसमें कहा गया था कि करुणागप्पल्ली पुलिस ने संस्मरण के बलात्कार संबंधी आरोपों पर मामला दर्ज करने से इनकार किया, 14 मार्च 2014 को राज्य और केंद्रीय अन्वेषण ब्यूरो को नोटिस जारी हुए; किसी प्राप्त अभिलेख के अनुसार उसके बाद कोई प्रथम सूचना रिपोर्ट या सीबीआई जांच नहीं हुई। 19 जुलाई 2024 को केरल उच्च न्यायालय ने रिपोर्टर चैनल के संपादकों के विरुद्ध मानहानि की कार्यवाही रद्द कर दी, यह मानते हुए कि सार्वजनिक रूप से उपलब्ध पुस्तक की विषय-वस्तु पर चर्चा उचित टिप्पणी है, और दर्ज किया कि यह स्पष्ट नहीं है कि मठ ने कभी "होली हेल" की लेखिका के विरुद्ध शिकायत की थी या नहीं। मठ का नाम लेने वाला एकमात्र अन्य आधिकारिक अभिलेख 2025 का केरल उच्च न्यायालय का वह निर्णय है जिसमें वह उन अनेक याचिकाकर्ताओं में से एक थी जो आर्द्रभूमि-परिवर्तन भवन शुल्क को अधिकारातीत घोषित कराने में सफल रहे।
hi_reviewed: false
response_from_subject:
  text_en: >-
    On 20 February 2014 an ashram representative, Sudeep Kumar, said the contents of the book were "absolutely baseless". On 22 February 2014, at a spiritual session in Palakkad, Mata Amritanandamayi said her ashram "was an open book and there was no lapse on its part", that "Some people are saying certain things against the ashram when their plans did not materialise. I am trying to forget and forgive these issues. I don't ask anyone to serve me. Instead, I am serving others", and that the controversy was part of an attempt to trigger communal tension. On 8 March 2014 the ashram spokesman Raju Swami said the Math was not behind the legal notice served on Kairali TV: "The stated notice might have been issued at the intervention of ashram devotees in Delhi. Amma has asked the devotees to refrain from such action." In April 2014 the Math denied any involvement in the assault on Swami Sandeepananda Giri and the stoning of the home of the publisher Ravi DeeCee.
  text_hi: >-
    20 फरवरी 2014 को आश्रम के प्रतिनिधि सुदीप कुमार ने कहा कि पुस्तक की विषय-वस्तु "पूरी तरह निराधार" है। 22 फरवरी 2014 को पालक्काड में एक आध्यात्मिक सत्र में माता अमृतानंदमयी ने कहा कि उनका आश्रम "खुली किताब है और उसकी ओर से कोई चूक नहीं हुई", कि "कुछ लोग आश्रम के विरुद्ध बातें कह रहे हैं क्योंकि उनकी योजनाएँ सफल नहीं हुईं। मैं इन बातों को भूलने और क्षमा करने का प्रयास कर रही हूँ। मैं किसी से अपनी सेवा नहीं माँगती, बल्कि दूसरों की सेवा करती हूँ", और यह विवाद सांप्रदायिक तनाव भड़काने के प्रयास का हिस्सा है। 8 मार्च 2014 को आश्रम प्रवक्ता राजू स्वामी ने कहा कि कैराली टीवी को दी गई कानूनी नोटिस के पीछे मठ नहीं था: "वह नोटिस दिल्ली के आश्रम भक्तों के हस्तक्षेप पर जारी हुई होगी। अम्मा ने भक्तों से ऐसी कार्रवाई से दूर रहने को कहा है।" अप्रैल 2014 में मठ ने स्वामी संदीपानंद गिरि पर हमले और प्रकाशक रवि डीसी के घर पर पथराव में किसी भी संलिप्तता से इनकार किया।
  source_id: ama-src-13

