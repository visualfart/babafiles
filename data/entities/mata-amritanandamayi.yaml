    url: https://indiankanoon.org/doc/41522153/
    title: "Dr. Sreejith Krishnan and another v. Ravi D.C. and others, O.P.(C) No. 1038 of 2014"
    publisher: High Court of Kerala via Indian Kanoon
    type: court
    published_at: 2014-06-24
    language: en
    archive_url: https://web.archive.org/web/20260908143452/https://indiankanoon.org/doc/41522153/
    captured_at: 2026-09-09
    sha256:
    note: >-
      Judgment of Justice V. Chitambaresh. Two petitioners describing themselves as disciples had sued in the Sub Court, Thiruvalla for a permanent prohibitory injunction restraining D.C. Books, its group companies and John Brittas of Malayala Communication Ltd (Kairali and People TV) "from publishing, selling, circulating or distributing the book - Amruthananda Matdom - The revelations of a saintly lady - through out Kerala"; the Amruthanandamayi Math, Paryakadavu, is the sixth respondent. The High Court set aside the Sub Court's order of 2 April 2014 on court-fee valuation, directed the suit to be numbered and the temporary injunction application to be heard within a month, and directed that the interim order of 8 April 2014 "will govern the field" until then. The outcome of the suit is not on any record found. Indian Kanoon labels this document 2 April 2014; the judgment itself is dated 24 June 2014.
