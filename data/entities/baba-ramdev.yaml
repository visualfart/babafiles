    statement_en: On 9 May 2025 the Delhi High Court disposed of the Hamdard suit after Patanjali Foods confirmed on affidavit that the "sharbat jihad" video had been permanently taken down, the Court having earlier indicated it would consider a contempt notice if such videos continued.
