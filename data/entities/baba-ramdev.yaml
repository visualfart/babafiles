    statement_en: On 3 July 2025 the Delhi High Court (Mini Pushkarna J.) held that Patanjali's television and print advertisements for "Patanjali Special Chyawanprash" made out a strong prima facie case of disparagement of "Dabur Chyawanprash" and Chyawanprash generally, and directed Patanjali to delete the specific lines describing rival products as "ordinary" and claiming only Patanjali knew the correct tradition for preparing Chyawanprash.
    statement_hi: 3 जुलाई 2025 को दिल्ली उच्च न्यायालय (न्यायमूर्ति मिनी पुष्करणा) ने कहा कि "पतंजलि स्पेशल च्यवनप्राश" के टीवी और प्रिंट विज्ञापन "डाबर च्यवनप्राश" तथा सामान्यतः च्यवनप्राश को अपमानित करने का प्रथम दृष्टया मज़बूत मामला बनाते हैं, और पतंजलि को उन विशिष्ट पंक्तियों को हटाने का निर्देश दिया जिनमें प्रतिद्वंद्वी उत्पादों को "साधारण" बताया गया था और यह दावा किया गया था कि केवल पतंजलि को च्यवनप्राश बनाने की सही परंपरा का ज्ञान है।
    tier: regulatory_action
    date: 2025-07-03
    source_ids: [ baba-ramdev-src-10, baba-ramdev-src-11 ]
