name_en: Baba Ramdev
name_hi: बाबा रामदेव
aliases: [ Ramdev, Swami Ramdev, Ramkrishna Yadav, Acharya Ramdev ]
born: 1965
died:
base_location: Patanjali Yogpeeth, Haridwar, Uttarakhand
country: IN
countries_of_operation: [ IN ]
organisations: [ Patanjali Ayurved, Patanjali Yogpeeth ]
activity_status: active
summary_en: >
  Baba Ramdev, born Ramkrishna Yadav, is a yoga teacher and, with Acharya Balkrishna, the co-founder of Patanjali Ayurved Limited and the Patanjali Yogpeeth trust at Haridwar, Uttarakhand. In a petition brought by the Indian Medical Association, the Supreme Court issued suo motu contempt notices in 2024 to Patanjali, Balkrishna and Ramdev over advertisements and public statements it found to be in breach of an undertaking not to claim medicinal cures for diseases listed under the Drugs and Magic Remedies Act; after Uttarakhand's drug licensing authority suspended the manufacturing licences of 14 Patanjali products in April 2024 and the company published court-ordered public apologies, the Court closed the contempt proceedings on 13 August 2024, accepting an unconditional apology while warning against repetition. In 2020 the Madras High Court restrained Patanjali from using the "Coronil" trademark for its Covid-era product, a ruling a Division Bench set aside on appeal in 2021. Since 2025 the Delhi High Court has issued interim orders restraining Patanjali advertisements it found disparaging of Dabur Chyawanprash, and separately over a video in which Ramdev described a rival's rose-syrup brand in communal terms, remarks the court called "indefensible".
summary_hi: >
  बाबा रामदेव, जिनका मूल नाम रामकृष्ण यादव है, योग शिक्षक हैं और आचार्य बालकृष्ण के साथ हरिद्वार, उत्तराखंड स्थित पतंजलि आयुर्वेद लिमिटेड तथा पतंजलि योगपीठ ट्रस्ट के सह-संस्थापक हैं। इंडियन मेडिकल एसोसिएशन की याचिका पर सर्वोच्च न्यायालय ने 2024 में पतंजलि, बालकृष्ण और रामदेव को उन विज्ञापनों और सार्वजनिक बयानों के लिए स्वतः संज्ञान अवमानना नोटिस जारी किए, जो न्यायालय की दृष्टि में ड्रग्स एंड मैजिक रेमेडीज़ अधिनियम के तहत सूचीबद्ध रोगों के औषधीय इलाज का दावा न करने के वचन का उल्लंघन थे; अप्रैल 2024 में उत्तराखंड के औषधि लाइसेंसिंग प्राधिकरण द्वारा पतंजलि के 14 उत्पादों के निर्माण लाइसेंस निलंबित किए जाने और कंपनी द्वारा न्यायालय के आदेश पर सार्वजनिक क्षमा-याचना प्रकाशित किए जाने के बाद, न्यायालय ने 13 अगस्त 2024 को बिना शर्त माफी स्वीकार करते हुए अवमानना कार्यवाही बंद कर दी, साथ ही पुनरावृत्ति को लेकर चेतावनी भी दी। 2020 में मद्रास उच्च न्यायालय ने पतंजलि को उसके कोविड दौर के उत्पाद के लिए "कोरोनिल" ट्रेडमार्क के प्रयोग से रोका था, जिसे 2021 में अपील पर खंडपीठ ने रद्द कर दिया। 2025 से दिल्ली उच्च न्यायालय ने पतंजलि के उन विज्ञापनों पर अंतरिम रोक के आदेश दिए हैं जिन्हें उसने डाबर च्यवनप्राश को अपमानित करने वाला पाया, और अलग से उस वीडियो पर भी जिसमें रामदेव ने एक प्रतिद्वंद्वी के गुलाब शरबत ब्रांड का सांप्रदायिक शब्दों में उल्लेख किया था, जिसे अदालत ने "अक्षम्य" करार दिया।
hi_reviewed: false
response_from_subject:
  text_en: >
    In the Supreme Court contempt proceedings, Patanjali Ayurved Limited published the following apology in national and regional newspapers on 22 April 2024, as recorded in the Court's judgment of 13 August 2024: "Patanjali Ayurved Limited fully respects the dignity of the Hon'ble Supreme Court. We sincerely apologize for the mistake of publishing advertisements and holding a press conference even after our advocates made a statement in the apex court. We are committed to not let such a mistake be repeated ever in future. We reassure you that we shall remain committed to uphold the constitution and dignity of the Hon'ble Supreme Court. Patanjali Ayurved Limited, Haridwar, Uttarakhand." Acharya Balkrishna and Ramdev separately affirmed on affidavit that they "never had any intention to violate orders of this Hon'ble Court."
  text_hi: >
    सर्वोच्च न्यायालय की अवमानना कार्यवाही में पतंजलि आयुर्वेद लिमिटेड ने 22 अप्रैल 2024 को राष्ट्रीय और क्षेत्रीय समाचार-पत्रों में यह क्षमा-याचना प्रकाशित की, जिसे न्यायालय के 13 अगस्त 2024 के निर्णय में दर्ज किया गया: "पतंजलि आयुर्वेद लिमिटेड माननीय सर्वोच्च न्यायालय की गरिमा का पूर्ण सम्मान करता है। हमारे अधिवक्ताओं द्वारा शीर्ष अदालत में बयान दिए जाने के बावजूद विज्ञापन प्रकाशित करने और प्रेस सम्मेलन आयोजित करने की गलती के लिए हम हार्दिक क्षमा माँगते हैं। हम प्रतिबद्ध हैं कि भविष्य में ऐसी गलती कभी न दोहराई जाए। हम आपको आश्वस्त करते हैं कि हम माननीय सर्वोच्च न्यायालय के संविधान और गरिमा को बनाए रखने हेतु प्रतिबद्ध रहेंगे। पतंजलि आयुर्वेद लिमिटेड, हरिद्वार, उत्तराखंड।" आचार्य बालकृष्ण और रामदेव ने अलग-अलग हलफनामों में पुष्टि की कि उनका "इस माननीय न्यायालय के आदेशों का उल्लंघन करने का कभी कोई इरादा नहीं था।"
  source_id: baba-ramdev-src-01

