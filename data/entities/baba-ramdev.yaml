cases:
  - id: baba-ramdev-ima-contempt-2024
    title_en: In Re Patanjali Ayurved Limited (suo motu contempt arising from Indian Medical Association v. Union of India)
    title_hi: री पतंजलि आयुर्वेद लिमिटेड (इंडियन मेडिकल एसोसिएशन बनाम भारत संघ से उत्पन्न स्वतः संज्ञान अवमानना)
    jurisdiction_country: IN
    jurisdiction_region: Supreme Court of India
    court: Supreme Court of India
    case_number: Suo Motu Contempt Petition (Civil) No. 4 of 2024 in Writ Petition (Civil) No. 645 of 2022
    filed_year: 2024
    case_type: regulatory
    statutes: [ Contempt of Courts Act 1971, "Drugs and Magic Remedies (Objectionable Advertisements) Act 1954" ]
    status: closed; contempt notice discharged after apology accepted
    tier: closed
    verdict_date: 2024-08-13
    sentence_or_remedy: Notice discharged on acceptance of unconditional apology; proposed contemnors cautioned that future violations would be viewed strictly
    appeal_status: Not applicable; underlying writ petition (IMA's grievance against Patanjali's advertising) continues separately
    summary_en: >
      In the writ petition filed by the Indian Medical Association against Patanjali's advertising and public statements disparaging modern medicine, Patanjali gave an undertaking on 21 November 2023 not to violate advertising laws or make casual claims of medicinal efficacy. On 27 February 2024, after IMA showed the Supreme Court a newspaper advertisement and a 22 November 2023 press conference by Ramdev and Acharya Balkrishna repeating cure claims for diseases listed under the Drugs and Magic Remedies Act, the Court issued a contempt notice to Patanjali and Balkrishna; a similar notice followed against Ramdev on 19 March 2024. Over the following months the Court rejected a "qualified" apology (20 March 2024), noted evident discrepancies in travel documents filed to seek exemption from a court appearance (10 April 2024), heard both men apologise in person (16 April 2024), and rejected a public apology published in illegibly fine print (22 April 2024) before a corrected, prominent apology was published on 24 April 2024. On 13 August 2024 the Court accepted the unconditional apology and closed the proceedings, holding that the "sword of contempt" would be "flourished as swiftly as these proceedings were originally initiated" if the undertaking were breached again.
    summary_hi: >
      इंडियन मेडिकल एसोसिएशन द्वारा पतंजलि के विज्ञापनों और आधुनिक चिकित्सा को अपमानित करने वाले सार्वजनिक बयानों के विरुद्ध दाखिल रिट याचिका में, पतंजलि ने 21 नवंबर 2023 को वचन दिया था कि वह विज्ञापन कानूनों का उल्लंघन नहीं करेगा और औषधीय प्रभावकारिता के आकस्मिक दावे नहीं करेगा। 27 फरवरी 2024 को, जब आईएमए ने सर्वोच्च न्यायालय को एक समाचार-पत्र विज्ञापन और रामदेव व आचार्य बालकृष्ण द्वारा 22 नवंबर 2023 के प्रेस सम्मेलन में ड्रग्स एंड मैजिक रेमेडीज़ अधिनियम के तहत सूचीबद्ध रोगों के इलाज के दावे दोहराए जाने को दिखाया, तो न्यायालय ने पतंजलि और बालकृष्ण को अवमानना नोटिस जारी किया; 19 मार्च 2024 को रामदेव को भी ऐसा ही नोटिस जारी हुआ। अगले महीनों में न्यायालय ने एक "सशर्त" माफी को अस्वीकार किया (20 मार्च 2024), अदालत में उपस्थिति से छूट माँगने हेतु दाखिल यात्रा दस्तावेज़ों में स्पष्ट विसंगतियाँ नोट कीं (10 अप्रैल 2024), दोनों को व्यक्तिगत रूप से माफी माँगते सुना (16 अप्रैल 2024), और एक ऐसी सार्वजनिक माफी को अस्वीकार किया जो अत्यंत छोटे अक्षरों में प्रकाशित होने से अपठनीय थी (22 अप्रैल 2024), जिसके बाद 24 अप्रैल 2024 को एक सुधरी हुई, स्पष्ट माफी प्रकाशित हुई। 13 अगस्त 2024 को न्यायालय ने बिना शर्त माफी स्वीकार करते हुए कार्यवाही बंद कर दी, यह कहते हुए कि यदि वचन का पुनः उल्लंघन हुआ तो "अवमानना की तलवार" उतनी ही तेज़ी से चलाई जाएगी जितनी तेज़ी से यह कार्यवाही मूलतः प्रारंभ की गई थी।
    source_ids: [ baba-ramdev-src-01, baba-ramdev-src-02, baba-ramdev-src-03, baba-ramdev-src-04, baba-ramdev-src-05 ]

  - id: baba-ramdev-uttarakhand-licence-suspension-2024
    title_en: Suspension of manufacturing licences of 14 Patanjali/Divya Pharmacy Ayurvedic products by the State of Uttarakhand
    title_hi: उत्तराखंड राज्य द्वारा पतंजलि/दिव्य फार्मेसी के 14 आयुर्वेदिक उत्पादों के निर्माण लाइसेंस का निलंबन
    jurisdiction_country: IN
    jurisdiction_region: Uttarakhand
    court: State Drug Licensing Authority (Ayurvedic and Unani Services), Dehradun, Uttarakhand; overseen by the Supreme Court of India
    case_number: Order dated 15.04.2024 (licensing authority); referenced in Suo Motu Contempt Petition (Civil) No. 4 of 2024
    filed_year: 2024
    case_type: regulatory
    statutes: [ Drugs and Cosmetics Act 1940 ]
    status: closed; suspension order cancelled by the state government
    tier: closed
    verdict_date: 2024-07-01
    sentence_or_remedy: Manufacturing licences of 14 named products suspended, then the suspension order itself cancelled by the state government
    appeal_status: Not applicable; Supreme Court directed the state to take a fresh decision, outcome not further confirmed
    summary_en: >
      On 15 April 2024 the State Drug Licensing Authority (Ayurvedic and Unani Services), Dehradun, suspended the manufacturing licences of 14 Ayurvedic products made by Patanjali and its associate Divya Pharmacy - including Swasari Gold, Mukta Vati Extra Power, Lipidom and Patanjali Drishti Eye Drop - over misleading advertising of their efficacy, in the course of the Supreme Court contempt proceedings. Patanjali told the Supreme Court it had stopped online sales of the products by 9 May 2024 and issued withdrawal instructions to its stockists, franchises and advertising agencies. On 1 July 2024 the Uttarakhand government cancelled its own suspension order after considering a panel report, prompting the Supreme Court on 30 July 2024 to direct the state to take a fresh decision within two weeks.
    summary_hi: >
      15 अप्रैल 2024 को राज्य औषधि लाइसेंसिंग प्राधिकरण (आयुर्वेद एवं यूनानी सेवाएँ), देहरादून ने पतंजलि और उसकी सहयोगी दिव्य फार्मेसी द्वारा निर्मित 14 आयुर्वेदिक उत्पादों — जिनमें स्वसारि गोल्ड, मुक्ता वटी एक्स्ट्रा पावर, लिपिडोम और पतंजलि दृष्टि आई ड्रॉप शामिल हैं — के निर्माण लाइसेंस को उनकी प्रभावकारिता के भ्रामक विज्ञापन के आरोप में सर्वोच्च न्यायालय की अवमानना कार्यवाही के दौरान निलंबित कर दिया। पतंजलि ने सर्वोच्च न्यायालय को बताया कि उसने 9 मई 2024 तक इन उत्पादों की ऑनलाइन बिक्री रोक दी और अपने स्टॉकिस्टों, फ्रेंचाइज़ी व विज्ञापन एजेंसियों को वापसी के निर्देश जारी किए। 1 जुलाई 2024 को उत्तराखंड सरकार ने एक समिति की रिपोर्ट पर विचार करने के बाद अपना निलंबन आदेश रद्द कर दिया, जिस पर सर्वोच्च न्यायालय ने 30 जुलाई 2024 को राज्य को दो सप्ताह के भीतर नया निर्णय लेने का निर्देश दिया।
    source_ids: [ baba-ramdev-src-01, baba-ramdev-src-06, baba-ramdev-src-07 ]

  - id: baba-ramdev-dabur-chyawanprash-2025
    title_en: Dabur India Limited v. Patanjali Ayurved Limited and Anr. (Chyawanprash disparagement)
    title_hi: डाबर इंडिया लिमिटेड बनाम पतंजलि आयुर्वेद लिमिटेड एवं अन्य (च्यवनप्राश अपमानजनक विज्ञापन)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: High Court of Delhi
    case_number: CS(COMM) 1195/2024, I.A. 49744/2024 and I.A. 419/2025
    filed_year: 2024
    case_type: civil
    statutes: [ Trade Marks Act 1999, "law of disparagement/malicious falsehood" ]
    status: interim relief granted; suit and appeal pending; further interim order in a related dispute in November 2025
    tier: regulatory_action
    verdict_date:
    sentence_or_remedy: Patanjali directed to delete specified disparaging lines from its television and print advertisements for Patanjali Special Chyawanprash
    appeal_status: Patanjali filed an intra-court appeal against the 3 July 2025 order (reported 19 September 2025); outcome not further confirmed
    summary_en: >
      Dabur sued Patanjali seeking a permanent injunction over advertisements for "Patanjali Special Chyawanprash" that it said disparaged "Dabur Chyawanprash" - the market leader with about 61.6% share - and Chyawanprash generally, by describing rival products as "ordinary" and asserting that only Patanjali had the traditional knowledge to prepare genuine Chyawanprash. On 3 July 2025 Mini Pushkarna J. held that, as Chyawanprash is a classical Ayurvedic medicine regulated under the Drugs and Cosmetics Act, disparagement had to be judged by a stricter threshold; she found a strong prima facie case and directed Patanjali to delete the impugned lines from its Hindi and English television commercial and print advertisements, leaving other disputed claims (use of "special", "51 precious herbs", presence of mercury) to trial. Patanjali appealed the order. In November 2025 the Court granted further interim relief after Dabur complained of a Star Plus advertisement calling other Chyawanprash "dhoka" (deception).
    summary_hi: >
      डाबर ने पतंजलि के विरुद्ध स्थायी निषेधाज्ञा की माँग करते हुए मुकदमा दायर किया, जिसमें कहा गया कि "पतंजलि स्पेशल च्यवनप्राश" के विज्ञापन "डाबर च्यवनप्राश" — जिसकी बाज़ार में लगभग 61.6% हिस्सेदारी है — और सामान्यतः च्यवनप्राश को प्रतिद्वंद्वी उत्पादों को "साधारण" बताकर तथा यह दावा कर अपमानित करते हैं कि केवल पतंजलि के पास असली च्यवनप्राश बनाने का पारंपरिक ज्ञान है। 3 जुलाई 2025 को न्यायमूर्ति मिनी पुष्करणा ने कहा कि च्यवनप्राश एक शास्त्रीय आयुर्वेदिक औषधि है जो ड्रग्स एंड कॉस्मेटिक्स अधिनियम के तहत विनियमित है, इसलिए अपमानजनकता की परख कड़े मानदंड पर होनी चाहिए; उन्होंने प्रथम दृष्टया मज़बूत मामला पाते हुए पतंजलि को अपने हिंदी व अंग्रेज़ी टीवी विज्ञापन और प्रिंट विज्ञापनों से आपत्तिजनक पंक्तियाँ हटाने का निर्देश दिया, जबकि अन्य विवादित दावे (जैसे "स्पेशल" शब्द का प्रयोग, "51 बहुमूल्य जड़ी-बूटियाँ", पारे की उपस्थिति) विचारण के लिए छोड़ दिए। पतंजलि ने इस आदेश के विरुद्ध अपील की। नवंबर 2025 में न्यायालय ने डाबर की उस शिकायत पर और अंतरिम राहत दी जिसमें स्टार प्लस पर प्रसारित एक विज्ञापन में पतंजलि द्वारा अन्य च्यवनप्राश को "धोखा" कहे जाने का आरोप था।
    source_ids: [ baba-ramdev-src-10, baba-ramdev-src-11, baba-ramdev-src-12, baba-ramdev-src-13 ]

  - id: baba-ramdev-hamdard-sharbat-jihad-2025
    title_en: Hamdard National Foundation India v. Patanjali Foods Limited (the "sharbat jihad" video)
    title_hi: हमदर्द नेशनल फाउंडेशन इंडिया बनाम पतंजलि फूड्स लिमिटेड ("शरबत जिहाद" वीडियो)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: High Court of Delhi
    case_number: CS(COMM) 356/2025
    filed_year: 2025
    case_type: civil
    statutes: [ "law of disparagement/defamation" ]
    status: disposed of
    tier: closed
    verdict_date: 2025-05-09
    sentence_or_remedy: Suit disposed of after the defendants confirmed on affidavit that the impugned video had been permanently removed
    appeal_status: Not applicable
    summary_en: >
      Hamdard National Foundation India sued Patanjali Foods Limited over a video Ramdev posted while promoting Patanjali's new Gulab Sharbat, in which he used the phrase "sharbat jihad" and suggested profits from Hamdard's Rooh Afza funded madrasas and mosques. At a hearing on 22 April 2025, Amit Bansal J. said the remarks "shocked the conscience of the court" and were "indefensible", warned Patanjali's counsel to obtain clear instructions, and directed removal of the video, distinguishing between merely making it private and permanently deleting it; Patanjali complied. When the matter returned in May 2025 the Court noted it would consider issuing a contempt notice if disparaging, communally framed videos against Hamdard continued. On 9 May 2025 the Court disposed of the suit after Patanjali confirmed on affidavit that the video had been permanently taken down.
    summary_hi: >
      हमदर्द नेशनल फाउंडेशन इंडिया ने पतंजलि फूड्स लिमिटेड के विरुद्ध उस वीडियो को लेकर मुकदमा दायर किया जो रामदेव ने पतंजलि के नए गुलाब शरबत के प्रचार के दौरान पोस्ट किया था, जिसमें उन्होंने "शरबत जिहाद" शब्द का प्रयोग किया और यह संकेत दिया कि हमदर्द के रूह अफ़ज़ा से होने वाला मुनाफ़ा मदरसों और मस्जिदों को वित्तपोषित करता है। 22 अप्रैल 2025 की सुनवाई में न्यायमूर्ति अमित बंसल ने कहा कि ये टिप्पणियाँ "न्यायालय की अंतरात्मा को झकझोरने वाली" और "अक्षम्य" हैं, पतंजलि के वकील को स्पष्ट निर्देश लेने की चेतावनी दी, और वीडियो हटाने का आदेश दिया, यह स्पष्ट करते हुए कि इसे केवल निजी करना पर्याप्त नहीं, स्थायी रूप से हटाना आवश्यक है; पतंजलि ने अनुपालन किया। मई 2025 में मामला पुनः सूचीबद्ध होने पर न्यायालय ने कहा कि यदि हमदर्द के विरुद्ध अपमानजनक, सांप्रदायिक रंग वाले वीडियो जारी रहे तो वह अवमानना नोटिस पर विचार करेगा। 9 मई 2025 को पतंजलि द्वारा हलफनामे पर यह पुष्टि करने के बाद कि वीडियो स्थायी रूप से हटा दिया गया है, न्यायालय ने मुकदमा निपटा दिया।
    source_ids: [ baba-ramdev-src-14, baba-ramdev-src-15, baba-ramdev-src-16 ]

  - id: baba-ramdev-coronil-trademark-2020
    title_en: Arudra Engineers Private Limited v. Patanjali Ayurved Limited (the "Coronil" trademark)
    title_hi: अरुद्र इंजीनियर्स प्राइवेट लिमिटेड बनाम पतंजलि आयुर्वेद लिमिटेड ("कोरोनिल" ट्रेडमार्क)
    jurisdiction_country: IN
    jurisdiction_region: Tamil Nadu
    court: Madras High Court (single judge; reversed by Division Bench)
    case_number: O.A. No. 258 of 2020 in C.S. No. 163 of 2020; appeal O.S.A. No. 169 of 2020
    filed_year: 2020
    case_type: civil
    statutes: [ Trade Marks Act 1999 ]
    status: closed; injunction set aside on appeal
    tier: closed
    verdict_date: 2021-02-02
    sentence_or_remedy: Interim injunction restraining use of "Coronil" and a Rs 10 lakh cost, both later set aside on appeal
    appeal_status: Division Bench allowed Patanjali's appeal (O.S.A. No. 169 of 2020) on 2 February 2021
    summary_en: >
      A Chennai company, Arudra Engineers, which had held the registered trademark "CORONIL-92 B" for an industrial acid inhibitor since 1993, sued Patanjali over its "Coronil" tablet, launched in June 2020 and initially described as a cure for Covid-19 before the Ministry of AYUSH said it was licensed only as an immunity booster. On 17 July 2020 C.V. Karthikeyan J. granted an ex-parte interim injunction restraining Patanjali from using the mark; on 6 August 2020 he made the injunction absolute and imposed a Rs 10 lakh cost, split between the Adyar Cancer Institute and a government naturopathy hospital, remarking that Patanjali was "exploiting the fear and panic among the general public" by projecting Coronil as a cure. On 2 February 2021 a Division Bench allowed Patanjali's appeal (O.S.A. No. 169 of 2020), holding that registration of a composite mark does not confer a monopoly over each of its components and that no prima facie case of infringement was made out.
    summary_hi: >
      चेन्नई की एक कंपनी अरुद्र इंजीनियर्स, जिसके पास 1993 से एक औद्योगिक एसिड इनहिबिटर के लिए "CORONIL-92 B" पंजीकृत ट्रेडमार्क था, ने पतंजलि की "कोरोनिल" टैबलेट को लेकर मुकदमा किया, जो जून 2020 में लॉन्च हुई थी और शुरुआत में कोविड-19 के इलाज के रूप में बताई गई थी, जब तक कि आयुष मंत्रालय ने स्पष्ट नहीं किया कि यह केवल इम्युनिटी बूस्टर के रूप में लाइसेंस प्राप्त है। 17 जुलाई 2020 को न्यायमूर्ति सी.वी. कार्तिकेयन ने पतंजलि को यह चिह्न उपयोग करने से रोकते हुए एकपक्षीय अंतरिम निषेधाज्ञा दी; 6 अगस्त 2020 को उन्होंने इस निषेधाज्ञा को स्थायी बनाया और 10 लाख रुपये का हर्जाना लगाया, जिसे अड्यार कैंसर इंस्टिट्यूट और एक सरकारी नेचुरोपैथी अस्पताल के बीच बाँटा जाना था, यह टिप्पणी करते हुए कि पतंजलि कोरोनिल को इलाज के रूप में प्रस्तुत कर "आम जनता में भय और दहशत का लाभ उठा" रहा है। 2 फरवरी 2021 को खंडपीठ ने पतंजलि की अपील (O.S.A. No. 169/2020) स्वीकार करते हुए कहा कि किसी संयुक्त चिह्न का पंजीकरण उसके प्रत्येक घटक पर एकाधिकार नहीं देता और अतिक्रमण का प्रथम दृष्टया कोई मामला नहीं बनता।
    source_ids: [ baba-ramdev-src-17, baba-ramdev-src-18, baba-ramdev-src-19, baba-ramdev-src-20 ]

claims:
  - id: baba-ramdev-claim-01
    case_id: baba-ramdev-ima-contempt-2024
    statement_en: On 27 February 2024 the Supreme Court issued a notice to Patanjali Ayurved Limited and its Managing Director, Acharya Balkrishna, to show cause why contempt of court proceedings should not be initiated against them for advertisements and a press conference held by Ramdev and Balkrishna that the Court found violated a 21 November 2023 undertaking against advertising claims of medicinal efficacy.
    statement_hi: 27 फरवरी 2024 को सर्वोच्च न्यायालय ने पतंजलि आयुर्वेद लिमिटेड और उसके प्रबंध निदेशक आचार्य बालकृष्ण को यह कारण बताओ नोटिस जारी किया कि उनके विरुद्ध अवमानना कार्यवाही क्यों न शुरू की जाए, क्योंकि रामदेव और बालकृष्ण द्वारा जारी विज्ञापनों और आयोजित प्रेस सम्मेलन ने न्यायालय की दृष्टि में 21 नवंबर 2023 के उस वचन का उल्लंघन किया जिसमें औषधीय प्रभावकारिता के विज्ञापन दावों से बचने की बात कही गई थी।
    tier: regulatory_action
    date: 2024-02-27
    source_ids: [ baba-ramdev-src-01, baba-ramdev-src-02 ]
  - id: baba-ramdev-claim-02
    case_id: baba-ramdev-ima-contempt-2024
    statement_en: On 19 March 2024 the Supreme Court issued a similar contempt notice to Baba Ramdev individually, finding that he too had violated the provisions of law by participating in the press conference and advertisements.
    statement_hi: 19 मार्च 2024 को सर्वोच्च न्यायालय ने बाबा रामदेव को व्यक्तिगत रूप से भी ऐसा ही अवमानना नोटिस जारी किया, यह पाते हुए कि उन्होंने भी प्रेस सम्मेलन और विज्ञापनों में भाग लेकर कानून के प्रावधानों का उल्लंघन किया।
    tier: regulatory_action
    date: 2024-03-19
    source_ids: [ baba-ramdev-src-01 ]
  - id: baba-ramdev-claim-03
    case_id: baba-ramdev-ima-contempt-2024
    statement_en: On 13 August 2024 a Division Bench of the Supreme Court (Hima Kohli and Ahsanuddin Amanullah JJ) closed the suo motu contempt proceedings against Patanjali, Balkrishna and Ramdev, accepting their unconditional apology and the steps taken to publicise it, while cautioning that "any future intransigence" would be viewed strictly and could revive the contempt proceedings.
    statement_hi: 13 अगस्त 2024 को सर्वोच्च न्यायालय की खंडपीठ (न्यायमूर्ति हिमा कोहली और अहसानुद्दीन अमानुल्लाह) ने पतंजलि, बालकृष्ण और रामदेव के विरुद्ध स्वतः संज्ञान अवमानना कार्यवाही बंद कर दी, उनकी बिना शर्त माफी और उसे सार्वजनिक करने हेतु उठाए गए कदमों को स्वीकार करते हुए, साथ ही यह चेतावनी दी कि "भविष्य में कोई भी हठधर्मिता" गंभीरता से देखी जाएगी और अवमानना कार्यवाही पुनः शुरू हो सकती है।
    tier: closed
    date: 2024-08-13
    source_ids: [ baba-ramdev-src-01, baba-ramdev-src-03, baba-ramdev-src-04, baba-ramdev-src-05 ]
  - id: baba-ramdev-claim-04
    case_id: baba-ramdev-uttarakhand-licence-suspension-2024
    statement_en: On 15 April 2024 the State Drug Licensing Authority (Ayurvedic and Unani Services), Dehradun, Uttarakhand, suspended the manufacturing licences of 14 Ayurvedic products made by Patanjali and its associate Divya Pharmacy, over misleading advertising of their efficacy.
    statement_hi: 15 अप्रैल 2024 को उत्तराखंड के राज्य औषधि लाइसेंसिंग प्राधिकरण (आयुर्वेद एवं यूनानी सेवाएँ), देहरादून ने पतंजलि और उसकी सहयोगी दिव्य फार्मेसी द्वारा निर्मित 14 आयुर्वेदिक उत्पादों के निर्माण लाइसेंस को उनकी प्रभावकारिता के भ्रामक विज्ञापन के आरोप में निलंबित कर दिया।
    tier: regulatory_action
    date: 2024-04-15
    source_ids: [ baba-ramdev-src-01, baba-ramdev-src-07 ]
  - id: baba-ramdev-claim-05
    case_id: baba-ramdev-uttarakhand-licence-suspension-2024
    statement_en: On 1 July 2024 the Uttarakhand government cancelled its own 15 April 2024 order suspending the 14 product licences, after considering the report of a panel it had constituted to examine the matter.
    statement_hi: 1 जुलाई 2024 को उत्तराखंड सरकार ने 14 उत्पाद लाइसेंसों को निलंबित करने वाले अपने 15 अप्रैल 2024 के आदेश को, इस विषय की जाँच हेतु गठित एक समिति की रिपोर्ट पर विचार करने के बाद, स्वयं रद्द कर दिया।
    tier: closed
    date: 2024-07-01
    source_ids: [ baba-ramdev-src-06 ]
  - id: baba-ramdev-claim-06
    case_id: baba-ramdev-uttarakhand-licence-suspension-2024
    statement_en: On 30 July 2024, in the course of the contempt proceedings, a Supreme Court bench of Hima Kohli and Sandeep Mehta JJ directed the Uttarakhand government to take a fresh decision on the licence suspension within two weeks and to file a report, after IMA's counsel pointed out that the 14 medicines remained available over the counter despite the cancelled suspension.
    statement_hi: 30 जुलाई 2024 को, अवमानना कार्यवाही के दौरान, सर्वोच्च न्यायालय की न्यायमूर्ति हिमा कोहली और संदीप मेहता की पीठ ने उत्तराखंड सरकार को दो सप्ताह के भीतर लाइसेंस निलंबन पर नया निर्णय लेने और रिपोर्ट दाखिल करने का निर्देश दिया, यह देखते हुए कि आईएमए के वकील ने बताया था कि निलंबन रद्द होने के बावजूद 14 दवाएँ खुले बाज़ार में उपलब्ध हैं।
    tier: regulatory_action
    date: 2024-07-30
    source_ids: [ baba-ramdev-src-06, baba-ramdev-src-24 ]
