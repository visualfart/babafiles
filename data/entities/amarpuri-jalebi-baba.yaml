cases:
  - id: amarpuri-jalebi-baba-fatehabad-pocso-2018
    title_en: State v. Billu Ram alias Amarpuri (Tohana FIR of 19 July 2018; Fast Track Court, Fatehabad)
    title_hi: राज्य बनाम बिल्लू राम उर्फ अमरपुरी (टोहाना एफआईआर, 19 जुलाई 2018; फास्ट ट्रैक कोर्ट, फतेहाबाद)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: Fast Track Court (Additional District Judge Balwant Singh), Fatehabad
    case_number:
    filed_year: 2018
    case_type: criminal
    statutes: [ IPC 292, IPC 293, IPC 294, IPC 376, IPC 384, IPC 509, POCSO s.6, IT Act s.67A, Arms Act ]
    status: >
      Reported by The Tribune as convicted on 5 January 2023 and sentenced on 10 January 2023; defence counsel said the verdict would be challenged in the Punjab and Haryana High Court; the convict died in custody on 8 May 2024. Held at allegation tier because no court or official record has yet been obtained.
    tier: allegation
    verdict_date: 2023-01-05
    sentence_or_remedy: >
      14 years' rigorous imprisonment under POCSO s.6, 7 years each on two rape counts (reported as IPC 376/376-C) and 5 years under IT Act s.67A, all concurrent, with a fine of Rs 35,000; acquitted of the Arms Act charge (as reported).
    appeal_status: >
      Defence counsel Gajender Pandey told The Tribune on 11 January 2023 that the verdict would be challenged in the High Court. No Punjab and Haryana High Court order or case-status record could be located as of 2026-09-09; the convict died on 8 May 2024.
    summary_en: >
      Tohana city police registered a case on 19 July 2018, on the complaint of the then SHO, under IPC sections 292, 293, 294, 376, 384 and 509 and section 67A of the IT Act, after a video clip allegedly showing Amarpuri with a woman reached the police; POCSO Act sections were added when a minor was identified among the victims. Police told reporters that around 120 video clips were recovered and that six women were traced from the footage, of whom five agreed to depose. The Tribune reported that the Fast Track Court at Fatehabad convicted him on 5 January 2023 on the evidence of three women including a minor, and on 10 January 2023 sentenced him to 14 years' imprisonment with a fine of Rs 35,000, the sentences running concurrently, with about four and a half years already served to be deducted. His counsel argued the case rested on CDs without a section 65B certificate and said the verdict would be appealed. No court judgment or official statement has yet been fetched for this file.
    summary_hi: >
      टोहाना शहर पुलिस ने 19 जुलाई 2018 को तत्कालीन थाना प्रभारी की शिकायत पर आईपीसी की धारा 292, 293, 294, 376, 384, 509 और आईटी अधिनियम की धारा 67A के तहत मामला दर्ज किया, जब कथित रूप से अमरपुरी को एक महिला के साथ दिखाने वाली एक वीडियो क्लिप पुलिस तक पहुँची; पीड़ितों में एक नाबालिग की पहचान होने पर पॉक्सो अधिनियम की धाराएँ जोड़ी गईं। पुलिस ने पत्रकारों को बताया कि लगभग 120 वीडियो क्लिप बरामद हुईं और फुटेज से छह महिलाओं का पता लगाया गया, जिनमें से पाँच गवाही देने को तैयार हुईं। द ट्रिब्यून के अनुसार फतेहाबाद की फास्ट ट्रैक अदालत ने 5 जनवरी 2023 को एक नाबालिग सहित तीन महिलाओं की गवाही के आधार पर उन्हें दोषी ठहराया और 10 जनवरी 2023 को 14 वर्ष के कारावास तथा 35,000 रुपये जुर्माने की सज़ा सुनाई; सभी सज़ाएँ साथ-साथ चलेंगी और लगभग साढ़े चार वर्ष की पहले से काटी गई अवधि घटाई जाएगी। उनके वकील ने कहा कि मामला बिना धारा 65B प्रमाणपत्र वाली सीडी पर टिका है और फैसले के विरुद्ध अपील की जाएगी। इस फ़ाइल के लिए अभी तक कोई अदालती निर्णय या आधिकारिक बयान प्राप्त नहीं हुआ है।
    source_ids: [ amarpuri-jalebi-baba-src-01, amarpuri-jalebi-baba-src-02, amarpuri-jalebi-baba-src-03, amarpuri-jalebi-baba-src-04 ]

  - id: amarpuri-jalebi-baba-ndps-tohana
    title_en: State v. Amarpuri (NDPS Act case, Tohana)
    title_hi: राज्य बनाम अमरपुरी (एनडीपीएस अधिनियम मामला, टोहाना)
    jurisdiction_country: IN
    jurisdiction_region: Haryana
    court: District Courts, Fatehabad
    case_number:
    filed_year: 2018
    case_type: criminal
    statutes: [ NDPS Act ]
    status: >
      Reported by The Tribune in January 2023 as under trial after police recovered drugs from him; no outcome located. The accused died on 8 May 2024.
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      The Tribune reported on 11 January 2023 that, apart from the sexual-offence case, Amarpuri was "also facing another case under the NDPS Act as the police had recovered drugs from him which are under trial in the court". Reports of the 2018 search list intoxicating pills among the items seized from the ashram. No case number, court record or outcome has been located; the filing year is inferred from the 2018 arrest and is unconfirmed.
    summary_hi: >
      द ट्रिब्यून ने 11 जनवरी 2023 को बताया कि यौन अपराध के मामले के अलावा अमरपुरी पर एनडीपीएस अधिनियम के तहत एक और मामला चल रहा था, क्योंकि पुलिस ने उनसे नशीले पदार्थ बरामद किए थे। 2018 की तलाशी की रिपोर्टों में आश्रम से जब्त वस्तुओं में नशीली गोलियाँ शामिल बताई गई हैं। कोई मामला संख्या, अदालती रिकॉर्ड या परिणाम नहीं मिला है; दाखिल होने का वर्ष 2018 की गिरफ्तारी से अनुमानित है और अपुष्ट है।
    source_ids: [ amarpuri-jalebi-baba-src-02 ]

