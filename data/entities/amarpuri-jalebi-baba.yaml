    source_ids: [ amarpuri-jalebi-baba-src-02, amarpuri-jalebi-baba-src-03 ]

  - id: amarpuri-jalebi-baba-claim-03
    case_id: amarpuri-jalebi-baba-fatehabad-pocso-2018
    statement_en: >
      Amarpuri was arrested in July 2018 and, according to The Tribune and Outlook, had been in jail for about four and a half years by the time of sentencing in January 2023, that period to be deducted from his term.
    statement_hi: >
      अमरपुरी को जुलाई 2018 में गिरफ्तार किया गया और द ट्रिब्यून तथा आउटलुक के अनुसार जनवरी 2023 में सज़ा सुनाए जाने तक वे लगभग साढ़े चार वर्ष जेल में रह चुके थे, जो अवधि उनकी सज़ा से घटाई जानी थी।
    tier: allegation
    date: 2018-07
    source_ids: [ amarpuri-jalebi-baba-src-03, amarpuri-jalebi-baba-src-04, amarpuri-jalebi-baba-src-05 ]

  - id: amarpuri-jalebi-baba-claim-04
    case_id: amarpuri-jalebi-baba-fatehabad-pocso-2018
    statement_en: >
      The Tribune reported that on 5 January 2023 Fast Track Court judge Balwant Singh at Fatehabad convicted Billu Ram alias Amarpuri alias Jalebi Baba, relying on the evidence of three women including a minor.
    statement_hi: >
      द ट्रिब्यून के अनुसार 5 जनवरी 2023 को फतेहाबाद के फास्ट ट्रैक कोर्ट के न्यायाधीश बलवंत सिंह ने एक नाबालिग सहित तीन महिलाओं की गवाही के आधार पर बिल्लू राम उर्फ अमरपुरी उर्फ जलेबी बाबा को दोषी ठहराया।
    tier: allegation
    date: 2023-01-05
    source_ids: [ amarpuri-jalebi-baba-src-01, amarpuri-jalebi-baba-src-02 ]

  - id: amarpuri-jalebi-baba-claim-05
    case_id: amarpuri-jalebi-baba-fatehabad-pocso-2018
    statement_en: >
      The Tribune reported that on 10 January 2023 the Fast Track Court at Fatehabad sentenced Amarpuri to 14 years' imprisonment and imposed a fine of Rs 35,000.
    statement_hi: >
      द ट्रिब्यून के अनुसार 10 जनवरी 2023 को फतेहाबाद की फास्ट ट्रैक अदालत ने अमरपुरी को 14 वर्ष के कारावास की सज़ा सुनाई और 35,000 रुपये का जुर्माना लगाया।
    tier: allegation
    date: 2023-01-10
    source_ids: [ amarpuri-jalebi-baba-src-01, amarpuri-jalebi-baba-src-03 ]

  - id: amarpuri-jalebi-baba-claim-06
    case_id: amarpuri-jalebi-baba-fatehabad-pocso-2018
    statement_en: >
      As reported, the sentence comprised 14 years under section 6 of the POCSO Act, seven years on each of two rape counts under IPC 376 (Outlook: 376-C) and five years under section 67A of the IT Act, all to run concurrently.
    statement_hi: >
      रिपोर्टों के अनुसार सज़ा में पॉक्सो अधिनियम की धारा 6 के तहत 14 वर्ष, आईपीसी 376 (आउटलुक के अनुसार 376-C) के तहत बलात्कार के दो मामलों में सात-सात वर्ष और आईटी अधिनियम की धारा 67A के तहत पाँच वर्ष शामिल थे, जो सभी साथ-साथ चलेंगी।
    tier: allegation
    date: 2023-01-10
    source_ids: [ amarpuri-jalebi-baba-src-02, amarpuri-jalebi-baba-src-03, amarpuri-jalebi-baba-src-04 ]

  - id: amarpuri-jalebi-baba-claim-07
    case_id: amarpuri-jalebi-baba-fatehabad-pocso-2018
    statement_en: >
      Outlook reported that Amarpuri was acquitted of the Arms Act charge in the same trial; reports of the 2018 search list live cartridges among the items seized.
    statement_hi: >
      आउटलुक के अनुसार उसी मुकदमे में अमरपुरी को आर्म्स एक्ट के आरोप से बरी कर दिया गया; 2018 की तलाशी की रिपोर्टों में जब्त वस्तुओं में जीवित कारतूस शामिल बताए गए हैं।
    tier: allegation
    date: 2023-01-05
    source_ids: [ amarpuri-jalebi-baba-src-04, amarpuri-jalebi-baba-src-06 ]

  - id: amarpuri-jalebi-baba-claim-08
    case_id: amarpuri-jalebi-baba-fatehabad-pocso-2018
    statement_en: >
      The FIR included IPC section 384 (extortion); police and reports stated that he used the recorded videos to blackmail the women for money.
    statement_hi: >
      एफआईआर में आईपीसी की धारा 384 (जबरन वसूली) शामिल थी; पुलिस और रिपोर्टों के अनुसार वे रिकॉर्ड किए गए वीडियो का उपयोग महिलाओं से पैसे के लिए ब्लैकमेल करने में करते थे।
    tier: allegation
    date: 2018-07-19
    source_ids: [ amarpuri-jalebi-baba-src-01, amarpuri-jalebi-baba-src-04 ]

  - id: amarpuri-jalebi-baba-claim-09
    case_id: amarpuri-jalebi-baba-fatehabad-pocso-2018
    statement_en: >
      Defence counsel Gajender Pandey told The Tribune that the case depended entirely on the contents of the CDs, that no certificate under section 65B of the Indian Evidence Act had been given for their authenticity, and that the verdict would be challenged in the High Court.
    statement_hi: >
      बचाव पक्ष के वकील गजेंद्र पांडे ने द ट्रिब्यून को बताया कि मामला पूरी तरह सीडी की सामग्री पर निर्भर है, उनकी प्रामाणिकता के लिए भारतीय साक्ष्य अधिनियम की धारा 65B के तहत कोई प्रमाणपत्र नहीं दिया गया, और फैसले को उच्च न्यायालय में चुनौती दी जाएगी।
    tier: allegation
    date: 2023-01-11
    source_ids: [ amarpuri-jalebi-baba-src-02 ]

  - id: amarpuri-jalebi-baba-claim-10
    case_id: amarpuri-jalebi-baba-ndps-tohana
    statement_en: >
      The Tribune reported in January 2023 that Amarpuri was also facing a separate case under the NDPS Act, then under trial, after police recovered drugs from him.
    statement_hi: >
      द ट्रिब्यून ने जनवरी 2023 में बताया कि पुलिस द्वारा नशीले पदार्थ बरामद किए जाने के बाद अमरपुरी पर एनडीपीएस अधिनियम के तहत एक अलग मामला भी चल रहा था।
    tier: allegation
    date: 2023-01-11
    source_ids: [ amarpuri-jalebi-baba-src-02 ]

