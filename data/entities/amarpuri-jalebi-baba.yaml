summary_en: >
  Amarpuri, alias Billu Ram, known locally as "Jalebi Baba", ran an ashram at a temple in Tohana, Fatehabad district, Haryana. Tohana police registered a case against him on 19 July 2018 under IPC sections 292, 293, 294, 376, 384 and 509 and section 67A of the IT Act, with POCSO Act sections added later, after video clips allegedly showing him with women were recovered. The Tribune reported that the Fast Track Court at Fatehabad (Judge Balwant Singh) convicted him on 5 January 2023 and on 10 January 2023 sentenced him to 14 years' imprisonment with a fine of Rs 35,000; his counsel said the verdict would be challenged in the Punjab and Haryana High Court. He died in custody at Hisar on 8 May 2024. No court or official record has yet been obtained for this file, so all claims are held at the allegation tier pending that record.
summary_hi: >
  अमरपुरी उर्फ बिल्लू राम, जिन्हें स्थानीय रूप से "जलेबी बाबा" कहा जाता था, हरियाणा के फतेहाबाद जिले के टोहाना में एक मंदिर परिसर में आश्रम चलाते थे। टोहाना पुलिस ने 19 जुलाई 2018 को उनके विरुद्ध आईपीसी की धारा 292, 293, 294, 376, 384, 509 और आईटी अधिनियम की धारा 67A के तहत मामला दर्ज किया; बाद में पॉक्सो अधिनियम की धाराएँ जोड़ी गईं। द ट्रिब्यून के अनुसार फतेहाबाद की फास्ट ट्रैक अदालत (न्यायाधीश बलवंत सिंह) ने 5 जनवरी 2023 को उन्हें दोषी ठहराया और 10 जनवरी 2023 को 14 वर्ष के कारावास तथा 35,000 रुपये जुर्माने की सज़ा सुनाई; उनके वकील ने कहा कि फैसले को पंजाब एवं हरियाणा उच्च न्यायालय में चुनौती दी जाएगी। 8 मई 2024 को हिसार में हिरासत के दौरान उनकी मृत्यु हो गई। इस फ़ाइल के लिए अभी तक कोई अदालती या आधिकारिक रिकॉर्ड प्राप्त नहीं हुआ है, इसलिए सभी दावे उस रिकॉर्ड के मिलने तक आरोप स्तर पर रखे गए हैं।
hi_reviewed: false
response_from_subject:
  text_en: >
    Defence counsel Gajender Pandey, quoted by The Tribune after sentencing, said the case "is entirely dependent on the contents of the CDs and the requisite certificate under the section 65B of the Indian Evidence Act was not given in the court for authenticity", and added: "We are waiting for the judgement and will challenge it in the high court."
  text_hi: >
    सज़ा सुनाए जाने के बाद द ट्रिब्यून से बात करते हुए बचाव पक्ष के वकील गजेंद्र पांडे ने कहा कि मामला पूरी तरह सीडी की सामग्री पर निर्भर है और भारतीय साक्ष्य अधिनियम की धारा 65B के तहत प्रामाणिकता का आवश्यक प्रमाणपत्र अदालत में नहीं दिया गया; उन्होंने कहा कि "हम फैसले की प्रतीक्षा कर रहे हैं और इसे उच्च न्यायालय में चुनौती देंगे।"
  source_id: amarpuri-jalebi-baba-src-02

