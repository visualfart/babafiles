summary_en: >
  Sarathi Baba (Santosh Kumar Roul), who ran an ashram at Barimula in Kendrapara district,
  Odisha, was arrested in August 2015 after a television exposé and a criminal complaint by a
  woman follower. The case against him, registered by the Crime Branch (CID, CB, Cuttack P.S.
  Case No. 20 of 2015, G.R. Case No. 1062 of 2015), alleges criminal conspiracy, cheating,
  assault with intent to outrage modesty and criminal intimidation. He has been granted bail
  at various stages, including by the Orissa High Court in July 2019 on the ground of
  prolonged undertrial detention. In December 2025 a Special Court under the SC/ST
  (Prevention of Atrocities) Act at Cuttack formally framed charges against him in the 2015
  Crime Branch case, and the matter is due to proceed to trial.
summary_hi: >
  सारथी बाबा (संतोष कुमार रौल), जो ओडिशा के केंद्रापड़ा ज़िले के बारीमूला में आश्रम चलाते थे, को अगस्त
  2015 में एक टीवी स्टिंग और एक महिला अनुयायी की शिकायत के बाद गिरफ्तार किया गया था। उनके विरुद्ध
  क्राइम ब्रांच द्वारा दर्ज मामले (सीआईडी, सीबी, कटक थाना केस संख्या 20/2015, जी.आर. केस संख्या
  1062/2015) में आपराधिक षड्यंत्र, धोखाधड़ी, शील भंग के इरादे से हमला और आपराधिक धमकी के आरोप हैं।
  उन्हें विभिन्न चरणों में ज़मानत मिली है, जिसमें जुलाई 2019 में उड़ीसा उच्च न्यायालय से लंबी विचाराधीन
  हिरासत के आधार पर मिली ज़मानत भी शामिल है। दिसंबर 2025 में कटक की अनुसूचित जाति/अनुसूचित जनजाति
  (अत्याचार निवारण) अधिनियम की विशेष अदालत ने 2015 के क्राइम ब्रांच मामले में उन पर औपचारिक रूप से
  आरोप तय किए, और अब मामला विचारण की ओर बढ़ना है।
