cases:
  - id: sarathi-baba-cheating-assault-2015
    title_en: State v. Santosh Kumar Roul alias Sarathi Baba (Crime Branch case, cheating, assault, criminal intimidation)
    title_hi: राज्य बनाम संतोष कुमार रौल उर्फ सारथी बाबा (क्राइम ब्रांच मामला, धोखाधड़ी, हमला, आपराधिक धमकी)
    jurisdiction_country: IN
    jurisdiction_region: Odisha
    court: Special Court under the SC/ST (Prevention of Atrocities) Act (ADJ-3), Cuttack (trial); Orissa High Court and Supreme Court of India (bail)
    case_number: CID, CB, Cuttack P.S. Case No. 20 of 2015, corresponding to G.R. Case No. 1062 of 2015
    filed_year: 2015
    case_type: criminal
    statutes: ["IPC 120-B", "IPC 420", "IPC 354", "IPC 506", "IPC 34", "Arms Act 1959", "SC/ST (Prevention of Atrocities) Act 1989"]
    status: charges framed in December 2025; trial pending
    tier: charged
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable; trial pending as of December 2025.
    summary_en: >
      Following a television exposé and a complaint from a woman follower, Santosh Kumar Roul,
      known as Sarathi Baba, was arrested in August 2015. According to the FIR dated 20 August
      2015, the complainant alleged that Sarathi Baba took money and gold ornaments from her
      mother on a promise to arrange the complainant's marriage, kept mother and daughter doing
      forced labour at his ashram, showed the complainant nude photographs of herself to threaten
      her into silence, and molested her; the case was registered by the Crime Branch (CID, CB,
      Cuttack P.S. Case No. 20 of 2015) under IPC 120-B, 420, 354, 506 read with 34, and later
      also invoked the Arms Act and the SC/ST (Prevention of Atrocities) Act. He was held in
      pre-trial custody for an extended period; the Orissa High Court and the Supreme Court
      rejected earlier bail applications, and the Orissa High Court eventually granted him bail
      on 22 July 2019 under section 436-A Cr.P.C. because he had been detained beyond half the
      maximum sentence for the alleged offences. In December 2025, more than a decade after
      registration, a Special Court under the SC/ST (Prevention of Atrocities) Act (ADJ-3) at
      Cuttack formally framed charges against him, moving the case toward trial.
    summary_hi: >
      एक टीवी स्टिंग ऑपरेशन और एक महिला अनुयायी की शिकायत के बाद, सारथी बाबा के नाम से प्रसिद्ध संतोष
      कुमार रौल को अगस्त 2015 में गिरफ्तार किया गया। 20 अगस्त 2015 की एफआईआर के अनुसार, शिकायतकर्ता ने
      आरोप लगाया कि सारथी बाबा ने उसकी माँ से उसकी शादी कराने का वादा कर पैसे और सोने के आभूषण लिए,
      माँ-बेटी को आश्रम में जबरन काम कराया, शिकायतकर्ता को चुप रहने के लिए धमकाने हेतु उसकी नग्न
      तस्वीरें दिखाईं, और उसका शील भंग किया; क्राइम ब्रांच (सीआईडी, सीबी, कटक थाना केस संख्या 20/2015)
      ने आईपीसी 120-बी, 420, 354, 506/34 के तहत मामला दर्ज किया, जिसमें बाद में आर्म्स एक्ट और
      अनुसूचित जाति/अनुसूचित जनजाति (अत्याचार निवारण) अधिनियम भी जोड़े गए। उन्हें लंबे समय तक विचाराधीन
      हिरासत में रखा गया; उड़ीसा उच्च न्यायालय और सर्वोच्च न्यायालय ने पहले की ज़मानत याचिकाएँ खारिज कीं,
      और अंततः उड़ीसा उच्च न्यायालय ने 22 जुलाई 2019 को धारा 436-ए सीआरपीसी के तहत ज़मानत दी क्योंकि वे
      आरोपित अपराधों की अधिकतम सज़ा की आधी अवधि से अधिक हिरासत में रह चुके थे। दिसंबर 2025 में, पंजीकरण
      के एक दशक से अधिक समय बाद, कटक की अनुसूचित जाति/अनुसूचित जनजाति (अत्याचार निवारण) अधिनियम की
      विशेष अदालत (एडीजे-3) ने उन पर औपचारिक रूप से आरोप तय किए, जिससे मामला विचारण की ओर बढ़ा।
    source_ids: [sarathi-src-01, sarathi-src-02]

claims:
  - id: sarathi-claim-01
    case_id: sarathi-baba-cheating-assault-2015
    statement_en: Sarathi Baba (Santosh Kumar Roul) was arrested in August 2015 after a Crime Branch FIR dated 20 August 2015 alleging cheating, forced confinement, criminal intimidation and molestation of a young woman follower and her mother at his Kendrapara ashram.
    statement_hi: सारथी बाबा (संतोष कुमार रौल) को अगस्त 2015 में क्राइम ब्रांच की 20 अगस्त 2015 की एफआईआर के बाद गिरफ्तार किया गया, जिसमें केंद्रापड़ा आश्रम में एक युवा अनुयायी और उसकी माँ के साथ धोखाधड़ी, जबरन बंधक बनाने, आपराधिक धमकी और शील भंग के आरोप थे।
    tier: under_investigation
    date: 2015-08
    source_ids: [sarathi-src-01]
  - id: sarathi-claim-02
    case_id: sarathi-baba-cheating-assault-2015
    statement_en: The case against Sarathi Baba (CID, CB, Cuttack P.S. Case No. 20 of 2015, G.R. Case No. 1062 of 2015) proceeded to a chargesheet before the Sub-Divisional Judicial Magistrate, Kendrapara, on charges under IPC 120-B, 420, 354 and 506 read with 34, later joined by charges under the Arms Act 1959 and the SC/ST (Prevention of Atrocities) Act 1989.
    statement_hi: सारथी बाबा के विरुद्ध मामला (सीआईडी, सीबी, कटक थाना केस संख्या 20/2015, जी.आर. केस संख्या 1062/2015) केंद्रापड़ा के उप-मंडल न्यायिक मजिस्ट्रेट के समक्ष आईपीसी 120-बी, 420, 354 और 506/34 के आरोपों में आरोप-पत्र तक पहुँचा, जिसमें बाद में आर्म्स एक्ट 1959 और अनुसूचित जाति/अनुसूचित जनजाति (अत्याचार निवारण) अधिनियम 1989 के आरोप भी जोड़े गए।
    tier: charged
    date: 2015-12
    source_ids: [sarathi-src-01, sarathi-src-02]
  - id: sarathi-claim-03
    case_id: sarathi-baba-cheating-assault-2015
    statement_en: On 22 July 2019 the Orissa High Court (S.K. Sahoo, J.) granted Sarathi Baba bail under section 436-A of the Code of Criminal Procedure, holding that he had been held in undertrial detention beyond one-half of the maximum sentence provided for the alleged offences, after noting that his earlier bail applications before the High Court and the Supreme Court had been rejected.
    statement_hi: 22 जुलाई 2019 को उड़ीसा उच्च न्यायालय (न्यायमूर्ति एस.के. साहू) ने सारथी बाबा को दंड प्रक्रिया संहिता की धारा 436-ए के तहत ज़मानत दी, यह मानते हुए कि वे आरोपित अपराधों की अधिकतम सज़ा की आधी अवधि से अधिक विचाराधीन हिरासत में रह चुके थे, यह नोट करने के बाद कि उच्च न्यायालय और सर्वोच्च न्यायालय में उनकी पूर्व ज़मानत याचिकाएँ खारिज हो चुकी थीं।
    tier: charged
    date: 2019-07-22
    source_ids: [sarathi-src-01]
  - id: sarathi-claim-04
    case_id: sarathi-baba-cheating-assault-2015
    statement_en: In December 2025 a Special Court under the SC/ST (Prevention of Atrocities) Act (ADJ-3) at Cuttack formally framed charges against Sarathi Baba in the 2015 Crime Branch case, more than a decade after it was registered, sending the matter toward trial.
    statement_hi: दिसंबर 2025 में कटक की अनुसूचित जाति/अनुसूचित जनजाति (अत्याचार निवारण) अधिनियम की विशेष अदालत (एडीजे-3) ने 2015 के क्राइम ब्रांच मामले में, पंजीकरण के एक दशक से अधिक समय बाद, सारथी बाबा पर औपचारिक रूप से आरोप तय किए, जिससे मामला विचारण की ओर बढ़ा।
    tier: charged
    date: 2025-12-05
    source_ids: [sarathi-src-02, sarathi-src-01]

