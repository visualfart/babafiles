summary_en: >
  Vijay Kumar Naidu, who calls himself Kalki Bhagwan and, with his wife, "Amma Bhagwan," built
  a spiritual movement of ashrams and "Oneness"-branded retreats headquartered at Varadaiahpalem
  in Andhra Pradesh's Chittoor district. In October 2019 the Income Tax Department carried out
  simultaneous searches at more than 40 premises linked to him and his son Krishna across Andhra
  Pradesh, Tamil Nadu, Telangana and Karnataka. The department's own release, as reported by the
  press, put preliminary unaccounted cash receipts at about Rs 409 crore since 2014-15, and
  officials cited to reporters described roughly Rs 44 crore in cash, about Rs 18 crore in
  foreign currency and around 88 kg of gold seized from the searched premises. No prosecution,
  chargesheet or assessment order arising from the searches was found on the public record. The
  organisation, through a statement issued on its behalf, confirmed the searches while disputing
  media characterisations of them and said it would abide by any adverse legal finding. Earlier
  press reports had also described unresolved private allegations of land encroachment near the
  Varadaiahpalem ashram and, separately, a 2008 stampede at the campus in which five people died;
  no court or official record of prosecution over either was located.
summary_hi: >
  विजय कुमार नायडू, जो स्वयं को कल्कि भगवान कहते हैं और अपनी पत्नी के साथ मिलकर "अम्मा भगवान" कहलाते हैं,
  ने आंध्र प्रदेश के चित्तूर ज़िले में वरदैयापालम स्थित मुख्यालय से आश्रमों और "वननेस" नाम से जुड़े रिट्रीट का एक
  आध्यात्मिक आंदोलन खड़ा किया। अक्टूबर 2019 में आयकर विभाग ने उनसे और उनके पुत्र कृष्णा से जुड़े 40 से अधिक
  परिसरों पर आंध्र प्रदेश, तमिलनाडु, तेलंगाना और कर्नाटक में एक साथ तलाशी ली। प्रेस रिपोर्टों के अनुसार विभाग के
  अपने बयान में 2014-15 से लगभग 409 करोड़ रुपये की बेहिसाब नकद प्राप्तियों का प्रारंभिक अनुमान बताया गया, और
  अधिकारियों के हवाले से रिपोर्टर्स ने लगभग 44 करोड़ रुपये नकद, लगभग 18 करोड़ रुपये की विदेशी मुद्रा और लगभग
  88 किलोग्राम सोना ज़ब्त किए जाने की जानकारी दी। तलाशी से उपजा कोई अभियोजन, आरोप-पत्र या निर्धारण आदेश सार्वजनिक
  अभिलेख पर नहीं मिला। संगठन ने अपनी ओर से जारी एक बयान में तलाशी की पुष्टि करते हुए मीडिया के चित्रण पर आपत्ति
  जताई और कहा कि यदि सरकार को कोई गड़बड़ी मिलती है तो वह क़ानूनी रूप से उसका सामना करेगा। पहले की प्रेस रिपोर्टों
  में वरदैयापालम आश्रम के पास भूमि पर अतिक्रमण के निजी आरोप और, अलग से, 2008 में परिसर में हुई भगदड़ का भी
  उल्लेख था जिसमें पाँच लोगों की मृत्यु हुई थी; इनमें से किसी में भी अभियोजन का न्यायालयीन या आधिकारिक अभिलेख नहीं मिला।
