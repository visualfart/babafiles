claims:
  - id: kalki-bhagwan-claim-01
    statement_en: On 16 October 2019 the Income Tax Department began simultaneous searches at more than 40 premises linked to Kalki Bhagwan and his son Krishna in Andhra Pradesh, Tamil Nadu, Telangana and Karnataka, including the movement's headquarters at Varadaiahpalem.
    statement_hi: 16 अक्टूबर 2019 को आयकर विभाग ने आंध्र प्रदेश, तमिलनाडु, तेलंगाना और कर्नाटक में कल्कि भगवान और उनके पुत्र कृष्णा से जुड़े 40 से अधिक परिसरों पर, जिनमें वरदैयापालम स्थित संगठन का मुख्यालय भी शामिल है, एक साथ तलाशी शुरू की।
    tier: allegation
    date: 2019-10-16
    source_ids: [kalki-bhagwan-src-02, kalki-bhagwan-src-01]
  - id: kalki-bhagwan-claim-02
    statement_en: The Income Tax department's own release, reported on 18 October 2019, said the searches found evidence of the group regularly suppressing receipts at its centres and ashrams, and gave a preliminary estimate of unaccounted cash receipts of about Rs 409 crore from financial year 2014-15 onward.
    statement_hi: 18 अक्टूबर 2019 को रिपोर्ट किए गए आयकर विभाग के अपने बयान में कहा गया कि तलाशी में यह साक्ष्य मिला कि समूह नियमित रूप से अपने केंद्रों और आश्रमों में प्राप्तियाँ छुपाता रहा है, और वित्त वर्ष 2014-15 से बेहिसाब नकद प्राप्तियों का प्रारंभिक अनुमान लगभग 409 करोड़ रुपये बताया गया।
    tier: allegation
    date: 2019-10-18
    source_ids: [kalki-bhagwan-src-01]
  - id: kalki-bhagwan-claim-03
    statement_en: Income Tax department sources cited by Deccan Herald said the raids recovered about Rs 43.9 crore in Indian currency, foreign currency equivalent to about Rs 18 crore, and roughly 88 kg of gold valued at about Rs 26 crore from premises owned by Kalki Bhagwan and his son.
    statement_hi: डेक्कन हेराल्ड द्वारा उद्धृत आयकर विभाग के सूत्रों के अनुसार छापों में कल्कि भगवान और उनके पुत्र के स्वामित्व वाले परिसरों से लगभग 43.9 करोड़ रुपये भारतीय मुद्रा, लगभग 18 करोड़ रुपये मूल्य की विदेशी मुद्रा और लगभग 88 किलोग्राम सोना, जिसका मूल्य लगभग 26 करोड़ रुपये आँका गया, बरामद हुआ।
    tier: allegation
    date: 2019-10-18
    source_ids: [kalki-bhagwan-src-03]
  - id: kalki-bhagwan-claim-04
    statement_en: Income Tax sources said the searches were prompted by information that Kalki Bhagwan's son Krishna had re-routed funds from the ashram into companies in which he and his associates had made investments in Chennai, and that he had separately been alleged in 2003 to have diverted tax-exempt ashram funds into a Los Angeles real-estate business.
    statement_hi: आयकर सूत्रों के अनुसार यह तलाशी इस जानकारी पर आधारित थी कि कल्कि भगवान के पुत्र कृष्णा ने आश्रम के धन को चेन्नई में उन कंपनियों में स्थानांतरित किया जिनमें उन्होंने और उनके सहयोगियों ने निवेश किया था, और अलग से 2003 में उन पर कर-मुक्त आश्रम निधि को लॉस एंजेलिस की एक रियल एस्टेट व्यवसाय में लगाने का आरोप भी लगाया गया था।
    tier: allegation
    date: 2019-10-18
    source_ids: [kalki-bhagwan-src-02, kalki-bhagwan-src-04]
  - id: kalki-bhagwan-claim-05
    statement_en: Press reports from 2010 described local accusations that Kalki Bhagwan had encroached on forest and private land near the Oneness University campus at Varadaiahpalem and had not followed through on promises to build hospitals, schools and colleges for the area; no court or official record of a case over this was located.
    statement_hi: 2010 की प्रेस रिपोर्टों में स्थानीय आरोप बताए गए थे कि कल्कि भगवान ने वरदैयापालम स्थित वननेस विश्वविद्यालय परिसर के पास वन और निजी भूमि पर अतिक्रमण किया तथा क्षेत्र में अस्पताल, स्कूल और कॉलेज बनाने के वादों को पूरा नहीं किया; इस बारे में किसी मामले का न्यायालयीन या आधिकारिक अभिलेख नहीं मिला।
    tier: allegation
    date: 2010
    source_ids: [kalki-bhagwan-src-04]

