response_from_subject:
  text_en: >
    A statement issued on behalf of the ashram, quoted by Deccan Herald, dismissed "various news
    angles of the I-T raids" as untrue while confirming that the searches took place: "Usually
    for any developing organisation the government keeps track to ensure the functioning is
    under legal terms. It is only on those terms that there has been an investigation in Ekam,
    Nemam and Satyaloka." It added: "Bhagavad Dharma [the ashram] respects our nation's laws and
    if our government finds that any of the activity is not as per the law, then we will abide
    by the government and face it legally."
  text_hi: >
    आश्रम की ओर से जारी एक बयान, जिसे डेक्कन हेराल्ड ने उद्धृत किया, में तलाशी की पुष्टि करते हुए
    "आयकर छापों के विभिन्न समाचार कोणों" को असत्य बताया गया: "किसी भी विकासशील संगठन के लिए सरकार यह
    सुनिश्चित करने के लिए नज़र रखती है कि कामकाज क़ानूनी दायरे में हो। इन्हीं शर्तों पर एकम, नेमम और सत्यलोक में
    जाँच हुई है।" आगे कहा गया: "भगवद् धर्म (आश्रम) हमारे देश के क़ानूनों का सम्मान करता है और यदि हमारी सरकार
    को कोई गतिविधि क़ानून के अनुरूप नहीं लगती, तो हम सरकार का पालन करेंगे और क़ानूनी रूप से उसका सामना करेंगे।"
  source_id: kalki-bhagwan-src-03

