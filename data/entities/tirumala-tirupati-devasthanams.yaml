cases:
  - id: ttd-crime-470-2024-ghee-adulteration
    title_en: State v. A.R. Dairy Food Pvt Ltd and others (Crime No. 470/2024, Tirupati East PS; SIT under W.P.(C) No. 622/2024)
    title_hi: राज्य बनाम ए.आर. डेयरी फूड प्रा. लि. एवं अन्य (अपराध संख्या 470/2024, तिरुपति पूर्व थाना; डब्ल्यू.पी.(सी) 622/2024 के तहत एसआईटी)
    jurisdiction_country: IN
    jurisdiction_region: Andhra Pradesh
    court: Andhra Pradesh High Court, Amaravati (bail matters); Supreme Court of India (SIT constitution); Special Judge for SPE & ACB Cases-cum-II Additional District & Sessions Judge, Nellore (trial)
    case_number: Crime No. 470 of 2024, Tirupati East PS; W.P.(C) No. 622/2024 (Supreme Court, SIT order)
    filed_year: 2024
    case_type: criminal
    statutes: [ "BNS 61(2), 238, 274, 275, 299, 316(5), 318(3), 318(4), 336(3), 340(2), 49 r/w 3(5)", "IPC 109 r/w 34, 120B, 201, 271, 273, 295A, 409, 418, 420, 468, 471", "Food Safety and Standards Act 2006 s.51, s.59", "Prevention of Corruption Act 1988 s.8, s.9, s.10" ]
    status: supplementary chargesheet filed 23 January 2026 against 36 accused in all (A.1-A.36); several accused on bail; trial pending
    tier: charged
    verdict_date:
    sentence_or_remedy:
    appeal_status: Not applicable (pre-trial)
    summary_en: >
      Registered at Tirupati East police station on a complaint dated 25 September 2024 by P. Murali Krishna, TTD's general manager (procurement), after an NDDB CALF Laboratory report of 12 July 2024 found vegetable- and animal-fat adulterants, including lard, in cow ghee tankers supplied by A.R. Dairy Food Pvt Ltd under a 10-lakh-kg tender. On 4 October 2024, in W.P.(C) No. 622/2024, the Supreme Court (Gavai and Viswanathan JJ) replaced the state government's SIT with a five-member team of two CBI officers, two Andhra Pradesh police officers and one FSSAI officer, working under the CBI Director, after telling the parties it would not let the case "be used as a political battleground." Investigation found a wider conspiracy involving Bhole Baba Organic Dairy Milk Pvt Ltd, Sri Vyshnavi Dairy Specialities Pvt Ltd and others, who allegedly used proxy suppliers, fabricated tender and lab documents, mixed refined palm oil and palm kernel oil with chemical additives to mimic ghee, and paid bribes to TTD officials. Four dairy-company officials were arrested on 9 February 2025 and released on bail on 3 July 2025 after an initial chargesheet; a TTD procurement official, R.S.S.V.R. Subrahmanyam, was arrested around late November 2025 and granted bail on 24 March 2026. A supplementary chargesheet dated 23 January 2026 added accused A.16 to A.36, taking the total to 36, including two more TTD officials — the retired procurement GM who had lodged the original complaint, and an aide to a former TTD chairman. The chargesheet's own forensic conclusion was that the adulteration involved vegetable oils and chemical esters rather than the beef tallow first alleged in September 2024. A separate Andhra Pradesh High Court ruling of 12 July 2025 that the CBI Director had unlawfully appointed an additional investigating officer outside the Supreme Court's SIT was stayed by the Supreme Court on 26 September 2025. As of September 2026 the criminal trial had not begun.
    summary_hi: >
      यह मामला तिरुपति पूर्व थाने में टीटीडी के महाप्रबंधक (क्रय) पी. मुरली कृष्ण की 25 सितंबर 2024 की शिकायत पर दर्ज हुआ, जब NDDB CALF प्रयोगशाला की 12 जुलाई 2024 की रिपोर्ट में 10 लाख किलोग्राम के टेंडर के तहत ए.आर. डेयरी फूड प्रा. लि. द्वारा आपूर्ति गाय के घी के टैंकरों में लार्ड सहित वनस्पति और पशु-वसा आधारित मिलावटी तत्व पाए गए। 4 अक्टूबर 2024 को, डब्ल्यू.पी.(सी) संख्या 622/2024 में, सर्वोच्च न्यायालय (न्यायमूर्ति गवई और विश्वनाथन) ने राज्य सरकार की एसआईटी के स्थान पर दो सीबीआई अधिकारियों, दो आंध्र प्रदेश पुलिस अधिकारियों और एक FSSAI अधिकारी की पाँच-सदस्यीय टीम गठित की, यह कहते हुए कि वह मामले को "राजनीतिक युद्धक्षेत्र" नहीं बनने देगा। जांच में बंधे बाबा ऑर्गेनिक डेयरी मिल्क प्रा. लि., श्री वैष्णवी डेयरी स्पेशलिटीज़ प्रा. लि. और अन्य से जुड़ी व्यापक साज़िश सामने आई, जिसमें कथित तौर पर प्रॉक्सी आपूर्तिकर्ताओं का इस्तेमाल, टेंडर व प्रयोगशाला दस्तावेज़ों में जालसाज़ी, घी जैसा दिखाने के लिए रिफाइंड पाम तेल व पाम कर्नेल तेल में रासायनिक योज्य मिलाना, और टीटीडी अधिकारियों को रिश्वत देना शामिल था। चार डेयरी कंपनी अधिकारियों को 9 फरवरी 2025 को गिरफ्तार किया गया और प्रारंभिक आरोप-पत्र के बाद 3 जुलाई 2025 को ज़मानत मिली; टीटीडी के क्रय अधिकारी आर.एस.एस.वी.आर. सुब्रह्मण्यम को नवंबर 2025 के अंत में गिरफ्तार किया गया और 24 मार्च 2026 को ज़मानत मिली। 23 जनवरी 2026 के एक पूरक आरोप-पत्र ने आरोपी A.16 से A.36 तक जोड़े, जिससे कुल संख्या 36 हो गई, जिनमें दो और टीटीडी अधिकारी शामिल हैं — मूल शिकायत दर्ज कराने वाला सेवानिवृत्त क्रय महाप्रबंधक, और एक पूर्व टीटीडी अध्यक्ष का सहयोगी। आरोप-पत्र के अपने फोरेंसिक निष्कर्ष के अनुसार मिलावट वनस्पति तेलों और रासायनिक एस्टरों से हुई, न कि सितंबर 2024 में पहले आरोपित गोमांस की चर्बी से। एक अलग मामले में, आंध्र प्रदेश उच्च न्यायालय के 12 जुलाई 2025 के इस निर्णय को कि सीबीआई निदेशक ने सर्वोच्च न्यायालय की एसआईटी से बाहर एक अतिरिक्त जांच अधिकारी अवैध रूप से नियुक्त किया था, सर्वोच्च न्यायालय ने 26 सितंबर 2025 को स्थगित कर दिया। सितंबर 2026 तक आपराधिक मुक़दमा शुरू नहीं हुआ था।
