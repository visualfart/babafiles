  - id: ttd-ghee-ed-pmla-2026
    title_en: Enforcement Directorate PMLA investigation, TTD ghee adulteration
    title_hi: प्रवर्तन निदेशालय की PMLA जांच, टीटीडी घी मिलावट
    jurisdiction_country: IN
    jurisdiction_region: Andhra Pradesh
    court: Directorate of Enforcement, Hyderabad Zonal Office
    case_number: ECIR not on record
    filed_year: 2026
    case_type: criminal
    statutes: [ PMLA 2002 ]
    status: investigation in progress; searches conducted 3 June 2026; no PMLA complaint filed as of September 2026
    tier: under_investigation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >
      The Enforcement Directorate opened a money-laundering investigation on the basis of the same FIR (Crime No. 470/2024) registered against A.R. Dairy Food Pvt Ltd and others. On 3 June 2026 its Hyderabad Zonal Office searched 15 locations across Maharashtra, Rajasthan, Uttarakhand, Tamil Nadu, Andhra Pradesh and Delhi, covering the residences, offices and dairy plants of the accused, seized Rs 60 lakh in cash, and reported finding more than Rs 45 crore of proceeds of crime invested in immovable property through a network of shell entities. No PMLA complaint (the ED's equivalent of a chargesheet) had been filed as of September 2026; the ED said further investigation was in progress.
    summary_hi: >
      प्रवर्तन निदेशालय ने ए.आर. डेयरी फूड प्रा. लि. एवं अन्य के विरुद्ध दर्ज उसी एफआईआर (अपराध संख्या 470/2024) के आधार पर धन-शोधन जांच शुरू की। 3 जून 2026 को इसके हैदराबाद क्षेत्रीय कार्यालय ने महाराष्ट्र, राजस्थान, उत्तराखंड, तमिलनाडु, आंध्र प्रदेश और दिल्ली में 15 ठिकानों पर तलाशी ली, जिसमें आरोपियों के आवास, कार्यालय और डेयरी संयंत्र शामिल थे, 60 लाख रुपये नकद ज़ब्त किए, और शेल कंपनियों के जाल के माध्यम से अचल संपत्ति में निवेशित 45 करोड़ रुपये से अधिक के अपराध की आय पाए जाने की सूचना दी। सितंबर 2026 तक कोई PMLA परिवाद (ईडी का आरोप-पत्र के समकक्ष) दाखिल नहीं हुआ था; ईडी ने कहा कि आगे की जांच जारी है।
    source_ids: [ ttd-src-02, ttd-src-03, ttd-src-27, ttd-src-28 ]

claims:
  - id: ttd-claim-01
    statement_en: >
      On 18-20 September 2024 Andhra Pradesh chief minister N. Chandrababu Naidu publicly alleged, citing a report from the NDDB's CALF laboratory in Anand, Gujarat, that ghee used in TTD's Tirumala laddus under the previous YSR Congress Party government contained animal fat, including beef tallow and lard.
    statement_hi: >
      18-20 सितंबर 2024 को आंध्र प्रदेश के मुख्यमंत्री एन. चंद्रबाबू नायडू ने NDDB की गुजरात के आणंद स्थित CALF प्रयोगशाला की एक रिपोर्ट का हवाला देते हुए सार्वजनिक रूप से आरोप लगाया कि पिछली वाईएसआर कांग्रेस सरकार के दौरान टीटीडी के तिरुमला लड्डुओं में इस्तेमाल घी में पशु-वसा, जिसमें गोमांस की चर्बी और लार्ड शामिल हैं, पाई गई।
    tier: allegation
    date: 2024-09-20
    source_ids: [ ttd-src-10, ttd-src-11, ttd-src-16 ]
  - id: ttd-claim-02
    case_id: ttd-crime-470-2024-ghee-adulteration
    statement_en: >
      The NDDB CALF Laboratory's report, dated 12 July 2024, on samples from ghee tankers supplied to TTD by A.R. Dairy Food Pvt Ltd in June-July 2024, found the S-value substantially below the standard limit and, per the laboratory's finding as recorded in Andhra Pradesh High Court orders, the presence of vegetable- and animal-fat-based adulterants including lard.
    statement_hi: >
      NDDB CALF प्रयोगशाला की 12 जुलाई 2024 की रिपोर्ट, जो जून-जुलाई 2024 में ए.आर. डेयरी फूड प्रा. लि. द्वारा टीटीडी को आपूर्ति घी के टैंकरों के नमूनों पर थी, में S-मान मानक सीमा से काफी कम पाया गया और, आंध्र प्रदेश उच्च न्यायालय के आदेशों में दर्ज प्रयोगशाला के निष्कर्ष के अनुसार, लार्ड सहित वनस्पति और पशु-वसा आधारित मिलावटी तत्व पाए गए।
    tier: under_investigation
    date: 2024-07-12
    source_ids: [ ttd-src-02, ttd-src-03, ttd-src-10 ]
  - id: ttd-claim-03
    statement_en: >
      On 20 September 2024 TTD's Executive Officer J. Syamala Rao announced that ghee samples from A.R. Dairy Food Pvt Ltd had failed quality tests and that the board was blacklisting the supplier; the Food Safety and Standards Authority of India issued the supplier a show-cause notice on 23 September 2024 after finding all four samples substandard.
    statement_hi: >
      20 सितंबर 2024 को टीटीडी के कार्यपालक अधिकारी जे. श्यामला राव ने घोषणा की कि ए.आर. डेयरी फूड प्रा. लि. के घी के नमूने गुणवत्ता परीक्षण में विफल रहे और बोर्ड आपूर्तिकर्ता को काली सूची में डाल रहा है; भारतीय खाद्य सुरक्षा एवं मानक प्राधिकरण (FSSAI) ने सभी चार नमूने अमानक पाए जाने के बाद 23 सितंबर 2024 को आपूर्तिकर्ता को कारण बताओ नोटिस जारी किया।
    tier: regulatory_action
    date: 2024-09-20
    source_ids: [ ttd-src-06, ttd-src-19, ttd-src-18 ]
  - id: ttd-claim-04
    case_id: ttd-crime-470-2024-ghee-adulteration
    statement_en: >
      On 25 September 2024 TTD's general manager (procurement) P. Murali Krishna lodged a complaint at Tirupati East police station, registered as Crime No. 470 of 2024 against A.R. Dairy Food Pvt Ltd and others for cheating, criminal breach of trust and offences under sections 51 and 59 of the Food Safety and Standards Act, 2006.
    statement_hi: >
      25 सितंबर 2024 को टीटीडी के महाप्रबंधक (क्रय) पी. मुरली कृष्ण ने तिरुपति पूर्व थाने में शिकायत दर्ज कराई, जो ए.आर. डेयरी फूड प्रा. लि. एवं अन्य के विरुद्ध धोखाधड़ी, आपराधिक विश्वासघात और खाद्य सुरक्षा एवं मानक अधिनियम, 2006 की धारा 51 और 59 के तहत अपराध संख्या 470/2024 के रूप में दर्ज हुई।
    tier: under_investigation
    date: 2024-09-25
    source_ids: [ ttd-src-02, ttd-src-03, ttd-src-18 ]
  - id: ttd-claim-05
    case_id: ttd-crime-470-2024-ghee-adulteration
    statement_en: >
      On 1 October 2024, hearing petitions on the ghee-adulteration allegations, the Supreme Court (Gavai and Viswanathan JJ) said "we expect the gods to be kept away from politics" and asked why the chief minister had gone to the press after ordering an investigation of his own; on 4 October 2024, in W.P.(C) No. 622/2024, the same bench recorded that it "would not permit the Court to be used as a political battleground" and replaced the state government's SIT with a five-member team of two CBI officers, two Andhra Pradesh police officers and one FSSAI officer, working under the supervision of the CBI Director.
    statement_hi: >
      1 अक्टूबर 2024 को घी मिलावट के आरोपों से जुड़ी याचिकाओं की सुनवाई करते हुए सर्वोच्च न्यायालय (न्यायमूर्ति गवई और विश्वनाथन) ने कहा "हम कम से कम यह अपेक्षा करते हैं कि भगवान को राजनीति से दूर रखा जाए" और पूछा कि मुख्यमंत्री ने स्वयं जांच का आदेश देने के बाद प्रेस के पास जाने की क्या आवश्यकता थी; 4 अक्टूबर 2024 को, डब्ल्यू.पी.(सी) संख्या 622/2024 में, उसी पीठ ने दर्ज किया कि वह "न्यायालय को राजनीतिक युद्धक्षेत्र नहीं बनने देगी" और राज्य सरकार की एसआईटी के स्थान पर दो सीबीआई अधिकारियों, दो आंध्र प्रदेश पुलिस अधिकारियों और एक FSSAI अधिकारी की पाँच-सदस्यीय टीम गठित की, जो सीबीआई निदेशक की निगरानी में कार्य करेगी।
    tier: under_investigation
    date: 2024-10-04
    source_ids: [ ttd-src-01, ttd-src-08, ttd-src-13, ttd-src-14, ttd-src-15 ]
  - id: ttd-claim-06
    case_id: ttd-crime-470-2024-ghee-adulteration
    statement_en: >
      On 9 February 2025 the CBI-led SIT arrested four dairy-company officials — Vipin Jain and Pomil Jain, directors of Bhole Baba Organic Dairy Milk Pvt Ltd; Apoorva Vinaykanth Chawda, CEO of Sri Vyshnavi Dairy Specialities Pvt Ltd; and Raju Rajasekaran, Managing Director of A.R. Dairy Food Pvt Ltd — who were remanded to judicial custody.
    statement_hi: >
      9 फरवरी 2025 को सीबीआई-नेतृत्व वाली एसआईटी ने चार डेयरी कंपनी अधिकारियों को गिरफ्तार किया — विपिन जैन और पोमिल जैन, बंधे बाबा ऑर्गेनिक डेयरी मिल्क प्रा. लि. के निदेशक; अपूर्वा विनयकांत चावड़ा, श्री वैष्णवी डेयरी स्पेशलिटीज़ प्रा. लि. की सीईओ; और राजू राजशेखरन, ए.आर. डेयरी फूड प्रा. लि. के प्रबंध निदेशक — जिन्हें न्यायिक हिरासत में भेजा गया।
    tier: under_investigation
    date: 2025-02-09
    source_ids: [ ttd-src-02, ttd-src-03 ]
  - id: ttd-claim-07
    case_id: ttd-crime-470-2024-ghee-adulteration
    statement_en: >
      On 3 July 2025 the Andhra Pradesh High Court (Justice K. Sreenivasa Reddy) granted bail to three of the four accused on personal bonds of Rs 25,000 each with two sureties, noting they had been in judicial custody for more than four-and-a-half months, had cooperated with the investigation, and that the SIT had already filed a chargesheet.
    statement_hi: >
      3 जुलाई 2025 को आंध्र प्रदेश उच्च न्यायालय (न्यायमूर्ति के. श्रीनिवास रेड्डी) ने चार में से तीन आरोपियों को प्रत्येक 25,000 रुपये के व्यक्तिगत बॉन्ड और दो-दो ज़मानतदारों पर ज़मानत दी, यह दर्ज करते हुए कि वे साढ़े चार महीने से अधिक समय से न्यायिक हिरासत में थे, जांच में सहयोग किया, और एसआईटी पहले ही आरोप-पत्र दाखिल कर चुकी थी।
    tier: charged
    date: 2025-07-03
    source_ids: [ ttd-src-03 ]
  - id: ttd-claim-08
    case_id: ttd-crime-470-2024-ghee-adulteration
    statement_en: >
      TTD's General Manager (Procurement) R.S.S.V.R. Subrahmanyam, who had headed procurement in 2017-18 and 2020-23, was arrested and taken into judicial custody by 27 November 2025 on allegations of accepting bribes for favourable plant-inspection reports for the dairy suppliers; press reports at the time gave the arrest date as around 9 December 2025, some days after the High Court's later bail order records his custody as having begun.
    statement_hi: >
      टीटीडी के महाप्रबंधक (क्रय) आर.एस.एस.वी.आर. सुब्रह्मण्यम, जिन्होंने 2017-18 और 2020-23 में क्रय विभाग का नेतृत्व किया था, को डेयरी आपूर्तिकर्ताओं के लिए अनुकूल संयंत्र-निरीक्षण रिपोर्ट देने के बदले रिश्वत लेने के आरोप में 27 नवंबर 2025 तक गिरफ्तार कर न्यायिक हिरासत में भेजा गया; उस समय के प्रेस रिपोर्टों में गिरफ्तारी की तारीख लगभग 9 दिसंबर 2025 बताई गई, जो उच्च न्यायालय के बाद के ज़मानत आदेश में दर्ज हिरासत आरंभ की तारीख से कुछ दिन बाद है।
    tier: under_investigation
    date: 2025-11-27
    source_ids: [ ttd-src-04, ttd-src-26 ]
  - id: ttd-claim-09
    case_id: ttd-crime-470-2024-ghee-adulteration
    statement_en: >
      A supplementary chargesheet dated 23 January 2026 was filed before the Special Judge for SPE & ACB Cases-cum-II Additional District & Sessions Judge, Nellore, adding accused A.16 to A.36 and bringing the total to 36 accused, including three TTD officials — among them the retired procurement GM who had lodged the original 2024 complaint and an aide to a former TTD chairman — dairy-company directors, and a Delhi-based trader, over an alleged five years and roughly Rs 250 crore of adulterated ghee.
    statement_hi: >
      23 जनवरी 2026 का एक पूरक आरोप-पत्र नेल्लोर के विशेष न्यायाधीश (एसपीई एवं एसीबी मामले)-सह- द्वितीय अतिरिक्त ज़िला एवं सत्र न्यायाधीश की अदालत में दाखिल हुआ, जिसमें आरोपी A.16 से A.36 तक जोड़े गए और कुल संख्या 36 हो गई, जिनमें तीन टीटीडी अधिकारी — जिनमें 2024 की मूल शिकायत दर्ज कराने वाला सेवानिवृत्त क्रय महाप्रबंधक और एक पूर्व टीटीडी अध्यक्ष का सहयोगी शामिल हैं — डेयरी कंपनी निदेशक, और दिल्ली का एक व्यापारी शामिल हैं, जो कथित तौर पर लगभग पाँच वर्षों और करीब 250 करोड़ रुपये के मिलावटी घी से जुड़ा है।
    tier: charged
    date: 2026-01-23
    source_ids: [ ttd-src-04, ttd-src-22, ttd-src-23, ttd-src-24 ]
  - id: ttd-claim-10
    case_id: ttd-crime-470-2024-ghee-adulteration
    statement_en: >
      The chargesheet's own forensic conclusion, as reported by The Wire, was that the low S-values were caused by adulteration with refined palm oil, palm kernel oil, palmolein and chemical esters such as beta-carotene and acetic-acid esters used to mimic ghee, rather than by the beef tallow originally alleged by the chief minister in September 2024.
    statement_hi: >
      द वायर की रिपोर्ट के अनुसार, आरोप-पत्र के अपने फोरेंसिक निष्कर्ष के अनुसार कम S-मान का कारण रिफाइंड पाम तेल, पाम कर्नेल तेल, पामोलीन और घी जैसा दिखाने के लिए इस्तेमाल बीटा-कैरोटीन तथा एसिटिक-एसिड एस्टर जैसे रासायनिक तत्वों से मिलावट थी, न कि सितंबर 2024 में मुख्यमंत्री द्वारा शुरू में आरोपित गोमांस की चर्बी।
    tier: charged
    date: 2026-01-23
    source_ids: [ ttd-src-12, ttd-src-03 ]
  - id: ttd-claim-11
    case_id: ttd-ghee-ed-pmla-2026
    statement_en: >
      On 3 June 2026 the Enforcement Directorate's Hyderabad Zonal Office searched 15 locations in Maharashtra, Rajasthan, Uttarakhand, Tamil Nadu, Andhra Pradesh and Delhi under the PMLA, seized Rs 60 lakh in cash, and reported finding more than Rs 45 crore in proceeds of crime invested in immovable property through a network of interconnected entities.
    statement_hi: >
      3 जून 2026 को प्रवर्तन निदेशालय के हैदराबाद क्षेत्रीय कार्यालय ने महाराष्ट्र, राजस्थान, उत्तराखंड, तमिलनाडु, आंध्र प्रदेश और दिल्ली में PMLA के तहत 15 ठिकानों पर तलाशी ली, 60 लाख रुपये नकद ज़ब्त किए, और परस्पर जुड़ी संस्थाओं के जाल के माध्यम से अचल संपत्ति में निवेशित 45 करोड़ रुपये से अधिक के अपराध की आय पाए जाने की सूचना दी।
    tier: under_investigation
    date: 2026-06-03
    source_ids: [ ttd-src-27, ttd-src-28, ttd-src-02 ]
  - id: ttd-claim-12
    statement_en: >
      TTD chairman B.R. Naidu told a press conference on 30 January 2026 that claims the accused had received a "clean chit" were "false propaganda" and "completely untrue," and that the SIT chargesheet had "clearly established that adulterated ghee was used in the preparation of Tirumala Srivari laddus."
    statement_hi: >
      टीटीडी अध्यक्ष बी.आर. नायडू ने 30 जनवरी 2026 को एक प्रेस वार्ता में कहा कि आरोपियों को "क्लीन चिट" मिलने के दावे "झूठा प्रचार" और "पूरी तरह असत्य" हैं, और एसआईटी के आरोप-पत्र ने "स्पष्ट रूप से स्थापित कर दिया है कि तिरुमला के श्रीवारी लड्डुओं की तैयारी में मिलावटी घी इस्तेमाल हुआ।"
    tier: charged
    date: 2026-01-30
    source_ids: [ ttd-src-25, ttd-src-04 ]

