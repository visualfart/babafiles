summary_en: >
  Tirumala Tirupati Devasthanams (TTD) is the statutory trust that administers the Sri Venkateswara Temple at Tirumala and the laddu prasadam distributed to its devotees. In September 2024 Andhra Pradesh chief minister N. Chandrababu Naidu publicly alleged, citing a report from the NDDB's CALF laboratory in Anand, Gujarat, that ghee used in the laddus under the previous YSR Congress Party government contained animal fat, including tallow and lard; the report had found abnormally low S-values in ghee tankers supplied by A.R. Dairy Food Pvt Ltd in June-July 2024. TTD blacklisted the supplier, and on 25 September 2024 its general manager (procurement) lodged a complaint at Tirupati East police station, registered as Crime No. 470 of 2024 for cheating, criminal breach of trust and offences under the Food Safety and Standards Act, 2006. On 1 October 2024 the Supreme Court told the chief minister it expected "the gods to be kept away from politics"; on 4 October 2024, in W.P.(C) No. 622/2024 (Dr Subramanian Swamy v. State of Andhra Pradesh), it replaced the state's own SIT with a five-member team of two CBI officers, two Andhra Pradesh police officers and one FSSAI officer, working under the CBI Director's supervision. The SIT arrested four dairy-company officials on 9 February 2025 and a TTD procurement official on 27 November 2025; three of the four were granted bail on 3 July 2025 after an initial chargesheet, and the TTD official was granted bail on 24 March 2026. A supplementary chargesheet dated 23 January 2026 extended the case to 36 accused in all, including three TTD officials (among them the same official who had lodged the original 2024 complaint), dairy-company directors and a Delhi-based trader, over roughly five years and about Rs 250 crore of ghee; the chargesheet's own forensic finding was adulteration with vegetable oils and chemical esters rather than the beef tallow first alleged. The Enforcement Directorate opened a money-laundering case on the same FIR and on 3 June 2026 searched 15 locations in six states, seizing Rs 60 lakh in cash and identifying more than Rs 45 crore invested in property. TTD chairman B.R. Naidu said in January 2026 that claims of a "clean chit" were false propaganda and that the chargesheet had established the adulteration. As of September 2026 the criminal trial had not begun and the ED's investigation was continuing.
summary_hi: >
  तिरुमला तिरुपति देवस्थानम् (टीटीडी) वह वैधानिक न्यास है जो तिरुमला के श्री वेंकटेश्वर मंदिर और भक्तों को दिए जाने वाले लड्डू प्रसादम का प्रबंधन करता है। सितंबर 2024 में आंध्र प्रदेश के मुख्यमंत्री एन. चंद्रबाबू नायडू ने NDDB की गुजरात के आणंद स्थित CALF प्रयोगशाला की एक रिपोर्ट का हवाला देते हुए सार्वजनिक रूप से आरोप लगाया कि पिछली वाईएसआर कांग्रेस सरकार के दौरान लड्डुओं में इस्तेमाल घी में पशु-वसा, जिसमें चर्बी (टैलो) और लार्ड शामिल हैं, पाई गई; रिपोर्ट में जून-जुलाई 2024 में ए.आर. डेयरी फूड प्रा. लि. द्वारा आपूर्ति किए गए टैंकरों के घी में असामान्य रूप से कम S-मान पाए गए थे। टीटीडी ने आपूर्तिकर्ता को काली सूची में डाला, और 25 सितंबर 2024 को उसके महाप्रबंधक (क्रय) ने तिरुपति पूर्व थाने में शिकायत दर्ज कराई, जो धोखाधड़ी, आपराधिक विश्वासघात और खाद्य सुरक्षा एवं मानक अधिनियम, 2006 के तहत अपराध संख्या 470/2024 के रूप में दर्ज हुई। 1 अक्टूबर 2024 को सर्वोच्च न्यायालय ने मुख्यमंत्री से कहा कि वह "भगवान को राजनीति से दूर रखने" की अपेक्षा करता है; 4 अक्टूबर 2024 को, डब्ल्यू.पी.(सी) संख्या 622/2024 (डॉ. सुब्रमण्यम स्वामी बनाम आंध्र प्रदेश राज्य) में, न्यायालय ने राज्य की अपनी एसआईटी के स्थान पर दो सीबीआई अधिकारियों, दो आंध्र प्रदेश पुलिस अधिकारियों और एक FSSAI अधिकारी की पाँच-सदस्यीय टीम गठित की, जो सीबीआई निदेशक की निगरानी में कार्य करेगी। एसआईटी ने 9 फरवरी 2025 को चार डेयरी कंपनी अधिकारियों को और 27 नवंबर 2025 को टीटीडी के एक क्रय अधिकारी को गिरफ्तार किया; चार में से तीन को प्रारंभिक आरोप-पत्र दाखिल होने के बाद 3 जुलाई 2025 को ज़मानत मिली, और टीटीडी अधिकारी को 24 मार्च 2026 को ज़मानत मिली। 23 जनवरी 2026 के एक पूरक आरोप-पत्र ने मामले को कुल 36 आरोपियों तक बढ़ाया, जिनमें तीन टीटीडी अधिकारी (जिनमें वही अधिकारी भी शामिल है जिसने 2024 की मूल शिकायत दर्ज कराई थी), डेयरी कंपनी निदेशक और दिल्ली का एक व्यापारी शामिल हैं, और यह लगभग पाँच वर्षों तथा करीब 250 करोड़ रुपये के घी से जुड़ा है; आरोप-पत्र के अपने फोरेंसिक निष्कर्ष के अनुसार मिलावट वनस्पति तेलों और रासायनिक एस्टरों से हुई थी, न कि शुरू में आरोपित गोमांस की चर्बी से। प्रवर्तन निदेशालय ने उसी एफआईआर पर धन-शोधन का मामला दर्ज किया और 3 जून 2026 को छह राज्यों के 15 ठिकानों पर तलाशी ली, 60 लाख रुपये नकद ज़ब्त किए और 45 करोड़ रुपये से अधिक की संपत्ति में निवेश की पहचान की। टीटीडी अध्यक्ष बी.आर. नायडू ने जनवरी 2026 में कहा कि "क्लीन चिट" के दावे झूठा प्रचार हैं और आरोप-पत्र ने मिलावट को स्थापित कर दिया है। सितंबर 2026 तक आपराधिक मुक़दमा शुरू नहीं हुआ था और ईडी की जांच जारी थी।
hi_reviewed: false
response_from_subject:
  text_en: >
    TTD itself set the case in motion: after its executive officer announced on 20 September 2024 that ghee samples had failed quality tests, the board blacklisted A.R. Dairy Food Pvt Ltd and, five days later, its general manager (procurement) filed the police complaint that became Crime No. 470/2024. On 23 September 2024 priests and officials performed a four-hour purification ritual, "Shanti Homam Panchagavya Prokshana," at Tirumala, including in the kitchens where the laddus and free meals are prepared. After the supplementary chargesheet of January 2026, TTD chairman B.R. Naidu told a press conference on 30 January 2026 that claims of a "clean chit" for the accused were "false propaganda" and "completely untrue," that the SIT chargesheet had "clearly established that adulterated ghee was used in the preparation of Tirumala Srivari laddus," that about 60 lakh kg of ghee worth roughly Rs 250 crore and used in about 20 crore laddus was involved, and that some suppliers had been awarded contracts despite owning no cows or having genuine production capacity; he called for micro-DNA testing and a fuller financial investigation into the accused's bank transactions.
  text_hi: >
    टीटीडी ने ही मामले को गति दी: 20 सितंबर 2024 को कार्यपालक अधिकारी द्वारा घी के नमूनों के गुणवत्ता परीक्षण में विफल होने की घोषणा के बाद, बोर्ड ने ए.आर. डेयरी फूड प्रा. लि. को काली सूची में डाला और पाँच दिन बाद उसके महाप्रबंधक (क्रय) ने वह पुलिस शिकायत दर्ज कराई जो अपराध संख्या 470/2024 बनी। 23 सितंबर 2024 को पुजारियों और अधिकारियों ने तिरुमला में, लड्डू और अन्नप्रसादम बनने वाली रसोई सहित, चार घंटे का शुद्धिकरण अनुष्ठान "शांति होमम पंचगव्य प्रोक्षण" संपन्न किया। जनवरी 2026 के पूरक आरोप-पत्र के बाद, टीटीडी अध्यक्ष बी.आर. नायडू ने 30 जनवरी 2026 को एक प्रेस वार्ता में कहा कि आरोपियों को "क्लीन चिट" मिलने के दावे "झूठा प्रचार" और "पूरी तरह असत्य" हैं, कि एसआईटी के आरोप-पत्र ने "स्पष्ट रूप से स्थापित कर दिया है कि तिरुमला के श्रीवारी लड्डुओं की तैयारी में मिलावटी घी इस्तेमाल हुआ," कि लगभग 60 लाख किलोग्राम, करीब 250 करोड़ रुपये मूल्य का घी लगभग 20 करोड़ लड्डुओं में इस्तेमाल हुआ, और कुछ आपूर्तिकर्ताओं को बिना एक भी गाय या वास्तविक उत्पादन क्षमता के ठेके दिए गए; उन्होंने माइक्रो-डीएनए जांच और आरोपियों के बैंक लेन-देन की व्यापक वित्तीय जांच की माँग की।
  source_id: ttd-src-25

