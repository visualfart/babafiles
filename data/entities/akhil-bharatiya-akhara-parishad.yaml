name_en: Akhil Bharatiya Akhara Parishad
name_hi: अखिल भारतीय अखाड़ा परिषद
aliases: [ABAP, Akhara Parishad]
country: IN
countries_of_operation: [IN]
summary_en: >
  The Akhil Bharatiya Akhara Parishad is an apex council of the Hindu monastic akharas that
  trace their lineage to the eighth-century philosopher Adi Shankara. On 10 September 2017,
  days after a CBI court convicted Dera Sacha Sauda chief Gurmeet Ram Rahim Singh of rape, the
  Parishad's then president, Swami Narendra Giri, released a list of 14 people it described as
  "fake babas" and called for legislation against "rootless cult leaders"; the list included
  Gurmeet Ram Rahim Singh, Asaram, Asaram's son Narayan Sai and Rampal. The Parishad released a
  second, expanded list of self-styled godmen later in December 2017. This entry is a stub for
  other entities' relationship records and carries no claims of its own.
summary_hi: >
  अखिल भारतीय अखाड़ा परिषद हिंदू मठवासी अखाड़ों की एक शीर्ष परिषद है, जो अपनी परंपरा आठवीं सदी के
  दार्शनिक आदि शंकराचार्य से जोड़ते हैं। 10 सितंबर 2017 को, डेरा सच्चा सौदा प्रमुख गुरमीत राम रहीम
  सिंह को सीबीआई अदालत द्वारा बलात्कार का दोषी ठहराए जाने के कुछ ही दिनों बाद, परिषद के तत्कालीन
  अध्यक्ष स्वामी नरेंद्र गिरि ने 14 लोगों की एक सूची जारी की जिन्हें उन्होंने "फर्जी बाबा" बताया और
  "जड़विहीन पंथ नेताओं" के विरुद्ध कानून बनाने की मांग की; इस सूची में गुरमीत राम रहीम सिंह, आसाराम,
  आसाराम के पुत्र नारायण साईं और रामपाल शामिल थे। परिषद ने दिसंबर 2017 के अंत में स्वयंभू गुरुओं की एक
  दूसरी, विस्तृत सूची जारी की। यह प्रविष्टि अन्य प्रविष्टियों के संबंध-अभिलेखों के लिए एक स्टब है और
  इसका अपना कोई दावा (claim) नहीं है।
