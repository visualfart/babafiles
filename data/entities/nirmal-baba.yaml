cases:
  - id: nirmal-baba-bihar-muzaffarpur-2012
    title_en: Nirmaljit Singh Narula @ Nirmal Baba v. State of Bihar (Muzaffarpur complaint case)
    title_hi: निर्मलजीत सिंह नारुला उर्फ़ निर्मल बाबा बनाम बिहार राज्य (मुज़फ़्फ़रपुर परिवाद मामला)
    jurisdiction_country: IN
    jurisdiction_region: Bihar
    court: Patna High Court; Judicial Magistrate 1st Class, Muzaffarpur (trial court)
    case_number: Criminal Miscellaneous No. 32693 of 2013 (High Court); Complaint Case No. 955 of 2012 (trial court)
    filed_year: 2012
    case_type: criminal
    statutes: [IPC 417, IPC 298]
    status: quashed
    tier: closed
    verdict_date: 2017-06-22
    sentence_or_remedy: Order of cognizance and further proceedings quashed
    appeal_status: Not applicable
    summary_en: >
      A private complaint filed by one Sudhir Kumar Ojha in Muzaffarpur led a Judicial
      Magistrate to take cognizance on 9 July 2013 against Nirmal Baba under IPC sections 417
      (cheating) and 298 (deliberately hurting religious feelings) over his "samagam" preaching.
      Nirmal Baba sought quashing before the Patna High Court, which on 22 June 2017 held there
      was no material to take cognizance even taking the allegations at face value, and quashed
      the cognizance order and the further criminal proceeding.
    summary_hi: >
      मुज़फ़्फ़रपुर में सुधीर कुमार ओझा नामक व्यक्ति द्वारा दायर एक निजी परिवाद पर 9 जुलाई 2013 को एक न्यायिक
      मजिस्ट्रेट ने निर्मल बाबा के विरुद्ध उनके "समागम" प्रवचनों को लेकर आईपीसी की धारा 417 (धोखाधड़ी) और 298
      (धार्मिक भावनाओं को जान-बूझकर ठेस पहुँचाना) के तहत संज्ञान लिया। निर्मल बाबा ने पटना उच्च न्यायालय में
      कार्यवाही रद्द कराने की याचिका दायर की, जिस पर न्यायालय ने 22 जून 2017 को यह कहते हुए कि आरोपों को
      सही मानने पर भी संज्ञान लेने लायक कोई सामग्री नहीं है, संज्ञान आदेश और आगे की आपराधिक कार्यवाही रद्द कर दी।
    source_ids: [nirmal-baba-src-01]

claims:
  - id: nirmal-baba-claim-01
    case_id: nirmal-baba-bihar-muzaffarpur-2012
    statement_en: On 22 June 2017 the Patna High Court (Arun Kumar J) quashed the order of cognizance dated 9 July 2013 of the Judicial Magistrate 1st Class, Muzaffarpur, and the further criminal proceedings against Nirmal Baba under IPC sections 417 and 298 in Complaint Case No. 955 of 2012, holding there was no material to sustain the charge.
    statement_hi: 22 जून 2017 को पटना उच्च न्यायालय (न्यायमूर्ति अरुण कुमार) ने मुज़फ़्फ़रपुर के न्यायिक मजिस्ट्रेट प्रथम श्रेणी के 9 जुलाई 2013 के संज्ञान आदेश और परिवाद मामला संख्या 955/2012 में निर्मल बाबा के विरुद्ध आईपीसी धारा 417 और 298 के तहत चल रही आगे की आपराधिक कार्यवाही को यह कहते हुए रद्द कर दिया कि आरोप को बनाए रखने लायक कोई सामग्री नहीं है।
    tier: closed
    date: 2017-06-22
    source_ids: [nirmal-baba-src-01]
  - id: nirmal-baba-claim-02
    statement_en: An FIR accusing Nirmal Baba of cheating was registered in Bihar around 22 April 2012, and police sought a warrant for his arrest; press reports at the time said he had been booked in similar cheating and forgery cases in several states.
    statement_hi: 22 अप्रैल 2012 के आसपास बिहार में निर्मल बाबा के विरुद्ध धोखाधड़ी की एक प्राथमिकी दर्ज की गई और पुलिस ने उनकी गिरफ़्तारी के लिए वारंट की माँग की; उस समय की प्रेस रिपोर्टों के अनुसार उनके विरुद्ध कई राज्यों में इसी तरह के धोखाधड़ी और जालसाज़ी के मामले दर्ज थे।
    tier: allegation
    date: 2012-04-22
    source_ids: [nirmal-baba-src-03]
  - id: nirmal-baba-claim-03
    statement_en: On 9 May 2012 the Chief Judicial Magistrate, Lucknow, directed Gomti Nagar police station to register a criminal case against Nirmal Baba on a complaint that his paid "samagam" solutions amounted to cheating and promoted superstition; the case's later outcome could not be independently verified.
    statement_hi: 9 मई 2012 को लखनऊ के मुख्य न्यायिक मजिस्ट्रेट ने गोमती नगर थाने को निर्मल बाबा के विरुद्ध इस शिकायत पर मामला दर्ज करने का निर्देश दिया कि उनके सशुल्क "समागम" समाधान धोखाधड़ी और अंधविश्वास फैलाने के समान हैं; इस मामले का बाद का परिणाम स्वतंत्र रूप से सत्यापित नहीं किया जा सका।
    tier: allegation
    date: 2012-05-09
    source_ids: [nirmal-baba-src-02]
  - id: nirmal-baba-claim-04
    statement_en: The Directorate General of Central Excise Intelligence raised a service-tax demand of about Rs 3.58 crore against Nirmal Baba from July 2012 over "Daswand" donations, in addition to an already-collected demand of about Rs 3.08 crore plus Rs 80 lakh interest on entry fees to his "Samagam" events; he was reported to be contesting the further demand.
    statement_hi: केंद्रीय उत्पाद शुल्क आसूचना महानिदेशालय ने जुलाई 2012 से "दसवंध" दान पर निर्मल बाबा के विरुद्ध लगभग 3.58 करोड़ रुपये की सेवा कर माँग उठाई, इसके अतिरिक्त उनके "समागम" कार्यक्रमों की प्रवेश फीस पर पहले से वसूली गई लगभग 3.08 करोड़ रुपये और 80 लाख रुपये ब्याज की माँग भी थी; रिपोर्टों के अनुसार वे आगे की माँग को चुनौती दे रहे थे।
    tier: allegation
    date: 2014-02-23
    source_ids: [nirmal-baba-src-04]
  - id: nirmal-baba-claim-05
    statement_en: On 10 September 2017 the Akhil Bharatiya Akhara Parishad released a list of 14 religious figures it called on governments to act against, and Nirmal Baba was among the names.
    statement_hi: 10 सितंबर 2017 को अखिल भारतीय अखाड़ा परिषद ने 14 धार्मिक व्यक्तियों की एक सूची जारी की जिनके विरुद्ध उसने सरकारों से कार्रवाई की माँग की, और निर्मल बाबा का नाम भी उसमें शामिल था।
    tier: allegation
    date: 2017-09-10
    source_ids: [rampal-src-08]

