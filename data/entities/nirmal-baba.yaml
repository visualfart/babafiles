summary_en: >
  Nirmaljit Singh Narula, known as Nirmal Baba, is a television preacher whose "Samagam"
  congregations, in which he sold entry tickets and offered everyday-life "solutions" to
  attendees, drew both a mass following and cheating complaints from 2012 onward in Bihar,
  Uttar Pradesh and elsewhere. A private complaint case in Muzaffarpur, Bihar, in which a
  magistrate took cognizance against him in July 2013 under IPC sections for cheating and
  deliberately hurting religious feelings, was quashed by the Patna High Court in June 2017
  for want of any material disclosing an offence. A separate case that a Lucknow magistrate
  directed police to register in May 2012 was reported at the time but its later outcome could
  not be independently verified. The tax authorities separately pursued a service-tax demand
  running into several crores of rupees over the entry fees and "Daswand" donations collected
  at his events, part of which he was reported to have paid while contesting the rest. The
  Akhil Bharatiya Akhara Parishad named him on its September 2017 list of 14 religious figures
  it called on governments to act against.
summary_hi: >
  निर्मलजीत सिंह नारुला, जिन्हें निर्मल बाबा के नाम से जाना जाता है, एक टेलीविज़न प्रवचनकर्ता हैं जिनके
  "समागम" कार्यक्रमों में प्रवेश टिकट बेचे जाते थे और रोज़मर्रा की समस्याओं के "समाधान" बताए जाते थे। इससे
  उन्हें बड़ी संख्या में अनुयायी मिले, साथ ही 2012 से बिहार, उत्तर प्रदेश और अन्य राज्यों में धोखाधड़ी की
  शिकायतें भी मिलीं। बिहार के मुज़फ़्फ़रपुर में एक निजी परिवाद मामले में, जिसमें जुलाई 2013 में एक मजिस्ट्रेट ने
  धोखाधड़ी और धार्मिक भावनाओं को जान-बूझकर ठेस पहुँचाने की धाराओं के तहत संज्ञान लिया था, पटना उच्च न्यायालय ने
  जून 2017 में यह कहते हुए कार्यवाही रद्द कर दी कि कोई अपराध बनता ही नहीं दिखता। मई 2012 में लखनऊ के एक
  मजिस्ट्रेट के आदेश पर दर्ज कराए गए एक अन्य मामले की उस समय रिपोर्टिंग हुई थी, परंतु उसका आगे का परिणाम
  स्वतंत्र रूप से सत्यापित नहीं किया जा सका। कर विभाग ने अलग से उनके कार्यक्रमों में ली गई प्रवेश फीस और
  "दसवंध" दान पर करोड़ों रुपये की सेवा कर माँग की, जिसका कुछ हिस्सा उन्होंने चुकाया बताया गया जबकि शेष को वे
  चुनौती दे रहे थे। अखिल भारतीय अखाड़ा परिषद ने सितंबर 2017 की अपनी सूची में, जिसमें उसने सरकारों से 14 धार्मिक
  व्यक्तियों के विरुद्ध कार्रवाई की माँग की थी, उनका नाम शामिल किया।
