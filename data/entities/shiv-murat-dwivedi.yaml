cases:
  - id: shiv-murat-dwivedi-pmla-2010
    title_en: Enforcement Directorate v. Shiv Murat Dwivedi and Praveen Kumar (money-laundering prosecution over an alleged prostitution racket)
    title_hi: प्रवर्तन निदेशालय बनाम शिव मूरत द्विवेदी एवं प्रवीण कुमार (कथित वेश्यावृत्ति रैकेट पर धन शोधन अभियोजन)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: Additional Sessions Judge-03, South District, Saket Courts, New Delhi (trial); Delhi High Court (writ proceedings)
    case_number: SC No. 6594/2016; ECIR No. ECIR/53/DLZO/2010; predicate FIR Nos. 47/2010 and 54/2010, PS Saket
    filed_year: 2010
    case_type: criminal
    statutes: ["PMLA 2002 s.4", "Immoral Traffic (Prevention) Act 1956 ss.5, 6, 8"]
    status: acquitted
    tier: acquitted
    verdict_date: 2025-11-19
    sentence_or_remedy: Acquitted
    appeal_status: No appeal against the acquittal located.
    summary_en: >
      Delhi police registered FIR Nos. 47/2010 and 54/2010 at Saket police station alleging that
      Shiv Murat Dwivedi and Praveen Kumar ran a prostitution racket out of a rented flat in
      Humayunpur village, Delhi, between 2001 and 2010, invoking sections 5, 6 and 8 of the
      Immoral Traffic (Prevention) Act, 1956. The Enforcement Directorate treated these as
      scheduled offences under the Prevention of Money Laundering Act, 2002 and, after
      provisionally attaching bank deposits, insurance policies, two cars and a house it said
      were purchased with the proceeds of crime, filed a money-laundering complaint
      (ECIR/53/DLZO/2010) in 2015; the trial court framed charges against both men under PMLA
      section 4 on 14 May 2016. At trial the defence argued, and the court accepted, that the
      Enforcement Directorate's investigating officer had not verified the bank records,
      insurance documents or property valuation underlying the case, had not traced any money
      trail, and had relied on unverified material; on 19 November 2025 the Additional Sessions
      Judge, Saket Courts, acquitted both Dwivedi and Kumar. Dwivedi separately pursued a writ
      petition against the Enforcement Directorate's conduct of the matter before the Delhi High
      Court, which was still pending as of September 2025.
    summary_hi: >
      दिल्ली पुलिस ने साकेत थाने में एफआईआर संख्या 47/2010 और 54/2010 दर्ज कीं, जिनमें आरोप था कि
      शिव मूरत द्विवेदी और प्रवीण कुमार ने 2001 से 2010 के बीच दिल्ली के हुमायूँपुर गाँव के एक किराए
      के फ्लैट से वेश्यावृत्ति रैकेट चलाया, जिसमें अनैतिक व्यापार (निवारण) अधिनियम, 1956 की धारा 5,
      6 और 8 लगाई गईं। प्रवर्तन निदेशालय ने इन्हें धन शोधन निवारण अधिनियम, 2002 के तहत अनुसूचित
      अपराध मानते हुए, बैंक जमा, बीमा पॉलिसियों, दो कारों और एक मकान को अस्थायी रूप से कुर्क करने के
      बाद, जिन्हें अपराध की आय से खरीदा गया बताया गया, 2015 में एक धन शोधन शिकायत
      (ईसीआईआर/53/डीएलजेडओ/2010) दाखिल की; विचारण अदालत ने 14 मई 2016 को दोनों पर पीएमएलए धारा 4 के
      तहत आरोप तय किए। विचारण में बचाव पक्ष ने तर्क दिया, जिसे अदालत ने स्वीकार किया, कि प्रवर्तन
      निदेशालय के जाँच अधिकारी ने मामले के आधार बने बैंक रिकॉर्ड, बीमा दस्तावेज़ या संपत्ति मूल्यांकन
      का सत्यापन नहीं किया था, धन का कोई मार्ग नहीं खोजा था, और असत्यापित सामग्री पर निर्भर रहे थे;
      19 नवंबर 2025 को साकेत कोर्ट्स के अतिरिक्त सत्र न्यायाधीश ने द्विवेदी और कुमार दोनों को बरी कर
      दिया। द्विवेदी ने अलग से प्रवर्तन निदेशालय के मामले के संचालन के विरुद्ध दिल्ली उच्च न्यायालय
      में एक रिट याचिका दायर की, जो सितंबर 2025 तक लंबित थी।
    source_ids: [smdwivedi-src-01, smdwivedi-src-02]

claims:
  - id: smdwivedi-claim-01
    case_id: shiv-murat-dwivedi-pmla-2010
    statement_en: A Delhi trial court framed charges against Shiv Murat Dwivedi and Praveen Kumar under section 4 of the Prevention of Money Laundering Act on 14 May 2016, in a case (ECIR/53/DLZO/2010) alleging they laundered proceeds of a prostitution racket run in Delhi between 2001 and 2010 under FIR Nos. 47/2010 and 54/2010, PS Saket.
    statement_hi: दिल्ली की एक विचारण अदालत ने 14 मई 2016 को शिव मूरत द्विवेदी और प्रवीण कुमार पर धन शोधन निवारण अधिनियम की धारा 4 के तहत आरोप तय किए, एक ऐसे मामले (ईसीआईआर/53/डीएलजेडओ/2010) में जिसमें आरोप था कि उन्होंने साकेत थाने की एफआईआर संख्या 47/2010 और 54/2010 के तहत 2001 से 2010 के बीच दिल्ली में चलाए गए वेश्यावृत्ति रैकेट की आय को शोधित किया।
    tier: charged
    date: 2016-05-14
    source_ids: [smdwivedi-src-01]
  - id: smdwivedi-claim-02
    case_id: shiv-murat-dwivedi-pmla-2010
    statement_en: On 19 November 2025 the Additional Sessions Judge, Saket Courts, New Delhi acquitted Shiv Murat Dwivedi and co-accused Praveen Kumar of the money-laundering charge, holding that the Enforcement Directorate's investigating officer had not verified the underlying financial and property records or traced any money trail.
    statement_hi: 19 नवंबर 2025 को साकेत कोर्ट्स, नई दिल्ली के अतिरिक्त सत्र न्यायाधीश ने शिव मूरत द्विवेदी और सह-अभियुक्त प्रवीण कुमार को धन शोधन के आरोप से बरी कर दिया, यह मानते हुए कि प्रवर्तन निदेशालय के जाँच अधिकारी ने अंतर्निहित वित्तीय और संपत्ति संबंधी रिकॉर्ड का सत्यापन नहीं किया था और न ही धन का कोई मार्ग खोजा था।
    tier: acquitted
    date: 2025-11-19
    source_ids: [smdwivedi-src-01]

