summary_en: >
  Shiv Murat Dwivedi, a self-styled godman known as Ichhadhari Bhimanand, was named with a
  co-accused, Praveen Kumar, in FIRs 47/2010 and 54/2010 registered at Saket police station,
  Delhi, alleging offences under the Immoral Traffic (Prevention) Act, 1956 in connection with
  a prostitution racket allegedly run out of a rented flat in Humayunpur village, Delhi. The
  Enforcement Directorate treated those as scheduled offences under the Prevention of Money
  Laundering Act and, after provisionally attaching assets it said were proceeds of crime, filed
  a money-laundering complaint (ECIR/53/DLZO/2010) in 2015; a Delhi trial court framed charges
  against Dwivedi and Kumar under PMLA section 4 on 14 May 2016. On 19 November 2025 the
  Additional Sessions Judge, Saket Courts, acquitted both accused, finding the Enforcement
  Directorate's investigation had not established the alleged proceeds of crime or traced any
  money trail. Dwivedi separately litigated the Enforcement Directorate's conduct of the case
  before the Delhi High Court in 2025.
summary_hi: >
  शिव मूरत द्विवेदी, जो इच्छाधारी भीमानंद के नाम से स्वयंभू बाबा के रूप में जाने जाते हैं, को
  सह-अभियुक्त प्रवीण कुमार के साथ दिल्ली के साकेत थाने में दर्ज एफआईआर 47/2010 और 54/2010 में नामित
  किया गया, जिनमें अनैतिक व्यापार (निवारण) अधिनियम, 1956 के तहत आरोप थे कि दिल्ली के हुमायूँपुर गाँव
  के एक किराए के फ्लैट से वेश्यावृत्ति रैकेट चलाया जा रहा था। प्रवर्तन निदेशालय ने इन्हें धन शोधन
  निवारण अधिनियम के तहत अनुसूचित अपराध मानते हुए, अपराध की आय बताई गई संपत्तियों को अस्थायी रूप से
  कुर्क करने के बाद, 2015 में एक धन शोधन शिकायत (ईसीआईआर/53/डीएलजेडओ/2010) दाखिल की; दिल्ली की एक
  विचारण अदालत ने 14 मई 2016 को द्विवेदी और कुमार पर पीएमएलए धारा 4 के तहत आरोप तय किए। 19 नवंबर 2025
  को साकेत कोर्ट्स के अतिरिक्त सत्र न्यायाधीश ने दोनों अभियुक्तों को यह पाते हुए बरी कर दिया कि
  प्रवर्तन निदेशालय की जाँच न तो कथित अपराध की आय स्थापित कर सकी और न ही किसी धन के मार्ग का पता
  लगा सकी। द्विवेदी ने अलग से 2025 में प्रवर्तन निदेशालय के मामले के संचालन को दिल्ली उच्च न्यायालय
  में चुनौती दी।
