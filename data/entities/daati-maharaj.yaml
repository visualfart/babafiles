cases:
  - id: daati-fatehpur-beri-rape-2018
    title_en: State/CBI v. Daati Maharaj and others (Fatehpur Beri ashram rape case)
    title_hi: राज्य/सीबीआई बनाम दाती महाराज एवं अन्य (फतेहपुर बेरी आश्रम बलात्कार मामला)
    jurisdiction_country: IN
    jurisdiction_region: Delhi
    court: Saket District Court (Special Fast Track Court); Delhi High Court (transfer and bail matters); CBI (investigation)
    case_number: >
      FIR registered 11 June 2018, PS Fatehpur Beri (FIR number not located); investigation
      transferred to CBI by Delhi HC order of 3 October 2018; CBI's bail-cancellation petitions
      CRL.M.C. 989-992/2019, Delhi High Court
    filed_year: 2018
    case_type: criminal
    statutes: [IPC 376, IPC 377, IPC 354, IPC 506, IPC 34]
    status: >
      charges framed 20 September 2024 against Daati Maharaj and two brothers (Ashok, Arjun);
      Anil discharged; trial ongoing, prosecution evidence being recorded
    tier: charged
    verdict_date:
    sentence_or_remedy:
    appeal_status: >
      The CBI's 2019 petitions (CRL.M.C. 989-992/2019) challenging the trial court's grant of
      bail remained before the Delhi High Court as of the last located order (26 February 2019,
      renotified); no final disposition of those petitions was located. Press reports of IPC
      sections invoked vary slightly (376/377/506 per one account, 376/377/354/34 per another);
      both are recorded here.
    summary_en: >
      A former disciple accused Daati Maharaj of raping her repeatedly from 2016 at his Delhi
      ashram and at a school in Alawas, Pali district, Rajasthan, and alleged she was blackmailed
      by another follower when she refused. Delhi Police registered an FIR on 11 June 2018 and
      filed a chargesheet on 1 October 2018 against Daati Maharaj, his brothers Ashok, Arjun and
      Anil, and others. Dissatisfied with the police investigation, the Delhi High Court
      transferred the case to the CBI on 3 October 2018 and dismissed Daati Maharaj's review
      petition against that order on 16 November 2018; the Supreme Court had separately, on 22
      October 2018, declined to entertain his challenge. An Additional Sessions Judge granted
      Daati Maharaj and his three brothers bail on 22 January 2019 on conditions; the CBI
      challenged that bail before the Delhi High Court from mid-2019, arguing it had been granted
      in error. The CBI's own supplementary chargesheet, based on the victim's further statement,
      named two more accused. On 20 September 2024 a Special Fast Track Court at Saket (Judge
      Neha) framed charges against Daati Maharaj and his brothers Ashok and Arjun, discharging
      Anil; the accused denied the charges and the court began recording prosecution evidence
      from 18 October 2024.
    summary_hi: >
      एक पूर्व शिष्या ने आरोप लगाया कि दाती महाराज ने 2016 से उनके दिल्ली स्थित आश्रम और राजस्थान के पाली
      ज़िले के अलावास स्थित एक विद्यालय में उनके साथ बार-बार बलात्कार किया, और आरोप लगाया कि इनकार करने पर
      एक अन्य अनुयायी द्वारा उन्हें ब्लैकमेल किया गया। दिल्ली पुलिस ने 11 जून 2018 को एफआईआर दर्ज की और 1
      अक्टूबर 2018 को दाती महाराज, उनके भाइयों अशोक, अर्जुन व अनिल तथा अन्य के विरुद्ध आरोप-पत्र दाखिल
      किया। पुलिस जाँच से असंतुष्ट दिल्ली उच्च न्यायालय ने 3 अक्टूबर 2018 को मामला सीबीआई को सौंप दिया और
      16 नवंबर 2018 को इस आदेश के विरुद्ध दाती महाराज की पुनरीक्षण याचिका खारिज कर दी; सर्वोच्च न्यायालय ने
      अलग से 22 अक्टूबर 2018 को उनकी चुनौती सुनने से इनकार कर दिया था। एक अतिरिक्त सत्र न्यायाधीश ने 22
      जनवरी 2019 को दाती महाराज और उनके तीनों भाइयों को शर्तों के साथ ज़मानत दी; सीबीआई ने 2019 के मध्य से
      इस ज़मानत को दिल्ली उच्च न्यायालय में चुनौती दी, यह तर्क देते हुए कि यह त्रुटिवश दी गई थी। पीड़िता के
      आगे के बयान के आधार पर सीबीआई के अपने पूरक आरोप-पत्र में दो और अभियुक्तों के नाम जोड़े गए। 20 सितंबर
      2024 को साकेत की एक विशेष फास्ट-ट्रैक अदालत (न्यायाधीश नेहा) ने दाती महाराज और उनके भाइयों अशोक व
      अर्जुन के विरुद्ध आरोप तय किए, अनिल को उन्मोचित करते हुए; अभियुक्तों ने आरोपों से इनकार किया और अदालत
      ने 18 अक्टूबर 2024 से अभियोजन साक्ष्य दर्ज करना शुरू किया।
    source_ids:
