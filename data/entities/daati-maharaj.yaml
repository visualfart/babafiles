claims:
  - id: daati-maharaj-claim-01
    case_id: daati-fatehpur-beri-rape-2018
    statement_en: >
      A former disciple filed a complaint with Delhi Police on 7 June 2018, and an FIR was
      registered on 11 June 2018 at Fatehpur Beri police station, alleging that Daati Maharaj and
      two others raped her, that she had served him for about a decade, that another female
      follower used to send her to his room and blackmailed her when she refused, and that she
      was also repeatedly raped at a school in Alawas, Pali district, Rajasthan.
    statement_hi: >
      एक पूर्व शिष्या ने 7 जून 2018 को दिल्ली पुलिस के समक्ष शिकायत दर्ज कराई, और 11 जून 2018 को फतेहपुर
      बेरी थाने में एफआईआर दर्ज हुई, जिसमें आरोप है कि दाती महाराज और दो अन्य ने उसके साथ बलात्कार किया, वह
      लगभग एक दशक से उनकी सेवा में थी, एक अन्य महिला अनुयायी उसे उनके कमरे में भेजा करती थी और इनकार करने
      पर उसे ब्लैकमेल करती थी, और यह भी कि राजस्थान के पाली ज़िले के अलावास स्थित एक विद्यालय में भी उसके
      साथ बार-बार बलात्कार किया गया।
    tier: under_investigation
    date: 2018-06-11
    source_ids: [daati-maharaj-src-01, daati-maharaj-src-02, daati-maharaj-src-04]
  - id: daati-maharaj-claim-02
    case_id: daati-fatehpur-beri-rape-2018
    statement_en: >
      Delhi Police filed a chargesheet on 1 October 2018 against Daati Maharaj and his brothers
      Ashok, Arjun and Anil.
    statement_hi: >
      दिल्ली पुलिस ने 1 अक्टूबर 2018 को दाती महाराज और उनके भाइयों अशोक, अर्जुन व अनिल के विरुद्ध
      आरोप-पत्र दाखिल किया।
    tier: charged
    date: 2018-10-01
    source_ids: [daati-maharaj-src-01, daati-maharaj-src-02, daati-maharaj-src-04]
  - id: daati-maharaj-claim-03
    case_id: daati-fatehpur-beri-rape-2018
    statement_en: >
      On 3 October 2018 the Delhi High Court, on the complainant's petition and expressing
      dissatisfaction with the Delhi Police investigation, transferred the probe to the CBI.
    statement_hi: >
      3 अक्टूबर 2018 को दिल्ली उच्च न्यायालय ने, शिकायतकर्ता की याचिका पर और दिल्ली पुलिस की जाँच से
      असंतोष व्यक्त करते हुए, जाँच सीबीआई को सौंप दी।
    tier: under_investigation
    date: 2018-10-03
    source_ids: [daati-maharaj-src-01, daati-maharaj-src-03, daati-maharaj-src-04]
  - id: daati-maharaj-claim-04
    case_id: daati-fatehpur-beri-rape-2018
    statement_en: >
      On 22 October 2018 the Supreme Court declined to entertain Daati Maharaj's plea against the
      transfer of the investigation to the CBI and directed him to approach the Delhi High Court
      with his grievances; the High Court subsequently dismissed his review petition against the
      transfer on 16 November 2018.
    statement_hi: >
      22 अक्टूबर 2018 को सर्वोच्च न्यायालय ने जाँच सीबीआई को सौंपे जाने के विरुद्ध दाती महाराज की याचिका
      सुनने से इनकार किया और उन्हें अपनी शिकायतों के साथ दिल्ली उच्च न्यायालय जाने को कहा; उच्च न्यायालय ने
      बाद में 16 नवंबर 2018 को स्थानांतरण के विरुद्ध उनकी पुनरीक्षण याचिका खारिज कर दी।
    tier: under_investigation
    date: 2018-10-22
    source_ids: [daati-maharaj-src-09, daati-maharaj-src-04]
  - id: daati-maharaj-claim-05
    case_id: daati-fatehpur-beri-rape-2018
    statement_en: >
      An Additional Sessions Judge granted Daati Maharaj and his three brothers bail on 22
      January 2019 on a bond of Rs 1 lakh each, directing that he not influence the investigation,
      tamper with evidence, contact the victim and her family, or travel abroad without the
      court's permission.
    statement_hi: >
      एक अतिरिक्त सत्र न्यायाधीश ने 22 जनवरी 2019 को दाती महाराज और उनके तीनों भाइयों को प्रत्येक 1 लाख
      रुपये के मुचलके पर ज़मानत दी, यह निर्देश देते हुए कि वे जाँच को प्रभावित न करें, साक्ष्य से छेड़छाड़ न
      करें, पीड़िता व उसके परिवार से संपर्क न करें, और अदालत की अनुमति के बिना विदेश यात्रा न करें।
    tier: charged
    date: 2019-01-22
    source_ids: [daati-maharaj-src-01, daati-maharaj-src-04]
  - id: daati-maharaj-claim-06
    case_id: daati-fatehpur-beri-rape-2018
    statement_en: >
      The CBI moved the Delhi High Court in 2019, in CRL.M.C. 989-992/2019, seeking cancellation
      of the bail granted to Daati Maharaj and his three brothers, arguing the Additional Sessions
      Judge had erroneously granted it while reviewing a matter that had already been disposed of;
      as of the last located order in that matter, dated 26 February 2019, the petitions remained
      pending, adjourned for an amendment application.
    statement_hi: >
      सीबीआई ने 2019 में CRL.M.C. 989-992/2019 में दिल्ली उच्च न्यायालय का रुख किया, दाती महाराज और
      उनके तीनों भाइयों को दी गई ज़मानत रद्द करने की माँग करते हुए, यह तर्क देते हुए कि अतिरिक्त सत्र
      न्यायाधीश ने पहले ही निपटाए जा चुके मामले की समीक्षा करते हुए त्रुटिवश ज़मानत दी थी; इस मामले में
      उपलब्ध अंतिम आदेश, दिनांक 26 फरवरी 2019 के अनुसार, याचिकाएँ संशोधन आवेदन के लिए स्थगित कर लंबित थीं।
    tier: charged
    date: 2019-08-26
    source_ids: [daati-maharaj-src-03, daati-maharaj-src-04, daati-maharaj-src-05]
  - id: daati-maharaj-claim-07
    case_id: daati-fatehpur-beri-rape-2018
    statement_en: >
      On the victim's supplementary statement, the CBI's own supplementary chargesheet named two
      more accused, Neetu alias Maa Shraddha and Neema Joshi.
    statement_hi: >
      पीड़िता के पूरक बयान के आधार पर सीबीआई के अपने पूरक आरोप-पत्र में दो और अभियुक्तों, नीतू उर्फ माँ
      श्रद्धा और नीमा जोशी, के नाम जोड़े गए।
    tier: charged
    date: 2018
    source_ids: [daati-maharaj-src-01, daati-maharaj-src-04]
  - id: daati-maharaj-claim-08
    case_id: daati-fatehpur-beri-rape-2018
    statement_en: >
      On 20 September 2024 a Special Fast Track Court at Saket (Judge Neha) framed charges against
      Daati Maharaj and his brothers Ashok and Arjun and discharged brother Anil from the case; the
      accused denied the charges and claimed trial, and the court listed the matter for recording
      of prosecution evidence from 18 October 2024.
    statement_hi: >
      20 सितंबर 2024 को साकेत की एक विशेष फास्ट-ट्रैक अदालत (न्यायाधीश नेहा) ने दाती महाराज और उनके
      भाइयों अशोक व अर्जुन के विरुद्ध आरोप तय किए और भाई अनिल को मामले से उन्मोचित कर दिया; अभियुक्तों ने
      आरोपों से इनकार किया और विचारण का सामना करने की बात कही, और अदालत ने 18 अक्टूबर 2024 से अभियोजन
      साक्ष्य दर्ज करने के लिए मामला सूचीबद्ध किया।
    tier: charged
    date: 2024-09-20
    source_ids: [daati-maharaj-src-01, daati-maharaj-src-02, daati-maharaj-src-04]
  - id: daati-maharaj-claim-09
    case_id: daati-fatehpur-beri-rape-2018
    statement_en: >
      A prime prosecution witness, Sachin Jain, told police he was intercepted by men in an SUV
      and threatened not to speak to the media or give evidence against Daati Maharaj.
    statement_hi: >
      अभियोजन के एक प्रमुख गवाह, सचिन जैन, ने पुलिस को बताया कि उसे एक एसयूवी में सवार लोगों ने रोककर धमकी
      दी कि वह दाती महाराज के विरुद्ध मीडिया से बात न करे और न ही गवाही दे।
    tier: charged
    date: 2018
    source_ids: [daati-maharaj-src-08, daati-maharaj-src-04]

