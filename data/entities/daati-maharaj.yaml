summary_en: >
  Daati Maharaj (Madan Lal Rajasthani) heads the Shani Dham ashram at Fatehpur Beri, south Delhi.
  A former disciple accused him of repeatedly raping her from 2016 at his Delhi ashram and at a
  school in Alawas, Pali district, Rajasthan; Delhi Police registered an FIR on 11 June 2018
  against him, his brothers Ashok, Arjun and Anil, and others, and filed a chargesheet on 1
  October 2018. Dissatisfied with the police investigation, the Delhi High Court transferred the
  probe to the CBI on 3 October 2018 and, in November 2018, dismissed Daati Maharaj's review
  petition against that transfer; the Supreme Court had separately declined to entertain his
  challenge and told him to approach the High Court. A trial court granted Daati Maharaj and his
  three brothers bail on 22 January 2019, and the CBI moved the Delhi High Court seeking
  cancellation of that bail, a challenge that remained before the Court for years. The CBI's own
  supplementary chargesheet added two more accused. On 20 September 2024 a Saket district court
  framed charges against Daati Maharaj and his brothers Ashok and Arjun (discharging Anil for
  lack of evidence), and the trial began, with the accused denying the charges and claiming
  trial. Daati Maharaj has denied the allegations, saying he was framed by three former aides.
summary_hi: >
  दाती महाराज (मदन लाल राजस्थानी) दक्षिण दिल्ली के फतेहपुर बेरी स्थित शनि धाम आश्रम के प्रमुख हैं। एक
  पूर्व शिष्या ने आरोप लगाया कि 2016 से उनके दिल्ली के आश्रम में और राजस्थान के पाली ज़िले के अलावास स्थित
  एक विद्यालय में उनके साथ बार-बार बलात्कार किया गया; दिल्ली पुलिस ने 11 जून 2018 को उनके, उनके भाइयों
  अशोक, अर्जुन व अनिल, तथा अन्य के विरुद्ध एफआईआर दर्ज की और 1 अक्टूबर 2018 को आरोप-पत्र दाखिल किया। पुलिस
  जाँच से असंतुष्ट होकर दिल्ली उच्च न्यायालय ने 3 अक्टूबर 2018 को जाँच सीबीआई को सौंप दी और नवंबर 2018 में
  इस स्थानांतरण के विरुद्ध दाती महाराज की पुनरीक्षण याचिका खारिज कर दी; सर्वोच्च न्यायालय ने अलग से उनकी
  चुनौती सुनने से इनकार करते हुए उन्हें उच्च न्यायालय जाने को कहा था। एक विचारण अदालत ने 22 जनवरी 2019 को
  दाती महाराज और उनके तीनों भाइयों को ज़मानत दी, और सीबीआई ने इस ज़मानत को रद्द कराने के लिए दिल्ली उच्च
  न्यायालय का रुख किया, जो चुनौती वर्षों तक न्यायालय के समक्ष लंबित रही। सीबीआई के अपने पूरक आरोप-पत्र में
  दो और अभियुक्त जोड़े गए। 20 सितंबर 2024 को साकेत की एक ज़िला अदालत ने दाती महाराज और उनके भाइयों अशोक व
  अर्जुन के विरुद्ध आरोप तय किए (साक्ष्य के अभाव में अनिल को उन्मोचित करते हुए), और विचारण शुरू हुआ, जिसमें
  अभियुक्तों ने आरोपों से इनकार किया और विचारण का सामना करने की बात कही। दाती महाराज ने आरोपों से इनकार
  करते हुए कहा है कि उन्हें तीन पूर्व सहयोगियों ने फँसाया है।
hi_reviewed: false
response_from_subject:
  text_en: >
    Questioned by police in June 2018, Daati Maharaj denied all the allegations against him and
    said he had been framed by three former aides who had earlier been associated with his
    ashram.
  text_hi: >
    जून 2018 में पुलिस पूछताछ में दाती महाराज ने अपने विरुद्ध सभी आरोपों से इनकार किया और कहा कि उन्हें
    उनके आश्रम से पहले जुड़े रहे तीन पूर्व सहयोगियों ने फँसाया है।
  source_id: daati-maharaj-src-07

