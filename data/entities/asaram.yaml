relationships:
  - to_id: narayan-sai
    type: family
    period_start:
    period_end:
    description_en: Narayan Sai is Asaram's son; Gujarat High Court orders describe him as "Narayan @ Narayan Sai @ Mota Bhagwan s/o Asharam @ Ashumal Harpalani".
    description_hi: नारायण साईं आसाराम के पुत्र हैं; गुजरात उच्च न्यायालय के आदेशों में उन्हें "नारायण उर्फ नारायण साईं उर्फ मोटा भगवान पुत्र आसाराम उर्फ आशुमल हरपलानी" लिखा गया है।
    source_ids: [ narayan-sai-src-01, narayan-sai-src-02 ]
  - to_id: narendra-modi
    type: shared_stage
    period_start:
    period_end: 2013
    description_en: >
      The Wire reported that Narendra Modi "had appeared on stage with Asaram on several occasions in his Gujarat days" and that after the 2013 allegations he warned BJP leaders against defending him. The Caravan quoted a mid-2000s video from the Motera ashram in which Modi, then Gujarat Chief Minister, said it was his "great opportunity to have met him at a point in life when nobody knew me".
    description_hi: >
      द वायर ने बताया कि नरेंद्र मोदी "गुजरात के अपने दिनों में कई अवसरों पर आसाराम के साथ मंच पर दिखे" और 2013 के आरोपों के बाद उन्होंने भाजपा नेताओं को उनका बचाव न करने की चेतावनी दी। द कारवाँ ने मोटेरा आश्रम के 2000 के दशक के मध्य के एक वीडियो को उद्धृत किया जिसमें तत्कालीन गुजरात मुख्यमंत्री मोदी ने कहा कि उन्हें "जीवन के उस मोड़ पर उनसे मिलने का सौभाग्य मिला जब कोई मुझे नहीं जानता था"।
    source_ids: [ asaram-src-23, asaram-src-33 ]
  - to_id: subramanian-swamy
    type: legal_representation
    period_start: 2015-04
    period_end: 2015-06
    description_en: >
      BJP leader Subramanian Swamy met Asaram in jail in April 2015 and appeared for him, arguing on 19 June 2015 before the Additional District and Sessions Judge, Jodhpur that the case was fabricated and that he should be granted bail; the court rejected bail on 20 June 2015.
    description_hi: >
      भाजपा नेता सुब्रमण्यम स्वामी अप्रैल 2015 में जेल में आसाराम से मिले और उनकी ओर से पेश हुए; 19 जून 2015 को उन्होंने जोधपुर के अतिरिक्त ज़िला एवं सत्र न्यायाधीश के समक्ष दलील दी कि मामला मनगढ़ंत है और ज़मानत दी जाए; अदालत ने 20 जून 2015 को ज़मानत खारिज की।
    source_ids: [ asaram-src-23, asaram-src-33, asaram-src-36 ]
  - to_id: uma-bharti
    type: endorsement
    period_start: 2013-08
    period_end: 2013-08
    description_en: >
      On 22 August 2013, at Indore, BJP leader Uma Bharti said the rape charge against Asaram could be "politically motivated" as he had been critical of the top Congress leadership (PTI). The Caravan lists her among chief ministers who were his followers.
    description_hi: >
      22 अगस्त 2013 को इंदौर में भाजपा नेता उमा भारती ने कहा कि आसाराम के विरुद्ध बलात्कार का आरोप "राजनीति से प्रेरित" हो सकता है क्योंकि वे कांग्रेस के शीर्ष नेतृत्व के आलोचक रहे हैं (पीटीआई)। द कारवाँ ने उन्हें उनके अनुयायी मुख्यमंत्रियों में गिना है।
    source_ids: [ asaram-src-34, asaram-src-33, asaram-src-35 ]
  - to_id: digvijaya-singh
    type: affiliation
    period_start:
    period_end:
    description_en: >
      The Caravan and The Wire name Congress leader Digvijaya Singh among senior politicians who were Asaram's followers or sought his blessings. A DailyO opinion piece states that as Madhya Pradesh Chief Minister he "awarded Asaram prime land in 1998"; no official record of that allotment was located.
    description_hi: >
      द कारवाँ और द वायर ने कांग्रेस नेता दिग्विजय सिंह को उन वरिष्ठ राजनेताओं में गिना है जो आसाराम के अनुयायी थे या उनका आशीर्वाद लेते थे। डेलीओ के एक विचार-लेख के अनुसार मध्य प्रदेश के मुख्यमंत्री के रूप में उन्होंने "1998 में आसाराम को बेशक़ीमती ज़मीन दी"; इस आवंटन का कोई आधिकारिक रिकॉर्ड नहीं मिला।
    source_ids: [ asaram-src-33, asaram-src-23, asaram-src-35 ]
