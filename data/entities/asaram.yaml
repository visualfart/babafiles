summary_en: >
  Asaram (Asharam @ Ashumal), founder of the Sant Shri Asharam Ashram network based at Motera, Ahmedabad, is serving two life sentences. A Special POCSO Court at Jodhpur convicted him on 25 April 2018 of raping a 16-year-old student of his ashram in August 2013; the Rajasthan High Court upheld the conviction and the life term on 27 May 2026 while setting aside the gang-rape and conspiracy counts, and a Special Leave Petition is pending in the Supreme Court. An Additional Sessions Judge at Gandhinagar convicted him on 31 January 2023 of raping a woman disciple at the Motera ashram and sentenced him to life; that appeal is pending in the Gujarat High Court. Between January 2025 and May 2026 he was released several times on interim bail or suspension of sentence on medical grounds; he surrendered after the May 2026 judgment. A judicial commission found no evidence that he or his son performed tantric rituals in connection with the 2008 deaths of two gurukul students, and the Gujarat High Court in April 2026 upheld eviction proceedings against his ashram trust for encroaching on state land.
summary_hi: >
  आसाराम (असाराम उर्फ आशुमल), मोटेरा (अहमदाबाद) स्थित संत श्री आसारामजी आश्रम के संस्थापक, दो आजीवन कारावास की सज़ा काट रहे हैं। जोधपुर की विशेष पॉक्सो अदालत ने 25 अप्रैल 2018 को उन्हें अगस्त 2013 में अपने आश्रम की 16 वर्षीय छात्रा से बलात्कार का दोषी ठहराया; राजस्थान उच्च न्यायालय ने 27 मई 2026 को दोषसिद्धि और आजीवन कारावास को बरकरार रखा, जबकि सामूहिक बलात्कार और षड्यंत्र के आरोप निरस्त किए; सर्वोच्च न्यायालय में विशेष अनुमति याचिका लंबित है। गांधीनगर के अतिरिक्त सत्र न्यायाधीश ने 31 जनवरी 2023 को मोटेरा आश्रम में एक महिला शिष्या से बलात्कार के मामले में उन्हें दोषी ठहराकर आजीवन कारावास दिया; वह अपील गुजरात उच्च न्यायालय में लंबित है। जनवरी 2025 से मई 2026 के बीच वे चिकित्सा आधार पर कई बार अंतरिम ज़मानत या सज़ा निलंबन पर रिहा हुए; मई 2026 के फ़ैसले के बाद उन्होंने आत्मसमर्पण किया। 2008 में गुरुकुल के दो छात्रों की मौत के संबंध में न्यायिक आयोग को उनके या उनके पुत्र द्वारा तांत्रिक क्रिया का कोई साक्ष्य नहीं मिला, और अप्रैल 2026 में गुजरात उच्च न्यायालय ने सरकारी ज़मीन पर अतिक्रमण के लिए उनके आश्रम ट्रस्ट के विरुद्ध बेदखली की कार्यवाही को सही ठहराया।
hi_reviewed: false
response_from_subject:
  text_en: >
    After the 25 April 2018 verdict, Asaram's spokesperson Neelam Dubey said: "We will discuss with our legal team and then decide our future course of action. We have confidence in our judiciary." In August 2013, before his arrest, Asaram told the media that people were telling him that "'madam' and her son are behind the conspiracy", adding "I am not personally blaming anyone" and "I'm ready to go to prison, that is also a kind of heaven for me." In his 2026 appeal he asserted that he had been framed by extortionists.
  text_hi: >
    25 अप्रैल 2018 के फ़ैसले के बाद आसाराम की प्रवक्ता नीलम दुबे ने कहा: "हम अपनी क़ानूनी टीम से चर्चा करके आगे की कार्रवाई तय करेंगे। हमें अपनी न्यायपालिका पर भरोसा है।" अगस्त 2013 में गिरफ़्तारी से पहले आसाराम ने मीडिया से कहा कि लोग उन्हें बता रहे हैं कि "'मैडम' और उनका बेटा इस षड्यंत्र के पीछे हैं", साथ ही कहा "मैं व्यक्तिगत रूप से किसी को दोष नहीं दे रहा" और "मैं जेल जाने को तैयार हूँ, वह भी एक प्रकार का स्वर्ग है।" 2026 की अपील में उन्होंने कहा कि उन्हें वसूली करने वालों ने फँसाया है।
  source_id: asaram-src-20

