cases:
  - id: asaram-jodhpur-pocso-2013
    title_en: State v. Asharam @ Ashumal (Jodhpur, POCSO)
    title_hi: राज्य बनाम आसाराम उर्फ आशुमल (जोधपुर, पॉक्सो)
    jurisdiction_country: IN
    jurisdiction_region: Rajasthan
    court: Special Court, POCSO Act Cases, Jodhpur; Rajasthan High Court (D.B. Criminal Appeal No. 123/2018); Supreme Court (SLP (Crl.) No. 11761/2026)
    case_number: Sessions Case No. 116/2016 (152/2013)
    filed_year: 2013
    case_type: criminal
    statutes: [ IPC 376(2)(f), IPC 376, IPC 376D, IPC 370(4), IPC 342, IPC 354A, IPC 506, IPC 509, IPC 120B, POCSO s.3/4, POCSO s.5(f)/6, POCSO s.5(g)/6, POCSO s.7/8, JJ Act 2000 s.23 ]
    status: convicted; conviction and life sentence upheld by Rajasthan High Court on 2026-05-27 (gang-rape and conspiracy counts set aside); Special Leave Petition pending in the Supreme Court
    tier: convicted
    verdict_date: 2018-04-25
    sentence_or_remedy: Life imprisonment for the remainder of natural life under IPC 376(2)(f), plus 10 years RI under IPC 370(4), 1 year each under IPC 342 and 506, 6 months under JJ Act s.23, with fines
    appeal_status: Rajasthan High Court dismissed the appeal on 2026-05-27 with modifications; SLP (Crl.) No. 11761/2026 pending in the Supreme Court, which issued notice on 2026-06-30 and on 2026-08-06 declined interim bail while keeping the suspension-of-sentence application pending
    summary_en: >
      A 16-year-old student of Asaram's gurukul alleged that she was sexually assaulted at his ashram at Manai near Jodhpur on 15 August 2013. Asaram was arrested in Indore on 1 September 2013. After a trial in which 58 prosecution witnesses were examined, the Special Judge for POCSO cases, sitting inside Jodhpur Central Jail, convicted him on 25 April 2018 and sentenced him to imprisonment for the rest of his natural life; co-accused Shilpi and Sharad received 20 years and Prakash and Shiva were acquitted. On 27 May 2026 a Division Bench of the Rajasthan High Court upheld the conviction and life term under IPC 376(2)(f), 370(4), 342, 354A, 506, 509, POCSO s.7/8 and JJ Act s.23, additionally convicted him under IPC 376 and POCSO s.3/4, set aside the convictions under IPC 120B, 34 and 376D and POCSO s.5(g)/6, acquitted Shilpi and Sharad of all charges, cancelled his interim bail and ordered his arrest. His SLP is pending in the Supreme Court, which has refused to suspend the sentence so far.
    summary_hi: >
      आसाराम के गुरुकुल की 16 वर्षीय छात्रा ने आरोप लगाया कि 15 अगस्त 2013 को जोधपुर के पास मणाई स्थित आश्रम में उसका यौन उत्पीड़न किया गया। आसाराम को 1 सितंबर 2013 को इंदौर से गिरफ़्तार किया गया। 58 अभियोजन गवाहों की सुनवाई के बाद पॉक्सो मामलों के विशेष न्यायाधीश ने, जोधपुर केंद्रीय कारागार के भीतर बैठकर, 25 अप्रैल 2018 को उन्हें दोषी ठहराया और शेष प्राकृतिक जीवन तक कारावास की सज़ा सुनाई; सह-अभियुक्त शिल्पी और शरद को 20 वर्ष की सज़ा मिली तथा प्रकाश और शिवा बरी हुए। 27 मई 2026 को राजस्थान उच्च न्यायालय की खंडपीठ ने आईपीसी 376(2)(f), 370(4), 342, 354A, 506, 509, पॉक्सो धारा 7/8 और किशोर न्याय अधिनियम धारा 23 के तहत दोषसिद्धि और आजीवन कारावास बरकरार रखा, आईपीसी 376 और पॉक्सो धारा 3/4 के तहत अतिरिक्त दोषी ठहराया, आईपीसी 120B, 34 और 376D तथा पॉक्सो 5(g)/6 के तहत दोषसिद्धि निरस्त की, शिल्पी और शरद को सभी आरोपों से बरी किया, अंतरिम ज़मानत रद्द की और गिरफ़्तारी का आदेश दिया। सर्वोच्च न्यायालय में उनकी विशेष अनुमति याचिका लंबित है, जिसने अब तक सज़ा निलंबित करने से इनकार किया है।
    source_ids: [ asaram-src-01, asaram-src-02, asaram-src-20, asaram-src-21, asaram-src-12, asaram-src-14 ]

  - id: asaram-gandhinagar-rape-2013
    title_en: State of Gujarat v. Ashumal @ Asharam (Gandhinagar, Surat complainant)
    title_hi: गुजरात राज्य बनाम आशुमल उर्फ आसाराम (गांधीनगर, सूरत शिकायतकर्ता)
    jurisdiction_country: IN
    jurisdiction_region: Gujarat
    court: Additional Sessions Judge, Gandhinagar; Gujarat High Court (R/Criminal Appeal No. 607/2023); Supreme Court (SLP (Crl.) No. 15945/2024)
    case_number: Sessions Case No. 34 of 2014
    filed_year: 2013
    case_type: criminal
    statutes: [ IPC 376(2)(c), IPC 377, IPC 342, IPC 354, IPC 357, IPC 506 ]
    status: convicted; appeal pending in the Gujarat High Court
    tier: convicted
    verdict_date: 2023-01-31
    sentence_or_remedy: Life imprisonment
    appeal_status: R/Criminal Appeal No. 607/2023 pending in the Gujarat High Court; suspension of sentence refused on 2024-08-29, granted for six months on 2025-11-06; SLP (Crl.) No. 15945/2024 in the Supreme Court (notice issued 2024-11-22; interim bail on medical grounds 2025-01-07 to 2025-03-31); 20-day temporary bail refused 2026-09-08
    summary_en: >
      In October 2013 a woman from Surat, the elder of two sisters who complained against Asaram and his son Narayan Sai, alleged that Asaram had raped her repeatedly between 2001 and 2006 while she lived at his Motera ashram near Ahmedabad. An Additional Sessions Judge at Gandhinagar convicted him on 31 January 2023 under IPC 376(2)(c), 377, 342, 354, 357 and 506 and sentenced him to life imprisonment. His appeal is pending in the Gujarat High Court, which refused to suspend the sentence in August 2024, suspended it for six months on medical grounds in November 2025, and on 8 September 2026 refused a further 20-day temporary bail, leaving him free to approach the Supreme Court if his health deteriorates.
    summary_hi: >
      अक्टूबर 2013 में सूरत की एक महिला ने, जो आसाराम और उनके पुत्र नारायण साईं के विरुद्ध शिकायत करने वाली दो बहनों में बड़ी थी, आरोप लगाया कि 2001 से 2006 के बीच अहमदाबाद के पास मोटेरा आश्रम में रहते हुए आसाराम ने उसके साथ बार-बार बलात्कार किया। गांधीनगर के अतिरिक्त सत्र न्यायाधीश ने 31 जनवरी 2023 को आईपीसी 376(2)(c), 377, 342, 354, 357 और 506 के तहत उन्हें दोषी ठहराकर आजीवन कारावास की सज़ा दी। उनकी अपील गुजरात उच्च न्यायालय में लंबित है, जिसने अगस्त 2024 में सज़ा निलंबन से इनकार किया, नवंबर 2025 में चिकित्सा आधार पर छह माह के लिए सज़ा निलंबित की, और 8 सितंबर 2026 को 20 दिन की अस्थायी ज़मानत से इनकार किया।
    source_ids: [ asaram-src-03, asaram-src-04, asaram-src-05, asaram-src-06, asaram-src-14, asaram-src-21 ]

  - id: asaram-motera-deaths-inquiry-2008
    title_en: Justice D.K. Trivedi Commission of Inquiry into the 2008 deaths of two Motera gurukul students
    title_hi: मोटेरा गुरुकुल के दो छात्रों की 2008 की मौतों पर न्यायमूर्ति डी.के. त्रिवेदी जाँच आयोग
    jurisdiction_country: IN
    jurisdiction_region: Gujarat
    court: Commission of Inquiry headed by Justice D.K. Trivedi (retired), appointed by the Government of Gujarat
    case_number:
    filed_year: 2008
    case_type: inquiry
    statutes: []
    status: closed; report submitted July 2013 and tabled in the Gujarat Assembly on 2019-07-26
    tier: closed
    verdict_date: 2019-07-26
    sentence_or_remedy: No evidence found against Asaram or Narayan Sai; school authorities held negligent
    appeal_status:
    summary_en: >
      Cousins Dipesh Vaghela (10) and Abhishek Vaghela (11), students at the residential gurukul at Asaram's Motera ashram, went missing from the hostel on 3 July 2008 and their decomposed bodies were found on the bank of the Sabarmati on 5 July 2008. The Gujarat government appointed a commission of inquiry under Justice D.K. Trivedi in July 2008. The commission submitted its report in July 2013; it was tabled in the Assembly on 26 July 2019. As reported by PTI, the report found no evidence that Asaram or Narayan Sai performed tantric rituals in the ashram, said the possibility of death by drowning could not be ruled out on the medical evidence, and held the school authorities negligent. A separate CID investigation booked seven people under IPC 304. No official copy of the report was located online; this entry rests on press reports of the tabled document.
    summary_hi: >
      आसाराम के मोटेरा आश्रम के आवासीय गुरुकुल के छात्र, चचेरे भाई दीपेश वाघेला (10) और अभिषेक वाघेला (11), 3 जुलाई 2008 को छात्रावास से लापता हुए और 5 जुलाई 2008 को साबरमती के किनारे उनके शव मिले। गुजरात सरकार ने जुलाई 2008 में न्यायमूर्ति डी.के. त्रिवेदी की अध्यक्षता में जाँच आयोग नियुक्त किया। आयोग ने जुलाई 2013 में रिपोर्ट सौंपी, जो 26 जुलाई 2019 को विधानसभा में रखी गई। पीटीआई के अनुसार रिपोर्ट में आसाराम या नारायण साईं द्वारा आश्रम में तांत्रिक क्रिया का कोई साक्ष्य नहीं मिला, चिकित्सा साक्ष्य के आधार पर डूबने से मृत्यु की संभावना को नकारा नहीं जा सका, और विद्यालय प्रबंधन को लापरवाह ठहराया गया। सीआईडी की अलग जाँच में सात लोगों पर आईपीसी 304 के तहत मामला दर्ज हुआ। रिपोर्ट की कोई आधिकारिक प्रति ऑनलाइन नहीं मिली।
    source_ids: [ asaram-src-26, asaram-src-27 ]

  - id: asaram-ashram-motera-land-2025
    title_en: Sant Shri Asharam Ashram v. State of Gujarat (Motera land encroachment and eviction)
    title_hi: संत श्री आसाराम आश्रम बनाम गुजरात राज्य (मोटेरा भूमि अतिक्रमण और बेदखली)
    jurisdiction_country: IN
    jurisdiction_region: Gujarat
    court: City Mamlatdar and City Deputy Collector, Sabarmati (Gujarat Land Revenue Code ss. 61 and 79A); Gujarat High Court (Special Civil Applications 11366/2025 and 11610/2025; Letters Patent Appeals 107 and 108 of 2026); Supreme Court
    case_number: R/Letters Patent Appeal No. 107 of 2026 with No. 108 of 2026
    filed_year: 2025
    case_type: regulatory
    statutes: [ Gujarat Land Revenue Code s.61, Gujarat Land Revenue Code s.79A, Gujarat Land Revenue Code s.202 ]
    status: Gujarat High Court dismissed the trust's appeals on 2026-04-17; Supreme Court ordered status quo on 2026-04-27; pending
    tier: regulatory_action
    verdict_date: 2026-04-17
    sentence_or_remedy: Eviction proceedings against the trust upheld; stay of the judgment refused
    appeal_status: Supreme Court (Justices Vikram Nath and Sandeep Mehta) ordered status quo on the land on 2026-04-27 pending hearing
    summary_en: >
      The trust running Asaram's Motera ashram, Sant Shri Asharam Ashram, was allotted about 39,094 sq m of land at Motera (including 4,860 sq m regularised in 1999). Revenue authorities found in 2023, using a DGPS measurement, that the trust was in occupation of a further 15,778 sq m of state land and initiated eviction under sections 61 and 79A of the Land Revenue Code, and on 4 April 2025 ordered it to vacate that area. A single judge dismissed the trust's writ petitions and, on 17 April 2026, a Division Bench of Chief Justice Sunita Agarwal and Justice D.N. Ray dismissed the Letters Patent Appeals, recording that the trust "is found to be a habitual offender" which had earlier encroached on about 51,101 sq m of Sabarmati riverbed from which it was evicted, that riverbed land cannot be regularised, and refusing a stay. On 27 April 2026 the Supreme Court ordered status quo, noting prima facie that notices did not appear to have been served on the trust, and called for the state's records. The land adjoins the Sardar Patel sports complex earmarked for the 2030 Commonwealth Games. This is a proceeding against the trust, not against Asaram personally.
    summary_hi: >
      आसाराम के मोटेरा आश्रम का संचालन करने वाले ट्रस्ट, संत श्री आसाराम आश्रम, को मोटेरा में लगभग 39,094 वर्ग मीटर भूमि आवंटित थी (जिसमें 1999 में नियमित की गई 4,860 वर्ग मीटर शामिल है)। राजस्व अधिकारियों ने 2023 में डीजीपीएस माप से पाया कि ट्रस्ट 15,778 वर्ग मीटर अतिरिक्त सरकारी भूमि पर क़ाबिज़ है और भू-राजस्व संहिता की धारा 61 और 79A के तहत बेदखली की कार्यवाही शुरू की; 4 अप्रैल 2025 को उसे वह क्षेत्र खाली करने का आदेश दिया गया। एकल न्यायाधीश ने ट्रस्ट की रिट याचिकाएँ खारिज कीं और 17 अप्रैल 2026 को मुख्य न्यायाधीश सुनीता अग्रवाल और न्यायमूर्ति डी.एन. रे की खंडपीठ ने लेटर्स पेटेंट अपीलें खारिज करते हुए दर्ज किया कि ट्रस्ट "आदतन अपराधी" पाया गया है, जिसने पहले साबरमती नदी-तल की लगभग 51,101 वर्ग मीटर भूमि पर अतिक्रमण किया था, और स्थगन से इनकार किया। 27 अप्रैल 2026 को सर्वोच्च न्यायालय ने यथास्थिति का आदेश दिया। यह कार्यवाही ट्रस्ट के विरुद्ध है, आसाराम के विरुद्ध व्यक्तिगत रूप से नहीं।
    source_ids: [ asaram-src-28, asaram-src-29, asaram-src-30, asaram-src-31 ]

claims:
  - id: asaram-claim-01
    case_id: asaram-jodhpur-pocso-2013
    statement_en: >
      On 25 April 2018 the Special Judge for POCSO Act cases, Jodhpur, in Sessions Case No. 116/2016 (152/2013), convicted Asaram under IPC 370(4), 342, 354A, 376(2)(f), 376D, 506, 509 and 120B, sections 23 and 26 of the Juvenile Justice Act 2000 and sections 5(f)/6, 5(g)/6 and 8 of the POCSO Act, and sentenced him to life imprisonment for the remainder of his natural life under IPC 376(2)(f) and 376D.
    statement_hi: >
      25 अप्रैल 2018 को जोधपुर के पॉक्सो मामलों के विशेष न्यायाधीश ने सत्र मामला संख्या 116/2016 (152/2013) में आसाराम को आईपीसी 370(4), 342, 354A, 376(2)(f), 376D, 506, 509 और 120B, किशोर न्याय अधिनियम 2000 की धारा 23 और 26 तथा पॉक्सो अधिनियम की धारा 5(f)/6, 5(g)/6 और 8 के तहत दोषी ठहराया और आईपीसी 376(2)(f) और 376D के तहत शेष प्राकृतिक जीवन तक कारावास की सज़ा सुनाई।
    tier: convicted
    date: 2018-04-25
    source_ids: [ asaram-src-02, asaram-src-01, asaram-src-20 ]
  - id: asaram-claim-02
    case_id: asaram-jodhpur-pocso-2013
    statement_en: >
      The Jodhpur case arose from a complaint that Asaram sexually assaulted a 16-year-old student of his gurukul, from Shahjahanpur in Uttar Pradesh, at his ashram at Manai near Jodhpur on 15 August 2013; he was arrested in Indore on 1 September 2013.
    statement_hi: >
      जोधपुर का मामला इस शिकायत से शुरू हुआ कि आसाराम ने 15 अगस्त 2013 को जोधपुर के पास मणाई स्थित अपने आश्रम में उत्तर प्रदेश के शाहजहाँपुर की अपने गुरुकुल की 16 वर्षीय छात्रा का यौन उत्पीड़न किया; उन्हें 1 सितंबर 2013 को इंदौर में गिरफ़्तार किया गया।
    tier: convicted
    date: 2013-08-15
    source_ids: [ asaram-src-01, asaram-src-21 ]
  - id: asaram-claim-03
    case_id: asaram-jodhpur-pocso-2013
    statement_en: >
      On 27 May 2026 a Division Bench of the Rajasthan High Court (Justices Arun Monga and Yogendra Kumar Purohit) upheld Asaram's conviction under IPC 370(4), 342, 509, 506, 354A and 376(2)(f), section 23 of the JJ Act and section 7/8 of the POCSO Act, additionally convicted him under IPC 376 and POCSO sections 3/4, and upheld the sentence of life imprisonment for the remainder of his natural life.
    statement_hi: >
      27 मई 2026 को राजस्थान उच्च न्यायालय की खंडपीठ (न्यायमूर्ति अरुण मोंगा और न्यायमूर्ति योगेंद्र कुमार पुरोहित) ने आईपीसी 370(4), 342, 509, 506, 354A और 376(2)(f), किशोर न्याय अधिनियम की धारा 23 और पॉक्सो अधिनियम की धारा 7/8 के तहत आसाराम की दोषसिद्धि बरकरार रखी, आईपीसी 376 और पॉक्सो धारा 3/4 के तहत अतिरिक्त दोषी ठहराया, और शेष प्राकृतिक जीवन तक आजीवन कारावास की सज़ा बरकरार रखी।
    tier: convicted
    date: 2026-05-27
    source_ids: [ asaram-src-01, asaram-src-17 ]
  - id: asaram-claim-04
    case_id: asaram-jodhpur-pocso-2013
    statement_en: >
      In the same judgment of 27 May 2026 the Rajasthan High Court set aside Asaram's convictions under IPC 120B, 34 and 376D and POCSO section 5(g)/6 and acquitted him of those offences, holding that the offences of criminal conspiracy and gang rape had not been proved; it also acquitted the co-accused Sanchita @ Shilpi and Sharad Chandra of all charges.
    statement_hi: >
      27 मई 2026 के उसी फ़ैसले में राजस्थान उच्च न्यायालय ने आईपीसी 120B, 34 और 376D तथा पॉक्सो धारा 5(g)/6 के तहत आसाराम की दोषसिद्धि निरस्त कर उन्हें इन अपराधों से बरी किया, यह मानते हुए कि आपराधिक षड्यंत्र और सामूहिक बलात्कार के अपराध सिद्ध नहीं हुए; सह-अभियुक्त संचिता उर्फ शिल्पी और शरद चंद्र को भी सभी आरोपों से बरी किया।
    tier: acquitted
    date: 2026-05-27
    source_ids: [ asaram-src-01, asaram-src-17 ]
  - id: asaram-claim-05
    case_id: asaram-jodhpur-pocso-2013
    statement_en: >
      The Rajasthan High Court on 27 May 2026 cancelled the interim bail on which Asaram was then at liberty, forfeited his bail bonds, directed him to surrender and ordered that a warrant for his arrest issue forthwith.
    statement_hi: >
      27 मई 2026 को राजस्थान उच्च न्यायालय ने वह अंतरिम ज़मानत रद्द की जिस पर आसाराम तब रिहा थे, उनके ज़मानत बंधपत्र ज़ब्त किए, आत्मसमर्पण का निर्देश दिया और तत्काल गिरफ़्तारी वारंट जारी करने का आदेश दिया।
    tier: convicted
    date: 2026-05-27
    source_ids: [ asaram-src-01, asaram-src-17 ]
  - id: asaram-claim-06
    case_id: asaram-gandhinagar-rape-2013
    statement_en: >
      On 31 January 2023 the Additional Sessions Judge, Gandhinagar, in Sessions Case No. 34 of 2014, convicted Asaram under IPC 376(2)(c), 377, 342, 354, 357 and 506 of repeatedly raping a woman disciple from Surat at his Motera ashram between 2001 and 2006, and sentenced him to life imprisonment.
    statement_hi: >
      31 जनवरी 2023 को गांधीनगर के अतिरिक्त सत्र न्यायाधीश ने सत्र मामला संख्या 34/2014 में आसाराम को 2001 से 2006 के बीच मोटेरा आश्रम में सूरत की एक महिला शिष्या से बार-बार बलात्कार के लिए आईपीसी 376(2)(c), 377, 342, 354, 357 और 506 के तहत दोषी ठहराया और आजीवन कारावास की सज़ा सुनाई।
    tier: convicted
    date: 2023-01-31
    source_ids: [ asaram-src-03, asaram-src-04, asaram-src-05, asaram-src-06 ]
  - id: asaram-claim-07
    case_id: asaram-gandhinagar-rape-2013
    statement_en: >
      Asaram's appeal against the Gandhinagar conviction, R/Criminal Appeal No. 607/2023, is pending in the Gujarat High Court; the High Court refused to suspend his sentence on 29 August 2024 (CRMA No. 1/2023), and the Supreme Court issued notice on his Special Leave Petition (Crl.) No. 15945/2024 on 22 November 2024.
    statement_hi: >
      गांधीनगर की दोषसिद्धि के विरुद्ध आसाराम की अपील, आर/क्रिमिनल अपील संख्या 607/2023, गुजरात उच्च न्यायालय में लंबित है; उच्च न्यायालय ने 29 अगस्त 2024 को सज़ा निलंबन से इनकार किया (सीआरएमए संख्या 1/2023), और सर्वोच्च न्यायालय ने 22 नवंबर 2024 को उनकी विशेष अनुमति याचिका (आपराधिक) संख्या 15945/2024 पर नोटिस जारी किया।
    tier: convicted
    date: 2024-11-22
    source_ids: [ asaram-src-03, asaram-src-04, asaram-src-14 ]
  - id: asaram-claim-08
    case_id: asaram-motera-deaths-inquiry-2008
    statement_en: >
      The Justice D.K. Trivedi Commission, appointed by the Gujarat government in July 2008 to inquire into the deaths of gurukul students Dipesh Vaghela (10) and Abhishek Vaghela (11), whose bodies were found on the Sabarmati riverbank on 5 July 2008, reported that there was no evidence that Asaram or Narayan Sai performed tantric rituals in the ashram, that death by drowning could not be ruled out, and that the school authorities were negligent; the report, submitted in 2013, was tabled in the Gujarat Assembly on 26 July 2019.
    statement_hi: >
      गुरुकुल छात्रों दीपेश वाघेला (10) और अभिषेक वाघेला (11) की मौत की जाँच के लिए, जिनके शव 5 जुलाई 2008 को साबरमती के किनारे मिले थे, गुजरात सरकार द्वारा जुलाई 2008 में नियुक्त न्यायमूर्ति डी.के. त्रिवेदी आयोग ने रिपोर्ट दी कि आश्रम में आसाराम या नारायण साईं द्वारा तांत्रिक क्रिया करने का कोई साक्ष्य नहीं है, डूबने से मृत्यु की संभावना को नकारा नहीं जा सकता, और विद्यालय प्रबंधन लापरवाह था; 2013 में सौंपी गई यह रिपोर्ट 26 जुलाई 2019 को गुजरात विधानसभा में रखी गई।
    tier: closed
    date: 2019-07-26
    source_ids: [ asaram-src-26, asaram-src-27 ]
  - id: asaram-claim-09
    statement_en: >
      The Wire reported in 2015 that witnesses in the criminal cases against Asaram had been attacked in four states, nine witnesses in all, three of whom died; Human Rights Watch in April 2018 likewise counted three witnesses killed and five others attacked during the trials.
    statement_hi: >
      द वायर ने 2015 में बताया कि आसाराम के विरुद्ध आपराधिक मामलों के गवाहों पर चार राज्यों में हमले हुए, कुल नौ गवाहों पर, जिनमें से तीन की मृत्यु हुई; ह्यूमन राइट्स वॉच ने भी अप्रैल 2018 में मुक़दमों के दौरान तीन गवाहों की हत्या और पाँच अन्य पर हमलों की गिनती की।
    tier: allegation
    date: 2015-08-02
    source_ids: [ asaram-src-23, asaram-src-38 ]
  - id: asaram-claim-10
    statement_en: >
      Amrut Prajapati, a former Ayurveda physician at Asaram's ashram and a witness in the Gujarat proceedings, was shot at his clinic in Rajkot on 23 May 2014 and died of his injuries on 10 June 2014.
    statement_hi: >
      आसाराम के आश्रम के पूर्व आयुर्वेद चिकित्सक और गुजरात की कार्यवाही में गवाह अमृत प्रजापति को 23 मई 2014 को राजकोट स्थित उनके क्लिनिक में गोली मारी गई और 10 जून 2014 को उनकी मृत्यु हो गई।
    tier: allegation
    date: 2014-05-23
    source_ids: [ asaram-src-24, asaram-src-21, asaram-src-25 ]
  - id: asaram-claim-11
    statement_en: >
      Akhil Gupta, Asaram's former cook and an eyewitness in the Ahmedabad rape case, was shot dead by two men on a motorcycle in Muzaffarnagar, Uttar Pradesh, on 11 January 2015.
    statement_hi: >
      आसाराम के पूर्व रसोइए और अहमदाबाद बलात्कार मामले के चश्मदीद गवाह अखिल गुप्ता की 11 जनवरी 2015 को उत्तर प्रदेश के मुज़फ़्फ़रनगर में मोटरसाइकिल सवार दो व्यक्तियों ने गोली मारकर हत्या कर दी।
    tier: allegation
    date: 2015-01-11
    source_ids: [ asaram-src-24, asaram-src-21, asaram-src-22 ]
  - id: asaram-claim-12
    statement_en: >
      Kripal Singh, an employee of the Jodhpur complainant's father and a witness in the Jodhpur case, was shot in Shahjahanpur district, Uttar Pradesh, in July 2015 by two men on a motorcycle who, according to police, warned him not to depose against Asaram; he died in hospital. Reports differ on the date of the attack (8, 10-11 or 12 July 2015).
    statement_hi: >
      जोधपुर की शिकायतकर्ता के पिता के कर्मचारी और जोधपुर मामले के गवाह कृपाल सिंह को जुलाई 2015 में उत्तर प्रदेश के शाहजहाँपुर ज़िले में मोटरसाइकिल सवार दो व्यक्तियों ने गोली मारी, जिन्होंने पुलिस के अनुसार उन्हें आसाराम के विरुद्ध गवाही न देने की चेतावनी दी; अस्पताल में उनकी मृत्यु हो गई। हमले की तारीख़ पर रिपोर्टें भिन्न हैं (8, 10-11 या 12 जुलाई 2015)।
    tier: allegation
    date: 2015-07
    source_ids: [ asaram-src-22, asaram-src-21, asaram-src-24 ]
  - id: asaram-claim-13
    statement_en: >
      Rahul Sachan, a former aide of Asaram and a witness in the Jodhpur case, was stabbed inside the Jodhpur district court complex on 13 February 2015; he later went missing in Lucknow on 25 November 2015.
    statement_hi: >
      आसाराम के पूर्व सहयोगी और जोधपुर मामले के गवाह राहुल सचान पर 13 फ़रवरी 2015 को जोधपुर ज़िला अदालत परिसर में चाकू से हमला हुआ; बाद में 25 नवंबर 2015 को वे लखनऊ में लापता हो गए।
    tier: allegation
    date: 2015-02-13
    source_ids: [ asaram-src-21, asaram-src-24, asaram-src-38 ]
  - id: asaram-claim-14
    case_id: asaram-ashram-motera-land-2025
    statement_en: >
      On 17 April 2026 the Gujarat High Court (Chief Justice Sunita Agarwal and Justice D.N. Ray) dismissed Letters Patent Appeals 107 and 108 of 2026 filed by Sant Shri Asharam Ashram against eviction proceedings over 15,778 sq m of state land occupied beyond its allotted 39,094 sq m at Motera, describing the trust as "a habitual offender" that had earlier encroached on about 51,101 sq m of Sabarmati riverbed, and refused to stay the judgment.
    statement_hi: >
      17 अप्रैल 2026 को गुजरात उच्च न्यायालय (मुख्य न्यायाधीश सुनीता अग्रवाल और न्यायमूर्ति डी.एन. रे) ने संत श्री आसाराम आश्रम द्वारा मोटेरा में आवंटित 39,094 वर्ग मीटर से अधिक 15,778 वर्ग मीटर सरकारी भूमि पर क़ब्ज़े के विरुद्ध बेदखली कार्यवाही को चुनौती देने वाली लेटर्स पेटेंट अपीलें 107 और 108/2026 खारिज कीं, ट्रस्ट को "आदतन अपराधी" बताया जिसने पहले साबरमती नदी-तल की लगभग 51,101 वर्ग मीटर भूमि पर अतिक्रमण किया था, और फ़ैसले पर स्थगन से इनकार किया।
    tier: regulatory_action
    date: 2026-04-17
    source_ids: [ asaram-src-28, asaram-src-29, asaram-src-31 ]
  - id: asaram-claim-15
    case_id: asaram-ashram-motera-land-2025
    statement_en: >
      On 27 April 2026 the Supreme Court (Justices Vikram Nath and Sandeep Mehta) ordered that status quo be maintained on the Motera ashram land until the next hearing, observing that prima facie notices did not appear to have been served on the trust, and asked the Gujarat government to file its records.
    statement_hi: >
      27 अप्रैल 2026 को सर्वोच्च न्यायालय (न्यायमूर्ति विक्रम नाथ और न्यायमूर्ति संदीप मेहता) ने अगली सुनवाई तक मोटेरा आश्रम की भूमि पर यथास्थिति बनाए रखने का आदेश दिया, यह देखते हुए कि प्रथम दृष्टया ट्रस्ट को नोटिस तामील नहीं हुए प्रतीत होते, और गुजरात सरकार से रिकॉर्ड दाख़िल करने को कहा।
    tier: regulatory_action
    date: 2026-04-27
    source_ids: [ asaram-src-30, asaram-src-28 ]

