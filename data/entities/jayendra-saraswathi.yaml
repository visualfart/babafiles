summary_en: >
  Jayendra Saraswathi, the 69th Shankaracharya of the Kanchi Kamakoti Peetham, was arrested on 11 November 2004 on charges of criminal conspiracy (IPC 120-B) and murder (IPC 302) in connection with the killing of A. Sankararaman, manager of the Sri Varadarajaperumal temple at Kanchipuram, on 3 September 2004. The Supreme Court of India granted him bail on 10 January 2005 and later transferred the trial from Tamil Nadu to Puducherry on the seers' plea that a fair trial was not possible in Tamil Nadu. On 27 November 2013 the Principal District and Sessions Court, Puducherry acquitted Jayendra Saraswathi, his successor Vijayendra Saraswathi, and 21 other accused, holding that the prosecution had not produced incriminating evidence and that a number of witnesses had turned hostile. No appeal against the acquittal has been located in press reporting. He died at Kanchipuram on 28 February 2018.
summary_hi: >
  कांची कामकोटि पीठम् के 69वें शंकराचार्य जयेन्द्र सरस्वती को 11 नवंबर 2004 को कांचीपुरम के श्री वरदराजपेरुमल मंदिर के प्रबंधक ए. संकरारमन की 3 सितंबर 2004 को हुई हत्या के सिलसिले में आपराधिक षड्यंत्र (आईपीसी 120-बी) और हत्या (आईपीसी 302) के आरोप में गिरफ्तार किया गया था। भारत के सर्वोच्च न्यायालय ने 10 जनवरी 2005 को उन्हें ज़मानत दी और बाद में शंकराचार्यों की इस दलील पर कि तमिलनाडु में निष्पक्ष सुनवाई संभव नहीं है, मुकदमे को तमिलनाडु से पुदुचेरी स्थानांतरित कर दिया। 27 नवंबर 2013 को पुदुचेरी के प्रधान ज़िला एवं सत्र न्यायालय ने जयेन्द्र सरस्वती, उनके उत्तराधिकारी विजयेन्द्र सरस्वती और 21 अन्य अभियुक्तों को यह कहते हुए बरी कर दिया कि अभियोजन पक्ष कोई अपराधकारी साक्ष्य प्रस्तुत नहीं कर सका और कई गवाह मुकर गए। समाचार रिपोर्टों में इस बरी होने के विरुद्ध कोई अपील दर्ज नहीं मिली। 28 फरवरी 2018 को कांचीपुरम में उनका निधन हो गया।
hi_reviewed: false

