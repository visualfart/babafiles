name_en: Jayendra Saraswathi
name_hi: जयेन्द्र सरस्वती
aliases: [ Kanchi Shankaracharya, 69th Shankaracharya of Kanchi Kamakoti Peetham ]
born: 1935-07-18
died: 2018-02-28
