cases:
  - id: jayendra-sankararaman-murder-2004
    title_en: State v. Jayendra Saraswathi and others (Sankararaman murder case)
    title_hi: राज्य बनाम जयेन्द्र सरस्वती एवं अन्य (संकरारमन हत्या मामला)
    jurisdiction_country: IN
    jurisdiction_region: Tamil Nadu; trial transferred to Puducherry
    court: Principal Sessions Court, Chengalpattu, Tamil Nadu (original); Supreme Court of India (bail and transfer orders); Principal District and Sessions Court, Puducherry (trial)
    case_number: Sessions Case No. 197/2005 (Chengalpattu), transferred and renumbered Sessions Case 94/2005 (Puducherry)
    filed_year: 2004
    case_type: criminal
    statutes: [ IPC 120-B, IPC 302 ]
    status: acquitted; no appeal located
    tier: acquitted
    verdict_date: 2013-11-27
    sentence_or_remedy: Acquitted, along with 21 co-accused
    appeal_status: No appeal against the acquittal has been located in press reporting.
    summary_en: >
      A. Sankararaman, manager of the Sri Varadarajaperumal temple at Kanchipuram and a former close associate of the Kanchi Mutt who had accused Jayendra Saraswathi of financial irregularities, was murdered at the temple on 3 September 2004. Jayendra Saraswathi was arrested on 11 November 2004 on the allegation that he conspired with co-accused to have Sankararaman killed; the Tamil Nadu police SIT filed its final report (chargesheet) on 21 January 2005 under IPC 120-B and 302, among other counts, naming 24 accused including Jayendra Saraswathi's successor Vijayendra Saraswathi. After the Madras High Court twice refused bail, the Supreme Court granted Jayendra Saraswathi bail on 10 January 2005, restraining him from the Mutt premises until the chargesheet was filed. The Supreme Court subsequently transferred the trial from the Principal Sessions Court, Chengalpattu, to the Principal District and Sessions Court, Puducherry, on the accused's plea that conditions in Tamil Nadu would not permit a fair trial; the case was renumbered Sessions Case 94/2005. Trial proceeded through 2009-2013, with prosecution witnesses turning hostile. On 27 November 2013 Principal District and Sessions Judge C.S. Murugan acquitted Jayendra Saraswathi, Vijayendra Saraswathi and 21 other accused (one of the original 24, Kathiravan, having been killed earlier in 2013), holding that no incriminating evidence was available against them.
    summary_hi: >
      कांचीपुरम के श्री वरदराजपेरुमल मंदिर के प्रबंधक और कांची मठ के पूर्व निकट सहयोगी ए. संकरारमन, जिन्होंने जयेन्द्र सरस्वती पर वित्तीय अनियमितताओं के आरोप लगाए थे, की 3 सितंबर 2004 को मंदिर में हत्या कर दी गई। जयेन्द्र सरस्वती को 11 नवंबर 2004 को इस आरोप में गिरफ्तार किया गया कि उन्होंने सह-अभियुक्तों के साथ मिलकर संकरारमन की हत्या की साज़िश रची; तमिलनाडु पुलिस एसआईटी ने 21 जनवरी 2005 को आईपीसी 120-बी और 302 सहित अन्य धाराओं में अंतिम रिपोर्ट (आरोप-पत्र) दाखिल की, जिसमें जयेन्द्र सरस्वती के उत्तराधिकारी विजयेन्द्र सरस्वती सहित 24 अभियुक्त नामित थे। मद्रास उच्च न्यायालय द्वारा दो बार ज़मानत अस्वीकार किए जाने के बाद, सर्वोच्च न्यायालय ने 10 जनवरी 2005 को जयेन्द्र सरस्वती को ज़मानत दी, आरोप-पत्र दाखिल होने तक उन्हें मठ परिसर में जाने से रोका। इसके बाद सर्वोच्च न्यायालय ने अभियुक्तों की इस दलील पर कि तमिलनाडु में निष्पक्ष सुनवाई संभव नहीं होगी, मुकदमे को प्रधान सत्र न्यायालय, चेंगलपट्टु से पुदुचेरी के प्रधान ज़िला एवं सत्र न्यायालय स्थानांतरित कर दिया; मामला सत्र मामला 94/2005 के रूप में पुनः क्रमांकित हुआ। 2009 से 2013 तक चले मुकदमे में कई अभियोजन गवाह मुकर गए। 27 नवंबर 2013 को प्रधान ज़िला एवं सत्र न्यायाधीश सी.एस. मुरुगन ने जयेन्द्र सरस्वती, विजयेन्द्र सरस्वती और 21 अन्य अभियुक्तों को (मूल 24 में से एक, कथिरवन, की 2013 की शुरुआत में हत्या हो चुकी थी) यह कहते हुए बरी किया कि उनके विरुद्ध कोई अपराधकारी साक्ष्य उपलब्ध नहीं है।
    source_ids: [ jayendra-src-01, jayendra-src-02, jayendra-src-03, jayendra-src-04, jayendra-src-05 ]

