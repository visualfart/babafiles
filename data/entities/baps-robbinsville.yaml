response_from_subject:
  text_en: >-
    On 11 May 2021 a BAPS spokesperson, Matthew Frankel, said the organisation had been "first
    made aware of the accusations this morning", was "taking them very seriously" and was
    "thoroughly reviewing the issues raised". CNN reported that a BAPS spokesperson, Lenin Joshi,
    told The New York Times: "We are naturally shaken by this turn of events and are sure that
    once the full facts come out, we will be able to provide answers and show that these
    accusations and allegations are without merit"; Kanu Patel, BAPS's chief executive and a named
    defendant, disputed the wage allegations. In November 2021 a lawyer for the organisation told
    the Associated Press that "US Government officials have authorised the use of R-1 visas for
    stone artisans for 20 years, and federal, state, and local government agencies have regularly
    visited and inspected all of the construction projects on which those artisans volunteered".
    The defendants have moved to dismiss the second amended complaint and maintain that the
    artisans were volunteers performing religious service.
  text_hi: >-
    11 मई 2021 को बीएपीएस के प्रवक्ता मैथ्यू फ्रैंकल ने कहा कि संगठन को "आरोपों की जानकारी आज सुबह
    ही मिली", वह उन्हें "बहुत गंभीरता से ले रहा है" और "उठाए गए मुद्दों की गहन समीक्षा कर रहा है"।
    सीएनएन ने बताया कि बीएपीएस के प्रवक्ता लेनिन जोशी ने द न्यूयॉर्क टाइम्स से कहा: "हम इस घटनाक्रम
    से स्वाभाविक रूप से हिल गए हैं और हमें विश्वास है कि पूरे तथ्य सामने आने पर हम उत्तर दे सकेंगे
    और दिखा सकेंगे कि ये आरोप निराधार हैं"; बीएपीएस के मुख्य कार्यकारी और नामित प्रतिवादी कनु पटेल ने
    वेतन संबंधी आरोपों को अस्वीकार किया। नवंबर 2021 में संगठन के एक वकील ने एसोसिएटेड प्रेस से कहा कि
    "अमेरिकी सरकारी अधिकारियों ने 20 वर्षों से पत्थर कारीगरों के लिए आर-1 वीज़ा के उपयोग की अनुमति दी
    है, और संघीय, राज्य तथा स्थानीय सरकारी एजेंसियों ने उन सभी निर्माण परियोजनाओं का नियमित दौरा और
    निरीक्षण किया है जिनमें उन कारीगरों ने स्वेच्छा से सेवा दी"। प्रतिवादियों ने दूसरी संशोधित शिकायत
    खारिज करने की अर्जी दी है और उनका कहना है कि कारीगर धार्मिक सेवा करने वाले स्वयंसेवक थे।
  source_id: baps-src-05

