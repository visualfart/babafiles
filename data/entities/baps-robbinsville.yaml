summary_en: >-
  BAPS Swaminarayan Sanstha built and operates the BAPS Swaminarayan Akshardham complex at
  Robbinsville, New Jersey. On 11 May 2021 six Indian nationals brought a collective and class
  action in the United States District Court for the District of New Jersey, Kumar v.
  Bochasanwasi Shri Akshar Purushottam Swaminarayan Sanstha, Inc., 3:21-cv-11048, alleging that
  they and more than 200 other workers were brought from India on R-1 religious-worker visas,
  made to do stonework and construction at the temple for about $1.20 an hour, and prevented
  from leaving, in violation of the Trafficking Victims Protection Act, the Fair Labor Standards
  Act and New Jersey wage laws. The allegations have not been tried or proved. On the same day
  federal agents carried out a search at the site; on 23 November 2021 the court found there was
  an ongoing federal criminal investigation and stayed the civil case under the TVPA's mandatory
  stay provision. Twelve of the twenty-one named plaintiffs voluntarily dismissed their claims in
  October 2023. On 18 September 2025 counsel for BAPS told the court that the Department of
  Justice had closed its investigation of the defendants; the court lifted the stay on 28 October
  2025. Nine plaintiffs are pursuing the case, and motions to dismiss the second amended complaint
  were fully briefed and pending as of September 2026. BAPS denies the allegations.
summary_hi: >-
  बीएपीएस स्वामीनारायण संस्था ने रॉबिन्सविल, न्यू जर्सी में बीएपीएस स्वामीनारायण अक्षरधाम परिसर
  बनाया और उसका संचालन करती है। 11 मई 2021 को छह भारतीय नागरिकों ने न्यू जर्सी जिले के अमेरिकी
  जिला न्यायालय में सामूहिक एवं वर्ग वाद — कुमार बनाम बोचासणवासी श्री अक्षर पुरुषोत्तम स्वामीनारायण
  संस्था इंक., 3:21-cv-11048 — दायर किया, जिसमें कहा गया कि उन्हें और 200 से अधिक अन्य श्रमिकों को
  आर-1 धार्मिक कर्मी वीज़ा पर भारत से लाया गया, मंदिर में पत्थर और निर्माण का काम लगभग 1.20 डॉलर
  प्रति घंटे पर कराया गया और परिसर छोड़ने से रोका गया, जो ट्रैफिकिंग विक्टिम्स प्रोटेक्शन एक्ट,
  फेयर लेबर स्टैंडर्ड्स एक्ट और न्यू जर्सी वेतन कानूनों का उल्लंघन है। इन आरोपों पर अभी न सुनवाई
  पूरी हुई है और न वे सिद्ध हुए हैं। उसी दिन संघीय एजेंटों ने परिसर में तलाशी ली; 23 नवंबर 2021 को
  न्यायालय ने पाया कि एक संघीय आपराधिक जांच चल रही है और टीवीपीए के अनिवार्य स्थगन प्रावधान के तहत
  दीवानी मुकदमा स्थगित कर दिया। इक्कीस नामित वादियों में से बारह ने अक्टूबर 2023 में अपने दावे
  स्वेच्छा से वापस ले लिए। 18 सितंबर 2025 को बीएपीएस के वकील ने न्यायालय को बताया कि न्याय विभाग ने
  प्रतिवादियों की जांच बंद कर दी है; न्यायालय ने 28 अक्टूबर 2025 को स्थगन हटा दिया। नौ वादी मुकदमा
  जारी रखे हुए हैं, और सितंबर 2026 तक दूसरी संशोधित शिकायत को खारिज करने की अर्जियाँ लंबित थीं।
  बीएपीएस आरोपों से इनकार करती है।
