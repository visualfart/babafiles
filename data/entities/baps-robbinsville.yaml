cases:
  - id: baps-njd-kumar-forced-labour-2021
    title_en: Kumar v. Bochasanwasi Shri Akshar Purushottam Swaminarayan Sanstha, Inc. (D.N.J.)
    title_hi: कुमार बनाम बोचासणवासी श्री अक्षर पुरुषोत्तम स्वामीनारायण संस्था इंक. (डी.एन.जे.)
    jurisdiction_country: US
    jurisdiction_region: New Jersey
    court: United States District Court for the District of New Jersey (Trenton)
    case_number: 3:21-cv-11048 (GC)(TJB)
    filed_year: 2021
    case_type: civil
    statutes:
      - 18 U.S.C. 1595 (TVPA civil remedy)
      - 18 U.S.C. 1589
      - 18 U.S.C. 1590
      - 18 U.S.C. 1592(a)
      - 18 U.S.C. 1594(a)
      - 18 U.S.C. 1594(b)
      - 18 U.S.C. 1597(a)
      - 29 U.S.C. 201 et seq. (FLSA)
      - N.J.S.A. 34:11-56a et seq.
      - N.J.S.A. 34:11-4.4 et seq.
    status: >-
      Pending. Stayed 23 November 2021 to 28 October 2025 under the TVPA's mandatory stay
      provision; twelve of twenty-one named plaintiffs voluntarily dismissed their claims in
      October 2023; motions to dismiss the second amended complaint were briefed and pending
      as of 4 September 2026. No allegation has been adjudicated.
    tier: allegation
    verdict_date:
    sentence_or_remedy:
    appeal_status:
    summary_en: >-
      A collective and class action filed on 11 May 2021 by six Indian nationals, later expanded to
      twenty-one named plaintiffs, against BAPS Swaminarayan Sanstha's US corporation, several BAPS
      site companies including BAPS Robbinsville LLC and BAPS Mercer LLC, the BAPS public trust in
      India, and individual defendants. The complaint alleges that the plaintiffs and more than 200
      other Indian nationals were brought to New Jersey on R-1 religious-worker visas, described to
      the US government as religious volunteers, and instead did stonework and construction at the
      Robbinsville temple for about 87 hours a week for roughly $450 a month, with passports taken
      on arrival and movement outside a fenced compound restricted. It pleads six causes of action
      under the Trafficking Victims Protection Act, the Fair Labor Standards Act, two New Jersey
      wage statutes, unjust enrichment and quantum meruit. The defendants deny the allegations and
      have moved to dismiss; nothing in the case has been decided on the merits.
    summary_hi: >-
      11 मई 2021 को छह भारतीय नागरिकों द्वारा दायर सामूहिक एवं वर्ग वाद, जिसमें बाद में नामित वादियों
      की संख्या इक्कीस हो गई। प्रतिवादियों में बीएपीएस स्वामीनारायण संस्था का अमेरिकी निगम, बीएपीएस
      रॉबिन्सविल एलएलसी और बीएपीएस मर्सर एलएलसी सहित कई बीएपीएस कंपनियाँ, भारत का बीएपीएस सार्वजनिक
      न्यास तथा कुछ व्यक्ति शामिल हैं। शिकायत में कहा गया है कि वादियों और 200 से अधिक अन्य भारतीय
      नागरिकों को आर-1 धार्मिक कर्मी वीज़ा पर न्यू जर्सी लाया गया और अमेरिकी सरकार को उन्हें धार्मिक
      स्वयंसेवक बताया गया, जबकि उन्होंने रॉबिन्सविल मंदिर में सप्ताह में लगभग 87 घंटे पत्थर और निर्माण
      का काम लगभग 450 डॉलर मासिक पर किया, आगमन पर उनके पासपोर्ट ले लिए गए और घिरे परिसर से बाहर
      आवाजाही सीमित की गई। इसमें टीवीपीए, एफएलएसए, न्यू जर्सी के दो वेतन कानूनों, अन्यायपूर्ण संवर्धन
      और क्वांटम मेरुइट के तहत छह वाद-कारण बताए गए हैं। प्रतिवादी आरोपों से इनकार करते हैं और खारिज
      करने की अर्जी दी है; मामले में गुण-दोष पर कुछ भी तय नहीं हुआ है।
    source_ids: [baps-src-01, baps-src-02]
  - id: baps-nj-federal-criminal-investigation-2021
    title_en: Federal criminal investigation of BAPS and the Robbinsville defendants (D.N.J.)
    title_hi: बीएपीएस और रॉबिन्सविल प्रतिवादियों की संघीय आपराधिक जांच (डी.एन.जे.)
    jurisdiction_country: US
    jurisdiction_region: New Jersey
    court: Recorded in the United States District Court for the District of New Jersey, No. 3:21-cv-11048
    case_number:
    filed_year: 2021
    case_type: inquiry
    statutes:
      - 18 U.S.C. 1595(b) (mandatory stay pending criminal action)
    status: >-
      Closed. Counsel for the BAPS defendants informed the court on 18 September 2025 that the
      Department of Justice had closed its investigation of the defendants; the court lifted the
      stay on 28 October 2025. No charge against BAPS or any defendant is on the record fetched.
    tier: closed
    verdict_date: 2025-09-18
    sentence_or_remedy:
    appeal_status:
    summary_en: >-
      On 11 May 2021 the Department of Justice and other federal investigative agencies carried out
      a search at the BAPS mandir in Robbinsville. On 23 November 2021 Judge Anne E. Thompson found
      that there was an ongoing criminal action triggering the mandatory stay provision of the
      Trafficking Victims Protection Act and stayed the civil suit as to all defendants and all
      claims. The parties reported to the court every few months from 2023 to 2025 that the
      investigation remained open. On 18 September 2025 counsel for the BAPS defendants told the
      court that government attorneys had advised on 15 and 16 September 2025 that the Department of
      Justice had closed its investigation of BAPS and the other named defendants. On 28 October 2025
      Magistrate Judge Tonianne J. Bongiovanni reopened the matter and lifted the stay.
    summary_hi: >-
      11 मई 2021 को न्याय विभाग और अन्य संघीय जांच एजेंसियों ने रॉबिन्सविल के बीएपीएस मंदिर में तलाशी
      ली। 23 नवंबर 2021 को न्यायाधीश ऐन ई. थॉम्पसन ने पाया कि एक आपराधिक कार्यवाही चल रही है जो
      ट्रैफिकिंग विक्टिम्स प्रोटेक्शन एक्ट के अनिवार्य स्थगन प्रावधान को लागू करती है, और सभी
      प्रतिवादियों तथा सभी दावों पर दीवानी मुकदमा स्थगित कर दिया। 2023 से 2025 तक पक्षकार हर कुछ माह
      में न्यायालय को बताते रहे कि जांच जारी है। 18 सितंबर 2025 को बीएपीएस प्रतिवादियों के वकील ने
      न्यायालय को बताया कि सरकारी अधिवक्ताओं ने 15 और 16 सितंबर 2025 को सूचित किया कि न्याय विभाग ने
      बीएपीएस तथा अन्य नामित प्रतिवादियों की जांच बंद कर दी है। 28 अक्टूबर 2025 को मजिस्ट्रेट
      न्यायाधीश टोनियन जे. बोंजियोवानी ने मामला पुनः खोलकर स्थगन हटा दिया।
    source_ids: [baps-src-01, baps-src-04, baps-src-05, baps-src-09]

claims:
  - id: baps-claim-01
    case_id: baps-njd-kumar-forced-labour-2021
    statement_en: >-
      On 11 May 2021 six Indian nationals filed a collective and class action complaint against
      BAPS Swaminarayan Sanstha's US corporation and related entities in the United States District
      Court for the District of New Jersey, docketed as Kumar v. Bochasanwasi Shri Akshar
      Purushottam Swaminarayan Sanstha, Inc., No. 3:21-cv-11048.
    statement_hi: >-
      11 मई 2021 को छह भारतीय नागरिकों ने न्यू जर्सी जिले के अमेरिकी जिला न्यायालय में बीएपीएस
      स्वामीनारायण संस्था के अमेरिकी निगम और संबंधित संस्थाओं के विरुद्ध सामूहिक एवं वर्ग वाद की
      शिकायत दायर की, जो कुमार बनाम बोचासणवासी श्री अक्षर पुरुषोत्तम स्वामीनारायण संस्था इंक.,
      संख्या 3:21-cv-11048 के रूप में दर्ज हुई।
    tier: allegation
    date: 2021-05-11
    source_ids: [baps-src-01, baps-src-02]
  - id: baps-claim-02
    case_id: baps-njd-kumar-forced-labour-2021
    statement_en: >-
      The complaint alleges that the plaintiffs and more than 200 other Indian nationals were
      recruited in India, brought to New Jersey on R-1 religious-worker visas presented to the US
      government as religious volunteers, and made to perform stonework and construction at the
      Robbinsville temple for more than 87 hours a week for about $450 a month, roughly $1.20 an hour.
    statement_hi: >-
      शिकायत में कहा गया है कि वादियों तथा 200 से अधिक अन्य भारतीय नागरिकों की भारत में भर्ती की गई,
      उन्हें आर-1 धार्मिक कर्मी वीज़ा पर न्यू जर्सी लाया गया, जिन्हें अमेरिकी सरकार के समक्ष धार्मिक
      स्वयंसेवक बताया गया, और उनसे रॉबिन्सविल मंदिर में सप्ताह में 87 घंटे से अधिक पत्थर तथा निर्माण
      का काम लगभग 450 डॉलर मासिक, यानी करीब 1.20 डॉलर प्रति घंटे पर कराया गया।
    tier: allegation
    date: 2021-05-11
    source_ids: [baps-src-02]
  - id: baps-claim-03
    case_id: baps-njd-kumar-forced-labour-2021
    statement_en: >-
      The complaint pleads claims under the Trafficking Victims Protection Act's civil remedy,
      18 U.S.C. 1595, alleging violations of 18 U.S.C. 1589, 1590, 1592(a), 1594(a), 1594(b) and
      1597(a), together
      with claims under the Fair Labor Standards Act, the New Jersey Wage and Hour Law, the New
      Jersey Wage Payment Law, unjust enrichment and quantum meruit.
    statement_hi: >-
      शिकायत में ट्रैफिकिंग विक्टिम्स प्रोटेक्शन एक्ट के दीवानी उपचार, 18 यू.एस.सी. 1595 के तहत दावे
      किए गए हैं, जिनमें 18 यू.एस.सी. 1589, 1590, 1592(क), 1594(क), 1594(ख) और 1597(क) के उल्लंघन का आरोप है, साथ ही
      फेयर लेबर स्टैंडर्ड्स एक्ट, न्यू जर्सी वेतन एवं घंटा कानून, न्यू जर्सी वेतन भुगतान कानून,
      अन्यायपूर्ण संवर्धन और क्वांटम मेरुइट के तहत दावे शामिल हैं।
    tier: allegation
    date: 2021-05-11
    source_ids: [baps-src-02]
  - id: baps-claim-09
    case_id: baps-nj-federal-criminal-investigation-2021
    statement_en: >-
      On 11 May 2021 federal agents were present at the BAPS Shri Swaminarayan Mandir in
      Robbinsville; Doreen Holder, a spokesperson for the FBI's Newark field office, confirmed the
      agents' presence and said only that the FBI was on scene "on court-authorized law enforcement
      activity", and Homeland Security Investigations declined to comment.
    statement_hi: >-
      11 मई 2021 को रॉबिन्सविल स्थित बीएपीएस श्री स्वामीनारायण मंदिर में संघीय एजेंट मौजूद थे;
      एफबीआई के नेवार्क फील्ड कार्यालय की प्रवक्ता डोरीन होल्डर ने एजेंटों की उपस्थिति की पुष्टि की
      और केवल इतना कहा कि एफबीआई "न्यायालय द्वारा अधिकृत विधि प्रवर्तन कार्रवाई" पर मौके पर थी, तथा
      होमलैंड सिक्योरिटी इन्वेस्टिगेशन्स ने टिप्पणी करने से इनकार किया।
    tier: closed
    date: 2021-05-11
    source_ids: [baps-src-04, baps-src-05, baps-src-06, baps-src-07]
  - id: baps-claim-04
    case_id: baps-nj-federal-criminal-investigation-2021
    statement_en: >-
      On 23 November 2021 District Judge Anne E. Thompson stayed the civil case as to all defendants
      and all claims, having found that there was an ongoing criminal action that triggered the
      mandatory stay provision of the Trafficking Victims Protection Act, 18 U.S.C. 1595(b).
    statement_hi: >-
      23 नवंबर 2021 को जिला न्यायाधीश ऐन ई. थॉम्पसन ने यह पाते हुए कि एक आपराधिक कार्यवाही चल रही है
      जो ट्रैफिकिंग विक्टिम्स प्रोटेक्शन एक्ट, 18 यू.एस.सी. 1595(ख) के अनिवार्य स्थगन प्रावधान को
      लागू करती है, सभी प्रतिवादियों और सभी दावों पर दीवानी मुकदमा स्थगित कर दिया।
    tier: closed
    date: 2021-11-23
    source_ids: [baps-src-01]
  - id: baps-claim-05
    case_id: baps-njd-kumar-forced-labour-2021
    statement_en: >-
      On 2 October 2023 twelve of the twenty-one named plaintiffs filed a notice of voluntary
      dismissal of their claims under Rule 41(a)(1)(A)(i), and Judge Georgette Castner entered an
      order of voluntary dismissal on 10 October 2023; nine named plaintiffs continued the case.
    statement_hi: >-
      2 अक्टूबर 2023 को इक्कीस नामित वादियों में से बारह ने नियम 41(क)(1)(क)(i) के तहत अपने दावे
      स्वेच्छा से वापस लेने की सूचना दाखिल की, और न्यायाधीश जॉर्जेट कास्टनर ने 10 अक्टूबर 2023 को
      स्वैच्छिक खारिजी का आदेश पारित किया; नौ नामित वादियों ने मुकदमा जारी रखा।
    tier: closed
    date: 2023-10-10
    source_ids: [baps-src-01]
  - id: baps-claim-06
    case_id: baps-nj-federal-criminal-investigation-2021
    statement_en: >-
      On 18 September 2025 counsel for the BAPS defendants informed the District of New Jersey that
      government attorneys had advised on 15 and 16 September 2025 that the Department of Justice
      had closed its investigation of BAPS and the other entities and individuals named as
      defendants in the lawsuit.
    statement_hi: >-
      18 सितंबर 2025 को बीएपीएस प्रतिवादियों के वकील ने न्यू जर्सी जिला न्यायालय को सूचित किया कि
      सरकारी अधिवक्ताओं ने 15 और 16 सितंबर 2025 को बताया कि न्याय विभाग ने बीएपीएस तथा मुकदमे में
      नामित अन्य संस्थाओं और व्यक्तियों की जांच बंद कर दी है।
    tier: closed
    date: 2025-09-18
    source_ids: [baps-src-04, baps-src-09]
  - id: baps-claim-07
    case_id: baps-nj-federal-criminal-investigation-2021
    statement_en: >-
      On 28 October 2025 Magistrate Judge Tonianne J. Bongiovanni ordered the case reopened and
      lifted the stay that had been in force since 23 November 2021, dismissing the plaintiffs'
      motion to lift the stay or sever their wage and hour claims as moot.
    statement_hi: >-
      28 अक्टूबर 2025 को मजिस्ट्रेट न्यायाधीश टोनियन जे. बोंजियोवानी ने मामला पुनः खोलने का आदेश दिया
      और 23 नवंबर 2021 से लागू स्थगन हटा दिया, तथा स्थगन हटाने या वेतन एवं घंटा दावों को अलग करने की
      वादियों की अर्जी को निष्प्रभावी मानकर खारिज कर दिया।
    tier: closed
    date: 2025-10-28
    source_ids: [baps-src-01]
  - id: baps-claim-08
    case_id: baps-njd-kumar-forced-labour-2021
    statement_en: >-
      As of the docket entry of 4 September 2026 the case is pending before District Judge Georgette
      Castner, with motions to dismiss the second amended complaint filed by the domestic BAPS
      defendants, by the BAPS public trust in India and by Harshad Chavda fully briefed and awaiting
      decision.
    statement_hi: >-
      4 सितंबर 2026 की डॉकेट प्रविष्टि तक मामला जिला न्यायाधीश जॉर्जेट कास्टनर के समक्ष लंबित है, और
      घरेलू बीएपीएस प्रतिवादियों, भारत के बीएपीएस सार्वजनिक न्यास तथा हर्षद चावड़ा द्वारा दूसरी
      संशोधित शिकायत को खारिज करने की अर्जियों पर पूरी बहस दाखिल हो चुकी है और निर्णय प्रतीक्षित है।
    tier: allegation
    date: 2026-09-04
    source_ids: [baps-src-01]

